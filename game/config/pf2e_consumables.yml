  # Item Level 2
  Antler Arrow:
    bulk: 0
    level: 2
    price: 700
    traits:
      - consumable
      - magical
    rules:
      - key: "Note"
        selector: "{item|id}-ranged-damage"
        outcome: ["success"]
        title: "Antler Arrow"
        text: "The target must succeed at a save or become stuck to the surface, taking the critical specialization effects of a bow"
      - key: "Note"
        selector: "{item|id}-ranged-damage"
        outcome: ["success"]
        title: "Critical Specialization"
        text: "If the target of the critical hit is adjacent to a surface, it gets stuck to that surface by the missile. The target is Immobilized and must spend an Interact action to attempt a check to pull the missile free; it can't move from its space until it succeeds. The creature doesn't become stuck if it is incorporeal, is liquid, or could otherwise escape without effort (such as by being large enough that the missile would not be an impediment.)"
      - key: "Note"
        selector: "{item|id}-ranged-damage"
        outcome: ["criticalSuccess"]
        title: "Antler Arrow"
        text: "The target must succeed at a save or become stuck to the surface, taking the critical specialization effects of a bow"
        predicate: [{"not": "critical-specialization"}]
      - key: "Note"
        selector: "{item|id}-ranged-damage"
        outcome: ["criticalSuccess"]
        title: "Critical Specialization"
        text: "If the target of the critical hit is adjacent to a surface, it gets stuck to that surface by the missile. The target is Immobilized and must spend an Interact action to attempt a check to pull the missile free; it can't move from its space until it succeeds. The creature doesn't become stuck if it is incorporeal, is liquid, or could otherwise escape without effort (such as by being large enough that the missile would not be an impediment.)"
        predicate: [{"not": "critical-specialization"}]
      - key: "Note"
        selector: "{item|id}-ranged-damage"
        outcome: ["criticalSuccess"]
        title: "Antler Arrow"
        text: "The DC of the Athletics check to pull the missile free increases to"
        predicate: ["critical-specialization"]
