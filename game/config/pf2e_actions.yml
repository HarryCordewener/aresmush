    traits: ["gunslinger"]
    description: "Your rapid or forceful words draw the enemy's attention away from your hands long enough to chamber another bullet. Interact to reload and then attempt a Deception check to Create a Diversion or an Intimidation check to demoralize."
  "Rage":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["barbarian", "concentrate", "emotion", "mental"]
    self_effect: "Effect: Rage"
    description: "Requirements You aren't Fatigued or raging.%rYou tap into your inner fury and begin raging. You gain a number of temporary Hit Points equal to your level plus your Constitution modifier. While you are raging:%rYou deal 2 additional damage on melee Strikes. This additional damage is halved if your weapon or unarmed attack is agile. You can't use actions with the concentrate trait unless they also have the rage trait. You can Seek while raging.%rRage lasts for 1 minute, until you fall Unconscious, or until the encounter ends, whichever comes first. You can't voluntarily stop raging. When you stop raging, you lose any remaining temporary Hit Points from Rage, and can't gain temporary Hit Points from using the Rage action again for 1 minute.%rEffect: Rage Temporary Hit Points Immunity"
  "Raise Menhir":
