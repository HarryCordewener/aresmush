    traits: ["monk", "stance"]
    self_effect: "Stance: Tiger Stance"
  "Timely Dodge":
    from: "action"
    for: "equipment"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You are targeted by a Strike%rEffect You dart aside, gaining a +1 circumstance bonus to AC, then Step after the Strike resolves."
  "Topple the Pillar of Heaven":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["transcendence"]
    description: "Your ikon extends to an impossible length, striking all in its way. You deal (max(6,floor(@actor.level / 2)))d8 untyped|options:area-damage damage to all creatures in a 60-foot line, with a Reflex save against your class DC. The damage type matches that of your weapon. At 14th level and every two levels thereafter, the damage increases by 1d8."
  "Touch and Go":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["gunslinger"]
    description: "Requirements You're wielding a combination weapon.%rYour body's shadows mask your hands' steel. You can Step toward an enemy, you can Interact to change your weapon between melee or ranged modes, and you then Interact to reload."
  "Toxic Skin":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["poison", "tripkee"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rTrigger A creature touches you, such as by Grappling you, successfully hitting you with an unarmed attack, or using a touch-range spell against you%rEffect You exude a deadly toxin. The triggering creature takes (ceil(@actor.level/2))d4 poison damage (Fortitude save using your class DC or spell DC, whichever is higher). At 3rd level and every 2 levels thereafter, the damage increases by 1d4."
  "Toxic Touch":
    from: "action"
    for: "heritage"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["poison"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rRequirements Your most recent action was to Tumble Through, and you successfully moved through an enemy's space%rEffect Make a melee unarmed Strike against the enemy whose space you moved through. On a hit, the target takes 1d6 persistent poison damage and is Sickened 1 (or takes 2d6 persistent poison and is Sickened 2 on a critical hit)."
  "Trace Rune":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "magical", "manipulate", "runesmith"]
    description: "1 or 2%rYour fingers dance, glowing light leaving behind the image of a rune. You apply one rune to an adjacent target matching the rune's Usage entry. You can have any number of runes traced at a time, but each rune remains only until the end of your next turn.%rIf you spend 2 actions to Trace a Rune, you draw the rune in the air, causing it to appear on a target within 30 feet."
  "Track":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "move"]
    check: {"slug": "track", "statistic": "survival", "options": ["action:track"], "notes": {"criticalSuccess": "You find the trail or continue to follow the one you're already following.", "success": "You find the trail or continue to follow the one you're already following.", "failure": "You lose the trail but can try again after a 1-hour delay.", "criticalFailure": "You lose the trail and can't try again for 24 hours."}}
    description: "You follow tracks, moving at up to half your travel Speed, using the Travel Speed rules. After a successful check to Track, you can continue following the tracks at half your Speed without attempting additional checks for up to 1 hour.%rIn some cases, you might Track in an encounter. In this case, Track is a single action and doesn't have the exploration trait, but you might need to roll more often because you're in a tense situation. The GM determines how often you must attempt this check.%rYou attempt your Survival check when you start Tracking, once every hour you continue tracking, and any time something significant changes in the trail. The GM determines the DCs for such checks, depending on the freshness of the trail, the weather, and the type of ground.%rSample Track Tasks Untrained the path of a large army following a road Trained relatively fresh tracks of a rampaging bear through the plains Expert a nimble panther's tracks through a jungle, tracks obscured by rainfall Master tracks obscured by winter snow, tracks of a mouse or smaller creature, tracks left on surfaces that can't hold prints like bare rock Legendary old tracks through a windy desert's sands, tracks…"
  "Transform Ammunition":
    from: "action"
    for: "equipment"
    type: "free"
    category: "offensive"
    traits: ["magical"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rEffect You transform a non-magical arrow or bolt on your person into a piece of magical ammunition of one type you chose for the Magic Ammunition feat. You must shoot the ammunition before the end of your turn or the magic dissipates. If the ammunition has an Activate entry, you still need to spend the required actions to activate the ammunition before shooting it.%rYou can choose a type of magical ammunition that is typically not available to the type of ammunition you're using—for example, you can use Climbing Bolt on an arrow, even though that magical ammunition is normally only found on bolts."
  "Travel":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["move"]
    description: "You progress toward moving into an adjacent hex. In open terrain, like a plain, using 1 Travel activity allows you to move from one hex to an adjacent hex. Traversing a hex with difficult terrain (such as a typical forest or desert) requires 2 Travel activities, and hexes of greater difficult terrain (such as a steep mountain or typical swamp) require 3 Travel activities to traverse. Traveling along a road uses a terrain type one step better than the surrounding terrain. For example, if you are traveling on a road over a mountain pass, the terrain is difficult terrain instead of greater difficult terrain.%rThe Travel activity assumes you are walking overland. If you are flying or traveling on water, most hexes are open terrain, though there are exceptions. Flying into storms or high winds count as difficult or greater difficult terrain. Traveling down a river is open terrain, but traveling upriver is difficult or greater difficult terrain."
  "Treat Disease":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "manipulate"]
    check: {"slug": "treat-disease", "statistic": "medicine", "options": ["action:treat-disease"], "notes": {"criticalSuccess": "You grant the creature a +4 circumstance bonus to its next saving throw against the disease.%rEffect: Treat Disease", "success": "You grant the creature a +2 circumstance bonus to its next saving throw against the disease.%rEffect: Treat Disease", "criticalFailure": "Your efforts cause the creature to take a −2 circumstance penalty to its next save against the disease.%rEffect: Treat Disease"}}
    description: "Requirements You're wearing or holding a Healer's Toolkit%rYou spend at least 8 hours caring for a diseased creature. Attempt a Medicine check against the disease's DC. After you attempt to Treat a Disease for a creature, you can't try again until after that creature's next save against the disease.%rCritical Success You grant the creature a +4 circumstance bonus to its next saving throw against the disease.%rSuccess You grant the creature a +2 circumstance bonus to its next saving throw against the disease.%rCritical Failure Your efforts cause the creature to take a −2 circumstance penalty to its next save against the disease.%rEffect: Treat Disease"
  "Treat Poison":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "treat-poison", "statistic": "medicine", "options": ["action:treat-poison"], "notes": {"criticalSuccess": "You grant the creature a +4 circumstance bonus to its next saving throw against the poison.%rEffect: Treat Poison", "success": "You grant the creature a +2 circumstance bonus to its next saving throw against the poison.%rEffect: Treat Poison", "criticalFailure": "Your efforts cause the creature to take a −2 circumstance penalty to its next save against the poison.%rEffect: Treat Poison"}}
    description: "Requirements You're wearing or holding a Healer's Toolkit%rYou treat a patient to prevent the spread of poison. Attempt a Medicine check against the poison's DC. After you attempt to Treat a Poison for a creature, you can't try again until after the next time that creature attempts a save against the poison.%rCritical Success You grant the creature a +4 circumstance bonus to its next saving throw against the poison.%rSuccess You grant the creature a +2 circumstance bonus to its next saving throw against the poison.%rCritical Failure Your efforts cause the creature to take a −2 circumstance penalty to its next save against the poison.%rEffect: Treat Poison"
  "Treat Wounds":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "healing", "manipulate"]
    check: {"slug": "treat-wounds", "statistic": "medicine", "options": ["action:treat-wounds"]}
    description: "Requirements You're wearing or holding a Healer's Toolkit.%rYou spend 10 minutes treating one injured living creature (targeting yourself, if you so choose). The target is then temporarily immune to Treat Wounds actions for 1 hour, but this interval overlaps with the time you spent treating (so a patient can be treated once per hour, not once per 70 minutes).%rThe Medicine check DC is usually 15, though the GM might adjust it based on the circumstances, such as treating a patient outside in a storm, or treating magically cursed wounds. If you're an expert in Medicine, you can instead attempt a DC 20 check to increase the Hit Points regained by 10; if you're a master of Medicine, you can instead attempt a DC 30 check to increase the Hit Points regained by 30; and if you're legendary, you can instead attempt a DC 40 check to increase the Hit Points regained by 50. The damage dealt on a critical failure remains the same.%rIf you succeed at your check, you can continue treating the target to grant additional healing. If you treat it for a total of 1 hour, double the Hit Points it regains from Treat Wounds.%rThe result of your Medicine check determines how many Hit Points the target…"
  "Trench Digging":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You're subjected to forced movement%rEffect You deploy your claw spikes to churn the earth asunder, creating difficult terrain in each square of ground you're moved through."
  "Trial by Skyfire":
    from: "feat"
    type: "action"
