    traits: ["exemplar", "fighter", "flourish"]
  "Living Fortification":
    from: "action"
    for: "class"
    type: "free"
    category: "offensive"
    traits: ["gunslinger"]
    self_effect: "Effect: Living Fortification"
    description: "Trigger You roll initiative.%rYou posture defensively with firearms or crossbows, acting like a walking tower. Interact to draw a firearm or crossbow. You then position that weapon defensively, as the parry trait, gaining a +1 circumstance bonus to AC until the end of your first turn, or a +2 circumstance bonus if the chosen weapon has the parry trait."
  "Long Jump":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["move"]
    check: {"slug": "long-jump", "statistic": "athletics", "options": ["action:long-jump", "action:stride", "action:leap"], "dc": 15, "notes": {"criticalSuccess": "You Leap up to a distance equal to your check result rounded down to the nearest 5 feet. You can't jump farther than your land Speed.", "success": "You Leap up to a distance equal to your check result rounded down to the nearest 5 feet. You can't jump farther than your land Speed.", "failure": "You make a normal horizontal Leap.", "criticalFailure": "You make a normal horizontal Leap, then fall and land Prone."}}
    description: "You Stride, then attempt a DC 15 Athletics check to make a long jump in the direction you were Striding. If you didn't Stride at least 10 feet, you automatically fail your check. The GM might increase or decrease this DC depending on the situation.%rSuccess You Leap up to a distance equal to your check result rounded down to the nearest 5 feet. You can't jump farther than your land Speed.%rFailure You make a normal horizontal Leap.%rCritical Failure You make a normal horizontal Leap, then fall and land Prone."
  "Long-Nosed Form":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["concentrate", "polymorph", "primal", "tengu"]
  "Long-Term Rest":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    description: "You can spend an entire day and night resting during downtime to recover Hit Points equal to your Constitution modifier (minimum 1) multiplied by twice your level."
  "Lucky Break":
    from: "action"
    for: "background"
    type: "free"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Trigger You attempt a skill check during Exploration or Downtime%rFrequency once per day%rEffect Draw a harrow card, then reroll the skill check. If you draw a card from the suit of Keys, add a +4 status bonus to the original roll and your reroll, then take the result you prefer as your actual result. If you drew any other card, you gain no bonus and must take the result of the rerolled skill check."
  "Lunge":
