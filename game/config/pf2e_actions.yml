  "Hide":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["secret"]
    check: {"slug": "hide", "statistic": "stealth", "options": ["action:hide"], "against": "perception", "notes": {"criticalSuccess": "If the creature could see you, you're now Hidden from it instead of observed. If you were hidden from or Undetected by the creature, you retain that condition.", "success": "If the creature could see you, you're now Hidden from it instead of observed. If you were hidden from or Undetected by the creature, you retain that condition."}}
    description: "You huddle behind cover or greater cover or deeper into concealment to become Hidden, rather than Observed. The GM rolls your Stealth check in secret and compares the result to the Perception DC of each creature you're observed by but that you have cover or greater cover against or are Concealed from. You get a +2 circumstance bonus to your check if you have standard cover (or +4 from greater cover).%rSuccess If the creature could see you, you're now Hidden from it instead of observed. If you were hidden from or Undetected by the creature, you retain that condition.%rIf you successfully become hidden to a creature but then cease to have cover or greater cover against it or be concealed from it, you become observed again. You cease being hidden if you do anything except Hide, Sneak, or Step. If you attempt to Strike a creature, the creature remains off-guard against that attack, and you then become observed. If you do anything else, you become observed just before you act unless the GM determines otherwise. The GM might allow you to perform a particularly unobtrusive action without being noticed, possibly requiring another Stealth check.%rIf a creature uses Seek to make you…"
  "High Jump":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["move"]
    check: {"slug": "high-jump", "statistic": "athletics", "options": ["action:high-jump", "action:stride", "action:leap"], "dc": 30, "notes": {"criticalSuccess": "You Leap up to 8 feet vertically and 10 feet horizontally.", "success": "You Leap up to 5 feet vertically and 5 feet horizontally.", "failure": "You Leap normally.", "criticalFailure": "You fall Prone in your space."}}
    description: "You Stride, then attempt a DC 30 Athletics check to jump vertically. If you didn't Stride at least 10 feet, you automatically fail. This DC might be increased or decreased due to the situation, as determined by the GM.%rCritical Success You Leap up to 8 feet vertically and 10 feet horizontally.%rSuccess You Leap up to 5 feet vertically and 5 feet horizontally.%rFailure You Leap normally.%rCritical Failure You fall Prone in your space."
  "Hone Claws":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["lizardfolk"]
    frequency: {"max": 1, "per": "PT1H"}
    self_effect: "Effect: Hone Claws"
  "Host Spirit":
    from: "action"
    for: "background"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You attempt one skill check to perform an exploration activity, even if it normally requires you to be trained to do so. You're trained in the skill just long enough to make that single check (to a maximum of 10 minutes).%rWhether or not the check succeeds, in the next 24 hours you must perform a minor favor to appease the spirit who aided you, determined by the GM (usually something sensation related, such as tasting a certain food, listening to a specific song, or smoking a pipe). You can't Host Spirit again until you've performed the favor. If you haven't completed it after 24 hours, you're Fatigued until the obligation is fulfilled."
  "Host of Wrath":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["arcane", "concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Spend 1 Mythic Point. The spirits of four runelords of wrath (Angothane, Xiren, Thybidos, and Alaznist) swirl around you for 1 minute. While the spirits remain, whenever you hit or critically hit with a Reactive Strike, the target takes an additional 5 spirit damage, or 10 spirit damage if the target of your Reactive Strike is Xanderghul, the Runelord of Pride."
  "Hunt Prey":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "ranger"]
    self_effect: "Effect: Hunt Prey"
    description: "You designate a single creature as your prey and focus your attacks against that creature. You must be able to see or hear the prey, or you must be tracking the prey during exploration.%rYou gain a +2 circumstance bonus to Perception checks when you Seek your prey and a +2 circumstance bonus to Survival checks when you Track your prey. You also ignore the penalty for making ranged attacks within your second range increment against the prey you're hunting.%rYou can have only one creature designated as your prey at a time. If you use Hunt Prey against a creature when you already have a creature designated, the prior creature loses the designation and the new prey gains the designation. Your designation lasts until your next daily preparations."
  "Hunt Runelord":
    from: "action"
    for: "background"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Hunt Runelord"
    description: "Frequency once per day%rEffect You designate one of the seven schools of Thassilonian magic—envy, gluttony, greed, lust, pride, sloth, or wrath—and focus your need for revenge against those who serve these ideals. You do not need to be able to see a creature that serves these ideals to make this designation. The designation lasts until your next daily preparations.%rYou gain a +2 circumstance bonus to Perception checks when you seek a creature that serves these ideals (including an actual runelord, a wizard who follows that school of Thassilonian magic, or any creature you know or suspect serves the interests of that school's particular sin—subject to GM's approval), and a +2 circumstance bonus to Intimidation checks made to demoralize such creatures. Your Strikes also deal 1d4 extra precision to these creatures when they're Frightened."
  "Hunt the Razer's Pawn":
    from: "action"
    for: "background"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    self_effect: "Effect: Hunt the Razer's Pawn"
    description: "Designate a single creature that you can see or hear, or whom you've spent a significant amount of time studying and reading about from afar (subject to the GM's approval), and who you know to be an agent of Treerazer. You gain a +2 circumstance bonus to Perception checks to Seek or Sense the Motive of this creature. This creature takes a –1 circumstance penalty to saving throws against spells or effects you create; this penalty increases to –2 against effects that have the holy trait.%rYou can have only one creature designated by Hunt the Razer's Pawn at a time. If you use this ability against a creature when you already have one designated, the prior creature loses the designation and the new creature gains the designation. This lasts until your next daily preparations."
  "Hunted Shot":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["flourish", "ranger"]
  "Hunter's Aim":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["concentrate", "ranger"]
  "Hustle":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "move"]
    description: "You strain yourself to move at double your travel speed. You can Hustle only for a number of minutes equal to your Constitution modifier × 10 (minimum 10 minutes). If you are in a group that is Hustling, use the lowest Constitution modifier among everyone to determine how fast the group can Hustle together."
  "I Defy You!":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["fortune", "mental"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Trigger You fail a save against a mental effect%rFrequency once per hour%rEffect You reroll the triggering save and must take the second result."
  "Identify Alchemy":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "secret"]
    check: {"slug": "identify-alchemy", "statistic": "crafting", "options": ["action:identify-alchemy"], "notes": {"criticalSuccess": "You identify the item and the means of activating it.", "success": "You identify the item and the means of activating it.", "failure": "You fail to identify the item but can try again.", "criticalFailure": "You misidentify the item as another item of the GM's choice."}}
    description: "Requirements You're holding or wearing an Alchemist's Toolkit.%rYou can identify the nature of an alchemical item with 10 minutes of testing using alchemist's toolkit. If your attempt is interrupted in any way, you must start over.%rSuccess You identify the item and the means of activating it.%rFailure You fail to identify the item but can try again.%rCritical Failure You misidentify the item as another item of the GM's choice."
  "Identify Magic":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "secret"]
    check: {"slug": "identify-magic", "statistic": ["arcana", "nature", "occultism", "religion"], "options": ["action:identify-magic"], "notes": {"criticalSuccess": "You learn all the attributes of the magic, including its name (for an effect), what it does, any means of activating it (for an item or location), and whether it is cursed.", "success": "For an item or location, you get a sense of what it does and learn any means of activating it. For an ongoing effect (such as a spell with a duration), you learn the effect's name and what it does. You can't try again in hopes of getting a critical success.", "failure": "You fail to identify the magic and can't try again for 1 day.", "criticalFailure": "You misidentify the magic as something else of the GM's choice."}}
    description: "Once you discover that an item, location, or ongoing effect is magical, you can spend 10 minutes to try to identify the particulars of its magic. If your attempt is interrupted, you must start over. The GM sets the DC for your check. Cursed magic or esoteric subjects usually have higher DCs or might even be impossible to identify using this activity alone. Heightening a spell doesn't increase the DC to identify it.%rCritical Success You learn all the attributes of the magic, including its name (for an effect), what it does, any means of activating it (for an item or location), and whether it is cursed.%rSuccess For an item or location, you get a sense of what it does and learn any means of activating it. For an ongoing effect (such as a spell with a duration), you learn the effect's name and what it does. You can't try again in hopes of getting a critical success.%rFailure You fail to identify the magic and can't try again for 1 day.%rCritical Failure You misidentify the magic as something else of the GM's choice."
  "Illimitable Finisher":
    from: "feat"
    type: "action"
