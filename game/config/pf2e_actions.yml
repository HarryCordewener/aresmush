    traits: ["fighter", "stance"]
    self_effect: "Stance: Lunging Stance"
  "Mage Hunter":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "rage"]
  "Magpie Snatch":
    from: "feat"
    type: "action"
    cost: 2
