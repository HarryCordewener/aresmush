  "Eldritch Shot":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: []
    description: "Requirements You are wielding a bow or a loaded crossbow%rEffect You Cast a Spell that takes 1 or 2 actions to cast and requires a spell attack roll. The effects of the spell do not occur immediately but are imbued into the bow you're wielding. Make a Strike with that bow. Your spell flies with the ammunition, using your attack roll result to determine the effects of both the Strike and the spell. This counts as two attacks for your multiple attack penalty, but you don't apply the penalty until after you've completed the Eldritch Shot. Combine the Strike and spell's damage for the purpose of resistances and weaknesses."
  "Elemental Blast":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack", "impulse", "kineticist", "primal"]
    description: "1 or 2%rWith a wave of your hand, you collect elemental matter from your aura and swing or hurl it. Choose one of your kinetic elements and a damage type listed for that element, then make a melee or ranged impulse attack against the AC of one creature. Add your Strength modifier to the damage roll for a melee Elemental Blast. If you make a 2-action Elemental Blast, you gain a status bonus to the damage roll equal to your Constitution modifier. The element determines the damage die, damage type, and range (for a ranged blast). A damage type other than a physical damage type adds its trait to the blast.%rAir 1d6 electricity or slashing, 60 feet Earth 1d8 bludgeoning or piercing, 30 feet Fire 1d6 fire, range 60 feet Metal 1d8 piercing or slashing, 30 feet Water 1d8 bludgeoning or cold, 30 feet Wood 1d8 bludgeoning or vitality, 30 feet%rCritical Success The target takes double damage.%rSuccess The target takes full damage.%rLevel (+4) The damage increases by one die."
  "Elemental Burst":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "eidolon"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rYour eidolon rips off a chunk of elemental matter from their own form and hurls it into a group of foes. Your eidolon loses a number of Hit Points equal to your level. All creatures in a 20-foot burst within 60 feet take (max(6,(@actor.level - 1)))d6|options:area-damage damage with a Reflex save against your spell DC. The damage increases by 1d6 for each level you have beyond 7th. The damage's type is either fire damage if your eidolon is a fire elemental, or the same physical damage type as your eidolon's primary unarmed attack if your eidolon isn't a fire elemental. Elemental Burst gains any traits that your eidolon's unarmed attacks gain from elemental core."
  "Elemental Maelstrom":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["eidolon"]
    description: "Your eidolon temporarily shifts its form into a swirling vortex of elemental matter and rampages through their foes. Your eidolon Strides. During their movement, they can attempt a Strike against each enemy that is within their reach. If an enemy comes within your eidolon's reach more than once, your eidolon makes only a single Strike against a given enemy. These attacks all count towards your eidolon's multiple attack penalty, but the penalty doesn't increase until after all the attacks. If your eidolon has the appropriate Speed, they can Climb, Fly, or Swim instead of Stride."
  "Embrace of Destiny":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["mental", "spirit", "transcendence"]
    description: "Choose an enemy within 20 feet of you. It must succeed at a Will save against your class DC or be pulled directly toward you into a square adjacent to you."
  "Embrace the Pain":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["barbarian", "rage"]
  "Emotional Push":
    from: "feat"
    type: "reaction"
