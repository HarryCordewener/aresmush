    type: "reaction"
    traits: ["concentrate", "magical"]
    description: "Trigger A creature you have successfully Recalled Knowledge about would damage you%rRequirements You have a free hand%rEffect You brandish your charm, channeling and shaping the forces within it to protect you against harm. You gain resistance to all damage equal to 2 + half your level rounded up against the triggering effect."
  "Mythic Echo":
    from: "action"
