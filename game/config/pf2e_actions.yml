    traits: ["tengu"]
  "Make an Impression":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["auditory", "concentrate", "exploration", "linguistic", "mental"]
    check: {"slug": "make-an-impression", "statistic": "diplomacy", "options": ["action:make-an-impression"], "against": "will", "notes": {"criticalSuccess": "The target's attitude toward you improves by two steps.", "success": "The target's attitude toward you improves by one step.", "criticalFailure": "The target's attitude toward you decreases by one step."}}
    description: "With at least 1 minute of conversation, during which you engage in charismatic overtures, flattery, and other acts of goodwill, you seek to make a good impression on someone to make them temporarily agreeable. At the end of the conversation, attempt a Diplomacy check against the Will DC of one target. You can instead choose up to five targets if you take a –2 penalty. The GM might add other bonuses or penalties based on the situation. Any impression you make lasts for only the current social interaction unless the GM decides otherwise. See Changing Attitudes below for a summary of the attitude conditions.%rCritical Success The target's attitude toward you improves by two steps.%rSuccess The target's attitude toward you improves by one step.%rCritical Failure The target's attitude toward you decreases by one step.%rChanging Attitudes Your influence on NPCs is measured with a set of attitudes that reflect how they view your character. These are only a brief summary of a creature's disposition. The GM will supply additional nuance based on the history and beliefs of the characters you're interacting with, and their attitudes can change in accordance with the story. The attitudes are…"
  "Makes Me Stronger":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You take damage from your heroic weakness and are not reduced to fewer than 1 Hit Point by the damage%rEffect You make a show of powering through your weakness, be it by flexing your muscles, issuing a challenging roar, laughing off the pain, or simply acting as if the damage doesn't worry you in the slightest. Your spells gain a status bonus to damage against the triggering creature equal to twice their rank; this lasts until the next time you use this reaction. In addition, the creature that damaged you with your heroic weakness must attempt a Will save against your class or spellcasting DC, whichever is higher, to avoid becoming Frightened 1 (Frightened 2 on a critical failure)."
  "Maneuver in Flight":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    check: {"slug": "maneuver-in-flight", "statistic": "acrobatics", "options": ["action:maneuver-in-flight"], "notes": {"criticalSuccess": "You succeed at the maneuver.", "success": "You succeed at the maneuver.", "failure": "Your maneuver fails. The GM chooses if you simply can't move or if some other detrimental effect happens. The outcome should be appropriate for the maneuver you attempted (for instance, being blown off course if you were trying to fly against a strong wind).", "criticalFailure": "As failure, but the consequence is more dire."}}
    description: "Requirements You have a fly Speed.%rYou try a difficult maneuver while flying. Attempt an Acrobatics check. The GM determines what maneuvers are possible, but they rarely allow you to move farther than your fly Speed.%rSuccess You succeed at the maneuver.%rFailure Your maneuver fails. The GM chooses if you simply can't move or if some other detrimental effect happens. The outcome should be appropriate for the maneuver you attempted (for instance, being blown off course if you were trying to fly against a strong wind).%rCritical Failure As failure, but the consequence is more dire.%rSample Maneuver in Flight Tasks Trained steep ascent or descent Expert fly against the wind Master reverse direction Legendary fly through gale force winds"
  "Manifest Eidolon":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "interaction"
    traits: ["concentrate", "manipulate", "summoner", "teleportation"]
    description: "Your eidolon appears in an open space adjacent to you, and can then take a single action. If your eidolon was already manifested, you unmanifest them instead. The conduit that allows your eidolon to manifest is also a tether between you. Your eidolon must remain within 100 feet of you at all times and can't willingly go beyond that limit. If forced beyond this distance, or if you are reduced to 0 Hit Points or your eidolon were to die, your eidolon's physical form unmanifests, and you need to use Manifest Eidolon to manifest them again.%rSpecial This activity has the trait matching your eidolon's tradition (arcane, divine, occult, or primal)."
  "Manifest Realm":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "divine", "manipulate"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect You corrupt the surrounding area into a manifestation of your realm in a 20-foot-radius burst centered on you. Your manifested realm counts as difficult terrain for your enemies, and your enemies take a –1 penalty to Fortitude saving throws while in your manifested realm.%rEffect: Manifest Realm%rYou can Sustain your manifested realm once per round on subsequent rounds, and if you do not, the radius of your manifested realm is reduced by 5 feet.%rYour realm remains manifested for a maximum of 1 minute, and you can Dismiss your manifested realm. If your manifested realm's radius is ever reduced to 0 feet or if you move beyond 100 feet from the borders of your manifested realm, your manifested realm is automatically Dismissed."
  "Manifest Soulforged Armament":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "divine", "extradimensional"]
    description: "Requirements If summoning a soulforged weapon or shield, you have the hands free to wield it; if summoning soulforged armor, you aren't wearing any armor%rEffect You immediately wield or wear the soulforged armament bound to you. The soulforged armament remains manifested until you Dismiss this effect.%rOnce per day when you use this ability, you can manifest the armament's essence form. You gain the armament's essence power until it's Dismissed. After 1 minute, the essence form armament is automatically Dismissed."
  "Map the Area":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["concentrate"]
    description: "As long as your group has successfully Reconnoitered the hex, you can use this activity to create an accurate map of the hex with a successful Survival check (typically at a trained or expert DC). When you have an accurate map of the hex, the DC of any check to navigate that hex is reduced by 2."
  "Marathon Dash":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["transcendence"]
    description: "Your feet carry you so quickly they leave a slipstream that speeds your allies on. You Stride. Each ally within 10 feet of you at the start of your movement can Stride as a reaction."
  "March the Mines":
    from: "feat"
    type: "action"
    cost: 2
    category: "ancestry"
    traits: ["dwarf"]
  "Mark for Death":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["concentrate"]
    description: "Requirements The creature you intend to mark is observed by you%rEffect You designate a single creature as your mark. Using Mark for Death while Hidden or Undetected doesn't make you Observed. Mark for Death lasts until the mark dies or you use Mark for Death again. You gain a +2 circumstance bonus to Perception checks to Seek your mark, as well as to Deception checks to Feint against your mark. Your mark takes a –2 circumstance penalty to all Perception checks to Seek you.%rIn addition, when attacking your mark, you have the Sneak Attack class feature, except it deals 1d4 precision damage and you don't increase the number of dice as you gain levels. At 6th level, the damage increases to 1d6. If you already have the sneak attack class feature, you instead deal an additional 1 precision damage with your sneak attacks made against your mark, increasing to 2 precision damage at 6th level."
  "Mark the Center":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["transcendence"]
    description: "You hold a hand to your lips and exhale, releasing enchanted red ash in a 15-foot cone. The ash clings to the vital areas of each enemy in the area for 1 minute. When a creature marked by the ash is hit and dealt damage by a Strike, it takes an additional 4d6 precision or vitality damage, then its mark ends. The damage type is whichever is worse for the creature, as determined by the GM. At 13th level and every 3 levels thereafter, the damage increases by 1d6."
  "Martyr":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["cleric", "spellshape"]
  "Master Strike":
    from: "action"
    for: "class"
    type: "free"
    category: "offensive"
    traits: ["incapacitation", "rogue"]
    description: "Trigger Your Strike hits an Off-Guard creature and deals damage.%rThe target attempts a Fortitude save against your class DC. It then becomes temporarily immune to your Master Strike for 1 day.%rCritical Success The target is unaffected.%rSuccess The target is Enfeebled 2 until the end of your next turn.%rFailure The target is Paralyzed for 4 rounds.%rCritical Failure The target is paralyzed for 4 rounds, knocked Unconscious for 2 hours, or killed (your choice)."
  "Master of Many Styles":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["fighter", "monk"]
  "Meddling Futures":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["cursebound", "divine", "oracle"]
    self_effect: "Effect: Meddling Futures"
  "Melodious Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["bard", "concentrate", "manipulate", "spellshape"]
  "Mighty Rage":
    from: "action"
    for: "class"
    type: "free"
    category: "interaction"
    traits: ["barbarian"]
    description: "Trigger You use the Rage action on your turn%rUse an action that has the rage trait. Alternatively, you can increase the actions of the triggering Rage to 2 to instead use a 2-action activity with the rage trait."
  "Mirror Shield":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["fighter"]
  "Mirror's Reflection":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["illusion", "magical", "manipulate", "thaumaturge"]
    description: "Requirements You're holding your mirror implement.%rYou reflect an illusory image of yourself into another unoccupied space within 15 feet that you can see. You are treated as being in both spaces until the start of your next turn. For example, you can attack, Seek, and provide flanking—even with yourself. You occupy both spaces. Your mirror self mimics your actions exactly, but any effects you generate come from only one of your positions; you decide which each time you act. For example, if you made a melee Strike against a creature within reach of the reflection, you'd mime the actions of the Strike, but only the reflection would actually make the Strike. Anything that targets or would affect your reflection affects you and uses your statistics. Something that would target or affect both of you affects you only once. For example, a fireball that included both of you in its area would require only one save from you and damage you no more than once. When you move, you choose which square to move from, but the mirror effect ends (see below).%rSome events force you to determine which image is the real you, and then end the effect and cause your mirror self to disappear; this happens…"
  "Mirror-Trickery":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate", "illusion", "occult", "visual"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You would be hit by a Strike%rEffect You create an illusory duplicate at the last instant and attempt to trick your foe into striking it instead of you. The attacker attempts a DC 11 Flat; on a failure, the attack hits the duplicate, changing the result from a critical success to a success or a success to a failure."
  "Mirrored Wall":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic", "visual"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rRequirements At least one of your squadmates is in bright light or has a focused light source available, such as a bull's-eye lantern.%rYour squadmates have polished their shields to a reflective sheen and now position them to reflect a blinding light into your enemy's eyes. All of your squadmates can Raise a Shield or cast Shield as a reaction.%rThen, signal a squadmate within the aura of your commander's banner who currently has a shield raised (including spellcasting allies with an active casting of the shield cantrip), and choose an enemy within 60 feet. The formation bounces light off the raised shield and into the enemy's eyes; the target must succeed at a Fortitude saving throw against your class DC or become Blinded for 1 round (on a critical failure, the creature remains Dazzled for 3 rounds after the blindness ends).%rYou can signal additional allies with raised shields to participate in this tactic; the target takes a circumstance penalty on this save equal to the number of additional participating squadmates (to a maximum –4 circumstance penalty to the target's save).%rEffect: Mirrored Wall"
  "Mist Blending":
    from: "action"
    for: "heritage"
    type: "reaction"
    category: "defensive"
    traits: ["undine"]
    description: "Trigger A creature attempts a flat check to target you because you're Concealed or Hidden due to fog, haze, mist, or smoke%rEffect You shroud yourself in mist, making it harder for your foe to hit you. If you're concealed, the DC of the flat check increases from 5 to DC 7 Flat; if you're hidden, it increases from 11 to DC 13 Flat."
  "Mixed Maneuver":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["monk"]
  "Mobbing Assault":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate"]
    description: "Requirements Your horde has been raised%rEffect Each enemy in a 5-foot emanation around your horde takes (ternary(gte(@actor.level,18),8,ternary(gte(@actor.level,14),6,ternary(gte(@actor.level,10),4,2))))d6 bludgeoning|options:area-damage damage (if your horde is zombies) or (ternary(gte(@actor.level,18),8,ternary(gte(@actor.level,14),6,ternary(gte(@actor.level,10),4,2))))d6 slashing|options:area-damage damage (if your horde is skeletons) with a Reflex save against your spell DC. At 10th level and every 4 levels thereafter, the damage increases by 2d6."
  "Mobile Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Mobile Shot Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "stance"]
    self_effect: "Stance: Mobile Shot Stance"
  "Moment of Clarity":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "rage"]
  "Monastic Archer Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Monastic Archer Stance"
  "Mount":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    description: "Requirements You are adjacent to a creature that is at least one size larger than you and is willing to be your mount.%rYou move onto the creature and ride it. If you're already mounted, you can instead use this action to dismount, moving off the mount into a space adjacent to it."
  "Mountain Quake":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk"]
  "Mountain Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Mountain Stance"
  "Mountain Stronghold":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk"]
    self_effect: "Effect: Mountain Stronghold"
  "Mountaineering Training":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your instructions make it easier for you and your allies to scale dangerous surfaces. Signal all squadmates; until the end of your next turn, you and each ally gain a climb Speed of 20 feet.%rEffect: Mountaineering Training%rSpecial If you have this tactic prepared, you can use Warfare Lore in place of Athletics for checks you make to Climb."
  "Mug":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
