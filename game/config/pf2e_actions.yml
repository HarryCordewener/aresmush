---
pf2e_actions:
  "A Challenge for Heroes":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "mental", "spirit", "transcendence"]
    description: "You declare an enemy within 60 feet to be a heroic test. For 1 minute, that enemy deals an additional 10 spirit damage to you with each successful Strike or spell it targets you with.%rEffect: A Challenge for Heroes (Enemy)%rWhenever that enemy deals spirit damage to you, each ally who has the enemy in melee reach can attempt a Reactive Strike against it, even if the ally doesn't normally have that reaction. If an ally successfully slays the enemy with a Reactive Strike due to this effect, that ally immediately gains temporary Hit Points equal to your level, which persist for 1 minute.%rEffect: A Challenge for Heroes (Ally)"
  "A Moment Unending":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    traits: ["concentrate", "prediction", "transcendence"]
    description: "You take in every movement around you, affording you unparalleled accuracy. Your next successful Strike against an enemy before the end of your next turn deals an additional 1d6 precision damage. This damage increases to 2d6 at 10th level and 3d6 at 18th level."
  "A Quick Glimpse Beyond":
    from: "action"
    for: "background"
    type: "free"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Trigger You attempt a secret check%rFrequency once per day%rEffect You can roll the secret check yourself rather than have the GM roll it. As you roll, draw a harrow card. If the card drawn is from the suit of Stars, the next secret check you make during the next 24 hours can also be rolled by you. Each time you roll your own additional secret check in this way, draw a new harrow card, and each time you draw a card from the suit of Stars, your next secret check in the next 24 hours can also be rolled by you. If you ever critically fail a secret check that you roll yourself as a result of this ability, fate turns away from you, and your Pilgrim's Token no longer functions until the next time you make your daily preparations."
  "Absorb Magic":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate", "magical"]
    self_effect: "Effect: Overflowing"
    description: "Requirements You are not overflowing%rTrigger Another creature within 30 feet Casts a Spell or uses an action, activity, or reaction with the arcane, divine, magical, occult, or primal trait%rEffect You breathe in a small fraction of the magic produced by the triggering effect, storing it in your internal nexus. You become overflowing. You remain overflowing for up to 1 minute before the stored magical energy fades. While overflowing, you gain a +1 status bonus to saving throws against effects with the arcane, divine, magical, occult, and primal traits. This bonus becomes +2 at 15th level."
  "Absorb into the Aegis":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger An enemy casts a spell that targets you or an ally within 15 feet of you%rYou interpose your shield's ward against the spell. Attempt a counteract check, using your Religion modifier as your counteract modifier. On a success, the spell is counteracted and your shield takes damage equal to four times the spell rank as it absorbs and disperses the magical energy. On a failure, the shield takes damage equal to twice the spell's rank."
  "Accept Echo":
    from: "action"
    for: "aftermath"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "occult"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Accept Echo"
    description: "Frequency once per day%rEffect You allow the echo to inhabit your body, gaining a glowing aura around you, shining pale-green irises, a resonating voice, and the silhouette of the spirit around your own body, all of which can be seen clearly by others. While in this state, you become trained in the weapon you chose and an expert in the skill you chose. Additionally, while you're in this state, the echo can speak and interact with the Universe using your body, and you gain a +4 status bonus to all saves against possession effects, as the possessing spirit protects you from other possessions.%rThis state lasts for 10 minutes, after which the echo disappears completely until the next time you make your daily preparations. You can Dismiss this effect.%rAt 7th level you become a master of the skill you chose, at 13th level you become an expert with the weapon you chose, and at 15th level you become legendary with the skill you chose."
  "Accidental Shot":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You make a Strike with a ranged weapon, rolling the attack and damage twice and using the better results for each. The attack ignores circumstance penalties to the attack roll and any flat check required due to the target being Concealed or Hidden."
  "Accompany":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["bard", "concentrate", "manipulate"]
  "Acrid Barrage":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rEffect Each enemy in your aura takes ternary(gte(@actor.level, 18), 7, ternary(gte(@actor.level, 15), 6, 5))d6 acid,2d6 persistent acid|options:area-damage damage with a Reflex save against your class DC or spell DC, whichever is higher. The initial damage increases to 6d6 at 15th level and 7d6 at 18th level."
  "Act Together":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["summoner", "tandem"]
    frequency: {"max": 1, "per": "round"}
    description: "1 to 3%rFrequency once per round%rYou and your eidolon act as one. Either you or your eidolon takes an action or activity using the same number of actions as Act Together, and the other takes a single action.%rFor example, if you spent 2 actions to Act Together, you could cast Breathe Fire (2 actions) and your eidolon could Strike (1 action), or your eidolon could use their Dragon Breath (2 actions) and you could Stride (1 action)."
  "Activate Resonant Reflection":
    from: "action"
    for: "campaign"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["magical"]
    description: "Activate 2 envision%rFrequency once per day for each reflection%rYou activate one of your resonant reflections:"
  "Additional Recollection":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["ranger"]
  "Administer Ambient Magic":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["healing"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect Your ostilli pulses a calm lavender color as it converts stored magic into a curative balm. You regain ((2*floor(@actor.level/4))d4) healing Hit Points, and you can immediately attempt a flat check to recover from persistent bleed damage with the DC reduced to 10. This healing increases by 2d4 at 8th level and every 4 levels thereafter."
  "Administer First Aid":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 2
    traits: ["manipulate"]
    check: {"slug": "administer-first-aid", "statistic": "medicine", "options": ["action:administer-first-aid"], "variants": {"stabilize": {"name": "Stabilize", "notes": {"criticalSuccess": "The target loses the dying condition (but remains unconscious).", "success": "The target loses the dying condition (but remains unconscious).", "criticalFailure": "The target's dying value increases by 1."}, "consequences": {"criticalSuccess": [{"on": "target", "remove": ["Dying"]}], "success": [{"on": "target", "remove": ["Dying"]}]}}, "stop-bleeding": {"name": "Stop Bleeding", "notes": {"criticalSuccess": "The target benefits from an assisted recovery with the lowered DC for particularly appropriate help.", "success": "The target benefits from an assisted recovery with the lowered DC for particularly appropriate help.", "criticalFailure": "The target immediately takes an amount of damage equal to its persistent bleed damage."}, "consequences": {"criticalSuccess": [{"on": "target", "persistent": "bleed"}], "success": [{"on": "target", "persistent": "bleed"}]}}}}
    description: "Requirements You're wearing or holding a Healer's Toolkit.%rYou perform first aid on an adjacent creature that is Dying or Bleeding. If a creature is both dying and bleeding, choose which ailment you're trying to treat before you roll. You can Administer First Aid again to attempt to remedy the other effect.%rStabilize Attempt a Medicine check on a creature that has 0 Hit Points and the dying condition. The DC is equal to 5 + that creature's recovery roll DC (typically 15 + its dying value). Stop Bleeding Attempt a Medicine check on a creature that is taking persistent bleed damage. The DC is usually the DC of the effect that caused the bleed.%rSuccess If you're trying to stabilize, the target loses the dying condition (but remains Unconscious). If you're trying to stop bleeding, the target benefits from an assisted recovery with the lowered DC for particularly appropriate help.%rCritical Failure If you were trying to stabilize, the target's dying value increases by 1. If you were trying to stop bleeding, the target immediately takes an amount of damage equal to its persistent bleed damage."
  "Adopt Persona":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "interaction"
    traits: ["concentrate", "illusion", "occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Your tattoo helps you create a temporary cover to infiltrate a protected area or escape a dangerous situation. It casts 2nd-rank Illusory Disguise and 2nd-rank Ventriloquism on you. The duration of both effects is 10 minutes."
  "Advantageous Assault":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Aegis of Envy":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["arcane", "concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Spend 1 Mythic Point. The spirits of eight runelords of envy (Naaft, Tannaris, Ivamura, Jurah, Chalsardra, Esedrea, Zarve, Desamelia, and Phirandi) swirl about you for 1 minute. While at least one of the spirits remains, whenever you take damage, you can use a reaction that has the concentrate trait to gain resistance 10 to that damage, or resistance 20 if the damage was dealt by Xanderghul, the runelord of pride. Each time you use this feat to gain resistance, one of the spirits disappears."
  "Affix a Fulu":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    description: "You affix a fulu to an armor, weapon, shield, creature, or structure that's beside or in the same square as you. A creature can remove a fulu from itself or an unattended object in its reach with a single action."
  "Affix a Talisman":
    from: "action"
    for: "everyone"
    type: "passive"
    traits: ["exploration", "manipulate"]
    description: "Requirements You must use a Repair Toolkit%rYou spend 10 minutes affixing a talisman to an item, placing the item on a stable surface and using the repair toolkit with both hands. You can also use this activity to remove a talisman. Attaching more than one talisman to an item deactivates all the talismans. They must be removed and re-affixed before they can be used again."
  "After You":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["swashbuckler"]
    self_effect: "Effect: Panache"
  "Aggressive Block":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["fighter", "guardian"]
  "Aid":
    from: "action"
    for: "everyone"
    type: "reaction"
    traits: []
    check: {"slug": "aid", "statistic": null, "options": ["action:aid"], "dc": 15, "notes": {"criticalSuccess": "You grant your ally a +2 circumstance bonus to the triggering check. If you're a master with the check you attempted, the bonus is +3, and if you're legendary, it's +4.", "success": "You grant your ally a +1 circumstance bonus to the triggering check.", "criticalFailure": "Your ally takes a –1 circumstance penalty to the triggering check."}, "consequences": {"criticalSuccess": [{"on": "target", "effect": "Effect: Aid", "answer": {"default": "+2", "master": "+3", "legendary": "+4"}}], "success": [{"on": "target", "effect": "Effect: Aid", "answer": "+1"}], "criticalFailure": [{"on": "target", "effect": "Effect: Aid", "answer": "-1"}]}}
    description: "Trigger An ally is about to use an action that requires a skill check or attack roll.%rRequirements The ally is willing to accept your aid, and you have prepared to help (see below).%rYou try to help your ally with a task. To use this reaction, you must first prepare to help, usually by using an action during your turn. You must explain to the GM exactly how you're trying to help, and they determine whether you can Aid your ally.%rWhen you use your Aid reaction, attempt a skill check or attack roll of a type decided by the GM. The typical DC is 15, but the GM might adjust this DC for particularly hard or easy tasks. The GM can add any relevant traits to your preparatory action or to your Aid reaction depending on the situation, or even allow you to Aid checks other than skill checks and attack rolls.%rCritical Success You grant your ally a +2 circumstance bonus to the triggering check. If you're a master with the check you attempted, the bonus is +3, and if you're legendary, it's +4.%rSuccess You grant your ally a +1 circumstance bonus to the triggering check.%rCritical Failure Your ally takes a –1 circumstance penalty to the triggering check.%rEffect: Aid"
  "Align Qi":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["monk"]
    frequency: {"max": 1, "per": "PT1H"}
  "All in My Head":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["bard", "illusion", "mental"]
  "Alley-Oop":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your team excels at sharing resources and delivering them exactly where they need to be. Signal a squadmate within the aura of your banner who is holding or wearing a consumable that can be activated as a single action. That squadmate can toss their consumable to any other squadmate within the aura of your banner as a free action, and the receiving squadmate can catch and activate the consumable as a reaction. If the receiving squadmate chooses not to catch the consumable or if they don't have a free hand to catch it with, it lands on the ground in their space.%rSpecial If the consumable is a piece of activated ammunition and the receiving squadmate is wielding a compatible weapon that takes 1 or fewer actions to reload, they can load the ammunition into their weapon as part of the reaction used to catch and activate it. The ammunition remains activated until the end of their next turn."
  "Amassed Assault":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack"]
    description: "Each enemy in your united companion's space takes damage equal to one of its unarmed Strikes plus your level (Reflex save against your class DC or spell DC, whichever is higher)."
  "Amulet's Abeyance":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["magical", "manipulate", "thaumaturge"]
    description: "Trigger The target of your Exploit Vulnerability would damage you or an ally within 15 feet of you.%rRequirements You're holding your amulet implement and are benefiting from Exploit Vulnerability.%rYou forcefully present your amulet to turn away harm. You or a target ally within 15 feet gain resistance to all damage against the triggering damage. The resistance is equal to 2 + your level.%rEffect: Amulet's Abeyance"
  "Anadi Venom":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["anadi"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Anadi Venom"
    description: "Frequency a number of times per day equal to your level%rYou envenom your fangs. If the next fangs Strike you make before the end of your turn hits and deals damage, the Strike deals an additional 1d6 poison damage. On a critical failure, the poison is wasted as normal. At 12th level, this poison damage increases to 2d6."
  "Analyze Weakness":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["rogue"]
  "Anchor":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["leshy"]
    description: "Requirements You're on a solid surface%rEffect You send your roots into or across the ground, making it harder for you to stumble. Until you move, you gain a +2 circumstance bonus to your Fortitude or Reflex DC against attempts to Reposition, Shove, or Trip you (or a +4 circumstance bonus if you're a root leshy). This bonus also applies to saving throws against spells or effects that attempt to move you or knock you Prone. If an effect forces you to move, you move only half the normal distance, as some of the effort goes to tearing loose the roots."
  "Animalistic Brutality":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "morph", "primal", "rage"]
    self_effect: "Effect: Animalistic Brutality"
  "Annihilating Swing":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian"]
  "Anoint Ally":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["manipulate", "sorcerer"]
  "Arcane Cascade":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "magus", "stance"]
    self_effect: "Stance: Arcane Cascade"
    description: "You cycle arcane power through your body and weapon using specialized forms, breathing, or footwork. While you're in the stance, your melee Strikes gain the arcane trait (making them magical) and deal 1 extra force damage, and you gain resistance 1 to damage from spells. If you have the Weapon Specialization class feature, the damage and resistance increase to 2, and if you have Greater Weapon Specialization, they increase to 3.%rIf you Cast a Spell and then enter Arcane Cascade on the same turn, you can change the damage from the stance to any one damage type that spell could deal instead of force."
  "Armor Up!":
    from: "action"
    for: "spells"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    description: "Effect You snap your fingers. The armor returns to your body."
  "Arrest a Fall":
    from: "action"
    for: "everyone"
    type: "reaction"
    traits: []
    check: {"slug": "arrest-a-fall", "statistic": ["reflex", "acrobatics"], "options": ["action:arrest-a-fall"], "dc": 15, "notes": {"criticalSuccess": "You take no damage from the fall.", "success": "You take no damage from the fall."}}
    description: "Trigger You fall.%rRequirements You have a fly Speed.%rYou attempt an Acrobatics check or Reflex save to slow your fall. The DC is typically 15, but it might be higher due to air turbulence or other circumstances.%rSuccess You take no damage from the fall."
  "Arrow Splits Arrow":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["transcendence"]
    description: "Requirements Your previous action was to Strike with the Unfailing Bow%rEffect You repeat your motions exactly, your attack landing in the same location as your previous shot. You make a Strike against the same target. The result of your d20 roll is the same as the result of the required shot, though any penalties (such as your multiple attack penalty) apply normally to this shot and you don't automatically adjust the degree of success if the initial roll was a natural 1 or 20."
  "Assisting Shot":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Assume a Role":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "Requirements You've spent at least 1 hour studying a creature whose role you intend to copy and have done so within the last 3 days. This could include meeting and learning from someone in that role, tailing and spying on someone, using magic to observe them at work, or some other method, as long as you have a visual source of information%rEffect You quickly and accurately learn how to do mundane jobs or at least copy the movements enough to appear as if you do. A chosen role can take many forms—from cook, cleaner, or librarian to cult member, priest, or duke—but it's always a role and never a specific individual. You perform the Impersonate activity to pass as a member of the role you observed and gain a +1 circumstance bonus to any Deception checks you attempt in your impersonation. This takes the normal amount of time it takes you to Impersonate. You also choose one Lore skill relevant to that role (such as Farming Lore for a farmer). While in your role, you gain a +1 circumstance bonus to checks for that Lore skill, and if you're untrained in it, you can use your level as your proficiency bonus. You stop assuming the role after 24 hours, if you start studying for a new role,…"
  "Automaton Aim":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    description: "You steady your body and observe the events of the battlefield to maximize the range of your next shot. You reduce the penalty for firing into your weapon's second range increment from –2 to 0 for the next ranged attack you make this turn. You can use this action a second time in the same turn to reduce the penalty from firing into your weapon's third range increment from –4 to 0 for the next ranged attack you make this turn."
  "Avatar's Protection":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["cleric"]
  "Avenge Ally":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["elf", "fortune"]
    frequency: {"max": 1, "per": "PT10M"}
  "Avert Gaze":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    traits: []
    self_effect: "Effect: Avert Gaze"
    description: "You avert your gaze from danger, such as a medusa's gaze. You gain a +2 circumstance bonus to saves against visual abilities that require you to look at a creature or object, such as a medusa's petrifying gaze. Your gaze remains averted until the start of your next turn."
  "Avoid Dire Fate":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: ["fortune"]
    description: "Requirements you have an active harrow omen%rTrigger you fail or critically fail a check associated with your harrow omen's suit%rEffect Treat the failure as a success or a critical failure as a failure. You no longer have an active harrow omen."
  "Avoid Notice":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "defensive"
    traits: ["exploration"]
    check: {"slug": "avoid-notice", "statistic": "stealth", "options": ["action:avoid-notice"], "notes": {"criticalSuccess": "You're Undetected by the creature during your movement and remain undetected by the creature at the end of it.%rSee the Sneak action for details.", "success": "You're Undetected by the creature during your movement and remain undetected by the creature at the end of it.%rSee the Sneak action for details."}}
    description: "You attempt a Stealth check to avoid notice while traveling at half speed. If you're Avoiding Notice at the start of an encounter, you usually roll a Stealth check instead of a Perception check both to determine your initiative and to see if the enemies notice you (based on their Perception DCs, as normal for Sneak, regardless of their initiative check results)."
  "Balance":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    traits: ["move"]
    check: {"slug": "balance", "statistic": "acrobatics", "options": ["action:balance"], "notes": {"criticalSuccess": "You move up to your Speed.", "success": "You move up to your Speed, treating it as difficult terrain (every 5 feet costs 10 feet of movement).", "failure": "You must remain stationary to keep your balance (wasting the action) or you fall. If you fall, your turn ends.", "criticalFailure": "You fall and your turn ends."}}
    description: "Requirements You are in a square that contains a narrow surface, uneven ground, or another similar feature.%rYou move across a narrow surface or uneven ground, attempting an Acrobatics check against its Balance DC. You are Off-Guard while on a narrow surface or uneven ground.%rCritical Success You move up to your Speed.%rSuccess You move up to your Speed, treating it as difficult terrain (every 5 feet costs 10 feet of movement).%rFailure You must remain stationary to keep your balance (wasting the action) or you fall. If you fall, your turn ends.%rCritical Failure You fall and your turn ends.%rSample Balance Tasks Untrained tangled roots, uneven cobblestones Trained wooden beam Expert deep, loose gravel Master tightrope, smooth sheet of ice Legendary razor's edge, chunks of floor falling in midair"
  "Banshee Cry":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: []
    description: "Trigger A creature within 30 feet Casts a Spell or Activates an Item using a concentrate Activation%rEffect You set off a firework that explodes with a loud screech near the creature. The creature must attempt a Will save.%rSuccess The creature is unaffected.%rFailure The creature must use an additional action on the triggering action or activity, or it's disrupted.%rCritical Failure The triggering action is disrupted."
  "Barbed Quills":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "offensive"
    traits: ["shisk"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You are hit with an unarmed strike or a strike with a non-reach melee weapon.%rYou break off quills in your attacker's flesh. You deal ceil(@actor.level/2)d8 piercing damage to the triggering creature (Reflex save using your class DC or spell DC, whichever is higher.) On a critical failure, the creature also takes (1d4+ceil(@actor.level/2)-1) bleed as your quills hook into its flesh. At 3rd level, and every 2 levels thereafter, this damage increases by 1d8 and the persistent piercing damage increases by 1."
  "Barreling Charge":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "fighter", "flourish"]
  "Base Kinesis":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["impulse", "kineticist", "primal"]
    description: "It's trivial for you to create some of your element or alter a portion of it that already exists. Choose one of your kinetic elements to affect. This impulse has a range of 30 feet, and the Bulk of the target must be negligible or light. The GM decides what Bulk the element is. You can't affect an element that's magical, secured in place (like a stone mortared in a wall), or attended by a creature unwilling to let you.%rChoose one of the following options, though the GM might allow you to make similar small alterations. Base Kinesis can't deal damage or cause conditions unless otherwise noted.%rGenerate You bring an ordinary, non-magical piece of the chosen element from its elemental plane. The element can be used for any of its normal uses. For example, air can be breathed by an air-breathing creature, and fire casts light and can ignite flammable substances. Move Move an existing piece of the element up to 20 feet in any direction. If you bring it into your space, you can catch it in an open hand. You can Sustain the impulse to keep moving the element. Suppress You destroy an existing piece of element, such as snuffing out a flame or evaporating water from a cup. This affects…"
  "Bashing Charge":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "flourish"]
  "Basic Finisher":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["finisher"]
    description: "You make a graceful, deadly attack. Make a Strike; if you hit and your weapon qualifies for Precise Strike, you deal the full 1d6 damage from precise strike."
  "Battle Medicine":
    from: "feat"
    type: "action"
    cost: 1
    category: "skill"
    traits: ["general", "healing", "manipulate", "skill"]
  "Bear Allies' Burdens":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["transcendence"]
    description: "You move with a speed belying your strength, carrying your allies as easily as straw dolls. You Stride. At any point you are adjacent to a willing ally during the Stride, you can pick that ally up, and you can deposit them into a space adjacent to you at any other point during your movement. You ignore the ally's Bulk while carrying them during your Stride. You can Climb, Fly, or Swim instead of Striding if you have the corresponding movement type."
  "Beast's Charge":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["eidolon"]
    description: "Your eidolon rushes forward, using their momentum to increase the power of their attack. Your eidolon Strides twice and then Strikes. If the eidolon moved at least 20 feet away from their starting position and moved entirely in a straight line, they gain a +1 circumstance bonus to this attack roll."
  "Bend Time":
    from: "action"
    for: "background"
    type: "free"
    category: "interaction"
    traits: ["occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger Your turn begins%rEffect You are Quickened this turn. You can use your extra action to Stride."
  "Bespell Strikes":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["oracle", "sorcerer", "wizard"]
    frequency: {"max": 1, "per": "turn"}
    self_effect: "Effect: Bespell Strikes"
  "Bestial Clarity":
    from: "action"
    for: "background"
    type: "reaction"
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You fail a saving throw against an enchantment effect%rEffect Your bestial manifestation becomes more pronounced, and your mind gains a flash of clarity as your instincts take over. You can reroll the triggering saving throw with a +2 circumstance bonus, but you must use the new result. This is a fortune effect."
  "Binding Vow":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["auditory", "concentrate", "occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You bind yourself by formally speaking a binding vow. Supernatural power flows through and around you as you speak it, and all those present to hear it intrinsically know that it binds you. Breaking this vow is anathema to you, and if you break it willingly, you lose all pactbinder benefits until you fulfill your vow or, if that's impossible, participate in an atone ritual. The vow doesn't prevent unwilling violations and can't be used to try to circumvent mind-control magic, confusion, or similar situations where you perform an action not entirely of your own volition. A Binding Vow doesn't end until you've fulfilled it. Even if you die, the vow still binds you if you return to life. The vow doesn't force you to go to ridiculous extremes, such as dying, to fulfill your vow unless you specifically swear to go to such extremes. Trying to subvert your binding vow by making selfish promises (such as swearing to an ally that you'll kill someone you already wanted to kill) is in itself a violation of your vow, as is attempting to subvert other vows you've made (such as those from other pactbinder feats or a champion's sanctification).%rWhen you make a…"
  "Bite and Sting":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    traits: []
    description: "Requirements Your swarm is outside your body%rEffect Each creature in your swarm's space takes (floor(@actor.level/2))d4 piercing damage with a Reflex save against your class DC or spell DC, whichever is higher. At 4th level and every 2 levels thereafter, the damage increases by 1d4."
  "Blade Brake":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["fighter", "manipulate"]
  "Blaze of Revelation":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["oracle"]
  "Blazing Conflagration":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["fire", "healing", "light", "visual"]
    description: "Requirements You're transformed into phoenix form by the monstrosity form spell granted by this feat%rEffect You dismiss phoenix form while a fiery corona erupts from you as searing light. Each creature in a 10-foot burst takes max(16,(2*(floor(@actor.level/2))))d6 fire|options:area-damage damage with a Fortitude save against your spell DC; creatures that critically fail are Blinded for 1 round. You gain 8d6 temporary Hit Points. At 18th level and again at 20th level, the burst deals an additional 2d6 fire damage, and you gain an additional 1d6 temporary Hit Points."
  "Bleed Out":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["attack", "sorcerer"]
  "Bleeding Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Bless Ally":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "divine", "fortune", "mythic"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rRequirements Your nimbus is active%rTarget a willing ally within the bright light of your nimbus%rEffect Your radiance grants an ally some of your celestial grace. That ally can roll twice and use the higher result for the next Will save they attempt before the beginning of your next turn.%rEffect: Bless Ally"
  "Blessed Counterstrike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["champion", "flourish"]
  "Blinding of the Needle":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["transcendence"]
    description: "You aim your weapon in a superficial cut above your opponent's eye. Make a Strike with the imbued ikon. If that Strike is successful, the target must succeed at a Fortitude save against your class DC or become Blinded for 1 round or until it uses an Interact action to clear the blood from its vision."
  "Blizzard Evasion":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: []
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Blizzard Evasion"
    description: "Frequency once per day%rTrigger You take 40 or more physical damage from a single attack%rEffect You discorporate into a whirling blizzard for up to 3 rounds. During this time, you gain resistance 10 to physical damage and weakness 10 to force damage. You gain a fly speed of 40 feet, but the only action you can take is to Fly. The first time each round you enter another creature's space while discorporated, or the first time a creature enters your space, that creature takes 4d8 cold damage and must succeed at a Fortitude saving throw against your class DC or spell DC, whichever is higher, or else be Stunned 1. At the start of your turn, you can end this effect as a free action."
  "Blood Rising":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["sorcerer"]
  "Bloodline Conduit":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["sorcerer", "spellshape"]
    frequency: {"max": 1, "per": "PT1M"}
  "Bloody Guillotine":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rYour squad performs a brutal combination attack that levels an enemy and attempts to put them down permanently. Choose and signal up to three squadmates within the aura of your commander's banner. Each squadmate can Stride up to half their Speed directly toward a single enemy you designate as a free action. Any who end their movement adjacent to the designated target can attempt to Trip or Strike it as a reaction.%rThe first time a Prone enemy is successfully dealt damage by a Strike from this tactic, they must immediately attempt a Fortitude save against your class DC or die; this is a death and incapacitation effect. All enemies who witness a creature slain by Bloody Guillotine must succeed at a Will save against your class DC or become Sickened 1 for 1 round (Sickened 2 for 1 round on a critical failure); this is an emotion and mental effect."
  "Board":
    from: "action"
    for: "vehicles"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    description: "Requirements You are adjacent to a point of entry on the vehicle you are attempting to board.%rYou board a vehicle through an open top, a door, a portal, or a hatch; if you're already on board, you can instead use this action to disembark into an empty space adjacent to the vehicle's point of entry. Using this action while the vehicle is in motion is challenging, requiring a successful Acrobatics or Athletics check with a DC equal to the vehicle's AC."
  "Boarding Assault":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["flourish"]
    description: "Either Stride twice or attempt an Acrobatics check (DC determined by the GM, but usually DC 20) to swing up to twice your Speed on a rope or similar object, then Strike.%rIf you boarded or disembarked from a boat or similar vehicle during this movement, the Strike deals one additional weapon damage die."
  "Bon Mot":
    from: "feat"
    type: "action"
    cost: 1
    category: "skill"
    traits: ["auditory", "concentrate", "emotion", "general", "linguistic", "mental", "skill"]
    check: {"slug": "bon-mot", "statistic": "diplomacy", "options": ["action:bon-mot"], "against": "will", "notes": {"criticalSuccess": "The target is distracted and takes a -3 status penalty to Perception and Will saves for 1 minute. The target can end the effect early with a retort to your Bon Mot. This can either be a single action that has the concentrate trait or an appropriate skill action to frame their retort. The GM determines which skill actions qualify, though they must take at least 1 action. Typically, the retort needs to use a linguistic Charisma-based skill action. Effect: Bon Mot", "success": "The target is distracted and takes a -2 status penalty to Perception and Will saves for 1 minute. The target can end the effect early with a retort to your Bon Mot. This can either be a single action that has the concentrate trait or an appropriate skill action to frame their retort. The GM determines which skill actions qualify, though they must take at least 1 action. Typically, the retort needs to use a linguistic Charisma-based skill action. Effect: Bon Mot", "criticalFailure": "Your quip is atrocious. You take the same penalty an enemy would take had you succeeded. This ends after 1 minute or if you issue another Bon Mot and succeed. Effect: Bon Mot"}, "consequences": {"criticalSuccess": [{"on": "target", "effect": "Effect: Bon Mot", "answer": "Critical Success"}], "success": [{"on": "target", "effect": "Effect: Bon Mot", "answer": "Success"}], "criticalFailure": [{"on": "actor", "effect": "Effect: Bon Mot", "answer": "Critical Failure"}]}}
  "Bond Conservation":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["manipulate", "spellshape", "wizard"]
  "Bond with Spirit":
    from: "action"
    for: "archetype"
    type: "passive"
    traits: ["concentrate", "exploration"]
    description: "You can forge a spiritual bond with a creature that is at least friendly toward you or with a terrain that you're currently in. Forming this bond takes 10 minutes, during which time you must remain adjacent to the creature or within that terrain. If the creature is intelligent, this also requires that creature's consent, and that intelligent creature can choose to sever this bond with you at any time as a free action, which has the concentrate trait. This bond lasts as long as you are within a mile of the creature or terrain, until you use Bond with Spirit again, or until you make your daily preparations.%rYou must be Bonded with a Spirit to cast the Entreat Spirit focus spell."
  "Borrow an Arcane Spell":
    from: "action"
    for: "everyone"
    type: "passive"
    traits: ["concentrate", "exploration"]
    description: "If you're an arcane spellcaster who prepares from a spellbook, you can attempt to prepare a spell from someone else's spellbook. The GM sets the DC for the check based on the spell's rank and rarity; it's typically a bit easier than Learning the Spell.%rSuccess You prepare the borrowed spell as part of your normal spell preparation.%rFailure You fail to prepare the spell, but the spell slot remains available for you to prepare a different spell. You can't try to prepare this spell until the next time you prepare spells."
  "Boulder Roll":
    from: "feat"
    type: "action"
    cost: 2
    category: "ancestry"
    traits: ["dwarf"]
  "Bounce Away":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: []
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rTrigger A melee Strike hits you and deals bludgeoning damage%rEffect You gain resistance equal to your level to bludgeoning damage from the triggering Strike, then Stride up to half your Speed. You can Fly instead of Striding if you have a fly Speed."
  "Bounce Back":
    from: "feat"
    type: "free"
    category: "ancestry"
    traits: ["human"]
    frequency: {"max": 1, "per": "day"}
  "Brandish the Gorgon's Gaze":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["earth", "transcendence", "visual"]
    description: "You Raise your Mirrored Aegis, though it seems to lose some of its usual luster in favor of the dull sheen of stone. If you Shield Block a melee attack with the mirrored aegis before the beginning of your next turn, the gorgon's eyes upon it flash at the triggering creature, who must attempt a Fortitude save against your class DC. On a failure, they are Slowed 1 for 1 minute as their body partially petrifies. Regardless of the outcome, that creature is temporarily immune to this effect for 24 hours."
  "Brandishing Draw":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["swashbuckler"]
  "Break Free":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["transcendence"]
    description: "You can attempt to Escape with a +2 status bonus on your check, then Stride up to twice your Speed in a straight line, and finally make a melee Strike. If you don't need to Escape or you can't move or choose not to, you still take the other actions listed."
  "Break Them Down":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["gunslinger"]
    description: "Your foes are but dross from which you carve and shoot your legend. Make a melee Strike and then a ranged Strike with a combination weapon, both against the same enemy; you don't need to change modes to do so. If the melee Strike hits, you gain a +1 circumstance bonus to the attack roll with the ranged Strike. Each attack counts toward your multiple attack penalty, but your multiple attack penalty doesn't increase until you've made both attacks. If both Strikes hit, you deal an additional 2d6 bleed damage to the enemy, and they're Dazzled until this persistent bleed damage ends."
  "Break the Sun's Legs":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["cold", "concentrate", "darkness", "transcendence"]
    description: "You make a slashing motion over the brightest source of light, whether it's a torch or the sun in the sky. A gash appears over the light source, visible to all, and devours the light. The entire area within a 120-foot burst around you is affected by a 9th-rank Darkness spell for 1 minute. The stolen light is channeled to your eyes, granting you greater darkvision for the duration of the effect."
  "Bribe Contact":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "secret"]
    description: "Cost A bribe worth at least one-tenth of the Currency per Additional PC listed on Party Treasure by level. Doubling this amount grants a +2 circumstance bonus to the check.%rRequirements You've successfully Gained a Contact.%rYou offer a bribe to your contact to help the heist in some way. Attempt a hard or very hard Deception or Diplomacy check.%rSuccess The contact accepts the bribe and you gain 1 EP.%rFailure You believe you successfully Bribed your Contact and gained 1 EP, but in fact the contact informs the opposition of the attempted bribery, adding 1 AP to the infiltration. The GM can reveal that this Edge Point grants no benefit at any point during the infiltration, as befits the story.%rCritical Failure As failure, but adding 2 AP to the infiltration."
  "Brutal Finish":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Brutish Shove":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Buckle-Cut Blitz":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    description: "Your squad dashes past enemies, slicing their boot laces and breaking their belt buckles. Signal up to two squadmates within the aura of your commander's banner; these squadmates can Stride up to their Speed as a reaction. Each enemy they are adjacent to at any point during this movement must attempt a Reflex save against your class DC or become Clumsy 1 for 1 round (Clumsy 2 on a critical failure)."
  "Buckler Dance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["stance", "swashbuckler"]
    self_effect: "Stance: Buckler Dance"
  "Bullet Dancer Stance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["stance"]
    self_effect: "Stance: Bullet Dancer Stance"
    description: "Requirements You're unarmored and wielding a simple firearm or simple combination weapon%rEffect You enter a specialized stance for a unique martial art centered around the use of simple firearms. While in this stance, the only Strikes you can make are those using bayonets, reinforced stocks, simple firearms, and simple combination weapons. You can use Flurry of Blows with these weapons. You can use other monk feats or monk abilities you have that normally require unarmed attacks with bayonets, reinforced stocks, and the melee component of simple combination weapons, so long as the feat or ability doesn't require a single, specific Strike. You can also use them with simple firearms when attacking within half the first range increment."
  "Bullseye":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["rogue"]
  "Bullying Press":
    from: "action"
    for: "subsystems"
    type: "reaction"
    category: "offensive"
    traits: ["flourish"]
    description: "Trigger You attempt a melee Strike against your opponent, but haven't rolled yet.%rRequirements You're in a duel, you're trained in Intimidation, and you rolled an Intimidation check for initiative this round.%rIf you hit, your opponent becomes Frightened 1. If your opponent is using Perception for initiative when this ability is used, they become Frightened 2 instead."
  "Burn out of Time":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["spirit", "transcendence", "void"]
    description: "An impossible amount of energy blazes in a sphere above you before compressing itself into your weapon. Strike one creature. The Strike deals an additional 3d8 spirit damage and 3d8 void damage. If the creature is reduced to 0 Hit Points, it's immediately killed and reduced to ash, not in the present, but in the recent past, erasing the consequences of their recent actions.%rIf a creature died within the last round as a result of the incinerated target's actions, that creature is returned to life with 5d8 healing Hit Points at the location that it died as its death is retroactively undone."
  "Burrow":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    traits: ["move"]
    description: "Requirements You have a burrow Speed.%rYou dig your way through dirt, sand, or a similar loose material at a rate up to your burrow Speed. You can't burrow through rock or other substances denser than dirt unless you have an ability that allows you to do so."
  "Calculate Threats":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["mental", "psyche", "psychic"]
    self_effect: "Effect: Calculate Threats"
    description: "Your subconscious automatically calculates vectors and forces when your mind is unleashed, showing you the likely path of incoming attacks to avoid. You gain a +2 circumstance bonus to AC and Reflex saves until the beginning of your next turn."
  "Call Companion":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["exploration"]
    description: "You spend 1 minute calling for a different animal companion, switching your active companion for another of your animal companions."
  "Call Follower":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "offensive"
    traits: ["exploration"]
    description: "You spend 1 minute calling for a different follower, switching your active follower for another of your followers."
  "Call Gun":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["magical"]
    description: "Effect You hold aloft a free hand and call the firearm or crossbow you chose during your daily preparations into your hand. As long as the weapon you chose is on the same plane, it appears in your hand."
  "Call Upon the Brightness":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate"]
    description: "Trigger You attempt an attack roll, skill check, or saving throw while performing the course of action from your Augury, but you haven't rolled yet%rYou gain a +1 status bonus to the triggering check, or a +2 status bonus if the result of the augury was \"woe\" and you proceeded anyway.%rEffect: Brightness Seeker"
  "Call Warshard Weapon":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["magical", "manipulate", "teleportation"]
    description: "Requirements You are not holding your warshard weapon, and you have a hand or hands free to be able to wield your warshard weapon%rEffect Your warshard weapon teleports into your hand, as long as you and your warshard weapon are on the same planet. At 15th level, you need only be on the same plane as your warshard weapon to call it, and at 18th level, you can call your warshard weapon across any distance. If your warshard weapon is in the possession of a mythic creature that's higher level than you or placed in an area where teleportation magic doesn't function, attempt a DC 16 Flat. On a success, your warshard weapon still teleports to your hand."
  "Call Wizardly Tools":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "teleportation", "wizard"]
  "Call and Response":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "bard", "concentrate", "spellshape"]
  "Call on Ancient Blood":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You attempt a saving throw against a magical effect, but you haven't rolled yet%rYour ancestors' innate resistance to magic surges before slowly ebbing down. You gain a +1 circumstance bonus to saving throws on the triggering save and other saves against magical effects until the end of this turn."
  "Call the Swarm":
    from: "feat"
    type: "action"
    cost: 3
    category: "ancestry"
    traits: ["ratfolk"]
    frequency: {"max": 1, "per": "day"}
  "Call to Axis":
    from: "action"
    for: "ancestry"
    type: "free"
    category: "interaction"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Given by Rite of Knowing%rFrequency once per day%rRequirements You are about to attempt a check to Recall Knowledge. You call upon the knowledge of Axis to ensure the accuracy of your information. You roll a second time and use the higher result. If you roll a critical failure, you get a failure instead. If you roll a success, you get a critical success instead."
  "Call to Hand":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["arcane", "manipulate", "teleportation"]
    description: "With a simple flourish of your hand, you cause your autonomous spear or polearm to teleport into your grip, provided you're on the same plane as your weapon. If you're level 20, you can call to hand your weapon regardless of where it's located. If your weapon is wielded by a mythic creature that's higher level than you, you must spend a Mythic Point to Call to Hand the weapon, otherwise this action fails—you know why it failed, but you don't learn who has control of your weapon."
  "Can't Fall Here":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["auditory", "hobgoblin", "manipulate"]
    frequency: {"max": 1, "per": "day"}
  "Cantorian Rejuvenation":
    from: "feat"
    type: "action"
    cost: 2
    category: "ancestry"
    traits: ["healing", "hobgoblin", "vitality"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Cantorian Rejuvenation"
  "Cantorian Restoration":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["healing", "hobgoblin", "vitality"]
    frequency: {"max": 1, "per": "day"}
  "Captivating Charm":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "emotion", "mental", "transcendence", "visual"]
    description: "You focus your attention on a creature within 30 feet, overwhelming its senses. The creature must succeed at a Will save against your class DC or be Fascinated by you until the start of your next turn. The condition ends if you use a hostile action against the target, but not if you use a hostile action against its allies."
  "Cast Down":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["cleric", "concentrate", "spellshape"]
  "Cast a Spell":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: []
    description: "Spells can vary in how many actions they take, as shown in the spell's stat block. You cast cantrips, spells from spell slots, and focus spells using the same process, but must expend the spell when casting a spell from a spell slot and must spend 1 Focus Point to cast a focus spell. Some rules will refer to the Cast a Spell activity, such as \"if the next action you use is to Cast a Spell.\" Any spell qualifies as a Cast a Spell activity, and any characteristics of the spell use those of the specific spell you're casting.%rCosts and Loci Some spells require you to pay a cost or provide a locus. If the spell lists a cost, you must have the listed money, valuable materials, or other resources to cast the spell (such as gems or magical reagents), and they're expended during the casting.%rA locus is an object that funnels or directs the magical energy of the spell but is not consumed in its casting. As part of Casting the Spell, you retrieve the locus (if necessary, and if you have a free hand), and you can put it away again if you so choose. Loci tend to be expensive, and you need to acquire them in advance to cast the spell, but they aren't expended like costs are. Unless noted…"
  "Catharsis":
    from: "action"
    for: "archetype"
    type: "reaction"
    traits: ["concentrate", "emotion", "mental"]
    description: "Trigger determined by your catharsis emotion%rEffect You gain the catharsis activation effects listed for your catharsis emotion. You gain that emotion's emotional fervor benefits for 3 rounds. When your emotional fervor ends, you suffer the listed emotional fallout. After using Catharsis, you can't use it again until you use the Settle Emotions activity.%rEffect: Emotional Fervor"
  "Certain Strike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Change Shape":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "polymorph"]
    description: "You return to your natural shape or adopt a new shape as described by the source of this action."
  "Change Tradition Focus":
    from: "action"
    for: "subsystems"
    type: "action"
    cost: 1
    category: "interaction"
    traits: []
    description: "Requirements You are in a duel and are trained in the skill for the tradition you're changing your focus to (Arcana for arcane, Occultism for occult, Nature for primal, or Religion for divine).%rYou change your tradition focus to another magical tradition."
  "Channel Draconic Essence":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate"]
    self_effect: "Effect: Channel Draconic Essence"
    description: "Requirements You aren't channeling draconic essence and you're holding or wearing your draconic gift%rEffect You call down a portion of the magical essence of your draconic benefactor. A Medium spectral dragon that looks like your benefactor appears in any square within 30 feet. This spectral dragon can't be targeted by any attacks or spells and has no Hit Points, saving throws, or skills. It can occupy the same space as creatures and objects. While your spectral dragon is in your space, you gain a +1 status bonus to saves against sleep and paralysis.%rChannel Draconic Essence lasts until you Channel Draconic Essence again, you Dismiss the effect, the encounter ends, you fall Unconscious, or the spectral dragon is farther than 120 feet from you, whichever comes first."
  "Channel Elements":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["aura", "kineticist", "primal"]
    self_effect: "Effect: Kinetic Aura"
    description: "Requirements Your kinetic gate isn't active.%rYou tap into your kinetic gate to make elements flow around you. Your kinetic aura activates, and as a part of this action, you can use a 1-action Elemental Blast or a 1-action stance impulse. Your kinetic aura is a 10-foot emanation where pieces of your kinetic element (or all your kinetic elements, if you can channel more than one) flow around you. The kinetic aura can't damage anything or affect the environment around you unless another ability allows it to. Channel Elements has the traits of all your kinetic elements.%rYour kinetic aura automatically deactivates if you're knocked out, you use an impulse with the overflow trait, or you Dismiss the aura. Though you can't use new impulses while your kinetic aura is deactivated, ones you already used remain, and you can still Sustain any that can be sustained. Stance impulses are linked to your kinetic aura and end when the aura deactivates."
  "Channel Smite":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["cleric", "divine"]
  "Chaotic Destiny":
    from: "action"
    for: "background"
    type: "free"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Trigger You fail a saving throw during a combat%rFrequency once per day%rEffect Chaos intervenes on your behalf at the last instant as you fail a saving throw. Draw a harrow card and reroll the saving throw you failed. You must take the result of the reroll, but if you drew a card from the suit of Crowns, improve the result by one degree of success."
  "Charmed Life":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["swashbuckler"]
  "Chassis Deflection":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["automaton"]
    description: "Trigger A critical hit deals physical damage to you.%rAttempt a DC 17 Flat. If you are successful, the attack becomes a normal hit."
  "Cheat Death":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["swashbuckler"]
    self_effect: "Effect: Panache"
  "Claw Stance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["stance"]
    self_effect: "Stance: Claw Stance"
    description: "Effect You extend the claws in your hands and focus your attention to take down single targets. The only Strikes you can make are frenzied claw unarmed attacks. These deal 1d6 slashing damage, are in the brawling group, and have the agile, finesse, grapple, unarmed, and versatile piercing traits."
  "Cleanse Soul Path":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["exploration"]
    description: "You meditate, pray, or otherwise try to reinforce your soul's connection to your armament. This takes 10 minutes. Attempt a counteract check against your soulforged corruption . The counteract rank is half your level rounded up, and the counteract check modifier is your Religion modifier. If successful, reduce the stage of soulforged corruption by 1 (to a minimum of stage 1)."
  "Clear a Path":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["gunslinger"]
    description: "Requirements You're wielding a two-handed firearm or two-handed crossbow.%rYou push outward with your weapon to clear some space before quickly reloading a fresh round. You make an Athletics check to Shove an opponent within your reach using your weapon, then Interact to reload. For this Shove, you don't need a free hand, and you add the weapon's item bonus on attack rolls (if any) to the Athletics check. If your last action or activity this round included a ranged Strike with the weapon, use the same multiple attack penalty as the last Strike you attempted with the weapon for the Shove; the Shove still counts toward your multiple attack penalty on further attacks."
  "Cleave":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["barbarian", "rage"]
  "Clever Gambit":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["rogue"]
  "Climb":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    check: {"slug": "climb", "statistic": "athletics", "options": ["action:climb"], "modifiers": [{"label": "Climb Speed", "value": 4, "type": "circumstance", "predicate": ["speed:climb"]}], "notes": {"criticalSuccess": "You move along the incline, increasing the maximum distance by 5 feet.", "success": "You move along the incline.", "criticalFailure": "You fall. If you began the climb on stable ground, you fall and land Prone."}}
    description: "Requirements You have both hands free%rYou attempt an Athletics check to move a maximum distance of 5 feet up, down, or across an incline. You're Off-Guard while climbing unless you have a climb Speed. The GM determines the DC based on the nature of the incline and environmental circumstances; you might get an automatic critical success on an incline that's trivial to climb. If your land Speed is 40 feet or higher, increase the maximum distance by 5 feet for every 20 feet of Speed above 20 feet.%rCritical Success You move along the incline, increasing the maximum distance by 5 feet.%rSuccess You move along the incline.%rCritical Failure You fall. If you began the climb on stable ground, you fall and land Prone.%rSample Climb Tasks Untrained ladder, steep slope, low-branched tree Trained rigging, rope, typical tree Expert wall with small handholds and footholds Master ceiling with handholds and footholds, rock wall Legendary smooth surface"
  "Cling":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["goblin"]
  "Clue In":
    from: "action"
    for: "class"
    type: "reaction"
    category: "interaction"
    traits: ["concentrate", "investigator"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rTrigger Another creature attempts a check that could help get you closer to answering the question at the heart of one of your active investigations.%rYou share information with the triggering creature. They gain a circumstance bonus to their check equal to your investigation bonus from Pursue a Lead. The GM can add any relevant traits to this reaction depending on the situation, such as auditory and linguistic if you're conveying information verbally.%rEffect: Clue In"
  "Cobble Together":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["exploration"]
    description: "You Craft a temporary item out of anything, anywhere, with whatever materials happen to be on hand, spending only 10 minutes to perform the initial Crafting check.%rThe temporary item must be one you've memorized or have the formula for, and must be common, non-magical, half your level or lower, and must be a weapon, armor, or a non-consumable piece of adventuring gear (non-consumable adventuring gear appears on page 291 of Player Core). Instead of a single item, you can create 10 pieces of a single type of ammunition. You can create only the physical item, not any information or magic, so for example, while you could create a blank journal or one with random pages, you couldn't use it as a scholarly journal or a religious text"
  "Cobra Envenom":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "poison"]
    frequency: {"max": 1, "per": "PT1M"}
  "Cobra Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Cobra Stance"
  "Coerce":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["auditory", "concentrate", "emotion", "exploration", "linguistic", "mental"]
    check: {"slug": "coerce", "statistic": "intimidation", "options": ["action:coerce"], "against": "will", "notes": {"criticalSuccess": "The target gives you the information you seek or agrees to follow your directives so long as they aren't likely to harm the target in any way. The target continues to comply for an amount of time determined by the GM but not exceeding 1 day, at which point the target becomes unfriendly (if it wasn't already unfriendly or hostile). However, the target is too scared of you to retaliate—at least in the short term.", "success": "As critical success, but once the target becomes unfriendly, they might decide to act against you—for example, by reporting you to the authorities or assisting your enemies.", "failure": "The target doesn't do what you say, and if they were not already unfriendly or hostile, they become unfriendly.", "criticalFailure": "The target refuses to comply, becomes hostile if they weren't already, and is temporarily immune to your Coercion for at least 1 week."}}
    description: "With threats either veiled or overt, you attempt to bully a creature into doing what you want. You must spend at least 1 minute of conversation with the creature. At the end of the conversation, attempt an Intimidation check against the target's Will DC, modified by any circumstances the GM determines. (The attitudes referenced in the effects below are summarized in the Changing Attitudes section at the bottom)%rCritical Success The target gives you the information you seek or agrees to follow your directives so long as they aren't likely to harm the target in any way. The target continues to comply for an amount of time determined by the GM but not exceeding 1 day, at which point the target becomes unfriendly (if it wasn't already unfriendly or hostile). However, the target is too scared of you to retaliate—at least in the short term.%rSuccess As critical success, but once the target becomes unfriendly, they might decide to act against you—for example, by reporting you to the authorities or assisting your enemies.%rFailure The target doesn't do what you say, and if they were not already unfriendly or hostile, they become unfriendly.%rCritical Failure The target refuses to comply,…"
  "Cognitive Loophole":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["rogue"]
  "Coiling Serpents":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    description: "Make a ranged Strike with your ikon. If the Strike hits, the target must succeed at a Reflex save against your class DC or the arrow transforms into a multitude of ethereal snakes that coil around the target, Immobilizing it until it succeeds at an Escape attempt against your class DC."
  "Collect Spirit Remnant":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "interaction"
    traits: ["concentrate", "manipulate"]
    description: "Requirements You're holding your spirit dwelling%rEffect You brandish your spirit dwelling at the location where a haunt, ghost, or other incorporeal undead was destroyed within the last minute and pray or recite ritual incantations. You coax the spirit remnant into your spirit dwelling."
  "Combat Assessment":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["commander", "fighter"]
  "Combat Grab":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Combat Reading":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["bard", "secret"]
  "Come and Get Me":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "rage"]
    self_effect: "Effect: Come and Get Me"
  "Command a Construct":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "concentrate"]
    description: "You instruct your construct companion to act as you instruct it, and according to its programming. Your construct companion gains 2 actions during this turn. See the minion trait for details."
  "Command a Thrall":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "necromancer", "thrall"]
    description: "You make one of your thralls Crawl, Drop Prone, Escape, Interact, Stand, Stride, or Strike. A thrall can take only simple Interact actions, not ones that require skill checks or complicated movements. However, they can make checks to Escape using your spell attack modifier. Escaping this way uses and counts toward your multiple attack penalty."
  "Command an Animal":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "concentrate"]
    check: {"slug": "command-an-animal", "statistic": "nature", "options": ["action:command-an-animal"], "against": "will", "notes": {"criticalSuccess": "The animal does as you command on its next turn.", "success": "The animal does as you command on its next turn.", "failure": "The animal is hesitant or resistant, and it does nothing.", "criticalFailure": "The animal misbehaves or misunderstands, and it takes some other action determined by the GM."}}
    description: "You issue an order to an animal. Attempt a Nature check against the animal's Will DC. The GM might adjust the DC if the animal has a good attitude toward you, you suggest a course of action it was predisposed toward, or you offer it a treat.%rYou automatically fail if the animal is hostile or unfriendly to you. If the animal is helpful to you, increase your degree of success by one step. You might be able to Command an Animal more easily with a feat like Ride.%rMost animals know the Drop Prone, Leap, Seek, Stand, Stride, and Strike basic actions. If an animal knows an activity, such as a horse's Gallop, you can Command the Animal to perform the activity, but you must spend as many actions on Command an Animal as the activity's number of actions. You can also spend multiple actions to Command the Animal to perform that number of basic actions on its next turn; for instance, you could spend 3 actions to Command an Animal to Stride three times or to Stride twice and then make a Strike.%rSuccess The animal does as you command on its next turn.%rFailure The animal is hesitant or resistant, and it does nothing.%rCritical Failure The animal misbehaves or misunderstands, and it takes some…"
  "Compose Missive":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "manipulate"]
    description: "You spend 10 minutes drawing, writing, or inscribing, covering the missive's surface with text, images, or embossing."
  "Conceal Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["animist", "concentrate", "necromancer", "spellshape", "witch", "wizard"]
  "Conceal an Object":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate", "secret"]
    check: {"slug": "conceal-an-object", "statistic": "stealth", "options": ["action:conceal-an-object"], "against": "perception", "notes": {"criticalSuccess": "The object remains undetected.", "success": "The object remains undetected.", "failure": "The searcher finds the object.", "criticalFailure": "The searcher finds the object."}}
    description: "You hide a small object on your person (such as a weapon of light Bulk). When you try to sneak a concealed object past someone who might notice it, the GM rolls your Stealth check and compares it to this passive observer's Perception DC. Once the GM rolls your check for a concealed object, that same result is used no matter how many passive observers you try to sneak it past. If a creature is specifically searching you for an item, it can attempt a Perception check against your Stealth DC (finding the object on success).%rYou can also conceal an object somewhere other than your person, such as among undergrowth or in a secret compartment within a piece of furniture. In this case, characters Seeking in an area compare their Perception check results to your Stealth DC to determine whether they find the object.%rSuccess The object remains undetected.%rFailure The searcher finds the object."
  "Conduct Energy":
    from: "action"
    for: "equipment"
    type: "free"
    category: "interaction"
    traits: []
    description: "Requirements Your last action or spell this turn had the acid, cold, electricity, fire, or sonic trait.%rYou channel energy into your weapon. The weapon deals 1 additional damage per weapon damage die until the start of your next turn. This damage type matches the trait of the triggering action or spell. If your triggering action or spell had multiple eligible traits, you select one of those traits.%rEffect: Conduct Energy"
  "Conduit of Void and Vitality":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["cursebound", "divine", "oracle"]
  "Confident Finisher":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["finisher"]
    description: "You make an incredibly graceful attack, piercing your foe's defenses. Make a Strike with the following failure effect.%rFailure You deal half your Precise Strike damage to the target. This damage type is that of the weapon or unarmed attack you used for the Strike."
  "Conjure Bullet":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["magical"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rEffect You conjure an ordinary level-0 bolt or bullet out of thin air and then immediately Interact to load it into your weapon. If the bolt or bullet isn't fired before the end of your turn, the effect is wasted."
  "Connect the Dots":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["auditory", "concentrate", "investigator", "linguistic"]
  "Consume Flesh":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    description: "Requirements You are adjacent to the corpse of a Small or larger creature that died in the last hour%rYou devour a chunk of the corpse. You become satiated for 1 hour."
  "Consume Thrall":
    from: "action"
    for: "class"
    type: "free"
    traits: ["concentrate", "necromancer", "occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rRequirements You have 0 Focus Points and at least one thrall with 30 feet of you%rEffect You destroy one thrall within 30 feet of you and regain 1 Focus Point. You can spend this focus point only to cast a grave spell."
  "Convincing Illusion":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["wizard"]
  "Convocation of Greed":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["arcane", "concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Spend 1 Mythic Point. The spirits of the eight runelords of greed (Kaladurnae, Fethryr, Gimmel, Ligniya, Mazmiranna, Aethusa, Haphrama, and Karzoug) appear and bolster the armaments of you and your companions. For each of the spirits, one creature of your choice within 60 feet gains a +2 item bonus to AC, attack rolls, or saving throws (chosen by the creature) for 1 minute. These bonuses increase to +4 while the creature is within 100 feet of Xanderghul, the Runelord of Pride. A creature can receive bonuses from multiple runelords at once (gaining bonuses to both AC and attack rolls, for example), but the bonuses aren't cumulative."
  "Coordinating Maneuvers":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    description: "Your team works to slip enemies into a disadvantageous position. Signal one squadmate within the aura of your banner; that squadmate can immediately Step as a free action. If they end this movement next to an opponent, they can attempt to Reposition that target as a reaction."
  "Corpse Crenellation":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rWith methodical, shocking efficiency, some Chelaxian and Hellknight squads can turn the corpses of their slain foes into temporary earthworks. Signal up to two squadmates within the aura of your commander's banner. These squadmates can Stride up to half their Speed and attempt a melee or ranged Strike against one enemy you designate as a reaction. If the enemy is reduced to 0 Hit Points by these Strikes, the enemy's body provides lesser cover to all squadmates in or adjacent to the enemy's space until the end of your next turn or until the enemy is no longer Unconscious or dead. During this time, any squadmate who Takes Cover can also first Stride up to half their Speed, but they must end this movement in or adjacent to the fallen enemy's space. A squadmate who's at least two sizes smaller than the fallen enemy instead gains standard cover.%rSpecial If one of your squadmates knows or has prepared a cantrip that deals damage and requires 2 or fewer actions to cast, they can cast it targeting the designated enemy instead of taking the other actions normally granted by this tactic, gaining all other listed benefits."
  "Coughing Dragon":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    description: "Choose either auditory or visual effects. The display gains that trait, and you attempt to counteract one or more effects in a 60-foot that have this trait. On a success, the effect is suppressed until the start of your next turn, rather than ending entirely. Use your Fireworks Lore modifier as your counteract modifier, and your counteract rank is equal to half your level (rounded up). You can spend 2 versatile vials and 3 actions (instead of the usual Cost and actions) to create an even bigger coughing dragon display that attempts to counteract both auditory and visual effects at the same time."
  "Courageous Advance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "bard", "concentrate", "spellshape"]
  "Courageous Assault":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "bard", "concentrate", "spellshape"]
  "Courageous Onslaught":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "bard", "concentrate", "spellshape"]
  "Coven Spell":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["spellshape", "witch"]
  "Cover Tracks":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "defensive"
    traits: ["concentrate", "exploration", "move"]
    description: "You cover your tracks, moving up to half your travel Speed, using the Travel Speed rules. You don't need to attempt a Survival check to cover your tracks, but anyone tracking you must succeed at a Survival check against your Survival DC if it is higher than the normal DC to Track.%rIn some cases, you might Cover Tracks in an encounter. In this case, Cover Tracks is a single action and doesn't have the exploration trait."
  "Covered Reload":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["gunslinger"]
    description: "You duck into a safe position or minimize your profile while reloading to make your next attack. Either Take Cover or attempt to Hide, then Interact to reload. As normal, you must meet the requirements to Take Cover or Hide; you must be Prone, benefiting from cover, or near a feature that allows you to Take Cover, and you need to be benefiting from cover or Concealed to a creature to Hide from that creature."
  "Craft":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "manipulate"]
    check: {"slug": "craft", "statistic": "crafting", "options": ["action:craft"], "notes": {"criticalSuccess": "Your attempt is successful. Each additional day spent Crafting reduces the materials needed to complete the item by an amount based on your level + 1 and your proficiency rank in Crafting.", "success": "Your attempt is successful. Each additional day spent Crafting reduces the materials needed to complete the item by an amount based on your level and your proficiency rank.", "failure": "You fail to complete the item. You can salvage the raw materials you supplied for their full value. If you want to try again, you must start over.", "criticalFailure": "You fail to complete the item. You ruin 10% of the raw materials you supplied, but you can salvage the rest. If you want to try again, you must start over."}}
    description: "You can make an item from raw materials. You need the Alchemical Crafting skill feat to create alchemical items and the Magical Crafting feat to create magic items.%rTo craft an item, you must meet the following requirements:%rThe item is your level or lower. An item that doesn't list a level is level 0. If the item is 9th level or higher, you must be a master in Crafting, and if it's 17th or higher, you must be legendary. The item must be common, or you must otherwise have access to it. You have an appropriate set of tools and, in many cases, a workshop. For example, you need access to a smithy to forge a metal shield, or an Alchemist's Lab to produce alchemical items. You must supply raw materials worth at least half the item's Price. You always expend at least that amount of raw materials when you Craft successfully. If you're in a settlement, you can usually spend currency to get the amount of raw materials you need, except in the case of rarer precious materials. You attempt a Crafting check after you spend 2 days of work setting up, or 1 day if you have the item's formula. The GM determines the DC to Craft the item based on its level, rarity, and other circumstances.%rIf…"
  "Craft Disharmonic Instrument":
    from: "action"
    for: "campaign"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "manipulate"]
    description: "Requirements Legendary in Crafting%rYou use legendary Vudran techniques to craft a disharmonic instrument that incorporates pieces of Kothogaz's heart. This is likely a tanpura, but legends mention other instruments and even voice enhancers. A disharmonic instrument is a virtuoso musical instrument.%rThis activity requires seven disharmonic heartslivers, the formula for a disharmonic instrument, 55,000 gp worth of rare materials, and 7 days of work. At the end of the 7 days, attempt a DC 40 Crafting check to Craft.%rCritical Success You masterfully complete the disharmonic instrument. Holding the instrument grants immunity to Kothogaz's tympanic heartbeat and many-eyed blight.%rSuccess You complete the disharmonic instrument.%rFailure You don't complete the disharmonic instrument, and you contract many-eyed blight from the heartslivers.%rCritical Failure As failure, and whenever you're on the same plane as Kothogaz, it can immediately teleport to you with its Disharmonic Door ability."
  "Crane Flutter":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["monk"]
  "Crane Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Crane Stance"
  "Crash Against Me":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["transcendence"]
    self_effect: "Effect: Crash Against Me"
    description: "Your skin becomes virtually unbreakable. Until the start of your next turn, you have resistance equal to your level to the chosen damage type.%rDuring this time, if a creature attacking you using a weapon dealing the same damage type as your resistance misses you or hits you but deals no damage due to your resistance, the weapon clangs wildly off your skin. This painful reverberation makes the attacking enemy Off-Guard and gives it a –2 circumstance penalty to attacks with that weapon until the start of the enemy's next turn."
  "Crawl":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["move"]
    description: "Requirements You are prone and your Speed is at least 10 feet.%rYou move 5 feet by crawling and continue to stay Prone."
  "Create Familiar Fulu":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["concentrate", "manipulate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day or greater (see Fulu Familiar);%rRequirements Your familiar is within 30 feet, and you have one hand free;%rEffect You make a pinching motion, and your familiar dissolves into magical energy that re-forms between your fingers as a fulu magical item. The fulu must be at least two levels lower than your level, and you don't need to spend the normal monetary cost in magical components or attempt a Crafting check. You can then choose to Affix a Talisman as part of this activity to affix your familiar fulu. While transformed, your familiar doesn't grant its normal benefits, and it remains transformed until your next daily preparations or until you Activate the fulu, at which point your familiar reappears in an unoccupied space adjacent to you."
  "Create Forgery":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "secret"]
    check: {"slug": "create-forgery", "statistic": "society", "options": ["action:create-forgery"], "dc": 20, "modifiers": [{"label": "Unspecific Handwriting", "value": 4, "type": "circumstance", "predicate": ["action:create-forgery:unspecific-handwriting"]}], "notes": {"criticalSuccess": "The observer does not detect the forgery.", "success": "The observer does not detect the forgery.", "failure": "The observer knows your document is a forgery.", "criticalFailure": "The observer knows your document is a forgery."}}
    description: "Requirements You provide the proper writing materials for your forgery.%rYou create a forged document, usually over the course of a day or a week. The GM rolls a secret DC 20 Society check. If you need to forge a specific person's handwriting, you need a sample of that person's handwriting. Otherwise, you need only to have seen a similar document, and you gain up to a +4 circumstance bonus to the check (the GM determines the bonus).%rSuccess The forgery is of good enough quality that passive observers can't notice the fake (but see Examining Forgeries).%rFailure The forgery has some obvious signs of being a fake, potentially allowing passive observers to detect it. Each time a passive observer sees the document, the GM compares your check result to the observer's Perception DC or Society DC, whichever is higher. If your result doesn't exceed a passive observer's DC, that observer knows the document is a forgery.%rExamining Forgeries A creature on the lookout for forgeries, even one who was fooled on a passive glance, can take time to closely examine a document to see if it's a forgery. They apply different techniques and analysis methods to look beyond the surface elements and…"
  "Create a Diversion":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["mental"]
    check: {"slug": "create-a-diversion", "statistic": "deception", "options": ["action:create-a-diversion"], "against": "perception", "notes": {"criticalSuccess": "You become Hidden to each creature whose Perception DC is less than or equal to your result. (The hidden condition allows you to Sneak away.) This lasts until the end of your turn or until you do anything except Step or use the Stealth skill to Hide or Sneak. If you Strike a creature, the creature remains Off-Guard against that attack, and you then become Observed. If you do anything else, you become observed just before you act unless the GM determines otherwise.", "success": "You become Hidden to each creature whose Perception DC is less than or equal to your result. (The hidden condition allows you to Sneak away.) This lasts until the end of your turn or until you do anything except Step or use the Stealth skill to Hide or Sneak. If you Strike a creature, the creature remains Off-Guard against that attack, and you then become Observed. If you do anything else, you become observed just before you act unless the GM determines otherwise.", "failure": "You don't divert the attention of any creatures whose Perception DC exceeds your result, and those creatures are aware you were trying to trick them.", "criticalFailure": "You don't divert the attention of any creatures whose Perception DC exceeds your result, and those creatures are aware you were trying to trick them."}, "variants": {"distracting-words": {"name": "Distracting Words"}, "gesture": {"name": "Gesture"}, "trick": {"name": "Trick"}}}
    description: "With a gesture, a trick, or some distracting words, you can create a diversion that draws creatures' attention elsewhere. If you use a gesture or trick, this action gains the manipulate trait. If you use distracting words, it gains the auditory and linguistic traits.%rAttempt a single Deception check and compare it to the Perception DCs of the creatures whose attention you're trying to divert. Whether or not you succeed, creatures you attempt to divert gain a +4 circumstance bonus to their Perception DCs against your attempts to Create a Diversion for 1 minute.%rSuccess You become Hidden to each creature whose Perception DC is less than or equal to your result. (The hidden condition allows you to Sneak away.) This lasts until the end of your turn or until you do anything except Step or use the Stealth skill to Hide or Sneak. If you Strike a creature, the creature remains Off-Guard against that attack, and you then become observed. If you do anything else, you become observed just before you act unless the GM determines otherwise.%rFailure You don't divert the attention of any creatures whose Perception DC exceeds your result, and those creatures are aware you were trying to trick…"
  "Crescent Spray":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["flourish"]
    description: "Requirements You are wielding a crescent cross%rEffects You Strike up to three times with the ranged version of your crescent cross. If it is currently in its melee configuration, you can swap it to its ranged configuration as a free action before attempting these Strikes. You must have a bolt already chambered for each Strike and can Interact to swap to a different capacity chamber as a free action between each Strike. Each attack counts toward your multiple attack penalty, but you do not increase your penalty until you have made all your attacks."
  "Crossbow Ace":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["ranger"]
  "Cry Havoc!":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rYour squad rallies with a resounding clangor that drowns out all other sounds of war. Choose an enemy you are observing and signal all squadmates within the aura of your commander's banner. All squadmates can Stride up to twice their Speed directly toward the target as a reaction, yelling and trampling. When any squadmate enters a square adjacent to any enemy, that enemy must attempt a Fortitude save against your class DC or take 2d6 bludgeoning damage and 2d6 sonic damage damage, plus an additional 2d6 bludgeoning and 2d6 sonic damage for every squadmate participating in Cry Havoc! (enemies who critically fail are Deafened for 1 round). Regardless of the outcome, the enemy is then temporarily immune to any further damage from Cry Havoc! for 24 hours.%rSquadmates can use Cry Havoc! while Burrowing, Climbing, Flying, or Swimming instead of Striding if they have the corresponding movement type."
  "Current Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "druid", "spellshape"]
  "Cut From the Air":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["fighter"]
  "Cycle Elemental Stance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: []
    description: "Requirements You're in one of the elemental stances%rEffect Stride or Step, and then enter a different elemental stance from the one you're currently in."
  "Dampening Harmonics":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["magical"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect You establish a force field that grants you resistance 10 to damage dealt by spells and magical abilities with the trait of your magiphage ability, except for force damage. The force field lasts for 10 minutes. Each time the field prevents damage, the duration decreases by 1 minute."
  "Dancing Dodge":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: ["move"]
    description: "Trigger You're hit by a Strike during the first round of combat%rEffect You take advantage of the fact that your foe isn't ready to anticipate your dance-like moves in combat. Add a +3 circumstance bonus to your Armor Class against the triggering Strike to determine the Strike's actual result."
  "Dashing Strike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Dastardly Dash":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["flourish", "swashbuckler"]
  "Daydream Trance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["mental", "occult"]
    self_effect: "Effect: Daydream Trance"
    description: "You fall into a half-sleeping trance. This lasts for 1 minute or until you fall Unconscious, whichever comes first. You can attempt to Dismiss your trance, but your attempt fails unless you succeed at a Will saving throw against your own class DC or spell DC, whichever is higher. Once your trance ends, you can't enter a Daydream Trance again for 1 minute. While you're in your trance, you gain the following effects:%rYou gain a +1 status bonus to Will saves. This bonus increases to +2 against mental effects. If you're legendary in Occultism, the bonus against mental effects increases to +3. You take a –1 penalty to Perception checks and initiative rolls."
  "Dazing Blow":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Dazzle Seeker":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["misfortune"]
    description: "Trigger A creature attempts a flat check to target you due to you being Concealed from it%rEffect You flash your bright scales in the creature's eyes, making it hard for them to pinpoint your exact location. The creature must roll the flat check twice and take the worse result."
  "Deadly Aim":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["flourish", "ranger"]
  "Death Drone":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["auditory", "flourish", "mental"]
    description: "The cicadas in your swarm make a droning sound that stimulates a fear response. Each creature within your swarm's space takes 6d4 mental damage and must attempt a Will save against your class DC or spell DC, whichever is higher.%rCritical Success The creature is unaffected.%rSuccess The creatures takes half damage.%rFailure The creature takes full damage, is Frightened 1, and takes a –2 circumstance penalty to Perception checks that require hearing.%rCritical Failure The creature takes double damage, is Frightened 2, and is Deafened until the start of your next turn."
  "Debilitating Dichotomy":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["concentrate", "cursebound", "divine", "mental", "oracle"]
  "Debilitating Shot":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["fighter", "flourish"]
  "Debilitating Strike":
    from: "action"
    for: "class"
    type: "free"
    category: "offensive"
    traits: ["rogue"]
    description: "Trigger Your Strike hits an off-guard creature and deals damage%rYou apply one of the following debilitations, which lasts until the end of your next turn:%rDebilitation The target takes a –10-foot status penalty to its Speeds. Debilitation The target becomes Enfeebled 1."
  "Deceptive Sidestep":
    from: "action"
    for: "subsystems"
    type: "reaction"
    category: "defensive"
    traits: ["misfortune"]
    description: "Trigger An opponent hits, but does not critically hit you, with a melee Strike.%rRequirements You're in a duel, you're trained in Deception, and you rolled a Deception check for initiative this round.%rYou draw your enemy in and pull away at the last moment. The triggering opponent must roll again and take the second result. If your opponent is using Intimidation for initiative when this ability is used, they also take a -2 circumstance penalty to the second attack roll."
  "Decipher Writing":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "secret"]
    check: {"slug": "decipher-writing", "statistic": ["arcana", "occultism", "religion", "society"], "options": ["action:decipher-writing"], "notes": {"criticalSuccess": "You understand the true meaning of the text.", "success": "You understand the true meaning of the text. If it was a coded document, you know the general meaning but might not have a word-for-word translation.", "failure": "You can't understand the text and take a –2 circumstance penalty to further checks to decipher it.", "criticalFailure": "You believe you understand the text on that page, but you have in fact misconstrued its message."}}
    description: "You attempt to decipher complicated writing or literature on an obscure topic. This usually takes 1 minute per page of text, but might take longer (typically an hour per page for decrypting ciphers or the like). The text must be in a language you can read, though the GM might allow you to attempt to decipher text written in an unfamiliar language using Society instead.%rThe DC is determined by the GM based on the state or complexity of the document. The GM might have you roll one check for a short text or a check for each section of a larger text.%rSkill%rTypically used for%rArcana%rWriting about magic or science%rOccultism%rEsoteric texts about mysteries and philosophy%rReligion%rScripture%rSociety%rCoded messages or archaic documents%rCritical Success You understand the true meaning of the text.%rSuccess You understand the true meaning of the text. If it was a coded document, you know the general meaning but might not have a word-for-word translation.%rFailure You can't understand the text and take a –2 circumstance penalty to further checks to decipher it.%rCritical Failure You believe you understand the text on that page, but you have in fact misconstrued its message.%rSample…"
  "Decompose":
    from: "action"
    for: "heritage"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["primal", "void"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Void energy seeps out of you, decaying everything within a 5-foot and causing plants and foliage to age and decompose. Natural difficult terrain is destroyed, and creatures in the area with the plant or wood trait take 1d6 void|options:area-damage damage with a Fortitude save against your class DC or spell DC, whichever is higher."
  "Deconstruct":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    description: "You deconstruct an item to provide the starting point to convert it into a new item. You need the Alchemical Crafting skill feat to deconstruct alchemical items and the Magical Crafting skill feat to deconstruct magic items.%rTo Deconstruct an item, you must meet the following requirements.%rThe item is your level or lower. An item that doesn't list a level is level 0. If the item is 9th level or higher, you must be a master in Crafting, and if it's 16th or higher, you must be legendary. The item isn't a cursed item, artifact, or other item that is similarly hard to destroy. The item isn't a consumable item. The item has a listed Price. You must have an appropriate set of tools and, in many cases, a workshop. For example, you need access to a smithy to deconstruct a metal shield or an alchemist's lab to de-concoct alchemical items. At the start of this process, you must decide if you're using the deconstructed item to build a new, similar item, of if you are simply breaking it down for raw ingredients that can be used at a later date for any item. In either case, this activity takes 1 day to perform, but if you're using the item to create a new, similar item, that day can be…"
  "Defend":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "defensive"
    traits: ["exploration"]
    description: "You move at half your travel speed with your shield raised. If combat breaks out, you gain the benefits of Raising a Shield before your first turn begins."
  "Defend Life":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "interaction"
    traits: ["concentrate"]
    description: "Trigger The target takes damage%rRequirements You're within 1 mile of the target%rEffect After calculating the amount of damage the target would take (applying weaknesses, resistances, and the like), you lose an equal number of Hit Points, and the target doesn't take any of the damage. You can't reduce the amount of Hit Points you lose in this way. The target still takes any effects that would come with the damage, however, such as the venom on a viper's fangs Strike."
  "Defensive Advance":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["champion", "flourish", "guardian"]
  "Defensive Coordination":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "bard", "concentrate", "spellshape"]
  "Defensive Recovery":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["cleric", "concentrate", "spellshape"]
  "Defensive Retreat":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    description: "You call for a careful retreat. Signal all squadmates within the aura of your banner; each can immediately Step up to three times as a free action. Each Step must take them farther away from at least one hostile creature they are observing and can only take them closer to a hostile creature if doing so is the only way for them to move toward safety (such as if they're surrounded)."
  "Defensive Roll":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["rogue"]
    frequency: {"max": 1, "per": "PT10M"}
  "Deflect Projectile":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["monk"]
  "Deimatic Display":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["druid"]
  "Delay":
    from: "action"
    for: "everyone"
    type: "free"
    category: "interaction"
    traits: []
    description: "Trigger Your turn begins.%rYou wait for the right moment to act. The rest of your turn doesn't happen yet. Instead, you're removed from the initiative order. You can return to the initiative order as a free action triggered by the end of any other creature's turn. This permanently changes your initiative to the new position. You can't use reactions until you return to the initiative order. If you Delay an entire round without returning to the initiative order, the actions from the Delayed turn are lost, your initiative doesn't change, and your next turn occurs at your original position in the initiative order.%rWhen you Delay, any Persistent Damage or other negative effects that normally occur at the start or end of your turn occur immediately when you use the Delay action. Any beneficial effects that would end at any point during your turn also end. The GM might determine that other effects end when you Delay as well. Essentially, you can't Delay to avoid negative consequences that would happen on your turn or to extend beneficial effects that would end on your turn."
  "Delay Trap":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["rogue"]
  "Deliberate Death":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["duskwalker"]
    frequency: {"max": 1, "per": "day"}
  "Demoralize":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["auditory", "concentrate", "emotion", "fear", "mental"]
    check: {"slug": "demoralize", "statistic": "intimidation", "options": ["action:demoralize"], "against": "will", "modifiers": [{"label": "Unintelligible", "value": -4, "type": "circumstance", "predicate": ["action:demoralize:unintelligible"]}], "notes": {"criticalSuccess": "The target becomes Frightened 2.", "success": "The target becomes Frightened 1."}, "consequences": {"criticalSuccess": [{"on": "target", "condition": "Frightened", "value": 2}], "success": [{"on": "target", "condition": "Frightened", "value": 1}]}}
    description: "With a sudden shout, a well-timed taunt, or a cutting put-down, you can shake an enemy's resolve. Choose a creature within 30 feet of you who you're aware of. Attempt an Intimidation check against that target's Will DC. If the target doesn't understand the language you are speaking, or you're not speaking a language, you take a –4 circumstance penalty to the check. Regardless of your result, the target is temporarily immune to your attempts to Demoralize it for 10 minutes.%rCritical Success The target becomes Frightened 2.%rSuccess The target becomes Frightened 1."
  "Demoralizing Charge":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    description: "Your team's coordinated assault strikes fear into your enemies' hearts. Signal up to two squadmates within the aura of your commander's banner; as a free action, those squadmates can immediately Stride toward an enemy they are observing.%rIf they end this movement adjacent to an enemy, they can attempt to Strike that enemy as a reaction. For each of these Strikes that are successful, the target enemy must succeed at a Will save against your class DC or become Frightened 1 (Frightened 2 on a critical failure); this is an emotion, fear, and mental effect.%rIf both Strikes target the same enemy, that enemy attempts the save only once after the final attack and takes a –1 circumstance penalty to their Will save to resist this effect (this penalty increases to –2 if both Strikes are successful or to –3 if both Strikes are successful and either is a critical hit.)%rEffect: Demoralizing Charge"
  "Designate Ally":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: []
    description: "Choose an ally you can see, who becomes your designated ally. For the next minute, whenever your designated ally is adjacent to you and you're conscious, they gain a +2 circumstance bonus to AC and Reflex saving throws. You can have only one designated ally at a time, and if you designate a new ally, the previous ally loses any benefits.%rEffect: Designate Ally"
  "Desperate Finisher":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["fighter", "press"]
  "Desperate Prayer":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["champion"]
    frequency: {"max": 1, "per": "day"}
  "Desperate Wrath":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["barbarian", "rage"]
    self_effect: "Effect: Desperate Wrath"
  "Destructive Vengeance":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: ["champion", "divine"]
    description: "Trigger An enemy in your champion's aura damages you%rEffect Bloodshed begets bloodshed as you drag your enemy toward oblivion. You increase the amount of damage you take by (ternary(gte(@actor.level,19),6,ternary(gte(@actor.level,16),5,ternary(gte(@actor.level,12),4,ternary(gte(@actor.level,9),3,ternary(gte(@actor.level,5),2,1))))))d6, and you deal (ternary(gte(@actor.level,19),6,ternary(gte(@actor.level,16),5,ternary(gte(@actor.level,12),4,ternary(gte(@actor.level,9),3,ternary(gte(@actor.level,5),2,1))))))d6 spirit|options:destructive-vengeance:enemy damage to the triggering enemy. The damage you take and deal when you use this reaction increases to 2d6 at 5th level, 3d6 at 9th level, 4d6 at 12th level, 5d6 at 16th level, and 6d6 at 19th level.%rIn addition, until the end of your next turn, your Strikes against the triggering creature deal 2 extra spirit damage. This extra damage increases to 4 at 9th level and 6 at 16th level.%rEffect: Champion's Extra Damage"
  "Detect Magic":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You cast Detect Magic at regular intervals. You move at half your travel speed or slower. You have no chance of accidentally overlooking a magic aura at a travel speed up to 300 feet per minute, but must be traveling no more than 150 feet per minute to detect magic auras before the party moves into them."
  "Determination":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "fighter"]
    frequency: {"max": 1, "per": "day"}
  "Devise a Stratagem":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "investigator"]
    frequency: {"max": 1, "per": "round"}
    self_effect: "Effect: Devise a Stratagem"
    description: "Frequency once per round%rYou assess a foe's weaknesses in combat and use them to formulate a plan of attack. Choose a creature you can see. You can Devise a Stratagem as a free action if you're aware that creature could help answer the question at the heart of one of your active investigations. Roll a d20, then decide on an attack stratagem or skill stratagem.%rAttack Stratagem If you Strike the chosen creature before the start of your next turn, your Strike gains the fortune trait and you must use the result of the d20 roll for your Strike's attack roll instead of rolling. You make this substitution only for the first Strike you make against the creature this round, not any subsequent ones. When you make this substitution, you can add your Intelligence modifier to your attack roll instead of your Strength or Dexterity modifier. If you Strike with a melee weapon, melee unarmed attack, or thrown weapon, it must have the agile or finesse trait to benefit from the substitution.%rSkill Stratagem You can't attempt to Strike the target until the start of your next turn. You gain a +1 circumstance bonus to your next Intelligence-, Wisdom-, or Charisma-based skill check or Perception…"
  "Devour Ambient Magic":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger A creature Casts a Spell with you as the only target%rEffect Your ostilli radiates cyan light as its tentacle-like filters attempt to consume the magical effect. You can attempt to counteract the triggering spell with an Arcana or Nature check and a counteract rank equal to half your level."
  "Direct Follower":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate"]
    description: "You issue an order to your follower, granting them 2 actions. This action has the auditory or visual trait depending on the method of communication used, but it must have one or the other. You can Direct your Follower to perform any of the following basic actions: Crawl, Drop Prone, Escape, Interact, Leap, Release, Seek, Sense Motive, Stand, Step, Stride, and Strike. They can only use the Strikes listed in their stat blocks. Followers that gain a burrow Speed or fly Speed can use Burrow or Fly, respectively. You can also direct your follower to use skill actions for which they meet the prerequisites. Finally, you can direct the follower to perform any actions listed in their stat block. Unlike an animal companion's support actions, these special actions don't impose restrictions on the other actions a follower can use on this turn."
  "Dirty Trick":
    from: "feat"
    type: "action"
    cost: 1
    category: "skill"
    traits: ["attack", "general", "manipulate", "skill"]
  "Disable a Device":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "disable-device", "statistic": "thievery", "options": ["action:disable-device", "action:disable-a-device"], "notes": {"criticalSuccess": "You disable the device, or you achieve two successes toward disabling a device requiring more than one success. You leave no trace of your tampering, and you can rearm the device later, if that type of device can be rearmed.", "success": "You disable the device, or you achieve one success toward disabling a device that requires more than one success.", "criticalFailure": "You trigger the device."}}
    description: "This action allows you to disarm a trap or another complex device. Often, a device requires numerous successes before becoming disabled, depending on its construction and complexity. A Thieves' Toolkit is helpful and sometimes even required to Disable a Device, as determined by the GM, and sometimes a device requires a higher proficiency rank in Thievery to disable it.%rYour Thievery check result determines your progress.%rCritical Success You disable the device, or you achieve two successes toward disabling a device requiring more than one success. You leave no trace of your tampering, and you can rearm the device later, if that type of device can be rearmed.%rSuccess You disable the device, or you achieve one success toward disabling a device that requires more than one success.%rCritical Failure You trigger the device."
  "Disarm":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack"]
    check: {"slug": "disarm", "statistic": "athletics", "options": ["action:disarm"], "against": "reflex", "weapon_traits": ["disarm"], "notes": {"criticalSuccess": "You knock the item out of the target's grasp. It falls to the ground in the target's space.", "success": "You weaken your target's grasp on the item. Further attempts to Disarm the target of that item gain a +2 circumstance bonus, and the target takes a –2 circumstance penalty to attacks with the item or other checks requiring a firm grasp on the item. The creature can end the effect by Interacting to change its grip on the item; otherwise, it lasts as long as the creature holds the item.%rEffect: Disarm (Success)", "criticalFailure": "You lose your balance and become Off-Guard until the start of your next turn."}, "consequences": {"success": [{"on": "target", "effect": "Effect: Disarm (Success)"}], "criticalFailure": [{"on": "actor", "condition": "Off-Guard", "until": "next-turn-start"}]}}
    description: "Requirements You have at least one hand free. The target can't be more than one size larger than you.%rYou try to knock an item out of a creature's grasp. Attempt an Athletics check against the target's Reflex DC.%rCritical Success You knock the item out of the target's grasp. It falls to the ground in the target's space.%rSuccess You weaken your target's grasp on the item. Further attempts to Disarm the target of that item gain a +2 circumstance bonus, and the target takes a –2 circumstance penalty to attacks with the item or other checks requiring a firm grasp on the item. The creature can end the effect by Interacting to change its grip on the item; otherwise, it lasts as long as the creature holds the item.%rEffect: Disarm (Success)%rCritical Failure You lose your balance and become Off-Guard until the start of your next turn."
  "Disarming Assault":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "flourish", "rage"]
  "Disarming Interception":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Requirements You have your fist positioned to parry%rTrigger An enemy within your reach targets you or an ally with a weapon Strike%rEffect You attempt to Disarm the weapon the enemy is attacking with. You gain a +2 status bonus to this Disarm check, and if the check is successful, the triggering attack is disrupted. If the Disarm attempt is a critical success and you have a hand free, you can catch the disarmed weapon in your hand instead of it falling to the ground in the target's space."
  "Disarming Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "stance"]
    self_effect: "Stance: Disarming Stance"
  "Disarming Twist":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Discover":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "secret"]
    description: "You watch or study an NPC to learn more about that NPC's preferences. Attempt a Perception check or an appropriate skill check determined by the GM. The DC is found in the NPC's influence stat block.%rCritical Success Choose two of the options detailed in Success below; you can choose the same option twice to learn two pieces of information from the same category.%rSuccess Choose one of the following: You learn which skill that can Influence the NPC has the lowest DC (skipping any skills that you already know), one of the NPC's personal biases, one of the NPC's resistances, or one of the NPC's weaknesses.%rFailure You learn no information.%rCritical Failure Choose a piece of information to learn about, as success, but the information is incorrect."
  "Disengage":
    from: "action"
    for: "naval-combat"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    description: "Requirements You are piloting a sea vehicle during boarding combat.%rYou attempt to break your ship free and escape the battle. Attempt a check to pilot against a very hard DC. This is typically a Sailing Lore check against the standard DC of the vessel's level + 5 (for the very hard adjustment).%rSuccess The vehicle pulls free and moves up to its Speed. It can turn normally provided it moves away from the ship it disengaged from.%rFailure The boarding combat continues."
  "Dismiss":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate"]
    description: "You end an effect that states you can Dismiss it. Dismissing ends the entire effect unless noted otherwise."
  "Dispelling Bullet":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["magical", "spellshot"]
    description: "You imprint a bullet with a field of disruptive energy built upon your magical signature, disrupting the magic of whatever it hits. Make a firearm or crossbow Strike against a foe you can see. If you hit, you attempt to counteract a spell effect active on the target (your choice, or the highest-level effect if you don't choose). Your counteract rank is equal to half your level (rounded up), and your counteract check modifier is equal to your class DC – 10."
  "Dispelling Slice":
    from: "feat"
    type: "action"
    cost: 2
