  "Gossip":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "secret"]
    description: "You seek out rumors about the infiltration's target. Attempt a normal, hard, or very hard Diplomacy check.%rCritical Success You gain inside information about the location or group you're trying to infiltrate. This grants you a +2 circumstance bonus to future checks you attempt for preparation activities for this infiltration. If you share this information, those you share it with also gain this bonus.%rSuccess You gain inside information about the place or group you're attempting to infiltrate that aids your planning.%rFailure You learn nothing.%rCritical Failure You hear a few mistaken rumors and take a -2 circumstance penalty to your next check for a preparation activity. Word spreads around that you're asking after that group or individual, increasing your Awareness Points by 1."
  "Grab an Edge":
    from: "action"
    for: "everyone"
    type: "reaction"
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "grab-an-edge", "statistic": ["reflex", "acrobatics"], "options": ["action:grab-an-edge"], "notes": {"criticalSuccess": "You grab the edge or handhold, whether or not you have a hand free, typically by using a suitable held item to catch yourself (catching a battle axe on a ledge, for example). You still take damage from the distance fallen so far, but you treat the fall as though it were 30 feet shorter.", "success": "If you have at least one hand free, you grab the edge or handhold, stopping your fall. You still take damage from the distance fallen so far, but you treat the fall as though it were 20 feet shorter. If you have no hands free, you continue to fall as if you had failed the check.", "criticalFailure": "You continue to fall, and if you've fallen 20 feet or more before you use this reaction, you take 10 bludgeoning|options:fall-damage damage from the impact for every 20 feet fallen."}}
    description: "Trigger You fall from or past an edge or handhold.%rRequirements Your hands are not tied behind your back or otherwise restrained.%rWhen you fall off or past an edge or other handhold, you can try to grab it, potentially stopping your fall. You must succeed at your choice of an Acrobatics check or a Reflex save, usually at the Climb DC. If you grab the edge or handhold, you can then Climb up using Athletics.%rCritical Success You grab the edge or handhold, whether or not you have a hand free, typically by using a suitable held item to catch yourself (catching a battle axe on a ledge, for example). You still take damage from the distance fallen so far, but you treat the fall as though it were 30 feet shorter.%rSuccess If you have at least one hand free, you grab the edge or handhold, stopping your fall. You still take damage from the distance fallen so far, but you treat the fall as though it were 20 feet shorter. If you have no hands free, you continue to fall as if you had failed the check.%rCritical Failure You continue to fall, and if you've fallen 20 feet or more before you use this reaction, you take 10 bludgeoning damage from the impact for every 20 feet fallen."
  "Graceful Poise":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "stance"]
    self_effect: "Stance: Graceful Poise"
  "Grapple":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["attack"]
    check: {"slug": "grapple", "statistic": "athletics", "options": ["action:grapple"], "against": "fortitude", "weapon_traits": ["grapple"], "notes": {"criticalSuccess": "Your target is Restrained until the end of your next turn unless you move or your target Escapes.", "success": "Your target is Grabbed until the end of your next turn unless you move or your target Escapes.", "failure": "You fail to grab your target. If you already had the target Grabbed or Restrained using a Grapple, those conditions on the target end.", "criticalFailure": "If you already had the target Grabbed or Restrained, it breaks free. Your target can either grab you, as if it succeeded at using the Grapple action against you, or force you to fall and land Prone."}, "consequences": {"criticalSuccess": [{"on": "target", "condition": "Restrained", "until": "next-turn-end"}], "success": [{"on": "target", "condition": "Grabbed", "until": "next-turn-end"}], "failure": [{"on": "target", "remove": ["Grabbed", "Restrained"]}], "criticalFailure": [{"on": "target", "remove": ["Grabbed", "Restrained"]}]}}
    description: "Requirements You have at least one free hand and your target is no more than one size larger than you.%rYou attempt to grab a creature or object with your free hand. Attempt an Athletics check against the target's Fortitude DC. You can grapple a target you already have Grabbed or Restrained without having a hand free.%rCritical Success Your target is restrained until the end of your next turn unless you move or your target Escapes.%rSuccess Your target is grabbed until the end of your next turn unless you move or your target Escapes.%rFailure You fail to grab your target. If you already had the target grabbed or restrained using a Grapple, those conditions on the target end.%rCritical Failure If you already had the target grabbed or restrained, it breaks free. Your target can either grab you, as if it succeeded at using the Grapple action against you, or force you to fall and land Prone."
  "Grim Swagger":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["auditory", "emotion", "fear", "gunslinger", "linguistic", "mental"]
    description: "Requirements You have a one-handed firearm or one-handed crossbow visibly worn or wielded.%rYou attempt to clear the room by promising a grim fate to anyone who doesn't do what you say, and quickly. Attempt a Deception or Intimidation check against the Will DCs of each creature within 30 feet, except for your allies. Regardless of whether you succeed or fail, each subject is temporarily immune to your Grim Swagger for 10 minutes.%rFor example, if you attempt a Deception check, you lie and boast about your prowess or the large group of friends on their way to back you up. If you attempt an Intimidation check, you promise everyone in the room that you're going to be the last thing they see.%rCritical Success The creature becomes Frightened 3. If it's lower level than you, it's also Fleeing for 1 round.%rSuccess The creature becomes Frightened 2."
  "Grow":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "manipulate"]
    description: "You can grow an item from a living thing, most commonly a plant. You need the Alchemical Crafting skill feat to Grow an alchemical item, the Magical Crafting skill feat to Grow a magic item, and the Snare Crafting feat to Grow a snare. To Grow an item, you must meet the following requirements.%rThe item is your level or lower. An item that doesn't list a level is level 0. If the item is 9th level or higher, you must be a master in Crafting, and if it's 16th or higher, you must be legendary. You have the formula for the item; see Getting Formulas for more information. You have an appropriate set of tools for growing the item. While cultivation and gardening tools are typical for plants, you might also use a different technique that requires a different set of tools. For instance, if you play music to help your plants grow, you might use a musical instrument instead. You must supply special fertilizers or other magical nutrients worth at least half the item's Price. You always expend at least that quantity of fertilizers and magical nutrients when you Grow successfully. If you're in a settlement, you can usually spend currency to get the amount of magical nutrients you need, except…"
  "Guardian's Deflection (Fighter)":
    from: "feat"
