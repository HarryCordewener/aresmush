    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rTrigger You fail to Lie to a creature in public%rEffect As your target sees through your lie, you spin your falsehood in a way that utilizes the crowd's reaction to bolster believability. Re-roll your Deception check to Lie with a +2 status bonus and use this check's result as the actual result to Lie."
  "Reactive Interference":
