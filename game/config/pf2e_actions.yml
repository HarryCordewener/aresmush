  "Empower Breath":
    from: "action"
    for: "class"
    type: "free"
    category: "interaction"
    traits: ["concentrate", "eidolon"]
    frequency: {"max": 1, "per": "PT1M"}
    description: "Frequency once per minute%rEffect Your eidolon gathers the power of the mightiest archdragons to make their magical breath even more spectacular. If your eidolon's next action is to use Dragon Breath, both the number of damage dice and area of Dragon Breath are doubled."
  "Empty Vessel":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You would take mental damage or be affected by a mental effect%rEffect You gain a +2 circumstance bonus to Will saves and resistance to mental damage equal to your level against the triggering effect. This applies only to the initial effect, not successive saves, persistent mental damage, or other repeated effects."
  "Encouraging Words":
    from: "action"
    for: "stamina"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "linguistic", "mental"]
    check: {"slug": "encouraging-words", "statistic": "diplomacy", "options": ["action:encouraging-words"]}
    description: "Prerequisites Trained in Diplomacy%rRequirements The target ally lost Stamina Points within the last round%rYou give an ally within 30 feet a quick pep talk, helping them recover. Attempt a Diplomacy check. The DC is usually 15, though the GM might adjust it based on the circumstances. If you have expert proficiency in Diplomacy, you can instead attempt a DC 20 check to increase the Stamina Points recovered by 5; if you have master proficiency, you can attempt a DC 30 check to increase the Stamina Points by 15; if you have legendary proficiency, you can attempt a DC 40 check to increase the Stamina Points by 25. No matter the result, the ally is temporarily immune to Encouraging Words until they either Take a Breather or rest for the day.%rCritical Success The ally recovers 2d8 Stamina Points.%rSuccess The ally recovers 1d8 Stamina Points.%rCritical Failure The ally takes 1d8 mental damage, but this can reduce only Stamina Points, never Hit Points."
  "End It!":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["brandish", "commander", "incapacitation", "tactic"]
    description: "Requirements You and your allies currently outnumber enemies on the battlefield, and you or a squadmate have reduced an enemy to 0 Hit Points since the start of your last turn.%rAt your proclamation that victory is already at hand, your allies march forward with an authoritative stomp, scattering your enemies in terror. Signal all squadmates within the aura of your banner; you and each ally can Step as a free action directly toward a hostile creature. Any hostile creatures within 10 feet of a squadmate after this movement must attempt a Will save against your class DC; on a failure they become Fleeing for 1 round, and on a critical failure they become fleeing for 1 round and Frightened 2. This is an emotion, fear, and mental effect."
  "Energized Font":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["gnome"]
    frequency: {"max": 1, "per": "day"}
  "Energy Ablation":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["spellshape", "wizard"]
    self_effect: "Effect: Energy Ablation"
  "Energy Emanation":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["primal"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEnergy bursts forth from your body. You deal ceil(@actor.level/2)d6[@actor.flags.system.elementalHeartDwarf.damageType]|options:area-damage damage to all adjacent creatures (Reflex save using your class DC or spell DC, whichever is higher). At 3rd level, and every 2 levels thereafter, this damage increases by 1d6 damage."
  "Energy Fusion":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
