  "No Scar but This":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "healing", "transcendence", "vitality"]
    description: "Your wounds knit shut with hardly a scratch. You regain (ceil(@actor.level/2))d8 healing vitality|shortLabel Hit Points. At 3rd level and every 2 levels thereafter, the healing increases by 1d8."
  "Nonlethal Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
