    type: "free"
    category: "interaction"
    traits: ["divine", "fortune"]
    description: "Trigger You fail a saving throw, attack roll, or skill check%rEffect You twist the prophecy in your favor, which will have consequences later. Reroll the failed check. You must use the result of the second roll.%rFor 24 hours afterward, the GM can force you to reroll a successful saving throw, attack roll, or skill check as fate balances the scale. This is a misfortune effect. You can't use prophecy's pawn again until the GM uses this option or 24 hours pass, whichever comes first."
  "Protective Screen":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    description: "You've trained your allies in a technique designed to protect war mages. Signal one squadmate; as a reaction, that squadmate Strides directly toward any other squadmate who is within the aura of your banner. If the first squadmate ends their movement adjacent to another squadmate, the second squadmate does not trigger reactions when casting spells or making ranged attacks until the end of their next turn or until they are no longer adjacent to the first squadmate, whichever comes first. If the first squadmate ends their movement adjacent to more than one other squadmate, the first squadmate must choose which of the adjacent squadmates gains this benefit."
  "Psychic Defense":
    from: "action"
    for: "subsystems"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate", "magical"]
    description: "Trigger Your opponent uses a psychic manifestation against you.%rRequirements You're in a psychic duel and are psychically centered.%rYou gain the benefit matching your psychic center against the triggering manifestation. Then your psychic center is expended.%rArmor of Insight (Perception) Sensing the incoming attack, you make your mind resist psychic harm. You gain resistance equal to half your level (minimum 1) to mental damage against the triggering effect. This resistance is doubled if you're a master in Perception and tripled if you're legendary.%rEmpathic Orbit (Diplomacy) Displaying empathy, you sow doubt in your attacker to diminish their resolve for psychic combat. The opponent is Stupefied 1 until the end of their next turn or Stupefied 2 if you're legendary in Diplomacy.%rIre's Spear (Intimidation) Blazing anger surges in your mind, causing backlash to anyone who harms you. If the manifestation damages you, the opponent takes damage equal to the counteract rank of the manifestation it used against you. This damage is doubled if you're a master of Intimidation or tripled if you're legendary.%rRational Labyrinth (Occultism) Analytically breaking down the attack, you…"
  "Psychometric Assessment":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "emotion", "exploration", "mental", "occult"]
    description: "Requirements Your bare hands are touching an object in which you detected psychometric resonance%rEffect You spend 1 minute concentrating on the object to get a vision of the face of the person who imbued the item with such emotion in the first place. If the associated emotion is painfully negative, you might take 1d6 mental damage, as determined by the GM."
  "Puncture Flesh":
    from: "action"
