  "Harrow the Fiend":
    from: "action"
    for: "background"
    type: "free"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Trigger You start your turn in combat against a foe or foes you recognize to be fiends%rFrequency once per day%rEffect You gain a +1 status bonus on all Strikes or spell attack rolls against fiends for the duration of combat. Once during combat, you can draw a harrow card after you determine if a Strike or spell attack on a fiend hits but before you determine damage or effects caused to the fiend. If you draw a card from the suit of Hammers, increase the degree of success of your Strike or spell attack by one.%rEffect: Harrow the Fiend"
  "Harvest Blood":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    self_effect: "Effect: Harvest Blood"
    description: "Requirements Your last action was a successful piercing or slashing melee Strike against a creature that is not immune to bleed%rEffect You consume the blood lingering upon your weapon. You reduce the value of your drained condition by 1, gain temporary Hit Points equal to your Constitution modifier, and gain a +1 circumstance bonus to saving throws against that creature's spells for 1 minute, or until you Harvest Blood from another creature."
  "Harvest Heartsliver":
    from: "action"
    for: "campaign"
    type: "reaction"
    category: "offensive"
    traits: ["manipulate"]
    description: "Requirements You're inside Kothogaz's body.%rYou attempt to steal a section of Kothogaz's heart. Attempt an attack roll or a DC 40 Acrobatics, DC 40 Athletics, DC 40 Medicine, DC 40 Nature, DC 40 Occultism, or DC 40 Religion check.%rCritical Success You steal a small disharmonic heartsliver, stow it on your person, and can exit Kothogaz's body.%rSuccess As critical success, but you can't exit.%rFailure You take Kothogaz's Swallow Whole damage.%rCritical Failure You take double Kothogaz's Swallow Whole damage and are Deafened by its heartbeat for 1 minute."
  "Haunting Visage":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "eidolon", "manipulate", "visual"]
    description: "Requirements Your eidolon is condensed.%rYour eidolon suddenly shifts itself into a terrifying shape of its choosing, rather than a simple mound, by closely controlling the positioning of its component bodies. The eidolon attempts to demoralize a creature within 15 feet; this Demoralize attempt loses the auditory trait, gains the visual trait, and the eidolon doesn't take a –4 circumstance penalty to the check if they don't share a language with their target. On a success or critical success, the target is additionally Off-Guard for 1 round."
  "Head Stomp":
    from: "feat"
    type: "action"
