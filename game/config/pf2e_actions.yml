    traits: ["druid"]
  "Ready":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["concentrate"]
    description: "You prepare to use an action that will occur outside your turn. Choose a single action or free action you can use, and designate a trigger. Your turn then ends. If the trigger you designated occurs before the start of your next turn, you can use the chosen action as a reaction (provided you still meet the requirements to use it). You can't Ready a free action that already has a trigger.%rIf you have a multiple attack penalty and your readied action is an attack action, your readied attack takes the multiple attack penalty you had at the time you used Ready. This is one of the few times the multiple attack penalty applies when it's not your turn."
  "Ready, Aim, Fire!":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rYou signal a volley of ranged attacks from your allies. Choose an enemy and signal up to three squadmates within the aura of your commander's banner; your squadmates can Interact to reload as a free action and attempt a ranged Strike against the enemy as a reaction%rSpecial If one of your squadmates knows or has prepared a cantrip with a range of 30 feet or more that deals damage and requires 2 or fewer actions to cast, they can cast it targeting the enemy instead of taking the other actions normally granted by this tactic."
  "Reap the Field":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["transcendence"]
    description: "Requirements Your previous action was a successful Strike with the Mortal Harvest%rEffect Time seems to lag as you blur across the battlefield, deciding the fate of many in a moment. Stride up to half your Speed and make another melee Strike with the mortal harvest against a different creature.%rThis Strike uses the same multiple attack penalty as your previous Strike, but counts toward your multiple attack penalty as normal."
  "Rearrange Bones":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["manipulate"]
    description: "You arrange your bones into the form of a Small or Medium humanoid's skeleton. This doesn't change your normal Speeds, Strikes, or senses. If you are wearing heavy clothing or impersonating a skeleton, this counts as setting up a disguise for the Impersonate use of Deception and grants a +1 status bonus to those Deception checks."
  "Reason Rapidly":
