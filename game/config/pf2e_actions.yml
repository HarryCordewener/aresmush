    category: "class"
    traits: ["death", "finisher", "swashbuckler"]
  "Ley Line Conduit":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "druid", "manipulate", "spellshape"]
    frequency: {"max": 1, "per": "PT1M"}
  "Liar's Hidden Blade":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["spirit", "transcendence"]
    description: "Requirements Your previous action was an unsuccessful Strike with the weapon from the Shadow Sheath%rEffect The shadow weapon you threw fades, the distraction covering your true intention all along—a second strike in hidden in the blind spot of the first! Interact to draw another weapon from the shadow sheath, then Strike with it at the same multiple attack penalty as the unsuccessful attack. The opponent is Off-Guard to this attack.%rThis Strike counts toward your multiple attack penalty as normal. After the Strike resolves, you can Interact to draw another weapon from the shadow sheath."
  "Liberate Self":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["divine", "fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rRequirements You're Grabbed, Immobilized, or Restrained%rEffect Attempt to Escape, rolling the check twice and taking the better result."
  "Liberating Step":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["champion"]
    description: "Trigger An enemy damages, grabs, or restrains your ally, and both are in your champion's aura%rYou free an ally from restraint.%rIf the trigger was an ally taking damage, the ally gains resistance to all damage against the triggering damage equal to 2 + your level.%rThe ally can attempt to break free of effects grabbing, Restraining, Immobilizing, or Paralyzing them. They either attempt a new save against one such effect that allows a save, or attempt to Escape from one effect as a free action.%rIf they can move, the ally can Step as a free action, even if they didn't need to escape.%rEffect: Champion's Resistance"
  "Lie":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["auditory", "concentrate", "linguistic", "mental", "secret"]
    check: {"slug": "lie", "statistic": "deception", "options": ["action:lie"], "against": "perception", "notes": {"criticalSuccess": "The target believes your lie.", "success": "The target believes your lie.", "failure": "The target doesn't believe your lie and gains a +4 circumstance bonus against your attempts to Lie for the duration of your conversation. The target is also more likely to be suspicious of you in the future.", "criticalFailure": "The target doesn't believe your lie and gains a +4 circumstance bonus against your attempts to Lie for the duration of your conversation. The target is also more likely to be suspicious of you in the future."}}
    description: "You try to fool someone with an untruth. Doing so takes at least 1 round, or longer if the lie is elaborate. You roll a single Deception check and compare it against the Perception DC of every creature you are trying to fool. The GM might give them a circumstance bonus based on the situation and the nature of the lie you are trying to tell. Elaborate or highly unbelievable lies are much harder to get a creature to believe than simpler and more believable lies, and some lies are so big that it's impossible to get anyone to believe them.%rAt the GM's discretion, if a creature initially believes your lie, it might attempt a Perception check later to Sense Motive against your Deception DC to realize it's a lie. This usually happens if the creature discovers enough evidence to counter your statements.%rSuccess The target believes your lie.%rFailure The target doesn't believe your lie and gains a +4 circumstance bonus against your attempts to Lie for the duration of your conversation. The target is also more likely to be suspicious of you in the future."
  "Life Block":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger The spell's target would take damage%rEffect Reduce the triggering damage by 10, but you lose 5 Hit Points. Even if this reduces the damage to 0, the target still takes any effects that would come with the damage, such as the poison on a viper's fangs Strike.%rHeightened (+2) The reaction reduces the damage by another 10, and you lose 5 more Hit Points. If you want to lose fewer Hit Points, you can choose to lower the damage reduction and HP lost to what any lower-rank version of the spell could do without lowering the spell's actual rank."
  "Life Leap":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["gnome", "move", "teleportation"]
  "Lightning Qi":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["monk"]
    frequency: {"max": 1, "per": "PT10M"}
  "Lightning Swap":
    from: "feat"
    type: "action"
    cost: 1
