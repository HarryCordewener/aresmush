  "Giant-Felling Comet":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["spirit", "transcendence"]
    description: "You shoot the Starshot, causing a detonation in a 5-foot burst within 60 feet. Each creature in the area must succeed at a Reflex save against your class DC or take spirit damage equal to your normal Strike damage with the starshot. Creatures larger than you take a –2 circumstance penalty to their saving throws. This shot requires any ammunition that would normally be required for the weapon."
  "Glean Lore":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["divine", "oracle", "secret"]
  "Glimpse Vulnerability":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    traits: ["esoterica", "manipulate"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rRequirements You are holding your implement%rEffect You glimpse a hidden vulnerability and then strengthen it to aid you. Select a creature you can see. Until you Glimpse Vulnerability again, that target gains weakness 2 against your unarmed and weapon Strikes.%rEffect: Glimpse Vulnerability"
  "Glimpse of Redemption":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["champion", "divine"]
    description: "Trigger An enemy damages your ally, and both are in your champion's aura%rEffect Your enemy hesitates under the weight of sin as visions of redemption play in their mind's eye. The enemy must choose to repent or refuse, with the following effects. If the enemy is mindless or otherwise unable to repent, use the refuse result.%rRepent The ally is unharmed by the triggering damage.%rRefuse The ally gains resistance to all damage against the triggering damage equal to 2 + your level. After the damaging effect is applied, the enemy becomes Enfeebled 2 until the end of its next turn.%rEffect: Champion's Resistance"
  "Gluttonous Feast":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["arcane", "concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Spend 1 Mythic Point. The spirits of four runelords of gluttony (Kaliphesta, Atharend, Aethusa, and Goparlis) briefly appear in spaces within 60 feet of you. Each living creature adjacent to at least one of the spirits takes 4d6 void damage per adjacent spirit, to a maximum of 16d6 void damage if they are adjacent to all four spirits. Each target receives a basic Fortitude save against the damage, against the higher of your class DC or spell DC, but Xanderghul, the Runelord of Pride, treats the result of his saving throw as one degree of success worse.%rYou gain temporary Hit Points equal to half the damage a single creature takes from this effect; calculate these temporary Hit Points using the creature that took the most damage. These temporary Hit Points last 1 minute."
  "Goblin Jubilee":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["fire", "sonic", "visual"]
    description: "Chaos fills a 20-foot within 120 feet. All creatures in the area takes (max(3,(3 + floor((@actor.level - 10)/ 3))))d6 fire,(max(3,(3 + floor((@actor.level - 10)/ 3))))d6 sonic|options:area-damage damage and must attempt a Fortitude save. Every 3 levels, the fire damage and sonic damage each increase by 1d6. You can expend 2 versatile vials instead of 1 to increase the fire and sonic damage by 1d6 each, or by 2d6 each at 16th level.%rCritical Success The creature is unaffected.%rSuccess The creature is Dazzled and Deafened until the end of its next turn and takes half damage.%rFailure The creature is dazzled and deafened for 1 minute and takes full damage.%rCritical Failure The creature is Blinded for 1 round, dazzled and deafened for 1 minute, and takes double damage."
  "Goblin Scuttle":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["goblin"]
  "Goblin Song":
    from: "feat"
    type: "action"
