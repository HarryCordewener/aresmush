  "Impersonate":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "manipulate", "secret"]
    check: {"slug": "impersonate", "statistic": "deception", "options": ["action:impersonate"], "against": "perception", "notes": {"criticalSuccess": "You trick the creature into thinking you're the person you're disguised as. You might have to attempt a new check if your behavior changes.", "success": "You trick the creature into thinking you're the person you're disguised as. You might have to attempt a new check if your behavior changes.", "failure": "The creature can tell you're not who you claim to be.", "criticalFailure": "The creature can tell you're not who you claim to be, and it recognizes you if it would know you without a disguise."}}
    description: "You create a disguise to pass yourself off as someone or something you are not. Assembling a convincing disguise takes 10 minutes and requires a Disguise Kit, but a simpler, quicker disguise might do the job if you're not trying to imitate a specific individual, at the GM's discretion.%rIn most cases, creatures have a chance to detect your deception only if they use the Seek action to attempt Perception checks against your Deception DC. If you attempt to directly interact with someone while disguised, the GM rolls a secret Deception check for you against that creature's Perception DC instead.%rIf you're disguised as a specific individual, the GM might give creatures you interact with a circumstance bonus based on how well they know the person you're imitating, or the GM might roll a secret Deception check even if you aren't directly interacting with others.%rSuccess You trick the creature into thinking you're the person you're disguised as. You might have to attempt a new check if your behavior changes.%rFailure The creature can tell you're not who you claim to be.%rCritical Failure The creature can tell you're not who you claim to be, and it recognizes you if it would know you…"
  "Implausible Infiltration":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["magical", "move", "rogue"]
  "Implement's Interruption":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: ["magical", "thaumaturge"]
    description: "Trigger The target of your Exploit Vulnerability uses a concentrate, manipulate, or move action, or leaves a square during a move action it's using.%rRequirements You're holding your weapon implement and are benefiting from Exploit Vulnerability against a creature. The creature must be within your reach if you're wielding a melee weapon, or within 10 feet if you're wielding a ranged weapon.%rYour weapon senses a moment of weakness and guides your hand to strike down a foe. Make a Strike against the triggering creature with your weapon implement. If your attack is a critical hit, you disrupt the triggering action. This Strike doesn't count toward your multiple attack penalty, and your multiple attack penalty doesn't apply to this Strike."
  "Impossible Flurry":
    from: "feat"
    type: "action"
