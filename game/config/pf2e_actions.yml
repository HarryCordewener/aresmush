  "Name Drop":
    from: "action"
    for: "background"
    type: "reaction"
    category: "interaction"
    traits: ["auditory", "fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day;%rTrigger You fail or critically fail a Deception, Diplomacy, Intimidation, or Society check%rEffect Reroll the skill check. You must use the second result, even if it's worse."
  "Naval Training":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your instructions make it easier for you and your allies to swim through dangerous waters. Signal all squadmates; until the end of your next turn, you and each ally gain a swim Speed of 20 feet.%rEffect: Naval Training%rSpecial If you have this tactic prepared, you can use Warfare Lore in place of Athletics for checks you make to Swim."
  "Nimble Dodge":
