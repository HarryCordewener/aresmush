  "Trip":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack"]
    check: {"slug": "trip", "statistic": "athletics", "options": ["action:trip", "inflicts:prone"], "against": "reflex", "weapon_traits": ["trip", "ranged-trip"], "notes": {"criticalSuccess": "The target falls and lands Prone and takes 1d6 bludgeoning damage.", "success": "The target falls and lands Prone.", "criticalFailure": "You lose your balance and fall and land Prone."}, "consequences": {"criticalSuccess": [{"on": "target", "condition": "Prone"}, {"on": "target", "damage": "1d6", "type": "bludgeoning"}], "success": [{"on": "target", "condition": "Prone"}], "criticalFailure": [{"on": "actor", "condition": "Prone"}]}}
    description: "Requirements You have at least one hand free. Your target can't be more than one size larger than you.%rYou try to knock a creature to the ground. Attempt an Athletics check against the target's Reflex DC.%rCritical Success The target falls, lands Prone, and takes 1d6 bludgeoning damage.%rSuccess The target falls and lands prone.%rCritical Failure You lose your balance, fall, and land prone."
  "Triumphant Inspiration":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["bard"]
  "True Hypercognition":
    from: "feat"
    type: "action"
