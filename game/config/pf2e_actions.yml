  "Healing Transformation":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["druid", "spellshape"]
  "Heaven Rains an Ending":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["transcendence"]
    description: "You shoot an arrow that multiplies into a dense cloud of weapons. Make one ranged Strike with a –2 penalty against each enemy you are aware of within a cone as long as your weapon's first range increment. Roll the damage only once for all targets, and all the Strike's damage is spirit damage instead of its normal type. Each attack counts toward your multiple attack penalty, the penalty doesn't increase until you have made all your attacks."
  "Heavy is the Crown":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "mental", "spirit", "transcendence"]
    description: "The weight of authority falls heavily upon you, as well as nearby creatures. All enemies in a 15-foot burst within 60 feet take spirit damage damage equal to your level with a Will save against your class DC. Any enemy that fails its save must immediately kneel, dropping Prone as a free action."
  "Hellbreaker Strike":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["holy"]
    description: "Make a weapon or unarmed Strike. This counts as two attacks when determining your multiple attack penalty. If your Strike hits, you deal an additional 2d8 spirit damage. At 18th level, this increases to 3d8 spirit damage."
  "Heroic Presence":
