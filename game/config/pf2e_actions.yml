    traits: []
    self_effect: "Effect: Raise a Shield"
    description: "Requirements You are wielding a shield.%rYou position your shield to protect yourself. When you have Raised a Shield, you gain its listed circumstance bonus to AC. Your shield remains raised until the start of your next turn."
  "Raise the Horde":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "magical", "manipulate"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rEffect Your undead horde appears in an unoccupied space within 30 feet. Choose whether your horde consists of skeletons or zombies, which affects the type of damage it deals with Mobbing Assault. Your horde remains summoned until the end of your next turn, but you can Sustain the effect for up to 1 minute. The effect also ends if you end your turn more than 120 feet away from the horde. When you first use Raise the Horde and each time you Sustain the effect, you can have the horde Stride.%rWhen Raise the Horde ends, the undead that comprise your horde collapse lifelessly to the ground and quickly rot away. They can no longer be targeted or used for actions."
  "Raise the Walls":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["force", "transcendence"]
    description: "You Raise the mirrored aegis, which summons ethereal shields that surround you and one ally of your choice within 15 feet in a tortoise shield formation. You and the ally gain a +1 status bonus to AC, Reflex saves, and any save against a force, spirit, vitality, or void effect for 1 minute.%rEffect: Raise the Walls"
  "Rally":
    from: "action"
    for: "stamina"
    type: "passive"
    category: "interaction"
    traits: ["auditory", "emotion", "exploration", "linguistic", "mental"]
    description: "Prerequisites trained in Diplomacy, Intimidation, or Performance%rYou spend 1 minute encouraging your ally. Though this action typically has the auditory and linguistic traits, if you're using the Performance skill, the GM might adjust the traits for this action to match the traits for your type of performance.%rAttempt a DC 15 skill check. The GM might adjust this DC based on the circumstances, such as attempting to Rally an ally who just suffered a humiliating defeat.%rCritical Success The ally can spend 1 Resolve Point to regain all their Stamina Points.%rSuccess You can continue encouraging your ally for a total of 10 minutes. If you do, they can spend 1 Resolve Point to regain all their Stamina Points.%rCritical Failure The ally takes 1d8 mental damage, but this can reduce only Stamina Points, never Hit Points."
  "Rallying Cry":
