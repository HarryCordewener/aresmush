    description: "Your eidolon unleashes a primal roar or other terrifying noise that fits your eidolon's form. Your eidolon attempts to demoralize each enemy that can hear the roar, comparing the result of a single Intimidation check to the Will DC of each target; this check doesn't take any penalty for not sharing a language."
  "Project Persona":
