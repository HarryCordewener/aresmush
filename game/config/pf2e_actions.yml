  "Nudge the Scales":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["cursebound", "divine", "healing", "oracle", "spirit"]
  "Nudging Whisper":
    from: "action"
    for: "class"
    type: "passive"
    category: "offensive"
    traits: ["curse", "divine", "emotion", "mental"]
    description: "You lace your words with echoes of your ancestors' magic. If your next action is to Request, you gain the effects of the Shameless Request feat, and if your next action is to Lie, you gain the effects of the Confabulator feat. If you critically fail at either check, the target and anyone who witnessed you fail becomes immune to your Nudging Whisper for one day, though this doesn't necessarily let them know that you attempted to charm them."
  "Objection":
    from: "action"
    for: "aftermath"
    type: "reaction"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "PT1M"}
    description: "Frequency once per minute%rTrigger You're about to attempt a saving throw against a linguistic effect%rEffect Your devil's eye crackles with infernal glee as you discover a loophole in the wording of the triggering effect. You roll your saving throw twice, taking the higher result."
  "Offer Story":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["auditory", "concentrate", "divine", "linguistic", "mental"]
    description: "You share a story of your travels with a creature within 30 feet. You gain the blessing of Isthralei as a +1 status bonus to AC and Will saves until the end of your next turn. On their next turn, the creature you shared a story with can take a single action, which has the auditory, concentrate, linguistic, and mental traits, to respond with their own story to gain the same benefits until the end of the following turn.%rEffect: Offer Story"
  "Once Bitten":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: []
    description: "Trigger A creature adjacent to you hits you with a melee unarmed Strike%rRequirements You have prepared your clothing to poison attackers%rEffect The triggering creature is exposed to the suffused poison, and the poison becomes inert."
  "One Moment till Glory":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "emotion", "mental", "transcendence"]
    description: "You rally your allies, carrying them from the brink of disaster to the verge of victory. Each ally in your aura can immediately attempt a new saving throw with a +2 status bonus against one ongoing negative effect or condition currently affecting it that required a save. Use the result of the new save to determine the outcome of the effect, unless the new save would have a worse result than the original save, in which case nothing happens. Each ally can gain this benefit against a given effect only once.%rEffect: One Moment till Glory"
  "One Shot, One Kill":
    from: "action"
    for: "class"
    type: "free"
    category: "offensive"
    traits: ["gunslinger"]
    description: "Trigger You roll Stealth for initiative.%rYour first shot is the deadliest. Interact to draw a firearm or crossbow. Your first successful Strike with that weapon during this encounter deals an additional 1d6 precision damage. This precision damage increases to 2d6 at 9th level and 3d6 at 15th level."
  "One for All":
    from: "feat"
