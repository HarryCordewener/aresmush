  "Guerrilla Assault":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rEffect You Interact to reload a sling or blowgun and then Strike. If the Strike is successful and you were undetected or unnoticed by the target when you made the attack, you are now Hidden from the target after the attack, as they cannot tell where the attack came from."
  "Guiding Finish":
