  "Dutiful Retaliation":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: ["eidolon", "occult"]
    description: "Trigger An enemy within 15 feet of you hits you with a Strike and deals damage to you%rRequirements Your eidolon is within 15 feet of you%rEffect Your eidolon instinctively flashes with ectoplasmic energy, allowing them to strike back against an enemy who dares to harm you. Your eidolon makes a melee unarmed Strike against the triggering enemy, even if that enemy isn't within your eidolon's reach."
  "Earn Income":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    description: "You can use a skill to earn money during downtime. You must be trained in the skill to do so. This takes time to set up, and your income depends on your proficiency rank and how lucrative a task you can find. Because this process requires a significant amount of time and involves tracking things outside the progress of adventures, it won't come up in every campaign. The most typical ways to earn income, detailed further in this section are:%rCrafting goods for the market (Crafting) Practicing a Trade (Lore) Staging a Performance (Performance) In some cases, the GM might let you use a different skill to Earn Income through specialized work. Usually, this is scholarly work, such as using Religion in a monastery to study old texts—but giving sermons at a church would still fall under Performance instead of Religion. You also might be able to use physical skills to make money, such as using Acrobatics to perform feats in a circus or Thievery to pick pockets. If you're using a skill other than Crafting, Lore, or Performance, the DC tends to be significantly higher.%rEarn Income Downtime%rYou use one of your skills to make money during downtime. The GM assigns a task level representing…"
  "Eat Fortune":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["concentrate", "divine", "tengu"]
