    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect Your animal companion screeches and howls, empowered with natural magic. All creatures in a 30-foot take (floor(@actor.level/2))d6 sonic|options:area-damage damage for every 2 levels your companion has, with a Fortitude save against your spell DC. Creatures that fail become Frightened 1, and creatures that critically fail become Frightened 2. The fright is an emotion, fear, and mental effect."
  "Primal Roar":
    from: "action"
