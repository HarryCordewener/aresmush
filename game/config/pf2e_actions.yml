    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Requirements You're under the effects of Untamed Form%rEffect You change into any other shape on your untamed form list. If the duration of that shape is different from the one you were previously in, use the shorter duration to determine your duration remaining."
  "True Shapeshifter":
    from: "feat"
