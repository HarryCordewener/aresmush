    description: "Trigger You're hit with an unarmed Strike or a Strike with a non-reach melee weapon.%rFrequency once per day%rSeveral of your thorns break off and hook into your attacker's body. You deal (ceil(@actor.level/2)d8) piercing damage to the triggering creature. It attempts a Reflex save against the higher of your class DC or spell DC. On a critical failure, the creature also takes (1d4+ceil(@actor.level/2)-1) bleed damage as your thorns embed in its flesh.%rAt 3rd level, and every 2 levels thereafter, this damage increases by 1d8, and the persistent bleed damage increases by 1."
