  "Perform":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate"]
    check: {"slug": "perform", "statistic": "performance", "options": ["action:perform"], "notes": {"criticalSuccess": "Your performance impresses the observers, and they're likely to share stories of your ability.", "success": "You prove yourself, and observers appreciate the quality of your performance.", "failure": "Your performance falls flat.", "criticalFailure": "You demonstrate only incompetence."}, "variants": {"acting": {"name": "Acting"}, "comedy": {"name": "Comedy"}, "dance": {"name": "Dance"}, "keyboards": {"name": "Play keyboard instrument"}, "oratory": {"name": "Oratory"}, "percussion": {"name": "Play percussion instrument"}, "singing": {"name": "Singing"}, "strings": {"name": "Play string instrument"}, "winds": {"name": "Play wind instrument"}}}
    description: "When making a brief performance—one song, a quick dance, or a few jokes—you use the Perform action. This action is most useful when you want to prove your capability or impress someone quickly. Performing rarely has an impact on its own, but it might influence the DCs of subsequent Diplomacy checks against the observers, or even change their attitudes if the GM sees fit.%rPerformance%rAdditional Traits%rExamples%rActing%rAuditory, linguistic, and visual%rDrama, pantomime, puppetry%rComedy%rAuditory, linguistic, and visual%rBuffoonery, joke telling, limericks%rDance%rMove and visual%rBallet, huara, jig, macru%rPlay Keyboard%rAuditory and manipulate%rHarpsichord, organ, piano%rOratory%rAuditory and linguistic%rEpic, ode, poetry, storytelling%rPlay Percussion%rAuditory and manipulate%rChimes, drum, gong, xylophone%rSinging%rAuditory and linguistic%rBallad, chant, melody, rhyming%rPlay Strings%rAuditory and manipulate%rFiddle, harp, lute, viol%rPlay Winds%rAuditory and manipulate%rBagpipe, flute, recorder, trumpet%rCritical Success Your performance impresses the observers, and they're likely to share stories of your ability.%rSuccess You prove yourself, and observers appreciate the…"
  "Person of Interest":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["investigator"]
    frequency: {"max": 1, "per": "PT10M"}
  "Pick a Lock":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "pick-a-lock", "statistic": "thievery", "options": ["action:pick-a-lock"], "notes": {"criticalSuccess": "You unlock the lock, or you achieve two successes toward opening a lock that requires more than one success. You leave no trace of your tampering.", "success": "You open the lock, or you achieve one success toward opening a lock that requires more than one success. You leave behind damage that indicates the lock was picked on close scrutiny.", "criticalFailure": "You break your toolkit and leave behind obvious damage. Fixing a broken toolkit requires using Crafting to Repair it or else swapping in replacement picks."}}
    description: "Requirements You're holding or wearing a Thieves' Toolkit.%rOpening a lock without a key is very similar to Disabling a Device, but the DC of the check is determined by the complexity and construction of the lock you are attempting to pick. Locks of higher quality might require multiple successes to unlock. If you lack the proper tools, the GM might let you use improvised picks, which are treated as a shoddy toolkit.%rCritical Success You unlock the lock, or you achieve two successes toward opening a lock that requires more than one success. You leave no trace of your tampering.%rSuccess You open the lock, or you achieve one success toward opening a lock that requires more than one success. You leave behind damage that indicates the lock was picked on close scrutiny.%rCritical Failure You break your toolkit and leave behind obvious damage. Fixing a broken toolkit requires using Crafting to Repair it or else swapping in replacement picks (costing 3 sp, or 3 gp for an infiltrator thieves' toolkit)."
  "Pincer Attack":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "You call for an aggressive formation designed for exploiting enemies' vulnerabilities. Signal all squadmates; each can Step as a reaction. If any of your allies ends this movement adjacent to an opponent, that opponent is Off-Guard to melee attacks from you and all other squadmates who responded to Pincer Attack until the start of your next turn."
  "Pinning Fire":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["monk"]
  "Piranha Assault":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rYou know that a thousand small bites can fell a large foe just as surely a single well-placed hit. Designate a creature within the aura of your commander's banner and signal all squadmates; for 1 minute, each time they attack that creature and deal damage to it of a type the creature resists, they ignore an amount of that creature's resistance equal to your level."
  "Pistolero's Retort":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: ["gunslinger"]
    description: "Requirements You're wielding a one-handed firearm or one-handed crossbow.%rTrigger A foe within the first range increment of the one-handed firearm or one-handed crossbow you're wielding critically fails an attack roll against you.%rYou punish your foe's failure with a shot. Make a Strike against the triggering foe with a one-handed firearm or one-handed crossbow."
  "Pitch-Perfect Projection":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["auditory", "spellshape"]
    description: "By using your perfect pitch, you can amplify your voice to cause magical auditory effects to reach further. If your next action this round is to Cast a Spell or use an action that creates an auditory effect with a range, increase that range by 30 feet."
  "Plaintive Plea":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You make an emotional appeal to convince someone during a diplomatic encounter. If your next activity is to attempt a Diplomacy check to make-an-impression or Request, or to attempt to influence a creature during an influence encounter, you can roll twice and take the better result."
  "Plant Evidence":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["rogue"]
  "Plant Thirty Barbs":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["death", "transcendence"]
    description: "You snap off a fragment of your ikon within your opponent's body, which threatens to burst into numerous barbs. Make a Strike with your ikon. If successful, barbs fill the target, dealing two die of weapon damage the first time the creature uses a move action on each of its turns; the barbs are made out of the same material as your weapon ikon and bypass resistances and such accordingly (for instance, a cold iron spear would create cold iron barbs). The barbs last for 1d4 rounds. If the target dies while the barbs are still in their body, the barbs burst forth in a forest of thorns covering the creature's space, which are greater difficult terrain and deal piercing damage equal to half your level for each square that is moved into."
  "Plummeting Roll":
    from: "action"
    for: "everyone"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You fall at least 10 feet and take no damage from the fall%rEffect You tuck and roll with the motion. You land on your feet and Stride up to half your Speed"
  "Point Blank Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "stance"]
    self_effect: "Stance: Point Blank Stance"
  "Point Out":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "manipulate", "visual"]
    description: "Requirements A creature is undetected by one or more of your allies but isn't undetected by you.%rYou indicate a creature that you can see to one or more allies, gesturing in a direction and describing the distance verbally. That creature is Hidden to your allies, rather than Undetected. This works only for allies who can see you and are in a position where they could potentially detect the target. If your allies can't hear or understand you, they must succeed at a Perception check against the creature's Stealth DC or they misunderstand and believe the target is in a different location."
  "Pointed Question":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "concentrate", "investigator", "linguistic", "mental"]
    description: "You ask a question that charms or needles someone in just the right way. Ask a question of a non-allied creature that you can see. Attempt a Diplomacy check against the creature's Will DC. The creature is then temporarily immune for 1 hour.%rCritical Success The target must directly answer your question. It doesn't have to answer truthfully, but you gain a +4 circumstance bonus to your Perception DC if the creature attempts to Lie to you.%rWhether it answers truthfully or not, you glean something from its body language, and it is Off-Guard to the Strike you make using Devise a Stratagem against it before the end of your turn.%rSuccess As critical success, but the circumstance bonus to your Perception DC is +2.%rEffect: Pointed Question%rFailure The target can refuse to answer you as normal.%rCritical Failure The target can refuse to answer you as normal, and its attitude toward you decreases by one step due to your aggravating attention."
  "Poison Weapon":
