    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate"]
    description: "Requirements You are sharing the same space as a swarm or are adjacent to a troop%rEffect Spend 1 Mythic Point and attempt an Intimidation check at mythic proficiency against the Will DC of the required swarm or troop. On a failure, the target Strides in a direction of your choosing and you move along with it. On a success, the target Strides twice in a direction of your choosing and you can decide whether or not to move along with it. No matter the result, the target is Stunned 1 and temporarily immune to your Overawe Crowd for 24 hours."
  "Overdrive":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["inventor", "manipulate"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rTemporarily cranking the gizmos on your body into overdrive, you try to add greater power to your attacks. Attempt a Crafting check that has a standard DC for your level.%rEffect: Overdrive%rCritical Success Your gizmos go into a state of incredible efficiency called critical overdrive, adding great power to your attacks. Your Strikes deal additional damage equal to your Intelligence modifier for 1 minute. After the Overdrive ends, your gizmos become unusable as they cool down or reset, and you can't use Overdrive for 1 minute.%rSuccess Your gizmos go into overdrive, adding power to your attacks. As critical success, except the additional damage is equal to half your Intelligence modifier.%rFailure Your gizmos whine concerningly and begin to smoke. Your Strikes deal 1 additional fire damage for 1 minute.%rCritical Failure Whoops! Something explodes. You take fire damage equal to half your level (rounded up), and you can't use Overdrive again for 1d4 #Recharge Overdrive rounds as your gizmos reset.%rSpecial When under the effects of Overdrive, you can still use the Overdrive action. You can't extend your Overdrive's duration this way, but you can turn an…"
  "Overflowing Blade":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "force", "magical"]
    description: "Requirements You are overflowing%rEffect You conduct the magic in your internal nexus to coat your weapon or unarmed strike, empowering it with magical energy for a devastating attack. Make a melee Strike. If the Strike hits, you deal an additional 1d4 force damage. At 10th level, the additional damage increases to 2d4 force damage. At 18th level, the additional damage increases to 3d4 force damage. You are no longer overflowing."
  "Overload Vision":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate"]
    description: "Trigger A creature within 60 feet would make an attack roll against you%rEffect The triggering creature must attempt a Fortitude save.%rCritical Success The target is unaffected.%rSuccess The target is Dazzled until the end of the current turn.%rFailure The target is Blinded until the end of the current turn.%rCritical Failure The target is blinded until the end of the current turn and dazzled for 1 minute."
  "Oversized Throw":
