    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per turn%rRequirements You are adjacent to your light mortar%rEffect You Aim your light mortar and then either Load or Launch it."
  "Enlightenment in Adversity":
    from: "action"
    for: "background"
    type: "reaction"
    category: "interaction"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You critically fail a skill check with a skill you gained from the banished celestial background%rEffect The next time you attempt a skill check using the skill that triggered this ability within the next minute, roll twice and take the higher result."
  "Enter Runewell":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "offensive"
    traits: ["concentrate", "manipulate", "teleportation"]
    description: "10 minutes. You and up to 6 willing creatures you're touching are instantly transported into your runewell , regardless of any distance between you and your anima focus."
  "Enter Seat Of Power":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "mythic"]
    description: "You focus your mind on your seat of power, then tap into this connection to transport yourself to its demiplane. This process takes 10 minutes. You can bring up to 10 willing creatures with you when you Enter Seat of Power; these creatures must remain within 30 feet of you for the duration of the activity.%rYou can remain in your seat of power for as long as you desire. Any creature that you bring to your seat of power in this way (including you) can depart the demiplane as a three-action activity that has the concentrate trait. They return to the location they were in when they Entered your Seat of Power, or the nearest unoccupied space if that location is occupied."
  "Enter Spirit Trance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "divine", "mental"]
    self_effect: "Effect: Enter Spirit Trance"
    description: "You enter a self-imposed trance that helps you push the physical limits of your body. You gain a number of temporary Hit Points equal to your level plus your Constitution modifier. The trance lasts for 1 minute, until you fall Unconscious, or until you Dismiss it, whichever comes first.%rWhile in this trance, you gain a +1 status bonus to Fortitude and Will saving throws and your melee Strikes deal 1 additional spirit damage. Other abilities may require you to be in a spirit trance. When the trance ends, you lose any remaining temporary Hit Points from Enter Spirit Trance, and you can't Enter a Spirit Trance for 1 minute."
  "Entity's Resurgence":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: []
    self_effect: "Effect: Entity's Resurgence"
    description: "Trigger You would be reduced to 0 Hit Points but not immediately killed%rEffect Instead of letting you fall Unconscious, your entity takes control. You remain at 1 Hit Point and gain temporary Hit Points equal to your level + your key attribute modifier that last for 1 minute. However, the entity is in control for 1 minute or until you fall unconscious, whichever comes first.%rWhile the entity is in control, you gain a +1 status bonus to attack rolls and damage rolls, and the GM usually controls your character, roleplaying the entity. The GM might decide to have you roleplay the entity instead, but they retain final say over any decisions you make. No matter the entity's nature, the entity is sure to wreak vengeance upon the foe who jeopardized the life of their vessel—even a malicious entity won't change allegiances or ignore danger except in the most extreme circumstances."
  "Entreat Pact":
    from: "action"
    for: "archetype"
    type: "free"
    category: "offensive"
    traits: ["concentrate", "fortune"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Trigger You attempt a skill check directly related to the conditions of the pact%rFrequency once per hour%rEffect You call upon the occult energies powering your pact to help you fulfill your promise. Roll twice on the triggering check and take the better result."
  "Envenom":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["manipulate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rThrough use of either saliva or blood, you use your innate toxins to apply vishkanyan venom to your weapon or a piece of ammunition. To use your blood, you must be injured, or you can deal 1 slashing damage to yourself as part of the action. The vishkanyan venom remains potent until the end of your next turn, or until you expend it as normal for an injury poison by either hitting a target or critically failing an attack roll.%rMinor Vishkanyan Venom (injury, poison)%rSaving Throw Fortitude%rMaximum Duration 6 rounds%rStage 1 1d4 poison damage (1 round)%rStage 2 1d4 poison damage (1 round)%rStage 3 1d4 poison damage (1 round)"
  "Envenom Fangs":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["lizardfolk"]
    frequency: {"max": 1, "per": "PT1H"}
    self_effect: "Effect: Envenom Fangs"
  "Epiphany at the Crossroads":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["divine", "oracle"]
    frequency: {"max": 1, "per": "day"}
  "Erupting Spurs":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "offensive"
    traits: []
    description: "Trigger A creature takes persistent bleed damage from your bone flense spell%rEffect You will the bone spurs to erupt in a particularly devastating manner, dealing 6d6 piercing damage (basic Fortitude save) to the triggering creature instead of the persistent bleed damage from bone flense. The duration of bone flense immediately ends."
  "Escape":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["attack"]
    check: {"slug": "escape", "statistic": ["unarmed", "acrobatics", "athletics"], "options": ["action:escape"], "against": "athletics", "notes": {"criticalSuccess": "You get free and remove the grabbed, immobilized, and restrained conditions imposed by your chosen target. You can then Stride up to 5 feet.", "success": "You get free and remove the grabbed, immobilized, and restrained conditions imposed by your chosen target.", "criticalFailure": "You don't get free, and you can't attempt to Escape again until your next turn."}, "consequences": {"criticalSuccess": [{"on": "actor", "remove": ["Grabbed", "Immobilized", "Restrained"]}], "success": [{"on": "actor", "remove": ["Grabbed", "Immobilized", "Restrained"]}]}}
    description: "You attempt to escape from being Grabbed, Immobilized, or Restrained. Choose one creature, object, spell effect, hazard, or other impediment imposing any of those conditions on you. Attempt a check using your unarmed attack modifier against the DC of the effect. This is typically the Athletics DC of a creature grabbing you, the Thievery DC of a creature who tied you up, the spell DC for a spell effect, or the listed Escape DC of an object, hazard, or other impediment. You can attempt an Acrobatics or Athletics check instead of using your attack modifier if you choose (but this action still has the attack trait).%rCritical Success You get free and remove the grabbed, immobilized, and restrained conditions imposed by your chosen target. You can then Stride up to 5 feet.%rSuccess You get free and remove the grabbed, immobilized, and restrained conditions imposed by your chosen target.%rCritical Failure You don't get free, and you can't attempt to Escape again until your next turn."
  "Evangelize":
    from: "feat"
    type: "action"
    cost: 1
    category: "skill"
    traits: ["auditory", "general", "linguistic", "mental", "skill"]
  "Even the Odds":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["swashbuckler"]
    frequency: {"max": 1, "per": "PT10M"}
    self_effect: "Effect: Even the Odds"
  "Exacting Strike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Executioner's Volley":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rYou command your squadmates to act as a lethal firing squad. You and each squadmate within the aura of your commander's banner can attempt a ranged Strike as a reaction against a single target you choose; combine the damage from all attacks for the purpose of resistances and weaknesses. If the designated target is a living creature, these attacks gain the death trait. If the designated target dies as a result of this tactic, all other enemies within the affected area of your commander's banner must succeed at a Will save against your class DC or be Frightened 2; this is an emotion, fear, and mental effect.%rSpecial If one of your squadmates knows or has prepared a cantrip with a range of 30 feet or more that deals damage and requires 2 or fewer actions to cast, they can cast it targeting the designated enemy instead of taking the other actions normally granted by this tactic, gaining all other listed benefits."
  "Expand Aura":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["champion", "concentrate"]
  "Expeditious Inspection":
    from: "action"
    for: "class"
    type: "free"
    category: "interaction"
    traits: ["investigator"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rYou observe and assess your surroundings with great speed. You Recall Knowledge, Seek, or Sense Motive."
  "Expel Maelstrom":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    traits: ["curse", "occult"]
    description: "Requirements You're in a curse maelstrom state%rEffect You expel the maelstrom from your body, sending the energy to reside in one unlucky creature within 60 feet. Your curse maelstrom state ends. The result depends on the creature's Will save.%rCritical Success The creature is unaffected, and the curse's energy dissipates harmlessly.%rSuccess The creature comes to house the maelstrom's wrath within it. It takes a -1 status penalty to all saving throws and skill checks for 1 minute.%rEffect: Expel Maelstrom (Success)%rFailure The maelstrom strikes deep into the creature's soul. It takes a -2 status penalty to all saving throws and skill checks for 10 minutes.%rCritical Failure The maelstrom pitches the creature into a single fit of utter misfortune before burrowing into its soul. As failure, but the creature also must roll twice and take the lower result on its next saving throw or skill check; this is a misfortune effect.%rEffect: Expel Maelstrom (Failure or Critical Failure)"
  "Explode":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["fire", "inventor", "manipulate", "unstable"]
    description: "You intentionally take your innovation beyond normal safety limits, making it explode and damage nearby creatures without damaging the innovation... hopefully. The explosion deals max(2, @actor.level)d6[@actor.flags.system.inventor.explode]|options:area-damage damage with a Reflex to all creatures in a 5-foot around you (if you're wearing or holding the innovation) or around your innovation (if your innovation is a minion).%rAt 3rd level, and every level thereafter, increase your explosion's damage by 1d6.%rIf you have the breakthrough innovation class feature, you can choose either a 5-foot or 10-foot for the area when you use Explode; if you have the revolutionary innovation class feature, you can choose a 5-foot, 10-foot, or 15-foot."
  "Exploit Blunder":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["investigator"]
  "Exploit Vulnerability":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    traits: ["esoterica", "manipulate", "thaumaturge"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rRequirements You are holding your implement.%rYou scour your experiences and learning to identify something that might repel your foe. You retrieve an object from your esoterica with the appropriate supernatural qualities, then use your implement to stoke the remnants of its power into a blaze. Select a creature you can see and attempt an Esoteric Lore check against a standard DC for its level, as you retrieve the right object from your esoterica and use your implement to empower it. You gain the following effects until you Exploit Vulnerabilities again.%rCritical Success You remember the creature's weaknesses, and as you empower your esoterica, you have a flash of insight that grants even more knowledge about the creature. You learn all of the creature's resistances, weaknesses, and immunities, including the amounts of the resistances and weaknesses and any unusual weaknesses or vulnerabilities, such as an oni's bean panic. You can exploit either the creature's mortal weakness or personal antithesis (see below). Your unarmed and weapon Strikes against the creature also become magical if they weren't already.%rSuccess You recall an important fact about…"
  "Explosive Arrival":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["concentrate", "manipulate", "spellshape", "wizard"]
  "Extract Element":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["impulse", "kineticist", "primal"]
    description: "You extract elemental matter from a creature's body to weaken it and take its power for your own. Target a creature within 30 feet that has a trait matching one of your kinetic elements or is made of one of your kinetic elements. The target takes (ceil(@actor.level/2))d4 untyped damage (with no damage type) and becomes susceptible to your impulses, depending on its Fortitude save against your class DC.%rCritical Success The creature is unaffected%rSuccess The creature takes half damage, and you add some of its elemental matter to your kinetic aura. Your impulses bypass any immunity the creature has to their elemental trait or traits, and the target takes a -1 circumstance penalty to its saves and AC against your impulses. If the target normally has a resistance that would apply to damage from one of your impulses, ignore that resistance; if it normally would be immune to that damage type, it instead has resistance equal to its level to damage from the impulse. You can't target a creature with Extract Element if elemental matter you extracted from it is already in your kinetic aura. These effects last for 5 minutes or until your kinetic aura ends, whichever comes first%rFailure As…"
  "Extravagant Parry":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["swashbuckler"]
    self_effect: "Effect: Extravagant Parry"
  "Eye for Numbers":
    from: "feat"
    type: "action"
    cost: 1
    category: "skill"
    traits: ["general", "skill"]
  "Fade Into Daydreams":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["illusion", "psyche", "psychic"]
    description: "Your flights of imagination spill into the real world, causing you to become indistinct, hazy, or cloaked in figments. You become Concealed until the start of your next turn. This concealment can't be used to Hide, as normal for concealing effects that leave your location obvious."
  "Fantastic Leap":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["rogue"]
  "Fated Not to Die":
    from: "action"
    for: "background"
    type: "free"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Trigger You are dying%rFrequency once per day%rEffect Draw a harrow card, and you automatically lose the dying condition, though you remain Unconscious at 0 Hit Points. If the card you drew was from the suit of Shields, you awaken and have an amount of Hit Points restored to you equal to 1d6 + your level."
  "Feed the Masses":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["transcendence"]
    description: "The Horn of Plenty allows you to transfer the effects of potions and elixirs to your allies. You Interact to draw a consumable from the horn and then Interact to drink it. Rather than nourishing yourself, the item's effects are transferred to a willing ally within 60 feet, as if they had consumed it themself.%rIf the consumable restores Hit Points, you can choose to divide the amount it restores between you and the ally freely (after rolling dice to determine the amount)."
  "Feint":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["mental"]
    check: {"slug": "feint", "statistic": "deception", "options": ["action:feint"], "against": "perception", "notes": {"criticalSuccess": "You throw your enemy's defenses against you entirely off. The target is Off-Guard against melee attacks that you attempt against it until the end of your next turn.", "success": "Your foe is fooled, but only momentarily. The target is Off-Guard against the next melee attack that you attempt against it before the end of your current turn.", "criticalFailure": "Your feint backfires. You are Off-Guard against melee attacks the target attempts against you until the end of your next turn."}, "consequences": {"criticalSuccess": [{"on": "target", "condition": "Off-Guard", "until": "next-turn-end"}], "success": [{"on": "target", "condition": "Off-Guard", "until": "turn-end"}], "criticalFailure": [{"on": "actor", "condition": "Off-Guard", "until": "next-turn-end"}]}}
    description: "Requirements You are within melee reach of the target you attempt to Feint.%rWith a misleading flourish, you leave an opponent unprepared for your real attack. Attempt a Deception check against your target's Perception DC.%rCritical Success You throw your enemy's defenses against you entirely off. The target is Off-Guard against melee attacks that you attempt against it until the end of your next turn.%rSuccess Your foe is fooled, but only momentarily. The target is off-guard against the next melee attack that you attempt against it before the end of your current turn.%rCritical Failure Your feint backfires. You are off-guard against melee attacks the target attempts against you until the end of your next turn."
  "Felling Shot":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["rogue"]
  "Felling Strike":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["fighter"]
  "Feral Swing":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["spirit", "transcendence"]
    description: "You lash out with both arms, rending all before you. Each creature in a 15-foot cone must succeed at a Reflex save against your class DC or take spirit damage equal to your normal Strike damage with your Hands of the Wildling.%rYou can choose to swing with abandon, which imposes a –2 circumstance bonus to enemies' saving throws, but causes you to become Off-Guard until the start of your next turn.%rEffect: Feral Swing"
  "Fey Jump":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "primal", "teleportation"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect You jump through the First World for a brief second, teleporting up 60 feet away to an empty space you can see. If this would bring another creature with you—even if you're carrying it in an extradimensional container—the action is lost."
  "Fey's Fortune":
    from: "action"
    for: "background"
    type: "free"
    category: "interaction"
    traits: ["concentrate", "fortune"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You attempt a skill check and haven't yet rolled%rEffect Roll the skill check twice and use the better result"
  "Field of Roots":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["eidolon"]
    description: "Your eidolon extends their roots underground to entangle and possibly damage all foes nearby. All enemies within your eidolon's reach take damage of the same type and amount as your eidolon's most damaging Strike, depending on their Reflex saves against your spell DC. Any ongoing effects of the save last until the enemy either Escapes or leaves your eidolon's reach. After using Field of Roots, your eidolon is Immobilized until they take an Interact action to detach from the ground; this also ends any remaining effects on enemies from Field of Roots.%rCritical Success The enemy is unaffected.%rSuccess The enemy takes no damage, but takes a –10 foot circumstance penalty to its Speeds.%rFailure The enemy takes half damage, takes a –10-foot circumstance penalty to its Speeds, and at the end of each of its turns, takes half damage again.%rCritical Failure The enemy is immobilized, takes full damage, and at the end of each of its turns, takes full damage again."
  "Fight with Fear":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "interaction"
    traits: ["concentrate", "emotion", "fear", "mental"]
    description: "Trigger A creature that you can see uses a mental effect against you%rEffect The triggering creature must attempt a Will save, which has the following effects.%rSuccess The creature is unaffected.%rFailure The creature is Frightened 2, and you gain a +2 status bonus to your saving throw or other defense against the triggering mental effect.%rCritical Failure The creature is frightened 2, and you're unaffected by the triggering mental effect."
  "Final Spite":
    from: "action"
    for: "background"
    type: "reaction"
    category: "defensive"
    traits: []
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You're reduced to 0 Hit Points%rEffect You make a Strike before falling Unconscious."
  "Final Surge":
    from: "action"
    for: "equipment"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    description: "You Stride twice. The Drakeheart Mutagen's duration ends."
  "Find Fault":
    from: "action"
    for: "heritage"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate"]
    description: "Trigger You attempt a saving throw against a spell or magic effect but haven't rolled yet%rEffect You find some kind of fault with the magic, using that flaw to protect yourself from the effect. You gain a +1 circumstance bonus to your saving throw against the triggering effect, which increases to a +2 circumstance bonus if the effect is divine and originates from a worshipper of the deity you chose for your grudge."
  "Finish The Job":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["gunslinger"]
    description: "Requirements On your last action, you failed (but didn't critically fail) a Strike with a firearm or crossbow you're holding in one hand, and your other hand is either wielding a melee weapon or empty.%rYour last attack failed, but it set you up for another. Make a Strike with your other hand, using a one-handed melee weapon or unarmed attack. This Strike uses the same multiple attack penalty as the Strike that failed on the last action. Afterward, increase your multiple attack penalty normally."
  "Fire in the Hole":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: []
    description: "Trigger A creature moves into the hazard's space%rEffect The hazard explodes, dealing the bombs' damage and splash damage to the inanimate object. Combine this damage for the purpose of resistances and weaknesses, and this damage ignores an amount of the object's Hardness equal to your level. Any creatures adjacent to the hazard take the bombs' splash damage, similarly combined for the purpose of resistances and weaknesses. As a reminder, since you didn't throw the bombs, Calculated Splash and similar effects don't apply."
  "Flamboyant Leap":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["swashbuckler"]
  "Flash of Grandeur":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["champion", "divine"]
    description: "Trigger An enemy damages your ally, and both are in your champion's aura%rEffect Imperious divine light flashes out from you to surround your foe. The ally gains resistance to all damage against the triggering damage equal to 2 + your level. Until the end of your next turn, the attacker is affected by Revealing Light.%rEffect: Champion's Resistance"
  "Flash of Memory":
    from: "action"
    for: "archetype"
    type: "free"
    category: "offensive"
    traits: []
    description: "Spend a Mythic Point and attempt an Incarnation Lore check at mythic proficiency to Recall Knowledge in place of making any other Lore check (other than Incarnation Lore)."
  "Flashy Dodge":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["swashbuckler"]
  "Fleeting Arc through Heaven and Earth":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["light", "spirit", "teleportation", "transcendence"]
    description: "You swing your weapon in a wide arc, releasing a blazing rainbow that deals 9d6 spirit|options:area-damage damage and 9d6 untyped|options:area-damage damage of the same type as your weapon to all enemies in a 60-foot cone, with a Fortitude save against your class DC. As the rainbow ripples out, you use it as a bridge to teleport to any location within the effect's area."
  "Fling Magic":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "magical", "manipulate", "thaumaturge"]
    description: "Requirements You are holding your wand implement.%rYou fling magical energy at a target within 60 feet, dealing (ceil(@actor.level/2)+2)d4 untyped damage, with a Reflex save against your class DC. The damage is of the type you selected when you gained your wand implement. At 3rd level and every 2 levels thereafter, the damage increases by 1d4.%rYou can expend more energy than usual to boost the effect of Fling Magic, dealing d6s of damage instead of d4s. After you do, the wand's extra energy is discharged; you can't boost the wand's damage again, but can continue to Fling Magic normally. The extra energy recharges at the end of your next turn.%rSpecial This activity has the trait corresponding to the damage type you selected."
  "Flinging Charge":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["fighter", "flourish"]
  "Floral Restoration":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["druid", "healing", "vitality"]
    frequency: {"max": 1, "per": "day"}
  "Flowing Engulf":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    traits: ["eidolon"]
    description: "Your eidolon Strides up to double their Speed and can move through the spaces of any creatures in their path. Any creature of the eidolon's size or smaller whose space your eidolon moves through is engulfed unless it succeeds at a Reflex save against your spell DC. Your eidolon can attempt to engulf the same creature only once in a single use of Flowing Engulf, and they can contain as many creatures as can fit in their space.%rAn engulfed creature is pulled into your eidolon's body. It is Grabbed, Slowed 1, and moves along with your eidolon as long as it is engulfed. It can get free by Escaping against your spell DC, moving to a space of its choice adjacent to your eidolon."
  "Flowing Spirit Strike":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["spirit", "transcendence"]
    description: "Make two Strikes with the gleaming blade, each against the same target and using your current multiple attack penalty. If the Gleaming Blade doesn't have the agile trait, the second Strike takes a –2 penalty. If both attacks hit, you combine their damage, which is all dealt as spirit damage.%rYou add any precision damage only once. Combine the damage from both Strikes and apply resistances and weaknesses only once. This counts as two attacks when calculating your multiple attack penalty."
  "Flurry of Blows":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["flourish", "monk"]
    description: "Make two unarmed Strikes. If both hit the same creature, combine their damage for the purpose of resistances and weaknesses. Apply your multiple attack penalty to the Strikes normally. As it has the flourish trait, you can use Flurry of Blows only once per turn."
  "Fly":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    description: "Requirements You have a fly Speed.%rYou move through the air up to your fly Speed. Moving upward (straight up or diagonally) uses the rules for moving through difficult terrain. You can move straight down 10 feet for every 5 feet of movement you spend. If you Fly to the ground, you don't take falling damage. You can use an action to Fly 0 feet to hover in place. If you're airborne at the end of your turn and didn't use a Fly action this round, you fall."
  "Flyby Attack":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    description: "Effect You Fly and can make a Strike at any point along the way."
  "Flying Kick":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["monk"]
  "Focused Shot":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "monk"]
  "Follow the Expert":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["auditory", "concentrate", "exploration", "visual"]
    description: "Choose an ally attempting a recurring skill check while exploring, such as climbing, or performing a different exploration tactic that requires a skill check (like Avoiding Notice). The ally must be at least an expert in that skill and must be willing to provide assistance. While Following the Expert, you match their tactic or attempt similar skill checks.%rThanks to your ally's assistance, you can add your level as a proficiency bonus to the associated skill check, even if you're untrained. Additionally, you gain a circumstance bonus to your skill check based on your ally's proficiency (+2 for expert, +3 for master, and +4 for legendary).%rEffect: Follow The Expert"
  "Follow-Up Assault":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "rage"]
  "For My House!":
    from: "action"
    for: "archetype"
    type: "free"
    category: "defensive"
    traits: []
    frequency: {"max": 1, "per": "PT1M"}
    description: "Frequency once per minute%rEffect You announce your house affiliation, either by declaring it aloud (giving this ability the auditory trait) or openly displaying your house heraldry (giving this ability the visual trait). Until the beginning of your next turn, your weapon Strikes and spells deal an additional 1 damage to any creature that witnessed the display. If you're an expert in Cheliax Lore, Genealogy Lore, Heraldry Lore, Performance, or Warfare Lore, the additional damage increases to 2. The damage increases to 3 if you're a master in the skill or 4 if you're legendary in the skill."
  "For Talmandor! For Freedom!":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rYou raise your banner high with a reminder of what you and your allies truly fight for, granting them unshakable conviction. For yourself and each squadmate in your banner's aura when you use this tactic, you can attempt to counteract one effect affecting that creature. Your counteract modifier is your Warfare Lore modifier. The effect must have the mental trait or impose the clumsy, controlled, Fleeing, frightened, Grabbed, Immobilized, Paralyzed, Restrained, slowed, or stunned condition."
  "Force Open":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["attack"]
    check: {"slug": "force-open", "statistic": "athletics", "options": ["action:force-open"], "notes": {"criticalSuccess": "You open the door, window, container, or gate and can avoid damaging it in the process.", "success": "You break the door, window, container, or gate open, and it gains the Broken condition. If it's especially sturdy, the GM might have it take damage but not be broken.", "criticalFailure": "Your attempt jams the door, window, container, or gate shut, imposing a –2 circumstance penalty on future attempts to Force it Open."}}
    description: "Using your body, a lever, or some other tool, you attempt to forcefully open a door, window, container or heavy gate. With a high enough result, you can even smash through walls. Without a crowbar, prying something open takes a –2 item penalty to the Athletics check to Force Open.%rCritical Success You open the door, window, container, or gate and can avoid damaging it in the process.%rSuccess You break the door, window, container, or gate open, and it gains the Broken condition. If it's especially sturdy, the GM might have it take damage but not be broken.%rCritical Failure Your attempt jams the door, window, container, or gate shut, imposing a –2 circumstance penalty on future attempts to Force it Open.%rSample Force Open Tasks Untrained fabric, flimsy glass Trained ice, sturdy glass Expert flimsy wooden door, wooden portcullis Master sturdy wooden door, iron portcullis, metal bar Legendary stone or iron door"
  "Forced Pact":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect You force a temporary pact on both yourself and another creature you can see within 60 feet. Choose attack, move, manipulate, or concentrate. The target must attempt a Will saving throw.%rSuccess The target is unaffected.%rFailure If you or the target uses an action with the chosen trait within the next minute, they take 10d6 mental damage, and this pact ends for both of you.%rCritical Failure As failure, except your target takes the damage if either of you uses an action with the chosen trait."
  "Forcible Energy":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["manipulate", "spellshape", "wizard"]
  "Foresee Danger":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["concentrate", "investigator"]
  "Foresight":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger The target of Foresight defends against a hostile creature or other danger.%rEffect If the hostile creature or danger forces the target to roll dice (a saving throw, for example), the target rolls twice and uses the higher result, and this spell gains the fortune trait. But if the hostile creature or danger is rolling against the target (an attack roll or skill check, for example), that hostile creature or danger rolls twice and uses the lower result, and this spell gains the misfortune trait."
  "Forestall Curse":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "oracle"]
    frequency: {"max": 1, "per": "day"}
  "Foretell Harm":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["cursebound", "divine", "oracle"]
    frequency: {"max": 1, "per": "round"}
  "Forge Documents":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "secret"]
    description: "You prepare forgeries that might serve as convincing props. Attempt a hard or very hard Society check.%rSuccess You create convincing forgeries and gain 1 EP you can use only when presenting some form of paperwork.%rFailure You create unconvincing documents. You gain 1 EP that (unknown to you) grants no benefit when used.%rCritical Failure As a failure, but a PC who tries to use the Edge Point gets a critical failure, even if they use the Edge Point after rolling a failure."
  "Form Control":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["druid", "manipulate", "spellshape"]
  "Form of the Bat":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["concentrate", "dhampir", "divine", "polymorph"]
    frequency: {"max": 1, "per": "PT1H"}
  "Fortify Camp":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: []
    description: "You can spend time fortifying your camp for defense with a successful Crafting check (typically at a trained or expert DC). Anyone keeping watch or defending the camp gains a +2 circumstance bonus to initiative rolls and Perception checks to Seek creatures attempting to sneak up on the camp."
  "Fortify Focus":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["concentrate"]
    description: "Requirements You are touching your designated companion, and their focus pool isn't full%rEffect Your companion regains 1 Focus Point."
  "Fracture Mountains":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["spirit", "transcendence"]
    description: "Your spirit is so dense it takes on tangible force. Make a melee Strike with the Titan's Breaker. This counts as two attacks when calculating your multiple attack penalty. If this Strike hits, your additional spirit damage from the ikon's immanence increases to 4 plus an extra die of weapon damage.%rIf you're at least 10th level, it's increased to 6 spirit damage and two extra dice, and if you're at least 18th level, it's increased to 8 spirit damage and three extra dice."
  "Friendly Toss":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "manipulate", "rage"]
  "Fuel Impossible Spell":
    from: "action"
    for: "impossible-spells"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "manipulate"]
    frequency: {"max": 1, "per": "round"}
    description: "You put more of yourself on the line to draw forth the hidden potentials behind an impossible spell. You empower the effect of one of your active impossible spells further as detailed under the spell's description. Every time you Fuel an Impossible Spell, you become Doomed 1 or increase your doomed condition by 1 if you're already doomed."
  "Furious Finish":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "rage"]
    self_effect: "Effect: Furious Finish"
  "Furious Grab":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "rage"]
  "Furious Sprint":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "rage"]
  "Furious Strike":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["eidolon"]
    description: "Your eidolon makes a melee Strike. This counts as two attacks when calculating your multiple attack penalty. If this Strike hits, your eidolon deals an extra die of weapon damage and gains a +1 circumstance bonus to the damage roll.%rIf you're at least 10th level, increase this to two extra dice with a +2 circumstance bonus, and if you're at least 18th level, increase it to three extra dice with a +3 circumstance bonus."
  "Furious Vengeance":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["barbarian", "rage"]
  "Gain Contact":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    description: "You try to make contact with an individual who can aid you in the infiltration. Attempt a normal, hard, or very hard DC Diplomacy or Society check, or a check using a Lore skill appropriate to your prospective contact.%rSuccess You make contact and gain 1 EP.%rFailure You fail to make contact.%rCritical Failure You insult or spook the contact in some way. Future attempts take a -2 circumstance penalty.%rSpecial Multiple critical failures might cause the contact to work against the PCs in some way, likely increasing the party's Awareness Points."
  "Garland Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["druid", "manipulate", "spellshape"]
  "Gather Information":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "secret"]
    check: {"slug": "gather-information", "statistic": "diplomacy", "options": ["action:gather-information"], "notes": {"criticalSuccess": "You collect information about the individual or topic. The GM determines the specifics.", "success": "You collect information about the individual or topic. The GM determines the specifics.", "criticalFailure": "You collect incorrect information about the individual or topic."}}
    description: "You canvass local markets, taverns, and gathering places in an attempt to learn about a specific individual or topic. The GM determines the DC of the Diplomacy check and the amount of time it takes (typically 2 hours, but sometimes more), along with any benefit you might be able to gain by spending coin on bribes, drinks, or gifts.%rSuccess You collect information about the individual or topic. The GM determines the specifics.%rCritical Failure You collect incorrect information about the individual or topic.%rSample Gather Information Tasks Untrained talk of the town Trained common rumor Expert obscure rumor, poorly guarded secret Master well-guarded or esoteric information Legendary information known only to an incredibly select few, or only to extraordinary beings"
  "Gather to Me!":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "You signal your team to move into position together. Signal all squadmates; each can immediately Stride as a reaction, though each must end their movement inside your banner's aura, or as close to your banner's aura as their movement Speed allows.%rSquadmates can use Gather to Me! while Burrowing, Climbing, Flying, or Swimming instead of Striding if they have the corresponding movement type."
  "Get Used to Disappointment":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["bravado", "swashbuckler"]
  "Ghost Shot":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["flourish", "gunslinger"]
    description: "Make a firearm or crossbow Strike. If you're Hidden from or Undetected by the target, the Strike adds the additional precision damage from One Shot, One Kill; if you would already receive that additional damage on the Strike, the effects aren't cumulative. If you were undetected or Unnoticed by any creatures, you're now hidden from them instead, or undetected if the shot was made with a silencer."
  "Giant's Lunge":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "rage"]
    self_effect: "Effect: Giant's Lunge"
