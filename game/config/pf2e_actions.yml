  "Tumble Through":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    check: {"slug": "tumble-through", "statistic": "acrobatics", "options": ["action:tumble-through"], "against": "reflex", "notes": {"criticalSuccess": "You move through the enemy's space, treating the squares in its space as difficult terrain (every 5 feet costs 10 feet of movement). If you don't have enough Speed to move all the way through its space, you get the same effect as a failure.", "success": "You move through the enemy's space, treating the squares in its space as difficult terrain (every 5 feet costs 10 feet of movement). If you don't have enough Speed to move all the way through its space, you get the same effect as a failure.", "failure": "Your movement ends, and you trigger reactions as if you had moved out of the square you started in.", "criticalFailure": "Your movement ends, and you trigger reactions as if you had moved out of the square you started in."}}
    description: "You Stride up to your Speed. During this movement, you can try to move through the space of one enemy. Attempt an Acrobatics check against the enemy's Reflex DC as soon as you try to enter its space. You can Tumble Through using Climb, Fly, Swim, or another action instead of Stride in the appropriate environment.%rSuccess You move through the enemy's space, treating the squares in its space as difficult terrain (every 5 feet costs 10 feet of movement). If you don't have enough Speed to move all the way through its space, you get the same effect as a failure.%rFailure Your movement ends, and you trigger reactions as if you had moved out of the square you started in."
  "Turn Aside Ambient Magic":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["concentrate"]
    self_effect: "Effect: Turn Aside Ambient Magic"
    description: "Your ostilli glows a faint yellow as it establishes a barrier. Choose acid, cold, electricity, fire, or sonic damage. Until the beginning of your next turn, you gain resistance against the chosen damage type equal to half your level."
  "Twin Feint":
    from: "feat"
