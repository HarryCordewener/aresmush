    cost: 2
    category: "skill"
    traits: ["emotion", "fear", "general", "mental", "skill"]
  "Divert Lightning":
    from: "action"
    for: "equipment"
    type: "reaction"
    category: "offensive"
    traits: ["electricity"]
    description: "Requirements You aren't immune to electricity%rTrigger A creature within 30 feet of you is targeted by an electricity effect or is in the area of an electricity effect.%rEffect You draw the electricity to yourself like a lightning rod in order to shield the target. If the triggering effect was targeted, it targets you instead of the triggering creature. If it was an area effect, it leaps from the triggering creature's space to fill your space instead. This doesn't divert lightning from any other creatures targeted by or in the area of the lightning. You're automatically hit by or automatically fail your save against the effect. You then can't Divert Lightning for 1d4 rounds."
  "Diverting Vortex":
    from: "feat"
