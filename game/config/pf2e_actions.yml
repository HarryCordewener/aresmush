    traits: ["fighter", "stance"]
    self_effect: "Stance: Twinned Defense"
  "Twirling Throw":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Twist Design":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "illusion", "occult"]
    description: "You transform your tattoo to a different form of approximately the same size. You can Dismiss this effect."
  "Twist the Knife":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["rogue"]
  "Two-Weapon Flurry":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "flourish", "press"]
  "Ultimatum of Liberation":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "linguistic", "mental", "mythic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You proclaim an ultimatum against a creature you believe is oppressing others and all who follow their orders. All other creatures (including you) who hear your ultimatum, or learn about it later on, are emboldened by your words for 1 day, and gain a +2 status bonus to their Will saving throws against effects produced by the oppressing creature and their allies, which increases to +3 if they are within 30 feet of you.%rEffect: Ultimatum of Liberation%rAdditionally, the first time each day that creature and each of its allies comes within 30 feet of you, they must succeed on a Will save against your class DC or spell DC (whichever is higher) or become Frightened 1 (Frightened 2 on a critical failure). This second effect has the emotion, fear, and mental traits. The oppressing creature may end all the effects as a free action by truthfully agreeing to permanently end their oppression. Otherwise, your Ultimatum of Liberation has no duration, though you can have only one Ultimatum of Liberation active at a time. If you pronounce a second Ultimatum of Liberation, the effects of the first one end."
  "Unbalancing Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Unbalancing Sweep":
    from: "feat"
    type: "action"
    cost: 3
    category: "class"
    traits: ["barbarian", "flourish"]
  "Underhanded Assault":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["rogue"]
  "Unleash Psyche":
    from: "action"
    for: "class"
    type: "free"
    category: "defensive"
    traits: ["psychic"]
    self_effect: "Effect: Unleash Psyche"
    description: "Trigger Your turn begins.%rRequirements You're in an encounter, you Cast a Spell on your previous turn, and you aren't Stupefied.%rYou call on the depths of your mind and let psychic power flood through. Your Psyche remains Unleashed for 2 rounds or until your fall Unconscious, whichever comes first. You can't voluntarily quell your unleashed psyche. While your Psyche is Unleashed, the following effects occur.%rYou're constantly surrounded by the visual manifestation of your psychic magic. When you cast a damaging spell using your psychic spellcasting, you gain a status bonus to its damage equal to double the spell's rank. This applies only to the initial damage the spell deals when cast, and an individual creature takes this damage only once per spell, even if the spell would damage that creature multiple times. You can use actions that have the psyche trait. After your unleashed psyche subsides, your mind must recover from the strain of channeling its full power. You can't use Unleash Psyche again for 2 rounds, and you're Stupefied 1 for 2 rounds."
  "Unleash Realm":
    from: "action"
    for: "archetype"
    type: "free"
    category: "offensive"
    traits: ["concentrate"]
    description: "Trigger Your previous action was to Sustain your manifested realm%rEffect You punish those who transgress upon your realm. An enemy within your realm takes 4d8[@actor.flags.system.realmDamage]|shortLabel|options:area-damage damage of your realm's damage type with a Fortitude save against your class DC or spell DC, whichever is higher."
  "Unravel the Future":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["fortune", "transcendence"]
    description: "You pluck a single thread from your ikon, which ties itself in three loops about your wrist, where it remains for the next minute. If you fail an attack roll or skill check, and a +1 status bonus would change your failure into a success or your success into a critical success, you gain a +1 status bonus to this check retroactively, changing the outcome appropriately as the thread pulls you to the future you desire. The thread then falls from your wrist. You can have only one thread in existence at a time."
  "Unusual Composition":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["bard", "concentrate", "manipulate", "spellshape"]
  "Unwavering Resilience":
    from: "action"
    for: "heritage"
    type: "reaction"
    category: "offensive"
    traits: []
    self_effect: "Effect: Unwavering Resilience"
    description: "Trigger You attempt a saving throw against a poison, disease, or mental effect, but you haven't rolled yet.%rYou tap into the power of the Plane of Wood, gaining strength and mental fortitude. You gain a +1 circumstance bonus on the triggering save. If you critically succeed at this saving throw, you become bolstered by your success; blossoms and new growth temporarily sprout all over your body, and you gain a number of temporary Hit Point equal to your level. These temporary Hit Points last for one minute. When there temporary Hit Points are lost, the verdant growth subsides."
  "Upstage":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger An enemy attempts a skill check and doesn't get a critical success%rAfter your foe has tried their best, you show everyone how it's really done. Attempt a check using the same skill that triggered this reaction.%rCritical Success You gain a +1 status bonus to attack rolls, Perception checks, saving throws, and skill checks until the end of your next turn.%rSuccess As critical success, except you gain the benefits only if the triggering creature failed their skill check.%rEffect: Upstage"
  "Valkyrie's Charge":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rYou and your allies defy death and defeat to make a glorious final charge. You restore 80 healing|traits:healing Hit Points to each squadmate within the aura of your commander's banner; this effect has the healing trait. If an affected ally was Unconscious due to their Hit Points being reduced to 0, they can immediately Stand and pick up any dropped weapons as a free action. Then, each affected squadmate can, as a free action, Stride up to twice their Speed directly toward an enemy they are observing; if they end this movement with an enemy within their reach, they can attempt to Strike that enemy as a reaction.%rSquadmates can use Valkyrie's Charge while Burrowing, Climbing, Flying, or Swimming instead of Striding if they have the corresponding movement type."
  "Vengeful Strike":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["barbarian", "rage"]
  "Venom Draw":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    description: "Requirements Your Envenom action hasn't been expended.%rYou quickly envenom poisonous saliva on your weapon as you draw it. Interact to draw a weapon, and then Envenom it. This uses up your daily use of Envenom."
  "Verdant Rest":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "You turn into a tree or other non-creature plant. This has the effect of using One with Plants to turn into a plant, except that your AC is 30. You can Dismiss this effect to turn back. If you rest for 10 minutes in this form in natural sunlight, you recover half your maximum Hit Points. If you take your daily rest in this form, the rest restores you to maximum Hit Points and removes all non-permanent Drained, Enfeebled, Clumsy, and Stupefied conditions, as well as all poisons and diseases of 19th level or lower."
