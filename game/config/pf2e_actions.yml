  "Palm an Object":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "palm-an-object", "statistic": "thievery", "options": ["action:palm-an-object"], "against": "perception", "notes": {"criticalSuccess": "The creature does not notice you Palming the Object.", "success": "The creature does not notice you Palming the Object.", "failure": "The creature notices you Palming the Object, and the GM determines the creature's response.", "criticalFailure": "The creature notices you Palming the Object, and the GM determines the creature's response."}}
    description: "You pick up a small, unattended object and try not to be noticed. Roll a single Thievery check against the Perception DCs of all creatures who are currently observing you. You can typically only Palm Objects of negligible Bulk, though the GM might determine otherwise depending on the situation.%rSuccess The creature doesn't notice you Palming the Object.%rFailure The creature notices you Palming the Object."
  "Part the Veil":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["concentrate", "magical"]
    description: "Requirements You are not observed by any enemies%rEffect You phase yourself into the interstices, veiling yourself from physical reality. You become Concealed. You can use this concealment to hide or sneak as your disassociation from reality makes you difficult to focus on. If you use a hostile action, this effect ends after the action is complete; otherwise, it lasts for 1 minute."
  "Parting Shot":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["fighter"]
  "Passage of Lines":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "You command your allies to regroup, allowing endangered units to fall back while rested units press the advantage. Signal all squadmates within the aura of your commander's banner; each can swap positions with another willing ally adjacent to them. An ally can't swap into a space it can't fit into, and if one of the allies occupies more squares than the other, the smaller ally can move into any part of the larger ally's space as long as the two remain adjacent after the swap.%rPFS Note: This tactic can be used by Prone PCs, but not PCs who are Grabbed, Immobilized, or otherwise unable to move of their own volition."
  "Patron's Claim":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect Your familiar's mouth opens impossibly wide before your patron's grasping limb stretches forth from it at a creature within 30 feet, dealing 10d10 spirit damage with a Fortitude save against your spell DC. If the creature fails its save and takes damage, it is also Drained 2 (or Drained 4 on a critical failure) and you regain 1 Focus Point, up to your usual maximum, as your patron grants you additional magic in exchange for your gift of your opponent's spirit."
  "Patron's Presence":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["aura"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect A palpable weight extends from your familiar in a 15-foot. Enemies who enter or start their turn within the aura must succeed at a Will save against your spell DC or become Stupefied 2 as long as they remain within the aura, or Stupefied 3 on a critical failure. The aura lasts until the end of your next turn, but the familiar can Sustain it up to 1 minute."
  "Penetrating Projectile":
