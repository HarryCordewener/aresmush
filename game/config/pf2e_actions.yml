  "Indomitable Act":
    from: "action"
    for: "background"
    type: "reaction"
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You are about to attempt a check%rRequirements You are Frightened%rEffect You lean into your fear, using it to embolden you. You can roll the triggering check twice and take the higher result. This is a fortune effect."
  "Inevitable Return":
    from: "action"
    for: "class"
    type: "reaction"
    traits: ["concentrate", "necromancer", "thrall"]
    description: "Trigger A Small or Medium enemy within 30 feet dies.%rThe deaths of those around you simply fuel your undead army. You create a thrall in the triggering corpse's space. This thrall is the same size as the triggering creature."
  "Infiltrator's Draw":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rEffect You Interact to draw a gauntlet bow, hand crossbow, or repeating hand crossbow, then Strike with it. Alternatively, you can Strike with a loaded hand crossbow or repeating hand crossbow you're already holding and then Interact to stow it."
  "Influence":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "linguistic"]
    description: "You attempt to make a favorable impression on an NPC to convince the NPC to support your cause. Attempt a skill check to impress that NPC. The DC and skills which can apply can be found in the NPC's stat block.%rCritical Success You gain 2 Influence Points with the chosen NPC.%rSuccess You gain 1 Influence Point with the chosen NPC.%rFailure You gain no Influence Points with the chosen NPC.%rCritical Failure You lose 1 Influence Point with the chosen NPC."
  "Influence Rumor":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    description: "You spend at least 1 day of downtime attempting to manipulate the course, tone, or content of a rumor to your benefit. You need to succeed at a Diplomacy check to shift the rumor as you intend. The difficulty is determined by the GM based on the size of the community, the relative perceptiveness of the inhabitants, and the agency of other rumormongers, but it typically is no lower than DC 15 for a small village, DC 20 for a town, DC 30 for a city, or DC 40 for a metropolis."
  "Inner Strength":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "rage"]
  "Inscribe Shadow Pamor":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["occult", "shadow"]
    frequency: {"max": 1, "per": "PT1M"}
    description: "Frequency once per minute%rEffect You plunge your fist or weapon into your shadow, enveloping it in a rippling, damask-like pattern of darkness. If your next action is to Strike, the shadows cling to your foe with your attack, obscuring its vision. On a hit, the target of your Strike becomes Dazzled until the start of your next turn. The target can use an Interact action to tear away the clinging shadows and remove the dazzled condition. On a critical hit, the shadows are particularly stubborn and can't be torn away."
  "Inspired Stratagem":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: ["fortune", "linguistic"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Trigger An ally you reviewed stratagems with is about to attempt an attack roll or skill check%rEffect The ally rolls the triggering check twice and takes the better of the two results. That ally then becomes temporarily immune to your Inspired Stratagem until your next daily preparations.%rEffect: Inspired Stratagem"
  "Insta-Ballista":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rYour squad quickly assembles a special impromptu ballista and fires it to lethal effect. Signal all squadmates you previously chose to participate in this tactic (see Special); these squadmates must be within the aura of your commander's banner. They can all Stride as a free action to assemble into a close formation; as long as all the chosen squadmates end their movement no more than 10 feet away from any of the other chosen squadmates. They quickly assemble an impromptu ballista and fire it at an enemy of your choice within 200 feet.%rThis is a ranged Strike using your proficiency bonus with martial weapons and gets an item bonus to the attack roll you make with it equal to the number of assisting squadmates (maximum +4). It deals 10d12 piercing damage. Once the attack is completed, the pieces of the impromptu ballista fall apart.%rSpecial You must choose all squadmates who will participate in this tactic at the time you prepare it. Those squadmates must carry the pieces of your impromptu ballista, which can be made out of easily scavenged materials; these pieces are 8 Bulk in total and can be divided in 1 Bulk increments among any number of the chosen…"
  "Instant Opening":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "rogue"]
  "Instant Recovery":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "healing", "mythic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Spend a Mythic Point. You regain Hit Points equal to your Constitution modifier (minimum 1) × your level and remove the Fatigued condition. If you're suffering from any recurring affliction such as poison or disease, attempt a saving throw against the affliction at mythic proficiency to see if you reduce the affliction's stage. This saving throw cannot increase your affliction's stage, nor does it change the affliction's maximum duration."
  "Instinctive Obfuscation":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["gnome", "illusion", "visual"]
    frequency: {"max": 1, "per": "PT1H"}
  "Instinctive Support":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["druid"]
  "Intensify Vulnerability":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "esoterica", "magical", "thaumaturge"]
    frequency: {"max": 1, "per": "round"}
    description: "Prerequisites Exploit Vulnerability%rFrequency once per round%rRequirements You're benefiting from Exploit Vulnerability, you can see the subject, and you haven't used Exploit Vulnerability this round.%rYou present your implement and esoterica again, intensifying their effects on the target in a way unique to your implement. You gain the intensified vulnerability benefit from one of the implements you're holding, which lasts until the beginning of your next turn."
  "Interact":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    description: "You use your hand or hands to manipulate an object or the terrain. You can grab an unattended or stored object, draw a weapon, swap a held item for another, open a door, or achieve a similar effect. On rare occasions, you might have to attempt a skill check to determine if your Interact action was successful."
  "Intercept Attack":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["guardian"]
    description: "Trigger An ally within 10 feet of you takes physical damage.%rYou fling yourself in the way of oncoming harm to protect an ally. You can Step, but you must end your movement adjacent to the triggering ally. You take the damage instead of the triggering ally. Apply your own immunities, weaknesses, and resistances to the damage, not the ally's.%rSpecial You can extend this ability to an ally within 15 feet of you if the damage comes from your taunted enemy. If this ally is farther than you can Step to reach, you can Stride instead of Stepping; you still must end the movement adjacent to your ally."
  "Intercession Spell":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate", "divine", "spellshape"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger Your hierophant Casts a Spell%rEffect Interceding directly in your hierophant's affairs, you grant them additional magic. They do not expend the spell slot, usage, or Focus Point."
  "Interweave Dispel":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["sorcerer", "spellshape"]
  "Intimidating Strike":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "emotion", "fear", "fighter", "mental"]
  "Into the Fray":
    from: "action"
    for: "class"
    type: "free"
    category: "offensive"
    traits: ["gunslinger"]
    description: "Trigger You roll initiative.%rYou know trouble can lurk around every corner, and your hands never stray far from your holsters. You can Interact to draw a one-handed ranged weapon and can then Interact to draw a one-handed melee weapon. As your first action on your first turn, you can Stride as a free action toward an enemy you can perceive. If you can't perceive any enemies or can't end your movement closer to one, you can't use this Stride."
  "Inured to Death":
    from: "action"
    for: "background"
    type: "reaction"
    category: "defensive"
    traits: []
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You take damage from an effect with the death or void trait%rEffect You gain resistance to that damage equal to half your level (minimum 1)."
  "Invest an Item":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: []
    description: "You invest your energy in an item with the invested trait as you don it. This process requires 1 or more Interact actions, usually taking the same amount of time it takes to don the item. Once you've Invested the Item, you benefit from its constant magical abilities as long as you meet its other requirements (for most invested items, the only other requirement is that you must be wearing the item). This investiture lasts until you remove the item.%rYou can invest no more than 10 items per day. If you remove an invested item, it loses its investiture. The item still counts against your daily limit after it loses its investiture. You reset the limit during your daily preparations, at which point you Invest your Items anew. If you're still wearing items you had invested the previous day, you can typically keep them invested on the new day, but they still count against your limit."
  "Investigate":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You seek out information about your surroundings while traveling at half speed. You use Recall Knowledge as a secret check to discover clues among the various things you can see and engage with as you journey along. You can use any skill that has a Recall Knowledge action while Investigating, but the GM determines whether the skill is relevant to the clues you could find."
  "Invigorating Fear":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "interaction"
    traits: []
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rTrigger A creature within 60 feet gains the Frightened condition.%rYou are invigorated by the shock of a prank or the thrum of terror. You gain temporary Hit Points equal to the creature's level or 3, whichever is higher. You lose any temporary Hit Points after 1 minute."
  "Invoke Celestial Privilege":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You attempt a saving throw against a divine effect, but you haven't rolled yet.%rYou rise above the triggering effect, refusing to be harmed by it. You gain a +1 circumstance bonus to the triggering saving throw and to any other saving throws you attempt against divine effects until the start of your next turn."
  "Invoke Rune":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    traits: ["invocation", "magical", "runesmith"]
    description: "You utter the names of up to two of your runes within 30 feet, and each of which blazes with power, applying the effect in its Invocation entry. An invoked rune then fades away, its task completed. Though you can invoke up to two runes with a single Invoke Rune action, creatures that would be affected by multiple copies of the same rune are affected only once, as normal for duplicate effects."
  "Iron Command":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: ["champion", "divine", "emotion", "mental"]
    description: "Trigger An enemy in your champion's aura damages you%rEffect You put an impertinent foe who dared harm you in their proper place. You command your enemy to kneel before you in obedience. If they dare to refuse, they must pay the price in pain and anguish. The enemy must choose one of the following options.%rKneel The enemy drops Prone as a free action. Refuse You deal (ternary(gte(@actor.level,19),6,ternary(gte(@actor.level,16),5,ternary(gte(@actor.level,12),4,ternary(gte(@actor.level,9),3,ternary(gte(@actor.level,5),2,1))))))d6 mental damage to the enemy. This damage increases to 2d6 at 5th level, 3d6 at 9th level, 4d6 at 12th level, 5d6 at 16th level, and 6d6 at 19th level.%rRegardless of which option the enemy chose, your Strikes against it deal 1 extra spirit damage until the end of your next turn. This extra damage increases to 2 at 9th level and 3 at 16th level.%rEffect: Champion's Extra Damage"
  "Ironblood Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Ironblood Stance"
  "Ironblood Surge":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk"]
  "Jinx":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["curse", "occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You can curse another creature with clumsiness. This curse has a range of 30 feet, and you must be able to see your target. The target gets a Will saving throw against your class DC or spell DC, whichever is higher.%rSuccess The target is unaffected and temporarily immune for 24 hours.%rFailure The target is Clumsy 1 for 1 minute.%rCritical Failure The target is Clumsy 2 for 1 minute."
  "Jumping Jenny":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    description: "Target a flying creature within 60 feet. Until the start of your next turn, each time that creature attempts to Fly, they must succeed at an Acrobatics check to maneuver-in-flight against the DC of Launch Fireworks, or the Fly action is disrupted. If all the creature's attempts to Fly are disrupted, at the end of its turn, it falls harmlessly to the ground below."
  "Just One More Thing":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fortune", "investigator"]
  "Just as Planned":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["fortune", "investigator"]
    frequency: {"max": 1, "per": "PT1H"}
  "Kip Up":
    from: "feat"
    type: "free"
    category: "skill"
    traits: ["general", "skill"]
  "Kneecap":
    from: "feat"
    type: "action"
    cost: 1
    category: "ancestry"
    traits: ["goblin"]
  "Knockback":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "rage"]
  "Knockback Strike":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["concentrate", "monk"]
  "Knowledge of Shapes":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["cursebound", "oracle", "spellshape"]
  "Lantern Beam":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["fire", "light", "magical"]
    description: "Requirements Your lantern light is shining%rEffect Your lenses focus your light into a searing beam. You deal ((max(5,ceil(@actor.level/2)))d4) fire|options:area-damage damage to all creatures in a 30-foot, with a Reflex saving throw against the higher of your class DC or spell DC. Your lantern light then extinguishes, and you can't use this ability or use your lantern light again for 1d4 rounds. At 11th level and every two levels thereafter, the damage increases by 1d4."
  "Lantern Strobe":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["light", "magical", "visual"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect As you pulse your lantern, your emitters flash erratically, disorienting your opponents that see it. Each opponent in a 15-foot must attempt a Fortitude save against your class DC or spell DC (whichever is higher). On a failure, the creature is Dazzled for 1 round. On a critical failure, the creature is Blinded for 1 round and dazzled for the following round."
  "Launch Fireworks":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["manipulate"]
    description: "Cost 1 versatile vial%rRequirements You're holding or wearing an Alchemist's Toolkit and have a free hand%rEffect You set off a fireworks display. You can launch a normal firework to simply create a visual or audible signal within 20 feet or you can choose one of the following special effects. You can also use the comet, flower, or salute fireworks displays, and feats can add more options. A specific fireworks display takes the listed number of actions to launch and has the listed traits.%rComet 1 (visual) You shoot a streak of shining light in a 60-foot. All spaces in that line are lit with bright light until the start of your next turn. As part of this action, you can also Point Out a single creature in the line, and your allies do not need to hear or understand you.%rFlower 1 (visual) You ignite a ring of sparks, creating a shape that might be reminiscent of a flower blooming in the sky. Each enemy in a 20-foot must attempt a Fortitude save. On a failure, the enemy is Dazzled for 1 round, and on a critical failure they are dazzled for 2 rounds.%rSalute 1 (auditory) You create a startling bang or whistle. When you launch a salute display, you can choose a Confused or Fascinated…"
  "Lay Down Arms":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    description: "You pull your arm off, harmlessly severing it from your body and dropping it in an adjacent square. You can also use this action to reattach your severed arm if it's adjacent to you; it immediately functions normally. If the detached limb was at 0 Hit Points, it takes 10 minutes to reattach it instead of a single action."
  "Leading Dance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["bravado", "move", "swashbuckler"]
  "Leap":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    description: "You take a short horizontal or vertical jump. Jumping a greater distance requires using the Athletics skill for a High Jump or Long Jump.%rHorizontal Jump up to 10 feet horizontally if your Speed is at least 15 feet, or up to 15 feet horizontally if your speed is at least 30 feet. You land in the space where your Leap ends (meaning you can typically clear a 5-foot gap, or a 10-foot gap if your Speed is 30 feet or more). You can't make a horizontal Leap if your Speed is less than 15 feet. Vertical Jump up to 3 feet vertically and 5 feet horizontally onto an elevated surface."
  "Learn Name":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "secret"]
    description: "You spend a week trying to discover and learn a creature's name. The exact form of your effort varies depending on the skill you use, the resources you have available, and other circumstances. Decide if you are searching for the name of a specific individual or for names in general. If you're looking for the name of an individual, you must be able to clearly identify that individual; for example, \"the general leading the invasion\" is enough, but \"the person who killed the duchess\" isn't, if you don't know who killed the duchess. If you're searching for names more generally, name one creature type.%rThe GM chooses a DC, typically based on the level of the creature in question. If you're seeking names more generally, the DC is typically based on the level of the creature whose name the GM decides to provide, usually a creature from the chosen type of your level or lower. The GM might modify the DC of the task based on the resources you have available, or on using an unusually appropriate or inappropriate skill, or on other circumstances. Attempt a check with a skill that could be used to Recall Knowledge about the creature's type. After attempting to Learn a Name, you typically…"
  "Learn a Spell":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    check: {"slug": "learn-a-spell", "statistic": ["arcana", "nature", "occultism", "religion"], "options": ["action:learn-a-spell"], "notes": {"criticalSuccess": "You expend half the materials and learn the spell.", "success": "You expend the materials and learn the spell.", "failure": "You fail to learn the spell but can try again after you gain a level. The materials aren't expended.", "criticalFailure": "You fail to learn the spell but can try again after you gain a level. You expend half the materials."}}
    description: "Magical Traditions and Skills Each magical tradition has a corresponding skill, as shown on the table below. You must have the trained proficiency rank in a skill to use it to Identify Magic or Learn a Spell. Something without a specific tradition, such as an item with the magical trait, can be identified using any of these skills.%rMagical Tradition Corresponding Skill Arcane Arcana Divine Religion Occult Occultism Primal Nature%rRequirements You have a spellcasting class feature, and the spell you want to learn is on your magical tradition's spell list.%rYou can gain access to a new spell of your tradition from someone who knows that spell or from magical writing like a spellbook or scroll. If you can cast spells of multiple traditions, you can Learn a Spell of any of those traditions, but you must use the corresponding skill to do so. For example, if you were a cleric with the bard multiclass archetype, you couldn't use Religion to add an occult spell to your bardic spell repertoire.%rTo learn the spell, you must do the following:%rSpend 1 hour per spell rank, during which you must remain in conversation with a person who knows the spell or have the magical writing in your…"
  "Leech-Clip":
    from: "feat"
    type: "action"
    cost: 2
    category: "ancestry"
    traits: ["hobgoblin"]
  "Legendary Negotiation":
    from: "feat"
    type: "action"
    cost: 3
