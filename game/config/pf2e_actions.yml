  "Double Spellstrike":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["magus"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rRequirements Your Spellstrike is charged.%rYou Spellstrike, but you cast two spells instead of one. The combined rank of the spells must be 10 or less, and they must both meet the normal criteria for spells you can cast in a Spellstrike."
  "Double Team":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your team works together to set an enemy up for a vicious attack. Signal one squadmate who has an opponent within their reach. That ally can Shove or Reposition an opponent as a free action. If their maneuver is successful and the target ends their movement adjacent to a different squadmate, the second squadmate can attempt a melee Strike against that target as a reaction."
  "Draconic Frenzy":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["eidolon"]
    description: "Your eidolon makes one Strike with their primary unarmed attack and two Strikes with their secondary unarmed attack (in any order). If any of these attacks critically hits an enemy, your eidolon instantly recovers the use of their Dragon Breath."
  "Draconic Salvation":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate", "fortune"]
    description: "Trigger You critically fail a saving throw against an effect with the same tradition trait as your draconic benefactor (for instance, a divine spell if your benefactor is a diabolic dragon)%rRequirements Your spectral dragon is in your space%rEffect You improve your saving throw result by one degree of success, and Channel Draconic Essence ends."
  "Dragon Breath":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rEffect You breathe deeply and exhale a line or cone of powerful breath, much like the dragon with which you made the pact. If the dragon had a cone-shaped breath, your breath is a 30-foot cone. If they had a line-shaped breath, your breath is a 60-foot line. If they had a burst-shaped breath, your breath is a 10-foot burst within 60 feet. No matter the shape, it deals 1d6 damage per level ((@actor.level)d6 untyped|options:area-damage), of the same damage type as the dragon's breath, with a Reflex save, using the higher of your class DC or spell DC. This action has the same traits as the breath of the dragon you made the pact with."
  "Dragon Breath (Dragon Form)":
    from: "action"
    for: "spells"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    description: "You exhale deadly magical energy in an area, dealing 10d6 untyped|options:area-damage damage to each creature in the area with a basic save against your spell DC. The shape, damage type, and save type match that of your chosen dragon's breath. If the chosen dragon's breath can deal more than one type of damage, choose one when you cast dragon form . The shape is a 30-foot cone or a 100-foot line. Once activated, Dragon Breath can't be used again for 1d4 rounds. Dragon Breath has the tradition trait matching the type of dragon and the damage trait matching the type of damage it deals, if applicable."
  "Dragon Breath (Eidolon)":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["eidolon"]
    description: "Your eidolon exhales a blast of destructive energy that deals (ceil(@actor.level / 2))d6 untyped|options:area-damage damage to all creatures in an area with a basic Reflex save against your spell DC. Your eidolon then can't use Dragon Breath again for the next 1d4 rounds. At 3rd level and every 2 levels thereafter, the damage increases by 1d6.%rWhen the eidolon gains this ability, you choose the area—a 60-foot line or a 30-foot cone—as well as the damage type—acid, cold, electricity, fire, piercing, poison, or void. You can instead choose force if your eidolon has the arcane trait, spirit if they have the divine trait, or mental if they have the occult trait. If you model your eidolon after a specific type of dragon, your GM might allow you to choose from additional damage types.%rDragon Breath has the tradition trait of your eidolon and the trait matching the damage type chosen (unless you choose piercing damage)."
  "Dragon Roar":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "emotion", "fear", "mental", "monk"]
  "Dragon Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Dragon Stance"
  "Dragon Transformation":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "polymorph", "primal", "rage"]
    frequency: {"max": 1, "per": "PT10M"}
  "Dragon's Protection":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "offensive"
    traits: ["concentrate", "sanctified", "spirit"]
    description: "Trigger An enemy you can see would reduce this spell's target to 0 Hit Points%rEffect The dragon intercepts, preventing the spell's target from being knocked out; the spell's target remains at 1 Hit Point. As the dragon disappears, it flies over the triggering enemy and releases its retributive breath, dealing 5d4 spirit damage to it with a Reflex save."
  "Dragon's Rage Breath":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "concentrate", "rage"]
    frequency: {"max": 1, "per": "PT10M"}
  "Dragon's Rage Wings":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "morph", "rage"]
    self_effect: "Effect: Dragon's Rage Wings"
  "Drain Bonded Item":
    from: "action"
    for: "class"
    type: "free"
    category: "interaction"
    traits: ["arcane", "wizard"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rRequirements Your bonded item is on your person.%rYou expend the magical power stored in your bonded item. During the current turn, you can cast one spell you prepared today and already cast, without spending a spell slot. You must still Cast the Spell and meet the spell's other requirements."
  "Drain Life":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["divine", "eidolon", "void"]
    description: "Your eidolon attacks a living creature and drains some of the creature's life force to feed your shared link. Your eidolon Strikes a living enemy. If the Strike hits and deals damage, the target must attempt a Fortitude save against your spell DC, with the following effects. On a critical hit, the enemy uses the result one degree worse than it rolled.%rCritical Success No effect.%rSuccess Your eidolon drains a small amount of life force. The enemy takes additional void damage equal to half your level.%rFailure Your eidolon drains enough life force to satisfy itself. The enemy takes additional void damage equal to half your level and is Drained 1. Your eidolon gains temporary Hit Points equal to the enemy's level, which last for 1 minute.%rCritical Failure Your eidolon drains an incredible amount of life force and is thoroughly glutted with energy. As failure, but the enemy is Drained 2 and the temporary Hit Points are equal to double the enemy's level."
  "Drain Realm":
    from: "action"
    for: "archetype"
    type: "free"
    category: "interaction"
    traits: ["concentrate"]
    self_effect: "Effect: Drain Realm"
    description: "Trigger Your previous action was to Sustain your manifested realm%rRequirements Your manifested realm has a radius of at least 10 feet%rEffect You siphon power from your manifested realm to bolster your physical form. Decrease your manifested realm's radius by 10 feet. You regain a number of Hit Points equal to your level and each of your Strikes made before the end of your turn deal an additional 1d8 damage of your realm's damage type."
  "Drape Ambient Magic":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["illusion"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rEffect Your ostilli turns clear as it converts its stored magic into a bubble of refracting light around you. You become Hidden to all creatures until the end of your turn. If you Strike a creature, that creature is Off-Guard against that attack, and you then become observed."
  "Draw From the Pages":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["manipulate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rRequirements you are holding your spellbook%rEffect Spend a Mythic Point, and then Cast a Spell directly from your spellbook. The spell you cast must be one that takes one or two actions to cast, and it's automatically heightened to a rank equal to half your level. Use mythic proficiency to determine any attack rolls or spell DCs."
  "Drifter's Wake":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["gunslinger"]
    description: "You drift across the battlefield, striking down foes as you go. You Stride, and you can Strike up to three times at any points during your movement. Each attack must target a different enemy and must be made with a one-handed firearm, crossbow, melee weapon, or unarmed attack. Each attack counts toward your multiple attack penalty, but your multiple attack penalty doesn't increase until you've made all your attacks. Your movement doesn't trigger reactions."
  "Drink Blood":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["divine"]
    description: "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within your reach%rEffect You sink your fangs into that creature and drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed, and automatically succeeds for any of the other conditions. If you succeed, the creature becomes Drained 1, and you gain temporary HP equal to the target's level that last for 10 minutes. Further uses against the target don't increase the drained condition or grant you more temporary HP."
  "Drink from the Chalice":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["magical", "manipulate", "thaumaturge"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rRequirements You are holding your chalice implement.%rYou drink from the liquid that slowly collects in your chalice or administer it to an adjacent ally. The drinker chooses whether to take a small sip or to drain the contents.%rSip A sip grants the drinker an amount of temporary Hit Points equal to your level (minimum 3) that last until the end of your next turn.%rEffect: Drink from the Chalice%rDrain (healing, vitality) Drinking deep instead heals the drinker 3 Hit Points for each level you have. After the chalice is drained, it's left with only its slowly collecting dregs; the chalice can't be drained again, though it can still be sipped from. If 10 minutes pass without anyone drinking from the chalice, it refills itself and can be drained again. If the drinker has void healing, it can still heal in this way, and the effect has the void trait instead of healing and vitality."
  "Drink of my Foes":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["healing", "transcendence", "vitality"]
    description: "Requirements Your last action was a successful Strike with the Barrow's Edge%rEffect Your blade glows as it absorbs your foe's vitality. You regain Hit Points equal to half the damage dealt."
  "Drive":
    from: "action"
    for: "vehicles"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    check: {"slug": "drive", "statistic": "piloting", "options": ["action:drive", "action:drive"], "variants": {"drive1": {"name": "Drive1", "notes": {"criticalSuccess": "The vehicle moves up to its Speed and can turn normally.", "success": "The vehicle moves up to its Speed and can turn normally.", "failure": "The vehicle moves its Speed in a straight line.", "criticalFailure": "The vehicle moves its Speed in a straight line and becomes uncontrolled."}}, "drive2": {"name": "Drive2", "notes": {"criticalSuccess": "The vehicle moves up to twice its Speed in a straight line at the vehicle's current heading.", "success": "The vehicle moves up to twice its Speed in a straight line at the vehicle's current heading.", "failure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled.", "criticalFailure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled."}}, "drive3": {"name": "Drive3", "notes": {"criticalSuccess": "The vehicle moves up to three times its Speed in a straight line at the vehicle's current heading.", "success": "The vehicle moves up to three times its Speed in a straight line at the vehicle's current heading.", "failure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled.", "criticalFailure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled."}}}}
    description: "Requirements You are piloting a vehicle.%rYou pilot your vehicle to move. Decide how many actions you intend to spend before you begin Driving. The effects depend on the number of actions you spend. You can't Drive through spaces occupied by creatures, even if they are allies.%r1 Attempt a piloting check. On a success, the vehicle moves up to its Speed and can turn normally. On a failure, the vehicle moves its Speed in a straight line. On a critical failure, the vehicle moves its Speed in a straight line and becomes uncontrolled%r2 (reckless) The vehicle moves up to twice its Speed in a straight line at the vehicle's current heading.%r3 (reckless) You take a –5 penalty on your piloting check to maintain control of the vehicle. The vehicle moves up to three times its Speed in a straight line at the vehicle's current heading."
  "Drop Prone":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["move"]
    check: {"slug": "drop-prone", "statistic": null, "options": ["action:drop-prone"]}
    description: "You fall Prone."
  "Dual Finisher":
    from: "feat"
