    traits: ["flourish"]
    description: "Requirements You're wielding a one-handed melee weapon or a melee weapon with the agile or finesse trait%rEffect Make two Strikes against a target within your reach, one with the required weapon and one with your fist unarmed attack. If both hit the same target, combine their damage for the purposes of its resistances and weaknesses. Apply your multiple attack penalty to each Strike normally."
  "Overwhelming Energy":
