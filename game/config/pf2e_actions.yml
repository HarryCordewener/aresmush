    cost: 2
    category: "offensive"
    traits: ["divine", "eidolon", "emotion", "mental"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rEffect Your eidolon summons images of their sin into the mind of a target creature within 30 feet, tormenting and confusing the target. The target must attempt a Will save against your spell DC with the following effects. The effects last until the end of your next turn, but your eidolon can Sustain the effects to a maximum duration of 1 minute. If the target is unholy, it takes a –2 circumstance penalty to its save. Regardless of whether it succeeds, the target becomes temporarily immune for 1 day.%rCritical Success The target is unaffected.%rSuccess The target can't use reactions.%rFailure The target is Slowed 1 and can't use reactions.%rCritical Failure As failure, and the target is also Confused for 1 round. The confusion can't be extended, but the other effects can."
