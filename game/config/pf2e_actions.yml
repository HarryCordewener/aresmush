  "Recall Ammunition":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "interaction"
    traits: ["magical", "spellshot", "teleportation"]
    description: "Trigger You miss with a firearm or crossbow Strike.%rYou create a bond to your ammunition, calling your missed shot back. The ammunition you just fired is reloaded back into your weapon. If the ammunition was a piece of magical or alchemical ammunition that normally requires one or more actions to activate, you must re-activate it before firing again."
  "Recall Knowledge":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "secret"]
    check: {"slug": "recall-knowledge", "statistic": ["arcana", "crafting", "medicine", "nature", "occultism", "religion", "society"], "options": ["action:recall-knowledge"], "notes": {"criticalSuccess": "You recall the knowledge accurately. The GM answers your question truthfully and either tells you additional information or context, or answers one follow-up question.", "success": "You recall the knowledge accurately. The GM answers your question truthfully.", "criticalFailure": "You recall incorrect information. The GM answers your question falsely (or decides to give you no information, as on a failure)."}}
    description: "You attempt a skill check to try to remember a bit of knowledge regarding a topic related to that skill. Suggest which skill you'd like to use and ask the GM one question. The GM determines the DC. You might need to collaborate with the GM to narrow down the question or skills, and you can decide not to Recall Knowledge before committing to the action if you don't like your options.%rCritical Success You recall the knowledge accurately. The GM answers your question truthfully and either tells you additional information or context, or answers one follow-up question.%rSuccess You recall the knowledge accurately. The GM answers your question truthfully.%rCritical Failure You recall incorrect information. The GM answers your question falsely (or decides to give you no information, as on a failure)."
  "Recall Under Pressure":
    from: "action"
    for: "background"
    type: "free"
    category: "offensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Recall Under Pressure"
    description: "Trigger You attempt to Recall Knowledge during a combat%rFrequency once per day%rEffect Rather than roll a different skill to Recall Knowledge during the fight, your memory flashes back to something you read in some old book. You instead attempt this Recall Knowledge check with an Academia Lore check. If the information you recall ends up being helpful and positive in an obvious way before you take your next turn, draw a random harrow card. You gain a +1 status bonus to saving throws for the remainder of the combat encounter as your morale soars or a +2 status bonus if the card you drew was from the suit of Books."
  "Recall the Teachings":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["occult", "psyche", "psychic"]
    description: "The heightened power of your psyche lets you recall every lesson you've ever learned. You search your mind for the right teaching, which at first seems cryptic but comes into clarity when it's most relevant. Until the start of your next turn, you count as having prepared to Aid all allies within 30 feet of you. If you use the Aid reaction to help one of them during that time, you roll an Occultism check for aid skill=occultism traits=auditory,linguistic as you recall a lesson to help them. Most lessons take the form of short axioms, parables, or sayings, meaning that conveying them to your ally usually grants your Aid reaction the auditory and linguistic traits."
  "Recenter":
    from: "action"
    for: "subsystems"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate"]
    description: "Requirements You're in a psychic duel and are trained in the statistic matching the psychic center you are changing to.%rYou adopt the psychic center matching the emotion of your choice. If you were already psychically centered, you lose your old psychic center when you adopt the new one."
  "Reckless Abandon":
    from: "feat"
    type: "free"
    category: "ancestry"
    traits: ["fortune", "goblin"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Reckless Abandon (Goblin)"
  "Reclaim Destiny":
    from: "action"
    for: "background"
    type: "free"
    category: "interaction"
    traits: ["occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day;%rTrigger You are about to attempt a check and are affected by a fortune or misfortune effect that modifies the triggering check;%rEffect You break the influence over your fortunes and claim a stable hold over your fate. You ignore the fortune or misfortune effect and can roll the triggering roll normally."
  "Recognize Ambush":
    from: "feat"
    type: "free"
    category: "ancestry"
    traits: ["hobgoblin"]
  "Recognize Spell":
    from: "feat"
    type: "reaction"
    category: "skill"
    traits: ["general", "secret", "skill"]
  "Reconnoiter":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["concentrate"]
    description: "You spend time surveying and exploring a specific area, getting the lay of the land and looking for unusual features and specific sites. Reconnoitering a single hex takes a number of hexploration activities equal to the number of Travel activities necessary to traverse the hex-1 for open terrain, 2 for difficult terrain, and 3 for greater difficult terrain. Traveling on roads doesn't lessen the time required to Reconnoiter. Once the hex has been Reconnoitered, you can Map the Area to reduce your chance of getting lost in that hex. You automatically find any special feature that doesn't require a check to find, and you attempt the appropriate checks to find hidden special features.%rFor instance, if you were looking for an obvious rock formation among some hills, you would spend 2 hexploration activities to Reconnoiter the hex, and you'd find the rock formation. But if you were looking for a hidden tengu monastery somewhere in some deep forests, after spending 2 activities to Reconnoiter the forest hex, you would have to succeed at a Perception check as part of your Reconnoiter activity to find the monastery."
  "Redistribute":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["eidolon"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rTrigger An enemy's Strike against your eidolon is a critical hit.%rYour eidolon rearranges its component bodies in response to a powerful blow, mitigating the worst of the damage they would have taken. The triggering critical hit becomes a hit. Your eidolon immediately switches forms, from condensed to dispersed or from dispersed to condensed."
  "Reflexive Courage":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["auditory", "bard", "concentrate"]
  "Reflexive Stance":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["monk"]
  "Refocus":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "Requirements You have a focus pool.%rYou spend 10 minutes performing deeds to restore your magical connection. This restores 1 Focus Point to your focus pool. The deeds you need to perform are specified in the class or ability that gives you your focus spells. These deeds can usually overlap with other tasks that relate to the source of your focus spells. For instance, a cleric with focus spells from a holy deity can usually Refocus while tending the wounds of their allies."
  "Regurgitate Mutagen":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["alchemist", "manipulate"]
  "Rejoin in Flight":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["transcendence"]
    description: "You throw your weapon ikons to either side of a creature, and they seek each other out, converging on the target. Make two thrown Strikes against a target within the first range increment of both your weapon ikons. This counts as two attacks toward your multiple attack penalty, but the penalty doesn't increase until after you've made both attacks. The target is flanked for both attacks (typically making it Off-Guard against both attacks). If both Strikes hit, the target also takes an additional die of weapon damage. The weapons then return to your hand."
  "Release":
    from: "action"
    for: "everyone"
    type: "free"
    category: "interaction"
    traits: ["manipulate"]
    description: "You release something you're holding in your hand or hands. This might mean dropping an item, removing one hand from your weapon while continuing to hold it in another hand, releasing a rope suspending a chandelier, or performing a similar action. Unlike most manipulate actions, Release does not trigger reactions that can be triggered by actions with the manipulate trait (such as Reactive Strike).%rIf you want to prepare to Release something outside of your turn, use the Ready activity."
  "Relentless Assault":
    from: "action"
    for: "campaign"
    type: "free"
    category: "offensive"
    traits: ["fortune"]
    description: "Frequency once per day%rTrigger A creature would succeed or critically succeed at a saving throw against the offensive ability of a troop you command%rEffect With an encouraging command, you direct your troop to make a few additional attacks. The triggering creature rerolls its saving throw and uses the worse result."
  "Reload!":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your drill instruction kicks in, and your allies rapidly reload their weapons to prepare for the next volley. Signal all squadmates; each can immediately Interact to reload as a reaction.%rSpecial When leading a siege weapon crew, you can use this tactic to command your squadmates to Load a siege weapon instead."
  "Reloading Cascade":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: []
    description: "You use Arcane Cascade and Interact to reload a firearm."
  "Reloading Strike":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["gunslinger"]
    description: "Requirements You're wielding a firearm or crossbow in one hand, and your other hand either wields a one-handed melee weapon or is empty.%rYou make a melee attack and reload in one fluid movement. Strike an opponent within reach with your one-handed melee weapon (or, if your other hand is empty, with an unarmed attack), and then Interact to reload. You don't need a free hand to reload in this way and this reload does not trigger reactions."
  "Remediate":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["cleric", "concentrate", "spellshape"]
    frequency: {"max": 1, "per": "PT1H"}
  "Remove Head":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    description: "Effect You Interact to remove your head from your ghostly body and hold it in a free hand. While your head is detached, you can use it to look around and over obstacles while remaining behind cover, although you don't have line of effect to target creatures unless the effect originates from your head. You can leave your head behind and move your body around independently, but your head gains the Paralyzed condition and your body becomes blind, deaf, and unable to take any action that has the auditory trait that requires speech or vocalization. You can cause your head to dematerialize and reappear atop your neck as a free action, which occurs automatically if it takes damage while detached or is separated from your body by more than 50 feet."
  "Renewed Vigor":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "rage"]
    self_effect: "Effect: Renewed Vigor"
  "Repair":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "manipulate"]
    check: {"slug": "repair", "statistic": "crafting", "options": ["action:repair"], "notes": {"criticalSuccess": "You restore 10 Hit Points to the item, plus an additional 10 Hit Points per proficiency rank you have in Crafting (a total of 20 HP if you're trained, 30 HP if you're an expert, 40 HP if you're a master, or 50 HP if you're legendary).", "success": "You restore 5 Hit Points to the item, plus an additional 5 per proficiency rank you have in Crafting (for a total of 10 HP if you are trained, 15 HP if you're an expert, 20 HP if you're a master, or 25 HP if you're legendary).", "criticalFailure": "You deal 2d6 damage to the item. Apply the item's Hardness to this damage."}}
    description: "Requirements You are holding or wearing a Repair Kit%rYou spend 10 minutes attempting to fix a damaged item, placing the item on a stable surface and using the repair kit with both hands. The GM sets the DC, but it's usually about the same DC to Repair a given item as it is to Craft it in the first place. You can't Repair a destroyed item.%rCritical Success You restore 10 Hit Points to the item, plus an additional 10 Hit Points per proficiency rank you have in Crafting (a total of 20 HP if you're trained, 30 HP if you're an expert, 40 HP if you're a master, or 50 HP if you're legendary).%rSuccess You restore 5 Hit Points to the item, plus an additional 5 per proficiency rank you have in Crafting (for a total of 10 HP if you are trained, 15 HP if you're an expert, 20 HP if you're a master, or 25 HP if you're legendary).%rCritical Failure You deal 2d6 damage to the item. Apply the item's Hardness to this damage."
  "Repeat a Spell":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You repeatedly cast the same spell while moving at half speed. Typically, this spell is a cantrip that you want to have in effect in the event a combat breaks out, and it must be one you can cast in 2 actions or fewer. Repeating a spell that requires making complex decisions, such as Figment, can make you Fatigued, as determined by the GM."
  "Repel Ambient Magic":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["concentrate"]
    self_effect: "Effect: Repel Ambient Magic"
    description: "Your ostilli glows green as it absorbs magic. Until the start of your next turn, you gain a +1 circumstance bonus to AC and saving throws against the next magical attack, cantrip, or spell that targets you. This bonus increases to +2 at 12th level."
  "Reposition":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack"]
    check: {"slug": "reposition", "statistic": "athletics", "options": ["action:reposition", "forced-movement"], "against": "fortitude", "notes": {"criticalSuccess": "You move the creature up to 10 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.", "success": "You move the target up to 5 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.", "criticalFailure": "The target can move you up to 5 feet as though it successfully Repositioned you."}}
    description: "Requirements You either have at least one hand free, or you're grabbing or restraining the target. The target can't be more than one size larger than you.%rYou muscle a creature or object around. Attempt an Athletics check against the target's Fortitude DC.%rCritical Success You move the creature up to 10 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.%rSuccess You move the target up to 5 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.%rCritical Failure The target can move you up to 5 feet as though it successfully Repositioned you."
  "Request":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "concentrate", "linguistic", "mental"]
    check: {"slug": "request", "statistic": "diplomacy", "options": ["action:request"], "notes": {"criticalSuccess": "The target agrees to your request without qualifications.", "success": "The target agrees to your request, but they might demand added provisions or alterations to the request.", "failure": "The target refuses the request, though they might propose an alternative that is less extreme.", "criticalFailure": "Not only does the target refuse the request, but their attitude toward you decreases by one step due to the temerity of the request."}}
    description: "You can make a request of a creature that's friendly or helpful to you. You must couch the request in terms that the target would accept given their current attitude toward you. The GM sets the DC of the Diplomacy check based on the difficulty of the request. Some requests are unsavory or impossible, and even a helpful NPC would never agree to them.%rCritical Success The target agrees to your request without qualifications.%rSuccess The target agrees to your request, but they might demand added provisions or alterations to the request.%rFailure The target refuses the request, though they might propose an alternative that is less extreme.%rCritical Failure Not only does the target refuse the request, but their attitude toward you decreases by one step due to the temerity of the request."
  "Research":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You comb through information to learn more about the topic at hand. Choose your research topic, section of the library, or other division depending on the form of research, and attempt a skill check. The skills to use and the DC for the check depend on the specific research task, and the Research activity gains any traits appropriate to the type of research (such as linguistic when perusing books).%rCritical Success You gain 2 RP.%rSuccess You gain 1 RP.%rCritical Failure You make a false discovery and lose 1 RP."
  "Resist Elf Magic":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You attempt a saving throw against a magical effect but haven't rolled yet%rYour ancestral resistance to magic protects you. You gain a +1 circumstance bonus to the triggering saving throw. If the triggering effect is arcane, you gain a +2 circumstance bonus instead."
  "Resist Magic":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: []
    description: "Trigger You attempt a saving throw against a harmful magical effect but haven't rolled yet.%rYour innate magic protects you. You gain a +1 circumstance bonus to the triggering saving throw. Additionally, if the triggering effect is arcane, if you roll a success, you get a critical success instead."
  "Resounding Blow":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "rage"]
  "Resounding Finale":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["bard", "concentrate"]
  "Restorative Strike":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["cleric"]
    self_effect: "Effect: Restorative Strike"
  "Restorative Teleportation":
    from: "action"
    for: "background"
    type: "reaction"
    category: "offensive"
    traits: ["healing"]
    frequency: {"max": 1, "per": "PT1M"}
    description: "Frequency once per minute%rTrigger You arrive at a location via a teleportation effect%rEffect When you reappear after the teleportation, your body takes advantage of the teleportation to put itself back together in a healthier state, and you restore a number of Hit Points equal to 1d6 plus your level plus your Intelligence modifier ((1d6 + @actor.level + @actor.system.abilities.int.mod) healing)."
  "Restore the Mind":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    traits: ["emotion", "healing", "mental", "psyche", "psychic"]
    description: "Your unleashed psyche gives you closer connections to the emotions of your allies, letting you project reassurance and strength that replenishes their mind and body. Choose one of the two benefits to grant one ally within 30 feet that you can see. That ally is then temporarily immune for 10 minutes.%rThe ally gains a +1 status bonus to saving throws against mental effects until your psyche ends. The ally regains Hit Points equal to 2 + double your level."
  "Restore the Moment":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["mythic", "occult"]
    description: "Trigger Your turn begins%rEffect Spend a Mythic Point. Take the same actions in the same order, using the same die roll results to resolve those actions, as you did in the preserved moment, and apply modifiers to those rolls as they currently exist (not as they were when you recorded the loop), but at mythic proficiency. The exact details of how you accomplish your restored actions can change—you need not move in the exact same pattern or distance with a repeated Stride, for example, nor must you make a repeated Strike against the same foe you attacked in the first set of actions, but you do need to use the same type of movement when you Stride, and you do need to use the same type of weapon to Strike. If at any point during your turn you are unable to take the next action in the loop, your turn ends and you become Stunned 1. For example, if you restored the above example against the firewyrm in a round where you were fighting an ogre and you weren't able to attempt a Strike with a longsword against the ogre as your second action, you would become stunned 1. Likewise, if at the end of your turn there was nothing for you to try to Climb, you would become stunned 1. You can preserve…"
  "Retraining":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    description: "Retraining offers a way to alter your character choices, which is helpful when you want to take your character in a new direction or change decisions that didn't meet your expectations. You can retrain feats, skills, and some selectable class features. You can't retrain your ancestry, heritage, background, class, or attribute modifiers. You can't perform other downtime activities while retraining.%rRetraining usually requires you to spend time learning from a teacher, whether that entails physical training, studying at a library, or falling into shared magical trances. Your GM determines whether you can get proper training or whether something can be retrained at all. In some cases, you'll have to pay your instructor. Some abilities can be difficult or impossible to retrain (for instance, witch can retrain their patron only in extraordinary circumstances).%rWhen retraining, you generally can't make choices you couldn't make when you selected the original option. For instance, you can't replace a skill feat you chose at 2nd level for a 4th-level one, or for one that requires prerequisites you didn't meet at the time you took the original feat. If you don't remember whether you met…"
  "Retreating Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Retributive Strike":
    from: "action"
    for: "class"
    type: "reaction"
    category: "offensive"
    traits: ["champion", "divine"]
    description: "Trigger An enemy damages your ally, and both are in your champion's aura%rEffect You protect your ally and strike your enemy. The ally gains resistance to all damage against the triggering damage equal to 2 + your level. If the enemy is within reach, make a melee Strike against it.%rEffect: Champion's Resistance"
  "Revealing Stab":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["fighter"]
  "Reverberate":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["bard"]
  "Revitalizing Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Revivifying Mutagen":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["alchemist", "concentrate"]
  "Rewrite Fate":
    from: "action"
    for: "mythic"
    type: "free"
    category: "interaction"
    traits: ["fortune", "mythic"]
    description: "Trigger You roll a skill check or saving throw and don't like the result.%rDestiny, fate, or some other force bends around you as your mythic power swells, manifesting in a flash of light or visible surge of energy emanating from your body as you cast aside the chains of fate. You expend a Mythic Point and reroll the check or save with mythic proficiency, taking the new result."
  "Ricochet Stance (Fighter)":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "stance"]
    self_effect: "Stance: Ricochet Stance"
  "Ricochet Stance (Rogue)":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["rogue", "stance"]
    self_effect: "Stance: Ricochet Stance"
  "Ring Bell":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["auditory", "magical", "manipulate", "sonic", "thaumaturge"]
    description: "Trigger The target of your Exploit Vulnerability makes a Strike or Casts a Spell that would affect you or one of your allies.%rRequirements You are holding your bell implement, and the triggering creature is within 30 feet of you.%rYour implement sings out abruptly, disrupting your foe. The piece played depends on whether the trigger was a Strike or Spell, and it applies to the triggering Strike or Spell, except where noted otherwise.%rDistracting Cacophony The trigger is a spell. You create a musical crash of sonic energy that assails the target and breaks its concentration. The target must succeed at a Fortitude save against your class DC or become Stupefied 1 until the end of your next turn (Stupefied 2 on a critical failure). The target doesn't have to attempt a flat check to avoid losing the triggering spell, but the discordant ring does lower the spell attack modifier or spell DC of the triggering spell from stupefied. Disrupting Harmony The trigger is a Strike. You create a strangely discordant harmony that sinks into your foe's body and throws its movements off. The target must succeed at a Will save against your class DC or become your choice of Enfeebled 1 or Clumsy 1…"
  "Ringing Challenge":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["sonic", "spirit", "transcendence"]
    description: "You clang your ikon against a weapon, shield, or the ground, emitting a shock wave that deals (max(1,(floor((@actor.level - 2)/2))))d4 spirit,(max(1,(floor((@actor.level - 2)/2))))d4 sonic|options:area-damage damage to all creatures in a 30-foot cone or 15-foot emanation (Fortitude save). A creature that critically fails its saving throw is Deafened for 1 minute.%rAt 6th level and every 2 levels thereafter, the damage increases by 1d4 spirit damage and 1d4 sonic damage."
  "Roaring Charge":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rYou and your squad surge forward with a mighty roar. Signal all squadmates within the aura of your commander's banner. As a reaction, these squadmates can Stride up to twice their Speed directly toward any enemy they are observing.%rAny creature within 10 feet of a squadmate once all movement from this tactic has been completed must attempt a Will save against your class DC with the following results. This is an emotion, fear, incapacitation, and mental effect.%rCritical Success No effect.%rSuccess The target is Frightened 1.%rFailure The target is Frightened 2.%rCritical Failure The target is Frightened 3 and Fleeing for 1 round."
  "Roll the Bones of Fate":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["cursebound", "divine", "oracle", "prediction"]
    frequency: {"max": 1, "per": "PT10M"}
  "Rouse the World":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "primal"]
    description: "The flora, fauna, and elements in a 10-foot burst within 30 feet stir, aiding you and your allies and whispering in your ear. This area is known as your waking world. While in your waking world, you and your allies gain a +1 circumstance bonus to Athletics and Acrobatics checks, and you gain a +1 circumstance bonus to Nature checks to Recall Knowledge about creatures and hazards in the area.%rThe effect lasts for 10 minutes, but you can Dismiss it. Once per round on subsequent turns, you can Sustain this ability to increase the burst's size by 10 feet. You can Rouse the World in only one area at a time; if you use this ability again, the first area returns to normal."
  "Royal Grace":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "linguistic", "mental"]
    description: "You spend 10 minutes conferring with one of your knights who has the doomed condition. By discussing plans for your future kingdom with them and describing the benefits of your rule, you can attempt to soothe their spirits. Attempt a Diplomacy or Society check against a hard DC of your knight's level. Regardless of the result, that knight gains the benefits of the Refocus activity (if they have a focus pool) but is temporarily immune to Royal Grace for 24 hours.%rCritical Success The knight's doomed condition is reduced by 2 (minimum 0).%rSuccess The knight's doomed condition is reduced by 1 (minimum 0).%rFailure The knight's doomed condition isn't reduced."
  "Run Over":
    from: "action"
    for: "vehicles"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["move"]
    check: {"slug": "run-over", "statistic": "piloting", "options": ["action:run-over", "action:run-over"], "notes": {"failure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled.", "criticalFailure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled."}}
    description: "Requirements You are piloting a vehicle.%r(reckless) You try to run over creatures with your vehicle, possibly also ramming one larger creature or object. If you maintain control of your vehicle, the vehicle moves up to twice its Speed in a straight line at the vehicle's current heading. You attempt to run over any creatures in your path two sizes smaller than the vehicle or smaller, and you can attempt to ram one target creature or object in your path one size smaller than the vehicle or larger.%rEach creature in your path, including a rammed target, takes the vehicle's collision damage (basic Reflex save at vehicle's collision DC). If the rammed target is a vehicle, its pilot can attempt a piloting check in place of this Reflex save, with the same results. If the target of your ram takes damage, you and your vehicle each take collision damage (no save) and your movement ends."
  "Runelord's Response":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["arcane", "concentrate"]
    description: "Trigger A creature deals damage to you with a spell%rEffect You gain a measure of revenge immediately by twisting the magic used by the triggering creature. Spend a Mythic Point. The triggering creature takes 6d8 force damage, with a Will saving throw against either your class DC or spell DC using mythic proficiency, whichever is higher. At 14th level, and every 2 levels thereafter, this damage increases by 1d8."
  "Sabotage":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["incapacitation", "rogue"]
  "Safeguard Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "sorcerer", "spellshape"]
  "Salt Wound":
    from: "action"
    for: "heritage"
    type: "reaction"
    category: "offensive"
    traits: ["undine"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger A creature that has blood and is not at its maximum Hit Points hits you with a melee Strike%rEffect You channel salt and brine from your blood into the creature's wounds. The creature must attempt a Fortitude using your class DC or spell DC, whichever is higher. On a failure, the creature takes 1d6 persistent acid damage and is Sickened 1 by the pain. On a critical failure, it instead takes 2d6 persistent acid damage and is Sickened 2."
  "Sanctify Armament":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["cleric", "divine"]
    frequency: {"max": 1, "per": "round"}
  "Sanctify Water":
    from: "feat"
    type: "action"
    cost: 1
    category: "skill"
    traits: ["general", "skill"]
  "Sanguine Revitalization":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rYour squad is rejuvenated by the arterial spray of your enemies. Choose a creature within the aura of your commander's banner and signal all squadmates within the aura who are wielding a piercing or slashing melee weapon, or who have a piercing or slashing melee unarmed attack. Those allies can Stride up to half their Speed as a free action. If they end this movement within reach of the designated target, they can Strike the target with the required weapon or unarmed attack as a reaction.%rOnce all Strikes are completed, if the target took damage and is not immune to bleed damage, it must succeed at a Fortitude saving throw against your class DC or take 10 points of persistent bleed damage. The target takes a circumstance penalty on their save equal to the number of successful Strikes made as part of this tactic (up to a maximum –4 circumstance penalty).%rEffect: Sanguine Revitalization%rYour squadmates are energized by the display of your enemy's imminent defeat; each squadmate in a 20-foot emanation is healed for 10d6 healing Hit Points."
  "Sapping Symbol":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["cleric", "divine"]
  "Scare to Death":
    from: "feat"
    type: "action"
    cost: 1
    category: "skill"
    traits: ["emotion", "fear", "general", "incapacitation", "skill"]
  "Scars of Steel":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["barbarian", "rage"]
    frequency: {"max": 1, "per": "day"}
  "Scintillating Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "light", "sorcerer", "spellshape", "wizard"]
  "Scoundrel's Surprise":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["rogue"]
  "Scouring Rage":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["barbarian"]
  "Scout":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You scout ahead and behind the group to watch danger, moving at half speed. At the start of the next encounter, every creature in your party gains a +1 circumstance bonus to their initiative rolls.%rEffect: Scout"
  "Scout Location":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["downtime", "secret"]
    description: "You spend time observing the place or group you wish to infiltrate. Attempt a normal, hard, or very hard DC Perception, Society or Stealth check.%rSuccess You make observations that provide 1 EP.%rFailure You learn nothing particularly noteworthy.%rCritical Failure You misjudge some aspect of what you observed, gaining 1 EP that results in a critical failure instead of a success when used, even if a PC uses the Edge Point after rolling a failure."
  "Scout's Warning":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["ranger", "rogue"]
  "Scrappy Defiance":
    from: "action"
    for: "campaign"
    type: "free"
    category: "interaction"
    traits: ["mental"]
    description: "Frequency once per day%rTrigger Your turn begins, and you are commanding a troop%rEffect You encourage your followers to persevere against all hardships. The troop you command gains temporary Hit Points equal to twice your level which last for 1 minutes. If your troop's size would be reduced due to damage, you can attempt a DC 16 Flat; on a success, your troop's size isn't reduced at that threshold until the end of your next turn."
  "Search":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You Seek meticulously for hidden doors, concealed hazards, and so on. You can usually make an educated guess as to which locations are best to check and move at half speed, but if you want to be thorough and guarantee you checked everything, you need to travel at a Speed of no more than 300 feet per minute, or 150 feet per minute to ensure you check everything before you walk into it. You can always move more slowly while Searching to cover the area more thoroughly, and the Expeditious Search feat increases these maximum Speeds. If you come across a secret door, item, or hazard while Searching, the GM will attempt a free secret check to Seek to see if you notice the hidden object or hazard. In locations with many objects to search, you have to stop and spend significantly longer to search thoroughly."
  "Second Sting":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["press", "ranger"]
  "Second Thoughts":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["concentrate", "mental", "wizard"]
  "Secondary Detonation Array":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["manipulate", "spellshape", "wizard"]
  "Secure Disguises":
    from: "action"
    for: "subsystems"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    description: "You seek to procure or create disguises. Attempt a normal, hard, or very hard Crafting, Deception, Performance, or Society check.%rSuccess You procure or creates disguises, gaining 1 EP that can be used only to maintain a cover identity.%rFailure Your efforts result in an unusable disguise."
  "Seek":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "secret"]
    check: {"slug": "seek", "statistic": "perception", "options": ["action:seek"], "notes": {"criticalSuccess": "Any Undetected or Hidden creature you critically succeeded against becomes Observed by you. You learn the location of objects in the area you critically succeeded against.", "success": "Any Undetected creature you succeeded against becomes Hidden from you instead of undetected, and any hidden creature you succeeded against becomes Observed by you. You learn the location of any object or get a clue to its whereabouts, as determined by the GM."}}
    description: "You scan an area for signs of creatures or objects, possibly including secret doors or hazards. Choose an area to scan. The GM determines the area you can scan with one Seek action—almost always 30 feet or less in any dimension. The GM might impose a penalty if you search far away from you or adjust the number of actions it takes to Seek a particularly cluttered area.%rThe GM attempts a single secret Perception check for you and compares the result to the Stealth DCs of any Undetected or Hidden creatures in the area, or the DC to detect each object in the area (as determined by the GM or by someone Concealing the Object). A creature you detect might remain hidden, rather than becoming Observed, if you're using an imprecise sense or if an effect (such as Invisibility) prevents the subject from being observed.%rCritical Success Any undetected or hidden creature you critically succeeded against becomes observed by you. You learn the location of objects in the area you critically succeeded against.%rSuccess Any undetected creature you suceeded against becomes hidden from you instead of undetected, and any hidden creature you succeeded against becomes observed by you. You learn the…"
  "Seek and Destroy":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rYou direct your team to uncover hidden foes and exploit newly discovered weaknesses. Signal up to two squadmates within the aura of your commander's banner; they can immediately seek as a free action. Afterward, each can spend a reaction to either Point Out an enemy, Stride toward an enemy they're observing, or attempt to Strike an enemy they're observing. Each of the squadmates deals additional precision damage equal to half your level with their next successful Strike before the end of your next turn against a creature that has become observed by them from a successful Perception check to Seek."
  "Seething Frenzy":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["concentrate", "eidolon", "emotion", "mental"]
    description: "Your eidolon's fury boils over into a reckless, out-of-control frenzy. While frenzied, your eidolon is affected by Boost Eidolon and gains temporary Hit Points equal to your level, but takes a –1 penalty to AC. Your eidolon can't voluntarily end the frenzy or start another frenzy while in the frenzy. The frenzy and the accompanying temporary Hit Points last for 1 minute or until your eidolon is no longer manifested, whichever comes first, after which they can't start another frenzy for 1 minute.%rWhen your eidolon makes a Furious Strike while in a Seething Frenzy, the status bonus from boost eidolon is 3 per damage die. The extra damage die from Furious Strike still doesn't count toward boost eidolon 's bonus, as normal for weapon dice added by abilities."
  "Selfish Shield":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["champion", "divine"]
    description: "Trigger An enemy in your champion's aura damages you%rEffect Your self-interest keeps you safe. You gain resistance against the triggering damage equal to 2 + half your level, regardless of damage type.%rEffect: Selfish Shield%rIn addition, your Strikes against the triggering creature deal 1 extra spirit damage until the end of your next turn. This extra damage increases to 2 at 9th level and 3 at 16th level.%rEffect: Champion's Extra Damage"
  "Sense Direction":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "secret"]
    check: {"slug": "sense-direction", "statistic": "survival", "options": ["action:sense-direction"], "modifiers": [{"label": "No Compass", "value": -2, "type": "item", "predicate": [{"not": "compass-in-possession"}]}], "notes": {"criticalSuccess": "You get an excellent sense of where you are. If you are in an environment with cardinal directions, you know them exactly.", "success": "You gain enough orientation to avoid becoming hopelessly lost. If you are in an environment with cardinal directions, you have a sense of those directions."}}
    description: "Using the stars, the position of the sun, traits of the geography or flora, or the behavior of fauna, you can stay oriented in the wild. Typically, you attempt a Survival check only once per day, but some environments or changes might necessitate rolling more often. The GM determines the DC and how long this activity takes (usually just a minute or so). More unusual locales or those you're unfamiliar with might require you to have a minimum proficiency rank to Sense Direction. Without a Compass, you take a –2 item penalty to checks to Sense Direction.%rCritical Success You get an excellent sense of where you are. If you are in an environment with cardinal directions, you know them exactly.%rSuccess You gain enough orientation to avoid becoming hopelessly lost. If you are in an environment with cardinal directions, you have a sense of those directions.%rSense Direction Tasks Untrained determine a cardinal direction using the sun Trained find an overgrown path in a forest Expert navigate a hedge maze Master navigate a byzantine labyrinth or relatively featureless desert Legendary navigate an ever-changing dream realm"
  "Sense Motive":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "secret"]
    check: {"slug": "sense-motive", "statistic": "perception", "options": ["action:sense-motive"], "against": "deception", "notes": {"criticalSuccess": "You determine the creature's true intentions and get a solid idea of any mental magic affecting it.", "success": "You can tell whether the creature is behaving normally, but you don't know its exact intentions or what magic might be affecting it.", "failure": "You detect what a deceptive creature wants you to believe. If they're not being deceptive, you believe they're behaving normally.", "criticalFailure": "You get a false sense of the creature's intentions."}}
    description: "You try to tell whether a creature's behavior is abnormal. Choose one creature and assess it for odd body language, signs of nervousness, and other indicators that it might be trying to deceive someone. The GM attempts a single secret Perception check for you and compares the result to the Deception DC of the creature, the DC of a spell affecting the creature's mental state, or another appropriate DC determined by the GM. You typically can't try to Sense the Motive of the same creature again until the situation changes significantly.%rCritical Success You determine the creature's true intentions and get a solid idea of any mental magic affecting it.%rSuccess You can tell whether the creature is behaving normally, but you don't know its exact intentions or what magic might be affecting it.%rFailure You detect what a deceptive creature wants you to believe. If they're not being deceptive, you believe they're behaving normally.%rCritical Failure You get a false sense of the creature's intentions."
  "Sense Weakness":
    from: "action"
    for: "subsystems"
    type: "reaction"
    category: "interaction"
    traits: []
    description: "Trigger You attempt a melee Strike against your opponent, but haven't rolled yet.%rRequirements You're in a duel, you're trained in Perception, and you rolled a Perception check for initiative this round.%rYou pick a precise moment to attack, giving you an edge. Your opponent is Off-Guard against the attack. If your opponent is using Deception for initiative when this ability is used, they are instead off-guard until the start of their next turn."
  "Sense the Unseen":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["investigator", "ranger", "rogue"]
  "Set Explosives":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate"]
    description: "Requirements You have 1 or 2 bombs in hand%rEffect You attach the bombs to an inanimate object within your reach, such as a door, wall, or column, and rig them to detonate at a set time. The bombs explode at a specific time you determine (such as after your next action or at the start of your next turn, to a maximum of 1 minute), dealing their damage and splash damage to the inanimate object. Combine this damage for the purpose of resistances and weaknesses, and this damage ignores an amount of the object's Hardness equal to your level. Any creatures adjacent to the hazard take the bombs' splash damage, also combined for the purpose of resistances and weaknesses. As a reminder, since you didn't throw the bombs, the Bomber's Field Discovery and similar effects don't apply. Making sure your timing is correct requires concentration, so you can't Set Explosives again while you're waiting for a previously set bomb to detonate."
  "Set Free":
    from: "action"
    for: "aftermath"
    type: "reaction"
    category: "defensive"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Frequency once per hour%rTrigger You attempt a check to remove or counteract an effect with the Confused, Controlled, Fascinated, Immobilized, Paralyzed, or Restrained conditions%rEffect You roll twice and use the better result."
  "Settle Emotions":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "emotion", "mental"]
    description: "You spend 10 minutes using techniques you've developed to calm your emotions and bring them back under control. This allows you to access your Catharsis again."
  "Sever Conduit":
    from: "action"
    for: "class"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate"]
    description: "Trigger Your eidolon takes damage that would bring you to 0 Hit Points and comes from an effect other than a death effect%rEffect You quickly extinguish the link with your eidolon, causing your bonded ally to wink out of existence before you can be laid low. Your eidolon unmanifests, and you can't Manifest your Eidolon for 1 minute. In exchange, you don't take the triggering damage, though your eidolon still suffers any other adverse effects that accompanied the damage."
  "Sever Four Dragonfly Wings":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["transcendence"]
    description: "Make a Strike that deals slashing damage with your weapon ikon. If that Strike is successful, you can immediately make an additional Strike against a different target within your reach. You can continue making Strikes in this manner, each against a different target, until you have made a total of four Strikes or you miss with a Strike, whichever comes first. Each attack counts toward your multiple attack penalty, but you do not increase your penalty until you have made all your attacks."
  "Shadow Step":
    from: "action"
    for: "familiar"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["shadow", "teleportation"]
    description: "Requirements The familiar is in dim light or darkness.%rEffect The familiar teleports itself up to 30 feet. The destination must be in dim light or darkness and must be within your familiar's line of sight and line of effect.%rThis action has the trait matching your tradition of magic, or occult if you aren't a spellcaster."
  "Shadows in the Moonlight":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your commands help your team evade notice. Signal all squadmates within your banner's aura; until the end of your next turn, you and each ally count as Following the Expert for any checks to hide or sneak and can ignore the noisy trait on any armor you wear. If you spend 2 actions to use this tactic, up to two squadmates within your banner's aura can also either Hide or Sneak as a free action.%rSpecial If you have this tactic prepared, you can use Warfare Lore in place of Stealth for checks you attempt to Hide and Sneak."
  "Shake It Off":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: ["fortune", "primal"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You fail or critically fail a saving throw against a condition or adverse effect (such as Cursed Metamorphosis)%rEffect You reroll the triggering save and use the better result."
  "Shake it Off":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "concentrate", "rage"]
  "Share Death's Promises":
    from: "action"
    for: "archetype"
    type: "free"
    category: "offensive"
    traits: []
    description: "Trigger Your turn begins%rRequirements You are gaining a bonus to damage from Let Death Be My Weapon%rEffect Spend a Mythic Point. You gain a status bonus to damage equal to double the bonus you're receiving from Let Death Be My Weapon that lasts for 1 minute. During this time, this status bonus doesn't decrease or increase if the value of your doomed, dying, or wounded condition decreases or increases."
  "Share Life":
    from: "action"
    for: "equipment"
    type: "reaction"
    category: "interaction"
    traits: []
    description: "Trigger Your linked ally takes damage and is within 60 feet%rEffect The ally takes half damage from the triggering effect (rounded down), and you lose a number of Hit Points equal to the remainder of the damage. You can't trigger this reaction to share damage caused by your ally using this reaction."
  "Share Rage":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "barbarian", "rage", "visual"]
  "Share Senses":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "scrying", "summoner"]
    description: "Requirements Your eidolon is manifested.%rYou project your senses into your eidolon, allowing you to perceive through it. When you do, you lose all sensory information from your own body, but can sense through your eidolon's body for up to 1 minute. You can Dismiss this effect.%rSpecial This action has the trait matching your eidolon's tradition (arcane, divine, occult, or primal). Your eidolon can also use this ability. When it does, it projects its senses into your body."
  "Share Tincture":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["investigator"]
  "Shatter Defenses":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Shatter Glass":
    from: "action"
    for: "equipment"
    type: "reaction"
    category: "offensive"
    traits: []
    description: "Trigger An adjacent creature Strikes you with a melee weapon or unarmed attack and deals damage%rRequirements Your innate Mountain Resilience from Glass Skin is active%rEffect You shatter some of the glass on your skin to damage your attacker. The attacker takes 3d10 slashing damage and the duration of the stoneskin decreases by 1 minute. At 14th level, the damage increases to 4d10 slashing damage, and at 18th level, the damage increases to 5d10 slashing damage."
  "Shattering Strike (Monk)":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["monk"]
  "Shed Spirit":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rEffect Your familiar's spirit exits its body, leaving its empty shell behind, before flying at an enemy within 20 feet and dealing (6+max(0,(ceil((@actor.level -8)/2)*2)))d6 spirit damage, with a Will save against your spell DC. If the familiar dealt damage, it then flies to an ally within 30 feet of the enemy, restoring Hit Points equal to half the damage dealt. Your familiar then re-forms in its original square. At 9th level, and every 2 levels thereafter, the attack deals an additional 2d6 damage."
  "Shed Tail":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["lizardfolk"]
    self_effect: "Effect: Shed Tail"
  "Shed the Mortal Skin":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["healing", "light", "transcendence", "vitality"]
    description: "Like the serpent, that most ancient of immortals, you shed your skin, revealing a glowing divine form. If you are currently taking persistent fire or acid damage, you immediately end the effect. Until the beginning of your next turn, you shed bright light in a 20-foot radius (and dim light for the next 20 feet) like a torch. The next time you are dealt damage by an enemy before the beginning of your next turn, you shed glowing ichor in a square adjacent to you, and where it hits the earth, a glowing, thorned herb grows. A creature other than you can pluck and consume the herb with an Interact action to regain a number of Hit Points equal to half of the damage you were dealt by the attack that sprouted the herb."
  "Shield Block":
    from: "feat"
    type: "reaction"
    category: "general"
    traits: ["general"]
  "Shield of Reckoning":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["champion"]
    frequency: {"max": 1, "per": "round"}
  "Shielding Wave":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["primal", "water"]
    self_effect: "Effect: Shielding Wave"
    description: "You raise a magical barrier of twisting currents. Until the start of your next turn, the first time you take acid or fire damage, you gain resistance to that damage equal to half your level (minimum 1). The resistance is equal to your level instead if you're submerged in water, if you already Cast a Spell with the water trait, or if you used another ability with the water trait this turn."
  "Shields Up!":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "You signal your allies to ready their defenses. Signal all squadmates within the aura of your commander's banner; each can immediately Raise a Shield as a reaction. Squadmates who are wielding a parry weapon can instead position that weapon defensively as a reaction.%rSpecial If one of your squadmates knows or has prepared the Shield cantrip, they can cast it as a reaction instead of taking the actions normally granted by this tactic."
  "Shift Immanence":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["divine", "exemplar"]
    frequency: {"max": 1, "per": "round"}
    description: "Frequency once per round%rYou shift your power, filling one of your ikons with your divine spark. That ikon softly glows with radiant light, emits subtle chimes as it moves, or is otherwise obviously empowered in a way that matches your growing divinity, granting the ikon the divine trait and granting you that ikon's immanence effects for as long as your divine spark is empowering it. Your spark is indivisible, so it can empower only one ikon at a time. You can also Shift Immanence to return your spark to the depths of your soul, leaving none of your ikons empowered.%rSpecial In addition to the above usage, you can also Shift Immanence as a free action triggered when you roll initiative."
  "Shift Spell":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "manipulate"]
    description: "Requirements You are within the affected area of an ongoing spell, or you can physically touch an object or creature under the effects of a spell, and you are holding your conduit%rEffect Choose a spellshift and attempt an Arcana check against the DC of the spell (or the spell DC of the spellcaster if the spell does not normally have a DC). The caster immediately becomes aware that you're trying to shift their spell and intuitively knows the potential effects of the shift, but not the result of your skill check. A willing caster can allow you to achieve one degree of success higher than the result of your check. The effects of the check are dependent on the chosen spellshift. Regardless of the result, the spell becomes immune to Shift Spell for 24 hours."
  "Shooting Stars Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Shooting Stars Stance"
  "Shove":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack"]
    check: {"slug": "shove", "statistic": "athletics", "options": ["action:shove", "forced-movement"], "against": "fortitude", "weapon_traits": ["shove"], "notes": {"criticalSuccess": "You push your target up to 10 feet away from you. You can Stride after it, but you must move the same distance and in the same direction.", "success": "You push your target back 5 feet. You can Stride after it, but you must move the same distance and in the same direction.", "criticalFailure": "You lose your balance, fall, and land Prone."}, "consequences": {"criticalFailure": [{"on": "actor", "condition": "Prone"}]}}
    description: "Requirements You have at least one hand free. The target can't be more than one size larger than you.%rYou push a creature away from you. Attempt an Athletics check against your target's Fortitude DC.%rCritical Success You push your target up to 10 feet away from you. You can Stride after it, but you must move the same distance and in the same direction.%rSuccess You push your target back 5 feet. You can Stride after it, but you must move the same distance and in the same direction.%rCritical Failure You lose your balance, fall, and land Prone."
  "Shove Down":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["rogue"]
  "Sickening Assault":
    from: "action"
    for: "class"
    type: "free"
    category: "offensive"
    traits: ["concentrate", "eidolon"]
    frequency: {"max": 1, "per": "PT1M"}
    description: "Frequency once per minute%rRequirements Your eidolon is dispersed.%rYour eidolon focuses on inflicting the most damage possible on its foes. If your eidolon's next action is to use Swarming Assault, the number of damage dice of the Swarming Assault are doubled. Additionally, creatures that fail their Reflex save against that Swarming Assault are Sickened 2 (Sickened 4 on a critical failure)."
  "Sidestep":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["rogue"]
  "Sidestep Through Time":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate", "occult", "teleportation"]
    description: "Trigger You are about to attempt a Reflex saving throw against an area effect%rEffect You slip through time to avoid a dangerous outcome. Teleport up to 10 feet in any direction. If this would take you outside of the area's effect, you don't need to attempt the Reflex save against it. You are then Off-Guard for 1 round."
  "Siegebreaker":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["gunslinger"]
    description: "Requirements You're wielding a firearm that has the kickback or scatter trait, or a two-handed crossbow.%rWith unbelievable force, you charge and smash your weapon into a target before digging in your heels and pulling the trigger. Leap or Stride, then make a Strike with the required firearm or crossbow against an adjacent target. This Strike deals an additional 3d8 bludgeoning damage and ignores 10 points of the target's Hardness (if any), or of their shield's Hardness if the target uses Shield Block.%rAfter the Strike, you become Immobilized and position the required weapon defensively, as the parry trait, gaining a +1 circumstance bonus to AC, or a +2 circumstance bonus if the chosen weapon has the parry trait. Both effects last until the start of your next turn. If a force would move you while you're immobilized in this way, it must succeed at an appropriate check against your class DC."
  "Silencing Strike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "incapacitation", "rage"]
  "Siphon Power":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["witch"]
    frequency: {"max": 1, "per": "day"}
  "Size Up":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate"]
    self_effect: "Effect: Size Up"
    description: "You designate a single, non-mindless creature as your focus and assess its motivations. You must be able to see and hear the creature. You gain a +2 circumstance bonus to Perception checks when you Sense the Motive of your focus and a +2 circumstance bonus to your Perception DC should your focus attempt to Lie or Feint against you. You gain a +2 circumstance bonus to Deception, Diplomacy, and Intimidation checks against your focus. You can only have one creature designated as your focus at a time. If you use Size Up against a creature when you already have a creature designated, the prior creature loses the designation and the new focus gains the designation. Your designation otherwise lasts until your next daily preparations."
  "Skirmish Strike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["flourish", "ranger", "rogue"]
  "Skirt the Underworld":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate", "illusion", "incapacitation", "transcendence"]
    description: "You skirt into the world of the dead, becoming Invisible for 1 round, then Fly up to your Speed. Each enemy adjacent to you at any point during this movement must succeed at a Fortitude save against your class DC or become Blinded for 1 minute (or permanently on a critical failure).%rFor each creature blinded by this effect, the duration of the granted invisibility extends by 1 round. Undead and other creatures with strong ties to the world of the dead, such as psychopomps, are immune to this effect."
  "Slam Down":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["fighter", "flourish"]
  "Slayer's Identification":
    from: "action"
    for: "archetype"
    type: "free"
    category: "interaction"
    traits: []
    description: "Trigger You roll initiative and can observe a creature you know is undead%rYou attempt to Recall Knowledge to identify the undead creature with a +1 circumstance bonus. If you're a master in the skill you're using to Recall Knowledge, you gain a +2 circumstance bonus instead."
  "Sleek Reposition":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter", "press"]
  "Sleeper Hold":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["incapacitation", "monk"]
  "Slip and Sizzle":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your team executes a brutal technique designed to knock down an opponent and blast them with magical devastation. Signal up to two squadmates within the aura of your commander's banner; one of these squadmates must be adjacent to an opponent and the other must be capable of casting a spell that deals damage. The first squadmate can attempt to Trip the adjacent opponent as a reaction. If this Trip is successful, the second squadmate can cast a ranged spell that deals damage and takes 2 or fewer actions to cast. This spell is cast as a reaction and must either target the tripped opponent or include the tripped opponent in the spell's area.%rIf the second squadmate cast a spell using slots or Focus Points as part of this tactic, they are Slowed 1 until the end of their next turn and do not gain a reaction when they regain actions at the start of their next turn."
  "Smite":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["champion", "concentrate"]
  "Smoke Blending":
    from: "action"
    for: "heritage"
    type: "reaction"
    category: "defensive"
    traits: ["sylph"]
    description: "Trigger A creature attempts a flat check to target you because you're Concealed or Hidden due to fog, haze, mist, or smoke%rEffect You shroud yourself in smoke, making it harder for your foe to hit you. If you're concealed, the DC of the flat check increases from 5 to DC 7 Flat; if you're hidden, it increases from 11 to DC 13 Flat."
  "Snagging Strike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["fighter"]
  "Sneak":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["move", "secret"]
    check: {"slug": "sneak", "statistic": "stealth", "options": ["action:sneak"], "against": "perception", "notes": {"criticalSuccess": "You're undetected by the creature during your movement and remain undetected by the creature at the end of it.", "success": "You're undetected by the creature during your movement and remain undetected by the creature at the end of it.", "failure": "A telltale sound or other sign gives your position away, though you still remain unseen. You're hidden from the creature throughout your movement and remain so.", "criticalFailure": "You're spotted! You're observed by the creature throughout your movement and remain so. If you're invisible and were hidden from the creature, instead of being observed you're hidden throughout your movement and remain so."}}
    description: "You attempt to move to another place while becoming or staying undetected. Stride up to half your Speed. (You can use Sneak while Burrowing, Climbing, Flying, or Swimming instead of Striding if you have the corresponding movement type; you must move at half that Speed.)%rAt the end of your movement, the GM rolls your sneak check in secret and compares the result to the Perception DC of each creature you were Hidden from or Undetected by at the start of your movement. If you have cover or greater cover from the creature throughout your Stride, you gain the +2 circumstance bonus from cover (or +4 from greater cover) to your Stealth check. Because you're moving, the bonus increase from Taking Cover doesn't apply. You don't get to roll against a creature if, at the end of your movement, you neither are Concealed from it nor have cover or greater cover against it. You automatically become observed by such a creature.%rSuccess You're undetected by the creature during your movement and remain undetected by the creature at the end of it.%rYou become observed as soon as you do anything other than Hide, Sneak, or Step. If you attempt to Strike a creature, the creature remains Off-Guard…"
  "Snowdrift Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["cold", "druid", "manipulate", "spellshape"]
  "Soaring Flight":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["morph", "primal", "tengu"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency Once per day%rTo be a tengu is to be unburdened by the concerns of the world below. You grow a pair of magical wings or expand your existing ones. For 5 minutes, you gain a Fly Speed equal to your land Speed or 20 feet, whichever is greater."
  "Solitary Invocation":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["invocation", "magical", "runesmith"]
    description: "You utter the name of one of your runes within 30 feet, which blazes with power, applying the effect in its Invocation entry. An invoked rune then fades away, its task complete."
  "Sorshen's Devotion":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: ["arcane", "concentrate", "healing"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You or an ally within 60 feet uses Rewrite Fate to reroll a saving throw%rEffect Spend 1 Mythic Point. The triggering creature regains (7d10+28) healing Hit Points. The amount of healing increases to (10d10+40) healing Hit Points if Xanderghul, the Runelord of Pride, was the source of the triggering effect."
  "Sow Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "druid", "spellshape"]
  "Spasm of the Berserker":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["transcendence"]
    description: "Your body warps beyond recognition into a powerful, one-eyed form. You're affected by a 4th-rank Enlarge spell and a 6th-rank Moon Frenzy spell, which both last until the end of your next turn. You can't attempt to end the moon frenzy early.%rIf this ikon becomes empowered again, you can extend Spasm of the Berserker's duration until the end of your next turn. While you're already affected by Spasm of the Berserker, the transcend action becomes a free action to extend its duration until the end of your next turn."
  "Speed of Arms":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: ["mythic"]
    description: "Trigger Your turn begins%rEffect You make a Strike against one opponent within your reach, or Stride directly towards an opponent. If this is the first time you've struck that opponent during this encounter, the Strike is made at mythic proficiency."
  "Spell Protection Array":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["arcane", "manipulate", "wizard"]
  "Spell Relay":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["concentrate", "sorcerer"]
  "Spell Shroud":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "sorcerer", "spellshape"]
  "Spell Tinker":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["concentrate", "wizard"]
  "Spell-Woven Shot":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: []
    description: "Requirements You are wielding a loaded magic firearm or magic crossbow%rEffect You Cast a Spell that takes 1 or 2 actions to cast and requires a spell attack roll. The effects of the spell do not occur immediately but are imbued into the required weapon. Make a Strike with that weapon. Your spell flies with the ammunition, using your attack roll result to determine the effects of both the Strike and the spell. This counts as two attacks for your multiple attack penalty, but you don't apply the penalty until after you've completed the Spell-Woven Shot."
  "Spellshape Channel":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["cleric", "concentrate"]
  "Spellsling":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: []
    description: "Requirements You're wielding your bonded beast gun or another magic firearm%rEffect You Cast a Spell that takes 1 or 2 actions to cast and requires a spell attack roll. The effects of the spell do not occur immediately but are imbued into the beast gun you're wielding. Make a Strike with that beast gun. Your spell flies with the ammunition, using your attack roll result to determine the effects of both the Strike and the spell. Combine the Strike and spell's damage for the purpose of resistances and weaknesses. This counts as two attacks for the purposes of determining your multiple attack penalty, but you don't apply the penalty until after you've completed resolving the attack and spell.%rSpecial If you also have the Spell-Woven Shot action you can load and activate a piece of magical ammunition as a free action before making a Spellsling attack once per 10 minutes."
  "Spellstrike":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["magus"]
    description: "Frequency until recharged (see below)%rYou channel a spell into a punch or sword thrust to deliver a combined attack. You cast a spell that takes 1 or 2 actions to cast and requires either a spell attack roll or a saving throw. You imbue its effects into an attack instead of executing the spell normally. Make a melee Strike with a weapon or unarmed attack. This counts as two attacks for your multiple attack penalty, but you don't apply the penalty until after you've completed the Spellstrike. The infusion of spell energy grants your Strike the arcane trait, making it magical. If the spell required a spell attack roll, use your Strike's results to determine the effects of both the Strike and the spell. If the spell required a save, the target of the Strike rolls its saving throw normally regardless of your attack roll's result unless your Strike was a critical failure, in which case your spell is disrupted.%rAfter you use Spellstrike, you can't do so again until you recharge your Spellstrike as a single action, which has the concentrate trait. You also recharge your Spellstrike when you cast a conflux spell that takes at least 1 action to cast; casting a focus spell of another type…"
  "Spin Tale":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "linguistic"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once every 10 minutes%rEffect You tell a story, designating one of your allies (but not yourself) as the hero of the story, and one enemy as the villain; both must be within 60 feet. The hero gains a +1 status bonus to attack rolls and saving throws against the villain until the start of your next turn. If you Spin a Tale on your next turn, the story continues for another round, for a maximum of 10 rounds. While the tale continues, minor, crude illusions spring into being in your space; these are arcane illusion effects that have no mechanical impact other than illustrating your tale.%rEffect: Spin Tale"
  "Spinning Crush":
    from: "action"
    for: "class"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["gunslinger"]
    description: "Requirements You're wielding a loaded firearm or loaded crossbow.%rYou go into a vicious spin, smashing your weapon into those nearby and increasing your momentum by firing. All creatures adjacent to you take 4d6 bludgeoning damage plus your Strength modifier; this increases to 6d6 if your firearm has a striking rune, 8d6 if it has a greater striking rune, and 10d6 if it has a major striking rune. This ability does not apply other effects that increase damage with your firearm Strikes such as weapon specialization. Creatures affected by this attack must attempt a Reflex save. A creature that fails its save is also pushed 10 feet directly away from you."
  "Spirit Sanctification":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "spellshape"]
    description: "Cost 1 spirit wisp%rEffect You immediately purify a spirit, which grants you a protective blessing before it departs. If your next action is to cast a halcyon spell, you gain a +1 status bonus to saving throws as well as resistance to void damage equal to the rank of the halcyon spell. These effects last for 1 round."
  "Spirit's Mercy":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "defensive"
    traits: []
    self_effect: "Effect: Spirit's Mercy"
    description: "Trigger You take vitality or void damage, or you take any type of damage caused by a haunt, ghost, or other incorporeal undead%rCost 1 spirit wisp or remnant%rEffect You purify a spirit by having it perform a final act of mercy to lessen the damage caused by another spirit. This grants you resistance to vitality and void damage (or resistance to all damage if caused by a haunt or incorporeal undead) against the triggering effect. If you expend a spirit wisp, the resistance is equal to twice your level. If you expend a spirit remnant, the resistance is equal to three times the level of the incorporeal undead or haunt from which you gained the remnant."
  "Spirit's Wrath":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["attack", "barbarian", "concentrate", "rage"]
  "Spirits' Interference":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "divine", "rage"]
  "Spiritual Aid":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: []
    description: "Trigger You fail a Reflex or Will saving throw%rEffect You reroll the triggering saving throw. You must use the second result, even if it's worse. If you roll a success, you get a critical success instead."
  "Spiritual Guides":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["barbarian", "concentrate", "fortune"]
    frequency: {"max": 1, "per": "day"}
  "Spiritual Scar":
    from: "action"
    for: "background"
    type: "reaction"
    category: "defensive"
    traits: ["concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rTrigger You would take spirit damage from a fiend%rEffect You gain resistance to spirit damage equal to twice your level plus your Charisma modifier against the triggering damage. If this resistance prevents you from taking any damage at all, the spiritual backlash against the fiend who attempted to damage you forces them to attempt a Will save against your class DC to avoid being Slowed 1 for one round."
  "Spit Ambient Magic":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "magical"]
    frequency: {"max": 1, "per": "turn"}
    description: "Frequency once per round%rEffect Your ostilli flashes red as it regurgitates a dart of magic at a target within 30 feet. This magical dart deals ((1+floor((@actor.level -2)/4))d6) piercing damage (Reflex save against the higher of your class DC or spell DC). This damage increases by 1d6 at 6th level and every 4 levels thereafter."
  "Split Hex":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "spellshape", "witch"]
  "Split Shot":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "sorcerer", "spellshape"]
  "Spread Propaganda":
    from: "action"
    for: "archetype"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "secret"]
    description: "You spread propaganda about a faction (which may include an army, organization, or other particular group of people). This takes as long as it would normally take for you to Gather Information (typically 2 hours). At the end of this time, the GM rolls a secret Deception check to see how effective you were at spreading propaganda.%rCritical Success Your propaganda spreads effectively, and for the next month, creatures that succeed on checks to Gather Information learn your propaganda over facts about the subject. It cannot be traced back to you. You also learn information as if you succeeded at a Recall Knowledge check about the faction.%rSuccess As critical success, but the propaganda persists for 1 week and can be traced back to you by a character who critically succeeds at the skill check to Gather Information.%rFailure Your propaganda fails to take hold.%rCritical Failure Your propaganda is stunningly ineffective, and you take a –4 circumstance penalty to Deception checks to spread propaganda about the same subject for 1 week. In addition, the subject and its enemies become aware that you attempted to spread propaganda."
  "Spread Realm":
    from: "action"
    for: "archetype"
    type: "free"
    category: "interaction"
    traits: ["concentrate"]
    description: "Trigger Your previous action was to Sustain your manifested realm%rEffect Your manifested realm further corrupts more of your surroundings. Increase your manifested realm's radius by 10 feet."
  "Spring from the Shadows":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["flourish", "rogue"]
  "Spring the Trap":
    from: "action"
    for: "class"
    type: "free"
    category: "interaction"
    traits: ["gunslinger"]
    description: "Trigger You roll initiative.%rYou can Interact to draw a combination weapon and set it to melee or ranged mode. On your first turn, your movement and ranged attacks don't trigger reactions that are normally triggered by movement or a ranged attack (such as Attack of Opportunity)."
  "Squawk!":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["tengu"]
  "Squeeze":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "move"]
    check: {"slug": "squeeze", "statistic": "acrobatics", "options": ["action:squeeze"], "notes": {"criticalSuccess": "You squeeze through the tight space in 1 minute per 10 feet of squeezing.", "success": "You squeeze through in 1 minute per 5 feet.", "criticalFailure": "You become stuck in the tight space. While you're stuck, you can spend 1 minute attempting another Acrobatics check at the same DC. Any result on that check other than a critical failure causes you to become unstuck."}}
    description: "You contort yourself to squeeze through a space so small you can barely fit through. This action is for exceptionally small spaces; many tight spaces are difficult terrain that you can move through more quickly and without a check.%rCritical Success You squeeze through the tight space in 1 minute per 10 feet of squeezing.%rSuccess You squeeze through in 1 minute per 5 feet.%rCritical Failure You become stuck in the tight space. While you're stuck, you can spend 1 minute attempting another Acrobatics check at the same DC. Any result on that check other than a critical failure causes you to become unstuck.%rSample Squeeze Tasks Trained space barely fitting your shoulders Master space barely fitting your head"
  "Stand":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    check: {"slug": "stand", "statistic": null, "options": ["action:stand"]}
    description: "You stand up from Prone."
  "Stand Still":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["monk"]
  "Starlit Transformation":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["arcane"]
    frequency: {"max": 1, "per": "PT1H"}
    self_effect: "Effect: Starlit Transformation"
    description: "Frequency once per hour%rEffect Light swirls around you, transforming your armor, clothing, and a single weapon in your possession into a specific alternate outfit. While your equipment might look dramatically different, it functions as normal. If someone attempts to discern your identity, they must use a Seek action to attempt a Perception check against your Deception DC, as if you were using the Impersonate action. Your Deception DC against such attempts is 20 + your proficiency modifier instead of the normal DC. Unlike with Impersonate, you don't have to attempt a Deception check to interact with someone to conceal your identity—a check happens only if someone else specifically tries to uncover it. You remain in your sentinel form for 10 minutes or until you use Starlit Transformation again to change back to your normal form.%rWhile you're in sentinel form, your transformed weapon shines with starlight and gains a +1 status bonus to damage rolls with the weapon. You can fling bolts of starlight from your weapon with a Strike action, using your melee attack modifier with the weapon. These bolts deal 1d4 force damage, have a range of 60 feet, are affected by your weapon runes,…"
  "Stay Down!":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["rogue"]
  "Steal":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "steal", "statistic": "thievery", "options": ["action:steal"], "against": "perception", "modifiers": [{"label": "Object pocketed or protected", "value": -5, "type": "untyped", "predicate": ["action:steal:pocketed"]}], "notes": {"criticalSuccess": "You steal the item without the bearer noticing, or an observer doesn't see you take or attempt to take the item.", "success": "You steal the item without the bearer noticing, or an observer doesn't see you take or attempt to take the item.", "failure": "The item's bearer notices your attempt before you can take the object, or an observer sees you take or attempt to take the item. The GM determines the response of any creature that notices your theft.", "criticalFailure": "The item's bearer notices your attempt before you can take the object, or an observer sees you take or attempt to take the item. The GM determines the response of any creature that notices your theft."}}
    description: "You try to take a small object from another creature without being noticed. Typically, you can Steal only an object of negligible Bulk, you must have a free hand, and you automatically fail if the creature who has the object is in combat or on guard.%rAttempt a Thievery check to determine if you successfully Steal the object. The DC is usually the Perception DC of the creature wearing the object. It's easiest to steal an object that is worn but not closely guarded (like a loosely carried pouch filled with coins, or an object within such a pouch). The GM might increase the DC if the object is protected or if the nature of the object makes it harder to steal (such as a very small item in a large pack, or a sheet of parchment mixed in with other documents). For instance, the DC is typically 5 higher if the object is in a pocket, held in a creature's hand, or similarly protected.%rYou might also need to compare your Thievery check result against the Perception DCs of observers other than the person wearing the object. The GM might impose a circumstance penalty to the DCs of observers who are distracted.%rSuccess You steal the item without the bearer noticing, or an observer doesn't…"
  "Steel Your Resolve":
    from: "action"
    for: "stamina"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    description: "Cost 1 Resolve Point%rRegain Stamina Points equal to half your maximum."
  "Stellar Misfortune":
    from: "action"
    for: "background"
    type: "free"
    category: "interaction"
    traits: ["misfortune", "occult"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day;%rTrigger A creature you can see is about to attempt a saving throw, attack roll, or skill check;%rRequirements You must be under the night sky with the stars visible;%rEffect You call upon the power of a dooming star, exacerbating the target's bad luck. The target must roll the triggering check twice and take the worse result."
  "Step":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    description: "Requirements Your Speed is at least 10 feet.%rYou carefully move 5 feet. Unlike most types of movement, Stepping doesn't trigger reactions, such as Reactive Strike, that can be triggered by move actions or upon leaving or entering a square.%rYou can't Step into difficult terrain, and you can't Step using a Speed other than your land Speed."
  "Step Lively":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["halfling"]
  "Stitching Strike":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rEffect Your familiar unravels into magical fibers that encompass an enemy within 30 feet and deal (6+max(0,(ceil((@actor.level -8)/2)*2)))d6 slashing damage, with a Reflex save against your spell DC. On a failure, the target is also Immobilized for 1 round or until it Escapes against your spell DC. Your familiar then re-forms in its original square. At 9th level, and every 2 levels thereafter, the attack deals an additional 2d6 damage."
  "Stone Bones":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["dwarf"]
  "Stonestrike Stance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: []
    self_effect: "Stance: Stonestrike Stance"
    description: "Requirements You are standing on the ground%rEffect You enter the stance of unyielding stone and draw upon the power of the living rock, encasing your fists in stone and allowing you to make stonestrike attacks. These deal 1d8 bludgeoning damage, are in the brawling group, and have the forceful, magical, and unarmed traits."
  "Stonewall":
    from: "feat"
    type: "reaction"
    category: "ancestry"
    traits: ["dwarf", "earth", "polymorph"]
    frequency: {"max": 1, "per": "day"}
  "Stop":
    from: "action"
    for: "vehicles"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    description: "Requirements You are piloting a vehicle in motion.%rYou bring the vehicle to a stop."
  "Storm Retribution":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["druid"]
  "Stride":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    description: "You move up to your Speed."
  "Stridulating Song":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["auditory", "magical"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You circulate magic through your wings, causing them to vibrate at high speeds such that their scraping produces disruptive sounds. You focus the sound at one creature within 30 feet who must succeed at a Fortitude save against your class DC or spell DC (whichever is higher) or become Sickened 1, or Sickened 2 on a critical failure, as the vibrations disrupt its inner equilibrium. You can Sustain the effect for up to 1 minute; the creature can't recover from the sickened condition as long as you continue your song and it can hear you."
  "Strike":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack"]
    description: "You attack with a weapon you're wielding or with an unarmed attack, targeting one creature within your reach (for a melee attack) or within range (for a ranged attack). Roll an attack roll using the attack modifier for the weapon or unarmed attack you're using, and compare the result to the target creature's AC to determine the effect.%rCritical Success You make a damage roll according to the weapon or unarmed attack and deal double damage.%rSuccess You make a damage roll according to the weapon or unarmed attack and deal damage."
  "Strike Hard!":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    description: "You command an ally to attack. Signal a squadmate within the aura of your commander's banner. That ally immediately attempts a Strike as a reaction."
  "Strike, Breathe, Rend":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["spirit", "transcendence"]
    description: "Requirements Your last action this turn was a successful Strike with the Noble Branch%rEffect You channel a rending pulse of energy down your weapon in the moment of contact. The target of the Strike takes spirit damage equal to the noble branch's weapon damage dice. This includes any extra dice from striking runes, but not from special abilities, property runes, or the like."
  "Stumbling Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Stumbling Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Stumbling Stance"
  "Stunning Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Stupefying Raid":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your team dashes about in a series of maneuvers that leave the enemy befuddled. Signal up to two squadmates within the aura of your commander's banner; these squadmates can Stride up to their Speed as a reaction. Each enemy they are adjacent to at any point during this movement must attempt a Will save against your class DC or become Stupefied 1 for 1 round (Stupefied 2 on a critical failure); this is a mental effect."
  "Subsist":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    check: {"slug": "subsist", "statistic": ["society", "survival"], "options": ["action:subsist"], "modifiers": [{"label": "After Exploration", "value": -5, "type": "untyped", "predicate": ["action:subsist:after-exploration"]}], "notes": {"criticalSuccess": "You either provide a subsistence living for yourself and one additional creature, or you improve your own food and shelter, granting yourself a comfortable living.", "success": "You find enough food and shelter with basic protection from the elements to provide you a subsistence living.", "failure": "You're exposed to the elements and don't get enough food, becoming Fatigued until you attain sufficient food and shelter.", "criticalFailure": "You attract trouble, eat something you shouldn't, or otherwise worsen your situation. You take a –2 circumstance penalty to checks to Subsist for 1 week. You don't find any food at all; if you don't have any stored up, you're in danger of starving or dying of thirst if you continue failing. Effect: Adverse Subsist Situation"}}
    description: "You try to provide food and shelter for yourself, and possibly others as well, with a standard of living. This typically uses Society if you're in a settlement or Survival if you're in the wild. The GM determines the DC based on the nature of the place where you're trying to Subsist. You might need a minimum proficiency rank to Subsist in particularly strange environments. Unlike most downtime activities, you can Subsist after 8 hours or less of exploration, but if you do, you take a –5 penalty.%rSample Subsist Tasks Untrained a lush forest with calm weather or a large city with plentiful resources Trained typical hillside or village Expert typical mountains or insular hamlet Master typical desert or city under siege Legendary barren wasteland or city of undead%rCritical Success You either provide a subsistence living for yourself and one additional creature, or you improve your own food and shelter, granting yourself a comfortable living.%rSuccess You find enough food and shelter with basic protection from the elements to provide you a subsistence living.%rFailure You're exposed to the elements and don't get enough food, becoming Fatigued until you attain sufficient food and…"
  "Sudden Charge":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "fighter", "flourish"]
  "Sudden Leap":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "fighter"]
  "Summon Sloth":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["arcane", "concentrate"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect Spend 1 Mythic Point. You summon the spirit of one of the seven runelords of sloth (Xirie, Ilthyrius, Azeradni, Zalelet, Krenlith, Ivarinna, or Krune) into an unoccupied space within 30 feet. Allies can move through a space occupied by one of these spirits, but a spirit's space is greater difficult terrain for your enemies.%rFor the next minute, you can use a two-action activity with the concentrate trait to summon another runelord spirit in a different space within 30 feet, to a maximum of seven spirits. While you are within 120 feet of Xanderghul, the Runelord of Pride, you can summon an additional spirit as a single action (instead of as a two-action activity). At the end of the each of your turns, each spirit fires arcane energy at a different enemy of your choice within 120 feet of it (or does nothing if no enemy is within range), dealing (2d4+2) force damage. After 1 minute, all spirits disappear."
  "Sunder Spell":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["attack", "barbarian", "concentrate", "rage"]
  "Surgical Shock":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["attack", "investigator"]
  "Surging Focus":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["cleric"]
    frequency: {"max": 1, "per": "day"}
  "Surging Might":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["manipulate", "oracle", "spellshape"]
  "Surprising Anatomy":
    from: "action"
    for: "class"
    type: "reaction"
    traits: ["eidolon"]
    description: "Trigger An enemy adjacent to your eidolon deals damage to your eidolon%rEffect Your eidolon's form shifts horribly to retaliate against the attacker. Your eidolon makes a melee unarmed Strike against the triggering enemy."
  "Survive the Wilds":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["aura", "manipulate", "transcendence"]
    self_effect: "Effect: Survive the Wilds"
    description: "You wrap the pelt around yourself. You can choose to change the damage type the pelt is attuned to. The pelt shines gold, drawing the offending energies into itself.%rUntil the start of your next turn, this shine creates an aura in a 15-foot emanation. You and all allies in the emanation gain a +2 circumstance bonus to AC and saving throws against effects with that trait."
  "Suspect of Opportunity":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["investigator"]
  "Sustain":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate"]
    description: "Choose one of your effects that has a sustained duration or lists a special benefit when you Sustain it. Most such effects come from spells or magic item activations. If the effect has a sustained duration, its duration extends until the end of your next turn. (Sustaining more than once in the same turn doesn't extend the duration to subsequent turns.) If an ability can be sustained but doesn't list how long, it can be sustained up to 10 minutes.%rAn effect might list an additional benefit that occurs if you Sustain it, and this can even appear on effects that don't have a sustained duration. If the effect has both a special benefit and a sustained duration, your Sustain action extends the duration as well as having the special benefit.%rIf your Sustain action is disrupted, the ability ends."
  "Sustain an Effect":
    from: "action"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You Sustain one effect with a sustained duration while moving at half speed. Most such effects can be sustained for 10 minutes, though some specify they can be sustained for a different duration. Sustaining an effect that requires making complex decisions, such as Spiritual Armament, can make you Fatigued, as determined by the GM."
  "Swaggering Initiative":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["swashbuckler"]
  "Swarm Forth":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["concentrate"]
    description: "Requirements Your swarm is within your body%rEffect Your swarm boils forth from your body into a space adjacent to yours. (Its space can overlap yours.) It remains separate from you until the end of your next turn, but you can Sustain the effect up to 1 minute. The effect also ends if you end your turn more than 60 feet away from the swarm. When you use Swarm Forth and each time you Sustain the effect, you can have the swarm Stride."
  "Swarming Assault":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["eidolon"]
    description: "Requirements Your eidolon is dispersed.%rYour eidolon swarms over each creature occupying its space, biting, pecking, clawing, or making similar attacks with its component bodies. It deals (ceil(@actor.level / 2))d6|options:area-damage damage to each creature in the area, with a Reflex save against your spell DC. You choose each time your eidolon uses Swarming Assault whether it deals piercing or slashing damage. Your eidolon then can't use Swarming Assault again for the next 1d4 rounds.%rAt 3rd level and every 2 levels thereafter, the damage increases by 1d6."
  "Swift Banishment":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["cleric"]
  "Swift Choreography":
    from: "action"
    for: "archetype"
    type: "reaction"
    category: "offensive"
    traits: ["auditory", "linguistic"]
    description: "Trigger An ally within 30 feet would become Grabbed, Immobilized, Off-Guard, Prone, or Restrained%rEffect You call out a quick reminder to your ally about a special move you'd suggested to them at some point in the past, allowing the ally to avoid the triggering effect completely."
  "Swift Elusion":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["rogue"]
  "Swift River":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["monk"]
  "Swim":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    check: {"slug": "swim", "statistic": "athletics", "options": ["action:swim"], "modifiers": [{"label": "Swim Speed", "value": 4, "type": "circumstance", "predicate": ["speed:swim"]}], "notes": {"criticalSuccess": "You move through the water, increasing the maximum distance by 5 feet.", "success": "You move through the water.", "criticalFailure": "You make no progress. If you're holding your breath, you lose 1 round of air."}}
    description: "You attempt an Athletics check to move a maximum distance of 10 feet through water. The GM determines the DC based on the turbulence or danger of the water; in most instances of calm water, you get an automatic critical success. If your land Speed is 40 feet or higher, increase the maximum possible distance by 5 feet for every 20 feet of Speed above 20 feet.%rIf you end your turn in water and haven't succeeded at a Swim action that turn, you sink 10 feet or get moved by the current, as determined by the GM. This doesn't apply if your last action on your turn was to enter the water.%rCritical Success You move through the water, increasing the maximum distance by 5 feet.%rSuccess You move through the water.%rCritical Failure You make no progress. If you're holding your breath, you lose 1 round of air.%rSample Swim Tasks Untrained lake or other still water%rTrained flowing water, like a river%rExpert swiftly flowing river%rMaster stormy sea%rLegendary maelstrom, waterfall"
  "Swipe":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["barbarian", "fighter", "flourish"]
  "Swipe Souvenir":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["rogue"]
  "Swirl Crimson Shroud":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["manipulate"]
    self_effect: "Effect: Crimson Shroud (AC)"
    description: "You can Interact with your shroud, swirling it around you, to gain a +1 circumstance bonus to AC until the beginning of your next turn."
  "Switcheroo":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["swashbuckler"]
  "Sympathetic Strike":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["witch"]
    frequency: {"max": 1, "per": "round"}
  "Tactical Entry":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["rogue"]
  "Tactical Retreat":
    from: "action"
    for: "ancestry"
    type: "reaction"
    category: "defensive"
    traits: ["emotion", "fear", "mental"]
    frequency: {"max": 1, "per": "PT1H"}
    description: "Trigger You gain the frightened condition%rFrequency once per hour%rEffect Realizing that discretion is the better part of valor, you opt to put some distance between you and a threat. You gain the Fleeing condition until the beginning of your next turn, and you Stride."
  "Tactical Takedown":
    from: "action"
    for: "class"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "You direct a coordinated maneuver that sends an enemy tumbling down. Signal up to two squadmates within the aura of your commander's banner. Each of those allies can Stride up to half their Speed as a reaction. If they both end this movement adjacent to an enemy, that enemy must succeed at a Reflex save against your class DC or fall Prone."
  "Tail Toxin":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["kobold", "poison"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Tail Toxin"
    description: "Frequency once per day%rRequirements You are wielding a piercing or slashing weapon%rYou apply your tail's venom to a piercing or slashing weapon. If your next Strike with that weapon before the end of your next turn hits and deals damage, you deal persistent poison damage equal to your level to the target."
  "Take Control":
    from: "action"
    for: "vehicles"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "take-control", "statistic": "piloting", "options": ["action:take-control", "action:take-control"], "notes": {"criticalSuccess": "You become the vehicle's pilot, or regain control of the vehicle if it was uncontrolled.", "success": "You become the vehicle's pilot, or regain control of the vehicle if it was uncontrolled."}}
    description: "Requirements You are aboard the vehicle and adjacent to its controls.%rYou grab the reins, the wheel, or some other mechanism to control the vehicle. Attempt a piloting check; on a success, you become the vehicle's pilot, or regain control of the vehicle if it was uncontrolled. Some vehicles have complicated controls that cause this action to become a multi-action activity."
  "Take Cover":
    from: "action"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: []
    self_effect: "Effect: Cover"
    description: "Requirements You are benefiting from standard cover, are near a feature that allows you to take cover, or are Prone.%rYou press yourself against a wall or duck behind an obstacle to take better advantage of cover. If you would have standard cover, you instead gain greater cover, which provides a +4 circumstance bonus to AC; to Reflex saves against area effects; and to Stealth checks to hide, sneak, or otherwise avoid detection. Otherwise, you gain standard cover (a +2 circumstance bonus instead). If you're prone, you gain greater cover against ranged attacks. Take Cover lasts until you move from your current space, use an attack action, become Unconscious, or end it as a free action."
  "Take a Breather":
    from: "action"
    for: "stamina"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "stamina"]
    description: "Cost 1 Resolve Point%rYou rest for 10 minutes and recover your stamina. After you complete this activity, you regain all your Stamina Points."
  "Take the High Ground":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["commander", "tactic"]
    description: "Your ally leaps to secure the high ground with a little help from the squad. Signal a squadmate within the aura of your commander's banner; as a free action, that squadmate can Stride directly toward any other squadmate you are both observing. If the first squadmate ends this movement adjacent to another squadmate, the first squadmate can immediately Leap up to 25 feet horizontally or 15 feet vertically as a reaction, boosted by the other squadmate. This distance increases to 40 feet horizontally or 25 feet vertically if you have legendary proficiency in Warfare Lore."
  "Talon Stance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["stance"]
    self_effect: "Stance: Talon Stance"
    description: "Effect You sway in a loose stance that lets you sweep in wide arcs with the claws on your feet. The only Strikes you can make are spinning talon unarmed attacks. These deal 1d8 slashing damage, are in the brawling group, and have the finesse, sweep, and unarmed traits. You don't need a free hand to use spinning talon strikes."
  "Tangle in Riddle":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["auditory", "mental", "transcendence"]
    description: "You speak a bizarre koan that transcends language and is understood by only one creature within 30 feet. The target must attempt a Will save against your class DC. It's then immune to this ability for 1 hour.%rCritical Success The target is unaffected.%rSuccess The target is Stupefied 1 for 1 round.%rFailure The target is stupefied 1 for 1d4 rounds.%rCritical Failure The target is stupefied 1 and Confused for 1d4 rounds."
  "Tangle of Battle":
    from: "feat"
    type: "reaction"
    category: "class"
    traits: ["barbarian", "rage"]
  "Tangled Forest Rake":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk"]
  "Tangled Forest Stance":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["monk", "stance"]
    self_effect: "Stance: Tangled Forest Stance"
  "Tap Ley Line":
    from: "action"
    for: "subsystems"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate"]
    description: "You attempt to manipulate the magical essence of a ley line that you're aware of within 30 feet. The GM determines the DC based on the hard DC for the ley line's level.%rCritical Success You gain the ley line's benefits until the end of your next turn.%rSuccess You gain the ley line's benefits until the end of your turn.%rFailure You take mental damage equal to 1d6 × the ley line's level. You can't Tap the Ley Line again for 1 hour.%rCritical Failure As failure, and you're subject to the ley line's backlash effect. You can't Tap the Ley Line again for 24 hours."
  "Tap into Blood":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["concentrate", "sorcerer"]
  "Tap the Past":
    from: "action"
    for: "ancestry"
    type: "free"
    category: "interaction"
    traits: ["fortune"]
    frequency: {"max": 1, "per": "day"}
    self_effect: "Effect: Tap the Past"
    description: "Frequency once per day%rTrigger You're about to attempt a check to Recall Knowledge%rEffect You concentrate on the glimpses of a previous life to find a memory of a tome or an applicable lesson from your past. You roll a second time and use the higher result. If you roll a critical failure, you get a failure instead. If you roll a success, you get a critical success instead."
  "Targeting Finisher":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["finisher", "swashbuckler"]
  "Taunt":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["concentrate", "guardian"]
    description: "With an attention-grabbing gesture, noise, cutting remark, or threatening shout, you attempt to draw an enemy to you instead of your allies. Taunt gains the auditory trait, visual trait, or both, depending on how you draw the target's attention. Even mindless creatures are drawn to your taunts. Choose an enemy within 30 feet to be your taunted enemy. If your taunted enemy takes a hostile action that includes at least one of your allies but doesn't include you, they take a –1 circumstance penalty to their attack rolls and DCs for that action, and they also become Off-Guard until the start of their next turn.%rYour enemy remains taunted until the start of your next turn, and you can have only one Taunt in effect at a time. Taunting a new enemy ends this effect on any current target.%rEffect: Taunt"
  "Tell Me More":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 2
    category: "interaction"
    traits: []
    description: "Target one creature that shares a language you speak%rRequirements You're not in combat%rEffect Just batting your eyes and giving someone a familiar nudge can get them talking, ready to spill the beans about everything and everyone around them. You roll twice on all rolls to influence the target and use the better result."
  "Ten Paces":
    from: "action"
    for: "class"
    type: "free"
    category: "offensive"
    traits: ["gunslinger"]
    description: "Trigger You roll initiative.%rYou react to trouble with lightning speed, positioning yourself just right. You gain a +2 circumstance bonus to your initiative roll, and you can Interact to draw a one-handed firearm or one-handed crossbow. As your first action on your first turn, you can Step up to 10 feet as a free action."
  "Tenacious Stance":
    from: "action"
    for: "archetype"
    type: "action"
    cost: 1
    category: "defensive"
    traits: ["stance"]
    self_effect: "Stance: Tenacious Stance"
    description: "Requirements You are wearing armor%rEffect You steady yourself, as tough and immutable as stone. You gain a number of temporary Hit Points equal to half your level (minimum 1) and a +2 circumstance bonus to DCs against being Shoved and Tripped. However, you no longer negate your armor check penalty or Speed penalty for having a high Strength while in this stance. After you leave Tenacious Stance, you lose any remaining temporary Hit Points from the stance, and you become temporarily immune to gaining temporary Hit Points from Tenacious Stance for 1 minute."
  "Tendril Strike":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["eidolon"]
    description: "Stretching to extend their body to its limits, your eidolon attacks a foe that would normally be beyond their reach. Your eidolon makes a melee unarmed Strike, increasing their reach by 5 feet for that Strike. If the unarmed attack has the disarm, shove, or trip trait, the eidolon can use the corresponding action instead of a Strike."
  "Terrifying Howl":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["auditory", "barbarian", "rage"]
  "That's My Number":
    from: "action"
    for: "spells"
    type: "reaction"
    category: "interaction"
    traits: ["fortune"]
    description: "Trigger You roll your lucky number as your d20 result on a non-secret attack roll, saving throw, or skill check%rEffect You call upon the fortune stored within your lucky number and reroll the triggering check. However, pushing your luck has a price: if your result on the reroll is the same number again, you critically fail, regardless of what degree of success you ordinarily would have received."
  "The Bigger They Are":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["brandish", "commander", "tactic"]
    description: "Regardless of your individual strengths, collectively your squad has the power to move mountains and topple giants. Signal a squadmate within the aura of your commander's banner. That squadmate can attempt to Reposition, Shove, or Trip a target within their reach. Each other squadmate who is adjacent to the original squadmate or the target can attempt to assist with the maneuver as a reaction%rFor each squadmate who assists in this way, the original squadmate increases the maximum size of creature they can target (for example, if a total of two squadmates participated in this maneuver, the initial squadmate could target a creature up to two sizes larger than them.) The original squadmate gains a circumstance bonus on their check to Reposition, Shove, or Trip equal to the number of additional squadmates who assisted in the maneuver (maximum +4).%rEffect: The Bigger They Are (Commander)"
  "The Dead Walk":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["cursebound", "divine", "oracle"]
  "Thermal Eruption":
    from: "action"
    for: "aftermath"
    type: "action"
    cost: 2
    category: "offensive"
    traits: ["fire", "primal"]
    frequency: {"max": 1, "per": "day"}
    description: "Frequency once per day%rEffect You concentrate your thermal energy and explode it outward. All creatures in a 20-foot emanation take 14d6 fire|options:area-damage damage with a basic Reflex save. Afterward, you lose all effects of the Dormant Eruption feat until your next daily preparations."
  "Thoughtful Reload":
    from: "action"
    for: "class"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["gunslinger"]
    description: "As you sink deep into a state of analytical calm and focus on the foe before you, your hands reload a bullet instinctively. Attempt a Recall Knowledge check against an opponent you can see and then Interact to reload."
  "Thousand Visions":
    from: "feat"
    type: "free"
    category: "class"
    traits: ["cursebound", "oracle", "prediction"]
  "Thrash":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["barbarian", "rage"]
  "Threatening Approach":
    from: "action"
    for: "ancestry"
    type: "action"
    cost: 2
    category: "offensive"
    traits: []
    description: "You Stride to be adjacent to a foe and demoralize that foe. If you succeed, the foe is Frightened 2 instead of frightened 1."
  "Thunderclap Spell":
    from: "feat"
    type: "action"
    cost: 1
    category: "class"
    traits: ["druid", "sonic", "spellshape"]
  "Thundering Roar":
    from: "action"
    for: "spells"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["auditory", "concentrate", "emotion", "fear", "flourish", "mental", "sonic"]
    description: "The target unleashes a powerful vocalization. Each enemy in a 10-foot emanation takes 4d8 sonic|options:area-damage damage with a Will save against your spell DC. A creature that fails its Will save is also Frightened 1."
  "Tiger Slash":
    from: "feat"
    type: "action"
    cost: 2
    category: "class"
    traits: ["monk"]
  "Tiger Stance":
    from: "feat"
    type: "action"
    cost: 1
