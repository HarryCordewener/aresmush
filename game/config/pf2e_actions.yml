    type: "reaction"
    category: "offensive"
    traits: ["bravado", "swashbuckler"]
    description: "Trigger A foe within your reach critically fails a Strike against you%rYou take advantage of an opening from your enemy's fumbled attack. You either make a melee Strike against the triggering foe or attempt to Disarm it of the weapon it used for the Strike."
  "Opportunistic Accusation":
    from: "action"
    for: "background"
    type: "reaction"
    category: "offensive"
    traits: ["auditory", "linguistic", "mental"]
    description: "Trigger A demon you're aware of within 30 feet of you suffers from its sin vulnerability or critical fails at a saving throw against a mental effect%rYou make a quick cutting remark against the demon that takes advantage of the fiend's momentary disadvantage. The demon must attempt a Will save against your class DC.%rCritical Success The demon is unaffected and likely to focus its attention on you in combat from this point forward.%rSuccess The demon takes 2d6 mental damage.%rFailure The demon takes 4d6 mental damage and is Off-Guard until the start of its next turn.%rCritical Failure As failure, but the off-guard condition lasts until the end of the next round. The demon also takes 2d6 persistent mental damage."
  "Oracular Warning":
    from: "feat"
