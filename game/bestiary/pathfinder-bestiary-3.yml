  strikes: [{"name": "Fist", "bonus": 27, "damage": [["3d10+14", "bludgeoning", null]], "traits": ["agile", "magical", "unarmed", "versatile-p"]}, {"name": "Psychic Shard", "bonus": 27, "damage": [["3d8+14", "piercing", null]], "traits": ["magical"], "range": 60}]
  actions: [{"name": "Telepathy 120 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Thoughtsense (Imprecise) 120 feet", "type": "passive", "traits": ["mental", "occult"]}, {"name": "Self-Absorbed", "type": "passive", "traits": [], "text": "The adachros denies any version of reality but their own. If they begin their turn under an enchantment or illusion effect, they immediately attempt to counteract one such effect with a counteract modifier of +23, even if the effect prevents the adachros from acting."}, {"name": "Splinter Sycophant", "type": "reaction", "traits": [], "text": "Trigger The adachros takes 25 or more bludgeoning, piercing, or slashing damage%rEffect The attack breaks off part of the adachros's body. This fragment reshapes and animates into an Ioton with the minion trait under the adachros's control. The ioton sycophant can't move more than 120 feet from the adachros and crumbles after 1 minute.%rIf the adachros gives it no other commands, the ioton sycophant spends its turn praising the adachros and affirming the adachros's infallibility; this grants…"}, {"name": "Fatal Fantasia", "type": "passive", "traits": ["illusion", "mental"], "text": "An adachros's melee and ranged Strikes gain the fatal d12 trait against any creature affected by the adachros's enchantment or illusion spells, including creatures in the area of a Mirage that haven't disbelieved the effect."}]
