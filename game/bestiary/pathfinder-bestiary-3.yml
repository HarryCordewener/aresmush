  actions: [{"name": "Bardic Lore", "type": "passive", "traits": [], "text": "Sphinxes are naturally curious, and their love of puzzles and mysteries leads them to gather information on a broad range of topics. Sphinxes have the Bardic Lore bard feat, allowing them to Recall Knowledge on any topic."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Guardian Monolith", "type": "action", "traits": [], "cost": 2, "text": "The elder sphinx transforms their body into stone or back to flesh.%rIn stone form, the sphinx is Paralyzed but has Hardness 14 and gains immunity to bleed, clumsy, disease, drained, enfeebled, fatigued, petrified, poison, sickened, void damage, and wounded. They don't age or require food, water, or sleep. They can perceive their surroundings and cast their innate spells.%rStone to Flesh turns the elder sphinx from stone form back to flesh, and Petrify turns it from flesh form to stone form."}, {"name": "Idols of Stone", "type": "passive", "traits": [], "text": "When the sphinx casts Shape Stone, they can shape the stone into a magical duplicate of themself.%rWhen they cast Clairaudience, Clairvoyance, Locate, or Ventriloquism, they can make the effect come from any duplicate, instead of themself.%rThe elder sphinx can concentrate for 1 minute to transfer their consciousness to any duplicate; the sphinx is then in their stone form from Guardian Monolith in that statue.The sphinx can have no more than four duplicate statues at a time. Casting shape…"}, {"name": "Pose a Riddle", "type": "action", "traits": ["incapacitation", "linguistic", "mental", "occult"], "cost": 2, "text": "Frequency once per 10 minutes%rThe sphinx recites a riddle and compels up to 10 creatures within 30 feet to answer (DC 37 Will save). The GM either runs the riddle out of character by timing the players' attempts, or picks an appropriate associated skill for the riddle, such as Religion for a riddle involving divine mysteries.%rThe sphinx gains a +2 circumstance bonus to attack rolls and damage rolls against any creature that answers incorrectly even once. This bonus lasts for 1 day.%rCritical…"}, {"name": "Pounce", "type": "action", "traits": [], "cost": 1, "text": "The elder sphinx Strides and makes a Strike at the end of that movement. If they began this action Hidden, they remain hidden until after the attack."}, {"name": "Warding Glyph", "type": "passive", "traits": [], "text": "Once per day, an elder sphinx can create a magical symbol as though casting a heightened Rune Trap. The sphinx usually shapes it to the form of a riddle and sets the password to the answer.%rA creature that doesn't speak the password must succeed at a DC 37 Will save or be affected by one of the following spells, chosen by the sphinx when creating the symbol:%rVisions of Danger (7th) Spirit Blast (6th) Synaptic Pulse (5th) Charm (4th) Fear (3rd) Phantom Pain (3rd) Sleep (3rd) The sphinx learns…"}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 37, "attack": 29, "spells": {"0": ["Detect Magic", "Read Aura"], "6": ["Tongues (Constant)", "True Seeing (Constant)"], "8": ["Clairaudience (At Will)", "Clairvoyance (At Will)", "Dispel Magic", "Hallucinatory Terrain", "Locate", "Read Omens (At Will)", "Remove Curse (At Will)", "Shape Stone (See Idols of Stone)", "True Seeing", "Ventriloquism (At Will)"]}}]
