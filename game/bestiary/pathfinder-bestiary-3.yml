  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Nature's Rebirth", "type": "passive", "traits": ["primal"], "text": "When slain, a kovintus immediately and permanently transforms into a part of the natural environment: a stone outcropping in a rocky area, a rivulet near a body of water, a young tree in a forest, or a low-lying cloud atop a high mountain. This ability has the trait appropriate to the environment (such as air, earth, plant, or water). This piece of the environment looks ordinary to most, but other kovintus can easily identify this as their kin. A kovintus slain far from any appropriate terrain…"}, {"name": "Nature's Chosen", "type": "passive", "traits": [], "text": "Once per day, the kovintus can cast a 3rd-rank primal innate spell. They can do so only if a spell with a corresponding trait was cast within 10 feet of the kovintus since the start of their last turn (including if the kovintus Cast the Spell).%rThe traits and the spells they grant are as follows:%rWall of Wind for air One with Stone for earth Wall of Thorns for plant Crashing Wave for water"}]
