  actions: [{"name": "Blizzard Sight", "type": "passive", "traits": [], "text": "Krampus ignores circumstance penalties to visual Perception checks due to ice or snow, as well as Concealment due to ice or snow."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "120 feet. DC 42 Will"}, {"name": "Limited Immortality", "type": "passive", "traits": [], "text": "Though Krampus still needs to eat, drink, and sleep, he doesn't age and can't die of old age. If Krampus is killed, a new Krampus forms elsewhere in the world after a year's time.%rThe new Krampus retains the memories of the previous iteration and likely holds a grudge against whoever killed him the year before. If a method to disrupt this cycle exists, it has yet to be discovered by mortals."}, {"name": "Capture", "type": "action", "traits": ["attack"], "cost": 1, "text": "Requirements Krampus has a Medium or smaller creature Grabbed%rEffect Krampus attempts to stuff the grabbed creature into his basket, attempting an Athletics check against the target's Reflex DC. If he succeeds, the creature is shoved into Krampus's basket and Krampus's spiked chain or claw is freed for future Strikes.%rThe captured creature is Grabbed, Slowed 1, and subjected to Krampus's regression ability at the start of each round it is captured.%rIf the victim Escapes, it climbs out of the…"}, {"name": "Punish the Naughty", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Krampus designates a single target he can see as \"naughty.\" He gains a +2 circumstance bonus to Perception checks when he Seeks the naughty target and a +2 circumstance bonus to Survival checks to Track the naughty target.%rOn melee attacks against the naughty target, Krampus's spiked chain gains the agile trait. In addition, when Krampus Grabs the naughty target, he can attempt to Capture them as a free action. Krampus can have only one naughty target at a time."}, {"name": "Regression", "type": "passive", "traits": ["curse", "polymorph", "primal"], "text": "A creature that starts their turn Captured in Krampus's basket must attempt a DC 44 Fortitude save or be regressed back to their childhood.%rThe target shrinks one size. In addition, all of the target's proficiencies of expert and better are reduced to trained, which might restrict the use of certain feats.%rThe effect persists for 24 hours, after which the target regains their normal size and their proficiencies return to normal. A creature currently under the effects of regression can't be…"}, {"name": "Snowstep", "type": "passive", "traits": [], "text": "Krampus ignores difficult terrain and greater difficult terrain caused by snow and ice, and he leaves no tracks when moving through areas of snow or ice."}, {"name": "Improved Grab", "type": "free", "traits": []}]
