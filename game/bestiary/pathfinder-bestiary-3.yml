  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Site Bound", "type": "passive", "traits": [], "text": "The nemhaith is bound to a place or large stationary object and can't venture more than 500 feet from this focus.%rA typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Bound Spirits", "type": "passive", "traits": ["aura", "divine", "void"], "text": "10 feet. 4d6 void|options:area-damage damage DC 36 Fortitude save"}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "Destroying the ritual object or place used in the nemhaith's creation destroys the nemhaith, freeing its bound spirits to move on to the afterlife.%rWhen a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence and sets right whatever prevents the spirit from resting."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Life", "type": "passive", "traits": ["divine"], "text": "When the nemhaith damages a living creature with its spirit tendril Strike, the creature must succeed at a DC 36 Fortitude save or become Drained 2.%rFurther damage dealt by the nemhaith increases the condition value by 1 on a failed save, to a maximum of drained 4."}, {"name": "Rage of Spirits", "type": "action", "traits": [], "cost": 2, "text": "The nemhaith's bound spirits rage and smash everything in a 30-foot. Creatures in this area take 4d6 sonic damage and 4d6 void damage (DC 36 Fortitude save)."}, {"name": "Throw Spirits", "type": "action", "traits": [], "cost": 1, "text": "The nemhaith directs its bound spirits as a group to move up to 1 mile away (they have a fly Speed of 60 feet). The nemhaith can see and hear through the thrown spirits, but it loses its aura and can't use its spirit dart ranged Strike or Rage of Spirits.%rThe nemhaith regains these abilities when the spirits return to the nemhaith's space."}]
