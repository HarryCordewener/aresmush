  actions: [{"name": "Carrion Scent (Imprecise) 30 feet", "type": "passive", "traits": [], "text": "An angheuvore can smell creatures that have the Doomed, Dying, or Wounded condition as an imprecise sense."}, {"name": "Consecration Vulnerability", "type": "passive", "traits": [], "text": "An angheuvore in a place of worship dedicated to a non-evil deity or on sacred ground, such as an area blessed by Anointed Ground, is Slowed 1."}, {"name": "Death Gasp", "type": "action", "traits": ["divine"], "cost": 1, "text": "The angheuvore draws in a deep breath and holds it, temporarily suspending their biological processes and becoming undead.%rThe angheuvore gains the undead trait and becomes immune to bleed, death effects, disease, Paralyzed, poison, and sleep. Any such effects the angheuvore is currently suffering from are suspended, but take effect again once they take a breath.%rDeath Gasp lasts as long as the angheuvore holds their breath (up to 8 rounds).%rEffect: Death Gasp"}, {"name": "Invigorating Feast", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The angheuvore is adjacent to a Paralyzed, Restrained, or Unconscious creature, or a deceased creature that died in the last hour%rEffect The angheuvore feasts upon the creature, dealing their jaws Strike damage (DC 15 Fortitude save); a corpse automatically critically fails with no save. If the target takes damage, the angheuvore gains 5 temporary Hit Points and a +10-foot circumstance bonus to their Speeds for 1 minute."}, {"name": "Paralysis", "type": "passive", "traits": ["divine", "incapacitation"], "text": "Any living creature hit by an angheuvore's jaws Strike must succeed at a DC 15 Fortitude save or become Paralyzed.%rIt can attempt a new save to end the condition at the end of each of its turns, and the DC cumulatively decreases by 1 on each save."}, {"name": "Void Healing", "type": "passive", "traits": []}]
