  actions: [{"name": "Lifesense 60 feet", "type": "passive", "traits": []}, {"name": "Sense Apostate 500 feet", "type": "passive", "traits": ["detection", "divine"], "text": "An abandoned zealot can sense the presence and direction of false priests within 500 feet of them. Lead or running water blocks this sense."}, {"name": "+1 Status to all Saves vs. Divine and Vitality", "type": "passive", "traits": []}, {"name": "Anathematic Aversion", "type": "passive", "traits": ["emotion", "fear", "mental"], "text": "If they encounter a priest of their former faith, an abandoned zealot must attempt a Will save against the highest spell DC among those priests, or the highest Will DC if none of them can cast spells. The zealot attempts this saving throw only once per minute, even if more priests arrive later.%rCritical Success The abandoned zealot spends their reaction to Stride directly toward a priest of their former faith. For 1 minute, the abandoned zealot's hand of despair deals one additional damage die…"}, {"name": "Elegy of the Faithless", "type": "reaction", "traits": ["divine", "mental"], "text": "Trigger A divine spell is cast within 30 feet of the abandoned zealot.%rEffect The abandoned zealot howls an elegy of regret, forcing the spellcaster to attempt a DC 22 Will save, or a higher DC 24 Will if the caster is a member of the zealot's former faith. On a failure, the elegy disrupts the spell."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Rend Faith", "type": "passive", "traits": [], "text": "When hit by an abandoned zealot's hand of despair, a creature capable of divine spellcasting or with divinely granted abilities must succeed at a DC 24 Will save or be unable to use those spells or abilities until the end of its next turn."}]
