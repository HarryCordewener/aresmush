  actions: [{"name": "Tremorsense (Imprecise) 60 feet", "type": "passive", "traits": []}, {"name": "Earthmound Dweller", "type": "action", "traits": ["primal"], "cost": 3, "text": "The duende shrinks to the size of an ant, allowing them to enter very small tunnels within the earth such as anthills or termite mounds. Their Speed decreases to 5 feet. They can remain in this size until they end the effect by spending a single action, which has the concentrate trait.%rIf the duende is underground and a creature hits the space they're occupying with a Strike (hitting automatically) that deals 5 damage or more, the duende is expelled from the tunnels, returns to their normal…"}, {"name": "Fool's Gold", "type": "action", "traits": ["illusion", "occult"], "cost": 2, "text": "Frequency once per day%rRequirements The duende is holding brown or yellow earthen objects, such as ginger or animal dung%rEffect The duende makes the objects look, feel, and smell like gold trinkets of a similar size. A creature that touches or Interacts with an affected object can attempt a DC 18 Perception check to disbelieve the illusion, and a successful DC 20 check with DC 18 Crafting or an appropriate Lore skill (such as Mining Lore) reveals their true nature. The effect ends if the…"}]
