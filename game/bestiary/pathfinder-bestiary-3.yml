  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 50 (Deactivated by Fire)", "type": "passive", "traits": []}, {"name": "Attack of Opportunity (Special)", "type": "free", "traits": [], "text": "Incalculable Fangs Only%rBecause the ouroboros contains an infinite number of snakes that act independently, its Attack of Opportunity is a free action (though it can still use only one per trigger)."}, {"name": "Sanguine Spray", "type": "passive", "traits": [], "text": "When the ouroboros takes slashing or piercing damage, or when Devour Tail ends, blood gushes from the wound in a 15-foot. Each creature in the area takes 5d6 acid|options:area-damage damage (DC 41 Reflex save). A creature that takes any damage is exposed to the ouroboros's regenerative blood.%rWhere the blood falls upon ground, it coagulates into magical snakes that bite at anyone who passes. This is hazardous terrain deals 17 piercing damage and 5 poison damage to any non-ouroboros creature…"}, {"name": "Unfathomable Infinity", "type": "passive", "traits": ["aura", "incapacitation", "mental", "visual"], "text": "100 feet. The ouroboros is the embodiment of perfect infinity, and this concept pulls at the threads of mortal minds, desperately straining the limits of their comprehension. When a creature ends its turn in the aura, it must attempt a DC 41 Will save.%rThe creature is then temporarily immune for 1 minute.%rCritical Success The creature is Stupefied 1 for 1 round.%rSuccess The creature is stupefied 1 for 1 minute.%rFailure The creature is stupefied 1 for 1 minute and Stunned 3.%rCritical…"}, {"name": "Devour Tail", "type": "action", "traits": [], "cost": 1, "text": "An ouroboros spend most of its life eating its own tail, which perpetually regrows at the same rate it's consumed. The ouroboros places its maw around the end of its tail and begins devouring its own body.%rWhile the ouroboros is consuming itself, its regeneration can't be suppressed, and it is immune to Drained, Enfeebled, Fatigued, Persistent Damage, and Sickened conditions. If any of these conditions is in effect when the ouroboros takes this action, the condition immediately ends.%rWhile…"}, {"name": "Fast Swallow", "type": "reaction", "traits": [], "text": "Trigger The ouroboros Grabs a creature with their maw%rEffect The ouroboros uses Swallow Whole."}, {"name": "Flying Wheel", "type": "action", "traits": [], "cost": 2, "text": "Requirements The ouroboros is eating its own tail (see Devour Tail)%rEffect As Trample, except the ouroboros can Fly up to double its Speed instead of Striding.%rHuge or smaller, body, DC 45 Reflex"}, {"name": "Regenerative Blood", "type": "passive", "traits": ["contact", "curse", "incapacitation", "poison", "polymorph", "primal"], "text": "The regenerative and transmutative properties of ouroboros blood regenerate and mutate a creature's body into ouroboros-like snakes. A creature already affected by regenerative blood is immune to additional exposure.%rSaving Throw DC 42 Fortitude%rMaximum Duration 24 hours%rStage 1 regeneration 5 (deactivated by fire), Slowed 1, and Clumsy 2 (12 hours)%rStage 2 regeneration 5 (deactivated by fire), Slowed 2 and Clumsy 4 (12 hours)%rStage 3 The creature's body transmutes into a mass of writhing…"}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Huge, (4d10+9) acid, Rupture 50"}, {"name": "Improved Grab", "type": "free", "traits": []}]
