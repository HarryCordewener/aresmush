  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Surreal Anatomy", "type": "passive", "traits": [], "text": "A dramofir has resistance 10 to precision damage and the extra damage from critical hits. If the resistance is greater than the extra damage, it reduces the extra damage to 0 but doesn't reduce the attack's normal damage."}, {"name": "Bittersweet Dreams", "type": "action", "traits": ["emotion", "mental", "occult", "visual"], "cost": 2, "text": "The dramofir swishes their robes in a mesmerizing display that brings the dreams in the robes to life before the viewer's very eyes. Each creature within 30 feet must attempt a DC 34 Will save or be filled with ennui.%rCritical Success The creature is unaffected and temporarily immune for 24 hours.%rSuccess For 1 round, the creature takes a -1 status penalty to attack rolls, saving throws, and skill checks, and all other emotion effects on it are suppressed.%rFailure As success, but the…"}, {"name": "Pluck Dream", "type": "action", "traits": ["mental", "occult"], "cost": 3, "text": "Requirements The dramofir is adjacent to an Unconscious or sleeping creature%rEffect The dramofir licks the creature's forehead, places their hand in the same spot, and siphons the creature's dreams to incorporate into their robes.%rIf the target is affected by any mental effect altering their dreams, such as an Animate Dream's curse of endless nightmares or a Nightmare spell, the dramofir attempts to counteract that effect (counteract modifier +26). Otherwise, the dramofir plucks a benign…"}]
