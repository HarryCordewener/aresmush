  actions: [{"name": "Canine Vulnerability", "type": "passive", "traits": [], "text": "Dogs and other canines are natural enemies of kushtaka. Canine animals, including creatures transformed into a canine using Animal Form or a similar effect, ignore the kushtaka's resistance to physical attacks.%rIn addition, a canine with imprecise scent can use it as a precise sense when detecting a kushtaka."}, {"name": "Null Spirit", "type": "passive", "traits": [], "text": "Kushtaka exist completely separated from their mortal souls, making them immune to the effects of haunts and most effects from incorporeal spirits and undead, but also unaware of their presence; incorporeal undead are both Invisible and inaudible to them. Incorporeal spirits and undead can affect a kushtaka only with effects that manifest in the physical world.%rFor instance, a ghost mage casting a Fireball or a poltergeist throwing objects could harm the kushtaka, but a ghost commoner's…"}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Persuasive Rebuttal", "type": "reaction", "traits": [], "text": "Trigger A creature fails a check to Strike or Demoralize the kushtaka%rRequirements The kushtaka has a charm spell available%rEffect The kushtaka casts Charm on the target."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "The kushtaka takes on the specific appearance of a unique Small or Medium humanoid. Every time the kushtaka uses this ability, it takes on the same chosen form, though it can use non-magical disguises to further alter its appearance. This doesn't change the kushtaka's Speed or its attack and damage bonuses with its Strikes, though it does change the damage to an appropriate type, typically bludgeoning."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
