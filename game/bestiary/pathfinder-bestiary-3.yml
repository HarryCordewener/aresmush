  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Black Apoxia", "type": "passive", "traits": ["disease"], "text": "The target can't recover from the fatigued condition caused by black apoxia until the disease is cured%rSaving Throw DC 24 Fortitude%rStage 1 carrier with no ill effect (1 day)%rStage 2 Drained 1 and Fatigued (1 day)%rStage 3 Drained 2 and fatigued (1 day)%rStage 4 dead"}, {"name": "Brawling Critical", "type": "passive", "traits": [], "text": "When the kurobozu scores a critical hit with an unarmed attack, the target must succeed at a DC 22 Fortitude save or be Slowed 1 until the end of its next turn."}, {"name": "Sagebane", "type": "passive", "traits": ["occult"], "text": "When the kurobozu damages a living creature with an unarmed Strike, the target must succeed at a DC 24 Fortitude save or become Stupefied 1 for 1 minute.%rFurther damage dealt by the kurobozu resets the duration to 1 minute and increases the stupefied value by 1 on a failed save, to a maximum of stupefied 4."}, {"name": "Steal Breath", "type": "action", "traits": ["incapacitation", "occult"], "cost": 2, "text": "Requirements The kurobozu is adjacent to a living creature that is Paralyzed, Slowed, Stunned, or Unconscious%rEffect The kurobozu leans over and sucks the breath from the target, who must attempt a DC 22 Fortitude save. Regardless of the result, the creature is exposed to black apoxia and its breath reeks of carrion for 1 minute.%rCritical Success The creature is unaffected.%rSuccess The creature can't speak for 1 minute.%rFailure The creature becomes Sickened 2 and can't speak for 1…"}, {"name": "Stunning Flurry", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect The kurobozu makes two unarmed Strikes. If both hit the same creature, combine their damage for the purpose of resistances and weaknesses, and the target must succeed at a DC 22 Fortitude save or be Stunned 1 (or Stunned 3 on a critical failure); th