  actions: [{"name": "Telepathy 500 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Telepathic Singer", "type": "passive", "traits": [], "text": "A love siktempora can provide verbal components and auditory performances for their composition spells even though they can't speak. They do so without needing to make noise, as all creatures within range of their telepathy hear the components in their mind. However, the siktempora can do so only as long as at least one other creature with an Intelligence modifier of +0 or higher is within the range of their telepathy."}, {"name": "Temporal Sense", "type": "passive", "traits": [], "text": "A siktempora can always roll Dimension of Time Lore for initiative. When it does, it gains a +2 circumstance bonus to the roll."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Regeneration 50 (Deactivated by Mental, Orichalcum, or Unholy)", "type": "passive", "traits": []}, {"name": "Deflect Aggression", "type": "reaction", "traits": ["emotion", "mental", "occult"], "text": "Trigger The love siktempora is targeted by an attack%rEffect The siktempora glows with compassion, deflecting the attacker's aggression. The siktempora gains a +2 circumstance bonus to their AC and resistance 15 against the triggering attack, and the attacker must attempt a saving throw against the siktempora's heartsong (see below)."}, {"name": "Uncanny Pounce", "type": "free", "traits": [], "text": "Trigger The love siktempora rolls Dimension of Time Lore for initiative%rEffect The love siktempora Strides once and makes a claw Strike, in either order."}, {"name": "Heartsong", "type": "passive", "traits": ["emotion", "mental", "occult"], "text": "A creature that takes mental damage from the love siktempora's emotional bolt must succeed at a DC 37 Will save or become Fascinated by the siktempora until the end of the target's next turn. Hostile actions don't end this fascinated condition."}, {"name": "Love's Impunity", "type": "passive", "traits": [], "text": "The love siktempora's emotional bolt Strike doesn't trigger reactions that normally trigger based off making a ranged attack."}, {"name": "Telepathic Ballad", "type": "action", "traits": ["emotion", "mental", "occult"], "cost": 1, "text": "The love siktempora casts Courageous Anthem or Rallying Anthem. It increases the area to a 200-foot and increases the status bonuses the cantrip provides to +2.%rEffect: Inspire Courage (Love Siktempora)%rEffect: Inspire Defense (Love Siktempora)"}]
