  actions: [{"name": "Consecration Vulnerability", "type": "passive", "traits": [], "text": "A lifeleecher in a place of worship dedicated to a non-evil deity or on sacred ground, such as an area blessed by Anointed Ground, is Slowed 1."}, {"name": "Mortic Ferocity", "type": "reaction", "traits": [], "text": "The lifeleecher is also surrounded by visibly flickering fragments of the souls they've consumed, becoming Concealed until the end of their next turn."}, {"name": "Soul Feast", "type": "reaction", "traits": ["divine", "void"], "text": "Trigger A creature adjacent to the lifeleecher dies%rEffect The lifeleecher consumes a portion of the creature's soul, regaining 2d8 healing Hit Points."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Death Gasp", "type": "action", "traits": ["divine"], "cost": 1, "text": "The lifeleecher draws in a deep breath and holds it, temporarily suspending their biological processes and becoming undead.%rThe lifeleecher gains the undead trait and becomes immune to bleed, death effects, disease, Paralyzed, poison, and sleep. Any such effects the angheuvore is currently suffering from are suspended, but take effect again once they take a breath.%rDeath Gasp lasts as long as the lifeleecher holds their breath (up to 11 rounds).%rEffect: Death Gasp"}, {"name": "Ghost Hunter", "type": "passive", "traits": [], "text": "The lifeleecher's tusks have the effects of the Ghost Touch property rune on attacks against incorporeal undead."}, {"name": "Leech Essence", "type": "passive", "traits": ["divine"], "text": "When the lifeleecher damages a living or undead creature with their jaws Strike, they drain the target's life essence.%rThe lifeleecher gains 5 temporary Hit Points that last for 1 minute, and the target must succeed at a DC 24 Fortitude save or become Drained 1 if living, or Stunned 1 if undead. If the target was already drained or stunned, the value of this condition instead increases by 1, to a maximum of 3."}]
