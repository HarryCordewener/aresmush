  actions: [{"name": "Defensive Disarm", "type": "reaction", "traits": [], "text": "Trigger A creature makes a melee weapon Strike against the angazhani and misses%rRequirements The angazhani is benefiting from their Defensive Slam%rEffect The angazhani attempts to Disarm the attacker of the triggering weapon."}, {"name": "Defensive Slam", "type": "action", "traits": [], "cost": 2, "text": "The angazhani uses their arms to defend themself while attacking. The angazhani Strikes once and gains a +2 circumstance bonus to AC until the start of their next turn.%rEffect: Defensive Slam"}, {"name": "Focused Slam", "type": "action", "traits": [], "cost": 2, "text": "The angazhani beats a single opponent with all four of their brawny arms, leaving their foe nowhere to dodge.%rThe angazhani makes a fist Strike. On a successful attack, they deal fist damage to the target plus an additional 3d8 damage, and they meet the requirements to Rend the target this turn, even if they didn't hit on two consecutive Strikes. Even on a failed attack, the angazhani deals the damage from one fist Strike to the target, though they still miss completely on a critical…"}, {"name": "Pummeling Charge", "type": "action", "traits": [], "cost": 3, "text": "The angazhani rushes up to a foe at extreme speed and slams down with their fists. The angazhani Strides or Climbs up to three times, then makes two fist Strikes against one enemy within reach."}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Fist"}]
