  actions: [{"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "30 feet. A creature entering the aura or starting its turn in the aura must succeed at a DC 34 Fortitude save or become Sickened 1 (plus Slowed 1 for as long as it's sickened on a critical failure).%rWhile within the aura, affected creatures take a -2 circumstance penalty to saves against disease and to recover from the sickened condition.%rA creature that succeeds at its save is temporarily immune for 1 minute.%rEffect: Stench"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The popobawa can take on the appearance of a human or a Small or Medium bat. It loses its stench aura while transformed. In human form it also loses its Strikes but can make fist Strikes that deal the same amount of bludgeoning damage as its talon Strike."}, {"name": "Feed on Sorrow", "type": "action", "traits": ["concentrate", "healing", "occult", "vitality"], "cost": 1, "text": "Frequency once per round%rEffect The popobawa draws strength from the suffering of others. It regains 10 healing Hit Points for each enemy within 30 feet feet that has one of the following conditions, to a maximum of 40 Hit Points: Confused, Doomed, Dying, Enfeebled, Fatigued, Frightened, Sickened, Slowed, Stunned, Stupefied, or Wounded."}, {"name": "Hallucinatory Haunting", "type": "free", "traits": [], "text": "Trigger The popobawa moves an object with Telekinetic Hand or Telekinetic Haul, controls a creature with Dominate, or casts Animated Assault%rEffect The popobawa casts Ghost Sound or Ventriloquism, with the sound originating from the target or area of the spell."}, {"name": "Shameful Loathing", "type": "passive", "traits": ["curse", "emotion", "mental", "occult"], "text": "A creature damaged by the popobawa's jaws is overcome with shame and self-hatred and must attempt a DC 36 Will save.%rSuccess The target is unaffected.%rFailure The target becomes Stu