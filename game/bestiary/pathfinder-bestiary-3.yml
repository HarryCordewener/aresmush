  actions: [{"name": "Banished from the Ground", "type": "passive", "traits": [], "text": "A baykok can't willingly touch earth or rock surfaces. If forced into contact with such a surface, it becomes Enfeebled 2 for as long as it remains incontact."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "120 feet. DC 25 Will"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Arrow of Despair", "type": "passive", "traits": ["emotion", "fear", "incapacitation", "mental", "occult"], "text": "A baykok creates an invisible arrow of bone as it draws its bow. A Frightened creature hit by the arrow is stricken with loneliness and despair and must attempt a DC 26 Will save; if the Strike was a critical hit, the target uses the outcome one degree of success worse than the result of its save.%rCritical Success The creature is unaffected.%rSuccess The creature is Slowed 1 for 1 round.%rFailure The creature's frightened value increases by 1 (to a maximum of 4), and it is slowed 1 until its…"}, {"name": "Devour Life", "type": "action", "traits": ["curse", "occult"], "cost": 1, "text": "Requirements The baykok is adjacent to a Paralyzed, Restrained, or Unconscious living humanoid.%rEffect The baykok touches the target and devours part of its life force. The target must succeed at a DC 26 Fortitude save or be afflicted with the baykok's wasting curse. If the target fails and wasn't already affected by the wasting curse, the baykok gains 20 temporary Hit Points that last for 1 hour."}, {"name": "Wasting Curse", "type": "passive", "traits": ["curse", "occult"], "text": "The baykok steals life from its victim and leaves listless dread in its place.%rIf a target fails its save against Devour Life, it becomes Drained 1.%rEach time the target gets a full night's rest, it must succeed at a DC 26 Fortitude save or its drained value increases rather than decreasing. The curse ends if the creature recovers from the drained condition, but if the creature would reach drained 5 from this effect, it dies."}]
