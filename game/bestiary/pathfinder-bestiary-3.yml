  actions: [{"name": "Consecration Vulnerability", "type": "passive", "traits": [], "text": "An etioling in a place of worship dedicated to a non-evil deity or on sacred ground, such as an area blessed by Anointed Ground, is Slowed 1."}, {"name": "Ectoplasmic Secretions", "type": "passive", "traits": ["occult"], "text": "Any creature that hits the etioling with an unarmed attack, tries to Grapple them, or otherwise touches them becomes partially coated in ectoplasm.%rThe creature takes 1d6 void damage and must succeed at a DC 27 Reflex save or become Enfeebled 2 until the ectoplasm is removed.%rThe ectoplasm can be removed with a total of 3 Interact actions by the creature or creatures adjacent to the creature. These actions don't need to be consecutive or made by the same creature."}, {"name": "Ectoplasmic Shield", "type": "reaction", "traits": ["occult"], "text": "Trigger The etioling is the target of a physical ranged attack%rEffect The etioling interposes a wave of ectoplasm between themself and the source of the ranged attack, giving them a +2 circumstance bonus to AC against the triggering attack. If the attack misses, the ectoplasm deflected it. The ectoplasm can't deflect unusually large or heavy ranged projectiles (such as boulders or ballista bolts)."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Withering Aura", "type": "passive", "traits": ["aura", "occult"], "text": "20 feet. The etioling drains nutrients from nearby plant and animal life. Each round a creature begins its turn in this aura, it takes 1d6 void damage and must succeed at a DC 27 Fortitude save or become Drained 1.%rAll non-magical plant life in this aura instantly withers, removing any cover and concealment provided by trees and undergrowth."}, {"name": "Death Gasp", "type": "action", "traits": ["divine"], "cost": 1, "text": "The etioling draws in a deep breath and holds it, temporarily suspending their biological processes and becoming undead.%rThe etioling gains the undead and incorporeal traits and becomes immune to bleed, death effects, disease, Paralyzed, poison, and sleep. Any such effects the etioling is currently suffering from are suspended, but take effect again once they take a breath. They gain a fly Speed of 25 feet, resistance 10 to all damage (except force, ghost touch, or vitality; double this…"}]
