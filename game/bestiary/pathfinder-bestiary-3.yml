  strikes: [{"name": "Limb", "bonus": 24, "damage": [["3d10+11", "bludgeoning", null]], "traits": []}, {"name": "Warping Ray", "bonus": 27, "damage": [["3d8+8", "force", null]], "traits": ["deadly-2d8", "magical"]}]
  actions: [{"name": "Regeneration 10 (Deactivated by Piercing)", "type": "passive", "traits": []}, {"name": "Destabilizing Field", "type": "passive", "traits": ["aura"], "text": "40 feet. A creature that begins its turn within the area feels its body begin to stretch and must succeed at a DC 33 Fortitude save or become destabilized.%rA destabilized creature emits a 10-foot destabilizing field aura and becomes Sickened 1. The destabilization ends when the creature is no longer sickened.%rA creature that succeeds at its saving throw against the aura is temporarily immune to all destabilizing fields for 1 minute."}, {"name": "Displace", "type": "reaction", "traits": [], "text": "Trigger The amalgamite is hit by a Strike.%rEffect The amalgamite Repositions itself or Transposes itself with another creature. If the amalgamite successfully changes its location, it and any Transposed creature take half damage from the triggering Strike."}, {"name": "Reposition", "type": "action", "traits": ["concentrate", "occult", "teleportation"], "cost": 2, "text": "The amalgamite teleports into an unoccupied space it can see within 50 feet."}, {"name": "Transpose", "type": "action", "traits": ["occult", "teleportation"], "cost": 2, "text": "The amalgamite chooses up to two destabilized creatures they can see within 50 feet and swaps their positions, or moves a single such creature to an unoccupied space they can see within range. If the amalgamite chooses two creatures, they can choose their self as one of these creatures, but both targets must be the same size.%rAn unwilling creature can attempt a DC 33 Will save. If either target succeeds at this saving throw, both are unaffected."}]
