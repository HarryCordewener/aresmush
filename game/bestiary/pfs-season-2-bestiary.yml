  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Empowered Blood", "type": "passive", "traits": [], "text": "The Usij cultists' blood magic strengthens Sezruth. He begins with 2 Blood Points from sacrifices just before the PCs arrived, and gains 1 additional Blood Point for each time the empowered blood hazard is activated in area B. The adjustments are not cumulative.%r1-2 Blood Points Sezruth gains 5 temporary Hit Points.%r3-4 Blood Points Sezruth gains 5 temporary Hit Points. Sezruth is Quickened and can use the extra action to Stride toward or Strike the foe it is aware of with the highest…"}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Hatred of Beauty", "type": "passive", "traits": [], "text": "While aghashes hate all mortals, they particularly despise beautiful objects and beautiful or charismatic mortals. When not in physical peril, an aghash is compelled to destroy art and other works of beauty. An aghash can't enter an area of pristine beauty without first marring it in some way. Given a choice, an aghash attacks a foe with the highest Charisma score first. If barred from doing so by force or some magical effect, they take 1d6 mental damage at the end of their turn"}, {"name": "Cursed Gaze", "type": "action", "traits": ["concentrate", "curse", "divine", "emotion", "fear", "mental", "visual"], "cost": 2, "text": "The aghash fixes their gaze on one creature they can see within 20 feet. The creature must attempt a DC 19 Will save%rCritical Success The creature is unaffected.%rSuccess The creature takes 2d4 mental damage and becomes Frightened 1.%rFailure The creature takes 4d4 mental damage and becomes either Frightened 2 or Stunned 1 (the aghash's choice).%rCritical Failure The creature takes 8d4 mental damage and becomes Frightened 2 and Stunned 2."}, {"name": "Sandstorm", "type": "action", "traits": ["divine", "earth"], "cost": 3, "text": "Frequency once per day%rEffect The aghash creates a temporary sandstorm in a 30-foot that lasts for 5 rounds. Creatures within the emanation take a –4 circumstance penalty to Perception checks and must succeed at a DC 17 Fortitude save. On a failure, they're forced to hold their breath or else they start suffocating. A creature within the sandstorm at the end of its turn takes 1d4 slashing|options:area-damage damage. Divs are immune to all effects of an aghash's sandstorm.%rEffect: Sandstorm"}]
