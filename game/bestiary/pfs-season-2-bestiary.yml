  actions: [{"name": "Shark Commune 150 feet", "type": "passive", "traits": ["mental"], "text": "The sea devil can communicate telepathically with sharks within range. It can communicate only simple concepts like \"come,\" \"guard,\" or \"attack.\""}, {"name": "Wavesense 30 feet", "type": "passive", "traits": []}, {"name": "Blood Frenzy", "type": "free", "traits": ["rage"], "text": "Requirements The sea devil is not Fatigued or already in a frenzy%rTrigger The sea devil deals bleed damage to a living creature.%rEffect The sea devil flies into a frenzy that lasts 1 minute. While frenzied, the sea devil gains a +1 status bonus to attack rolls with its claws and jaws, gains a +4 status bonus to damage rolls with its claws and jaws, gains 11 temporary HP until the end of the frenzy, and takes a -2 status penalty to AC. The sea devil can't voluntarily stop its frenzy. After its…"}, {"name": "Bloodletting", "type": "passive", "traits": [], "text": "When the sea devil deals piercing or slashing damage, it also deals 1d4 bleed if the target was Off-Guard or if the attack was a critical hit."}, {"name": "Reel In", "type": "action", "traits": [], "cost": 1, "text": "The sea devil impaler pulls the rope attached to their barbed trident 10 feet closer on a success (20 feet on a critical success).%rAthletics check vs. Fortitude DC."}, {"name": "Skewer", "type": "passive", "traits": [], "text": "When the sea devil hits with their barbed trident, the creature becomes skewered. The trident can be removed with an Interact action by succeeding at a DC 21 Athletics check to pull it free."}, {"name": "Unimpeded Throw", "type": "passive", "traits": [], "text": "A sea devil impaler can use thrown ranged weapons underwater with no penalty due to range increment."}]
