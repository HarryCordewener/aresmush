  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Blood Siphon", "type": "reaction", "traits": [], "text": "Trigger A creature within 60 feet takes Persistent Bleed Damage.%rEffect The shed blood disperses into a fine mist that Qxal siphons up with their proboscis. Qxal regains 14 healing Hit Points."}, {"name": "Hallucinatory Scale Dust", "type": "passive", "traits": ["aura", "illusion", "mental"], "text": "30 feet. Fey glamours shed from Qxal's wings like scale dust, causing hallucinations. A creature entering the aura or starting its turn in the area must attempt a DC 25 Will save.%rCritical Success The creature is unaffected and is temporarily immune to the scale dust for 24 hours.%rSuccess The creature is unaffected.%rFailure The creature hallucinates that it is beginning to transform into a plant or animal native to their homeland, becoming either Clumsy 1, Enfeebled 1, or Stupefied 1, at…"}, {"name": "Cooperative Growth", "type": "action", "traits": [], "cost": 1, "text": "Requirements Qxal's last action was a successful Strike against a creature adjacent to a natural surface.%rEffect Vines sprout from the surface, wrapping around the target's limbs. The creature gains the Grabbed condition. To escape, the creature must succeed on a DC 28 Escape check or break the vines (AC 20, Hardness 4, HP 36, BT 18, weakness 10 to slashing)."}, {"name": "Flutter", "type": "action", "traits": [], "cost": 1, "text": "Qxal Flies. Any creature they pass within 30 feet of during their Flutter is exposed to their hallucinatory scale dust."}, {"name": "Grasping Visions", "type": "action", "traits": ["illusion", "mental", "primal"], "cost": 1, "text": "Qxal causes one creature within 60 feet who is under a condition from Qxal's hallucinatory scale dust aura to see visions of grasping vines and swarming insects, impeding the target's every move. All squares count as difficult terrain for that creature until the end of Qxal's next turn, and during that time they gain no benefit from any ability that would allow them to ignore difficult terrain."}, {"name": "Secret Spells", "type": "action", "traits": [], "cost": 1, "text": "Qxal knows how to disguise the manifestations of their spellcasting to catch their foes off guard. If the next action they use is Casting a Spell that has a verbal component, they can remove the verbal component. This makes the spell quieter and allows them to cast it in areas where sound can't carry. Additionally, if Qxal has cover or greater cover against or is Concealed from one or more observers while Casting a Spell, they can attempt a Stealth check against one or more of those observers'…"}, {"name": "Woodland Stride", "type": "passive", "traits": [], "text": "Qxal can pass freely through even the densest jungle. They ignore difficult terrain caused by plants, including plants manipulated by magic."}]
