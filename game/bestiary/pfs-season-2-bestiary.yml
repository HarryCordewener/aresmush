  actions: [{"name": "Telepathy (Touch)", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Entropy Sense (Imprecise) 30 feet", "type": "passive", "traits": ["divine", "prediction"], "text": "An akizendri can anticipate the most likely location of a creature through their supernatural insight into the forces of chaotic probabilities and chance. This grants the Scholar the ability to sense creatures within the listed range. A creature under the effects of Veil of Privacy or that is otherwise shielded from divinations and predictions cannot be noticed via entropy sense."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Fast Healing 1", "type": "passive", "traits": []}, {"name": "Protean Anatomy 6", "type": "passive", "traits": ["divine", "polymorph"], "text": "An akizendri's vital organs shift and change shape and position constantly. Immediately after the Scholar takes acid, electricity, or sonic damage, it gains the listed amount of resistance to that damage type. This lasts for 1 hour or until the next time the protean takes damage of one of the other types (in which case its resistance changes to match that type), whichever comes first.%rThe Scholar is immune to polymorph effects unless they are a willing target. If Blinded or Deafened, the…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The Scholar takes on the appearance of any Small or smaller creature. This doesn't change its Speed or its attack and damage bonuses with its Strikes, but might change the damage type its Strikes deal."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(1d8+3) bludgeoning damage, DC 20 Fortitude"}, {"name": "Garbled Thoughts", "type": "passive", "traits": ["divine", "emotion", "mental"], "text": "A creature hit by the Scholar's bite Strike must attempt a DC 20 Will save.%rSuccess The creature is unaffected.%rFailure The creature is Stupefied 1 for 1d4 rounds.%rCritical Failure As failure, but the creature is also Confused for 1 round."}, {"name": "Text Immersion", "type": "passive", "traits": ["divine"], "text": "When the Scholar casts Secret Page, it can physically immerse itself in the text, changing the message of the text in the process. It can exit the book at any point by Dismissing secret page , at which point it appears in a space adjacent to the text. If it does so to begin combat, it rolls a Deception check for initiative.%rAs long as it remains immersed in the text, the Scholar has no body. It can communicate telepathically with a creature as long as the creature touches the book or scroll…"}, {"name": "Text Passage", "type": "action", "traits": ["divine", "teleportation"], "cost": 1, "text": "Requirements The Scholar is adjacent to a text they have modified with Secret Page, and another such text is within 500 feet%rEffect The Scholar has a way with words beyond other akizendris. They physically immerse themself into the adjacent text, which they use as a medium to teleport to another text within 500 feet that they have modified with secret page . Once they enter the first text, they instantly know the locations of the other texts within range.%rEntering a text in this manner…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 20, "attack": 12, "spells": {"0": ["Acid Splash", "Daze", "Ghost Sound", "Mage Hand", "Sigil"], "1": ["Detect Alignment (At will) (Lawful only)"], "3": ["Glyph of Warding", "Secret Page"], "4": ["Freedom of Movement (Constant)"]}}]
