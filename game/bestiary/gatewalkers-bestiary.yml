  actions: [{"name": "Tremorsense (Imprecise) 120 feet", "type": "passive", "traits": []}, {"name": "Pheromones", "type": "passive", "traits": ["aura"], "text": "5 miles. Yaiafinetis communicate with others of their kind via airborne pheromones. They can use this form of communication to determine their relative distance to each other, call for help if they are under attack or need sustenance, announce that they've detected prey, and convey similar basic concepts. Pheromones coat everything within the aura and allow all dusk poppies to perceive with their pheromone sense."}, {"name": "Alluring Spores", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 19 Fortitude%rMaximum Duration 6 rounds%rStage 1 Fascinated by the yaiafineti (1 round)%rStage 2 Controlled by the yaiafineti (1 round)"}, {"name": "Feed", "type": "action", "traits": [], "cost": 3, "text": "The yaiafineti draws nutrients from a living creature it has swallowed, regaining (3d8+24) healing HP. The swallowed creature takes (2d12+8) bludgeoning."}, {"name": "Paralyzing Poison", "type": "passive", "traits": ["poison"], "text": "The plants send out runner shoots that quickly develop purple bulbs. These bulbs, the plant's polyps, sprout many long, hooked vines before detaching from the mother plant. Polyps are short lived but active, foraging for a week or so before they shrivel and die. These polyps aren't dangerous unless handled. They secrete a fine dust that acts as a paralyzing poison that seizes the nervous system of creatures who come in contact with them.%rSaving Throw DC 19 Fortitude%rMaximum Duration 6…"}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Medium, (2d12+8) bludgeoning, Rupture 18"}, {"name": "Improved Grab", "type": "free", "traits": []}]
