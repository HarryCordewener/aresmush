  actions: [{"name": "+1 Status Bonus to Saves Against Holy Spells and Effects", "type": "passive", "traits": []}, {"name": "Blackfrost Evasion", "type": "reaction", "traits": [], "text": "Trigger Ainamuuren takes at least 35 physical damage from a single attack, and he isn't currently discorporated%rEffect Ainamuuren discorporates into a whirling blizzard of blackfrost for 3 rounds. During this time, he gains resistance 10 to physical damage and weakness 10 to force damage. He gains a fly Speed of 40 feet, but the only action he can take is to Fly. While discorporated, the first time each round that Ainamuuren enters another creature's space or a creature enters Ainamuuren's…"}, {"name": "Reactive Strike (Tentacle Only)", "type": "reaction", "traits": []}, {"name": "Reactive Tentacles", "type": "passive", "traits": [], "text": "At the start of his turn, when Ainamuuren regains his actions, he gains an additional reaction that can be used only to make an Attack of Opportunity."}, {"name": "Dreams of the Blackfrost Whale", "type": "action", "traits": ["incapacitation", "mental"], "cost": 2, "text": "Frequency once per day%rEffect Ainamuuren fixes his many-eyed gaze upon a single target he can see within 60 feet, then opens wide his maw to release a torrent of whispers channeled from Osoyo's slumbering mind. The targeted creature must attempt a DC 32 Will save.%rCritical Success The creature is unaffected.%rSuccess The creature endures a brief moment where they believe they are imprisoned in the ice, as Osoyo has been for thousands of years, and is Slowed 1 for 1 round.%rFailure The vision…"}, {"name": "Invasive Blackfrost", "type": "passive", "traits": ["cold", "curse", "disease", "occult"], "text": "Gatewalker characters are not immune to blackfrost effects inflicted by Ainamuuren%rThis affliction can't be reduced below stage 1, nor the damage from it healed, until successfully treated with Cleanse Affliction or a similar effect; the affliction can then be removed as a normal disease. A creature that dies from cold damage while cursed with blackfrost rises as a blackfrost dead after 24 hours. Blackfrost has a counteract rank of 10.%rSaving Throw DC 32 Fortitude%rStage 1 4d6 cold (1…"}, {"name": "Twist Deviance", "type": "action", "traits": ["mental", "occult"], "cost": 2, "text": "Ainamuuren reaches out, then clutches his fingers into a fist and twists his arm, as if he were wrenching and tugging. At the same moment, all gatewalkers in a 60-foot that Ainamuuren can see feel the signs they've worn on their bodies since they emerged from their Missing Moment spike with pain, as if Ainamuuren had Grabbed that flesh and was twisting and tearing it. The targets must attempt a DC 32 Will save. Ainamuuren can't use Twist Deviance again for 1d4 rounds.%rCritical Success The…"}, {"name": "Knockdown", "type": "action", "traits": [], "cost": 1}]
