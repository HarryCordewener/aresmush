rget Escapes."}, {"name": "Tundra Glide", "type": "passive", "traits": [], "text": "The blackfrost guecubu can Burrow through any frozen earth, ice, or snow, not including rock. When it does so, the blackfrost guecubu moves at its full burrow Speed, leaving no tunnels or signs of its passing."}, {"name": "Wrathful Misfortune", "type": "passive", "traits": ["arcane", "curse"], "text": "A creature damaged by a guecubu must succeed at a DC 26 Will save or become cursed with consummate bad luck. The creature becomes Clumsy 2.%rEach time that creature rolls initiative, on their next roll they must roll twice and use the worse result; this is a misfortune effect."}]
