e effect using a single action, which has the concentrate trait.%rThe nymph queen focuses her beauty upon a target within her aura. The creature must attempt a DC 23 Will save. On a failure, it is…"}, {"name": "Inspiration", "type": "action", "traits": ["emotion", "mental", "primal"], "cost": 3, "text": "A nymph queen can inspire a single intelligent creature by giving that creature a token of her favor, typically a lock of her hair. As long as the creature carries her token and remains in good standing with the nymph queen, the creature gains a +1 status bonus to all Crafting checks, Performance checks, and Will saves.%rIf a nymph queen grants her Inspiration to a bard and the nymph queen is that bard's muse, the bard gains an additional benefit depending on their muse theme: for lore muse,…"}, {"name": "Water Healing", "type": "action", "traits": ["concentrate", "healing", "primal"], "cost": 2, "text": "While within any body of water in her domain, the naiad queen heals 28 healing Hit Points every 10 minutes."}]
