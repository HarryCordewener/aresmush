  actions: [{"name": "Grave Weapon", "type": "passive", "traits": ["divine"], "text": "The wight is bound to the darts she was buried with."}, {"name": "Final Spite", "type": "reaction", "traits": [], "text": "Trigger The wight is reduced to 0 Hit Points%rEffect The wight makes a Strike before being destroyed. This Strike can inflict corrupting spite, but fueled by spite doesn't apply."}, {"name": "Fueled by Spite", "type": "passive", "traits": [], "text": "Each time a creature loses Hit Points due to a corrupting spite curse the wight inflicted, the wight gains 3 temporary Hit Points."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Claw of Pain", "type": "passive", "traits": [], "text": "When the sister wight targets the same creature with two Strikes from her Flurry of Blows, she can cause lingering pain. If either Strike hits and deals damage, the target must succeed at a DC 18 Fortitude save or take 1d4 persistent mental damage (and become Sickened 1 on a critical failure)."}, {"name": "Corrupting Spite", "type": "passive", "traits": ["curse", "divine", "void"], "text": "The wight's unarmed attacks and bound weapons inflict a curse that makes a creature grow weak and spiteful. If a wight inflicts corrupting spite on a creature already afflicted by it, the victim attempts a new save, ignoring the result if it's better than a failure.%rA living humanoid that dies while under the curse rises as a wight after 1d4 rounds, controlled by the wight that killed it. The wight spawn can't inflict corrupting spite and is Clumsy 2. If its creator dies or after roughly a…"}, {"name": "Flurry of Blows", "type": "action", "traits": ["flourish"], "cost": 1, "text": "The sister wight makes two fist Strikes, applying her multiple attack penalty as normal. If both hit the same creature, combine their damage for the purpose of resistances and weaknesses."}]
