  actions: [{"name": "Bleeding Heart of Urgathoa", "type": "passive", "traits": [], "text": "Red ichor drips from the heart-shaped warshard embedded in Illcayna's chest. This warshard functions as a Symbol of Conflict (Greater), except it's attuned only to Urgathoa. As long as Illcayna exists, non-Urgathoans can't use the warshard even if it's removed. If Illcayna dies, the warshard acts as a regular greater symbol of conflict ."}, {"name": "Reaper's Sigh", "type": "passive", "traits": [], "text": "Illcayna is fused with Reaper's Sigh, granting her a +4 circumstance bonus to her Reflex DC against attempts to Disarm the scythe. This bonus is reduced to +2 for 1 round after she's critically hit with a slashing weapon."}, {"name": "+1 Status to All Saves vs. Holy Effects", "type": "passive", "traits": []}, {"name": "Field of Unholy Undeath", "type": "passive", "traits": ["aura", "divine", "unholy"], "text": "40 feet. Undead allies within the aura gain a +1 status bonus to attack rolls and saving throws. If the ally has void healing, they also gain fast healing 5. A living creature who doesn't worship Urgathoa takes 6d6 void damage (DC 26 Fortitude save) when they enter or start their turn in the aura. Regardless of the result of the saving throw, that creature becomes temporarily immune to the aura for 1 day."}, {"name": "Life to Unlife", "type": "reaction", "traits": ["divine", "unholy", "void"], "text": "Frequency once per minute%rTrigger A creature within 30 feet that Illcayna can observe Casts a divine Spell with the healing trait%rEffect Illcayna sadistically twists the healing magic against the living. She expends a prepared spell of the same rank as the triggering spell and then attempts to counteract the triggering spell using Religion. If she successfully counteracts the spell, Illcayna consumes the magic and regurgitates it as a 3-action harm spell of the rank of the countered spell."}, {"name": "Share Blessings", "type": "passive", "traits": ["disease", "divine", "unholy"], "text": "When Illcayna is destroyed, she explodes in a blast of infectious rot. All creatures in a 10-foot emanation are exposed to pallid plague."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Pallid Plague", "type": "passive", "traits": ["disease", "divine", "virulent"], "text": "Saving Throw DC 27 Fortitude%rStage 1 carrier (3 days)%rStage 2 3d8 void damage and Doomed 1 (1 day)%rStage 3 3d8 void damage, doomed 1, and Drained 1 (1 day)%rStage 4 4d8 void damage, Doomed 2, and drained 1 (1 day)%rStage 5 4d8 void damage, Doomed 3, and Drained 2 (1 day)%rStage 6 dead.%rA creature that dies while infected with pallid plague rises as a Wight."}, {"name": "Reap", "type": "action", "traits": [], "cost": 2, "text": "Illcayna makes a Reaper's Sigh Strike and compares the attack roll result to the ACs of two foes who must both be within her melee reach. Roll damage only once, and apply it to each creature hit. Reap counts as two attacks for Illcayna's multiple attack penalty."}, {"name": "Wake the Dead", "type": "action", "traits": ["divine"], "cost": 2, "text": "Frequency once per minute%rRequirements Illcayna is adjacent to a creature that died within the last minute%rEffect Illcayna animates the dead with a touch of her hand. The creature must succeed at a DC 29 Will save or arise as a Wight. These wights automatically become loyal to Illcayna and independently act in her interest and follow her command until destroyed."}]
