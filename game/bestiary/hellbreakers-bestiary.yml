Spell that requires a spell attack roll. The effects of the spell don't occur immediately but are imbued into his attack instead. He attempts a claw melee Strike, with the attack roll determining the effects of both the Strike and the spell. This counts as two attacks for his multiple attack penalty, but he doesn't apply the penalty until after he's completed the…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
