  actions: [{"name": "+2 Status to Will Saves vs. Mental", "type": "passive", "traits": []}, {"name": "Godclaw Aura", "type": "passive", "traits": ["aura", "divine"], "text": "15 feet. Followers of any deities on the Godclaw pantheon or of the pantheon itself within the aura immediately know Caeto is a champion of the Godclaw."}, {"name": "Shield Block", "type": "reaction", "traits": []}, {"name": "Steel Command", "type": "reaction", "traits": ["divine", "emotion", "mental"], "text": "Trigger A creature in Caeto's aura damages him%rEffect Caeto commands his enemy to kneel in supplication. The triggering creature must attempt a DC 30 Will save. They then become immune to Steel Command for 1 minute.%rSuccess The creature must choose to drop Prone as a free action or take 3d6 mental,1d8 persistent spirit damage.%rFailure The creature must choose to drop prone as a free action and be Slowed 1 or take 6d6 mental,2d8 persistent spirit damage.%rCritical Failure The creature drops…"}, {"name": "Hand of the Avenger", "type": "free", "traits": ["divine", "manipulate", "spirit"], "text": "Caeto evokes his oath to bring justice to those he deems a threat to Isger. Until the end of his turn, Caeto can use his lay on hands to damage an enemy in his aura as if they were undead, dealing spirit damage instead of vitality damage."}, {"name": "Lawbreaker's Bane", "type": "passive", "traits": [], "text": "Caeto gains a +4 status bonus on damage to Strikes against targets that he knows have broken the law. The bonus increases to +6 if the target is a known member of the Hellbreakers League."}, {"name": "Oppressive Might", "type": "action", "traits": ["concentrate", "divine", "emotion", "fear", "mental", "visual"], "cost": 1, "text": "Caeto uses his posture to assert dominance over the masses. He attempts an Intimidation check to demoralize all non-allied creatures within 60 feet. He doesn't take a penalty against targets who don't understand his language. On a critical success, that target doesn't become temporarily immune to Caeto's other attempts to Demoralize them."}, {"name": "Subdue Fugitive", "type": "action", "traits": [], "cost": 2, "text": "Frequency once per minute%rRequirements Caeto is wielding his longsword%rEffect Caeto uses his shifting rune's Shift Weapon to transform his sword into a flail and makes a melee Strike with it. If the Strike hits and deals damage, he can attempt an Athletics check as a free action to Disarm or Trip the target of the Strike. This attempt neither applies nor counts toward Caeto's multiple attack penalty."}]
