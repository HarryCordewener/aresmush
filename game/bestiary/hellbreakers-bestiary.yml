  strikes: [{"name": "Claw", "bonus": 18, "damage": [["2d8+5", "slashing", null]], "traits": ["agile"], "effects": ["Grab"]}]
  actions: [{"name": "Children of the Night", "type": "passive", "traits": ["divine", "mental"], "text": "Ezio's presence brings forth creatures of the night to do his bidding. Ezio can give telepathic orders to these creatures as long as they're within 100 feet, but they can't communicate back. Ezio prefers to keep the company of rat swarms."}, {"name": "Fast Healing 7", "type": "passive", "traits": []}, {"name": "Cloud of Plague", "type": "free", "traits": ["disease"], "text": "Trigger Ezio is reduced to 0 HP%rEffect Ezio's body explodes in a bloody mist that carries a deadly plague. Each living creature in a 15-foot emanation must succeed at a DC 22 Fortitude save or contract choking death at stage 1 (stage 2 on a critical failure). Ezio bursts forth from the corpse of the first creature to die of this affliction, fully healed, but if all affected creatures are cured of the disease, Ezio is permanently destroyed."}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Hypnotic Gaze", "type": "passive", "traits": ["aura", "divine", "mental", "visual"], "text": "30 feet. Even when he's not attempting to Dominate a creature, Ezio uses his power over others' minds to subtly befuddle them, helping enable his plots. Creatures in the aura take a –1 status penalty to Perception checks to Sense Motive and Perception DCs against Ezio. When a creature ends its turn in Ezio's aura, it must attempt a DC 22 Will save. On a failure, it becomes Stupefied 1 for 1 round (Stupefied 2 for 1 round on a critical failure)."}, {"name": "Vampire Vulnerabilities", "type": "passive", "traits": [], "text": "All vampires possess the following vulnerabilities.%rCompulsions Vampires are creatures with strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless they're transported while they hide within their coffin, nor can they enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions—a pirate vampire might not be able to set foot on solid ground without being invited, for…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Biting Flies", "type": "action", "traits": [], "cost": 1, "text": "Each creature that shares a space with Ezio takes 3d8 piercing damage with a DC 25 Reflex save. On a critical failure, Ezio also gains the benefits of Drinking that creature's Blood."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "Ezio transforms into a swarm of Tiny flies. While in this form, he has the swarm trait and gains weakness 7 to area and splash damage. He has a land Speed of 20 feet and a fly Speed of 30 feet, and can fit into spaces only a few inches wide, moving his constituent creatures through the gap. He can't make any of his normal Strikes but gains the Biting Flies action.%rBiting Flies 1 Each creature that shares a space with Ezio takes 3d8 piercing damage with a DC 25 Reflex save. On a critical…"}, {"name": "Create Servitor", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Blood, Ezio can turn this victim into a vampire servitor by donating some of their own blood to the victim and burying the victim in earth for 3 nights.%rA vampiric servitor is compelled to obey its creator, but if Ezio controls too many vampiric servitors at once (as determined by the GM), or if the servitor is a higher level than Ezio that created it, strong-willed servitors can free themselves by succeeding at a DC 25 Will saving throw."}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "Ezio can cast Dominate at will as a divine innate spell. Casting it requires staring into the target's eyes, giving the spell the visual trait (DC 23 Will). A creature that succeeds is temporarily immune to that vampire's Dominate for 24 hours.%rFully destroying Ezio ends the domination, but merely reducing Ezio to 0 HP is insufficient to break the spell."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirement A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within Ezio's reach.%rEffect Ezio sinks its fangs into that creature to drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions.%rThe victim is Drained 2 and Ezio regains HP equal to 10% of its maximum HP, gaining any excess HP as temporary Hit Points. Drinking Blood from a creature that's already drained doesn't…"}, {"name": "Turn to Mist", "type": "action", "traits": ["air", "concentrate", "divine", "polymorph"], "cost": 1, "text": "Ezio turns into a cloud of vapor, as the Vapor Form spell, or back to its normal form. Ezio loses fast healing while in gaseous form.%rEzio can remain in this form indefinitely."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
