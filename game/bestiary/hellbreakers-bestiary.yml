  actions: [{"name": "Wind-Up", "type": "passive", "traits": [], "text": "24 hours, disable-device dc=24, standby%rFor a clockwork to act, it must be wound with a unique key by another creature. This takes 1 minute. Once wound, it remains operational for the listed amount of time, usually 24 hours, after which time it becomes unaware of its surroundings and can't act until it's wound again. Some clockworks' abilities require them to spend some of their remaining operational time. They can't spend more than they have and shut down immediately once they have 0 time…"}, {"name": "Explosive End", "type": "reaction", "traits": ["fire"], "text": "Trigger The aurocan drops to 0 HP%rEffect The aurocan detonates. Every creature in a 30-foot emanation takes 3d12 bludgeoning,3d8 fire|options:area-damage damage (DC 23 Reflex save). On a critical failure, a creature is also knocked Prone."}, {"name": "Blistering Touch", "type": "action", "traits": ["fire"], "cost": 1, "text": "The aurocan funnels some of the steam powering it into its body, heating up its metal frame. For the next minute, its melee Strikes deal an additional 1d6 fire damage."}, {"name": "Head of Steam", "type": "action", "traits": ["fire", "magical"], "cost": 2, "text": "Requirements The aurocan has used Blistering Touch within the past 2 rounds, and its head is attached%rEffect The aurocan expels a cloud of steam as its head detaches. The head occupies a 5-foot square and has a fly Speed of 15 feet. As part of this action, and every time the aurocan Sustains it on a subsequent round, the head can Fly up to its Speed, blasting steam directly downward as it moves. Each creature whose space it passes no more than 5 feet above during its flight takes 4d6 fire…"}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Large or smaller, hoof, DC 26 Reflex"}]
