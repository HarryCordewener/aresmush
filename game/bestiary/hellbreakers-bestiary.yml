  actions: [{"name": "+1 Status to All Saves vs. Death Effects", "type": "passive", "traits": []}, {"name": "Aura of Blight", "type": "passive", "traits": ["aura", "disease"], "text": "15 feet. The sarcovalt is surrounded by a miasma of infection. An enemy that enters or ends their turn in the aura must attempt a DC 19 Fortitude save.%rSuccess The creature is unaffected and becomes temporarily immune to the aura for 1 minute.%rFailure Until the end of its next turn, the creature takes a –1 circumstance penalty to saves against disease effects.%rCritical Failure Until the end of its next turn, the creature takes a –2 circumstance bonus against disease effects and is Enfeebled…"}, {"name": "Befouled Body", "type": "passive", "traits": [], "text": "Any water the sarcovalt touches becomes diseased with filth fever.%rFilth Fever (disease)%rSaving Throw DC 23 Fortitude%rOnset 1d4 days%rStage 1 Sickened 1 (1 day)%rStage 2 Drained 1 (1 day)%rStage 3 Drained 2 (1 day)"}, {"name": "Reactive Detach", "type": "reaction", "traits": [], "text": "Trigger The sarcovalt takes slashing damage from a creature while they have another creature Grabbed or Restrained%rEffect The sarcovalt uses Detach Head. Their head keeps the other creature grabbed or restrained, and their body Steps. The sarcovalt gains resistance 5 to the triggering slashing damage.%rEffect: Reactive Detach"}, {"name": "Return to Sender", "type": "reaction", "traits": [], "text": "Trigger A creature escapes from being Grabbed or Restrained by the sarcovalt's detached head%rEffect The sarcovalt's head returns to their body via the shortest possible path. Any creature in a straight line between the head and the body must succeed at a DC 21 Reflex save or become Clumsy 1 for 1 round (Clumsy 2 on a critical failure). The sarcovalt Dismisses Detach Head."}, {"name": "Detach Head", "type": "free", "traits": ["occult"], "text": "Trigger The sarcovalt takes damage from a critical hit with a slashing weapon or has their head removed (such as by a vorpal weapon)%rEffect The sarcovalt can survive decapitation and isn't killed if an effect that removes their head would kill them. Instead, the sarcovalt's head becomes detached from their body. The detached head has the same statistics as the body (except for the aura of blight) and gains the minion trait. The sarcovalt's body can issue a verbal command to the detached head…"}, {"name": "Malodorous Shriek", "type": "action", "traits": ["occult", "olfactory", "poison", "sonic"], "cost": 2, "text": "The sarcovalt screeches through their skull (detached or not), spraying whatever festering viscera remains in their head in a 20-foot cone. Each creature in the area takes 3d6 sonic,3d6 poison|options:area-damage damage (DC 21 Reflex save). The sarcovalt can't use this ability again for 1d4 rounds."}]
