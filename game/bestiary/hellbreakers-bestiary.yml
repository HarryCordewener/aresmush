  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "At-Will Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Correcting Veil", "type": "passive", "traits": ["aura", "linguistic", "mental", "subtle"], "text": "100 feet. The instillo's telepathic presence constantly monitors perspectives and molds thought toward an infernal clarity. Creatures within the aura gain the Dubious Knowledge skill feat but are unaware of this effect. The instillo is instantly aware when any creature within the aura fails a Recall Knowledge check and influences the erroneous information that the creature gains."}, {"name": "Nod of the Tongue", "type": "passive", "traits": [], "text": "Creatures who can understand Diabolic take a –2 status penalty to their Will saves against the instillo's effects with the auditory or mental trait."}, {"name": "Quiet Confidence", "type": "action", "traits": ["concentrate", "spellshape"], "cost": 1, "text": "The instillo can hide the source of their magic. If the next action the instillo uses is to Cast a Spell, that spell gains the subtle trait. The trait hides only the spell's spellcasting actions and manifestations, not its effects."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The instillo's Strikes deal an additional 2d6 precision damage to Off-Guard creatures."}, {"name": "Superlative Rhetoric", "type": "action", "traits": ["arcane"], "cost": 1, "text": "Frequency once per round%rRequirements The instillo's most recent action was to cast a spell with the auditory trait%rEffect The instillo immediately casts Daze at a creature that can hear them."}]
