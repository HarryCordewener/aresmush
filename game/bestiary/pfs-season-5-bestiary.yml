  actions: [{"name": "Disgusted by Food", "type": "passive", "traits": [], "text": "The morrowkin eats dreams and potential, not food. A creature that spends an action to brandish food at the morrowkin automatically makes the creature Sickened 1 (or increases its sickened value by 1, to a maximum of sickened 6), decreasing the morrowkin's AC, attack rolls, saves, skills, and ability DCs accordingly, as normal for the sickened condition. The morrowkin can't retch to reduce its sickened condition."}, {"name": "Endless", "type": "passive", "traits": [], "text": "If reduced to 0 Hit Points or incapacitated for more than a few rounds, the morrowkin vanishes. In 1 hour, it reappears refreshed completely as if the previous battle never happened, with full HP, with all effects on it cleared, and with its Swallow Future ability ready to use again. This ability is severed if the Dark Tapestry segment it is tied to is removed."}, {"name": "Drain Potential", "type": "passive", "traits": ["misfortune", "void"], "text": "The morrowkin tries to drain the motivation from its target, who must attempt a DC 31 Fortitude save. If the target fails, it is Doomed 1 (Doomed 2 on a critical failure) and must roll twice and use the worse result on all checks for 1 minute. Creatures wearing a hope talisman are unaffected."}, {"name": "Swallow Future", "type": "action", "traits": ["mental", "void"], "cost": 2, "text": "The morrowkin inhales and draws forth the future deeds of all creatures around it. All creatures within a 30-foot of the morrowkin take (6d8+18) mental|options:area-damage damage and must attempt a DC 34 Will save. The morrowkin can't Swallow Future again for 1 minute.%rCritical Success The creature takes no damage.%rSuccess The creature takes half damage and is Doomed 1.%rFailure The creature takes full damage and is Doomed 2.%rCritical Failure The creature takes double damage and becomes…"}, {"name": "Tomorrow's Fury", "type": "action", "traits": [], "cost": 2, "text": "The morrowkin makes claw attacks against any number of targets within reach. The claw attacks count against the morrowkin's multiple attack penalty, but don't apply the penalty until after all attacks have been made."}]
