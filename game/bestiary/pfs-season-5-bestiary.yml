  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Otherworldly Mind", "type": "passive", "traits": ["mental"], "text": "Whenever a creature targets the hound with a mental effect, that creature takes (4d6+2) mental damage (DC 25 Will save). On a critical failure, it also becomes Confused for 1d4 rounds."}, {"name": "Ripping Gaze", "type": "passive", "traits": ["aura", "occult", "visual"], "text": "30 feet. The hound of Tindalos's eyes glow balefully, causing painful but bloodless wounds to rip open in the body of a creature that meets its awful gaze. When a creature ends its turn in the aura's emanation, it takes (4d6+2) slashing damage (DC 25 Fortitude save).%rA creature that critically succeeds at its save is temporarily immune for 24 hours."}, {"name": "Vulnerable to Curved Space", "type": "passive", "traits": [], "text": "When a hound of Tindalos is not adjacent to a structural angle of 90º (or more acute), its resistance to physical damage is suppressed and it becomes Sickened 1. It can't recover from this sickened condition, but the condition ends automatically once the hound is again adjacent to a suitable angle.%rEffect: Vulnerable to Curved Space"}, {"name": "Angled Entry", "type": "action", "traits": [], "cost": 1, "text": "The hound of Tindalos casts a 4th-rank Translocate spell, but it must transport itself into a space adjacent to an angle of 90º (or more acute) in the structure or environment around it. For example, it could teleport to a space adjacent to a wall (using the angle between the wall and floor) or a corner in a room, or adjacent to a sizable tree growing straight up out of the ground, but not to a flat plain or a room with only curved corners and edges.%rOnce per day, the hound can use this…"}]
