  actions: [{"name": "Alluring Scent", "type": "passive", "traits": ["aura", "olfactory", "plant", "primal"], "text": "30 feet. A creature that enters the emanation must attempt a DC 28 Will save. On a failure, the target is Fascinated by the snapdrake and must use at least 1 action on its next turn to Stride closer to the snapdrake. On a success, the target is immune to the snapdrake's alluring scent for 1 hour.", "rules": [{"key": "Aura", "radius": 30, "traits": ["olfactory", "plant", "primal"], "slug": "alluring-scent"}]}, {"name": "Reactive Strike (Tail Scythe Only)", "type": "reaction", "traits": [], "text": "Trigger A creature within the monster's reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.%rEffect The monster attempts a melee Strike against the triggering creature. If the attack is a critical hit and the trigger was a manipulate action, the monster disrupts that action. This Strike doesn't count toward the monster's multiple attack penalty, and its multiple attack penalty doesn't apply to this Strike."}, {"name": "Explosive End", "type": "passive", "traits": [], "text": "The mutant snapdrake's death reveals one last surprise as it explodes into splinters. When it dies, it explodes, dealing 5d6 piercing damage to each creature in a 10-foot emanation, with a DC 30 basic Reflex save."}, {"name": "Greater Forest Passage", "type": "passive", "traits": [], "text": "The snapdrake ignores difficult terrain and greater difficult terrain from plants and fungi."}, {"name": "Marrowlance", "type": "passive", "traits": [], "text": "The mutant cryptid can make wicked spears of bone erupt from its body. The creature can make marrowlance ranged unarmed attacks. Use the highest attack modifier from the creature's highest ranged Strike, as well as the damage from that Strike. If it has no ranged attacks, use moderate accuracy and low damage for the creature's level. Marrowlance unarmed attacks have a range of 60 feet and the versatile S trait."}, {"name": "Shifting Iridescence", "type": "passive", "traits": ["magical"], "text": "Whenever the mutant snapdrake takes energy damage to which it isn't resistant or immune, after taking the damage normally, it gains resistance 10 to that damage type. If it had a resistance to a different damage type from shifting iridescence, it replaces the old resistance with the new resistance.", "rules": [{"key": "RollOption", "option": "shifting-iridescence", "toggleable": true, "suboptions": [{"label": "Acid", "value": "acid"}, {"label": "Cold", "value": "cold"}, {"label": "Electricity", "value": "electricity"}, {"label": "Fire", "value": "fire"}, {"label": "Force", "value": "force"}, {"label": "Sonic", "value": "sonic"}, {"label": "Vitality", "value": "vitality"}, {"label": "Void", "value": "void"}]}, {"key": "Resistance", "type": "{item|flags.system.rulesSelections.shiftingIridescence}", "value": "ternary(gte(@actor.level,17),15,ternary(gte(@actor.level,9),10,5))", "predicate": ["shifting-iridescence"]}]}, {"name": "Snapdrake Pollen", "type": "passive", "traits": ["plant", "poison"], "text": "Saving Throw DC 30 Fortitude%rMaximum Duration 8 rounds%rStage 1 1d6 poison damage plus Dazzled (1 round)%rStage 2 1d6 poison damage plus dazzled and Sickened 1 (2 rounds)%rStage 3 2d6 poison damage plus Confused and sickened 1 (2 rounds)"}, {"name": "Speed Surge", "type": "action", "traits": ["move"], "cost": 1, "text": "Frequency 3 times per day%rEffect The snapdrake moves up to twice its Speed."}, {"name": "Spray Pollen", "type": "action", "traits": ["arcane", "plant", "poison"], "cost": 2, "text": "The snapdrake breathes a blast of pollen in a 40-foot cone. Creatures caught in the blast must succeed at a DC 28 basic Reflex save or be exposed to snapdrake pollen. The snapdrake can't use Spray Pollen again for 1d6 rounds."}, {"name": "Unusual Bane", "type": "passive", "traits": [], "text": "This mutant snapdrake is traumatized by the former Conference Z staff who teamed up to hold it down while experimenting on it. The first time each round the mutant snapdrake comes within 15 feet of any character who took the Aid action, or is attacked while being flanked by two characters, it takes 10 mental damage and must attempt a DC 30 Will save. On a failure, it is Stunned 1 (Stunned 3 on a critical failure)."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1, "text": "Requirements The monster's last action was a successful Strike that lists Grab in its damage entry, or the monster has a creature Grabbed or Restrained%rEffect If used after a Strike, the monster attempts to grapple the creature using the body part it attacked with. This attempt neither applies nor counts toward the creature's multiple attack penalty.%rThe monster can instead use Grab and choose one creature it's grabbing or restraining with an appendage that has Grab to automatically extend that condition to the end of the monster's next turn."}]
