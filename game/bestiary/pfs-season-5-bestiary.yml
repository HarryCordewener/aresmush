  actions: [{"name": "Living Visage", "type": "passive", "traits": [], "text": "While she has more than 30 HP, 287's appears to be a living creature. She has an automatic result of 34 on Deception checks and DCs to conceal her undead status and can Feed on the Living covertly."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When destroyed, 287's ghost re-forms after 2d4 days in her room at the Tsevel Center, fully healed. She can be only be permanently destroyed if her name is returned to her while conscious, or if the journal bearing her number is destroyed and its ashes are removed from the Tsevel Center."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Feed on the Living", "type": "action", "traits": ["divine", "void"], "cost": 2, "text": "287's ghost touches a creature in reach. If the target is a living creature it takes damage from the ghost's ghostly hand with a DC 30 Fortitude save. If the ghost is in their living visage they can disguise Feed on the Living as a benign touch and delay the effects for 1 minute while keeping the target unaware of the effect. A creature can be affected by only one delayed Feed on the Living at a time and if the ghost loses their living visage during that minute the Feed on the Living is…"}, {"name": "Frightful Moan", "type": "action", "traits": ["auditory", "divine", "emotion", "fear", "mental"], "cost": 2, "text": "The ghost laments its fate, forcing each living creature within 30 feet to attempt a DC 30 Will save. On a failure, a creature becomes Frightened 2 (or Frightened 3 on a critical failure). On a success, a creature is temporarily immune to this ghost's frightful moan for 1 minute."}, {"name": "Ravenous Undoing", "type": "passive", "traits": [], "text": "In each 24-hour period, 287's ghost must use Feed on the Living to consume 30 HP (any HP the ghost would gain count toward this total, even if the ghost has enough HP that they don't actually regain the full amount). If the ghost hasn't consumed enough HP, they mindlessly and recklessly feed on any living creature they come across until satiated."}, {"name": "Telekinetic Assault", "type": "action", "traits": ["divine"], "cost": 2, "text": "The ghost cries out in pain and anguish as small objects and debris fly about in a 30-foot. Creatures in this area take 6d6 bludgeoning|options:area-damage damage, subject to a DC 30 Reflex save."}]
