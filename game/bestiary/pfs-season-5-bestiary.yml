e": "metal"}, {"label": "Water", "value": "water"}, {"label": "Wood", "value": "wood"}], "selection": "air"}, {"key": "DamageDice", "selector": "strike-damage", "diceNumber": 1, "damageType": "electricity", "predicate": ["all-made-one:air"]}, {"key": "DamageDice", "selector": "strike-damage", "diceNumber": 1, "damageType": "bludgeoning", "predicate": ["all-made-one:earth"]}, {"key": "DamageDice", "selector": "strike-damage", "diceNumber": 1, "damageType": "fire", "predicate": ["all-made-one:fire"]}, {"key": "DamageDice", "selector": "strike-damage", "diceNumber": 1, "damageType": "electricity", "predicate": ["all-made-one:metal"]}, {"key": "DamageDice", "selector": "strike-damage", "diceNumber": 1, "damageType": "bludgeoning", "predicate": ["all-made-one:water"]}, {"key": "DamageDice", "selector": "strike-damage", "diceNumber": 1, "damageType": "piercing", "predicate": ["all-made-one:wood"]}]}, {"name": "Change Shape", "type": "action", "traits": ["arcane", "concentrate", "polymorph"], "cost": 1, "text": "The jann transforms into a Small or Medium elemental or animal. This doesn't affect the gennayn's statistics, but it could change the damage type of their Strikes.%rThe monster changes its shape indefinitely. It can use this action again to return to its natural shape or adopt a new shape. Unless otherwise noted, a monster cannot use Change Shape to appear as a specific individual. Using Change Shape counts as creating a disguise for the Impersonate use of Deception. The monster's transformation automatically defeats Perception DCs to determine whether the creature is a member of the ancestry or creature type into which it transformed, and it gains a +4 status bonus to its Deception DC to prevent others from seeing through its disguise. Change Shape abilities specify what shapes the monster can adopt. The monster doesn't gain any special abilities of the new shape, only its physical form. For example, in each shape, it replaces its normal Speeds and Strikes, and might potentially change its senses or size. Any changes are listed in its stat block."}]
