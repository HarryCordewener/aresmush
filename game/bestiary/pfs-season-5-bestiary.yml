  actions: [{"name": "Blood Scent", "type": "passive", "traits": ["fey"], "text": "A germinated mandragora can smell creatures with blood as an imprecise scent at a range of 30 feet, and it can smell demons, fey, and sorcerers with blood as a precise sense at a range of 30 feet."}, {"name": "Vulnerability to Supernatural Darkness", "type": "passive", "traits": [], "text": "Whenever a germinated mandragora begins its turn in an area of magical darkness, it is Slowed 1 on that turn."}, {"name": "Blood Drain", "type": "action", "traits": ["fey"], "cost": 1, "text": "Requirements The germinated mandragora has a creature Grabbed%rEffect The germinated mandragora drains blood from the creature it has grabbed, dealing 1d6 untyped damage. If the creature is a demon, fey, or sorcerer, the germinated mandragora gains temporary Hit Points equal to the damage dealt. A creature that has its blood drained by a germinated mandragora is Drained 1 until it receives healing of any kind or amount."}, {"name": "Mandragora Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 19 Fortitude%rMaximum Duration 6 rounds%rStage 1 1d6 poison damage and Stupefied 1 (1 round)%rStage 2 1d6 poison damage, Confused, and Stupefied 1 (1 round)%rStage 3 2d6 poison damage, Confused, and Stupefied 1 (1 round)"}, {"name": "Piercing Shriek", "type": "action", "traits": ["auditory", "mental", "primal"], "cost": 1, "text": "Frequency once per day%rEffect The germinated mandragora emits an unsettling shriek. Each non-mandragora creature within 30 feet must attempt a DC 23 Will save.%rCritical Success The creature is unaffected.%rSuccess The creature is Sickened 1.%rFailure The creature is Sickened 2.%rCritical Failure The creature is sickened 2 and Slowed 1. As long as the creature remains sickened, this slowed condition value can't be reduced below 1."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
