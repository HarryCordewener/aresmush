  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Brain Blisters", "type": "passive", "traits": [], "text": "A brain collector has seven brain blisters on its back that it uses to house stolen brains. A brain collector without all seven blisters full is Stupefied with a value equal to the number of empty blisters."}, {"name": "Brain Loss", "type": "passive", "traits": [], "text": "If a brain collector takes 30 damage from a critical hit or takes 25 mental damage, it must succeed at a DC 29 save (DC 29 Fortitude for critical damage or DC 29 Will for mental damage) or one of its brain blisters is destroyed."}, {"name": "Brain Collector Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 29 Fortitude%rMaximum Duration 6 rounds%rStage 1 1d6 poison damage and Enfeebled 1 (1 round)%rStage 2 1d6 poison damage, enfeebled 1, and Slowed 1 (1 round)%rStage 3 2d6 poison damage, Enfeebled 2, and slowed 1 (1 round)"}, {"name": "Collect Brain", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The brain collector collects a brain of a creature that has been dead for no more than 1 minute. It can then use an Interact action to secure the brain in one of its empty brain blisters."}, {"name": "Explosive End", "type": "passive", "traits": [], "text": "The mutant brain collector's death reveals one last surprise as it explodes into radioactive ash. When it dies, it explodes, dealing 5d6 acid|options:area-damage damage to each creature in a 10-foot, with a DC 27 Reflex save."}, {"name": "Shifting Iridescence", "type": "passive", "traits": ["magical"], "text": "Whenever the mutant brain collector takes energy damage to which it isn't resistant or immune, after taking the damage normally, it gains resistance 10 to that damage type. If it had a resistance to a different damage type from shifting iridescence, it replaces the