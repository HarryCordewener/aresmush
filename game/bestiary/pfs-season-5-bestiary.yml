  actions: [{"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Three Headed", "type": "passive", "traits": [], "text": "Any ability that would sever one of the three-headed goat's heads (such as a critical hit with a vorpal weapon) severs one head at random. Losing a head doesn't kill the three-headed goat (as long as it has one head left), but it does prevent it from making Strikes with the lost head or using the head's Breath Weapon."}, {"name": "Triple Opportunity", "type": "passive", "traits": [], "text": "The three-headed goat eidolon gains 2 extra reactions each round that it can use only to make Attacks of Opportunity. It must use a different head for each reaction, and it can't use more than one on the same triggering action. If it loses one of its heads, it also loses one of these extra reactions."}, {"name": "Breath Weapon", "type": "action", "traits": ["arcane"], "cost": 2, "text": "The two-headed goat breathes a 20-foot that deals 3d6 damage to all creatures in the area (DC 18 basic save of a type indicated below).%rThe two-headed goat can't use either of its Breath Weapons again for 1d4 rounds.%rBoer Cone of 3d6 sonic|options:area-damage (DC 18 Will) Markhor Cone of 3d6 poison|options:area-damage (DC 18 Fortitude) Saanen Cone of 3d6 fire|options:area-damage (DC 18 Reflex)"}, {"name": "Elemental Bite", "type": "passive", "traits": [], "text": "Each head deals an extra 1d6 damage of a type matching the head's breath weapon."}, {"name": "Three-Headed Strike", "type": "action", "traits": [], "cost": 2, "text": "Frequency once per turn%rEffect The three-headed goat makes a Strike with each of its heads, each at a –2 penalty and targeting a different creature. These Strikes count as two attacks for the three-headed goat's multiple attack penalty, and the penalty doesn't increase until after it has made all three attacks"}]
