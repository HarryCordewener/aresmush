  actions: [{"name": "Hibernation", "type": "passive", "traits": [], "text": "After 3 or more days without eating, an akata can secrete resin that encases it in a noqual cocoon. The cocoon has Hardness 9, 40 HP, and a Broken Threshold of 18. It has resistance 5 to damage from magical sources. As long as the cocoon remains intact, the akata can't be harmed, and it doesn't need to eat or drink. While inside the cocoon, the akata gains Lifesense 30 feet. The akata remains in a state of hibernation until it is exposed to extreme heat or senses a living creature, at which…"}, {"name": "No Hearing", "type": "passive", "traits": ["auditory"], "text": "An akata has no auditory senses. It is immune to auditory effects, automatically critically fails Perception checks that require it to hear, and takes a -2 status penalty to Perception checks (but not initiative rolls) that involve sound but also rely on other senses."}, {"name": "Bark Shield", "type": "reaction", "traits": [], "text": "Trigger The busoborn akata takes damage that isn't fire%rEffect The akata hardens its body into a bark-like material at the point of impact and reduces the damage it takes by 5."}, {"name": "No Breath", "type": "passive", "traits": ["inhaled"], "text": "An akata doesn't breathe and is immune to effects that require breathing (such as an inhaled poison)."}, {"name": "Salt Water Vulnerability", "type": "passive", "traits": [], "text": "Salt water acts as an extremely strong acid to an akata. A splash of salt water deals 1d6 acid damage to an akata, and damaging salt water effects deal 1d6 additional damage. Full immersion in salt water deals 4d6 acid damage per round."}, {"name": "Grasping Tendrils", "type": "action", "traits": ["manipulate"], "cost": 2, "text": "The busoborn akata presses one of its tentacle vines to the ground and causes it to spread beneath creatures in a 15-foot in front of it. Until the end of its next turn, the area is difficult terrain to enemy creatures, and the akata gains a +2 circumstance bonus to attack rolls against targets within that area%rSpecial The akata can only use this ability if it has no more than one creature grabbed."}, {"name": "Pack Attack", "type": "passive", "traits": [], "text": "The busoborn akata's Strikes deal an additional 1d8 damage to creatures within reach of at least two of its allies."}, {"name": "Void Death", "type": "passive", "traits": ["disease"], "text": "An akata implants its parasitic larval young into any creature it bites, but only Medium or Small humanoids make suitable hosts; all other creatures are immune to this disease%rSaving Throw DC 17 Fortitude%rStage 1 carrier with no ill effect 1 (1 day)%rStage 2 Drained 1 (1 day)%rStage 3 as stage 2 (1 day)%rStage 4 drained 2 and Fatigued (1 day)%rStage 5 as stage 4 (1 day)%rStage 6 dead and corpse rises as a void zombie in 2d4 hours"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
