  actions: [{"name": "Guide's Warning", "type": "passive", "traits": [], "text": "When Vare is about to roll a Perception or Survival check to determine her initiative, she can alert her allies as a free action. Vare visually or audibly warns allies, granting them a +1 circumstance bonus to their initiative rolls. Depending on how Vare warns allies, this action has the auditory or visual trait.%rEffect: Guide's Warning"}, {"name": "Snare Crafting", "type": "passive", "traits": [], "text": "Vare can use the Crafting skill to create the following snares: alarm snare, hampering snare, irritating thorn snare, marking snare, signaling snare, and smoke screen snare. Vare can create four snares each day without paying for the materials, using 3 Interact actions to set up each snare."}, {"name": "Guiding Words", "type": "action", "traits": [], "cost": 1, "text": "Vare points out a weakness of a creature within 30 feet. Vare and all allies that can hear or see her gain a +1 status bonus to attack and damage rolls against that creature until the beginning of Vare's next turn. Vare adds an extra 1d6 precision damage to her weapon and unarmed attacks that hit that creature for the duration.%rEffect: Guiding Words"}]
