  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Freezing Blood", "type": "reaction", "traits": ["arcane", "cold"], "text": "Trigger An adjacent creature deals piercing or slashing damage to Venexus%rEffect Venexus's blood splatters onto the triggering creature, dealing 2d6 cold damage. A creature that takes cold damage in this way is Slowed 1 for 1 round."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 25 Will"}, {"name": "Mist Shroud", "type": "passive", "traits": ["arcane", "aura", "water"], "text": "10 feet. The Primordial Flame continually heats the cold emanating from Venexus's body, surrounding the dragon in a thin veil of fog. Creatures in the aura are Concealed, and other creatures are concealed to creatures in the area. Venexus's storm vision allows her to see through this concealment, however. If wind disperses the aura, it returns automatically at the start of Venexus's turn. The aura is suppressed in water."}, {"name": "Storm Vision", "type": "passive", "traits": [], "text": "Inclement weather doesn't impair Venexus's vision; she ignores Concealment from fog, mist, rain, and snowfall."}, {"name": "Breath Weapon", "type": "action", "traits": ["arcane", "cold"], "cost": 2, "text": "Venexus breathes a cloud of frost that deals 10d6 cold|options:area-damage damage in a 40-foot (DC 28 Reflex). She can't use Breath Weapon again for 1d4 rounds."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "Venexus makes two claw Strikes and one tail Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "When Venexus scores a critical hit with a Strike, she recharges her Breath Weapon."}, {"name": "Ice Climb 30 feet", "type": "passive", "traits": [], "text": "Venexus can climb on ice as though she had the listed climb Speed. She ignores difficult terrain and greater difficult terrain from ice and snow and doesn't risk falling when crossing ice."}, {"name": "Shape Ice", "type": "action", "traits": ["arcane", "water"], "cost": 2, "text": "Venexus magically reshapes a cube of ice or snow she touches, up to 10 feet across. Any creature standing atop the ice must succeed at a DC 15 Reflex save or Acrobatics check. On a failure, the creature falls Prone on the ice; on a critical failure, it falls off the ice entirely and is also prone."}, {"name": "Snuff", "type": "action", "traits": ["arcane", "water"], "cost": 1, "text": "Venexus releases a wave of sleet, which douses open flames within 30 feet. All non-magical fire is automatically extinguished. All creatures in the area suffering from persistent fire damage immediately attempt a DC 10 Flat to end the persistent damage. If Snuff overlaps with an ongoing fire effect, Snuff attempts to counteract the fire effect."}]
