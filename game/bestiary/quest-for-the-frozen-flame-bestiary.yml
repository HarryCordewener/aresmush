  actions: [{"name": "Summer Bound", "type": "passive", "traits": [], "text": "During the winter months, a summer hora can't take reactions, is Sickened 1, and can't reduce their sickened condition below 1."}, {"name": "Tied to the Land", "type": "passive", "traits": [], "text": "A summer hora queen is intrinsically tied to a specific region, such as a forest or hilly plain. For 3 months around the summer solstice, the environment is supernaturally resilient, allowing the queen to automatically attempt to counteract spells and rituals that would harm the environment, such as Blight, with a +27 counteract modifier and a counteract rank of 7. For the 3 months around the winter solstice, however, her warded region becomes twisted or unhealthy unless a winter hora queen is…"}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Nymph's Beauty", "type": "passive", "traits": ["aura", "emotion", "mental", "primal", "visual"], "text": "30 feet. Creatures that start their turn in the aura must succeed at a DC 30 Will save or suffer an effect described in the nymph queen's entry.%rOn a failed save, the creature is Dazzled and Off-Guard for 1 minute."}, {"name": "Change Shape", "type": "action", "traits": ["polymorph", "primal"], "cost": 1, "text": "Nymph queens can transform between their original form, which looks much like a typical nymph of their kind, and any Small or Medium humanoid form, typically choosing a more humanoid-looking version of their natural form."}, {"name": "Focus Beauty", "type": "action", "traits": ["emotion", "incapacitation", "mental", "primal", "visual"], "cost": 1, "text": "The hora queen focuses her beauty upon a target within her aura. The creature must attempt a Will save. On a failure, it is affected as if by the hora queen's nymph's beauty aura; if it was already affected by the aura, it's Blinded until its sight is restored via restore senses or similar effect, or until the hora queen chooses to remove the effect using a single action, which has the concentrate trait. A hora queen can Focus Beauty on a given creature only once per turn."}, {"name": "Inspiration", "type": "action", "traits": ["emotion", "mental", "primal"], "cost": 3, "text": "A nymph queen can inspire a single intelligent creature by giving that creature a token of her favor, typically a lock of her hair. As long as the creature carries her token and remains in good standing with the nymph queen, the creature gains a +1 status bonus to all Crafting checks, Performance checks, and Will saves.%rIf a nymph queen grants her Inspiration to a bard and the nymph queen is that bard's muse, the bard gains an additional benefit depending on their muse theme: for lore muse,…"}, {"name": "Summer's Salvation", "type": "reaction", "traits": [], "text": "Trigger The summer hora or an ally within 30 feet that the summer hora can see fails a Perception check, saving throw, attack roll, or skill check.%rEffect If it's the month of the summer solstice, the hora's or ally's check retroactively gains a +4 status bonus, which can change the outcome from a critical failure to a failure or a failure to a success. If it's the month before or after the summer solstice, the check gains a retroactive +2 status bonus instead. In the other months except…"}]
