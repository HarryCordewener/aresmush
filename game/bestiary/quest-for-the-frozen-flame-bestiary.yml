ncreases its slowed value by 1 (Slowed 2 on a failed save, slowed 3 on a critical failure)."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Calcifda's spellcasting action, she attempts a DC 15 Flat. On a success, the action isn't disrupted."}]
