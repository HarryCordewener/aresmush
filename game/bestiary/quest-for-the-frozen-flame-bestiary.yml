  actions: [{"name": "Summer Bound", "type": "passive", "traits": [], "text": "During the winter months, a summer hora can't take reactions, is Sickened 1, and can't reduce their sickened condition below 1."}, {"name": "Solstice Dependent", "type": "passive", "traits": [], "text": "An hora is mystically bonded to a natural location with a simple astronomical calendar that marks the summer and winter solstice. If they aren't at that location at dawn when the sunlight touches the calendar, they become Drained 1, increasing the value by 1 for each missed day and reducing by 1 only when they witness dawn's light touch the calendar. Even on a cloudy day, there's enough sunlight to satisfy the hora's need. An hora can perform a 24-hour ritual to bond to a new location."}, {"name": "Summer's Salvation", "type": "reaction", "traits": [], "text": "Trigger The summer hora or an ally within 30 feet that the summer hora can see fails a Perception check or saving throw%rEffect If it's the month of the summer solstice, the hora's or ally's check retroactively gains a +4 status bonus, which can change the outcome from a critical failure to a failure or a failure to a success. If it's the month before or after the summer solstice, the check gains a retroactive +2 status bonus instead. In the other months except during the three winter solstice…"}]
