ssence.%rThe kiss makes the creature Drained 1 or increases its drained value by 1, to a maximum of 4. The creature takes 3d6 void damage and the succubus regains Hit Points equal to the damage dealt. The target must succeed at a DC 26 Will save or be affected by a Suggestion to submit to more actions of passion rather than trying to Escape."}, {"name": "Profane Gift", "type": "action", "traits": ["divine", "mental"], "cost": 3, "text": "Frequency once per day%rEffect The succubus gives a willing humanoid a profane gift. That creature gains a +1 status bonus to attack rolls, skill checks, and saving throws. As long as the gift persists, the succubus can communicate telepathically with the target at any distance, see through the creature's senses, and target the creature with suggestion through the telepathic link. In addition, the creature uses an outcome one degree of success worse than it rolls on saving throws against the…"}]
