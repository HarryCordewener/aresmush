emporary Hit Points. Drinking Blood from a creature that's already drained doesn't restore…"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The Heartwood Rots deals 1d6 extra precision damage to Off-Guard creatures."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
