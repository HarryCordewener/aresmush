  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Counterspell", "type": "reaction", "traits": [], "text": "Trigger A creature casts a spell Penumbra has prepared%rEffect Penumbra expends a prepared spell to counter the triggering creature's casting of that same spell. She loses her spell slot as if she had cast the triggering spell. She then attempts to counteract the triggering spell."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "60 feet. DC 27 Will"}, {"name": "Mythic Resilience (Reflex and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When a lich is destroyed, its soul immediately transfers to their Lich Soul Cage . A lich can be permanently destroyed only if their soul cage is found and destroyed."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Void Shroud", "type": "passive", "traits": ["aura", "death"], "text": "30 feet. Penumbra is surrounded by an aura of death, drawing forth souls to be consumed by her constant hunger. Living creatures in the emanation take a –2 status penalty to saves against fear and death effects. In addition, any creature that starts its turn in the area gains the Doomed 1 condition unless it succeeds at a DC 30 Will save."}, {"name": "Condition Removal", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Penumbra ends one condition currently affecting her."}, {"name": "Drain Soul Cage", "type": "free", "traits": [], "text": "Frequency once per day%rEffect Penumbra taps into her soul cage's power to cast any arcane spell up to the highest rank the lich can cast, even if the spell being cast is not one of the lich's prepared spells. The lich's soul cage doesn't need to be present for the lich to use this ability."}, {"name": "Siphon Life", "type": "passive", "traits": [], "text": "A lich's form draws forth life from those who come into contact with it. When the lich damages a living creature with an unarmed attack, the lich gains 5 temporary Hit Points and the creature must succeed at a Fortitude save against the lich's spell DC – 2 or become Drained 1. If Penumbra is Grabbed or Restrained at the start of its turn, each creature grabbing or restraining it must succeed at a Fortitude save or become drained 1. If the lich siphons a creature's life again, the drained value…"}, {"name": "Spell Recharge", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Penumbra immediately gains an additional use of a spell she has already cast."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Penumbra's spellcasting action, she attempts a DC 15 Flat. On a success, the action isn't disrupted."}]
  spellcasting: [{"name": "Arcane Prepared Spells", "tradition": "arcane", "type": "prepared", "dc": 34, "attack": 24, "spells": {"0": ["Detect Magic", "Frostbite", "Message", "Shield", "Telekinetic Hand"], "1": ["Enfeeble", "Fleet Step", "Force Barrage", "Sure Strike"], "2": ["Blur", "Dispel Magic", "False Vitality", "Resist Energy", "See the Unseen"], "3": ["Earthbind", "Locate", "Vampiric Feast"], "4": ["Fire Shield", "Flicker", "Fly", "Translocate"], "5": ["Shadow Blast", "Slither", "Wall of Ice"], "6": ["Disintegrate", "Dominate", "Vampiric Exsanguination"]}}]
