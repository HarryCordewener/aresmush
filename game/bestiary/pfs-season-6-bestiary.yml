  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Rotten Burst", "type": "passive", "traits": ["healing", "void"], "text": "When a leshy ghoul dies, a burst of twisted primal void energy explodes from its body, restoring 2d8 Hit Points to each undead fungi or plant creature in a 30-foot emanation and killing all natural plants, though merely causing discomfort to creatures with the plant trait. This area is filled with rotten vegetation, becoming difficult terrain."}, {"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "10 feet. DC 17 Fortitude"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "The leshy ghoul transforms into a Small giant mushroom or patch of fungi. This ability otherwise uses the effects of One with Plants."}, {"name": "Consume Flesh", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The ghoul is adjacent to the corpse of a creature that died within the last hour%rEffect The ghoul devours a chunk of the corpse and regains 3d6 healing Hit Points."}, {"name": "Forbidden Cravings", "type": "passive", "traits": ["curse"], "text": "A creature can still eat and drink while sickened by this curse%rSaving Throw DC 20 Will%rStage 1 carrier with no ill effects (1 day)%rStage 2 2d6 void|immutable damage and the target is Sickened 1 until it consumes raw meat (1 day)%rStage 3 as stage 2%rStage 4 as stage 2 unless the target has consumed raw meat in the past 24 hours, then it takes 4d6 void damage and is Sickened 2 until it consumes raw meat%rStage 5 if the creature has eaten raw meat in the past 24 hours, it dies and rises as a…"}, {"name": "Ghoul Whispers", "type": "action", "traits": ["auditory", "linguistic", "occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, or Unconscious creature is within the ghoul's reach%rEffect The ghoul whispers dark thoughts and vile cravings into the creature's ears. The creature must save against the forbidden cravings curse."}, {"name": "Grave Knowledge", "type": "passive", "traits": ["occult"], "text": "Frequency once per hour%rEffect The ghoul calls upon knowledge it retains from one creature it has consumed in the past 7 days. The ghoul attempts a skill check using a skill in which the consumed creature was trained (if it's unclear whether the creature was trained, the GM decides). The ghoul is treated as trained and uses the high skill modifier for the ghoul's level. This takes the same amount of actions or time as usual for the check.%rThe ghoul can instead automatically learn something…"}, {"name": "Spore Cloud", "type": "action", "traits": [], "cost": 2, "text": "A leshy ghoul can unleash a cloud of spores that irritates the eyes and throats of non-fungus creatures in a 15-foot emanation. Each creature must succeed at a DC 17 Fortitude save or take 1 persistent poison|options:area-damage damage. A creature has its vision reduced as long as the persistent damage continues and can see only within 20 feet."}, {"name": "Spores", "type": "passive", "traits": [], "text": "A creature that takes damage from a fungus leshy's spore pod Strike must attempt a saving throw with the same DC and effect as its Spore Cloud ability."}, {"name": "Swift Leap", "type": "action", "traits": ["move"], "cost": 1, "text": "The ghoul jumps up to half its Speed. This movement doesn't trigger reactions."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Primal Innate Spells", "tradition": "primal", "type": "innate", "dc": 17, "attack": 9, "spells": {"3": ["Speak with Plants (Constant, Fungi Only)"]}}]
