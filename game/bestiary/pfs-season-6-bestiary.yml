  strikes: [{"name": "Claw", "bonus": 14, "damage": [["1d8+8", "slashing", null]], "traits": ["agile", "unarmed"], "effects": ["Grab"]}, {"name": "Chain Sword", "bonus": 17, "damage": [["1d6+11", "slashing", null]], "traits": ["magical", "reach-10"]}]
  actions: [{"name": "Children of the Night", "type": "passive", "traits": ["divine", "mental"], "text": "Lenore's presence brings forth creatures of the night to do their master's bidding. These typically include rat swarms, bat swarms, and wolves but can include other creatures. Lenore can give telepathic orders to these creatures as long as they're within 100 feet, but they can't communicate back."}, {"name": "Fast Healing 7", "type": "passive", "traits": []}, {"name": "Chain Attacks", "type": "passive", "traits": [], "text": "Lenore gains a +1 circumstance bonus to attack rolls with her +1 chain sword if she has already attempted to attack a different target this turn using this weapon."}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Mist Escape", "type": "free", "traits": [], "text": "Trigger Lenore is reduced to 0 HP%rEffect The vampire uses Turn to Mist. They can take move actions to move toward their coffin even though they're at 0 HP. While at 0 HP in this form, the vampire is unaffected by further damage. They automatically return to their corporeal form, Unconscious, if they reach their coffin or after 2 hours, whichever comes first."}, {"name": "Vampire Vulnerabilities", "type": "passive", "traits": [], "text": "All vampires possess the following vulnerabilities.%rCompulsions Vampires are creatures with strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless they're transported while they hide within their coffin, nor can they enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions—a pirate vampire might not be able to set foot on solid ground without being invited, for…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The vampire transforms into one of its animal forms or back into its normal form. Most vampires can turn into a bat, but some can turn into a different creature, such as a rat or a wolf.%rGiant Bat Senses echolocation 40 feet, Speed 20 feet, fly 30 feet, Melee fangs +15 Damage 1d8+9 piercing"}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "Lenore can cast Dominate at will as a divine innate spell (DC 22). Casting it requires staring into the target's eyes, giving the spell the visual trait. Fully destroying Lenore ends the domination, but merely reducing her to 0 HP is insufficient to break the spell."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within Lenore's reach%rEffect Lenore sinks her fangs into that creature to drink their blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Drained 1 and Lenore regains 10 HP. Drinking Blood from a creature that's already drained doesn't restore any HP to Lenore but increases the victim's drained value by…"}, {"name": "Turn to Mist", "type": "action", "traits": ["air", "concentrate", "divine", "polymorph"], "cost": 1, "text": "Lenore turns into a cloud of vapor, as the Vapor Form spell, or back to her normal form. She loses fast healing while turned to mist. She can remain in this form indefinitely."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 22, "attack": 14, "spells": {"6": ["Dominate (At Will) (See Dominate)"]}}]
