  actions: [{"name": "Armored Apotheosis", "type": "passive", "traits": [], "text": "When it is first encountered, the oozeshard is in a lumpy, vaguely spherical ooze form. When it takes damage from any weapon attack, it suddenly reshapes, taking a form almost identical to the dead deity Gorum. The ooze hardens into armored plates (increasing its AC by +8) and its pseudopod transforms into a massive, acid-dripping greatsword. While in this form, it loses its pseudopod attack and its immunity to bludgeoning and precision damage. It cannot use its constrict or engulf abilities,…"}, {"name": "Reactive Strike (Armored Apotheosis Only)", "type": "reaction", "traits": []}, {"name": "Constrict (Ooze Form Only)", "type": "action", "traits": [], "cost": 1, "text": "(1d8+7) bludgeoning,1d10 acid, DC 27 Fortitude"}, {"name": "Engulf (Ooze Form Only)", "type": "action", "traits": [], "cost": 2, "text": "DC 23 Reflex, 2d8 acid damage, escape dc=23, Rupture 20"}, {"name": "Gorumite Echoes", "type": "passive", "traits": [], "text": "While in its armored apotheosis form, the oozeshard deals an additional 1d6 bleed damage and makes the target Off-Guard for 1 round when it critically hits with its greatsword."}, {"name": "Spawn Oozeshardling Node", "type": "free", "traits": [], "text": "Whenever the oozeshard takes 45 or more damage from a single attack, it spawns an oozeshardling node in an adjacent square. The oozeshardling node's electric pulse reaction immediately activates, and then the oozeshardling node enters initiative at the bottom of the current initiative count."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
