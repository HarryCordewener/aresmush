  actions: [{"name": "Telepathy (100 feet)", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Bravado Aversion", "type": "passive", "traits": [], "text": "A gargarthezul can't stand to be shown up. The first time each round a creature successfully Demoralizes, Shoves, or Trips a gargarthezul, it takes 1d6 mental damage."}, {"name": "Bully", "type": "action", "traits": [], "cost": 2, "text": "The gargarthezul Shoves a creature, and Strides after it into the nearest adjacent square if successful. It then makes a tentacle Strike against the creature, using the same multiple attack penalty."}, {"name": "Halyard Swing", "type": "action", "traits": [], "cost": 2, "text": "Requirements The gargarthezul is on the deck of a ship.%rEffect The gargarthezul swings from a nearby rope, moving up to twice its Speed and ignoring any terrain or lack of surface beneath it. It can make a tentacle Strike at any point during this movement."}, {"name": "Mark of Avarice", "type": "action", "traits": [], "cost": 1, "text": "Requirements The gargarthezul's last action was a successful tentacle Strike.%rEffect The gargarthezul places a brand on the creature it hit that fills the creature's mind with overwhelming urges towards piracy. The creature doesn't treat anyone as their ally and can't Delay or Ready. They must use all of their actions to attempt to Disarm, or Demoralize, targeting a creature randomly determined by the GM (they may use actions to facilitate their attempts, such as to move to the target or to…"}, {"name": "Vicious Bluster", "type": "passive", "traits": [], "text": "When a gargarthezul successfully Demoralizes a foe, it gains 1d6 temporary Hit Points (2d6 on a critical success) that last for 1 minute.%rEffect: Vicious Bluster%rEffect: Vicious Bluster (Critical Success)"}]
