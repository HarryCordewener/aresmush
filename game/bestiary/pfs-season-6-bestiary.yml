e ghoul whispers dark thoughts and vile cravings into the creature's ears. The creature must save against the forbidden cravings curse."}, {"name": "Grave Knowledge", "type": "passive", "traits": ["occult"], "text": "Frequency once per hour%rEffect The ghoul calls upon knowledge it retains from one creature it has consumed in the past 7 days. The ghoul attempts a skill check using a skill in which the consumed creature was trained (if it's unclear whether the creature was trained, the GM decides). The ghoul is treated as trained and uses the high skill modifier for the ghoul's level. This takes the same amount of actions or time as usual for the check.%rThe ghoul can instead automatically learn something…"}, {"name": "Spore Cloud", "type": "action", "traits": [], "cost": 2, "text": "A leshy ghoul can unleash a cloud of spores that irritates the eyes and throats of non-fungus creatures in a 15-foot emanation. Each creature must succeed at a DC 19 Fortitude save or take 1 persistent poison|options:area-damage damage. A creature has its vision reduced as long as the persistent damage continues and can see only within 20 feet."}, {"name": "Spores", "type": "passive", "traits": [], "text": "A creature that takes damage from a fungus leshy's spore pod Strike must attempt a saving throw with the same DC and effect as its Spore Cloud ability."}, {"name": "Swift Leap", "type": "action", "traits": ["move"], "cost": 1, "text": "The ghoul jumps up to half its Speed. This movement doesn't trigger reactions."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
