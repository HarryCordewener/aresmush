  actions: [{"name": "Web Sense", "type": "passive", "traits": [], "text": "The goliath spider has imprecise tremorsense to detect the vibrations of creatures touching its web."}, {"name": "Spring Upon Prey", "type": "reaction", "traits": [], "text": "Requirements Initiative has not yet been rolled.%rTrigger A creature touches the goliath spider's web while the spider is on it.%rEffect The goliath spider automatically notices the creature and Strides, Climbs, or Descends on a Web before it rolls initiative."}, {"name": "Descend on a Web", "type": "action", "traits": ["move"], "cost": 1, "text": "The goliath spider moves straight down up to 120 feet, suspended by a web line. It can hang from the web or drop off. The distance it Descends on a Web doesn't count for falling damage.%rA creature that successfully Strikes the web (AC 20, Hardness 5, 20 HP) severs it, causing the spider to fall."}, {"name": "Goliath Spider Venom", "type": "passive", "traits": ["incapacitation", "poison"], "text": "Saving Throw DC 30 Fortitude%rMaximum Duration 6 rounds%rStage 1 3d6 poison damage and Slowed 1 (1 round)%rStage 2 3d8 poison damage and Slowed 2 (1 round)%rStage 3 3d10 poison damage and Paralyzed for 2d4 hours"}, {"name": "Hazard Immunity", "type": "passive", "traits": [], "text": "The shadowpact goliath spider never triggers the reactions of hazards in its own lair and is immune to the negative consequences of damaging area effects created by hazards in its lair (so if a PC set off a hazard that released a Fireball inside its lair, it would not take damage from the fireball even if it was within the fireball's area)."}, {"name": "Web Tether", "type": "passive", "traits": [], "text": "A creature hit by the spider's web Strike is Restrained and tethered to the spider, preventing it from moving farther away from the spider.%rThe spider can have one creature tethered at a time. The DC to Escape or Force Open the web is 30. The tether can be severed with a Strike (AC 20, Hardness 5,