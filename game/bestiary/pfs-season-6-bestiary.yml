rust. When the levaloch is destroyed, any tridents or barbed nets they created crumble to rust."}, {"name": "Merciless Thrust", "type": "passive", "traits": [], "text": "When a levaloch hits a creature that has the Clumsy, Enfeebled, Immobilized, or Restrained conditions with a melee trident Strike, the Strike deals an additional 2d6 damage."}]
