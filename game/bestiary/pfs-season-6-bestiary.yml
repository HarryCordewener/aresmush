  actions: [{"name": "Armored Apotheosis", "type": "passive", "traits": [], "text": "When it is first encountered, the divine oozeshard is in a lumpy, vaguely spherical ooze form. When it takes damage from any weapon attack, it suddenly reshapes, taking a form almost identical to the dead deity Gorum. The ooze hardens into armored plates (increasing its AC by +8) and its pseudopod transforms into a massive, acid-dripping greatsword. While in this form, it loses its pseudopod attack and its immunity to bludgeoning and precision damage. It cannot use its constrict or engulf…"}, {"name": "Reactive Strike (Armored Apotheosis Only)", "type": "reaction", "traits": []}, {"name": "Constrict (Ooze Form Only)", "type": "action", "traits": [], "cost": 1, "text": "(1d8+10) bludgeoning,1d12 acid, DC 29 Fortitude"}, {"name": "Engulf (Ooze Form Only)", "type": "action", "traits": [], "cost": 2, "text": "DC 25 Reflex, 3d8 acid damage, escape dc=25, Rupture 22"}, {"name": "Gorumite Echoes", "type": "passive", "traits": [], "text": "While in its armored apotheosis form, the divine oozeshard deals an additional 1d8 bleed damage and makes the target Off-Guard for 1 round whenever it critically hits with its greatsword."}, {"name": "Spawn Oozeshardling Node", "type": "free", "traits": [], "text": "Whenever the divine oozeshard takes 55 or more damage from a single attack, it spawns a sparking oozeshardling node in an adjacent square. The sparking oozeshardling node's electric pulse reaction immediately activates and then the sparking oozeshardling node enters initiative at the bottom of the current initiative count."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
