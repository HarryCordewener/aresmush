  actions: [{"name": "Telepathy 120 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Insect Empathy", "type": "passive", "traits": ["primal"], "text": "The wereant can communicate with insects."}, {"name": "Gnawing Retort", "type": "reaction", "traits": [], "text": "Trigger A creature adjacent to the wereant critically misses the wereant with a melee Strike%rEffect The wereant makes a mandibles Strike against the triggering creature."}, {"name": "Hive Mind", "type": "passive", "traits": ["primal"], "text": "Wereants operate with a shared hive intelligence. While within telepathic range of at least one other wereant, a wereant disciple gains a +2 circumstance bonus to initiative checks, Perception checks, and saving throws against mental effects. If one wereant is aware of a combatant, all members of the hive mind within telepathic range are aware of it."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "The wereant changes into their humanoid, hybrid, or animal shape. Each shape has a specific, persistent appearance. A true wereant's natural form is their hybrid shape. In humanoid shape, they use their original humanoid size, lose their jaws and claw Strikes, and gain a melee fist Strike that deals bludgeoning damage equal to the slashing damage dealt by their mandibles. In animal shape, they take the form of a Medium giant ant, gain a climb Speed of 20 feet, gain Grab on their mandibles…"}, {"name": "Curse of the Wereant", "type": "passive", "traits": ["curse", "primal"], "text": "This curse affects only humanoids%rSaving Throw DC 34 Fortitude.%rOn each full moon, the cursed creature must succeed at another Fortitude save or turn into a wereant until dawn.%rThe creature is under the GM's control and goes on a rampage for half the night before falling Unconscious until dawn."}, {"name": "Flying Leap", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect The wereant disciple Flies and makes two Strikes against different targets at any point during that movement. These Strikes deal an additional 2d6 precision damage if the disciple is above the target. If the wereant began this action Hidden, they remain hidden until after this ability's Strikes. Both attacks count toward the disciple's multiple attack penalty, but the penalty doesn't increase until after both Strikes."}, {"name": "Moon Frenzy", "type": "passive", "traits": ["polymorph", "primal"], "text": "When a full moon appears in the night sky, the wereant must enter hybrid form, can't Change Shape thereafter, becomes one size larger, increases its reach by 5 feet, and increases the damage of their mandibles Strike by 2.%rWhen the moon sets or the sun rises, the werecreature returns to humanoid form and is Fatigued for 2d4 hours.%rEffect: Moon Frenzy"}, {"name": "Staggering Blow", "type": "passive", "traits": [], "text": "A creature damaged by the wereant disciple's carapace fist Strike must succeed at a DC 35 Fortitude save or become Stunned 1 (Stunned 2 on a critical failure). If the Strike is a critical hit, a creature that fails the save is also Paralyzed for 1 round."}]
