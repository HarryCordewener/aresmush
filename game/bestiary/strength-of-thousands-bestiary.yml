wallow Whole."}, {"name": "Rock Tunneler", "type": "passive", "traits": [], "text": "The Aspect of Hunger can burrow through solid stone at a Speed of 20 feet. It can leave a tunnel if it desires, and it usually does."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Huge, 3d10+10 bludgeoning damage plus 2d6 mental damage, Rupture 36"}, {"name": "Thrash", "type": "action", "traits": [], "cost": 2, "text": "The Aspect of Hunger makes a Strike once against each creature in its reach. It can Strike up to once with its jaws, up to once with its stinger, and any number of times with its body. Each attack counts toward the Aspect of Hunger's multiple attack penalty, but the multiple attack penalty doesn't increase until after it makes all the attacks."}, {"name": "Improved Grab", "type": "free", "traits": []}]
