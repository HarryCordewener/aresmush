 critical failure). A creature slain by Shadow Snip…"}, {"name": "Shift Fate", "type": "reaction", "traits": ["occult"], "text": "Trigger A creature within 120 feet attempts a saving throw%rEffect The creature rolls the save twice, and then Tatterthread decides which result applies. If she chooses the lower roll, this is a misfortune effect; if she chooses the higher roll, it's a fortune effect; if they're the same, she decides which trait to apply."}]
