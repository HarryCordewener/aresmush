ne or occult spell that causes damage."}, {"name": "Stupefying Touch", "type": "passive", "traits": ["curse", "primal"], "text": "A creature damaged by a mageslayer's claw Strike must succeed at a DC 37 Will save. The creature becomes Stupefied 2 for 1 round on a failure. On a critical failure, the creature is stupefied 2 for 1 hour."}]
