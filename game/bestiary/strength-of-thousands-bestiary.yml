  actions: [{"name": "Form Up", "type": "action", "traits": [], "cost": 1}, {"name": "Death Throes", "type": "passive", "traits": [], "text": "As the garrison's numbers dwindle, gold defenders melt away into worthless slag. Every time that the garrison is reduced to a threshold, it leaves behind a 10-foot radius cloud of fumes and a 10-foot radius puddle of molten metal. Creatures that breathe fumes are exposed to gold defender poison. Creatures that move through the puddle take 10d6 fire|options:area-damage damage. The fumes dissipate after 1 round and the puddle completely evaporates after 1 minute."}, {"name": "Golem Antimagic", "type": "passive", "traits": [], "text": "Harmed by cold (2d8 untyped from areas or persistent damage); healed by fire (area 2d8 healing HP); slowed by acid"}, {"name": "Troop Defenses", "type": "passive", "traits": []}, {"name": "Gold Defender Poison", "type": "passive", "traits": ["poison"], "text": "Any Drained value from this poison is reduced by 1 every hour%rSaving Throw DC 33 Fortitude%rMaximum Duration 4 rounds%rStage 1 2d6 poison and Drained 1 (1 round)%rStage 2 4d6 poison and Drained 2 (1 round)%rStage 3 8d6 poison and Drained 3 (1 round)."}, {"name": "Golden Strike", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The garrison makes a melee attack against each enemy in a 5-foot (DC 30 Reflex save). The damage depends on the number of actions.%r1 (2d8+2) bludgeoning|options:area-damage damage%r2 (3d8+12) bludgeoning|options:area-damage damage%r3 (4d8+15) bludgeoning|options:area-damage damage"}, {"name": "Light Reflection", "type": "action", "traits": ["primal"], "cost": 2, "text": "Requirements The gold defender garrison is not in darkness%rEffect The gold defender garrison reshapes its skin into a reflective surface that magnifies ambient light into a precise beam that burns all creatures in a 30-foot, dealing 14d6 fire|options:area-damage damage (DC 31 Reflex save if the gold defender is in dim light, DC 33 Reflex save if it's in bright light). The size of the cone reduces to a 15-foot when the garrison is reduced to 8 or fewer squares. It can't use Light Reflection…"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever the garrison Strides, it first Forms Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then moves up to its Speed. This works just like a Gargantuan creature moving; for instance, if any square enters difficult terrain, the extra movement cost applies to the whole troop."}]
