  actions: [{"name": "Tremorsense (imprecise) 120 feet", "type": "passive", "traits": []}, {"name": "Telepathy 300 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Regeneration 30 (Deactivated by Fire)", "type": "passive", "traits": []}, {"name": "Aura of Growth", "type": "passive", "traits": ["aura", "plant", "primal"], "text": "120 feet. Plants near Dimari-Diji grow larger and more vibrant. Plants in the emanation gain the success effects of the Plant Growth ritual. Any plant spells cast in the area are empowered and use the effects of the spell 1 rank higher than it was cast, to a maximum of 9th rank (Dimari-Diji's spells are unaffected). Finally, other plant creatures gain fast healing 20 while in the area.%rEffect: Aura of Growth"}, {"name": "Axe Vulnerability", "type": "passive", "traits": [], "text": "An arboreal nature-speaker takes 20 additional damage from axes."}, {"name": "Enriching Aura", "type": "passive", "traits": ["aura"], "text": "60 feet. Dimari-Diji's natural power enhances primal spellcasting around him. All creatures within the emanation can alter a primal spell as if they had just used Reach Spell or Widen Spell when they Cast the Spell."}, {"name": "Fungus Sight", "type": "passive", "traits": ["primal"], "text": "Dimari-Diji produces small clumps of fungus that he can use to see beyond his normal sight. He can use a single action, which has the concentrate trait, to project his senses into an intact fungus clump on the Material Plane or to end this projection. Dimari-Diji loses all sensory information from his own body while projecting his senses into fungus."}, {"name": "Forest Growth", "type": "passive", "traits": [], "text": "Once per month, Dimari-Diji can spend 1 hour to sprout a new forest. He causes the forest to sprout in a 50-foot within 300 feet. The forest instantly springs to life, and is composed of fungi, plants, and trees most appropriate to the area he selected. The forest grows to the height, density, and liveliness of a forest that has grown for 10 years. The forest doesn't feature any animals or other creatures, but animals within 1 mile are aware of the new forest and might make the forest their new…"}, {"name": "Memories of Ages", "type": "passive", "traits": [], "text": "Dimari-Diji's mental blasts cloud the minds of his foes, making it difficult for them to focus on combat. A creature that takes damage from Dimari-Diji's mental blast is Dazzled for 1 round. If the attack was a critical hit, the creature is dazzled for 1 minute instead."}, {"name": "Memory Maelstrom", "type": "action", "traits": ["concentrate", "incapacitation", "mental", "nonlethal", "primal"], "cost": 3, "text": "Dimari - Diji tries to overwhelm foes with a surge of information he has absorbed over his long life. This surge deals 12d6 mental|options:area-damage damage to each enemy within 60 feet, who must attempt a DC 32 Will save.%rCritical Success The creature maintains its composure, takes no damage, and is temporarily immune to Memory Maelstrom for 1 minute.%rSuccess The creature is Stunned 1 and takes half damage.%rFailure The creature takes full damage and is Stunned 3.%rCritical Failure The…"}, {"name": "Nature's Concentration", "type": "free", "traits": [], "text": "Trigger Dimari-Diji's turn begins%rEffect Dimari-Diji calls upon the natural world around him to support his magic. He Sustains a Spell."}, {"name": "Improved Knockdown", "type": "free", "traits": []}]
