and its armor takes damage as if hit by the golem's staff."}, {"name": "Self-Repair", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The golem repairs itself, regaining 30 healing Hit Points."}, {"name": "Vent Splinters", "type": "action", "traits": ["arcane", "fire"], "cost": 1, "text": "The golem vents a 30-foot of fiery splinters from its internal forge. This deals 13d6 piercing|options:area-damage damage to all creatures in the cone (DC 38 Reflex). Creatures who fail the save also take 2d6 persistent fire damage (4d6 persistent fire damage on a critical failure). The golem can't use Vent Splinters again for 1d4 rounds."}]
