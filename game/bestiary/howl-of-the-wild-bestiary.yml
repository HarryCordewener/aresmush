her creatures in that burst must succeed at a DC 44 Fortitude save or be Fatigued by the sudden altitude shift. The warden then flies straight downward to the center of the pillar's peak, driving her horns into the stone. As she lands, the newly formed mountains…"}, {"name": "Song of the Skies", "type": "action", "traits": ["air", "auditory", "primal"], "cost": 1, "text": "The warden trills a cheerful birdsong, granting a boon to all allies within 60 feet and evoking the freedom of flight. For the next minute, affected allies gain Unfettered Movement, a fly speed of 60 feet, and treat creatures on the ground as Off-Guard when they are airborne.%rEffect: Song of the Skies"}, {"name": "Tempest Downdrafts", "type": "free", "traits": ["air", "primal"], "text": "Trigger The warden Flies%rEffects The warden's flapping wings generate powerful gusts that blow smaller creatures off course. A 60-foot, centered on the warden, fills with lightning-pierced winds until the beginning of the warden's next turn. Creatures must succeed at a DC 42 Reflex save to take any move action within the winds; flying creatures use the outcome one degree of success worse than what they roll. Creatures who critically fail are blown 30 feet away from the warden, knocked Prone,…"}]
