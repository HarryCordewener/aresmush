  actions: [{"name": "Wild Empathy", "type": "passive", "traits": [], "text": "The alicorn has an empathic connection to the creatures of the natural world that. The alicorn can use Diplomacy to make-an-impression on animals and to make very simple Requests of them."}, {"name": "At-Will Spells", "type": "passive", "traits": []}, {"name": "Draw in Magic", "type": "reaction", "traits": ["arcane", "concentrate"], "text": "Trigger A creature within 30 feet of the alicorn Casts a Spell%rEffect The alicorn attempts to counteract the triggering spell (counteract modifier +28, counteract rank 8th). If successful, the alicorn can choose to gain the effects of the triggering spell as its sole target."}, {"name": "Aerial Attack", "type": "action", "traits": [], "cost": 2, "text": "The alicorn Flies and Strikes twice with their wings at any points during their movement. Each attack counts toward the alicorn's multiple attack penalty, but the penalty doesn't increase until after they make all the attacks."}, {"name": "Beam of Light", "type": "action", "traits": ["arcane", "concentrate", "fire", "holy", "light"], "cost": 2, "text": "The alicorn harnesses a powerful burning ray of light from their horn. Creatures in a 120-foot take 16d6 fire|options:area-damage damage (DC 36 Fortitude save). An unholy creature in the area takes an additional 8d6 spirit|options:area-damage damage. If the light passes through an area of magical darkness or targets a creature affected by magical darkness, the beam attempts to counteract the darkness (counteract modifier +28, counteract rank 8th). The alicorn can't use its Beam of Light again…"}, {"name": "Ghost Touch", "type": "passive", "traits": [], "text": "An alicorn's Strikes have the effects of a ghost touch property rune."}]
