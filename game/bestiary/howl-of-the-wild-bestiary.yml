  actions: [{"name": "Steal Voice", "type": "action", "traits": ["auditory"], "cost": 2, "text": "Requirements An enemy creature has spoken since the crying cicada's last turn%rEffect The crying cicada learns and mimics the sound of its opponent's voice. It can't make new sentences, but it can choose to repeat select parts of the phrases it has heard. All non-cicada creatures within 30 feet, other than the owner of the stolen voice, must succeed at a DC 19 Will save to disbelieve the mimicry."}, {"name": "Wings Flat", "type": "passive", "traits": [], "text": "When the crying cicada is still and perched on a tree, it blends seamlessly into the environment. It has an automatic result of 30 on Deception checks and DCs to pass as part of the tree."}, {"name": "Crying Cicada Poison", "type": "passive", "traits": ["inhaled", "poison"], "text": "Saving Throw DC 19 Fortitude%rMaximum Duration 6 rounds%rStage 1 1d6 poison damage plus Slowed 1 (1 round)%rStage 2 1d6 poison damage plus Slowed 2 (1 round)%rStage 3 2d6 poison damage plus slowed 2 and Stupefied 1 (1 round)."}, {"name": "Sob", "type": "action", "traits": ["auditory", "emotion", "mental"], "cost": 1, "text": "The crying cicada mimics the noise of a wounded animal or crying child. Non-cicada creatures within a 150-foot must attempt a DC 19 Will save or be distressed by the pleas for help. The effect lasts for 1 round, but if the cicada uses this ability again on subsequent rounds, it extends the duration by 1 round for all affected creatures. Once a creature succeeds at any save against Sob, that creature is temporarily immune to Sob for 24 hours.%rSuccess The creature is unaffected.%rFailure The…"}, {"name": "Wing Flurry", "type": "action", "traits": [], "cost": 1, "text": "The crying cicada beats its wings together, exposing all creatures within a 10-foot to crying cicada poison."}]
