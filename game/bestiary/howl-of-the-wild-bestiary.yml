  actions: [{"name": "Storm Bolt", "type": "passive", "traits": [], "text": "The chaos falcon's bolt Strike always deals the damage type of their storm nexus aura."}, {"name": "Stormsight", "type": "passive", "traits": [], "text": "Wind, precipitation, and clouds don't impair a chaos falcon's vision; they ignore the Concealed condition from storms, mist, precipitation, and the like."}, {"name": "Dive-bomb", "type": "action", "traits": ["earth", "fire", "primal"], "cost": 2, "text": "Requirements The chaos falcon is Flying%rEffect The chaos falcon Flies twice straight down. If they reach the ground or a similarly solid object at the end of this movement, their landing shatters that surface into sharp shards and droplets of molten stone deal 4d6 fire and 3d8 piercing damage (DC 26 Reflex save) to all other creatures within 20 feet."}, {"name": "Flash Storm", "type": "action", "traits": ["air", "primal", "water"], "cost": 1, "text": "Water condenses around the ash particles in the chaos falcon's 15-foot aura, pelting everything beneath it with driving rain. Creatures in that area must succeed at a DC 26 Reflex save or be pushed 20 feet down, falling Prone if they start or end this movement on the ground."}, {"name": "Storm Nexus", "type": "passive", "traits": ["aura", "primal"], "text": "15 feet. 3d6 untyped|options:area-damage, DC 26 Reflex save. The chaos falcon is surrounded by a cloud of volcanic ash, lightning arcing within the cloud as it glows hot in some areas and collects ice in others. A chaos falcon can change the damage type of this aura to cold, electricity, or fire as an action, which has the concentrate trait."}]
