  actions: [{"name": "Tremorsense (Imprecise) 60 feet", "type": "passive", "traits": []}, {"name": "Darkvision", "type": "passive", "traits": []}, {"name": "Voice of Nature", "type": "passive", "traits": [], "text": "Though the Wardens of the Wild do not speak in words, they can communicate complex concepts flawlessly and wordlessly with any animal, beast, plant, or other creature of the natural world through prolonged eye contact. Sapient creatures with strong ties to the natural world, such as animal instinct barbarians or druids who speak the Wildsong, can somewhat understand a Warden of the Wild, though the meaning can be vague."}, {"name": "Warden's Crown", "type": "passive", "traits": [], "text": "A Warden of the Wild's horned crown commands respect from wild creatures. Wild creatures native to a warden's biome automatically improve their attitude toward it by one step (up to friendly) and typically do not take hostile actions towards each other while in the warden's presence."}, {"name": "+1 To All Saves vs. Primal", "type": "passive", "traits": []}, {"name": "Magmatic Reflex", "type": "reaction", "traits": [], "text": "Trigger The warden is targeted with an attack%rEffect The warden issues a spray of magma as they jump away from danger. This spray deals 6d12 fire damage to all adjacent creatures (DC 42 Reflex save). They then Leap or Step away, gaining a +2 circumstance bonus to their AC against the triggering attack."}, {"name": "Bury Beneath Stone", "type": "action", "traits": ["attack", "primal"], "cost": 1, "text": "Requirements The warden has a creature Grabbed%rEffect The warden attempts to wedge a creature they have grabbed in their mandibles within a crack in the earth that opens beneath them. The warden attempts an Athletics check against the grabbed creature's Reflex DC. If they succeed, they bury the creature in the ground. The creature takes 10d10 bludgeoning damage. It is also Restrained, Slowed 1, and has to hold its breath or start suffocating until it Escapes. If the creature is still buried at…"}, {"name": "Called to Depths", "type": "passive", "traits": [], "text": "The depths call to the warden, especially as they move through the air. When they Long Jump, they can use any unused movement from the Long Jump to Burrow. Additionally, the warden can Burrow through any earthen matter, including rock. When they do so, they move at their full burrow Speed."}, {"name": "Erupting Jump", "type": "action", "traits": ["primal"], "cost": 2, "text": "The warden draws out a stream of lava, then jumps off the solidifying mass as it cools. The warden Leaps up to twice their Speed. When they land, the force of the impact deals 6d12 bludgeoning|options:area-damage damage to all creatures within a 15-foot with a DC 42 Fortitude save. On a critical failure, the creature is also pushed 10 feet away from the warden."}, {"name": "Obsidian Cage", "type": "passive", "traits": [], "text": "Rapidly cooling obsidian clings to the target's body and stiffens around their limbs. The target must attempt a DC 42 Reflex save. On a failure, the target is Immobilized until they escape dc=42. On a critical failure, the target is Off-Guard for as long as they remain immobilized."}, {"name": "Vibratory Excavation", "type": "action", "traits": ["manipulate", "primal"], "cost": 2, "text": "The warden screeches with a resonant call that tears apart earth and stone. They create a 10-foot-square, 50-foot-deep pit in earthen material or stone within 60 feet."}, {"name": "Wall Cling", "type": "passive", "traits": [], "text": "The Warden of Caverns and Burrows clings to surfaces with their segmented feet. They do not need to use a hand to hold on to walls or ceilings."}]
