t."}, {"name": "Arctic Embrace", "type": "action", "traits": ["cold"], "cost": 2, "text": "All creatures in the warden's bioluminescent maelstrom take 10d6 cold damage (DC 45 Fortitude save). On a failure, the creature is also Slowed 1 for 1 round."}, {"name": "Grasp of the Deep", "type": "passive", "traits": [], "text": "Creatures struck by one of the warden's tentacles gain cold weakness 10 and take a –2 status penalty to Fortitude saves for 1 round.%rEffect: Grasp of the Deep"}, {"name": "I Am The Tide", "type": "action", "traits": ["primal", "water"], "cost": 2, "text": "The warden creates three lines of rushing water, each 10 feet wide and 120 feet long. Creatures in the area take 18d8 bludgeoning|options:area-damage damage (DC 45 Fortitude save). The warden can either push or pull, and all creatures that fail this save move up to 40 feet in the direction chosen. The warden can't use I Am The Tide again for 1d4 rounds."}, {"name": "What Lurks Beneath", "type": "action", "traits": [], "cost": 3, "text": "The warden attacks with their tentacles six times."}]
