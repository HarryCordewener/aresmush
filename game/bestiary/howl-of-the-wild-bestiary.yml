  actions: [{"name": "All Aboard", "type": "passive", "traits": [], "text": "A decapod dinghy can carry up to 30 Bulk of creatures or unattended items on their back, such as five Medium creatures. The anemones' gentle hold on the passengers is sufficient in most situations, but while in combat, those passengers are Slowed 1 if they want to take other actions while remaining on the decapod dinghy's back."}, {"name": "Anemone Transport", "type": "action", "traits": ["primal", "teleportation"], "cost": 3, "text": "The decapod dinghy and all their willing passengers teleport to a patch of anemones within 10 miles large enough for the decapod dinghy to stand among them. Although the decapod dinghy doesn't need to see the location, they must have been there before. All creatures transported are temporarily immune to this ability for 24 hours."}, {"name": "Inflate Anemones", "type": "action", "traits": [], "cost": 1, "text": "The anemones on the decapod dinghy's back inflate, enveloping all passengers and giving each passenger a +2 circumstance bonus to AC until the beginning of the decapod dinghy's next turn."}, {"name": "Protect Passenger", "type": "reaction", "traits": [], "text": "Trigger An enemy within 20 feet damages one of the decapod dinghy's passengers%rEffect The decapod dinghy's anemones lash out for a tentacle Strike against the triggering creature."}, {"name": "Stinging Anemones", "type": "action", "traits": ["poison"], "cost": 1, "text": "The decapod dinghy's anemones sting any number of creatures they choose among passengers and those the decapod dinghy has Grabbed or Restrained. The stings deal 5d6 poison damage (DC 26 Fortitude). On a failed save, that creature is also Enfeebled 2 for 1 hour."}]
