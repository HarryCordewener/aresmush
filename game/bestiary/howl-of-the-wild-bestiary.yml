  actions: [{"name": "Drain Potion", "type": "action", "traits": ["manipulate"], "cost": 2, "text": "Requirements The apothecary bee has no stored potions%rEffect The apothecary bee slurps up a potion within its reach, storing it internally. A creature can attempt a DC 25 Reflex save to protect a potion in its possession."}, {"name": "Ingest Potion", "type": "action", "traits": [], "cost": 1, "text": "The apothecary bee consumes the potion it has stored in its body. If the potion has the healing trait, the apothecary bee heals for the maximum amount."}, {"name": "Inject Potion", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The apothecary bee injects its stored potion into a willing creature within its reach. This deals 1 piercing damage and grants the recipient the normal effects of drinking the potion."}, {"name": "Internal Cauldron", "type": "passive", "traits": [], "text": "With an appropriate diet, an apothecary bee will create a potion of 6th level or lower every two weeks. Most often, this is a Healing Potion (Moderate). Each apothecary bee can store only one completed potion at a time. Unused potions can generally be harvested from an apothecary bee with a successful DC 23 Nature or DC 23 Survival check."}, {"name": "Potionsight", "type": "passive", "traits": [], "text": "Apothecary bees' complex eyes let them see the auras of magical potions and instinctively identify potions of their level or lower. These auras are visible through mundane containers, though their eyes have no special ability to perceive or identify non-magical solutions, such as alchemical elixirs."}, {"name": "Smoke Susceptibility", "type": "passive", "traits": [], "text": "An apothecary bee is Slowed 1 if it starts its turn in heavy smoke."}]
