  actions: [{"name": "Petal Form", "type": "passive", "traits": [], "text": "The blooming guardian can dissipate momentarily into a swirling cloud of petals and pollen to pass over brambles and slip through cracks. When Striding in woodland terrain, the blooming guardian ignores difficult terrain and can pass through obstacles so long as there is a small passageway."}, {"name": "Buck", "type": "reaction", "traits": [], "text": "DC 36 Reflex"}, {"name": "Budding Siphon", "type": "action", "traits": ["aura", "primal", "stance", "void"], "cost": 1, "text": "20 feet. A blooming guardian is in a constant state of decomposition; to keep this entropy at bay, the flowers that cover their antlers continually siphon life from the surrounding area. All living creatures that enter or start their turn in the emanation take 6d4 void|options:area-damage damage (DC 36 Fortitude save). At the start of their turn in any round that the blooming guardian deals damage with siphoning buds, they gain 10 temporary Hit Points, plus 2 temporary Hit Points for each…"}, {"name": "Full Bloom", "type": "action", "traits": ["poison", "primal", "stance"], "cost": 1, "text": "The flowers on the blooming guardian's antlers bloom, unveiling their brilliance as they eat away at their host. While in this stance, the blooming guardian's Strikes deal an additional 2d4 poison damage plus 5 persistent poison damage; on a hit, a target must succeed at a DC 36 Fortitude save or become Enfeebled 2. The blooming guardian takes 5 persistent poison damage as long as it's in Full Bloom."}, {"name": "Goring Charge", "type": "action", "traits": [], "cost": 2, "text": "The blooming guardian Strides twice and makes an antlers Strike after either Stride. If the Strike hits, the blooming guardian deals an extra 2d12 bludgeoning damage, and the target takes a –2 circumstance penalty to its next Fortitude save against blossom siphon."}, {"name": "Wail of the Forest", "type": "action", "traits": ["primal", "void"], "cost": 2, "text": "Requirements The blooming guardian is in Full Bloom%rEffect The blooming guardian confronts their mortality, causing their flowers to burst and spray their pollen. All creatures in a 40-foot take 10d10 void|options:area-damage damage with a DC 36 Fortitude save. The blooming guardian then exits Full Bloom and can't enter it again for 1d4 rounds.%rCritical Success No effect.%rSuccess The creature takes half damage.%rFailure The creature takes full damage and becomes Drained 1. Creatures that are…"}]
