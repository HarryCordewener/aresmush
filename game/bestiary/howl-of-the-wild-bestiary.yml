  actions: [{"name": "Conduct", "type": "action", "traits": ["auditory", "mental", "primal"], "cost": 1, "text": "One of the froglets begins to sing, granting one of three effects to the concert frog and all allies within 60 feet until the beginning of the concert frog's next turn.%rEffect: Conduct%rRed Grants a +10-foot status bonus to their Speeds. Blue Grants a +1 status bonus to AC and Fortitude saving throws. Yellow Allies gain a +1 status bonus to attack rolls and deal an additional 1d4 sonic damage on successful melee Strikes as their attacks resonate."}, {"name": "Three-Frog Orchestra", "type": "passive", "traits": [], "text": "The concert frog has three froglets perched behind its lips, each of a different color. A creature can specifically target a froglet. If any froglets have died, the concert frog attempts a DC 11 Flat at the end of its turn; on a success, new froglets hatch in its stomach and emerge at the concert frog's lips."}]
