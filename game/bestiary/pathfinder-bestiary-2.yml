  actions: [{"name": "Culdewen's Curse", "type": "passive", "traits": ["curse", "primal"], "text": "A culdewen that captures a creature is compelled to immediately retreat to a secluded place to eat, typically journeying by boat. The travel to the secluded place always takes at least 1 day. Their captive is cursed to vanish on the journey-typically being lost in the water or consumed by aquatic creatures-and can be recovered only by a Wish spell or similarly powerful magic."}, {"name": "-2 Status Bonus on Saves vs. Curses", "type": "passive", "traits": []}, {"name": "Hooked", "type": "passive", "traits": [], "text": "A creature struck by the culdewen's fish hook is skewered, taking 1d4 bleed as long as the hook remains stuck in it. The fish hook can be removed if a creature Escapes (DC 25 Athletics), pulling it free."}, {"name": "Land the Fish", "type": "action", "traits": [], "cost": 1, "text": "Requirements A creature is hooked by the culdewen's fish hook and adjacent to the culdewen%rEffect The culdewen hoists the creature over their shoulder, as though it weighs no more than a fish. Unless the creature is unable to act, the culdewen must attempt an Athletics check against the creature's Fortitude DC. On a success, the creature is Restrained by the culdewen. Escaping from the restrained condition (DC 25) also allows a creature to remove the hook.%rWhile hoisting a creature, the…"}, {"name": "Reel In", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The culdewen pulls the rope attached to their hook. If they have no creature hooked, the fish hook returns to the culdewen's hand. If a creature is hooked, the culdewen attempts an Athletics check against the creature's Fortitude DC, pulling it up to 30 feet closer on a success (60 feet on a critical success)."}, {"name": "Swear", "type": "action", "traits": ["auditory", "curse", "primal"], "cost": 1, "text": "The culdewen unleashes a string of invectives. Each creature that hears them must attempt a DC 25 Will save, with the effects of Mariner's Curse and is then temporarily immune for 24 hours. Even on a failed save, the curse ends automatically after 1 day."}]
