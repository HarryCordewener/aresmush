  actions: [{"name": "Children of the Night", "type": "passive", "traits": ["divine", "mental"], "text": "The presence of a vrykolakas master inspires savage creatures to crawl forth to do its bidding, including rat swarms, wargs, werewolves, and similar creatures. The vrykolakas master can give telepathic orders to these creatures within 100 feet, but they can't communicate back."}, {"name": "Swift Tracker", "type": "passive", "traits": [], "text": "The vrykolakas moves at full Speed while Tracking."}, {"name": "Feral Possession", "type": "passive", "traits": ["curse", "divine", "incapacitation", "mental", "possession"], "text": "Trigger The vrykolakas is reduced to 0 Hit Points, and an animal is within 100 feet%rEffect Unlike most other undead, a vrykolakas isn't destroyed when it reaches 0 HP. Instead, it attempts to cast its spirit into an animal within 100 feet, which must attempt a DC 29 Will save. On a failure, the animal is possessed. This has the effects of the Possession spell, but it lasts a number of days equal to the vrykolakas's level. This possession can't be counteracted with magic (though remove curse…"}, {"name": "Pestilential Aura", "type": "passive", "traits": ["aura", "divine"], "text": "5 feet. DC 29 Fortitude%rCreatures beginning their turn in the area while the vrykolakas is in its true form are exposed to bubonic plague.%rBubonic Plague%rThis widespread illness can sweep through entire communities, leaving few unaffected. The first indication of the disease is a telltale swelling of glands. In some cases, the disease can move into your lungs (pneumonic plague) or blood (septicemic plague), which is even more fatal.%rIf you have bubonic plague, you can't remove the Fatigued…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Vrykolakas Vulnerabilities", "type": "passive", "traits": [], "text": "Vrykolakas all have the following vulnerabilities.%rBurial Site Bound A vrykolakas is bound to the place of its death or interment. It must return to this location once per week and bury itself in the earth for 24 hours, during which time it is Paralyzed and can be beheaded. If it is unable to return to this site, it is reduced to 0 Hit Points and attempts to use Feral Corruption; if this host animal can't return to the burial site before the possession effect ends, the vrykolakas is destroyed…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "A vrykolakas master can transform into a form resembling the body it had in life, with the effects of Humanoid Form but with unlimited duration. It loses its fangs and claw Strikes but gains a +2 circumstance bonus to Deception checks to Impersonate in this form."}, {"name": "Create Spawn", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Blood, a vrykolakas master can turn this creature into a vrykolakas spawn by donating some of its own blood to the creature and burying it in earth for 3 nights.%rSuch vrykolakas spawn are generally friendly to the vrykolakas that created them, but they are not under its control and typically wander off on their own rampage within 1d6 days of their creation."}, {"name": "Dominate Animal", "type": "action", "traits": ["divine", "incapacitation", "mental"], "cost": 1, "text": "DC 29%rThe vrykolakas can cast Dominate at will as a divine innate spell that affects only animals. A creature that succeeds is immune to that vrykolakas's Dominate Animal for 24 hours. Destroying the vrykolakas ends the effect, but reducing it to 0 HP does not.%rA dominated animal takes a -4 circumstance penalty to saving throws against the vrykolakas's Feral Possession."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements The vrykolakas' last action was a successful fangs Strike%rEffect The vrykolakas sinks its fangs into that creature to drink its blood. This requires an Athletics check against the creature's Fortitude DC. On a success, the creature becomes Drained 2, and the vrykolakas regains 19 healing Hit Points, gaining any excess HP as temporary Hit Points.%rDrinking Blood from a creature that's already drained doesn't restore any HP to the vampire, but it increases the creature's drained…"}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 29, "attack": 19, "spells": {"3": ["Fear"], "5": ["Vampiric Touch"]}}]
