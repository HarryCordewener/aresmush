  actions: [{"name": "Feral Possession", "type": "passive", "traits": ["curse", "divine", "incapacitation", "mental", "possession"], "text": "Trigger The vrykolakas is reduced to 0 Hit Points, and an animal is within 100 feet%rEffect Unlike most other undead, a vrykolakas isn't destroyed when it reaches 0 HP. Instead, it attempts to cast its spirit into an animal within 100 feet, which must attempt DC 24 Will save. On a failure, the animal is possessed. This has the effects of the Possession spell, but it lasts a number of days equal to the vrykolakas's level. This possession can't be counteracted with magic (though remove curse…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Vrykolakas Vulnerabilities", "type": "passive", "traits": [], "text": "Vrykolakas all have the following vulnerabilities.%rBurial Site Bound A vrykolakas is bound to the place of its death or interment. It must return to this location once per week and bury itself in the earth for 24 hours, during which time it is Paralyzed and can be beheaded. If it is unable to return to this site, it is reduced to 0 Hit Points and attempts to use Feral Corruption; if this host animal can't return to the burial site before the possession effect ends, the vrykolakas is destroyed…"}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements The vrykolakas' last action was a successful fangs Strike%rEffect The vrykolakas sinks its fangs into that creature to drink its blood. This requires an Athletics check against the creature's Fortitude DC. On a success, the creature becomes Drained 1, and the vrykolakas regains 10 healing HP, gaining any excess HP as temporary Hit Points.%rDrinking Blood from a creature that's already drained doesn't restore any HP to the vampire, but it increases the creature's drained condition…"}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}]
