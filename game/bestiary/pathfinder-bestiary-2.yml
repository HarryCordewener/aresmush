  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Blinding Soul", "type": "passive", "traits": ["divine", "light", "visual"], "text": "Whenever the star archon takes slashing damage, bright light pours from their wounds. Non-archons within 10 feet must attempt a DC 38 Fortitude save.%rOn a failure, a creature is Dazzled for 1 round. On a critical failure, the creature is Blinded for 1d4 rounds instead.%rThe creature is then temporarily immune for 1 round."}, {"name": "Explosive Rebirth", "type": "passive", "traits": ["death", "divine", "fire", "good"], "text": "When killed, the star archon explodes in a blinding flash of holy energy that deals 12d6 fire damage and 12d6 spirit damage to anything in a 100-foot, with a DC 40 Reflex save.%rA non-archon creature that sees the explosion and critically fails its save is permanently Blinded as well.%rThe slain star archon reincarnates 1d4 rounds later as a shield archon."}, {"name": "Retributive Strike", "type": "reaction", "traits": [], "text": "Damage Reduction 21%rA star archon can also make a Retributive Strike by throwing its starknife, and the enemy and ally can be within 60 feet instead of 15 feet."}, {"name": "Archon's Door", "type": "passive", "traits": [], "text": "Once per day, if an archon sees another creature cast dimension door, the archon can use Translocate (heightened to 5th level) within 1 round to attempt to follow that creature to the maximum distance of the archon's dimension door. If the archon's dimension door has enough distance, the archon appears the same distance and direction from the creature as before either creature used dimension door."}, {"name": "Prudent Asterism", "type": "action", "traits": [], "cost": 2, "text": "The star archon calculates a celestial constellation and sends their starknife flying along that path from one foe to the next. It makes a starknife Strike against a