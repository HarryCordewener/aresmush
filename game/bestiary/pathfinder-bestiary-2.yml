renched, the archon can't be forcibly moved or tripped, and it gains a +2 circumstance bonus to AC and Reflex saves. Entrench ends automatically as soon as the bastion archon uses another move action."}, {"name": "Holy Beam", "type": "action", "traits": ["divine", "good", "holy", "incapacitation", "light"], "cost": 2, "text": "The bastion archon releases a blinding beam of holy light in a 500-foot that deals 20d6 spirit|options:area-damage damage to non-archons in the area, with a DC 38 Reflex save.%rThe bastion archon can't use Holy Beam again for 1d4 rounds.%rCritical Success The creature is unaffected.%rSuccess The creature takes half damage.%rFailure The creature takes full damage and is Blinded for 1d4 rounds.%rCritical Failure The creature takes double damage and is blinded permanently."}]
