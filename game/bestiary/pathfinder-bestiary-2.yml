  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Spell Deflection", "type": "passive", "traits": ["divine", "mental"], "text": "A spellcaster who targets a devourer with a mental spell, Banishment, Seize Soul, Divine Decree, Divine Wrath, Possession, Spirit Blast, or Spirit Song can attempt a counteract check to free a soul the devourer has trapped with Devour Soul. If this counteract attempt succeeds, the trapped soul is released (though the creature remains dead), and the devourer can't use any soul charges from that creature.%rDevourers are otherwise immune to these spells."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Devour Soul", "type": "action", "traits": ["death", "divine"], "cost": 2, "text": "The devourer touches a creature within reach, dealing 8d6 void damage (DC 31 Fortitude save). If a creature is slain by this attack, its soul becomes trapped within the devourer. While its soul is trapped, a creature can't be resurrected except by powerful magic such as a Wish spell. Destroying the devourer or successfully counteracting Devour Soul (see spell deflection) releases the soul. The devourer can hold only one soul at a time.%rA soul has 5 soul charges per level of the originating…"}, {"name": "Drain Life", "type": "passive", "traits": ["divine"], "text": "When the devourer damages a living creature with its claw Strike, the devourer gains 10 temporary Hit Points and the creature must succeed at a DC 24 Fortitude save or become Drained 1. Further damage dealt by the devourer increases the condition value by 1 on a failed save, to a maximum of drained 4.%rEffect: Drain Life"}, {"name": "Soul Spells", "type": "passive", "traits": [], "text": "A devourer casts occult innate spells, but to do so it must expend a number of soul charges equal to the spell's rank (similar to casting a spell using charges from a staff). It can heighten any spell to a maximum of 6th level by expending more