  actions: [{"name": "Coven", "type": "passive", "traits": ["mental", "occult"], "text": "The witchfire adds Nightmare, Phantasmal Killer, Phantasmal Calamity, and Summon Entity to their coven's spells.%rA coven can contain one or more witchfires, but it must also include at least one living creature capable of forming a coven; three witchfires cannot form a coven."}, {"name": "Opportune Witchflame", "type": "reaction", "traits": [], "text": "Trigger A creature makes a melee Strike against or touches the witchfire%rEffect The witchfire makes a witchflame caress Strike against the triggering creature."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Witchflame", "type": "passive", "traits": ["curse", "fire", "occult"], "text": "Any creature that takes void damage from a witchfire's Strike must attempt a DC 26 Will save.%rCritical Success The creature is unaffected and is temporarily immune to witchflame for 1 hour.%rSuccess The creature appears to catch fire with sickly green flames. These flames deal no damage on their own, but as long as the flames burn, the creature can't be Concealed (Invisible creatures are Concealed rather than being Undetected) and gains weakness 5 to fire for 1 round.%rFailure As success, but…"}, {"name": "Witchflame Kindling", "type": "action", "traits": ["fire", "occult"], "cost": 2, "text": "Requirements A creature within 30 feet of the witchfire burns with witchflame%rEffect The witchfire's eyes and mouth glow brightly, and the witchflame on the target creature momentarily burns much hotter, dealing 5d6 fire damage and 5d6 void damage to that creature (DC 28 Fortitude save).%rThe witchfire can't use Witchflame Kindling for 1d4 rounds."}]
