  actions: [{"name": "Tremorsense 30 feet", "type": "passive", "traits": []}, {"name": "Draconic Resistance", "type": "passive", "traits": [], "text": "A white dracolisk has resistance 10 to cold damage."}, {"name": "Petrifying Glance", "type": "reaction", "traits": ["arcane", "aura", "visual"], "text": "Trigger A creature within 30 feet that the dracolisk can see starts its turn%rEffect The target must attempt a DC 26 Fortitude save. If it fails, it becomes Slowed 1 for 1 minute as its body stiffens."}, {"name": "Breath Weapon", "type": "action", "traits": ["arcane"], "cost": 2, "text": "The white dracolisk breathes a 30-foot of energy. This breath weapon deals 6d10 cold|options:area-damage damage, with a DC 28 Reflex save.%rThe dracolisk can't use Breath Weapon again for 1d4 rounds."}, {"name": "Petrifying Gaze", "type": "action", "traits": ["arcane", "concentrate", "incapacitation", "visual"], "cost": 2, "text": "The dracolisk stares at a creature it can see within 30 feet. That creature must attempt a DC 28 Fortitude save. If it fails and has not already been slowed by Petrifying Glance or this ability, it becomes Slowed 1. If the creature already was slowed by this ability or Petrifying Glance, a failed save causes the creature to be Petrified permanently.%rA creature petrified in this manner can be instantly restored to flesh by being coated (not just splashed) with fresh dracolisk or basilisk blood…"}, {"name": "Savage Jaws", "type": "action", "traits": [], "cost": 2, "text": "The dracolisk makes a single Strike with its jaws. If the attack hits, it deals (4d12+16) piercing damage (versatile S). This counts as two attacks for its multiple attack penalty."}]
