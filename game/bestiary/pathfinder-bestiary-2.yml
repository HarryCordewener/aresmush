  actions: [{"name": "Wild Empathy", "type": "passive", "traits": [], "text": "The blodeuwedd can use Diplomacy to make-an-impression on and make very simple Requests of animals."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Allergen Aura", "type": "passive", "traits": ["aura", "primal"], "text": "30 feet. A blodeuwedd exudes a 30-foot aura of pollen and irritating allergens. A non-plant living creature that begins its turn in the aura must succeed at a DC 22 Fortitude save or become Sickened 2. A creature that succeeds at its save is then temporarily immune to the allergen aura for 24 hours.%rA blodeuwedd can suppress this aura or activate it again as a free action."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 2, "text": "A blodeuwedd can take on the appearance of a single unique humanoid or the form of a prairie owl.%rWhen in humanoid form, the blodeuwedd loses its claw attack.%rIn owl form, its statistics change as follows:%rSize Small; Speed fly 60 feet; Melee a talons +15, Damage (1d3+1) slashing. A blodeuwedd can return to their normal form as a free action."}, {"name": "Living Footsteps", "type": "passive", "traits": [], "text": "Every Stride action taken by a blodeuwedd causes small plants, grasses, and wildflowers to sprout from the ground, though they can suppress this effect if they desire. In a region or terrain that wouldn't normally support plant life, these plants thrive for 1 minute before withering away."}, {"name": "Nature's Infusion", "type": "action", "traits": [], "cost": 2, "text": "Frequency once per day%rEffect While surrounded by any field or fertile plain, a blodeuwedd can infuse themself with borrowed life energy from nearby plants and nutrients in the ground. The blodeuwedd gains 15 temporary Hit Points that last for 1 hour."}]
