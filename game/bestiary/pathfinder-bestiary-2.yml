  actions: [{"name": "Planar Acclimation", "type": "passive", "traits": [], "text": "The jabberwock always treats the plane it is currently located on as its home plane."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Regeneration 25 (Deactivated by Vorpal Weapons)", "type": "passive", "traits": []}, {"name": "Claws That Catch", "type": "reaction", "traits": [], "text": "Trigger A creature within the jabberwock's reach uses a manipulate action or a move action, leaves a square during a move action, makes a ranged attack, or uses a concentrate action%rEffect The jabberwock makes a claw Strike against the triggering creature. If the Strike hits, the jabberwock disrupts the triggering action."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "100 feet. DC 43 Will"}, {"name": "Vorpal Fear", "type": "passive", "traits": [], "text": "A jabberwock damaged by a vorpal weapon becomes Frightened 2 (or Frightened 4 on a critical hit)."}, {"name": "Burble", "type": "action", "traits": ["aura", "emotion", "mental", "primal", "sonic"], "cost": 2, "text": "The jabberwock creates a blast of strange noises and shouted nonsense in the various languages it knows (and invariably some languages it doesn't know), creating one of two effects.%rThe jabberwock can't Burble again for 1d4 rounds.%rConfusion 60 feet. Each creature in the emanation must succeed at a DC 46 Will save or become Confused for 1d4 rounds. Sonic Beam The jabberwock focuses its Burbling into a 60 foot line of sonic energy that deals 24d6 sonic|options:area-damage damage to creatures…"}, {"name": "Jaws That Bite", "type": "passive", "traits": [], "text": "If the jabberwock makes a jaws attack and rolls a natural 19 on the d20 roll, the attack is a critical hit. This has no effect if the 19 would be a failure."}, {"name": "Whiffling", "type": "reaction", "traits": ["aura"], "text": "Trigger The jabberwock Flies or makes a wing Strike%rEffect The jabberwock's wings whiffle, creating severe winds within a 30-foot. These winds move outward from the jabberwock, and they persist until the start of the jabberwock's next turn. During this time, flight of any kind in the emanation requires a successful Acrobatics check to Maneuver in Flight, and creatures flying toward the jabberwock are moving through greater difficult terrain. Creatures on the ground in the emanation must…"}, {"name": "Improved Grab", "type": "free", "traits": []}, {"name": "Improved Knockdown", "type": "free", "traits": []}]
