  actions: [{"name": "Animal Empathy", "type": "passive", "traits": [], "text": "The naiad can ask questions of, receive answers from, and use the Diplomacy skill with animals."}, {"name": "Tied to the Land", "type": "passive", "traits": [], "text": "Timonithaea is tied to a body of water or area with a great deal of water features.%rA nymph queen is intrinsically tied to a specific region. As long as the queen is healthy, the environment is exceptionally resilient, allowing the nymph queen to automatically attempt to counteract any spell that would harm the environment (such as the Blight ritual), using her spell DC with a counteract rank equal to the highest-rank druid spell she can cast.%rWhen the nymph queen becomes physically or…"}, {"name": "Timonithaea's Calling", "type": "passive", "traits": [], "text": "Timonithaea channels magical energy into the Enoménos crown to telepathically communicate with creatures who are beneath the water within 20 miles of Naós tou Neroú."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Nymph's Beauty", "type": "passive", "traits": ["aura", "emotion", "mental", "primal", "visual"], "text": "30 feet. DC 26 Will save.%rA creature that fails its save is Stunned 1 and becomes stunned 1 each time it starts its turn within the aura for the next 24 hours, even if it can't see Timonithaea."}, {"name": "Water Healing", "type": "passive", "traits": ["healing", "primal", "vitality"], "text": "For every 10 minutes a naiad spends soaking in any body of water in her domain, she regains 30 Hit Points."}, {"name": "Change Shape", "type": "action", "traits": ["polymorph", "primal"], "cost": 1, "text": "Nymph queens can transform between their original form, which looks much like a typical nymph of their kind, and any Small or Medium humanoid form, typically choosing a more humanoid-looking version of their natural form."}, {"name": "Focus Beauty", "type": "action", "traits": ["emotion", "mental", "primal", "visual"], "cost": 1, "text": "If a target already affected by nymph's beauty fails its save, the image of the queen sears into the creature's mind, effectively blinding the creature until its vision is restored with sound body or a similar effect.%rThe naiad queen can Dismiss the effect.%rThe nymph queen focuses her beauty upon a target, who must attempt a save against her nymph's beauty aura (DC 26 Will save). If the creature fails and was already affected by the aura, it takes a greater effect described in the nymph…"}, {"name": "Inspiration", "type": "action", "traits": ["emotion", "mental", "primal"], "cost": 3, "text": "The nymph queen inspires a single intelligent creature by giving that creature a token of her favor, typically a lock of her hair, though it can be some other significant object as well. As long as the creature carries her token and remains in good standing with her, the creature gains a +1 status bonus to all Crafting checks, Performance checks, and Will saves.%rIf the nymph grants her token to a bard, and she's the bard's muse, the queen chooses one additional benefit granted by her token: a…"}]
