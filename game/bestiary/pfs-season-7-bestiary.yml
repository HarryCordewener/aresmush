  actions: [{"name": "Demonic Temptation", "type": "passive", "traits": ["divine", "mental"], "text": "Demonic study has garnered the attention of at least one demon who is actively trying to possess the demonologist. When the demonologist publicly espouses the benefits of demonic power (whether they believe it a good thing or not), they gain a +1 status bonus to skill checks, AC, and saves for 1 day. These bonuses don't apply against demons. At the end of the day, the demonologist must attempt a DC 20 Will save, becoming possessed for 1 day on a failure (or permanently on a critical failure)."}, {"name": "Breach the Outer Rifts", "type": "free", "traits": [], "text": "Requirements The demonologist's last action was to cast a non-cantrip spell%rEffect The demonologist siphons energy drawn from the Outer Rifts into their weapon. Until the end of the turn, the weapon deals an extra 2d6 damage.%rRoll 1d20 to determine the type:%r1–7 acid 8–9 cold 10–11 electricity 12–18 fire 19–20 void."}, {"name": "Demon Summoning", "type": "passive", "traits": [], "text": "The demonologist can cast a 5th-rank Summon Fiend arcane spell to summon a demon. To do so, they must sacrifice two 4th-rank prepared spells and voluntarily take 4d12 mental damage that can't be reduced or prevented. If the demonologist is unable to Sustain the Spell, including if they're knocked out or killed, the spell continues, but the GM rolls a DC 10 Flat each round, ending the spell on a failure."}]
