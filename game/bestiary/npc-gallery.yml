  actions: [{"name": "Adept Crafter", "type": "passive", "traits": [], "text": "Nyctessa can use the Craft activity to create alchemical and magical items. In addition to her known spells, her spellbook contains the formulas for Bottled Night, Antiplague (Lesser), Comprehension Elixir (Lesser), Steelscour (Moderate), Oil of Unlife (Lesser), Unholy Water, and Void Salts."}, {"name": "Deathly Inquisition", "type": "passive", "traits": [], "text": "Once per day, Nyctessa can cast Talking Corpse as an innate occult spell on an Immobilized or willing undead creature (DC 21), with a casting time of 1 minute. This provides more detailed answers than speaking with a non-undead corpse."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Bonded Staff", "type": "free", "traits": ["arcane"], "text": "Frequency once per day%rEffect Nyctessa expends the power stored in her staff. This turn she can cast one spell she prepared today and already cast, without spending a spell slot."}, {"name": "Sepulchral Drain", "type": "passive", "traits": [], "text": "When the Nyctessa's staff deals damage to a living creature with a Strike, that creature gains a weakness 2 to void damage until the end of Nyctessa's next turn.%rEffect: Sepulchral Drain"}, {"name": "Taste Blood", "type": "action", "traits": ["void"], "cost": 1, "text": "Requirements Nyctessa's last action was a fangs Strike that damaged the target%rEffect Nyctessa drinks blood from the target, which must be a living humanoid, gaining 5 temporary Hit Points for 10 minutes. The target must succeed at a DC 21 Fortitude save or become Drained 1. Regardless of the outcome, the target is temporarily immune to Nyctessa's Taste Blood for 1 day."}]
