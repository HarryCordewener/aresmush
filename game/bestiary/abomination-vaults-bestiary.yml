  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Painsight", "type": "passive", "traits": ["divine"], "text": "A velstrac automatically knows whether a creature it sees has any of the Doomed, Dying, and Wounded conditions, as well as the value of those conditions"}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 10 (Deactivated by Holy or Silver)", "type": "passive", "traits": []}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Unnerving Gaze", "type": "passive", "traits": ["aura", "divine", "fear", "mental", "visual"], "text": "30 feet. When a creature ends its turn in the aura, it sees the face of a departed loved one in place of the evangelist's face. The creature must succeed at a DC 21 Will save or become Frightened 2 (Frightened 3 on a critical failure)."}, {"name": "Animate Chains", "type": "passive", "traits": ["divine"], "text": "Chains in the evangelist's vicinity sprout barbs and writhe menacingly. The evangelist can make chain Strikes against any creature that is adjacent to an unattended chain within 20 feet, in addition to those within the reach of the evangelist's chain Strike."}, {"name": "Focus Gaze", "type": "action", "traits": ["concentrate", "divine", "fear", "mental", "visual"], "cost": 1, "text": "The evangelist stares at a creature they can see within 30 feet. The target must immediately attempt a DC 21 Will save against unnerving gaze. In addition, if the creature was already Frightened, on a failed save, the evangelist is Concealed from the creature for as long as the creature remains frightened.%rAfter attempting this save, the creature is then temporarily immune until the start of the evangelist's next turn."}, {"name": "Impaling Chain", "type": "passive", "traits": [], "text": "When the evangelist critically hits with a chain Strike, the target is impaled and anchored in place, becoming Grabbed by the chain. The creature is unable to recover from persistent bleed damage until it gets free (escape dc=25).%rEffect: Impaling Chain"}, {"name": "Rusty Chains", "type": "passive", "traits": [], "text": "When Cratonys damages a creature with her chains, including persistent bleed damage from being impaled by a chain, the creature must succeed at a DC 21 Fortitude saving throw or contract a severe form of tetanus called velstrac tetanus.%rVelstracs sometimes intentionally infect their chains with dangerous diseases, such as this aggressive form of tetanus. Tetanus can produce stiffness, muscle spasms strong enough to break bones, and ultimately death.%rSaving Throw DC 21 Fortitude%rOnset 1d4…"}]
