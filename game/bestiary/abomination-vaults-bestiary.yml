  actions: [{"name": "Motion Sense 60 feet", "type": "passive", "traits": [], "text": "A black pudding can sense nearby motion through vibration and air movement."}, {"name": "Adjust Shape", "type": "reaction", "traits": [], "text": "A viscous black pudding is thicker than most black puddings and can heap its body upon itself or spread itself out again. The pudding changes its size to Medium, Large, or Huge. If the pudding is Medium, its density reduces its Speeds to 10 feet, but this ability doesn't otherwise change its Strikes or its Speed. If the viscous black pudding Splits, both of the new puddings have the same size as it had at that time, until they Adjust their Shape."}, {"name": "Corrosive Mass", "type": "passive", "traits": [], "text": "A creature that hits the pudding with a metal or wooden weapon must succeed at a DC 22 Reflex save or the weapon takes 2d6 acid damage (after dealing damage to the black pudding as normal). Thrown weapons and ammunition take this damage automatically with no save."}, {"name": "Split", "type": "passive", "traits": [], "text": "When the black pudding is hit by an attack that would deal slashing or piercing damage and has 10 or more HP, it splits into two identical puddings, each with half the original's HP.%rOne pudding is in the same space as the original, and the other appears in an adjacent unoccupied space. If no adjacent space is unoccupied, it automatically pushes creatures and objects out of the way to fill a space (the GM decides if an object or creature is too big or sturdy to push)."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "1d8+7 bludgeoning damage plus 1d6 acid damage, DC 26 Fortitude save"}, {"name": "Corrosive Touch", "type": "passive", "traits": [], "text": "When the pudding hits a creature with its pseudopod, any acid damage is dealt to the creature's armor or clothing as well as the creature."}, {"name": "Suction", "type": "passive", "traits": [], "text": "The pudding can climb on ceilings and other inverted surfaces, though such surfaces are difficult terrain for it."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
