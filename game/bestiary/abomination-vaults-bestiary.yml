  actions: [{"name": "Magic Sense", "type": "passive", "traits": ["detection"], "text": "Belcorra can sense the presence of magic auras as though she were always using a 1st-rank Detect Magic spell. When she Seeks, she gains the benefits of a 3rd-rank detect magic spell on things she sees."}, {"name": "Site Bound", "type": "passive", "traits": [], "text": "Lowest three levels of the Abomination Vaults%rA typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When Belcorra is destroyed, she re-forms in 2d4 days within the Empty Vault (though she can reduce that time by empowering herself with glimmers of Nhimbaloth's essence using the Ebon Fulcrum Lens).%rBelcorra can only be permanently destroyed if she enacts her full revenge on Absalom or if Nhimbaloth devours her soul."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Blood Magic", "type": "passive", "traits": [], "text": "Each time Belcorra casts a sorcerer bloodline spell or an aberrant bloodline granted spell, she can grant herself or a target of the spell a +2 status bonus to Will saving throws for 1 round.%rEffect: Blood Magic"}, {"name": "Corrupting Gaze", "type": "action", "traits": [], "cost": 2, "text": "Belcorra stares at a creature she can see within 30 feet. The target takes 9d6 mental damage (DC 33 Will save).%rA creature that fails its save is also Stupefied 1 for 1 minute."}, {"name": "Haunted Lighthouse", "type": "action", "traits": [], "cost": 1, "text": "Frequency once every 10 minutes%rEffect Belcorra extends her presence throughout the lowest three levels of Gauntlight until the end of her next turn. She can see with the benefits of All