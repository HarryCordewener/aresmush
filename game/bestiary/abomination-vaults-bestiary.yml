  actions: [{"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a graveknight is destroyed, its armor rebuilds its body over the course of 1d10 days-or more quickly if the armor is worn by a living host. If the body is destroyed before then, the process restarts.%rA graveknight can only be permanently destroyed by obliterating its armor (such as with Disintegrate), transporting it to the Forge of Creation, or throwing it into the heart of a volcano."}, {"name": "Sacrilegious Aura", "type": "passive", "traits": ["aura", "divine", "evil"], "text": "30 feet. When a creature in the aura uses a vitality spell or ability, the graveknight automatically attempts to counteract it, with a counteract modifier of +17."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Devastating Blast", "type": "action", "traits": ["arcane", "cold"], "cost": 2, "text": "The graveknight unleashes a 30-foot of energy. Creatures in the area take 6d12 cold|options:area-damage damage (DC 29 Reflex save).%rThe graveknight can use this ability once every 1d4 rounds."}, {"name": "Graveknight's Curse", "type": "passive", "traits": ["arcane", "curse"], "text": "This curse affects anyone who wears a graveknight's armor for at least 1 hour.%rSaving Throw DC 33 Will save%rOnset 1 hour%rStage 1 Doomed 1 and cannot remove the armor (1 day)%rStage 2 Doomed 2, the creature's Speed is reduced by 10, and cannot remove the armor (1 day)%rStage 3 dies and transforms into the armor's graveknight.%rEffect: Graveknight's Curse"}, {"name": "Phantom Mount", "type": "action", "traits": ["arcane", "summon"], "cost": 3, "text": "HP 58; AC 27, Fort +17, Ref +15, Will +14%rThe graveknight summons a supernatural mount as per Marvelous Mount, heightened to a level equal to half the graveknight's level.%rUnlike phantom steed , the steed's AC and saving throw bonuses are all 4 lower than the graveknight's, and the steed has one-third the graveknight's Hit Points (rounded down).%rIf the steed is destroyed, the graveknight must wait 1 hour before using this ability again."}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "The graveknight has access to the critical specialization effects of any weapons it wields."}]
