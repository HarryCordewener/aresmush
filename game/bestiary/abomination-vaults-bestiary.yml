  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Despair", "type": "passive", "traits": ["aura", "divine", "emotion", "fear", "incapacitation", "mental"], "text": "30 feet. Living creatures are Frightened 1 while in Chafkhem's despair aura. They can't naturally recover from this fear while in the area but recover instantly once they leave it. When a creature first enters the area, it must succeed at a DC 24 Will save (after taking the penalty from being frightened) or be Paralyzed for 1 round.%rThe creature is then temporarily immune for 24 hours.%rEffect: Despair"}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When Chafkhem is destroyed, necromantic energies rebuild his body in the magic circle in his room over 1d10 days. If the re-forming body is destroyed during that time, the process starts anew. Chafkhem can be destroyed for good with a Consecrate ritual, or if the magic circle is destroyed."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Warding Script", "type": "reaction", "traits": ["arcane"], "text": "Trigger A creature Chafkhem can see makes a melee Strike against Chafkhem%rEffect Chafkhem traces a magical glyph in the air that glows and fades. The triggering creature must attempt a DC 25 Fortitude save.%rSuccess The target is unaffected.%rFailure The target is Blinded until the start of its next turn.%rCritical Failure The target is blinded for 1 minute."}, {"name": "Mummy Rot", "type": "passive", "traits": ["curse", "disease", "divine", "void"], "text": "This disease and any damage from it can't be healed until this curse is removed. A creature killed by mummy rot turns to dust and can't be resurrected except by a 7th-rank Resurrect ritual or similar magic.%rSaving Throw DC 24 Fortitude%rStage 1 carrier with no ill effect (1 minute)%rStage 2 6d6 void damage and Stupefied 1 (1 day)"}]
