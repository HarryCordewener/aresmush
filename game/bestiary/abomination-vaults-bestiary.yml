  actions: [{"name": "Corpse Sense (Precise) 30 feet", "type": "passive", "traits": [], "text": "A corpselight can sense dead bodies within range. This is a precise sense that functions through solid barriers less than 5 feet thick."}, {"name": "Sunlight Powerlessness", "type": "passive", "traits": [], "text": "A corpselight exposed to sunlight is Stunned 2 and Clumsy 2, and cannot Claim a Corpse."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Wisp Form", "type": "passive", "traits": [], "text": "When a corpselight is reduced to 0 Hit Points while merged with a corpse, it is instead reduced to 1 Hit Point as the corpse collapses to the ground and the corpselight emerges in its wisp form.%rWhile in wisp form, a corpselight is Tiny and can take no actions other than Claim Corpse or Fly.%rA corpselight that starts its turn in wisp form must attempt a DC 16 Flat at the end of its turn; if it fails, it loses 1 Hit Point. A corpselight reduced to 0 Hit Points while in wisp form is destroyed."}, {"name": "Claim Corpse", "type": "action", "traits": [], "cost": 1, "text": "Prerequisites The corpselight is in wisp form and is adjacent to a Medium or Small corpse that hasn't been claimed by a corpselight in the past 24 hours%rEffect The corpselight merges with the corpse, causes the corpse to Stand, and regains 3d6 healing Hit Points.%rEffect: Claim Corpse - Fleshy%rEffect: Claim Corpse - Skeletal"}, {"name": "Death Light", "type": "action", "traits": ["emotion", "fear", "mental", "occult"], "cost": 3, "text": "Prerequisites The corpselight is in a corpse%rEffect The corpselight emits a sickly blue beam of light from its mouth and eyes in a 20-foot. All living creatures in this area must attempt a DC 18 Fortitude saving throw. If at least 1 creature fails its save, the corpselight regains 2d6 healing Hit Points, gaining any that exceed its maximum as temporary Hit Points that last for 1 minute.%rThe corpselight can't use again for 1d4 rounds.%rCritical