ates a violent wave of roiling earth. Creatures in a 15-foot take 10d10 bludgeoning|options:area-damage damage (DC 34 Reflex save; on a critical failure, creatures are also knocked Prone)."}, {"name": "Expanded Splash", "type": "passive", "traits": [], "text": "Thessekka's bombs with the splash trait deal 4 additional splash damage and deal splash damage to all creatures within 10 feet."}, {"name": "Quick Alchemy", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 batch of infused reagents%rEffect Thessekka creates a single alchemical item from her formula book (see Alchemical Formulas). This item has the infused trait, but it remains potent only until the end of her next turn."}, {"name": "Quick Bomber", "type": "action", "traits": [], "cost": 1, "text": "Thessekka Interact to draw a bomb, then Strikes with it."}, {"name": "Stone Throes", "type": "action", "traits": ["earth"], "cost": 1, "text": "Thessekka turns her own body into solid stone like a statue and immediately becomes Petrified. Any creature grabbed or restrained by her becomes Immobilized; to get free, the creature must damage the statue enough to break it or succeed at a DC 36 Acrobatics check to Escape. The only action Thessekka can take while petrified is to use Stone Throes again to end the effect."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
