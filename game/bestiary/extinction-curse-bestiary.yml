  actions: [{"name": "Cabal", "type": "passive", "traits": [], "text": "Multiple herecites can form a cabal to gain increased magical abilities and defenses. A cabal consists of two to five herecites. The ritual to form a cabal (or to welcome new herecites into an existing cabal) requires 24 hours of worship, prayer, and vile sacrifice, after which point the herecites become magically bound to one another. All herecites in a cabal gain the cleric domain spells granted by each individual herecite's deity, and each herecite's focus pool increases to 3 Focus Points.…"}, {"name": "Herecite Deity", "type": "passive", "traits": [], "text": "A herecite is associated with one evil god and is always of the same alignment as that god. Whenever it wields its deity's favored weapon, that weapon gains the unholy rune. The herecite's creators select two domains from their deity; the herecite can cast the domain spells and the advanced domain spells from those domains as cleric focus spells. The herecite can cast the deity's other granted cleric spells as divine innate spells. Most herecites have 2 Focus Points in their focus pool. The…"}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Perverse Prayer", "type": "reaction", "traits": ["auditory", "divine", "evil"], "text": "Trigger A creature within 30 feet uses the Sustain a Spell action to sustain a divine spell or the Cast a Spell action to cast a divine spell with a verbal component%rEffect The herecite warps the caster's prayers into a sacrilegious echo praising the evils of its own deity. The triggering caster must succeed at a DC 29 Will saving throw or their spell is disrupted and their action wasted."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Assault the Soul", "type": "action", "traits": ["concentrate", "divine", "evil"], "cost": 3, "text": "Requirements The herecite is in a cabal of three or more members, two of which are within 60 feet and have used Cabal Communion within the last round%rEffect The herecite casts Seize Soul, Spirit Blast, or Spiritual Epidemic (DC 31). Once a herecite has used this ability (whether or not it was successful), the cabal must wait 24 hours before one of its members can use Assault the Soul again."}, {"name": "Cabal Communion", "type": "action", "traits": ["auditory", "concentrate"], "cost": 2, "text": "With murmurs and chants, the herecite casts its consciousness toward the other members of its cabal. For 1 round, it senses what other members are sensing, knows their thoughts, and knows their exact location."}, {"name": "Curse of Defiled Idols", "type": "action", "traits": ["curse", "divine", "evil"], "cost": 2, "text": "Recalling the cruelty of the foul ritual that birthed it, the herecite curses an enemy with a fragment of its blasphemy. The herecite targets one creature within 30 feet, which must attempt a DC 29 Will save. On a failure, the creature is cursed. As long as the creature is cursed, any art object, symbol, or implement of religious significance in the creature's possession-such as a divine spellcasting focus, holy text, fetish, or rendering of a deity-becomes physically corrupted in a way that…"}]
