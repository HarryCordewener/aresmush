  actions: [{"name": "Children of the Night", "type": "passive", "traits": ["divine", "mental"], "text": "Zinogyvaz's presence brings forth creatures of the night to do the master's bidding. These only include Hunting Spiders and Spider Swarms.%rZinogyvaz can give telepathic orders to these creatures as long as they are within 100 feet, but they can't communicate back."}, {"name": "Fast Healing 20", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, Zinogyvaz isn't destroyed at 0 HP. Instead, she falls Unconscious. If her body rests in her coffin for 1 hour, Zinogyvaz gains 1 HP, after which her fast healing begins to function normally."}, {"name": "Mist Escape", "type": "free", "traits": [], "text": "Trigger Zinogyvaz is reduced to 0 HP.%rEffect Zinogyvaz uses Turn to Mist. She can take move actions to move toward her coffin even though she's at 0 HP. While at 0 HP in this form, Zinogyvaz is unaffected by further damage.%rShe automatically returns to her corporeal form, unconscious, if she reaches her coffin or after 2 hours, whichever comes first."}, {"name": "Vampire Weaknesses", "type": "passive", "traits": [], "text": "All vampires possess the following weaknesses.%rCompulsions Vampires are creatures of strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless it is transported while it hides within its coffin, nor can it enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions-a pirate vampire might not be able to set foot on solid ground without being invited, for example. The…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "Zinogyvaz transforms into one of her animal forms or back into her normal form.%rUse the options in the Aerial Form and Animal Form spells as guidelines.%rSpider Zinogyvaz changes into a Hunting Spider or Spider Swarm. Zinogyvaz keeps her fangs and web Strikes in either form."}, {"name": "Create Spawn", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Blood, Zinogyvaz can turn this victim into a vampire by donating some of her own blood to the victim and burying the victim in earth for 3 nights.%rIf the new vampire is lower level than its creator, it is under the creator's control. If Zinogyvaz controls too many spawn at once (as determined by the GM), strong-willed spawn can free themselves by succeeding at a Will saving throw against Zinogyvaz's Will DC."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirement A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within Zinogyvaz's reach.%rEffect Zinogyvaz sinks her fangs into that creature to drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions.%rThe victim is Drained 1 and Zinogyvaz regains 24 healing Hit Points and may inject the victim with vampire drider venom. Any excess HP is gained as temporary Hit Points.…"}, {"name": "Turn to Mist", "type": "action", "traits": ["concentrate", "divine"], "cost": 1, "text": "Zinogyvaz turns into a cloud of vapor, as the Vapor Form spell, or back to her normal form. Zinogyvaz loses fast healing while in gaseous form.%rZinogyvaz can remain in this form indefinitely."}, {"name": "Vampire Drider Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 35 Fortitude%rMaximum Duration 6 rounds%rStage 1 3d8 poison damage and Enfeebled 2 (1 round)%rStage 2 4d8 poison damage and Paralyzed (1 round)"}, {"name": "Web Trap", "type": "passive", "traits": [], "text": "A creature hit by Zinogyvaz's web attack is Immobilized and stuck to the nearest surface (escape dc=35)."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
