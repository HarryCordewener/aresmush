  actions: [{"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a graveknight is destroyed, its armor rebuilds its body over the course of 1d10 days-or more quickly if the armor is worn by a living host. If the body is destroyed before then, the process restarts.%rA graveknight can only be permanently destroyed by obliterating its armor (such as with Disintegrate), transporting it to the Forge of Creation, or throwing it into the heart of a volcano."}, {"name": "Sacrilegious Aura", "type": "passive", "traits": ["aura", "divine", "evil"], "text": "30 feet. When a creature in the aura uses a vitality spell or ability, the graveknight automatically attempts to counteract it, with a counteract modifier of +24."}, {"name": "Status Bonus to Saves", "type": "passive", "traits": [], "text": "+1 status bonus to all saves vs. magic effects.%r+2 status bonus to all saves vs. mental effects."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Devastating Blast", "type": "action", "traits": ["arcane", "cold"], "cost": 2, "text": "The graveknight unleashes a 30-foot of energy. Creatures in the area take 8d12 cold|options:area-damage damage (DC 36 Reflex save).%rThe graveknight can use this ability once every 1d4 rounds."}, {"name": "Graveknight's Curse", "type": "passive", "traits": ["arcane", "curse"], "text": "This curse affects anyone who wears a graveknight's armor for at least 1 hour.%rSaving Throw DC 36 Will save%rOnset 1 hour%rStage 1 Doomed 1 and cannot remove the armor (1 day)%rStage 2 Doomed 2, the creature's Speed is reduced by 10, and cannot remove the armor (1 day)%rStage 3 dies and transforms into the armor's graveknight.%rEffect: Graveknight's Curse"}, {"name": "Heart-Seeking Strike", "type": "action", "traits": [], "cost": 3, "text": "The Shraen graveknight Steps once then Strikes with its rapier. A creature damaged by the attack must attempt a DC 36 Fortitude save. On a failure, the creature takes 4d6 bleed. On a critical failure, the attack pierces the creature's heart, and the creature dies."}, {"name": "Quick Draw", "type": "action", "traits": [], "cost": 1, "text": "The Shraen graveknight draws a weapon, then Strikes with it."}, {"name": "Ruinous Weapons", "type": "passive", "traits": [], "text": "At the time of its creation, a graveknight chooses one of the following energy types that was relevant to its life or death: acid, cold, electricity, or fire.%rAny weapon the graveknight wields gains the effects of the caustic , frost , shock , or flaming weapon rune, respectively, in addition to a +1 striking weapon rune.%rIf the graveknight is 14th level or higher, its weapons instead gain the effects of the greater versions of both of these runes."}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "The graveknight has access to the critical specialization effects of any weapons it wields."}]
