d and its armor takes damage as if hit by the adamantine golem's fist.%rThe golem Strides up to its Speed, pushing back each creature whose space it moves into and damaging them if they try to stop its movement. A creature can attempt to bar the way by succeeding at a Fortitude save."}, {"name": "Self-Repair", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The golem repairs itself, regaining 30 healing Hit Points."}, {"name": "Vent", "type": "action", "traits": ["fire"], "cost": 1, "text": "The golem vents a 30-foot of superheated steam from its internal forge. This deals 15d6 fire|options:area-damage damage to all creatures in the cone (DC 40 Reflex).%rThe golem can't use Vent again for 1d6 rounds."}]
