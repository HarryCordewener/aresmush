  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Attack of Opportunity (Special)", "type": "reaction", "traits": [], "text": "The mummy pharaoh can use Attack of Opportunity when a creature within its reach uses a concentrate action, in addition to its normal trigger. It can disrupt triggering concentrate actions, and it disrupts actions on any hit, not just a critical hit."}, {"name": "Great Despair", "type": "passive", "traits": ["aura", "divine", "emotion", "fear", "incapacitation", "mental"], "text": "30 feet. Living creatures are Frightened 1 while in a mummy pharaoh's despair aura. They can't naturally recover from this fear while in the area but recover instantly once they leave the area. When a creature first enters the area, it must succeed at a DC 25 Will save (after taking the penalty from being frightened) or be Paralyzed for 1 round. The creature is then temporarily immune for 24 hours.%rEffect: Despair"}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a mummy pharaoh is destroyed, necromantic energies rebuild its body in its tomb over 1d10 days. If the re-forming body is destroyed during that time, the process starts anew. A slain mummy pharaoh can be destroyed for good with a Consecrate ritual."}, {"name": "Undead Mastery", "type": "passive", "traits": ["aura", "divine"], "text": "100 feet. Commanded or allied undead in the aura that have a lower level than the mummy pharaoh gain a +1 circumstance bonus to attack rolls, damage rolls, AC, saves, and skill checks.%rEffect: Undead Mastery"}, {"name": "Channel Rot", "type": "passive", "traits": ["divine"], "text": "The mummy pharaoh can deliver insidious mummy rot through melee weapons it wields."}, {"name": "Insidious Mummy Rot", "type": "passive", "traits": ["curse", "disease", "divine"], "text": "This disease and any damage from it can't be healed until this curse is removed. A creature killed by insidious mummy rot turns to sand and can't be resurrected except by a 7th-rank Resurrect ritual or similar magic.%rSaving Throw DC 26 Fortitude%rStage 1 carrier with no ill effect (1 minute)%rStage 2 8d6 void damage and Stupefied 2 (1 day)"}, {"name": "Sandstorm Wrath", "type": "action", "traits": ["concentrate", "divine", "fire"], "cost": 2, "text": "The mummy pharaoh exhales a 60-foot of superheated sand that deals 5d6 fire damage and 5d6 slashing damage (DC 28 Reflex save).%rThe mummy pharaoh can't use Sandstorm Wrath again for 1d4 rounds."}]
