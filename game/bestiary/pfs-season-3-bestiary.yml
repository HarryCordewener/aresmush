changes to match that type), whichever comes first. The protean is immune to polymorph effects unless it is a willing target. If Blinded or Deafened, the protean…"}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(1d6+3) bludgeoning, DC 17 Fortitude"}, {"name": "Inflict Lesser Warpwave", "type": "action", "traits": ["divine"], "cost": 1, "text": "The pelagastr tail inflicts a lesser warpwave on a creature within 30 feet (DC 20 Fortitude save to resist).%rLesser Warpwave Effect D8 Lesser Warpwave Effect 1 Clumsy 1(Clumsy 2 on a critical failure) 2 Off-Guard and gain 1d6 healing Hit Points 3 Dazzled 4 Enfeebled 1(Enfeebled 2 on a critical failure) 5 Immobilized by filaments of energy 6 Quickened(Step, Stride, or Strike only) 7 Slowed 1 8 Stupefied 1(Stupefied 2 on a critical failure)"}, {"name": "Warping Squeeze", "type": "passive", "traits": ["divine"], "text": "Any creature damaged by the pelagastr tail's Constrict ability must succeed at a DC 20 Fortitude save or be subject to a lesser warpwave."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
