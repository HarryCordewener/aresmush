  actions: [{"name": "Despair", "type": "passive", "traits": ["aura", "divine", "emotion", "fear", "incapacitation", "mental"], "text": "30 feet. Living creatures are Frightened 1 while in a mummy guardian's despair aura. They can't naturally recover from this fear while in the area but recover instantly once they leave the area. When a creature first enters the area, it must succeed at a DC 22 Will save (after taking the penalty from being frightened) or be Paralyzed for 1 round. The creature is then temporarily immune for 24 hours.%rEffect: Despair"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Mummy Rot", "type": "passive", "traits": ["curse", "disease", "divine", "void"], "text": "This disease and any damage from it can't be healed until this curse is removed. A creature killed by mummy rot turns to dust and can't be resurrected except by a 7th-rank Resurrect ritual or similar magic.%rSaving Throw DC 24 Fortitude%rStage 1 carrier with no ill effect (1 minute)%rStage 2 4d6 void damage and Stupefied 1 (1 day)"}]
