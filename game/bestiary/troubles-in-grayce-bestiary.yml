  strikes: [{"name": "Greataxe", "bonus": 14, "damage": [["1d12+8", "slashing", null]], "traits": ["reach-10", "sweep"]}, {"name": "Jaws", "bonus": 14, "damage": [["1d8+8", "piercing", null]], "traits": ["unarmed"], "effects": ["Gluttons Feast", "Grab"]}]
  actions: [{"name": "Gummy Hands", "type": "passive", "traits": [], "text": "Candies' residue gives Aezar an especially strong grip on her greataxe, which grants her a +2 circumstance bonus to her Reflex DC against attempts to Disarm her."}, {"name": "Tooth Decay", "type": "passive", "traits": [], "text": "Frequent candy consumption has worsened Aezar's already poor dental health. If she takes 10 or more bludgeoning damage from a single attack or effect, she must attempt a DC 25 Fortitude save.%rSuccess Aezar yells in pain but is otherwise unaffected.%rFailure Several of Aezar's teeth break. She takes a –2 penalty to damage with her jaws Strike as well as to Athletics checks made as part of her Grab and Swallow Whole abilities. These penalties last until Aezar is restored to her Hit Point…"}, {"name": "Glutton's Feast", "type": "passive", "traits": [], "text": "If Aezar damages a living creature with her jaws Strike, she gains 1d6 temporary Hit Points for 1 minute%rEffect: Glutton's Feast (Aezar)"}, {"name": "Glutton's Rush", "type": "action", "traits": [], "cost": 2, "text": "Aezar Strides twice and makes a jaws Strike. If she damages a living creature with this Strike, the temporary Hit Points she receives from glutton's feast is increased to 2d6."}, {"name": "Sticky Axe", "type": "reaction", "traits": [], "text": "Trigger Aezar succeeds at a greataxe Strike against a creature%rEffect Aezar's axe has a lingering residue from striking various sweets, and the sticky blade clings to her most recent victim, giving Aezar momentary leverage. Aezar can attempt to reposition or trip the target using the greataxe's reach, even though she doesn't have a free hand.%rAlternatively, she can forgo either maneuver to drag the target toward her gaping mouth, granting her jaws unarmed Strike the agile trait for attacks…"}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Small, (2d4+4) bludgeoning, Rupture 18"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
