  strikes: [{"name": "Rapier", "bonus": 17, "damage": [["2d6+11", "piercing", null]], "traits": ["deadly-d8", "disarm", "finesse", "magical"]}, {"name": "Claw", "bonus": 17, "damage": [["1d8+8", "slashing", null]], "traits": ["agile", "unarmed"], "effects": ["Grab"]}]
  actions: [{"name": "Children of the Night", "type": "passive", "traits": ["divine", "mental"], "text": "The vampire's presence brings forth creatures of the night to do the master's bidding. These typically include Rat Swarms, Bat Swarms, and Wolves, but can include other creatures.%rThe vampire can give telepathic orders to these creatures as long as they are within 100 feet, but they can't communicate back."}, {"name": "Fast Healing 7", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Mist Escape", "type": "free", "traits": [], "text": "Trigger The Count of Petals is reduced to 0 HP%rEffect The Count of Petals uses Turn to Mist. He can take move actions to move toward his coffin even though he's at 0 HP. While at 0 HP in this form, the Count is unaffected by further damage. He automatically returns to his corporeal form, Unconscious, if he reaches his coffin or after 2 hours, whichever comes first."}, {"name": "Vampire Vulnerabilities", "type": "passive", "traits": [], "text": "All vampires possess the following vulnerabilities.%rCompulsions Vampires are creatures with strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless they're transported while they hide within their coffin, nor can they enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions—a pirate vampire might not be able to set foot on solid ground without being invited, for…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The vampire transforms into one of its animal forms or back into its normal form. Most vampires can turn into a bat, but some can turn into a different creature, such as a rat or a wolf.%rGiant Bat Senses echolocation 40 feet, Speed 20 feet, fly 30 feet, Melee fangs +15 Damage 1d8+9 piercing"}, {"name": "Create Servitor", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Blood, the Count of Petals can turn this victim into a vampire servitor by donating some of his own blood to the victim and burying them in earth for 3 nights. A vampiric servitor is compelled to obey its creator, but if the Count of Petals controls too many vampiric servitors at once (as determined by the GM), or if the servitor is a higher level than the vampire that created it, strong-willed servitors can free themselves by succeeding…"}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "The Count of Petals can cast Dominate at will as a divine innate spell. Casting it requires staring into the target's eyes, giving the spell the visual trait. The save DC for this ability is 22, and a creature that succeeds is temporarily immune to his Dominate for 24 hours. Fully destroying the Count of Petals ends the domination, but merely reducing the vampire to 0 HP is insufficient to break the spell."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirement A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the vampire's reach.%rEffect The vampire sinks its fangs into that creature to drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions.%rThe victim is Drained 2 and the vampire regains 10 HP, gaining any excess HP as temporary Hit Points. Drinking Blood from a creature that's already drained doesn't restore…"}, {"name": "Soporific Stench", "type": "action", "traits": ["aura", "incapacitation", "olfactory"], "cost": 2, "text": "10 feet. For 3 rounds, the Count of Petals reeks of the perfumed sweetness of spoiled flowers, which makes others sluggish and confused. A creature entering the aura or starting its turn in the aura must attempt a DC 22 Fortitude save.%rCritical Success The creature is unaffected.%rSuccess The creature is Stupefied 1.%rFailure The creature is Stupefied 2%rCritical Failure The creature is Stupefied 3 and Slowed 1."}, {"name": "Turn to Mist", "type": "action", "traits": ["air", "concentrate", "divine", "polymorph"], "cost": 1, "text": "The Count of Petals turns into a cloud of vapor, as the Vapor Form spell, or back to his normal form. He loses fast healing while turned to mist. The count can remain in this form indefinitely."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
