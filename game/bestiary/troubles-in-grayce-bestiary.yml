  actions: [{"name": "Echolocation", "type": "passive", "traits": [], "text": "The Path River Peeler can use its hearing as a precise sense at the listed range."}, {"name": "Flight Response", "type": "reaction", "traits": [], "text": "Trigger The Path River Peeler gains the Frightened condition or its frightened condition increases%rEffect The Peeler Strides or Climbs up to its Speed. The Peeler gains a +2 circumstance bonus to AC against reactions triggered by this movement."}, {"name": "Sensitive Ears", "type": "passive", "traits": [], "text": "The Path River Peeler's oversized ears make it particularly sensitive to loud noises. A creature that attempts to Demoralize the Peeler by shouting, banging on a shield, or similar tactic ignores the usual –4 circumstance penalty for not sharing a language with the Peeler. Whenever the Peeler takes sonic damage, it must succeed at a DC 16 Will saving throw or be Frightened 1 (or Frightened 2 on a critical failure)."}, {"name": "Blood Run Cold", "type": "action", "traits": ["cold", "concentrate", "manipulate", "occult"], "cost": 2, "text": "The Path River Peeler extends a bony finger at a creature it can see within 60 feet, draining heat from the creature's body and sapping the strength from their muscles. The creature takes 4d6 cold damage with a DC 20 Will save. On a failure, the creature is also Enfeebled 1 for 10 minutes (or Enfeebled 2 for an hour on a critical failure). The Peeler can't use Blood Run Cold again for 1d4 rounds."}, {"name": "Otherworldly Cry", "type": "action", "traits": ["auditory", "emotion", "fear", "mental"], "cost": 1, "text": "The Path River Peeler makes an eerie, spine-tingling vocalization that can be heard up to a mile away. Each creature in a 60-foot emanation must attempt a DC 20 Will save. Regardless of the result, a creature is temporarily immune to the Peeler's Otherworldly Cry for 10 minutes.%rCritical Success The creature is unaffected.%rSuccess The creature is Frightened 1.%rFailure The 