  strikes: [{"name": "Orc Necksplitter", "bonus": 13, "damage": [["2d8+6", "slashing", null]], "traits": ["forceful", "magical", "orc", "sweep"]}, {"name": "Claw", "bonus": 12, "damage": [["2d6+6", "slashing", null]], "traits": ["agile", "unarmed"], "effects": ["Grab"]}, {"name": "Jaws", "bonus": 12, "damage": [["1d10+6", "piercing", null]], "traits": ["unarmed"]}]
  actions: [{"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "10 feet, DC 18 Fortitude"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Chopping Frenzy", "type": "action", "traits": [], "cost": 2, "text": "Requirements Alendreu is wielding an orc necksplitter in each hand%rEffect Alendreu lashes out with both axes. He attempts two Strikes, one with each necksplitter, each using his current multiple attack penalty. Both Strikes must have the same target, and the second strike takes a –2 penalty.%rIf both hit, combine their damage and apply resistances and weaknesses only once, and the target becomes Off-Guard from the fury of the blow until the start of their next turn. This counts as two attacks…"}, {"name": "Consume Flesh", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The ghoul is adjacent to the corpse of a creature that died within the last hour.%rEffect The ghoul devours a chunk of the corpse and regains (1+(max(0,floor(@actor.level/2))))d6 healing Hit Points.%rIt can regain Hit Points from any given corpse only once."}, {"name": "Ghoul Whispers", "type": "action", "traits": ["auditory", "linguistic", "occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, or Unconscious creature is within the ghoul's reach%rEffect The ghoul whispers dark thoughts and vile cravings into the creature's ears. The creature must save against the forbidden cravings curse.%rForbidden Cravings (curse) A creature can still eat and drink while sickened by this curse%rSaving Throw DC 21 Will, using the high spell DC for the ghoul's level%rStage 1 carrier with no ill effects (1 day)%rStage 2 2d6 void damage and the target is…"}, {"name": "Grave Knowledge", "type": "passive", "traits": ["occult"], "text": "Frequency once per hour%rEffect The ghoul calls upon knowledge it retains from one creature it has consumed in the past 7 days. The ghoul attempts a skill check using a skill in which the consumed creature was trained (if it's unclear whether the creature was trained, the GM decides). The ghoul is treated as trained and uses the high skill modifier for the ghoul's level (1d20+12). This takes the same amount of actions or time as usual for the check.%rThe ghoul can instead automatically learn…"}, {"name": "Swift Leap", "type": "action", "traits": ["move"], "cost": 1, "text": "The ghoul jumps up to half its Speed. This movement doesn't trigger reactions."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
