  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Verdant Burst", "type": "passive", "traits": ["healing", "primal", "vitality"], "text": "When a fungus leshy dies, a burst of primal energy explodes from its body, restoring 2d8 healing Hit Points to each fungi creature in a 30-foot. This area is filled with fungi, becoming difficult terrain.%rIf the terrain is not a viable environment for this fungi, they wither after 24 hours."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "The fungus leshy transforms into a giant mushroom or patch of fungi. This ability otherwise uses the effects of One with Plants."}, {"name": "Spore Cloud", "type": "action", "traits": ["poison"], "cost": 2, "text": "A fungus leshy can unleash a cloud of spores that irritates the eyes and throats of non-fungus creatures in a 15-foot. Each creature must succeed at a DC 16 Fortitude save or take 1 persistent poison|options:area-damage damage.%rA creature has its vision reduced as long as the persistent damage continues and can see only within 20 feet."}, {"name": "Spores", "type": "passive", "traits": [], "text": "A creature that takes damage from a fungus leshy's spore pod Strike must attempt a saving throw with the same DC (DC 16 Fortitude) and effect as its Spore Cloud ability"}]
