  actions: [{"name": "Hypnotic Glow", "type": "passive", "traits": ["aura", "light", "mental"], "text": "30 feet. Similar to other will-o'-wisps, a gloaming will-o'-wisp is naturally invisible, but glows with a faint colored light. They cast dim light in the aura, which makes them visible. In addition, any non-aberration creature that ends their turn in the aura and can see the gloaming will-o'-wisp is distracted by the gloaming will-o'-wisp's glow and must attempt a DC 31 Will save. On a failure, the creature is Stupefied 1 for 1 round and takes 3d6 mental damage."}, {"name": "Magic Immunity", "type": "passive", "traits": [], "text": "A will-o'-wisp is immune to all spells except Faerie Fire, Revealing Light, Force Barrage, and Quandary."}, {"name": "Feed on Fear", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Requirement An enemy is under a fear effect or Dying within 15 feet of the will-o'-wisp%rEffect The will-o'-wisp feeds on the creature's terror. They regains 4d8 healing Hit Points, and if they've Gone Dark, their glow reignites. A will-o'-wisp can take this action only once per round."}, {"name": "Go Dark", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "The gloaming will-o'-wisp extinguishes their hypnotic glow, becoming Invisible. They can end this effect with another use of this action. If they use their shock attack while invisible, the arc of electricity lets any observer determine their location, making the will-o'-wisp only Hidden to observers until they move."}]
