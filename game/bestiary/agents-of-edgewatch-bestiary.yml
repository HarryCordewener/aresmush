  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Lifesense 30 feet", "type": "passive", "traits": []}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Displacement", "type": "passive", "traits": ["divine", "illusion", "visual"], "text": "An astradaemon bends light, appearing shifted from its true position, though still in the same space.%rCreatures targeting the astradaemon must attempt a DC 11 Flat check, as if the astradaemon were hidden, even though it remains observed.%rEffects such as the Blind-Fight feat and halfling's Keen Eyes that apply on the flat check against hidden creatures also apply against a displaced astradaemon."}, {"name": "Soul Siphon", "type": "passive", "traits": ["aura", "divine", "force"], "text": "30 feet. An astradaemon draws power from the souls of the recently slain. If a Small or larger living creature dies within its aura, the astradaemon gains 5 temporary Hit Points and a +1 status bonus to attack and damage rolls for 1 round, unless the creature was slain by an astradaemon's Devour Soul ability.%rIncorporeal undead and living spirits traveling outside the body take 1d8 force damage each round within the daemon's aura from the spiritual pressure as the astradaemon pulls in…"}, {"name": "Essence Drain", "type": "passive", "traits": ["divine", "void"], "text": "When an astradaemon hits with its claw, jaws, or tail, it drains the target's spiritual and vital essences.%rThe target takes 2d10 void damage and the astradaemon regains an equal number of Hit Points. The target must succeed at a DC 37 Fortitude save or become Doomed 1 and Drained 1.%rIf the target was already drained or doomed, it instead increases both conditions' value by 1, to a maximum of 4."}, {"name": "Mortal Shell", "type": "action", "traits": ["divine"], "cost": 2, "text": "Requirements The astradaemon has killed a Large or smaller creature with Overtake Soul within the past 24 hours and that creature is within the daemon's reach%rEffect The astradaemon takes over and wears the body of their victim. This automatically creates a disguise to allow the astradaemon to Impersonate the target creature. The body has a number of Hit Points equal to 3 times the level of the creature. Any damage targeting the astradaemon damages the body first. Once the body is reduced to 0…"}, {"name": "Overtake Soul", "type": "action", "traits": ["death", "divine", "incapacitation"], "cost": 1, "text": "Requirements The astradaemon hasn't used an action with the attack trait yet this turn.%rEffect The astradaemon draws out and consumes the soul of a living creature it has Grabbed. The creature must succeed at a DC 39 Fortitude save or instantly die. If it dies, the astradaemon gains 10 temporary Hit Points.%rEffect: Overtake Soul"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
