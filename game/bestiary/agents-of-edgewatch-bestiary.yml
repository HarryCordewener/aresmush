  actions: [{"name": "Dubious Shifting", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "The zrukbat assumes the shape of any Small object or ornamentation, although the zrukbat's mimicked objects usually have unrealistic or suspicious quirks.%rThis doesn't change the zrukbat's size but can alter their coloration and visual appearance.%rThey have an automatic result of 23 on Deception checks and DCs to pass as the mimicked object."}, {"name": "Go for the Eyes", "type": "action", "traits": [], "cost": 2, "text": "The zrukbat flies up to its Speed and makes a claw Strike at the end of its move.%rIf the claw attack hits, the target must succeed on a DC 15 Fortitude saving throw or be Blinded for 1 round (or blinded for 1 minute on a critical failure). If the Strike was a critical hit, the target's save result is one degree of success worse."}]
