  actions: [{"name": "Emotion Sense 120 feet", "type": "passive", "traits": ["emotion", "mental"], "text": "A teraphant can sense the emotions of creatures within 120 feet as an imprecise sense. Emotion sense is a precise sense against creatures under an emotion effect. A creature under the effects of Calm can't be noticed via emotion sense."}, {"name": "Empathetic Response", "type": "reaction", "traits": [], "text": "Trigger A creature within 60 feet of the teraphant is targeted by a spell or ability with the emotion trait%rEffect The teraphant also benefits from the spell or effect, as though it were an additional target for 1 minute or until the triggering spell or ability ends."}, {"name": "Impale", "type": "action", "traits": [], "cost": 2, "text": "Requirement The teraphant has a creature Grabbed%rEffect The teraphant slams the creature onto one of its horns. The target must attempt a DC 27 Reflex save or suffer (3d6+9) piercing,1d6 bleed damage ((6d6+18) piercing,1d6 bleed damage on a critical failure)."}, {"name": "Psychokinetic Trumpet", "type": "action", "traits": [], "cost": 2, "text": "The teraphant lets out a loud trumpet that deals 8d8 mental|options:area-damage damage (DC 27 Will save) in a 30-foot. A creature that fails its save is also pushed 15 feet (30 feet on a critical failure).%rIf a pushed creatures strikes a solid barrier, it takes 3d6 bludgeoning damage and stops.%rThe teraphant can't use Psychokinetic Trumpet again for 1d4 rounds."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Large or smaller, foot, DC 27 Reflex"}, {"name": "Grabbing Trunk", "type": "passive", "traits": [], "text": "A Medium or smaller creature hit by the teraphant's trunk is Grabbed. If the teraphant moves, it can bring the grabbed creature along with it."}]
