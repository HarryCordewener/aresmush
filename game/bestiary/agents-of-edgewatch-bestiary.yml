  actions: [{"name": "Smoke Vision", "type": "passive", "traits": [], "text": "Smoke doesn't impair an agradaemon's vision; it ignores the Concealed condition from smoke."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Choking Smog", "type": "passive", "traits": ["air", "aura", "fire"], "text": "100 feet. The agradaemon is surrounded by ashy smoke. Creatures within the aura are concealed, and creatures outside of it are concealed to creatures within it. Non-daemon creatures can't breathe in the aura and must hold their breath or suffocate."}, {"name": "Daemonic Pledge", "type": "action", "traits": ["divine", "healing"], "cost": 3, "text": "Frequency once per day%rEffect The agradaemon designates a single willing mortal as a pledged fanatic. That creature gains resistance to fire equal to its level, immunity to the agradaemon's choking smog aura, and smoke vision.%rThe agradaemon can have up to 10 pledged fanatics at one time and can remove the status from any number of pledged fanatics as a free action with the concentrate trait. The status can also be removed with an Atone ritual."}, {"name": "Proven Devotion", "type": "action", "traits": ["concentrate", "evil", "fire"], "cost": 1, "text": "The agradaemon regains 15 untyped Hit Points, and a pledged fanatic of the agradaemon's choice that it can see loses 15 Hit Points (no effects apply that would decrease this Hit Point loss).%rA pledged creature that dies in this way explodes and deals 9d10 fire|options:area-damage damage in a 20-foot (DC 41 Reflex save)."}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}]
