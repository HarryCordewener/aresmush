  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Free Blade", "type": "free", "traits": [], "text": "Trigger The ghaele ends its turn while unable to act or attempts a greatsword Strike that would take a circumstance or status penalty.%rEffect A ghaele's blade is implacable in the pursuit of freedom, and its energies can overpower any effect that would interfere with its swordplay.%rThe ghaele attempts to counteract each effect that prevents it from making a greatsword Strike, gives it a penalty to its greatsword Strike, or prevents it from acting.%rThe ghaele can use this ability even if it's…"}, {"name": "Light Form", "type": "passive", "traits": [], "text": "A ghaele's body is partially corporeal and partially composed of light, with a color corresponding to the elemental energy currently residing in its blade (see Choose Weakness).%rIt can move through solid objects but can't end its action within a solid object."}, {"name": "Choose Weakness", "type": "action", "traits": ["concentrate", "divine", "manipulate"], "cost": 1, "text": "A ghaele attempts to Recall Knowledge about a foe they are facing.%rIf successful, they can change the elemental damage dealt by their greatsword and light ray to acid, cold, electricity, fire, or sonic, usually to match the foe's weakness.%rThey can also change their energy resistance to any of these energy types (this can be a different type than for their attacks).%rThe choices remain until they next use Choose Weakness."}, {"name": "Ghaele's Gaze", "type": "action", "traits": ["divine", "visual"], "cost": 1, "text": "When a ghaele fixes their gaze upon a non-good creature, the creature is subjected to the effects of Divine Decree (DC 20 Will save).%rIf it survives, the creature is temporarily immune to for 1 minute."}, {"name": "Greater Holy Blade", "type": "passive", "traits": ["divine"], "text": "Any weapon becomes a +3 Holy Greater Striking weapon while the ghaele wields it."}]
