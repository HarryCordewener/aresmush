  actions: [{"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a graveknight is destroyed, its armor rebuilds its body over the course of 1d10 #days days-or more quickly if the armor is worn by a living host. If the body is destroyed before then, the process restarts.%rA graveknight can only be permanently destroyed by obliterating its armor (such as with Disintegrate), transporting it to the Forge of Creation, or throwing it into the heart of a volcano."}, {"name": "Sacrilegious Aura", "type": "passive", "traits": ["aura", "divine", "evil"], "text": "30 feet. When a creature in the aura uses a vitality spell or ability, the graveknight automatically attempts to counteract it, with a +27 counteract modifier."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Devastating Blast", "type": "action", "traits": ["arcane", "fire"], "cost": 2, "text": "The graveknight unleashes a 30-foot of energy.%rCreatures in the area take 10d12 fire|options:area-damage damage (DC 37 Reflex save).%rThe graveknight can't use this ability again for 1d4 rounds."}, {"name": "Graveknight's Curse", "type": "passive", "traits": [], "text": "This curse affects anyone who wears a graveknight's armor for at least 1 hour%rSaving Throw DC 43 Will save%rOnset 1 hour%rStage 1 Doomed 1 and can't remove the armor (1 day)%rStage 2 Doomed 2, hampered 10, and can't remove the armor (1 day)%rStage 3 dies and transforms into the armor's graveknight"}, {"name": "Kharnas's Blessing", "type": "action", "traits": [], "cost": 2, "text": "The graveknight carves the sigil of Kharnas onto an adjacent Immobilized or Unconscious creature.%rAs long as the creature bears the sigil of Kharnas, it takes a -2 status penalty to saving throws against the abilities of any creature that previously served Kharnas, but it can also freely pass through any hazards that can be bypassed by those bearing the sigil of Kharnas, such as Kharnas's glyphs.%rEffect: Kharna's Blessing"}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "The graveknight has access to the critical specialization effects of any weapons it wields."}]
