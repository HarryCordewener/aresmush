  actions: [{"name": "Planar Coven", "type": "passive", "traits": [], "text": "As long as at least one other member of Myrna's coven is on the demiplane of Stormholt, the coven members add chain lightning, lightning bolt , plane shift , and punishing winds to their spells, each of which can be cast at up to 8th level."}, {"name": "Sea Hag's Bargain", "type": "passive", "traits": ["occult"], "text": "The sea hag can make a bargain with a willing creature, who must be of sound mind. The creature gives away a special or cherished quality-such as its courage, its beauty, or its voice-in exchange for a boon or a promise from the sea hag. As long as the sea hag keeps her end of the bargain, the only way to restore the lost quality is to defeat the sea hag or make another bargain for its return."}, {"name": "Dread Gaze", "type": "action", "traits": ["curse", "emotion", "fear", "mental", "occult"], "cost": 2, "text": "The hag gazes upon a creature, afflicting it with intense distress and a gnawing sense of impending doom, with a result depending on its DC 37 Will save. The target does not need to be able to see the sea hag.%rCritical Success No effect.%rSuccess Frightened 1.%rFailure Frightened 1 and Slowed 1 for 1 round. If the target was Dying, it remains Unconscious for 1 day. At the end of the day, it must attempt a DC 37 Fortitude save against the same DC; if it fails, it dies.%rCritical Failure…"}, {"name": "Pull Under", "type": "action", "traits": ["extradimensional", "teleportation"], "cost": 2, "text": "Requirements A creature within 60 feet of Graem or Grinlowe is in contact with the waters of Stormholt%rEffect The hag casts maze (DC 37) on the creature, magically pulling the creature beneath the water (regardless of its actual depth) into an extradimensional underwater maze of shipwrecks. Between the two of them, Graem and Grinlowe can have only one creature trapped in the maze, but either hag can use the Sustain a Spell action to sustain the effect."}]
