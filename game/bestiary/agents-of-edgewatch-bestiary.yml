  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Truth Vulnerability", "type": "passive", "traits": [], "text": "A glabrezu's lies sustain them, and the truth can destroy them. Whenever a revelation effect counteracts or reveals the glabrezu's illusions or the glabrezu fails a save against an effect that would prevent them from lying (such as zone of truth), the demon takes (3d6+4) mental damage. They take this damage only once per effect, even if the effect reveals multiple illusions or prevents multiple lies."}, {"name": "Captive Rake", "type": "action", "traits": [], "cost": 1, "text": "Requirements A creature is grabbed in the glabrezu's pincer.%rEffect The glabrezu pulls the grabbed creature up to 5 feet closer, then makes two claw Strikes against it. Those Strikes count as one attack when determining a treachery demon's multiple attack penalty, and the penalty doesn't increase until after both Strikes."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "When a reaction would disrupt a glabrezu's spell, the demon can attempt a DC 17 Flat check, avoiding the disruption on a success."}, {"name": "Sudden Betrayal", "type": "passive", "traits": [], "text": "A glabrezu can always use Deception when rolling initiative as long as they're aware of at least one opponent before initiative is rolled. When using Deception for initiative, the demon gains a +2 circumstance bonus to Deception."}, {"name": "Tentacle Trip", "type": "reaction", "traits": [], "text": "Trigger A creature within 15 feet of the lie-master uses a manipulate or move action, makes a ranged attack, or leaves a square during a move action it's using%rEffect The creature must succeed at a DC 34 Reflex save or be knocked prone by the lie-master's clockwork tentacles."}, {"name": "Treacherous Veil", "type": "passive", "traits": [], "text": "A glabrezu's Illusory Disguise can allow it to appear as a creature of any size."}, {"name": "Twisted Desires", "type": "passive", "traits": ["divine"], "text": "Once per month, a glabrezu can grant a mortal humanoid the effects of a Miracle spell granted by an Abyssal patron, though the glabrezu always perverts the Miracle according to their own treacherous nature."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1, "text": "Requirements The monster's last action was a success with a Strike that lists Grab in its damage entry, or it has a creature grabbed using this action.%rEffect The monster automatically Grabs the target until the end of the monster's next turn. The creature is grabbed by whichever body part the monster attacked with, and that body part can't be used to Strike creatures until the grab is ended. Using Grab extends the duration of the monster's Grab until the end of its next turn for all creatures…"}]
