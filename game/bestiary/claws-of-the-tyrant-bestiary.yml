  actions: [{"name": "Stored Items", "type": "passive", "traits": [], "text": "Stored Items Brumesgarth can store items inside his body, as detailed below. Brumesgarth can Interact to remove or store an item. If Brumesgarth's body is destroyed, any stored items appear among his bones.%rArm Wands (extradimensional) Brumesgarth can store up to two wands in the radius and ulna of one of his arms. These wands can be used as if wielded, and they can't be disarmed. If an arm wand is overcharged, Brumesgarth takes 20 untyped damage if the wand is broken or 40 untyped damage if…"}, {"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "60 feet. DC 38 Will"}, {"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When Brumesgarth is destroyed, his soul immediately transfers to his Soul Cage . Brumesgarth can be permanently destroyed only if his soul cage is found and destroyed."}, {"name": "Spellstealing Counter", "type": "reaction", "traits": ["occult"], "text": "Trigger A creature Brumesgarth can see Casts a Spell%rRequirements Brumesgarth has fewer than three spells stored in his spell tome%rEffect Brumesgarth expends a spell slot of the same rank as the spell being cast to counter the triggering creature's casting. Brumesgarth loses his spell slot as if he had cast the triggering spell. Brumesgarth then attempts to counteract the triggering spell (counteract modifier +35). If successful, the spell is countered and added to Brumesgarth's spell tome."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consult the Text", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Frequency once per day%rEffect Brumesgarth causes the pages of his spell tome to flip open, revealing an occult spell of 9th rank or lower of his choice. For the remainder of the day, Brumesgarth can cast that spell as if it were one of his spells known for every rank of its base rank up to 9th."}, {"name": "Drain Spell Tome", "type": "free", "traits": [], "text": "Effect Brumesgarth draws upon the magic stored in his spell tome to cast one of the spells he has countered. This spell is the same rank as the one countered, but it uses Brumesgarth's spell DC and spell attack. Casting a spell in this way removes it from the spell tome."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Brumesgarth's spellcasting action, he attempts a DC 15 Flat. On a success, the action isn't disrupted."}, {"name": "Summon Weapon", "type": "free", "traits": [], "text": "Requirements Brumesgarth has a stored weapon in his arm and has that hand free%rEffect Brumesgarth summons his stored weapon into that arm's hand."}]
