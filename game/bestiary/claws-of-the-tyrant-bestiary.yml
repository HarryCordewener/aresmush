  actions: [{"name": "Firefly's Remembrance", "type": "passive", "traits": [], "text": "Engerras embody the ethos of honoring the dead. When the engerra Recalls Knowledge about a creature whose final words it has heard spoken aloud, it uses the outcome one degree of success better than the result of its roll."}, {"name": "+1 Status Bonus to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Disperse", "type": "action", "traits": ["move"], "cost": 2, "text": "The engerra Strides or Flies. This movement doesn't trigger reactions. During the movement, the engerra can move through occupied spaces and tiny cracks, and it ignores difficult terrain and greater difficult terrain. It then coalesces back into its normal form."}, {"name": "Dying Breath", "type": "action", "traits": ["divine", "emotion", "fear", "mental"], "cost": 2, "text": "The engerra draws the air from around breathing creatures in a 40-foot emanation, giving them the feeling of drawing their last breath. Enemies in the area must attempt a DC 26 Will save. If at least one creature fails the save, the engerra can gift the stolen breath to a willing creature within 40 feet, granting that creature 2d6 #Temp HP temporary Hit Points that last for 1 minute.%rSuccess The creature is unaffected.%rFailure The creature takes (2d6+7) mental|options:area-damage damage and…"}, {"name": "Final Words of Doom", "type": "action", "traits": ["auditory", "divine", "emotion", "linguistic", "mental"], "cost": 2, "text": "The engerra whispers words of doom to an enemy within 40 feet. The creature must attempt a DC 26 Will save.%rCritical Success As success, and the creature is temporarily immune for 1 minute.%rSuccess The creature is unaffected.%rFailure The creature takes (3d8+13) mental damage and is Doomed 1 for 1 minute.%rCritical Failure The creature takes (4d8+18) mental damage and is Doomed 2 for 1 minute."}, {"name": "Final Words of Wisdom", "type": "passive", "traits": ["auditory", "divine", "emotion", "linguistic", "mental"], "text": "The engerra finds words to bolster a creature's spirits. The engerra spends 10 minutes speaking with a willing creature. If that creature has the Fatigued condition, it's no longer fatigued. The creature can't benefit from any engerra's Final Words of Wisdom again for 1 year."}]
