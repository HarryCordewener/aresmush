  actions: [{"name": "Broken Fate", "type": "passive", "traits": ["misfortune"], "text": "The chained norn automatically rolls a 1 when she rolls initiative."}, {"name": "Broken Triumvirate", "type": "passive", "traits": [], "text": "The chained norn's fate has been severed from the rest of the norns. She can't join a triumvirate or willingly take a hostile action against a norn."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 20 (Deactivated by Cold Iron)", "type": "passive", "traits": []}, {"name": "Broken Fates Aura", "type": "passive", "traits": ["aura", "mental", "misfortune", "occult"], "text": "60 feet. Creatures other than norns in the aura must attempt a DC 42 Will save. On a successful save, the creature is temporarily immune to the broken fates aura for 24 hours. On a failure, the creature can't benefit from effects with the fortune trait for 24 hours."}, {"name": "Rewind Fate", "type": "reaction", "traits": ["misfortune", "occult"], "text": "Trigger A creature within 120 feet would succeed on an attack or skill check%rEffect The creature must attempt the attack or skill check again, rolling twice and taking the worse result."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Fated", "type": "passive", "traits": [], "text": "When a creature is subject to a misfortune effect from a norn and a fortune effect from any source other than a norn (or vice versa), the norn's effect automatically counteracts the other effect and then takes place normally, rather than the two effects canceling each other out. If both the fortune and misfortune effect are from a norn, then the two cancel each other out as normal. At the GM's discretion, powerful entities related to fate or luck, like Desna, Magdh, or Pharasma, can't have…"}, {"name": "Sever Fate", "type": "passive", "traits": ["occult"], "text": "When a norn deals void damage with a Strike, she regains 10 healing Hit Points. The target must succeed at a DC 39 Fortitude save or become Drained 1 (Drained 2 on a critical failure).%rFurther void damage dealt by the norn increases the drained condition value by 1 on a failed save (or by 2 on a critical failure), to a maximum of drained 4."}]
