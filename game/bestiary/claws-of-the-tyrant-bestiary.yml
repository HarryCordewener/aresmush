  actions: [{"name": "Skeletal Lore", "type": "passive", "traits": ["divine"], "text": "Onturat taps into the memories of the creatures whose bones make up his body. This gives him the Skeletal Lore skill, which he can use to Recall Knowledge of any kind. In addition, he can speak and understand all the languages known by the creatures whose bones make up his body (typically Common and the regional language of the skulltaker's home region). Onturat can use Skeletal Lore as the primary skill check for the Collective Memories ritual, and he can cast collective memories without…"}, {"name": "+1 Status to All Saves Vs. Vitality", "type": "passive", "traits": []}, {"name": "Shard Storm", "type": "passive", "traits": ["air", "aura", "divine"], "text": "10 feet.%rA cloud of bone shards surrounds the skulltaker. When a creature moves into the emanation or begins its turn there, shard storm deals 4d6 slashing damage and 4d6 void damage to the creature, with a DC 42 Reflex save.%rIf the creature has resistance or immunity to void damage, or an effect that protects it against death effects, or an effect that protects it against the Doomed or Drained condition, the creature must first succeed at a DC 42 Will save or have all such benefits…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Bonetaker", "type": "passive", "traits": ["divine"], "text": "Whenever a creature dies within 60 feet of a skulltaker, the skulltaker draws a portion of the creature's bones into its shard storm. The creature must succeed at a DC 40 Will save or rise as a Skeletal Champion in 1d4 rounds. These skeletal champions are controlled by the skulltaker."}, {"name": "Splintered Ground", "type": "action", "traits": [], "cost": 1, "text": "The skulltaker causes splintered bones to erupt from all solid surfaces in a 100-foot emanation, except for surfaces of worked stone. A creature moving through the bones takes 10 piercing damage and 10 void damage for every 5 feet of movement. The