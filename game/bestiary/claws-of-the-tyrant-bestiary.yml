  actions: [{"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "10 feet. DC 22 Fortitude"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consume Flesh", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The ghoul is adjacent to the corpse of a creature that died within the last hour.%rEffect The ghoul devours a chunk of the corpse and regains (1+(max(0,floor(@actor.level/2))))d6 healing Hit Points.%rIt can regain Hit Points from any given corpse only once."}, {"name": "Ghoul Whispers", "type": "action", "traits": ["auditory", "linguistic", "occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, or Unconscious creature is within the ghoul's reach%rEffect The ghoul whispers dark thoughts and vile cravings into the creature's ears. The creature must save against the forbidden cravings curse.%rForbidden Cravings (curse) A creature can still eat and drink while sickened by this curse%rSaving Throw DC 22 Will, using the high spell DC for the ghoul's level%rStage 1 carrier with no ill effects (1 day)%rStage 2 2d6 void damage and the target is…"}, {"name": "Grave Knowledge", "type": "passive", "traits": ["occult"], "text": "+13 skill modifier%rFrequency once per hour%rEffect The ghoul calls upon knowledge it retains from one creature it has consumed in the past 7 days. The ghoul attempts a skill check using a skill in which the consumed creature was trained (if it's unclear whether the creature was trained, the GM decides). The ghoul is treated as trained and uses a +13 modifier. This takes the same amount of actions or time as usual for the check.%rThe ghoul can instead automatically learn something specific…"}, {"name": "Hunt Prey", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Omelia designates a single creature she can see and hear, or one she's Tracking, as her prey. She gains a +2 circumstance bonus to Perception checks to Seek the prey and to Survival checks to Track the prey. The first time Omelia hits her designated prey in a round, she deals an additional 1d8 precision damage. These effects last until she uses Hunt Prey again."}, {"name": "Swift Leap", "type": "action", "traits": ["move"], "cost": 1, "text": "The ghoul jumps up to half its Speed. This movement doesn't trigger reactions."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
