  actions: [{"name": "Blind-Fight", "type": "passive", "traits": [], "text": "Arsiella doesn't need to succeed at a flat check to target Concealed creatures. She isn't Off-Guard to creatures that are Hidden from her (unless she's off-guard to them for reasons other than the hidden condition) and only needs a successful DC 5 Flat to target a hidden creature."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "For Nirmathas!", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Arsiella makes two battle axe Strikes against the same target. Both Strikes use Arsiella's current multiple attack penalty, but each Strike takes a –2 penalty. A target hit by both attacks on the same turn must also succeed at a DC 26 Fortitude saving throw or be knocked Prone."}, {"name": "Heavenly Strike", "type": "action", "traits": ["divine"], "cost": 2, "text": "Arsiella calls on the spirit of her father and the strength of Iomedae to infuse her weapon, then Strikes with that weapon. If the Strike hits, Arsiella deals an extra weapon die of vitality damage."}, {"name": "Hunt Prey", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Arsiella designates a single creature she can see and hear, or one she's Tracking, as her prey. She gains a +2 circumstance bonus to Perception checks to Seek her prey and to Survival checks to Track her prey. The first time she hits her designated prey in a round, she deals an additional 1d8 precision damage. She also ignores the penalty for making ranged attacks within the second range increment when attacking her prey. These effects last until she uses Hunt Prey again."}, {"name": "Quick Draw", "type": "action", "traits": [], "cost": 1, "text": "Arsiella draws a weapon, then Strikes with that weapon."}, {"name": "Skirmish Strike", "type": "action", "traits": [], "cost": 1, "text": "Arsiella either Steps and then Strikes, or Strikes and then Steps."}]
