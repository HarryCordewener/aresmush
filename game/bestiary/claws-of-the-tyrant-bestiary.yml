  actions: [{"name": "Mounted", "type": "passive", "traits": [], "text": "When not mounted, the raised cavalry is slowed 1."}, {"name": "Shuffle Forces", "type": "passive", "traits": [], "text": "The raised cavalry consists of skeletons, zombies, and other undead hastily bound to a shared cause. The cavalry has resistance 20 to physical damage, as it shuffles its weakest members to the front lines. When the cavalry is reduced to 12 squares or fewer, its resistance to physical drops to 10. Once the cavalry reaches the 2-segment threshold, it loses its resistance to physical damage."}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 360 (4 segments), 240 (3 segments), 140 (2 segments)"}, {"name": "Troop Movement", "type": "passive", "traits": []}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Claws and Jaws", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect Members of the cavalry leap from their mounts and attack each enemy within 10 feet (DC 41 Reflex save).%rThe damage depends on the number of actions.%r1 2d12+14 piercing and slashing plus 1d12 void%r2 3d12+14 piercing and slashing plus 1d12 void%r3 4d12+14 piercing and slashing plus 1d12 void"}, {"name": "Hail of Arrows", "type": "action", "traits": [], "cost": 2, "text": "Members of the raised cavalry draw or reload their shortbows, then launch a ranged attack in the form of a volley. This volley is a 10-foot burst within 60 feet that deals 7d8 piercing|options:area-damage damage (DC 41 Reflex save). When the cavalry is reduced to 2 segments, this area decreases to a 5-foot burst."}, {"name": "Trampling Charge", "type": "action", "traits": [], "cost": 3, "text": "The raised cavalry Strides twice with a +10-foot circumstance bonus to its Speed. During this movement, the cavalry can move through the spaces of Medium or smaller creatures. It deals (3d12+14) bludgeoning damage to each creature whose space it moves through (DC 41 Reflex save). A creature that fails its save is also knocked Prone. The cavalry can affect the same creature only once in a single use of Trampling Charge."}]
