  actions: [{"name": "Iron Command", "type": "reaction", "traits": [], "text": "Trigger An enemy within 15 feet damages Seldeg%rEffect Seldeg puts an impertinent foe who dared harm him in their proper place. He commands the enemy to kneel in obedience. If they refuse, they must pay the price in pain and anguish. The triggering creature must choose one of the following options: the enemy kneels, dropping Prone as a free action, or the enemy refuses and takes 6d6 mental damage. In addition, Seldeg's Strikes against the triggering creature deal an additional 3 damage until…"}, {"name": "Raise a Shield", "type": "action", "traits": [], "cost": 1, "text": "Requirements You are wielding a shield.%rYou position your shield to protect yourself. When you have Raised a Shield, you gain its listed circumstance bonus to AC. Your shield remains raised until the start of your next turn."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a graveknight is destroyed, their armor rebuilds their body over the course of 1d10 days—or more quickly if the armor is worn by a living host. If the body is destroyed before then, the process restarts.%rA graveknight can only be permanently destroyed by obliterating their armor (such as with Disintegrate), transporting it to the Forge of Creation, or throwing it into the heart of a volcano."}, {"name": "Sacrilegious Aura", "type": "passive", "traits": ["aura", "divine", "void"], "text": "30 feet.%rWhen a creature in the aura uses a vitality spell or ability, the graveknight automatically attempts to counteract it, with a counteract modifier of +31."}, {"name": "Shield Block", "type": "reaction", "traits": []}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Devastating Blast", "type": "action", "traits": ["arcane", "fire"], "cost": 2, "text": "Seldeg Bheldis unleashes a 30-foot of energy. Creatures in the area take 11d12 fire|options:area-damage damage with a DC 39 Reflex.%rSeldeg can use this ability once every 1d4 #Recharge Devastating Blast rounds."}, {"name": "Graveknight's Curse", "type": "passive", "traits": ["arcane", "curse"], "text": "This curse affects anyone who wears a graveknight's armor for at least 1 hour%rSaving Throw DC 39 Will save%rOnset 1 hour%rStage 1 Doomed 1 and can't remove armor (1 day)%rStage 2 Doomed 2, –10-foot status penalty to Speeds, and can't remove armor (1 day)%rStage 3 dies and transforms into the Seldeg."}, {"name": "Phantom Mount", "type": "action", "traits": ["arcane", "summon"], "cost": 3, "text": "HP 155; AC 42, Fort +32, Ref +28, Will +29%rSeldeg summons a supernatural mount, as Marvelous Mount (rank 10). Unlike marvelous mount , the steed's AC and saving throw bonuses are all 4 lower than the graveknight's, and the steed has one-third the Seldeg's Hit Points (rounded down).%rIf the steed is destroyed, Seldeg must wait 1 hour before using this ability again."}, {"name": "Ruinous Weapons", "type": "passive", "traits": [], "text": "Any weapon or unarmed attack Seldeg uses gains the effects of the +1 greater striking and greater flaming runes ."}, {"name": "Swap Fates", "type": "action", "traits": ["divine", "teleportation"], "cost": 1, "text": "Frequency once per round%rEffect Seldeg switches the fates of two creatures within 500 feet. The two creatures teleport into each other's spaces. Each creature then attempts a DC 39 Will save.%rCritical Success The target becomes temporarily immune to Swap Fates for 24 hours.%rSuccess The target takes 3d6 mental damage.%rFailure The target takes 6d6 mental damage and is Stunned 1.%rCritical Failure The target takes 12d6 mental damage and is Stunned 4."}, {"name": "Unyielding Block", "type": "passive", "traits": [], "text": "At the start of each of Seldeg's turns, he gains two additional reactions he can use only to perform a Shield Block."}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "Seldeg has access to the critical specialization effects of any weapon he wields."}]
