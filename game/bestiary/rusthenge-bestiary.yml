  actions: [{"name": "Record Audio", "type": "action", "traits": [], "cost": 1, "text": "The clockwork spy records all sounds within 25 feet onto a small gemstone worth 1 gp embedded in its body. The clockwork spy can record up to 1 hour of sound on a single gemstone. Once it begins recording, it can't cease recording early, nor can it record onto a gemstone that already contains a recording.%rSome clockwork spies contain multiple gemstones to allow for a series of recordings. Since clockwork spies are not intelligent, they must be given simple commands regarding when to start…"}, {"name": "Wind-Up", "type": "passive", "traits": [], "text": "24 hours, DC 17 Thievery, standby%rFor a clockwork to act, it must be wound with a unique key by another creature. This takes 1 minute. Once wound, it remains operational for the listed amount of time, usually 24 hours, after which time it becomes unaware of its surroundings and can't act until it's wound again. Some clockworks' abilities require them to spend some of their remaining operational time. They can't spend more than they have and shut down immediately once they have 0 time…"}, {"name": "Self-Destruct", "type": "reaction", "traits": [], "text": "A clockwork spy must use this reaction unless specifically programmed otherwise by its creator.%rTrigger The clockwork spy is reduced to 0 Hit Points.%rEffect The spy thrashes around and emits a tinny scream followed by a steady ticking sound. At the beginning of what would have been its next turn, the clockwork spy explodes, dealing 1d12 piercing|options:area-damage damage in a 5-foot radius (DC 17 Reflex save). Its gemstone is destroyed, along with any information contained inside it.%rAn…"}, {"name": "Bleeding Gash", "type": "passive", "traits": [], "text": "On a critical hit with a sharpened gear Strike, the clockwork serpent spy also inflicts 1d4 persistent bleed damage (DC 17 Fortitude save negates the additional bleed damage)."}]
