  actions: [{"name": "Wind-Up", "type": "passive", "traits": [], "text": "24 hours, DC 21 Thievery, standby%rFor a clockwork to act, it must be wound with a unique key by another creature. This takes 1 minute. Once wound, it remains operational for the listed amount of time, usually 24 hours, after which time it becomes unaware of its surroundings and can't act until it's wound again. Some clockworks' abilities require them to spend some of their remaining operational time. They can't spend more than they have and shut down immediately once they have 0 time…"}, {"name": "Clockwork Wand", "type": "passive", "traits": [], "text": "The clockwork mage uses a mechanical wand as a focus to channel magical energy. This wand is built into the clockwork mage's chest, with only the crystal at the end exposed. The mage can Interact to the remove the wand, or someone else can remove it with a DC 25 Thievery check to Disable a Device. The clockwork mage becomes unable to cast any spells except cantrips while the wand is removed.%rWhen removed, the clockwork wand is a Magic Wand containing the last 1st-rank innate spell the…"}, {"name": "Dispelling Critical", "type": "passive", "traits": [], "text": "On a critical hit with a halberd Strike, shards of noqual built into the clockwork Belimarius glow green for a moment. Instead of inflicting additional damage with the critical hit, the clockwork Belimarius instead attempts a counteract check with a +18 bonus against one magical effect active on the target."}, {"name": "Energize Clockwork Wand", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Frequency once per 10 minutes.%rEffect The clockwork mage regains a spell it has already cast that day. It must spend 1 hour of its operational time, or 2 hours if the spell is 3rd rank or higher."}]
