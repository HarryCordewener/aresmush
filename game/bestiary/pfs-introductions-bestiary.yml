  strikes: [{"name": "Fist", "bonus": 8, "damage": [["1d6+1", "bludgeoning", null]], "traits": ["agile", "finesse", "unarmed"]}, {"name": "Spore Pod", "bonus": 8, "damage": [["1d6+1", "bludgeoning", null]], "traits": [], "range": 30, "effects": ["Spores"]}]
  actions: [{"name": "Verdant Burst", "type": "passive", "traits": ["healing"], "text": "When Rain in Cloudy Day dies, a burst of primal energy explodes from his body, restoring 2d8 healing Hit Points to each plant creature in a 30-foot. This area is filled with fungi, becoming difficult terrain. If the terrain is not a viable environment for this fungus, it withers after 24 hours."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "Rain in Cloudy Day transforms into a Small giant mushroom or patch of fungi. This ability otherwise uses the effects of One with Plants."}, {"name": "Spore Cloud", "type": "action", "traits": ["poison"], "cost": 2, "text": "Rain in Cloudy Day can unleash a cloud of spores that irritates the eyes and throats of nonfungi creatures in a 15-foot. Each creature must succeed at a DC 16 Fortitude save or take 1 persistent poison|options:area-damage damage. A creature has its vision reduced as long as the persistent damage continues and can see only within 20 feet (10 feet on a critical failure)."}, {"name": "Spores", "type": "passive", "traits": [], "text": "A creature that takes damage from Rain in Cloudy Day's spore pod Strike must attempt a saving throw with the same DC and effect as his Spore Cloud ability."}]
  spellcasting: [{"name": "Focus Occult Spells", "tradition": "occult", "type": "focus", "dc": 17, "attack": 7, "spells": {"0": ["Inspire Courage"], "1": ["Counter Performance"]}}, {"name": "Innate Primal Spells", "tradition": "primal", "type": "innate", "dc": 17, "attack": 7, "spells": {"4": ["Speak with Plants"]}}]
