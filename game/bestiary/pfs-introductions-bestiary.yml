  actions: [{"name": "Light Blindness", "type": "passive", "traits": []}, {"name": "Shadow Blend", "type": "passive", "traits": [], "text": "The shadow drake's form shifts and blends reflexively with surrounding shadows. A shadow drake gains an additional reaction each round, but it can use this reaction only for Shadow Evade."}, {"name": "Shadow Evade", "type": "reaction", "traits": [], "text": "Trigger A creature attacks the shadow drake while it is in an area of dim light%rEffect The shadow drake further obscures its position. The attacker must succeed at a DC 11 Flat check in order to affect the shadow drake, as if the drake were Hidden for the triggering attack."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "The shadow drake makes one jaws Strike and two tail Strikes in any order."}, {"name": "Shadow Breath", "type": "action", "traits": ["arcane", "cold", "shadow"], "cost": 2, "text": "A shadow drake spits a ball of black liquid that explodes into a cloud of frigid black shadow. This attack has a range of 40 feet and explodes in a 5-foot-radius burst. Creatures within the burst take 2d6 cold|options:area-damage damage (DC 16 Reflex save). The explosion of shadow also snuffs out mundane light sources the size of a torch, lantern, or smaller, and attempts to counteract magical light with a +8 counteract modifier.%rThe shadow drake can't use Shadow Breath again for 1d6 #Recharge…"}, {"name": "Speed Surge", "type": "action", "traits": [], "cost": 1, "text": "Frequency three times per day%rEffect The shadow drake Strides or Flies twice."}]
