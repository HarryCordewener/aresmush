  actions: [{"name": "Bound to Bastardhall", "type": "passive", "traits": [], "text": "Unlike the typical phantom, Ilana exists fully in the Ethereal Plane and cannot shift back and forth between this plane and the Universe."}, {"name": "–1 Status Penalty to All Saves vs. Death", "type": "passive", "traits": []}, {"name": "Bound Even in Death", "type": "passive", "traits": [], "text": "As phantom, but if Ilana is reduced to 0 Hit Points by any means, her soul does not return to the River of Souls. Instead, her soul is drawn into the soul vortex in the vault under Bastardhall (area I )."}, {"name": "Physical Manifestation", "type": "passive", "traits": [], "text": "Upon reaching rank 1, Ilana manifests a semi-physical body. She loses the incorporeal trait, her immunities and resistances, and her fly Speed, and gains a land Speed of 25 feet. She has a Strength modifier of +3, an Athletics modifier of +10, an AC of 21, 74 HP, and occult innate spells. Her other statistics do not change."}, {"name": "Phantom Touch", "type": "passive", "traits": ["spirit"], "text": "Each time they make a Strike, a phantom can choose to deal spirit damage instead of the normal physical damage type."}, {"name": "Spellcasting", "type": "passive", "traits": [], "text": "Once Ilana is rank 1 and has a physical body, she gains the following occult innate spells. As her rank increases, her occult spell DC and spell attack modifier increase, and she gains additional innate spells.%rOccult Innate Spells DC 22, attack +14; 3rd Locate, Soothe; 2nd Clear Mind, Everlight, Soothe; 1st Force Barrage, Mending, Soothe; Cantrips (3rd) Daze, Detect Magic, Light, Read Aura, Telekinetic Projectile%rRank 2 DC 24, attack +16; 4th Clear Mind; 3rd Hypercognition. Her cantrips are…"}]
