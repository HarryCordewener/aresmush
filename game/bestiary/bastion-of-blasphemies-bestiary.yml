  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Fast Healing 5", "type": "passive", "traits": []}, {"name": "Easy to Enrage", "type": "passive", "traits": ["auditory", "concentrate", "emotion", "linguistic", "mental"], "text": "Jinnivere still carries anger and frustration about the way her brother Augsten used to mercilessly tease her agility and lanky frame. A PC can attempt to insult her in the same way by making a special attempt to demoralize her with a DC 24 Intimidation check, with the following results.%rCritical Success The insult cuts deep. Jinnivere loses the effects of her Head Hunter ability and Frightful Presence for the next hour, becomes Slowed 1 on her next turn as she spends one of her actions…"}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "30 feet. DC 23 Will"}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Agonizing Welts", "type": "passive", "traits": ["curse", "occult"], "text": "Jinnivere can wield her riding crop as a melee weapon to create agonizing pain in the minds of those she strikes. It also inflict a curse that causes their mental pain to manifest as painful visible welts and seeping wounds that never seem to heal. If she inflicts agonizing welts on a creature already afflicted by it, the victim attempts a new save, ignoring the result if it's better than a failure.%rSaving Throw DC 26 Fortitude%rStage 1 Clumsy 1 (1 round)%rStage 2 Clumsy 2 and all speeds are…"}, {"name": "Head Hunter", "type": "passive", "traits": [], "text": "Any slashing weapon gains the Keen rune while a dullahan wields it, and any hatchet they wield gains the Returning rune as well. If the dullahan kills a creature with a critical hit using a slashing weapon, the target is decapitated as though the dullahan had used Reap on the target."}, {"name": "Reap", "type": "action", "traits": [], "cost": 2, "text": "The dullahan removes the head of a dead creature within reach. Each creature within the area of the dullahan's frightful presence must attempt a new save, even if it is temporarily immune."}, {"name": "Summon Steed", "type": "action", "traits": ["occult"], "cost": 2, "text": "The dullahan summons a war horse with elite adjustments and the fiend and unholy traits. This steed remains until it is slain, the dullahan Dismisses this effect, or the dullahan Summons a Steed again."}]
