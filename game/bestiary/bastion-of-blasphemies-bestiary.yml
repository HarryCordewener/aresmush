  actions: [{"name": "Bound to Bastardhall", "type": "passive", "traits": [], "text": "Unlike the typical phantom, these phantoms exist fully in the Ethereal Plane and cannot shift back and forth between this plane and the Universe."}, {"name": "-1 Status to All Saves vs. Death Effects", "type": "passive", "traits": []}, {"name": "Skull-Faced Servant", "type": "passive", "traits": [], "text": "A servitor phantom's head is that of an animal skull, as determined by their original role in the castle before the curse fell. This skull head grants the servitor phantom a horns or jaws Strike (as appropriate). Each type of skull is associated with a different Lore skill.%rBrewers have deer skulls and Alcohol Lore.%rCooks have bird skulls and Cooking Lore.%rHousekeepers have cat skulls and Labor Lore.%rValets have dog skulls and Labor Lore."}, {"name": "Susceptible to Death", "type": "passive", "traits": [], "text": "Though phantoms aren't alive, neither are they undead, and they are uniquely vulnerable to the effects of death.%rA phantom whose Hit Points are reduced to 0 as a result of a death effect (such as from a spell like Execute) is immediately whisked away to the River of Souls, where their soul resumes the usual path to the afterlife."}, {"name": "Phantom Touch", "type": "passive", "traits": ["spirit"], "text": "Each time they make a Strike, a phantom can choose to deal spirit damage instead of the normal physical damage type."}]
