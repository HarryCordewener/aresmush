  actions: [{"name": "Religious Disgust", "type": "passive", "traits": [], "text": "A character who openly wears religious iconography or the religious symbol of either Pharasma or Shelyn gains a +2 status bonus to their AC for attacks from Ryhasphinea. If a PC attempts to demoralize Ryhasphinea by invoking either deity, they can attempt to Demoralize with a Religion check instead of an Intimidation check. If she becomes frightened by this attempt, she also becomes Slowed 1 as long as she remains frightened out of disgust."}, {"name": "Share Blessings", "type": "passive", "traits": ["disease", "divine", "unholy"], "text": "When Ryhasphinea is destroyed, she explodes in a blast of infectious rot. All creatures in a 10-foot emanation are exposed to soulphage."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Feed the Dead", "type": "action", "traits": ["divine", "unholy"], "cost": 2, "text": "Frequency once per minute%rRequirements Ryhasphinea is adjacent to an undead creature%rEffect Ryhasphinea siphons void energy into the undead creature, granting it 30 temporary Hit Points and making it Quickened for 3 rounds. The undead creature's temporary Hit Points last as long as it remains quickened, and it can use the extra action only to Stride or Strike."}, {"name": "Soulphage", "type": "passive", "traits": ["disease", "divine", "unholy", "virulent"], "text": "Saving Throw DC 33 Fortitude%rStage 1 carrier (1 day)%rStage 2 3d8 void damage and Drained 1 (1 day)%rStage 3 4d8 void damage, drained 1, and Enfeebled 2 (1 day)%rStage 4 4d8 void damage, drained 1, enfeebled 2, and Clumsy 3 (1 day)%rStage 5 4d8 void damage, Drained 2, Enfeebled 3, clumsy 3, and Doomed 3%rStage 6 dead. A creature that dies while infected with soulphage rises as a War Wraith"}, {"name": "Visceral Reap", "type": "action", "traits": [], "cost": 2, "text": "Ryhasphinea makes a scything blade Strike and compares the attack roll result to the AC of up to two foes, each of whom must be within her melee reach. Roll damage only once, and apply it to each creature hit. The first creature damaged by Visceral Reap also takes 1d6 persistent bleed damage. Reap counts as two attacks for Ryhasphinea's multiple attack penalty."}]
