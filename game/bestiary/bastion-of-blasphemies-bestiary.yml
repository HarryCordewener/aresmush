  actions: [{"name": "Scarecrow's Leer", "type": "passive", "traits": ["aura", "emotion", "fear", "mental", "occult", "visual"], "text": "40 feet.%rThe scarecrow's eyes flicker with an unnerving glow. A creature can't reduce its Frightened condition below 1 as long as it is in the aura's emanation. When a creature enters or starts its turn in the aura, it must attempt a DC 27 Will save. Living creatures made of flesh take a -2 circumstance penalty to this save.%rCritical Success The creature is unaffected and is then temporarily immune for 24 hours.%rSuccess The creature is Frightened 1.%rFailure The creature is Frightened 2 and…"}, {"name": "Baleful Glow", "type": "free", "traits": ["concentrate", "light", "mental", "occult"], "text": "The scarecrow's head bursts into ghostly, heatless flame that sheds bright light in a 20-foot (and dim light to the next 20 feet). If the scarecrow uses this ability on the first round of combat, any creature that has not acted yet is startled and becomes Off-Guard against the scarecrow for 1 round. It can suppress the light by using this action again."}, {"name": "Mundane Appearance", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Until it acts, the taxidermy allosaurus resembles an ordinary (if well-crafted) taxidermy creature. It has an automatic result of 43 on Deception checks and DCs to pass as an ordinary taxidermy display."}, {"name": "Thrashing Tail", "type": "action", "traits": ["move"], "cost": 1, "text": "The taxidermy allosaurus smashes furniture and displays in the area with its tail, spreading the resulting rubble around. A 5-foot by 15-foot area of your choice that has at least one square adjacent to the creature becomes difficult terrain. If this area includes the stone tub, the acid splashes out and the difficult terrain becomes hazardous terrain as well that deals 1d6 acid damage."}, {"name": "Toothsome Fear", "type": "passive", "traits": [], "text": "The taxidermy allosaurus's strikes deal an additional 2d6 mental damage to frightened creatures."}]
