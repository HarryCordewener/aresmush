  actions: [{"name": "Bardic Lore", "type": "passive", "traits": [], "text": "Sphinxes are naturally curious, and their love of puzzles and mysteries leads them to gather information on a broad range of topics. Sphinxes have Bardic Lore, a special Lore skill that can be used only to Recall Knowledge, but on any topic."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When Aznithakantus is destroyed, the energies of the Bastardhall Curse rebuild her body on the steps of the onyx ziggurat over 1d10 days; if her body is destroyed during that time, the process starts as new. She can be destroyed permanently if the Bastardhall Curse is lifted."}, {"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Blindingly Flammable", "type": "passive", "traits": ["aura", "light", "occult"], "text": "30 feet. Aznithakantus's leathery undead flesh is infused with strange reagents. Whenever she takes fire damage, the fire flares blindingly bright, and any creature in the aura's area must succeed at a DC 30 Fortitude save or become Dazzled for 1 round (or Blinded for 1 minute on a critical failure); this is a visual effect. When she takes persistent fire damage, these flames leap out and burn any creature in the aura for an equal amount of damage (DC 30 Reflex save)."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Claw Rake", "type": "action", "traits": [], "cost": 3, "text": "The sphinx rears back on their hind legs and makes two claw Strikes at the same target, using the same attack bonus as their highest melee attack. If both attacks deal damage, the target takes extra damage equal to one claw Strike."}, {"name": "Gift of Dust", "type": "action", "traits": ["occult", "void"], "cost": 1, "text": "Requirements Aznithakantus's last action was a successful claw Strike%rEffect Dust from Aznithakantus's claw seeps into the wound, infecting the target with painful aches as the flesh around the wound grows gray and begins to flake away in dusty chunks. The creature takes 5d8 void damage with a DC 24 Will save. If the creature critically fails the saving throw, it becomes Stunned 3."}, {"name": "Pounce", "type": "action", "traits": [], "cost": 1, "text": "The sphinx Strides and makes a Strike at the end of that movement. If the sphinx began this action Hidden, they remain hidden until after the attack."}, {"name": "Riddler's Rune", "type": "passive", "traits": [], "text": "Once per week, a Sphinx can create a magical symbol as the Rune Trap ritual. The sphinx usually shapes it to take the form of a written riddle and sets the password to the answer.%rA creature that gives the wrong answer or tries to pass without answering must succeed at a DC 33 Will save or be affected by one of the following spells, chosen by the sphinx when creating the symbol: Synaptic Pulse (7th), Charm (7th), Fear (7th), Phantom Pain (7th), Sleep (7th). The sphinx learns the identity of…"}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 33, "attack": 25, "spells": {"0": ["Daze", "Detect Magic"], "6": ["Dispel Magic", "Locate", "Spellwrack"], "7": ["Clairaudience (At Will)", "Clairvoyance (At Will)", "Cleanse Affliction", "Outcast's Curse", "Read Omens", "Retrocognition", "See the Unseen (Constant)", "Truespeech (Constant)"]}}]
