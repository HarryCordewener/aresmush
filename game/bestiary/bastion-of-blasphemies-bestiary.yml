  actions: [{"name": "Bound to Bastardhall", "type": "passive", "traits": [], "text": "Unlike the typical phantom, Aron exists fully in the Ethereal Plane and cannot shift back and forth between this plane and the Universe."}, {"name": "–1 Status Penalty to All Saves vs. Death", "type": "passive", "traits": []}, {"name": "Bound Even in Death", "type": "passive", "traits": [], "text": "As phantom, but if Aron is reduced to 0 Hit Points by any means, his soul does not return to the River of Souls. Instead, his soul is drawn into the soul vortex in the vault under Bastardhall (area I )."}, {"name": "Physical Manifestation", "type": "passive", "traits": [], "text": "Upon reaching rank 1, Aron manifests a semi-physical body. He loses the incorporeal trait, his immunities and resistances, and his fly Speed, and gains a land Speed of 25 feet. He has a Strength modifier of +0, an Athletics modifier of +7, an AC of 21, 80 HP, and Pour Elixir. His other statistics do not change."}, {"name": "Phantom Touch", "type": "passive", "traits": ["spirit"], "text": "Each time they make a Strike, a phantom can choose to deal spirit damage instead of the normal physical damage type."}, {"name": "Pour Elixir", "type": "action", "traits": ["manipulate", "occult"], "cost": 3, "text": "Requirements Aron has a physical body%rFrequency twice per day%rEffect Aron forms a pitcher in one hand from ectoplasm, then pours liquid from the pitcher out onto a solid surface. As the liquid pours, it forms into a single glass vial filled with an alchemical elixir of Aron's choice. He's always willing and eager to Pour an Elixir for the PCs when asked. An elixir created by this ability vanishes if not used within 24 hours of being poured. He can choose from the following options when he…"}]
