  actions: [{"name": "Primal Hunt", "type": "reaction", "traits": ["primal", "teleportation"], "text": "Trigger A creature within the barghest's reach takes a move or teleportation action%rEffect After the triggering action, the barghest can teleport up to 60 feet to a space adjacent to that creature."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "The barghest takes on the shape of a humanoid, a dog, or its true form. Their size changes to match the new form. When the barghest is a humanoid, their claw Strike deals bludgeoning damage and they lose their jaws Strike. When the barghest is a dog, their Speed changes to 35 feet. Each individual barghest has only one humanoid form and one dog form."}, {"name": "Isolating Howl", "type": "action", "traits": ["auditory", "emotion", "incapacitation", "mental", "primal"], "cost": 2, "text": "Rembles lets loose an unearthly howl filled with utter despair. All creatures other than barghests within a 60 foot emanation who hear the howl become filled with the sense that they're all alone in the world, and that an impossible distance spans between themselves and anything remotely connected to companionship. Affected creatures must attempt a DC 24 Will save with the following effects.%rRembles can't use Isolating Howl again for 1d4 rounds.%rCritical Success The creature is…"}, {"name": "Unhealing Wound", "type": "passive", "traits": ["curse", "primal"], "text": "A creature damaged by the barghest's claws must succeed at a DC 24 Fortitude save or be cursed. The cursed creature can't regain Hit Points except via magic until it returns to maximum Hit Points. The creature can attempt a new saving throw against the curse every 24 hours."}, {"name": "Knockdown", "type": "action", "traits": [], "cost": 1}]
