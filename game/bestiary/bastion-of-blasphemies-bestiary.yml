  actions: [{"name": "Smell Prayers", "type": "passive", "traits": [], "text": "Zizminarial is aware of divine magical items and active divine spells as a precise sense but cannot sense other types of magic at all."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Ignite Soul", "type": "action", "traits": ["fear", "fire", "occult"], "cost": 1, "text": "Requirements Zizminarial is in area B12%rFrequency once per round%rEffect Zizminarial causes the flame of a burning candle to suddenly flare up. The soul within shrieks in pain as the fire lances out to burn a creature in area B12 , who takes 4d6 fire damage (DC 24 Reflex save; Frightened 1 on a failure or critical failure). The candle then burns out."}, {"name": "Residual Force", "type": "action", "traits": ["arcane", "force"], "cost": 1, "text": "Requirements The venedaemon's most recent action was to cast a spell%rEffect Fading runes cling to the venedaemon's tentacles. The venedaemon makes a tentacle Strike that has a reach of 20 feet and deals 2d4 additional force damage."}, {"name": "Soul Spell", "type": "passive", "traits": [], "text": "If Zizminarial ingests a soul gem from a cacodaemon, he can recover an expended spell slot instead of gaining fast healing. The spell slot's rank can be no higher than half the level of the creature whose soul was consumed, rounded up.%rZizminarial can ingest a soul from one of the 22 candles burning in this room to regain a spell slot of any level; he cannot use a soul candle to gain fast healing, though."}, {"name": "Twisted Whispers", "type": "action", "traits": ["arcane", "auditory", "concentrate", "linguistic", "mental"], "cost": 1, "text": "The venedaemon whispers to a creature within 15 feet, which must succeed at a DC 24 Will save or be Stupefied 2 for 1 minute (or Stupefied 3 on a critical failure).%rRegardless of the results of the save, the creature is immune to Twisted Whispers for 24 hours."}]
