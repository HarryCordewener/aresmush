  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+2 Status to All Saves vs. Auditory and Visual", "type": "passive", "traits": []}, {"name": "Assume Form", "type": "passive", "traits": ["concentrate", "occult", "polymorph"], "text": "The ugothol spends 10 minutes reshaping its appearance to take on the shape of any Small or Medium humanoid. It gains a +4 circumstance bonus to Deception checks to pass as that creature."}, {"name": "Blood Nourishment", "type": "action", "traits": [], "cost": 1, "text": "The ugothol uses its three-pronged tongue to drink the blood of an adjacent Restrained or Unconscious creature. The creature gains Drained 1"}, {"name": "Compression", "type": "passive", "traits": [], "text": "When the ugothol successfully Squeezes, it moves through the tight space at full speed. Narrow confines are not difficult terrain for an ugothol."}, {"name": "Revert Form", "type": "free", "traits": [], "text": "Requirements The ugothol is in an assumed form%rEffect The ugothol resumes its true form. Until the start of its next turn, it gains a +2 status bonus to attack rolls, damage rolls, saving throws, and skill checks.%rEffect: Revert Form"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The ugothol deals 1d6 extra precision damage to Off-Guard creatures."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
