  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Arachnophobia", "type": "passive", "traits": [], "text": "The first time in a round that a creature utilizes any spider-themed action in Irrokcis's presence (such as casting illusory creature to create a spider, or using summon animal to summon spiders), the lich becomes Slowed 1 for 1 round from his horror. As long as a spider is visible to him (including a work of art, such as the Horrid Figurine from area F14 ), he takes a –1 status penalty to saves against fear effects and loses steady spellcasting. The horrid figurine from area F14 is…"}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "60 feet. DC 30 Will"}, {"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When a lich is destroyed, its soul immediately transfers to their Lich Soul Cage . A lich can be permanently destroyed only if their soul cage is found and destroyed."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Soul Cage", "type": "free", "traits": [], "text": "7th rank%rFrequency once per day%rEffect The lich taps into their Soul Cage 's power to cast any arcane spell up to the highest rank the lich can cast, even if the spell being cast is not one of the lich's prepared spells. The lich's soul cage doesn't need to be present for the lich to use this ability."}, {"name": "Reach Spell", "type": "action", "traits": ["concentrate", "spellshape"], "cost": 1, "text": "If the next action Irrokcis takes is to Cast a Spell that has a range, increase that spell's range by 30 feet."}, {"name": "Siphon Life", "type": "passive", "traits": [], "text": "A lich's form draws forth life from those who come into contact with it. When the lich damages a living creature with an unarmed attack, the lich gains 5 temporary Hit Points and the creature must succeed at a DC 35 Fortitude save or become Drained 1.%rIf the lich is Grabbed or Restrained at the start of its turn, each creature grabbing or restraining it must succeed at a Fortitude save or become drained 1. If the lich siphons a creature's life again, the drained value increase by 1, to a…"}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "As long as Irrokcis isn't in the presence of spiders, if a reaction would disrupt Irrokcis's spellcasting action, he attempts a DC 15 Flat. On a success, the action isn't disrupted."}]
