  actions: [{"name": "Bully the Bully", "type": "passive", "traits": ["auditory", "concentrate", "emotion", "linguistic", "mental"], "text": "Augsten's sense of strength and self-worth shatters whenever someone calls him \"Little Lord Augie.\" A PC can attempt to send Augsten into a tantrum by calling him by this insult as part of a special attempt to create-a-diversion dc=24 traits=auditory,linguistic that has the auditory and linguistic traits, with the following results.%rCritical Success Augsten is cut deep by your teasing! He becomes Stunned 1 by his rage, and is Off-Guard to your attacks for the next 24 hours. During this time,…"}, {"name": "Reactive Bullying", "type": "reaction", "traits": [], "text": "Trigger A creature Augsten can see fails an attack roll or skill check%rEffect Augsten attempts to demoralize the triggering creature by taunting it with cruel laughter and insults about its ability."}, {"name": "Bullying Command", "type": "action", "traits": ["auditory", "emotion", "fear", "linguistic", "mental"], "cost": 1, "text": "Frequency once per round%rEffect Augsten bellows out an insulting, bullying order to a bugbear tormentor he can see. That bugbear tormentor becomes Quickened until the end of their next turn, and can use the extra action to Interact, Step, Stride, or Strike."}, {"name": "Cruel Lashes", "type": "passive", "traits": [], "text": "When Augsten wields a whip, the whip loses its nonlethal trait. He deals an additional 1d6 precision damage with a whip against frightened foes."}, {"name": "Cudgeling Blow", "type": "action", "traits": ["manipulate", "primal"], "cost": 1, "text": "Requirements Augsten is carrying his cudgel in one hand%rFrequency once per round%rEffect Augsten smashes his cudgel against an adjacent creature with astonishing force, dealing 3d8 bludgeoning damage and forcing the target to attempt a DC 26 Fortitude save.%rCritical Success The creature takes no damage.%rSuccess The creature takes half damage.%rFailure The creature takes full damage and is Off-Guard until the start of its next turn.%rCritical Failure The creature takes double damage, is…"}]
