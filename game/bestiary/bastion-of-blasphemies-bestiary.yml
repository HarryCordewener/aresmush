  actions: [{"name": "Bound to Bastardhall", "type": "passive", "traits": [], "text": "Unlike the typical phantom, Banijer exists fully in the Ethereal Plane and cannot shift back and forth between this plane and the Universe."}, {"name": "–1 Status Penalty to All Saves vs. Death", "type": "passive", "traits": []}, {"name": "Bound Even in Death", "type": "passive", "traits": [], "text": "As phantom, but if Banijer is reduced to 0 Hit Points by any means, his soul does not return to the River of Souls. Instead, his soul is drawn into the soul vortex in the vault under Bastardhall (area I )."}, {"name": "Physical Manifestation", "type": "passive", "traits": [], "text": "Upon reaching rank 1, Banijer manifests a semi-physical body. He loses the incorporeal trait, his immunities and resistances, and his fly Speed, and gains a land Speed of 25 feet. He has a Strength modifier of +1, an Athletics modifier of +9, an AC of 21, 73 HP, and primal innate spells. His other statistics do not change."}, {"name": "Phantom Touch", "type": "passive", "traits": ["spirit"], "text": "Each time they make a Strike, a phantom can choose to deal spirit damage instead of the normal physical damage type."}, {"name": "Spellcasting", "type": "passive", "traits": [], "text": "Once Banijer is rank 1 and has a physical body, he gains the following primal innate spells. As his rank increases, his primal spell DC and spell attack modifier increase, and he gains additional innate spells.%rPrimal Innate Spells DC 22, attack +14; 3rd Cleanse Affliction, Heal; 2nd Cleanse Affliction, Heal, Sure Footing; 1st Cleanse Cuisine, Heal, Mending; Cantrips (3rd) Caustic Blast, Detect Magic, Light, Read Aura, Tangle Vine%rRank 2 DC 24, attack +16; 4th Cleanse Affliction; 3rd Water…"}]
