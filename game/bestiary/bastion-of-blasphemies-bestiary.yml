  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Blasphemous Stench", "type": "passive", "traits": ["aura", "divine", "olfactory"], "text": "30 feet. A creature entering or starting its turn in the aura must succeed at a DC 27 Fortitude save or become Sickened 1 (plus Slowed 1 as long as it's sickened on a critical failure). A holy creature takes a –2 status penalty to this saving throw. A creature that succeeds at its save or recovers from being sickened is temporarily immune to blasphemous stench for 1 minute unless it is holy."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Decaying Touch", "type": "passive", "traits": ["curse", "divine", "unholy", "void"], "text": "The first time each round that a living creature takes damage from a carrion angel's claw Strike, it must attempt a DC 30 Fortitude save to avoid becoming Sickened 1 and Drained 1 on a failure (Sickened 2 and Drained 2 on a critical failure)."}, {"name": "Living Facade", "type": "action", "traits": ["concentrate", "divine", "illusion"], "cost": 1, "text": "The carrion angel hides their true appearance behind a potent illusion that makes them appear as they did in life. The carrion angel has an automatic result of 42 on Deception checks and DCs to pass as living. While Living Facade is in effect, the carrion angel loses void healing and can be healed as if they were alive. This illusion lasts until the start of the carrion angel's next turn, but the angel can Sustain it indefinitely—when the carrion angel chooses to stop Sustaining it, they cannot…"}]
