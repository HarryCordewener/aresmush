  actions: [{"name": "Bound to Bastardhall", "type": "passive", "traits": [], "text": "Unlike the typical phantom, these phantoms exist fully in the Ethereal Plane and can't shift back and forth between this plane and the Universe."}, {"name": "–1 Status Penalty to All Saves vs. Death Effects", "type": "passive", "traits": []}, {"name": "Susceptible to Death", "type": "passive", "traits": [], "text": "Though phantoms aren't alive, neither are they undead, and they are uniquely vulnerable to the effects of death.%rA phantom whose Hit Points are reduced to 0 as a result of a death effect (such as from a spell like Execute) is immediately whisked away to the River of Souls, where their soul resumes the usual path to the afterlife."}, {"name": "Phantom Touch", "type": "passive", "traits": ["spirit"], "text": "Each time they make a Strike, a phantom can choose to deal spirit damage instead of the normal physical damage type."}, {"name": "Unnerving Shriek", "type": "action", "traits": ["auditory", "emotion", "fear", "mental", "move", "occult"], "cost": 2, "text": "The vault bat swoops downward, Flying once and shrieking with a soul-chilling cry as they do so. This movement doesn't trigger reactions. Any adjacent creature the vault bat passes during its Fly must attempt a DC 28 Will save or become Frightened 1 (or Frightened 3 on a critical failure)."}, {"name": "Grab Item", "type": "action", "traits": [], "cost": 1, "text": "The phantom beast attempts to Steal one item of up to 1 Bulk from a creature, even if the creature is in combat, though the object still must not be one that is actively in use. If they succeed, they carry the object along with them telekinetically."}]
