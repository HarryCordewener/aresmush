  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Charg's Final Gift", "type": "passive", "traits": [], "text": "As soon as Caydserris is reduced to 0 Hit Points, he shrieks in exaltation. His head rips free from his body, which crumbles to the ground as a matrix of flesh and bone extend outward around his head, transforming him into a monstrous unique sahkil. His head and face remain, but rather than atop a humanoid body, it sits at the center of a great wheel of bone and gristle, held in place at the center by thick strings of viscera, entrails, veins, and vertebrae. Eyes and mouths open and weep along…"}, {"name": "Florin's Revenge", "type": "passive", "traits": [], "text": "On the start of each of Caydserris's turns, after he's gained Charg's final gift, Florin's vengeful soul deals 6d6 spirit damage to him (DC 35 Will save)."}, {"name": "Charg's Blessing", "type": "action", "traits": ["curse", "cursebound", "divine", "morph"], "cost": 2, "text": "Caydserris increases his Cursebound condition's value by 1, then targets a creature he can see within 60 feet. That creature's body distorts and partially transforms, changing limbs into monstrous appendages that are difficult to control. The target must attempt a DC 36 Fortitude save with the following results; regardless of the save, the target is temporarily immune to Charg's Blessing for 24 hours.%rCritical Success The target recovers their body's shape immediately and is unaffected;…"}, {"name": "Curse of Ancestral Meddling", "type": "passive", "traits": [], "text": "When Caydserris has the Cursebound condition, he becomes Clumsy with a value equal to his cursebound value as Arudora spirits—particularly that of Florin Kindler—vie for control of his mind and hinder his movements."}, {"name": "Terror", "type": "passive", "traits": ["emotion", "fear", "mental"], "text": "Caydserris can only make fearful claw Strikes once he receives Charg's Final Gift. A creature that takes damage from a fearful claw strike becomes Frightened 1 (Frightened 2 on a critical hit)."}, {"name": "Unholy Bloodshed", "type": "reaction", "traits": ["concentrate"], "text": "Frequency once per day%rTrigger Caydserris critically succeeds at an attack roll against a holy creature with his Unholy Mace%rEffect The target takes 3d8 bleed."}, {"name": "Whispers of Weakness", "type": "action", "traits": ["cursebound"], "cost": 1, "text": "Spirits guide Caydserris. He increases his Cursebound value by 1, then targets one creature within 60 feet and gains knowledge of their weaknesses, which of their saving throw modifiers is lowest, and a +2 status bonus to his next attack roll against that foe before the end of his turn; the target is then temporarily immune for 1 day."}]
  spellcasting: [{"name": "Divine Spontaneous Spells", "tradition": "divine", "type": "spontaneous", "dc": 36, "attack": 28, "spells": {"0": ["Daze", "Divine Lance", "Guidance", "Light", "Shield", "Void Warp"], "1": ["Bane", "Command", "Enfeeble", "Ill Omen", "Sanctuary"], "2": ["Darkness", "Ghostly Carrier", "Resist Energy", "Silence", "Water Breathing"], "3": ["Chilling Darkness", "Dream Message", "Fear", "Locate"], "4": ["Divine Wrath", "Outcast's Curse", "Read Omens", "Unfettered Movement"], "5": ["Command", "Dreaming Potential", "Invoke Spirits", "Shadow Blast", "Truespeech"], "6": ["Blood Vendetta", "Repulsion", "Spirit Blast", "Truesight"], "7": ["Dispel Magic", "Eclipse Burst", "Execute", "Vampiric Feast"], "8": ["Crisis of Faith", "Divine Immolation", "Fly (Constant)", "Heal"]}}, {"name": "Oracle Revelation Spells", "tradition": "divine", "type": "focus", "dc": 36, "attack": 28, "spells": {"1": ["Ancestral Touch", "Death's Call"], "3": ["Ancestral Defense"]}}]
