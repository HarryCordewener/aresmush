n rage and turns his wrath on Irrokcis instead, cursing his son's name as he uses a combination of Blasphemous Decrees and Telekinetic…"}, {"name": "Telekinetic Assault", "type": "action", "traits": ["divine"], "cost": 2, "text": "The ghost cries out in pain and anguish as small objects and debris fly about in a 30-foot. Creatures in this area take 6d6 bludgeoning|options:area-damage damage, subject to a DC 29 Reflex save."}]
