  actions: [{"name": "–2 Status Penalty to All Saves vs. Curses", "type": "passive", "traits": []}, {"name": "Hooked", "type": "passive", "traits": [], "text": "A creature struck by Arth's fish hook is skewered, taking 1d4 persistent bleed damage as long as the hook remains stuck. A creature can escape dc=28 from the hook."}, {"name": "Humiliate the Fish", "type": "action", "traits": [], "cost": 1, "text": "Requirements A creature is hooked by Arth's fish hook and adjacent to Arth%rEffect Arth yanks the hook free, causing 4d8 slashing damage to the creature (DC 28 Fortitude save), who also falls Prone if they fail that Fortitude save."}, {"name": "Reel In", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Arth pulls the rope attached to his hook. If he has no creature hooked, the fish hook returns to his hand. If a creature is hooked, Arth attempts an Athletics check against the creature's Fortitude DC, pulling it up to 30 feet closer on a success (60 feet on a critical success)."}, {"name": "Swear", "type": "action", "traits": ["auditory", "curse", "primal"], "cost": 1, "text": "Arth unleashes a string of invectives. Each creature that hears him must attempt a DC 28 Will save, with the effects of Mariner's Curse, and is then temporarily immune for 24 hours. Even on a failed save, the curse ends automatically after 24 hours."}]
