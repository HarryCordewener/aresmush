  actions: [{"name": "Meant to Live", "type": "passive", "traits": ["occult"], "text": "Whenever an unrisen would take damage from vitality energy, it instead heals half that number of Hit Points."}, {"name": "Resurrection Vulnerability", "type": "passive", "traits": [], "text": "A creature with a prepared or spontaneous spell that can restore the dead to life (such as Breath of Life or Raise Dead) can expend an appropriate spell slot as a 2-action activity to destroy an unrisen within 30 feet. The attempt fails if the unrisen succeeds at a Will save against the creature's spell DC."}, {"name": "Rise Again", "type": "passive", "traits": ["occult"], "text": "As unrisen, but the heart-like Vile Remnant lodged within the creature's chest becomes momentarily visible as it's returned by this ability, allowing The Mistake to use Show the Horror.%rIf the unrisen is reduced to 0 Hit Points by means other than fire damage, disintegration, or its resurrection vulnerability, it returns to unlife at the start of its next turn. It has 100 Hit Points and is Prone in the space in which it was destroyed. The unrisen can't be returned by this ability again for 1…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Agonized Howl", "type": "action", "traits": ["auditory", "mental", "occult"], "cost": 2, "text": "The unrisen howls in pain at its cursed existence. Creatures within a 30-foot emanation take 10d8 mental|options:area-damage damage with a DC 32 Will save. The unrisen can't use Agonized Howl again for 1d4 rounds."}, {"name": "Awful Approach", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per 10 minutes%rEffect The unrisen reshapes its grotesque form to move swiftly. It Strides twice. Any living creature that can see the unrisen during this movement must succeed at a DC 29 Fortitude save or be Sickened 1 (or Sickened 2 on a critical failure); this is a mental and visual effect."}, {"name": "Death Grip", "type": "action", "traits": ["curse", "occult"], "cost": 1, "text": "Requirements The unrisen has a living creature Grabbed or Restrained%rEffect The unrisen attempts to destroy its victim's life force so it shares in the unrisen's fate. The creature must succeed at a DC 32 Fortitude save or become Doomed 1. While the curse lasts, the creature regains only half as many HP from effects with both the healing and vitality traits; if it dies, any attempt to raise it from the dead causes it to return as an unrisen. The curse ends automatically if the creature's…"}, {"name": "Show the Horror", "type": "action", "traits": ["curse", "emotion", "fear", "mental", "occult", "visual"], "cost": 2, "text": "Requirements The Mistake has used rise again within the previous hour%rEffect The Mistake grabs onto its chest and tugs it open, cracking ribs and tearing flesh to give a glimpse of the horrible Vile Remnant lodged inside of it. All creatures within 30 feet must attempt a DC 32 Will save with the following results. The Mistake can't Show the Horror again for 1d4 rounds.%rCritical Success The creature is unaffected.%rSuccess The creature is unsettled by the sight and becomes Frightened…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
