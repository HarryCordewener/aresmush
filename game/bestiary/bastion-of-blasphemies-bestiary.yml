  actions: [{"name": "Telepathy (Touch)", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph"], "cost": 1, "text": "The imp takes on the appearance of a Medium or smaller animal. While transformed, the imp loses their normal senses, innate spells, and special actions, but doesn't otherwise change their statistics and can still speak and use telepathy. The imp also gains any special senses of the animal and any Speeds the animal has.%rThis doesn't change the attack and damage modifiers of their Strikes but might change the damage type their Strikes deal (depending on what kinds of attacks the animal has) and…"}, {"name": "Fiendish Healing", "type": "action", "traits": ["concentrate", "divine", "healing", "vitality"], "cost": 1, "text": "Frequency once per round.%rEffect The imp regains 1d6 healing Hit Points."}, {"name": "Fiendish Temptation", "type": "action", "traits": ["concentrate", "divine", "fortune", "unholy"], "cost": 1, "text": "Frequency once per day%rEffect The imp offers a nonfiend within 15 feet a bargain, granting a boon of good luck if the creature accepts voluntarily. The boon lasts for 1 hour once accepted.%rOnce during the hour, the creature can roll an attack roll or saving throw twice and use the higher result. If the creature dies while the boon is in place, the imp decides where the creature's soul travels. This typically makes the soul bound for eternity in the imp's home plane, and the creature unable to…"}, {"name": "Imp Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 16 Fortitude%rMaximum Duration 6 rounds%rStage 1 1d6 poison damage and Clumsy 1 (1 round)%rStage 2 1d6 poison damage, clumsy 1, and Slowed 1 (1 round)"}]
