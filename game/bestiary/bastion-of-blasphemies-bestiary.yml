  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Rejection Vulnerability", "type": "passive", "traits": [], "text": "As succubi are beings of pure lust, creatures that reject their lust can metaphysically harm them. When a succubus fails a Diplomacy check to Embrace or Request, or when a creature succeeds at its save against a succubus's mental spell or ability, the succubus takes 2d8 mental damage.%rFor 1 hour after causing mental damage to a succubus in this way, a creature can deal 2d8 mental damage to the succubus with a successful Demoralize action incorporating its rejection."}, {"name": "Seductive Presence", "type": "passive", "traits": ["aura", "emotion", "mental"], "text": "10 feet.%rAny creature in the aura that could be sexually attracted to a succubus takes a –2 circumstance penalty to checks and DCs to oppose the succubus's mental spells, Deception, and Diplomacy."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The succubus can take on the appearance of any Small or Medium humanoid. This doesn't change their Speed or their attack and damage modifiers with their Strikes, but it might change the damage type their Strikes deal (typically to bludgeoning)."}, {"name": "Embrace", "type": "action", "traits": ["attack"], "cost": 1, "text": "The succubus attempts to Grapple a creature using their Diplomacy bonus instead of Athletics. If the creature is willing, the succubus automatically succeeds."}, {"name": "Passionate Kiss", "type": "action", "traits": ["divine", "emotion", "mental", "unholy", "void"], "cost": 1, "text": "Frequency once per round%rEffect The succubus engages a creature they have Grabbed or Restrained in an embrace or other act of passion to drain its vital essence.%rThe kiss makes the creature Drained 1 or increases its drained value by 1, to a maximum of 4. The creature takes 3d6 void damage and the succubus regains Hit Points equal to the damage dealt. The target must succeed at a DC 28 Will save or be affected by a Suggestion to submit to more actions of passion rather than trying to Escape."}, {"name": "Profane Gift", "type": "action", "traits": ["divine", "mental"], "cost": 3, "text": "Frequency once per day%rEffect The succubus gives a willing humanoid a profane gift. That creature gains a +1 status bonus to attack rolls, skill checks, and saving throws. As long as the gift persists, the succubus can communicate telepathically with the target at any distance, see through the creature's senses, and target the creature with suggestion through the telepathic link. In addition, the creature uses an outcome one degree of success worse than it rolls on saving throws against the…"}, {"name": "Spiritual Anguish", "type": "action", "traits": ["divine", "emotion", "mental", "unholy"], "cost": 2, "text": "Amyleda gives a creature within 30 feet a wistful smile, then instills within their mind the sudden conviction that someone who loved them in the past has either betrayed them or died. The targeted creature takes 8d6 mental damage and must attempt a DC 28 Will save. Amyleda can't use Spiritual Anguish again for 1 hour or until she gives a creature a Passionate Kiss—whichever comes first.%rCritical Success The creature is unaffected and is temporarily immune for 24 hours.%rSuccess The creature…"}]
