 is no longer cursed) with the following results.%rCritical Success Velicarn is Off-Guard until the start of his turn.%rSuccess Velicarn takes 5d6 spirit damage and is off-guard until…"}, {"name": "Discorporation", "type": "passive", "traits": [], "text": "If Velicarn is reduced to 0 Hit Points, the Black Coach and the two fiendish horses that drive it vanish immediately, and Velicarn transforms into a dullahan armed with a +2 greater striking astral battle axe. He falls Prone in a space of his choice previously occupied by the death coach and is Slowed 1 for 1 round. As soon as he ends a round without the slowed condition, he transforms back into a death coach and regains 100 healing Hit Points. Only by destroying him in his dullahan form before…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Large or smaller, incorporeal wheel, DC 36 Reflex"}]
