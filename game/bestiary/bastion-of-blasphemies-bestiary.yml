  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change of Luck", "type": "free", "traits": ["occult"], "text": "Frequency once per day%rTrigger A creature within 30 feet of the bone croupier attempts a check but hasn't rolled the check yet%rEffect The bone croupier pulls on the threads of luck that bind all things. The target rolls twice, and then the bone croupier decides which result applies. If the bone croupier chooses the lower roll, this is a misfortune effect; if the bone croupier chooses the higher roll, it's a fortune effect; if they're the same, the croupier decides which trait to apply. If…"}, {"name": "Pick a Card, Any Card", "type": "action", "traits": ["occult"], "cost": 2, "text": "Mister Moxie designates an adjacent living creature who must pick a card from his deck of harrow cards. The chosen creature finds a phantasmal duplicate deck of cards in their hand and is compelled by fate to draw a card; it can and must do so even if its hands are full, or it's unable to act. The creature rolls 1d6#suit to determine the suit of the card drawn to determine the effect (or if you have a harrow deck handy, have the player draw a card to determine the suit).%r1—Hammer: (void) The…"}]
