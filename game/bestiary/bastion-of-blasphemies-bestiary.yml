  strikes: [{"name": "Composite Longbow", "bonus": 24, "damage": [["3d8+8", "piercing", null]], "traits": ["deadly-d10", "magical", "propulsive", "reload-0", "volley-30"], "range": 100}, {"name": "Jaws", "bonus": 24, "damage": [["2d12+13", "piercing", null]], "traits": [], "effects": ["Werecreature Curse Of The Werecreature"]}, {"name": "Claw", "bonus": 24, "damage": [["2d8+13", "slashing", null]], "traits": ["agile"], "effects": ["Grab"]}]
  actions: [{"name": "Wolf Empathy", "type": "passive", "traits": [], "text": "The werecreature can ask questions of, receive answers from, and use the Diplomacy skill with animals of its general kind."}, {"name": "Fearful of the Frost", "type": "passive", "traits": [], "text": "Dazerien lost a few toes to frostbite, but what clings in his mind is the agony of the cold that seeped into his bones as he endured a particularly cruel punishment from his father. The first time each round he takes cold damage, Dazerien takes 2d6 mental damage and becomes Frightened 1 (Frightened 2 if the triggering cold damage was in excess of 20)."}, {"name": "Abduct", "type": "action", "traits": ["move"], "cost": 1, "text": "Requirements Dazerien has a Medium or smaller creature Grabbed%rEffect Dazerien attempts to carry off his victim. The grabbed creature attempts a DC 30 Fortitude save with the following effects.%rCritical Success The grabbed creature escapes and is no longer grabbed.%rSuccess The grabbed creature remains grabbed.%rFailure As success, but Dazerien can Stride, and carries the grabbed creature with him. When he's Large as a result of Moon Frenzy, Dazerien can carry up to 22 Bulk without becoming…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "Human%rMelee fist +24 Damage 1d4+13%rWolf%rSpeed 40 feet%rKnockdown%rThe werecreature changes into its humanoid, hybrid, or animal shape. Each shape has a specific, persistent appearance. A true werecreature's natural form is its hybrid shape.%rIn humanoid shape, the werecreature uses its original humanoid size, loses its jaws and claws Strikes, and gains a melee fist Strike that deals bludgeoning damage equal to the slashing damage dealt by its claw.%rIn animal shape, its Speed and size change…"}, {"name": "Coat Longbow", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Requirements At least one magic oil or poison is stored inside the rune's extradimensional space%rEffect For 1 minute, you can apply stored oils and poisons to the weapon without needing any hands free. Applying them takes the same number of actions as normal. An oil or poison applied this way pours directly from the extradimensional space onto the weapon, and when it's fully applied, its empty vial is ejected."}, {"name": "Curse of the Werewolf", "type": "passive", "traits": ["curse", "primal"], "text": "This curse affects only humanoids.%rSaving Throw DC 30 Fortitude%rOn each full moon, the cursed creature must succeed at another Fortitude save or turn into the same kind of werecreature until dawn.%rThe creature is under the GM's control and goes on a rampage for half the night before falling unconscious until dawn."}, {"name": "Moon Frenzy", "type": "passive", "traits": ["polymorph", "primal"], "text": "When a full moon appears in the night sky, the werecreature must enter hybrid form, can't Change Shape thereafter, becomes one size larger, increases its reach by 5 feet, and increases the damage of its jaws by 2.%rWhen the moon sets or the sun rises, the werecreature returns to humanoid form and is Fatigued for 2d4 hours.%rEffect: Moon Frenzy"}, {"name": "Painful Wound", "type": "reaction", "traits": [], "text": "Trigger Dazerien deals damage with a melee Strike%rEffect Dazerien tears at the victim's flesh, dealing 1d6 bleed and causing the victim to become Sickened 1 from the pain (Sickened 2 on a failed DC 30 Fortitude save)."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}, {"name": "Knockdown (Wolf Form)", "type": "action", "traits": [], "cost": 1}]
