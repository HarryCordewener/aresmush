  actions: [{"name": "Site Bound", "type": "passive", "traits": [], "text": "These three ghosts can only leave the crypts when Bastardhall appears on Golarion, and even then, they can't leave the island."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "The three adventurers re-form after 2d4 days here in the crypts unless someone carries their respective urn of ashes down to the temple in Maiserene (area A9 ) to be cleansed by Shirail."}, {"name": "Amondi's Cruel Shiv", "type": "action", "traits": ["divine", "move"], "cost": 2, "text": "Amondi Flies once, moving through a target creature's space; this movement doesn't trigger reactions. As she moves through the target's space, she makes a ghostly weapon Strike against the target. If she hits, she deals an additional 3d6 persistent bleed damage, and the creature struck becomes Sickened 1 from the pain of the bloody wound."}, {"name": "Malevolent Possession", "type": "action", "traits": ["incapacitation", "mental", "possession"], "cost": 2, "text": "The ghost attempts to possess an adjacent corporeal creature. This has the same effect as the Possession spell (DC 23 Will), except since the ghost doesn't have a physical body, it is unaffected by that restriction of the spell."}]
