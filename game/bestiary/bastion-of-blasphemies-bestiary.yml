  actions: [{"name": "Alchemical Chambers", "type": "passive", "traits": [], "text": "A noxious needler's body contains six alchemical chambers filled with different substances. When a noxious needler's ability calls upon a randomly determined alchemical effect, roll 1d6 and consult the following (if you roll the result of a chamber that was shattered, there is no alchemical effect):%r1d6 #Alchemical Chambers Alchemical Effect 1 Acid Damage%r2 Cold Damage 3 Electricity Damage 4 Fire Damage 5 Poison Damage 6 Sickness: DC 26 Fortitude save or Sickened 1 (Sickened 2 on a critical…"}, {"name": "Alchemical Rupture", "type": "passive", "traits": [], "text": "When a noxious needler takes physical damage from a critical hit or is affected by a shatter spell, one glass chamber within its body shatters, spewing alchemical liquid in a 5-foot. Roll on the alchemical chambers list to determine which one shatters—on a roll of 1–5, creatures in the area take 10d6 damage of the appropriate type (DC 28 basic Reflex). On a roll of 6, creatures must instead save against the sickness effect.%r1d6 #Alchemical Rupture Alchemical Effect 1 10d6…"}, {"name": "Alchemical Injection", "type": "passive", "traits": [], "text": "When a noxious needler hits a creature with a syringe Strike, roll 1d6 on the alchemical chambers list to determine the additional effect of the attack. The syringe deals an additional 2d6 damage of the appropriate type (or exposes the target to the sickness effect, as appropriate).%r1d6 #Alchemical Injection Alchemical Effect 1 2d6 acid damage%r2 2d6 cold damage 3 2d6 electricity damage 4 2d6 fire damage 5 2d6 poison damage 6 Sickness: DC 26 Fortitude save or Sickened 1 (Sickened 2 on a…"}, {"name": "Attach Siphon", "type": "passive", "traits": [], "text": "A creature that takes any damage from a blood siphon Strike must attempt a DC 28 Reflex save. On a failure, the siphon attaches to the creature. It's attached to Junth by a long length of flexible leather hose, so if he misses with a blood siphon he can retract it as an Interact action. The tether can also be severed (AC 27, Hardness 10, 10 HP), and the creature to which it has been attached can escape dc=28."}, {"name": "Siphon Blood", "type": "action", "traits": [], "cost": 1, "text": "Requirements Junth has a blood siphon attached to a target creature%rFrequency once per round%rEffect Junth drains blood from the target creature, dealing 5d6 bleed damage. Unlike most bleed damage, this isn't persistent damage. A creature that takes any of this bleed damage must also attempt a DC 28 Fortitude save.%rCritical Success The creature takes no damage.%rSuccess The creature takes half damage.%rFailure The creature takes full damage and becomes Enfeebled 1 for 1 hour.%rCritical…"}]
