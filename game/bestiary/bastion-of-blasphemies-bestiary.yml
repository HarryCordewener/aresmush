  actions: [{"name": "Site Bound", "type": "passive", "traits": [], "text": "Area C28%rA typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence and sets right whatever prevents the spirit from resting."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Compelling Order", "type": "action", "traits": ["auditory", "divine", "emotion", "linguistic", "mental"], "cost": 2, "text": "Frequency once per round%rEffect Korven barks out an order at a creature within 30 feet, filling his command with humiliating insults and implied threats of punishment if the order is disobeyed, choosing from one of the following commands: \"drop your weapons,\" \"kneel,\" \"stand at attention,\" or \"pledge your loyalty.\" The target must attempt a DC 26 Will save with the following results, after which it is immune to Compelling Order for 1 minute.%rCritical Success The creature can ignore the order;…"}, {"name": "Phantom Amputation", "type": "passive", "traits": ["divine", "emotion", "fear", "mental"], "text": "Each time a creature takes damage in a round from the bloody tendril Strike extending from Korven's wrist, it believes its fingers, hand, or similar appendage has been amputated. The creature must succeed at a DC 26 Will save or become Frightened 1 (Frightened 2 on a critical failure). If the creature is already frightened, it instead becomes Clumsy 1 for 24 hours on a failed save (or Clumsy 2 for 24 hours on critical failure)."}]
