  actions: [{"name": "Easy to Call", "type": "passive", "traits": [], "text": "A mymnian's level is considered 2 lower for the purpose of being conjured by the Binding Circle ritual (and potentially other rituals, at the GM's discretion), but it is always free to attack or leave instead of negotiate unless the primary caster's check is a critical success."}, {"name": "Watchful Presence", "type": "passive", "traits": ["aura", "divine", "emotion", "fear", "mental", "visual"], "text": "60 feet. Even when a mymnian doesn't notice you, you feel like they—or something worse—are watching. A creature that begins its turn inside the aura feels an overwhelming sense of being watched, gaining a +2 status bonus to Perception checks but taking a –2 penalty to saving throws against fear effects. A creature in the aura can't reduce the value of its Frightened condition below 1.%rEffect: Watchful Presence"}, {"name": "Doomed to Rise", "type": "passive", "traits": [], "text": "A creature that dies from an attack by a mymnian while frightened becomes a ghost within the next 24 hours."}, {"name": "Extract Ghost", "type": "action", "traits": ["divine", "emotion", "fear", "mental"], "cost": 1, "text": "Frequency once per round%rEffect The mymnian attempts a claw Strike. If it hits, it deals no damage—instead, the mymnian's claws hook onto the target's soul and, for a moment, tug it out of the body so that the victim can catch a glimpse of how it will look after it dies. The target takes 5d8 mental damage with a DC 33 Will save.%rCritical Success The target takes no damage.%rSuccess The target takes half damage.%rFailure The target takes full damage and becomes Frightened 1.%rCritical Failure…"}]
