  strikes: [{"name": "Glaive", "bonus": 17, "damage": [["2d8+7", "slashing", null]], "traits": ["deadly-d8", "forceful", "magical", "reach-10"]}, {"name": "Iron Boot", "bonus": 16, "damage": [["2d6+7", "piercing", null]], "traits": ["agile", "versatile-b"]}]
  actions: [{"name": "Red Cap", "type": "passive", "traits": ["primal"], "text": "A redcap's woolen hat is dyed with the blood of their victims. If the redcap loses their cap, they no longer benefit from fast healing and take a –4 status penalty to their damage rolls. They can create a new cap in 10 minutes, but that cap doesn't grant them powers until the redcap has turned it red with Blood Soak. A cap has no benefit for creatures other than the redcap who made it.%rEffect: Lost Red Cap"}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Bolster Life", "type": "action", "traits": ["concentrate", "manipulate"], "cost": 2, "text": "Frequency once per day%rEffect When held to the chest and focused upon, the soul energy within the soulheart floods outward and bolsters your life force, granting you 6 temporary Hit Points (or 3 temporary Hit Points if it's nighttime). These temporary Hit Points last for 8 hours."}, {"name": "Divine Revulsion", "type": "passive", "traits": ["emotion", "fear", "mental"], "text": "If a redcap sees a creature brandish a religious symbol of a deity (which requires an Interact action by that creature) or cast a divine spell while wearing a religious symbol, the redcap must attempt a DC 24 Will save. The DC is DC 26 Will against a symbol of Shelyn and DC 34 Will against his lucky dawnsilver corkscrew.%rThey then become temporarily immune to all brandished religious symbols for 10 minutes.%rCritical Success The redcap is unaffected.%rSuccess The redcap is Frightened…"}, {"name": "Sommelier's Mockery", "type": "reaction", "traits": ["mental"], "text": "Trigger A creature Brensen can see within 30 feet spends an action retching in an attempt to recover from the sickened condition and fails%rEffect Brensen points and laughs at the triggering creature, causing their sickened condition value to increase by 1, or to fall Prone if their sickened condition value is already Sickened 3."}, {"name": "Soak Cap", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Brensen dips his cap into red wine or blood from a slain foe. Wine must have been opened by Brensen within the last minute. Blood must be from a creature Brensen helped kill and must have died within the last minute. He gains a +4 status bonus to damage rolls and Fortitude saves for 1 minute.%rEffect: Blood Soak"}, {"name": "Sommelier's Trick", "type": "action", "traits": ["manipulate", "mental", "primal"], "cost": 2, "text": "Brensen takes a deep gulp of alcohol, then winks at a creature he can see within 30 feet. The alcohol he imbibed suddenly infuses the belly of the target, causing them to attempt a DC 25 Fortitude save with the following effects.%rCritical Success The creature is unaffected.%rSuccess The creature becomes Sickened 1.%rFailure The creature becomes Sickened 2 and falls Prone.%rCritical Failure As failure, but the creature becomes Slowed 1 as long as it's remain sickened."}, {"name": "Stomp", "type": "action", "traits": [], "cost": 1, "text": "The redcap Strides up to half its Speed and makes a boot Strike at any point during that movement. If the boot Strike hits a Prone creature, it deals an extra 2d6 bleed."}]
