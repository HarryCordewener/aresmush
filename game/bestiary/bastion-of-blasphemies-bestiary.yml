  actions: [{"name": "Spewing Honey", "type": "passive", "traits": [], "text": "When Sovina takes slashing damage, her wound spews rancid honey mixed with bile on adjacent creatures, dealing 2d12 poison damage (DC 22 Reflex save). A creature that fails this saving throw is also Slowed 1 for 1 round by the thick, sticky honey. Sovina loses her spewing honey and penanggalan bile abilities until the end of her next turn."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(2d6+4) bludgeoning, DC 25 Fortitude"}, {"name": "Elongate Tongue", "type": "action", "traits": [], "cost": 1, "text": "The penanggalan's tongue extends, the membrane stretching and becoming translucent. Until the end of the turn, the penanggalan's proboscis tongue Strikes have a 10-foot reach, and any target is Off-Guard against the Strike unless it has a Perception DC of 25 or higher or the ability to precisely sense Invisible things."}, {"name": "Penanggalan Bile", "type": "passive", "traits": ["disease"], "text": "Rest doesn't decrease the drained value from penanggalan bile%rSaving Throw DC 22 Fortitude%rStage 1 Drained 1 (1 week)%rStage 2 Drained 2 (1 week)%rStage 3 Drained 3 (1 week)%rStage 4 dead"}, {"name": "Ride Corpse", "type": "action", "traits": ["concentrate", "polymorph"], "cost": 3, "text": "The penanggalan inserts their entrails into their humanoid body, allowing them to appear as and move about like a normal human. The body has 10 Hit Points and the same defenses as the penanggalan.%rWhen the body is destroyed, the penanggalan is ejected unharmed. The body becomes a corpse, and if it is neither controlled by the penanggalan nor stored in an alchemical vat, it decays as normal."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
