  actions: [{"name": "Easy to Call", "type": "passive", "traits": [], "text": "An anophilex's level is considered 2 lower for the purpose of being conjured by the Binding Circle ritual (and potentially other rituals, at the GM's discretion), but it is always free to attack or leave instead of negotiate unless the primary caster's check is a critical success."}, {"name": "Fearful Bleeding", "type": "passive", "traits": ["auditory", "aura", "divine", "emotion", "fear", "mental", "visual"], "text": "30 feet. The sight and sound of the anophilex's constantly bleeding body fills non-sahkils with fears that their own blood wants to flow and surge from their veins as well. Creatures taking persistent bleed damage become Frightened 1 when they enter the aura or start their turn in the aura."}, {"name": "Drain Blood", "type": "passive", "traits": [], "text": "When the anophilex uses a jaws strike against a creature that's taking persistent bleed damage, they drink the blood. The creature must succeed at a DC 30 Fortitude save or become Enfeebled 1 (Enfeebled 2 on a critical failure). The anophilex becomes Quickened on the following round, and can use the extra action to Stride or Strike."}, {"name": "Skip Between", "type": "action", "traits": ["divine", "teleportation"], "cost": 1, "text": "The sahkil moves from the Universe to the Ethereal Plane or vice-versa. While in the Ethereal Plane, they're unable to affect anything in the Universe, and they cannot be seen by beings or abilities in the Universe, unless these have an ability that can gaze into the Ethereal Plane. While on the Material Plane the inverse is true for anything on the Ethereal Plane. A summoned sahkil can't use Skip Between."}, {"name": "Spray Vile Blood", "type": "action", "traits": ["divine"], "cost": 2, "text": "The anophilex twists their body into a knot, causing their thorns to pierce their body so that unholy blood sprays out in a 30-foot emanation. Non-sahkil creatures in this area take 12d6 spirit|options:area-damage damage (DC 30 Will save). The anophilex can't Spray Vile Blood again for 1d4 rounds."}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 26, "attack": 18, "spells": {"0": ["Detect Magic", "Divine Lance"], "2": ["Blood Vendetta (At Will)"], "3": ["Fear"], "4": ["Suggestion"], "5": ["Translocate", "Vampiric Feast"], "6": ["Blood Vendetta", "Fly (Constant)", "Vampiric Exsanguination"]}}]
