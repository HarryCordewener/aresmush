  strikes: [{"name": "Jaws", "bonus": 21, "damage": [["2d12+11", "piercing", null]], "traits": ["unarmed"]}, {"name": "Claw", "bonus": 21, "damage": [["2d8+11", "slashing", null]], "traits": ["agile", "unarmed"], "effects": ["Grab"]}, {"name": "Firebolt", "bonus": 19, "damage": [["6d6", "fire", null]], "traits": ["agile", "fire", "occult"]}]
  actions: [{"name": "Bloodsense (Imprecise) 90 feet", "type": "passive", "traits": [], "text": "A blood hag can sense the presence of blood and creatures with blood. They can tell the difference between spilled blood and the blood within a living creature."}, {"name": "Borrowed Skin", "type": "passive", "traits": [], "text": "Alisandra's \"borrowed skin\" is her own skin from her previous life.%rA blood hag wears a covering of skin stolen from a humanoid creature they've killed, hiding their true form. They appear as the creature whose skin they're wearing, including to spells that would detect that creature. Creatures can still potentially detect the deception as described in the Impersonate action.%rSpreading coarse salt inside the skin prevents the hag from putting it back on, forcing them to keep their fiery form…"}, {"name": "Coven", "type": "passive", "traits": ["mental", "occult"], "text": "Although Alisendra is on her own, the ambient energies of the Bastardhall Curse bolster her as if she were a part of a coven. She adds Nightmare, Outcast's Curse, and Scrying to her innate spells."}, {"name": "Assume Fiery Form", "type": "action", "traits": ["concentrate", "fire", "occult", "polymorph"], "cost": 3, "text": "The blood hag removes their borrowed skin and transforms into a brilliant ball of fire. They become amorphous (allowing them to move through a gap at least 1 foot wide without Squeezing and move at full Speed while Squeezing), gain the fire trait and a fly Speed of 60 feet, become immune to fire, and emit light as a torch. They lose their melee Strikes and can't Drain Blood, but they deal 4d6 fire|options:area-damage damage with a DC 29 Reflex save to each creature that touches them, including…"}, {"name": "Drain Blood", "type": "action", "traits": ["occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the blood hag's reach%rEffect The hag sinks their fangs into the creature to drink its blood. This requires a successful Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim becomes Drained 1. The hag regains 15 healing Hit Points, gaining any excess HP as temporary Hit Points that last for 1 hour. Drinking blood from a…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
