  actions: [{"name": "Demesne Confinement", "type": "passive", "traits": ["curse", "occult"], "text": "A pale sovereign is tied to their demesne, a territory of a 5-mile radius surrounding their home estate. They can't leave their demesne of their own accord. A pale sovereign taken from their demesne can't use any of their innate spells or rituals and gradually withers over the course of a week, turning to dust if they don't return before 7 days have passed."}, {"name": "Sense Visitors", "type": "passive", "traits": ["detection", "occult"], "text": "A pale sovereign automatically knows when a creature enters or leaves their demesne, though this doesn't give them precise knowledge of the creature's location."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "-2 to All Saves vs. Curses", "type": "passive", "traits": []}, {"name": "Aura of Charm", "type": "passive", "traits": ["aura", "emotion", "incapacitation", "mental", "occult"], "text": "80 feet. The aura of a pale sovereign is beguiling and inviting, affecting creatures beginning their turns within it with an 8th-rank Charm (DC 39 Will save). A creature that fails its Will save perceives the pale sovereign as they were in life, not their current undead form. A creature that succeeds at its save is then temporarily immune to that pale sovereign's aura for 24 hours."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Curse of Eternal Sleep", "type": "action", "traits": ["curse", "incapacitation", "mental", "occult", "sleep"], "cost": 2, "text": "The pale sovereign touches an adjacent living creature to send it into an endless slumber. The target must attempt a DC 39 Will save.%rCritical Success The target is unaffected and is temporarily immune for 24 hours.%rSuccess The target becomes drowsy and is Slowed 1 for 1 minute.%rFailure The target falls Unconscious, though it doesn't fall Prone or release what it's holding. It can't awaken with a successful Perception check, though dealing any amount of damage to the creature breaks the…"}, {"name": "Siphon Vitality", "type": "action", "traits": ["occult", "void"], "cost": 3, "text": "The pale sovereign siphons the life force from creatures around them. All living creatures in a 30-foot take 6d8 void|options:area-damage damage (DC 39 Fortitude). The pale sovereign regains HP equal to the highest damage a single creature took from this effect."}]
