  actions: [{"name": "Great Despair", "type": "passive", "traits": ["aura", "emotion", "fear", "incapacitation", "mental", "occult"], "text": "30 feet. Living creatures are Frightened 1 while in an ice mummy's great despair aura. They can't naturally recover from this fear while in the area but recover instantly once they leave it. When a creature first enters the area, it must succeed at a DC 24 Will save (after taking the penalty from being frightened) or be Paralyzed for 1d4 rounds. The creature is then temporarily immune for 24 hours.%rEffect: Despair"}, {"name": "Snow Vision", "type": "passive", "traits": [], "text": "The ice mummy ignores the Concealed condition from falling snow."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Channel Rot", "type": "passive", "traits": ["occult"], "text": "The ice mummy can deliver cold rot through melee weapons they wield."}, {"name": "Cold Rot", "type": "passive", "traits": ["cold", "curse", "disease", "divine"], "text": "This affliction can't be reduced below stage 1, nor can damage from it be healed, until successfully treated with Cleanse Affliction or a similar effect. The affliction can then be removed as normal for a disease. A creature killed by cold rot turns to ice crystals and can't be resurrected except by a 7th-rank Resurrect ritual or similar magic%rSaving Throw DC 24 Fortitude%rStage 1 Slowed 1 for 1 round, then carrier with no ill effect (1 minute)%rStage 2 5d6 void damage plus 2d6 cold damage and…"}, {"name": "Frozen Breath", "type": "action", "traits": ["cold", "concentrate", "divine"], "cost": 2, "text": "The ice mummy exhales a 60-foot of razor-sharp ice that deals 5d6 cold and 4d6 slashing damage (DC 26 Reflex).%rThe ice mummy can't use Frozen Breath again for 1d4 rounds."}]
