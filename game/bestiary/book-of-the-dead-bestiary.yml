  actions: [{"name": "Consecration Vulnerability", "type": "passive", "traits": [], "text": "A relictner in a place of worship dedicated to a non-evil deity or on sacred ground, such as an area blessed by Anointed Ground, is Slowed 1."}, {"name": "Lair Sense", "type": "passive", "traits": ["detection", "divine"], "text": "The relictner bonds with a single structure they consider their lair, such as a house, temple, or ruin. A relictner is aware of any creature that enters the lair, and the direction and approximate distance to the creature. If the lair is destroyed, the relictner can bond with a new lair by residing within a structure they own or claim for 1 week."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Weathering Aura", "type": "passive", "traits": ["aura", "divine"], "text": "60 feet. The relictner radiates an aura of degradation. All objects in the area have their Hardness reduced by 10, to a minimum of 0, for as long as they remain in the aura and for 1 round after leaving it. The relictner can't deactivate this aura."}, {"name": "Crumble", "type": "action", "traits": ["divine"], "cost": 2, "text": "The relictner erodes an object within 30 feet, dealing 3d10 bludgeoning damage to it, with a DC 31 Reflex if the object is attended."}, {"name": "Death Gasp", "type": "action", "traits": ["divine"], "cost": 1, "text": "The relictner draws in a deep breath and holds it, temporarily suspending their biological processes and becoming undead. The relictner gains the undead trait and becomes immune to bleed, death effects, disease, Paralyzed, poison, and sleep. Any such effects the relictner is currently inflicted with are suspended but take effect again once they take a breath.%rDeath Gasp lasts as long as the relictner holds their breath (up to 12 rounds).%rEffect: Death Gasp"}, {"name": "Demolition", "type": "action", "traits": ["divine"], "cost": 3, "text": "The relictner bellows in fury, causing the surrounding structure to collapse. All creatures in a 30-foot take 8d10 bludgeoning|options:area-damage damage from falling debris (DC 31 Reflex). A creature that fails its save is knocked Prone. The area becomes difficult terrain.%rThe relictner can't use Demolition again for 1d4 rounds."}]
