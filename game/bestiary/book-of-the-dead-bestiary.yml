  actions: [{"name": "Aura of Peace", "type": "passive", "traits": ["aura", "divine", "emotion", "incapacitation", "mental"], "text": "30 feet. When a creature enters or starts its turn in the aura, it's affected by Calm for 1 minute, with a DC 27 Will save. A creature that succeeds at the save is temporarily immune for 24 hours. If the Iroran mummy takes a hostile action, the aura of peace is suppressed and its effects end for anyone already affected. The Iroran mummy must spend 10 minutes in meditation to restore the aura."}, {"name": "Robe Tangle", "type": "reaction", "traits": ["divine", "move"], "text": "Trigger An adjacent creature misses the Iroran mummy with a melee Strike%rEffect The mummy swaps positions with the attacker, and the attacker becomes Grabbed by the mummy's animated sash. The Escape DC is 29, the Force Open DC is 27, and a creature can sever the sash by hitting AC 27 and dealing at least 20 slashing damage. The mummy can't use this reaction again until they've Interacted to reclaim the sash."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Stunning Flurry", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect The Iroran mummy makes two unarmed Strikes. If both hit the same creature, combine their damage for the purpose of resistances and weaknesses, and the target must succeed at a DC 29 Fortitude save or be Stunned 1 (or stunned 3 on a critical failure); this save has the incapacitation trait."}]
