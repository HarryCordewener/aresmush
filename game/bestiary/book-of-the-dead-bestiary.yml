  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Command Zombie", "type": "action", "traits": ["concentrate", "divine", "incapacitation"], "cost": 1, "text": "Krant intones blasphemous words to gain control over a zombie he can see within 100 feet. A zombie that is mindless and not under someone else's control falls under his control automatically; otherwise, the zombie or its controller can attempt a DC 22 Will save to avoid being controlled (whichever has the higher modifier). The target zombie is temporarily immune for 24 hours if successful. The attempt fails if the zombie is the same level as Krant or higher.%rThe zombie remains controlled by…"}, {"name": "Create Zombies", "type": "passive", "traits": ["concentrate", "divine", "evil"], "text": "Krant can create lesser zombies with a 1-hour ritual. During this time, Krant chants and performs an unholy dance over the corpses he intends to animate. Unlike normal rituals, this doesn't require a skill check or Cost. At the end of this hour, Krant can create one 1st- or 2nd-level zombie, or two zombies of level 0 or lower. These are automatically under Krant's control and count toward the limit of Command Zombie. Any zombies created by Krant still count toward the XP budget of an encounter…"}, {"name": "Shamble Forth", "type": "action", "traits": ["concentrate", "divine"], "cost": 1, "text": "Frequency once per round%rEffect Each zombie controlled by Krant Strides 5 feet (or Burrows, Climbs, Flies, or Swims 5 feet if it has the corresponding movement type)."}, {"name": "Whispering Scythe", "type": "reaction", "traits": ["divine"], "text": "Trigger An undead controlled by Krant and within 20 feet of him is destroyed%rRequirements Krant is holding his scythe%rEffect Krant draws the creature's soul into his scythe. The next time he makes a scythe Strike, the soul is released and the Strike deals an extra 1d6 void damage. The scythe can hold only one soul at a time."}]
