  actions: [{"name": "Corpse Scent (Imprecise) 1 mile", "type": "passive", "traits": [], "text": "The lacedon can smell humanoid corpses in the water from up to 1 mile away."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Aquatic Ambush", "type": "action", "traits": [], "cost": 1, "text": "45 feet"}, {"name": "Consume Flesh", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The lacedon is adjacent to the corpse of a creature that died within the last hour.%rEffect The lacedon devours a chunk of the corpse and regains 2d6 healing Hit Points. It can regain Hit Points from any given corpse only once."}, {"name": "Ghoul Fever", "type": "passive", "traits": ["disease"], "text": "Saving Throw DC 16 Fortitude%rStage 1 carrier with no ill effect (1 day)%rStage 2 2d6 void damage and regains half as many Hit Points from all healing (1 day)%rStage 3 as stage 2 (1 day)%rStage 4 2d6 void damage and gains no benefit from healing (1 day)%rStage 5 as stage 4 (1 day)%rStage 6 dead, and rises as a Ghoul the next midnight."}, {"name": "Paralyzing Spew", "type": "action", "traits": ["incapacitation", "occult"], "cost": 1, "text": "The lacedon discharges a spray of carrion vomit at a creature within 20 feet, dealing 1d6 poison damage with a DC 17 Fortitude. A non-elf creature that fails its save is also Paralyzed. It can attempt a new save to end the paralysis at the end of each of its turns, and the DC cumulatively decreases by 1 on each such save. The lacedon can't use Paralyzing Spew again for 1d4 rounds."}]
