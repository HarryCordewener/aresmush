  actions: [{"name": "Self-Loathing", "type": "passive", "traits": ["emotion", "mental", "visual"], "text": "If a pale stranger sees their own reflection or any object important to them in life, they must attempt a DC 30 Will save.%rCritical Success The pale stranger is unaffected and can no longer be affected by that reflection or object in this way.%rSuccess The pale stranger is distracted by self-loathing and is Slowed 1 for 1 round.%rFailure The pale stranger becomes Fascinated by the source of their self-loathing and does everything they can to destroy it until the end of their next…"}, {"name": "Sense Murderer", "type": "passive", "traits": ["detection", "occult"], "text": "A pale stranger knows the direction of their murderer (as long as both are on the same plane), but not the distance."}, {"name": "Undying Vendetta", "type": "passive", "traits": ["emotion", "occult"], "text": "If the pale stranger's murderer dies, the pale stranger is immediately destroyed. A pale stranger that can't sense their murderer must attempt a DC 11 Flat once every 24 hours to avoid becoming Immobilized and Prone; they immediately rise again once they can sense their murderer. A murderer who becomes undead does not trigger the pale stranger's destruction until the murderer is finally destroyed. The pale stranger gains a +2 status bonus to checks and DCs against their murderer."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Bullets of Vengeance", "type": "passive", "traits": ["occult"], "text": "Shots from a pale stranger's firearms deal an additional 1d6 precision damage, or 2d6 precision damage against the one who murdered them. A creature who has never killed a living being doesn't take this precision damage. When a pale stranger critically succeeds at a ranged Strike with a pistol, the target must succeed at a DC 29 Fortitude save or be Stunned 1."}, {"name": "Dead Shot", "type": "action", "traits": [], "cost": 2, "text": "Frequency once per turn%rRequirements The pale stranger is wielding two loaded firearms%rEffect The pale stranger takes aim at a target and shoots both of their firearms simultaneously. The pale stranger makes two ranged Strikes, one with each of the firearms, each using the pale stranger's current multiple attack penalty. Both Strikes must have the same target, who must be within the first range increment of both weapons.%rIf both attacks hit, combine their damage, and then add any other…"}, {"name": "Revenant Reload", "type": "action", "traits": ["occult"], "cost": 1, "text": "The pale stranger reloads each firearm they're wielding, supernaturally generating new black powder and bullets. When firing these magical bullets, the firearm can't misfire, and the attack doesn't trigger reactions triggered by ranged attacks."}]
