ose enough that it's in their reach and out of defensive position, but so the creature still can't reach the gallowdead's body. At the start of the gallowdead's next turn, if the…"}, {"name": "Charge Chain", "type": "free", "traits": ["divine", "void"], "text": "Frequency once per round%rEffect The gallowdead imbues their chain with necromantic power. The gallowdead chooses to make their next Strike with the chain this turn either deal an additional 4d6 void damage or have 120-foot reach."}]
