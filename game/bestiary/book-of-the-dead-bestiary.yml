  actions: [{"name": "Breathsense (Precise) 60 feet", "type": "passive", "traits": [], "text": "A jiang-shi can't perceive living creatures beyond 5 feet except with their breathsense. A living creature within the listed range who holds its breath is Invisible to the jiang-shi for as long as it holds its breath. To hold its breath in this way, a creature must have one hand free to fully plug its nose or cover its mouth."}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Jiang-Shi Vulnerabilities", "type": "passive", "traits": [], "text": "All jiang-shi possess the following vulnerabilities.%rRevulsion A jiang-shi can't voluntarily come within 10 feet of a brandished mirror or the sound of ringing handbells. A creature can Interact with a mirror or handbell to brandish or ring the item for 1 round (similar to Raising a Shield). If the jiang-shi involuntarily comes within 10 feet of an object of their revulsion, they gain the Fleeing condition, running from the object of their revulsion until they are 10 feet or farther from the…"}, {"name": "One More Breath", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a jiang-shi isn't destroyed at 0 HP. Instead, they fall Unconscious and awaken in 1 minute with 1 Hit Point. Scattering at least 1 Bulk of glutinous rice or hen eggs on an unconscious jiang-shi destroys them permanently. If the jiang-shi was reduced to 0 HP by an attack from a weapon made of duskwood, they're destroyed immediately."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Warped Fulu", "type": "passive", "traits": [], "text": "The jiang-shi has corrupted the fulu attached to their brow. The jiang-shi is immune to spells cast from a magic item without expending a spell slot, such as from a scroll or wand. A creature can Steal the fulu to remove it, rolling against the jiangshi's Perception DC. This immediately ends the jiang-shi's immunity to these effects. If a creature then destroys the removed fulu with an Interact action, the jiang-shi also loses their fast healing ability. A jiang-shi can create a replacement…"}, {"name": "Drain Qi", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the jiang-shi's reach%rEffect The jiang-shi drains the victim's life energy, or qi, through their breath. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Drained 1 and the jiang-shi regains 19 healing HP, gaining any excess as temporary Hit Points. Draining qi from a creature that's already drained…"}, {"name": "Premonition of Death", "type": "free", "traits": [], "text": "Trigger The minister rolls initiative or their turn begins%rEffect The minister is attuned to coming violence. The minister uses Stance of Death."}, {"name": "Rigor Mortis", "type": "passive", "traits": [], "text": "The jiang-shi ignores difficult terrain and effects that would render them Prone. A jiang-shi can't take the Drop Prone action. When they Leap they don't trigger reactions that are normally triggered by move actions, such as Attacks of Opportunity."}, {"name": "Stance of Death", "type": "action", "traits": ["stance"], "cost": 1, "text": "The minister's qi-engorged form allows perfect body control at all times. They assume one of the following stances.%rBone Corpse When the minister successfully Drains Qi while in this stance, for 1 round each time the drained creature Strides it must succeed at a DC 5 Flat or waste the action and fall Prone. Cloudless Void The jiang-shi gains a +1 circumstance bonus to AC and their claw Strikes gain the reach trait. Sundered Veins Creatures struck by the jiang-shi's claw Strikes take 1d10…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
