  actions: [{"name": "Mystery Ingredients", "type": "passive", "traits": ["auditory", "aura", "occult"], "text": "60 feet. Creatures in the aura take a -2 status penalty to checks to Identify Alchemy, Recall Knowledge about alchemical subjects, or examine snake oil effects. When a creature first enters the area, if it hears the ichor slinger talking, it must attempt a secret DC 23 Will save against the slinger's Deception DC. On a failure, it treats its next failed check to Identify Alchemy or Recall Knowledge about alchemical subjects in the next 24 hours as though it were a critical failure instead. This…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Brew Tomb Juice", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Cost 1 batch of infused reagents%rEffect The ichor slinger creates a vial of tomb juice, an alchemical tonic that has the infused trait and becomes inert after 24 hours. Tomb juice has the effects of Snake Oil, and maybe more depending on the results of the ichor slinger's DC 20 Crafting check.%rCritical Success The slinger chooses one of the following items and adds its effects to the tomb juice: Antidote (Moderate), Antiplague (Moderate), Elixir of Life (Lesser), Giant Scorpion Venom, or…"}, {"name": "Exhume", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The ichor slinger is adjacent to a dead creature that hasn't already been affected by Exhume%rEffect The ichor slinger harvests portions of the corpse to gain 1 dose of infused reagents, or 2 infused reagents if the creature was undead."}, {"name": "Force Feed", "type": "action", "traits": [], "cost": 1, "text": "Requirements The ichor slinger has a creature Grabbed or Restrained and is holding tomb juice, an alchemical elixir, or an alchemical poison%rEffect The ichor slinger forces the target to consume the alchemical item."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
