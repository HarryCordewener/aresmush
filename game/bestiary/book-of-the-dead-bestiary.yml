  actions: [{"name": "Wavesense (Imprecise) 100 feet", "type": "passive", "traits": []}, {"name": "Necrotic Runoff", "type": "passive", "traits": ["aura", "poison"], "text": "60 feet. A seetangeist secretes foul fluids into the surrounding water, poisoning it. A creature that enters or starts its turn in the aura must succeed at a DC 29 Fortitude save or become Sickened 2 (Sickened 3 on a critical failure). Creatures that breathe water take a -2 circumstance penalty to this saving throw. As long as a creature remains in the aura, it can't reduce its sickened condition below 1. A creature that succeeds at its save is temporarily immune for 1 minute."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Putrid Assault", "type": "action", "traits": [], "cost": 1, "text": "Each enemy in the seetangeist's space takes 3d6 slashing and 3d6 poison damage (DC 32 Reflex). A creature that fails this save also takes 1d12 persistent poison."}]
