  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "60 feet. DC 38 Will"}, {"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When a lich is destroyed, its soul immediately transfers to its Soul Cage . A lich can be permanently destroyed only if its soul cage is found and destroyed."}, {"name": "Spellstealing Counter", "type": "reaction", "traits": ["occult"], "text": "Trigger A creature the lich can see Casts a Spell%rRequirements The runecarved lich has fewer than three spells stored in its spell tome%rEffect The lich expends a spell slot of the same rank as the spell being cast to counter the triggering creature's casting. The runecarved lich loses their spell slot as if they'd cast the triggering spell. The lich then attempts to counteract the triggering spell (counteract modifier +35). If successful, the spell is countered and added to the runecarved…"}, {"name": "Stored Items", "type": "passive", "traits": [], "text": "The runecarved lich can store items inside its body, as detailed below. The lich can Interact to remove or store an item. If the lich's body is destroyed, any stored items appear among their bones.%rArm Wands (extradimensional) The runecarved lich can store up to two wands in the radius and ulna of one of their arms. These wands can be used as if wielded, and they can't be disarmed. If an arm wand is overcharged, the lich takes 20 untyped damage if the wand is broken or 40 untyped if it's…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consult the Text", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Frequency once per day%rEffect The runecarved lich causes the pages of their spell tome to flip open, revealing an occult spell of 9th rank or lower of their choice. For the remainder of the day, the lich can cast that spell as if it were one of their spells known for every level from its base level up to 9th."}, {"name": "Drain Spell Tome", "type": "free", "traits": [], "text": "Effect The lich draws upon the magic stored in their spell tome to cast one of the spells they've countered. This spell is the same level as the one countered, but it uses the runecarved lich's spell DC and spell attack. Casting a spell in this way removes it from the spell tome."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt the runecarved lich's spellcasting action, the lich attempts a DC 15 Flat. On a success, the action isn't disrupted."}, {"name": "Summon Weapon", "type": "free", "traits": [], "text": "Requirements The lich has a stored weapon in its arm and has that hand free%rEffect The runecarved lich summons its stored weapon into that arm's hand."}]
