  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When a lich is destroyed, its soul immediately transfers to its Soul Cage . A lich can be permanently destroyed only if its soul cage is found and destroyed."}, {"name": "Shatter Block", "type": "reaction", "traits": [], "text": "Trigger A creature scores a critical hit on the horde lich%rRequirements The horde lich has at least one servitor attached (see Servitor Assembly)%rEffect The critical hit is a normal hit instead. One of the horde lich's servitors detaches from them and is placed in an open, adjacent space, Prone. The servitor takes the damage from the triggering attack."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Servitor Assembly", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "A horde lich has three servitor bodies folded up and attached to themself, usually in the ribcage, on the arms, and around the legs. The lich detaches one of these servitors and places it in any open, adjacent space. The lich can alternatively take this action to reattach an adjacent servitor.%rThe lich and their servitors share actions and Hit Points, and the servitors use the same statistics as the lich. Spells and effects that target the lich or their servitors affect all of them equally,…"}, {"name": "Servitor Attack", "type": "action", "traits": ["concentrate"], "cost": 2, "text": "Each of the horde lich's detached servitors Strike, with a -2 circumstance penalty on the attack roll. Each of these Strikes counts toward the lich's multiple attack penalty, but the penalty doesn't increase until after all the attacks."}, {"name": "Servitor Lunge", "type": "action", "traits": [], "cost": 1, "text": "Requirements The horde lich's last action was a critical hit with a melee Strike, and the horde lich has at least one servitor attached%rEffect One of the lich's attached servitors detaches adjacent to the target, and the target is Grabbed by that servitor."}, {"name": "Servitor Realignment", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Each of the horde lich's detached servitors can either Interact or take a basic action with the move trait. The lich chooses which action each of them takes."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt the horde lich's spellcasting action, the lich attempts a DC 15 Flat. On a success, the action isn't disrupted."}]
