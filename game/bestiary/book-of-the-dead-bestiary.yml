  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Power of the Haunt", "type": "passive", "traits": [], "text": "If a geist is within 100 feet of a haunt that isn't disabled or destroyed, they gain a +2 status bonus to AC and saving throws and deal an additional 1d6 void damage with bite Strikes. A creature that succeeds at a DC 20 Perception check to Seek or Recall Knowledge about the geist sees that the tendrils from the geist's cloak grow thicker and more agitated the closer it gets to the haunt."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Terrifying Laugh", "type": "action", "traits": ["divine", "emotion", "fear", "mental"], "cost": 1, "text": "Frequency once per minute%rEffect The geist unleashes soul-piercing laughter in a 20-foot, lasting until the beginning of their next turn. Any creature in the area or entering it must succeed at a DC 26 Will save or be overcome with panicked laughter, becoming Frightened 2 (or Frightened 3 on a critical failure). A creature attempts only one save per Terrifying Laugh, and a creature that succeeds on its saving throw is temporarily immune for 24 hours."}, {"name": "Wrath of the Haunt", "type": "action", "traits": ["divine"], "cost": 2, "text": "Frequency once per round%rRequirements The geist is within 100 feet of an active haunt%rEffect The haunt feeds necromantic power into the geist, becoming inactive until the end of the geist's next turn and deactivating the power of the haunt aura until the haunt becomes active again. The edges of the geist's cloak transform into whip-like tendrils that lash out at nearby creatures. Any living creature within 10 feet of the geist takes 4d10 slashing damage plus 4d6 void damage (DC 28 Reflex…"}]
