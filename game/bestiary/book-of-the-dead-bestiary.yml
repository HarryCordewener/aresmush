  actions: [{"name": "Ecstatic Ululation", "type": "reaction", "traits": ["divine", "void"], "text": "Trigger A ghoul ally within 30 feet Consumes Flesh to regain Hit Points%rEffect The priest of Kabriri unleashes a rapturous howl in praise of their god. All ghouls within 30 feet of the priest of Kabriri, including the priest but not the triggering ghoul, regain half as many Hit Points as the triggering ghoul. All living creatures within 30 feet take void damage equal to half the number of Hit Points the triggering ghoul gained, with a DC 20 Fortitude. Only one Ecstatic Ululation can affect a…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consume Flesh", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The priest of Kabriri is adjacent to the corpse of a creature that died within the last hour.%rEffect The priest of Kabriri devours a chunk of the corpse and regains 3d6 healing Hit Points.%rIt can regain Hit Points from any given corpse only once."}, {"name": "Ghoul Fever", "type": "passive", "traits": ["disease"], "text": "Saving Throw DC 20 Fortitude%rStage 1 carrier with no ill effect (1 day)%rStage 2 2d6 void damage and regains half as many Hit Points from all healing (1 day)%rStage 3 as stage 2 (1 day)%rStage 4 2d6 void damage and gains no benefit from healing (1 day)%rStage 5 as stage 4 (1 day)%rStage 6 dead, and rises as a Ghoul the next midnight."}, {"name": "Paralysis", "type": "passive", "traits": ["incapacitation", "occult"], "text": "Any living, non-elf creature hit by a priest's jaws or claws Strike must succeed at a DC 20 Fortitude save or become Paralyzed. It can attempt a new save at the end of each of its turns, and the DC cumulatively decreases by 1 on each such save."}, {"name": "Swift Leap", "type": "action", "traits": ["move"], "cost": 1, "text": "The priest jumps up to half its Speed. This movement doesn't trigger reactions."}]
