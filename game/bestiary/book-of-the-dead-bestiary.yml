  actions: [{"name": "Consecration Vulnerability", "type": "passive", "traits": [], "text": "A shadern in a place of worship dedicated to a non-evil deity or on sacred ground, such as an area blessed by Anointed Ground, is Slowed 1."}, {"name": "Smoke Vision", "type": "passive", "traits": [], "text": "The shadern ignores the Concealed condition from smoke."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Death Gasp", "type": "action", "traits": ["divine"], "cost": 1, "text": "The shadern draws in a deep breath and holds it, temporarily suspending their biological processes and becoming undead. The shadern gains the undead trait and becomes immune to bleed, death effects, disease, Paralyzed, poison, and sleep. Any such effects the shadern is currently inflicted with are suspended but take effect again once they take a breath.%rDeath Gasp lasts as long as the shadern holds their breath (up to 8 rounds).%rEffect: Death Gasp"}, {"name": "Exhale", "type": "action", "traits": ["divine", "fire"], "cost": 2, "text": "The shadern exhales a cloud of thick smoke in a 10-foot burst centered on them. The cloud remains in place for 1d4 rounds. All creatures within the smoke become Concealed, and all creatures outside the smoke become concealed to creatures within it. Exhaling ends Death Gasp, as the shadern ceases holding their breath."}, {"name": "Smoldering Fist", "type": "passive", "traits": [], "text": "On a critical hit, the shadern immolator's fist Strike also deals 1d4 persistent fire damage."}]
