  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Warrior's Mask", "type": "passive", "traits": [], "text": "A grappling spirit wears a mask that allows them to abandon their original form and become a warrior focused solely on combat. This mask is quasi-corporeal, allowing it to be manipulated by both corporeal and incorporeal creatures. A creature who has the grappling spirit Grabbed or Restrained can remove the mask as an Interact action by succeeding at an DC 29 Athletics check against the grappling spirit's Fortitude DC. Removing a grappling spirit's mask causes the spirit to fly into a frenzy.…"}, {"name": "Ghostly Grasp", "type": "passive", "traits": [], "text": "A grappling spirit can Grapple corporeal creatures despite being incorporeal. The grappling spirit uses their Athletics check to Grapple as normal but can't use Athletics for other actions that require corporeal contact, like Force Open or Trip."}, {"name": "Submission Lock", "type": "action", "traits": ["nonlethal"], "cost": 2, "text": "Requirements The grappling spirit has a creature Grabbed or Restrained%rEffect The spirit saps their opponent's strength with a supernatural grip. The grappling spirit attempts an Athletics check to Grapple a creature they have grabbed or restrained, also adding (4d10+12) void damage, depending on the result.%rCritical Success The creature takes double damage. If it's already enfeebled, it falls Unconscious. If not, it is Enfeebled 2 until the end of its next turn and Enfeebled 1 for 1…"}, {"name": "Teleporting Clothesline", "type": "action", "traits": ["occult", "teleportation"], "cost": 2, "text": "Requirements The grappling spirit has a creature Grabbed or Restrained%rEffect The grappling spirit pushes the creature 15 feet in a straight line. The spirit immediately teleports 20 feet to intercept. They make a ghostly hand Strike against the creature. On a hit, the creature is knocked Prone, and on a critical hit, it also takes an additional 2d6 bludgeoning damage as it's driven to the ground."}, {"name": "Victory Celebration", "type": "passive", "traits": [], "text": "If a spirit knocks a creature Unconscious, each creature within 60 feet that witnesses the victory is targeted with a DC 26 Will Roaring Applause spell. The spirit must spend all their actions until the end of the turn celebrating, and a new medal or belt appears on the spirit."}, {"name": "Improved Grab", "type": "free", "traits": []}]
