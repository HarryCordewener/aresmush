  strikes: [{"name": "Spear", "bonus": 25, "damage": [["3d6+11", "piercing", null]], "traits": ["magical"], "effects": ["Sand Rot"]}, {"name": "Fist", "bonus": 24, "damage": [["3d4+11", "bludgeoning", null]], "traits": ["agile", "unarmed"], "effects": ["Sand Rot"]}, {"name": "Spear", "bonus": 24, "damage": [["3d6+11", "piercing", null]], "traits": ["magical", "thrown-20"], "effects": ["Sand Rot"]}]
  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Great Despair", "type": "passive", "traits": ["aura", "divine", "emotion", "fear", "incapacitation", "mental"], "text": "30 feet. Living creatures are Frightened 1 while in an mummy prophet's great despair aura. They can't naturally recover from this fear while in the area but recover instantly once they leave it. When a creature first enters the area, it must succeed at a DC 31 Will save (after taking the penalty from being frightened) or be Paralyzed for 1d4 rounds. The creature is then temporarily immune for 24 hours.%rEffect: Despair"}, {"name": "Sand Vision", "type": "passive", "traits": [], "text": "The prophet ignores the Concealed condition from particles of sand and dust in the air."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Breath of Sand", "type": "action", "traits": ["concentrate", "divine", "earth", "void"], "cost": 2, "text": "Requirements The prophet's Sandstorm is active%rEffect The prophet inhales its Sandstorm, suppressing the effect until the end of the prophet's next turn. It then exhales a 120-foot of negatively charged sand that deals 7d6 void and 7d6 slashing damage (DC 33 Reflex)."}, {"name": "Channel Rot", "type": "passive", "traits": ["divine"], "text": "The mummy prophet of Set can deliver devastating rot through melee weapons they wield."}, {"name": "Sand Form", "type": "action", "traits": ["concentrate", "divine", "earth", "polymorph"], "cost": 2, "text": "Frequency once per day%rEffect The prophet loses their coherent from and becomes an animated pile of sand. While in this form, the prophet gains resistance 10 to physical damage and is immune to precision damage. They can't cast spells, activate items, or use actions that have the attack or manipulate trait. They gain a fly Speed of 40 feet and can slip through tiny cracks. This lasts for 5 minutes, and the prophet can Dismiss the effect."}, {"name": "Sand Rot", "type": "passive", "traits": ["curse", "disease", "divine"], "text": "This affliction can't be reduced below stage 1, nor can damage from it be healed, until successfully treated with Cleanse Affliction or a similar effect; the affliction can then be removed as normal for a disease. A creature killed by sand rot turns to sand and can't be resurrected except by a 7th-rank Resurrect ritual or similar magic%rSaving Throw DC 31 Fortitude%rStage 1 carrier with no ill effect (1 minute)%rStage 2 12d6 void damage, Clumsy 1, and Stupefied 2 (1 day)"}, {"name": "Sandstorm", "type": "action", "traits": ["divine", "earth"], "cost": 3, "text": "Frequency once per day%rEffect The mummy creates a temporary sandstorm in a 30-foot that lasts for 1 minute. Creatures within the emanation take a –4 circumstance penalty to Perception checks and must succeed at a DC 33 Fortitude save or be forced to hold their breath or start suffocating. A creature within the sandstorm at the end of its turn takes 2d6 void and 1d6 slashing damage.%rEffect: Sandstorm"}]
  spellcasting: [{"name": "Divine Prepared Spells", "tradition": "divine", "type": "prepared", "dc": 33, "attack": 25, "spells": {"0": ["Chill Touch", "Detect Magic", "Divine Lance", "Guidance", "Shield"], "1": ["Fear", "Harm", "Penumbral Shroud", "Ray of Enfeeblement"], "2": ["Death Knell", "Resist Energy", "See Invisibility"], "3": ["Blindness", "Chilling Darkness", "Crisis of Faith", "Cup of Dust"], "4": ["Air Walk", "Divine Wrath", "Freedom of Movement"], "5": ["Shadow Blast", "Wall of Flesh"], "6": ["Disintegrate"], "7": ["Eclipse Burst"]}}]
