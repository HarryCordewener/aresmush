  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "The ghul takes on the appearance of a Small or Medium Hyena. This doesn't change its Speed or Strikes. Effects or abilities that detect the presence of undead don't reveal the ghul as an undead while in this form."}, {"name": "Devour Flesh", "type": "action", "traits": ["manipulate"], "cost": 2, "text": "Requirements The ghul has a creature Grabbed or Restrained%rEffect The ghul attempts to eat a portion of the grabbed creature's flesh. It makes a jaws Strike against the grabbed creature. On a success, the ghul successfully devours some of the flesh and regains 3d6 healing Hit Points. The grabbed creature becomes Drained 1 (or Drained 2 if the jaws Strike was a critical success). The violent consumption requires the ghul to release the creature as it feasts. A ghul can regain Hit Points from…"}, {"name": "Luring Laugh", "type": "action", "traits": ["incapacitation", "mental", "primal"], "cost": 2, "text": "Requirements The ghul is in its hyena shape%rEffect The ghul lets out an alluring chitter. Each creature in a 60-foot must succeed at a DC 19 Will save or become Fascinated, Off-Guard, and compelled to move toward the ghul on the creature's turn. The effect lasts until the end of the ghul's next turn, but the ghul can Sustain a Spell on Luring Laugh. If the ghul attacks, the fascinated condition ends for only the creature that's attacked. On a successful save, a creature is temporarily immune…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
