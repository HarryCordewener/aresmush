  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change of Luck", "type": "free", "traits": ["occult"], "text": "Frequency once per day%rTrigger A creature within 30 feet of the bone croupier attempts a check but hasn't rolled the check yet%rEffect The bone croupier pulls on the threads of luck that bind all things. The target rolls twice, and then the bone croupier decides which result applies. If the bone croupier chooses the lower roll, this is a misfortune effect; if the bone croupier chooses the higher roll, it's a fortune effect; if they're the same, the croupier decides which trait to apply. If…"}, {"name": "Roll the Bones", "type": "action", "traits": ["occult"], "cost": 2, "text": "The bone croupier designates an adjacent living creature to roll the bones. The chosen creature finds a pair of dice in its hand and is compelled by fate to roll them; it can and must roll the dice even if its hands are full or it is unable to act. The creature rolls 2d6 #Roll the Bones, adding them together to determine the effect.%r7 or 11 (healing, vitality) The target regains 15 vitality healing HP. 2, 3, or 12 (void) The target takes 30 void damage. If the target is Dying, this damage…"}]
