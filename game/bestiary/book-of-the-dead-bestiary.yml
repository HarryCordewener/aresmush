inst non-magical damage.%rAfter using Ghostly Swoop, the queen sluagh can't use it again for 1d4 rounds."}, {"name": "Soul Theft", "type": "action", "traits": ["occult", "void"], "cost": 1, "text": "Requirements The queen has a creature Grabbed or Restrained with her proboscis%rEffect The queen devours a portion of the creature's soul and steals some of its ability. The creature takes 5d8 void damage (DC 41 Fortitude save). The queen gains temporary HP equal to the total amount of HP the target loses, including any HP lost from being drained.%rCritical Success The creature is unaffected.%rSuccess The creature takes half damage and is Drained 1.%rFailure The creature takes full damage and…"}, {"name": "Improved Grab", "type": "free", "traits": []}]
