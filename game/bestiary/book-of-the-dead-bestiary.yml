  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Flicker", "type": "passive", "traits": [], "text": "An onryo's erratic movement makes them difficult to target. If an onryo moves at least 10 feet during a move action, they gain Concealment until the start of their next turn."}, {"name": "Onryo's Rancor", "type": "action", "traits": ["curse", "mental", "occult"], "cost": 1, "text": "Requirements The onryo's last action was a successful claw Strike%rEffect The onryo attempts to instill its need for vengeance into the creature. The onryo, with their touch, casts a 5th-rank Geas on the creature they hit (DC 30 Will). On a failure, it's forced to seek and slay loved ones of the onryo's wrongdoer and anyone who attempts to defend them for up to one week. On a critical failure, the duration is 1 month and the creature gains Onryo's Rancor, which it's also compelled to use by the…"}, {"name": "Vengeful Suffocation", "type": "action", "traits": ["incapacitation", "occult"], "cost": 2, "text": "Frequency once per hour%rEffect The onryo channels their boundless resentment, manifesting it as a tangled clump of wet hair, a clot of rancid swamp mud, or other disgusting mass of matter in the throat of a creature within 30 feet. The creature must attempt a DC 32 Fortitude save.%rCritical Success The creature is unaffected.%rSuccess The creature becomes Sickened 1.%rFailure The creature becomes Sickened 2.%rCritical Failure The creature becomes Sickened 3 and the mass fully blocks the…"}]
