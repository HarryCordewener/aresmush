  actions: [{"name": "Thoughtsense (Precise) 100 feet", "type": "passive", "traits": []}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Mental Rebirth", "type": "passive", "traits": ["curse", "incapacitation", "mental", "occult"], "text": "Unlike most other undead, a vetalarana isn't destroyed when they reach 0 HP. Instead, their body is destroyed, crumbling to ash, and their mind is immediately transferred into a creature they rendered comatose through Drain Thoughts. This creature must be within 1 mile; if no such creature is in range, the vetalarana is destroyed. The creature becomes controlled by the vetalarana and loses the stupefied and Unconscious conditions. If the creature controlled by a vetalarana in this way is…"}, {"name": "Vetalarana Vulnerabilities", "type": "passive", "traits": [], "text": "All vetalaranas possess the following weaknesses.%rBarred Senses A vetalarana can't see or sense through force effects or cold iron, and their mind can't penetrate force effects or cold iron. Such barriers can prevent the transference of a vetalarana's mind through Mental Rebirth. Revulsion A vetalarana delights in consuming memories and secrets, and is disgusted by those who share such sensitive tidbits openly. A vetalarana can't voluntarily come within 10 feet of a creature loudly voicing…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Anticipatory Attack", "type": "passive", "traits": [], "text": "The vetalarana emergent uses consumed memories to anticipate their prey's movements. The vetalarana emergent's Strikes deal an additional 1d8 precision damage to creatures stupefied due to the vetalarana's Drain Thoughts."}, {"name": "Drain Thoughts", "type": "action", "traits": ["mental", "occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the vetalarana's reach%rEffect The vetalarana seizes a creature and consumes its memories. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Stupefied 1, and the vetalarana regains 10 healing HP, gaining any excess as temporary Hit Points. Draining Thoughts from a creature that is already stupefied…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
