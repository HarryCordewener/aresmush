  actions: [{"name": "Lifesense 30 feet", "type": "passive", "traits": []}, {"name": "Twilight Spirit", "type": "passive", "traits": [], "text": "The faith of its descendants protects the iruxi ossature. It takes no damage from vitality or void energy, and it can be healed by either vitality or void energy."}, {"name": "Fossil Fury", "type": "action", "traits": ["earth", "primal"], "cost": 2, "text": "Frequency once per hour%rEffects The iruxi ossature beckons with glowing hands, commanding the earth to trip up opponents and marshaling the bone walls of its protectorate to lash out at intruders. The floor in a 30-foot in front of the ossature becomes difficult terrain for 1 minute. Any square of a wall built by iruxis that's in the cone lashes out, with fossilized claws damaging any enemy within 5 feet of the wall. This deals 6d6 piercing|options:area-damage damage with a DC 22 Reflex. A…"}, {"name": "Terrain Advantage", "type": "passive", "traits": [], "text": "Non-lizardfolk creatures in difficult terrain and non-lizardfolk creatures that are in water and lack a swim Speed are Off-Guard to the iruxi ossature."}, {"name": "Totems of the Past", "type": "action", "traits": ["mental", "primal"], "cost": 2, "text": "The iruxi ossature visits visions made of starlight, resembling totemic paintings or constellation diagrams, upon creatures in a 30-foot. Any lizardfolk allies in the area are inspired, gaining a +1 status bonus to attack rolls, and each enemy in the area must succeed at a DC 21 Will save or be Dazzled. Both effects last for 1 minute or until the ossature is destroyed, whichever comes first.%rEffect: Totems of the Past"}]
