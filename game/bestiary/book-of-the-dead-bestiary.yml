  actions: [{"name": "Self-Loathing", "type": "passive", "traits": [], "text": "If a silent stalker sees their own reflection or any object important to them in life, they must attempt a DC 33 Will save.%rCritical Success The pale stranger is unaffected and can no longer be affected by that reflection or object in this way.%rSuccess The silent stalker is distracted by self-loathing and is Slowed 1 for 1 round.%rFailure The silent stalker becomes Fascinated by the source of their self-loathing and does everything they can to destroy it until the end of their next…"}, {"name": "Sense Murderer", "type": "passive", "traits": [], "text": "A silent stalker knows the direction of their murderer (as long as both are on the same plane), but not the distance."}, {"name": "Silent Aura", "type": "passive", "traits": ["aura", "illusion", "occult"], "text": "10 feet. A silent stalker makes no sound, preventing creatures from noticing them using hearing or a similar sense alone. This silence stops all sound within it or passing through. The silent stalker and all creatures in the aura can't use sonic attacks or actions that have the auditory trait; this prevents creatures from casting spells with verbal components or activating items with command components.%rEffect: Silent Aura"}, {"name": "Undying Vendetta", "type": "passive", "traits": [], "text": "If the silent stalker's murderer dies, the pale stranger is immediately destroyed. A pale stranger that can't sense their murderer must attempt a DC 11 Flat once every 24 hours to avoid becoming Immobilized and Prone; they immediately rise again once they can sense their murderer. A murderer who becomes undead does not trigger the silent stalker's destruction until the murderer is finally destroyed. The silent stalker gains a +2 status bonus to checks and DCs against their murderer."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(3d8+7) bludgeoning, DC 33 Fortitude"}, {"name": "Implacable Advance", "type": "action", "traits": [], "cost": 2, "text": "The silent stalker Strides twice and makes a claw Strike; they can ignore difficult terrain during these Strides if they advance toward their murderer. If they Strike and Grab their murderer this turn, they can Constrict as a free action immediately after the Grab."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
