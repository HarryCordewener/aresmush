  actions: [{"name": "Final Snare", "type": "reaction", "traits": [], "text": "Trigger The hunter wight is reduced to 0 Hit Points%rEffect The hunter wight has rigged their own body with a snare, which they trigger before being destroyed. Slivers of bone launch at an adjacent creature, dealing 4d8 piercing damage (DC 25 Reflex)."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Life", "type": "passive", "traits": ["divine"], "text": "When the hunter wight damages a living creature using an unarmed attack or their bound weapon, they gain 7 temporary Hit Points, and the creature must succeed at a DC 22 Fortitude save or become Drained 1. Further damage dealt by the hunter wight's unarmed and bound weapon attacks increases the value of the drained condition by 1 on a failed save, to a maximum of drained 4.%rEffect: Drain Life"}, {"name": "Spawn Hunter Wight", "type": "passive", "traits": ["divine"], "text": "A living humanoid killed by a hunter wight's weapon or claw Strike rises as a hunter wight spawn after 1d4 rounds. This spawn is under the command of the hunter wight that killed them. They don't have drain life or spawn hunter wight and are Clumsy 2 for as long as they're a hunter wight spawn. If the creator of the hunter wight spawn dies, the hunter wight spawn becomes a fully autonomous hunter wight; they regain their free will, gain drain life and spawn hunter wight, and are no longer clumsy"}]
