  actions: [{"name": "Battlefield Bound", "type": "passive", "traits": [], "text": "Without a call to war, a last guard can stray only a short distance from the location they failed to defend, typically 120 feet. Some last guards are instead bound to a province, kingdom, or nation, rather than a specific location."}, {"name": "Form Up", "type": "action", "traits": [], "cost": 1}, {"name": "Lifesense 60 feet", "type": "passive", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a last guard is destroyed, they re-form after 2d4 days within the location they're bound to, fully healed. A last guard can be permanently destroyed and move on to the afterlife only if they successfully defend the location they're bound to from large-scale attack, or fulfill a call to war."}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 220 (3 segments), 110 (2 segments)"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Frightful Battle Cry", "type": "action", "traits": ["auditory", "divine", "emotion", "fear", "mental", "sonic"], "cost": 2, "text": "The last guards unleash a soul-shaking bellow in unison. All creatures in a 60-foot take 7d6 sonic|options:area-damage damage (DC 42 Will). Any creature that fails its save is also Frightened 3 (or Frightened 4 on a critical failure).%rIf the troop occupies 8 or fewer squares, this area decreases to a 30-foot."}, {"name": "Ghostly Blades", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The last guards engage in a coordinated attack with their spectral curve blades against each enemy in a 5-foot (DC 40 Reflex). The damage depends on the number of actions.%r1 1d8+2 slashing and 1d8 void damage%r2 2d8+14 slashing and 2d8 void damage%r3 3d8+14 slashing and 3d8 void damage"}, {"name": "Spectral Charge", "type": "action", "traits": [], "cost": 3, "text": "The last guards charge, swarming through their foes. The troop Flies up to double its Speed, dealing 4d8 void damage to each creature whose space it moves through (DC 40 Reflex). Any creature that fails its save is also Drained 1 (or Drained 2 on a critical failure). The troop can affect each creature only once in a single use of Spectral Charge."}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever the troop Strides, they first Form Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then move up to their Speed. This works just like a Gargantuan creature moving."}]
