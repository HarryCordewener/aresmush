e", "traits": [], "text": "Frequency once per day%rEffect The vetalarana manipulator spends 10 minutes to take psychic control of the creatures they've rendered comatose with Drain Thoughts. This has the effects of the Possession spell, but lasts for up to 6 hours, has a range of 1 mile, and the vetalarana can control a number of comatose victims at a time equal to half the vetalarana's level. A comatose victim can't resist this possession and automatically gets a critical failure on its saving throw against Control…"}, {"name": "Drain Thoughts", "type": "action", "traits": ["mental", "occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the vetalarana's reach%rEffect The vetalarana seizes a creature and consumes its memories. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Stupefied 1, and the vetalarana regains 14 healing HP, gaining any excess as temporary Hit Points. Draining Thoughts from a creature that is already stupefied…"}, {"name": "Paralyzing Claws", "type": "passive", "traits": ["incapacitation", "occult"], "text": "Any living creature hit by a vetalarana manipulator's claw Strike must succeed at a DC 27 Fortitude save or become Paralyzed. The target can attempt a new save at the end of each of its turns to end the effect, and the DC cumulatively decreases by 1 on each such save."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
