  actions: [{"name": "Link Swords", "type": "action", "traits": ["flourish", "stance"], "cost": 1, "text": "Requirements Jin-Hae is wielding two hook swords%rEffect Jin-Hae either links her swords together or unlinks them. If the swords are linked, she can make linked hook sword Strikes; if the swords are unlinked, she can make hook sword Strikes."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "-1 status penalty to all saves vs. death effects", "type": "passive", "traits": []}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Susceptible to Death", "type": "passive", "traits": [], "text": "Though phantoms aren't alive, neither are they undead, and they are uniquely vulnerable to the effects of death.%rA phantom whose Hit Points are reduced to 0 as a result of a death effect (such as from a spell like Execute) is immediately whisked away to the River of Souls, where their soul resumes the usual path to the afterlife."}, {"name": "Call a Battle Echo", "type": "action", "traits": [], "cost": 1, "text": "Effect Jin-Hae pulls one of the battle echoes to her hand. She is fully aware of every echo and can always pull the one she wants, but she cannot call an echo that has already been unsealed."}, {"name": "Combined Charge", "type": "reaction", "traits": ["move"], "text": "Frequency once per day%rTrigger Cloudsplitter Strides or Tramples within 5 feet of Jin-Hae%rEffect Jin-Hae leaps onto Cloudsplitter's back as he charges. She can make a single melee attack against any target they pass during Cloudsplitter's movement."}, {"name": "Wind-Fire Charge", "type": "action", "traits": ["divine"], "cost": 2, "text": "Requirements Jin-Hae is wielding her feng huo lun%rEffect Jin-Hae blasts off on her feng huo lun, leaving an elemental trail in her wake. She Strides up to twice her Speed and makes a feng huo lun Strike at any point during her movement. The path left by her movement is filled with her choice of an 8th-rank Wall of Wind or Wall of Fire spell. Jin-Hae is unaffected by any walls she creates with this ability. She cannot use Wind-Fire Charge again for 1d4 rounds. If she uses Wind-Fire Charge…"}, {"name": "Wind-Fire Chariot", "type": "passive", "traits": ["divine"], "text": "Requirements Jin-Hae is wielding two feng huo lun%rEffect Jin-Hae's feng huo lun float by her feet, giving her the benefits of 7th- level Migration. While this lasts, she can wield her feng huo lun even while her hands are full by kicking with them, and her feng huo lun gain the thrown 20 feet trait as well as the effects of a returning rune."}]
