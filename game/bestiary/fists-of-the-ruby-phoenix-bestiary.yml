  actions: [{"name": "Keeper of the Lighthouse", "type": "passive", "traits": [], "text": "Syndara can choose whether he is affected by his worldspheres."}, {"name": "Portal Redirection", "type": "reaction", "traits": ["divine", "teleportation"], "text": "Trigger Syndara is targeted by a ranged Strike or spell attack roll%rEffect Syndara opens a portal in front of the incoming missile, then opens another portal nearby that fires the missile at another creature within 60 feet of him. He takes no damage from the triggering attack and makes a ranged Strike with a +43 attack bonus. The Strike deals damage according to the triggering ability."}, {"name": "Spatial Sense", "type": "passive", "traits": [], "text": "Syndara instinctively knows the position of all creatures and objects within the Glass Lighthouse as a precise sense. His senses do not extend into extraplanar spaces (such as a bag of holding), even if the entrance to these spaces is within the Lighthouse."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+2 Status to All Saves vs. Chaotic", "type": "passive", "traits": []}, {"name": "Fast Healing 20", "type": "passive", "traits": []}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Essence Reflection", "type": "passive", "traits": [], "text": "Syndara and his reflection are two linked existences. If one of them is affected by a harmful effect, they can shift the harmful effect to the other as a free action, even if they can't act."}, {"name": "Extradimensional Immunity", "type": "passive", "traits": [], "text": "Syndara can foil any attempts to use planar powers against him. He is immune to all extradimensional effects, such as Quandary, but can choose to be affected by such effects normally."}, {"name": "Gateway Onslaught", "type": "action", "traits": ["teleportation"], "cost": 2, "text": "Requirements Syndara is in the Glass Lighthouse%rEffect Syndara folds the fabric of the Glass Lighthouse before opening several gateways from which dangerous elements spew forth. He teleports to his throne, regardless of distance, then makes three elemental gateway Strikes. Each Strike must target a different creature. He can't use Gateway Onslaught again for 1d4 rounds."}, {"name": "Planar Restructuring", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Requirements Syndara is in the Glass Lighthouse%rEffect Syndara exerts his will over the Glass Lighthouse to cause one of several effects. The effect is magical, but Syndara isn't using magic when he takes this action-just triggering a magical effect he already set up. The level for each of these effects is 10, and any save is DC 45. Syndara or Syndara's Reflection can't use Planar Restructuring for 1d4 rounds.%r- Accelerate/Decelerate Syndara affects the flow of time around a target within 60…"}, {"name": "Temporal Flurry", "type": "action", "traits": [], "cost": 2, "text": "Frequency once per round%rEffect Syndara bends time to make multiple attacks. He makes three unarmed Strikes. If multiple attacks hit the same creature, combine their damage for the purpose of resistances and weaknesses."}, {"name": "Vicious Impact", "type": "passive", "traits": [], "text": "Syndara has had an eternity to reflect on his own weaknesses and the weakness of others. If he critically hits with a melee Strike, he can target the eyes, joints, or other weak points to add one of the following effects of his choice unless the target succeeds on a DC 46 Fortitude save.%r- The target becomes Clumsy 1 for 1 minute.%r- The target becomes Enfeebled 1 for 1 minute.%r- The target takes 3d6 bleed.%r- The target can't Step for 1 minute."}, {"name": "Walk the Spiral", "type": "free", "traits": [], "text": "Requirements Syndara is in the Glass Lighthouse%rTrigger Syndara Strikes a creature on his own turn%rEffect Syndara rotates the space of the Glass Lighthouse around himself to carry him to a distant location in an instant. He Strides twice. This movement doesn't trigger reactions. If his next action is to attack a different target than the triggering creature, he gains a +1 circumstance bonus to that attack; each time he Walks the Spiral in a turn, this bonus increases by 1, to a maximum of +3."}]
