han him."}, {"name": "Whirlwind Toss", "type": "action", "traits": [], "cost": 3, "text": "Frequency once per round%rRequirements Ran-to has a creature Grabbed%rEffect Ran-to spins the creature he's holding, smashing it against any creatures within his reach, then throws the creature aside. Ran-to attempts an Athletics check against the grabbed creature's Fortitude DC. Regardless of the result, the creature is no longer grabbed after this activity.%rCritical Success Ran-to tosses his foe mightily. The grabbed creature is thrown into a space within 20 feet, takes 16d6 bludgeoning…"}, {"name": "Improved Grab", "type": "free", "traits": []}]
