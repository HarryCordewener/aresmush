  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Golden Sun", "type": "passive", "traits": ["aura", "primal"], "text": "10 feet. A golden aura envelopes the sanzuwu, protecting them from weak magic. Any non-cold spells of 3rd level or lower burn away and are ineffective. A sanzuwu can deactivate or activate the golden aura as a free action with the concentrate trait."}, {"name": "Scorching Gaze", "type": "reaction", "traits": ["fire", "primal"], "text": "Trigger A creature within 30 feet targets the sanzuwu or one of their allies with a weapon attack%rEffect The sanzuwu focuses their gaze on the triggering creature's weapon, heating it to a burning temperature for an instant. The creature takes 4d8 fire damage unless the creature Releases the weapon as a free action."}, {"name": "Fiery Transformation", "type": "action", "traits": ["concentrate", "fire", "polymorph", "primal"], "cost": 2, "text": "The sanzuwu transforms into an enormous bird made of flame. As the sanzuwu begins their transformation, creatures within a 10-foot take 6d8 fire|options:area-damage damage (DC 33 Reflex save). While in their flame form, the sanzuwu gains the effects of 4th-rank Enlarge. They can use Fiery Transformation again to revert back to their standard form."}, {"name": "Radiant Blast", "type": "action", "traits": ["fire", "primal"], "cost": 2, "text": "The sanzuwu opens their mouth to produce a bead of burning energy, hurling it a point within 200 feet. The bead detonates, dealing 7d8 fire damage and 4d10 sonic damage to all creatures in a 30-foot (DC 33 Reflex save). Creatures that critically fail become Blinded for 1 round. The sanzuwu can't use Radiant Blast again for 1d4 rounds."}, {"name": "Scorch Earth", "type": "action", "traits": [], "cost": 2, "text": "Requirements The sanzuwu is standing on the ground%rEffect The sanzuwu Strides. A 6th-rank Wall of Fire appears in all the spaces the sanzuwu left during this movement, lasting for 1 round. The sanzuwu can't use Scorch Earth again for 1d4 rounds."}, {"name": "Transfixing Sunbeam", "type": "action", "traits": ["incapacitation", "light", "primal"], "cost": 2, "text": "Requirements The sanzuwu is in their fiery form%rEffect The sanzuwu spreads their wings, emitting a bright cascade of light in a 30-foot. Creatures in the cone must attempt a DC 33 Fortitude save.%rSuccess The creature is unaffected.%rFailure The creature is Stunned 1.%rCritical Failure The creature is Stunned 2."}]
