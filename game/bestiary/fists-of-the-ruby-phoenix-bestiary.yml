  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "-1 status penalty to all saves vs. death effects", "type": "passive", "traits": []}, {"name": "Deflecting Gale", "type": "reaction", "traits": [], "text": "Trigger The kirin is targeted with a ranged Strike%rEffect The kirin intensifies the wind around themself, gaining a +4 circumstance bonus to AC against the triggering attack."}, {"name": "Peaceful Aura", "type": "passive", "traits": ["aura", "divine", "emotion", "mental"], "text": "60 feet. Creatures within Cloudsplitter's peaceful aura attempting to use a hostile action must first attempt a DC 39 Will save; on a failure, the hostile action is disrupted.%rIf a creature in the aura successfully uses a hostile action, it's temporarily immune to peaceful aura for 24 hours, and while it's temporarily immune, other creatures in the Cloudsplitter's peaceful aura can perform hostile actions toward it without needing to attempt a Will save.%rCloudsplitter can select creatures…"}, {"name": "Susceptible to Death", "type": "passive", "traits": [], "text": "Though phantoms aren't alive, neither are they undead, and they are uniquely vulnerable to the effects of death.%rA phantom whose Hit Points are reduced to 0 as a result of a death effect (such as from a spell like Execute) is immediately whisked away to the River of Souls, where their soul resumes the usual path to the afterlife."}, {"name": "Breath Weapon", "type": "action", "traits": ["divine", "fire"], "cost": 2, "text": "Cloudsplitter breathes fire in a 30-foot, dealing 18d6 fire|options:area-damage damage (DC 40 Reflex save). Cloudsplitter can't use Breath Weapon again for 1d4 rounds."}, {"name": "Rearing Thrust", "type": "action", "traits": [], "cost": 2, "text": "The Cloudsplitter rushes forward, rears up on their hind legs, and descends upon their target with their horn. Cloudsplitter Strides and makes a horn Strike