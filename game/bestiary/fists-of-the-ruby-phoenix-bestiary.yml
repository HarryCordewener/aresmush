  actions: [{"name": "Bow Basher", "type": "passive", "traits": [], "text": "Razu wields his instrument's unique rune- enchanted bow as a deadly weapon. His decades of training with the item allow him to augment it with his own battle cries so that it also deals sonic damage. By attaching the bow's case to its end, he can change the weapon's damage to piercing and use the bow much like a short spear. Any other creature who wields the erhu bow does not deal sonic damage with it, but the weapon otherwise possesses the traits listed above. If sold without its runes, the…"}, {"name": "Incredible Volume", "type": "passive", "traits": [], "text": "Razu's auditory effects that normally have a range 60 feet or less or an emanation area with a radius of 60 feet or less instead have a range or radius of 300 feet. His auditory effects that normally have a range of greater than 60 feet or an emanation area with a radius of greater than 60 feet instead have a range or radius of 1,200 feet (unless it was already farther). His performances are audible up to 10 miles away."}]
