  actions: [{"name": "Crying Bell Stance", "type": "action", "traits": ["stance"], "cost": 1, "text": "The disciple cups one hand and poses the other to strike it, like the Rai Sho Monastery's central bell. In this stance, they can make temple bell Strikes (see Strikes). While in this stance, a disciple gains a +2 status bonus to AC against ranged attacks."}, {"name": "Falling Sal Stance", "type": "action", "traits": ["stance"], "cost": 1, "text": "The disciple joins their palms together in the shape of a sal flower, evoking the truth that all things eventually decay. In this stance, they can make sal blossom Strikes (see Strikes) and are Quickened, and can use the extra action only to cast wholeness of body."}, {"name": "+1 status to all saves vs. mental", "type": "passive", "traits": []}, {"name": "Nine Seals Spellcasting", "type": "passive", "traits": [], "text": "The Rai Sho disciples have learned a technique that allows them to cast their ki spells more effectively by way of specialized hand postures. They replace the normal somatic and verbal components of their spells with nine seals components; these require that the caster have a hand free, but don't add any traits to the Cast a Spell action (preventing the Rai Sho disciples from triggering certain reactions, such as Attack of Opportunity, when they Cast a Spell)."}, {"name": "Flurry of Blows", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect The Rai Sho disciple makes two Strikes, each of which must be an unarmed Strike or temple bell Strike. If both hit the same creature, combine their damage for the purpose of resistances and weaknesses."}]
