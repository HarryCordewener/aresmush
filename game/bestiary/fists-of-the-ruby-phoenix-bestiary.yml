  actions: [{"name": "Site Bound", "type": "passive", "traits": [], "text": "The shadow is tied to its watchtower.%rA typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Light Vulnerability", "type": "passive", "traits": [], "text": "An object shedding magical light (such as from the Light spell) is treated as magical when used to attack the shadow."}, {"name": "Rejuvenation", "type": "passive", "traits": ["occult"], "text": "When the watchtower shadow is destroyed, it re-forms, fully healed, at the watchtower after 12 hours. Destroying the shadow and lighting its watchtower's brazier permanently destroys it."}, {"name": "Shadow Spawn", "type": "passive", "traits": [], "text": "When a creature's shadow is pulled free by Steal Shadow, it becomes a Shadow Spawn under the command of the shadow that created it. This shadow spawn doesn't have Steal Shadow and is perpetually and incurably Clumsy 2. If the creature the shadow spawn was pulled from dies, the shadow spawn becomes a full-fledged, autonomous shadow. If the creature recovers from its Enfeeblement, its shadow returns to it and the shadow spawn is extinguished."}, {"name": "Slink in Shadows", "type": "passive", "traits": [], "text": "The shadow can Hide or end its Sneak in a creature's or object's shadow."}, {"name": "Steal Shadow", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements The shadow hit a living creature with a shadow hand Strike on its previous action.%rEffect The shadow pulls at the target's shadow, making the creature Enfeebled 1. This is cumulative with other enfeebled conditions from shadows, to a maximum of enfeebled 4. If this increases a creature's enfeebled value to 3 or more, the target's shadow is separated from its body. Enfeebled from Steal Shadow decreases by 1 every hour."}]
