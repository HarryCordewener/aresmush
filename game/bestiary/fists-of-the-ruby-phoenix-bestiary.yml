  actions: [{"name": "Lifesense 60ft", "type": "passive", "traits": ["divine"], "text": "Wraiths sense the vital essence of living and undead creatures within the listed range."}, {"name": "Site Bound", "type": "passive", "traits": [], "text": "The wraith is tied to its watchtower.%rA typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "+1 status to all saves vs. vitality", "type": "passive", "traits": []}, {"name": "Attack of Opportunity", "type": "reaction", "traits": [], "text": "Trigger A creature within the monster's reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.%rEffect The monster attempts a melee Strike against the triggering creature. If the attack is a critical hit and the trigger was a manipulate action, the monster disrupts that action. This Strike doesn't count toward the monster's multiple attack penalty, and its multiple attack penalty doesn't apply to this Strike."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When the watchtower wraith is destroyed, it re-forms, fully healed, at the watchtower after 12 hours. Destroying the wraith and lighting its watchtower's brazier permanently destroys it."}, {"name": "Sunlight Powerlessness", "type": "passive", "traits": [], "text": "A wraith caught in sunlight is Stunned 2 and Clumsy 2."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Life", "type": "passive", "traits": ["divine"], "text": "When the wraith damages a living creature with its spectral hand Strike, the wraith gains 15 temporary Hit Points and the creature must succeed at a DC 36 Fortitude save or become Drained 1. Further damage dealt by the wraith increases the amount of drain by 1 on a failed save to a maximum of drained 4.%rEffect: Drain Life"}, {"name": "Wraith Spawn", "type": "passive", "traits": ["divine"], "text": "A living humanoid slain by a wraith's spectral hand Strike rises as a Wraith Spawn after 1d4 rounds. This wraith spawn is under the command of the wraith that killed it. It doesn't have drain life or wraith spawn and becomes Clumsy 2 for as long as it is a wraith spawn. If the creator of the wraith spawn dies, the wraith spawn becomes a full-fledged, autonomous wraith; it regains its free will, gains Wraith Spawn, and is no longer clumsy."}]
