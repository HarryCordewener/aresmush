  actions: [{"name": "+4 status to all saves vs. fear and dreams", "type": "passive", "traits": []}, {"name": "Nightmare Guardian", "type": "passive", "traits": [], "text": "Rai Sho Postulants gain a +4 status bonus to saves against fear and against spells and abilities that affect dreams. A Rai Sho Postulant that falls prey to a supernatural nightmare loses this ability and becomes permanently enraged, gaining a +1 status bonus to attack and damage status bonus to attack and damage rolls and a -1 status penalty to AC."}, {"name": "Nine Seals Spellcasting", "type": "passive", "traits": [], "text": "The Rai Sho postulants have learned a technique that allows them to cast their ki spells more effectively by way of specialized hand postures. They replace the normal somatic and verbal components of their spells with nine seals components; these require that the caster have a hand free, but don't add any traits to the Cast a Spell action (preventing the Rai Sho postulants from triggering certain reactions, such as Attack of Opportunity, when they Cast a Spell)."}, {"name": "Snowblind", "type": "passive", "traits": [], "text": "When Hiding, the yeti is Concealed by any snowfall, even if it's not thick enough to make other creatures concealed."}, {"name": "Vanish", "type": "reaction", "traits": [], "text": "Trigger The Rai Sho Postulant is hidden or undetected while not in combat, and a creature would observe it.%rEffect The Rai Sho Postulant Strides or Climbs up to half its Speed to a location where it can Hide, then Hides. If its new Stealth check result meets or exceeds the triggering creature's Perception DC, the yeti remains hidden."}, {"name": "Frozen Flurry", "type": "action", "traits": ["cold"], "cost": 1, "text": "Frequency once per round%rEffect The Rai Sho Postulant makes two Strikes, which can be any combination of claw or icicle Strikes. If both hit the same creature, combine their damage for the purpose of resistances and weaknesses. If either Strike hits and deals damage, the target must succeed at a DC 37 Fortitude save or be Stunned 1 (or Stunned 3 on a critical failure); this save has the incapacitation trait."}, {"name": "Grizzly Arrival", "type": "free", "traits": ["emotion", "fear", "mental"], "text": "Trigger The Rai Sho Postulant hits a creature in the first round of combat and the Rai Sho Postulant was Hidden from that creature at the start of combat.%rEffect Each enemy within 30 feet that witnesses the attack (including the target of the attack) must attempt a DC 37 Will save. On a failure, the creature is Frightened 2; on a critical failure, it's Frightened 4."}]
