  actions: [{"name": "Form Up", "type": "action", "traits": [], "cost": 1}, {"name": "Riotous Parade", "type": "passive", "traits": ["auditory", "aura", "emotion", "mental"], "text": "60 feet. The night parade sweeps up those nearby in a riotous celebration. All creatures in the aura must attempt a DC 39 Will save. The target is then temporarily immune for 10 minutes.%rCritical Success The target is unafflicted.%rSuccess The target laughs and dances. It can't use reactions as long as it stays in the area, and if it attempts to use a concentrate action, it must succeed at a DC 5 Flat check; on a failure, the action is lost.%rFailure As success, except the target is also…"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever a troop Strides, it first Forms Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then moves up to its Speed. This works just like a Gargantuan creature moving; for instance, if any square enters difficult terrain, the extra movement cost applies to the whole troop."}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 300 (3 segments), 150 (2 segments)"}, {"name": "Seiya! Soiya!", "type": "action", "traits": ["emotion", "mental", "sonic"], "cost": 2, "text": "The night parade shouts a series of energetic call-and-responses, dealing 3d10 sonic damage and 4d6 mental damage to all creatures in a 10-foot within 20 feet (DC 41 Will save). If the troop is reduced to 8 or fewer squares, this area decreases to a 5-foot."}, {"name": "Wasshoi! Wasshoi!", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The night parade dances with wild abandon, unintentionally striking nearby creatures. It deals damage to each adjacent creature (DC 41 Reflex save), and any creature that fails its save is pushed 10 feet in any direction as the night parade bounces it