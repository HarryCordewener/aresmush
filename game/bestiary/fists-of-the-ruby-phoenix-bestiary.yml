  actions: [{"name": "Absorb Worldly Influence", "type": "reaction", "traits": ["divine"], "text": "Trigger Abbot Tsujon is within the emanation of a magical area effect as it's being created%rRequirements Abbot Tsujon is wielding a khakkhara%rEffect Abbot Tsujon uses her khakkhara as a medium to absorb the incoming area effect into its central ring. She attempts to counteract the triggering effect. For 1 round after Absorbing Worldly Influence, a glowing orb floats within the khakkhara's central ring, allowing Tsujon to Release Worldly Passions"}, {"name": "Crying Bell Stance", "type": "action", "traits": ["stance"], "cost": 1, "text": "Abbot Tsujon cups one hand and poses the other to strike it, like the Rai Sho Monastery's central bell. In this stance, they can make temple bell Strikes (see Strikes). While in this stance, she gains a +2 status bonus to AC against ranged attacks."}, {"name": "Falling Sal Stance", "type": "action", "traits": ["stance"], "cost": 1, "text": "Abbot Tsujon joins their palms together in the shape of a sal flower, evoking the truth that all things eventually decay. In this stance, they can make sal blossom Strikes (see Strikes) and are Quickened, and can use the extra action only to cast wholeness of body."}, {"name": "+1 status to all saves vs. death effects", "type": "passive", "traits": []}, {"name": "All This Has Happened Before", "type": "reaction", "traits": ["occult"], "text": "Frequency once per day%rTrigger Abbot Tsujon is about to roll initiative%rEffect Abbot Tsujon experiences a flash of recognition from a previous existence, gaining a +4 circumstance bonus to the triggering roll.%rIf this causes Abbot Tsujon to be the first creature to act, they also become Quickened for 1 round, but they can use the extra action only to Recall Knowledge or Step."}, {"name": "All This Will Happen Again", "type": "reaction", "traits": ["emotion", "fortune", "mental"], "text": "Frequency once per day%rTrigger Abbot Tsujon fails or critically fails a Will save against an emotion effect%rEffect Even in the face of overwhelming tribulation, Abbot Tsujon finds solace in the notion that all things are merely part of a never-ending cycle. They reroll the saving throw with a +1 status bonus; they must use the second result."}, {"name": "Release Worldly Passions", "type": "action", "traits": ["divine", "force", "manipulate"], "cost": 1, "text": "Requirements Abbot Tsujon's khakkhara holds a glowing orb from Absorb Worldly Influence%rEffect Abbot Tsujon strikes her prayer staff once upon the ground, releasing the energy she captured in it along with the jingling of its rings. She blasts a wave of force in a 30- foot emanation, dealing 2d6 force damage per level of the ability she counteracted (DC 40 Reflex save). If the ability she counteracted usually deals energy damage, she can choose to deal this type of damage instead (for…"}, {"name": "Stunning Flurry", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Abbot Tsujon makes two Strikes, each of which must be an unarmed Strike or crying temple bell Strike. If both hit the same creature, combine their damage for the purpose of resistances and weaknesses. If either Strike hits and deals damage, the target must succeed at a DC 39 Fortitude save or be Stunned 1 (or Stunned 3 on a critical failure); this save has the incapacitation trait."}]
  spellcasting: [{"name": "Focus Spells", "tradition": "arcane", "type": "focus", "dc": 40, "attack": 32, "spells": {"1": ["Ki Rush", "Ki Strike"], "2": ["Wholeness of Body"], "3": ["Ki Blast"]}}]
