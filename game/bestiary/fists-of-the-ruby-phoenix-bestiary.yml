  actions: [{"name": "Stormflight", "type": "passive", "traits": [], "text": "A kaminari can move in wind with ease. They ignore all difficult terrain from wind and don't need to Maneuver in Flight in high winds."}, {"name": "Stormsight", "type": "passive", "traits": [], "text": "Wind, precipitation, and clouds don't impair a kaminari's vision; they ignore the Concealed condition from storms, mist, precipitation, and the like."}, {"name": "Hurricane Bag", "type": "action", "traits": ["air"], "cost": 2, "text": "A kaminari's bag holds the four winds. The kaminari unleashes four 20-foots within 60 feet with the effects of a 9th-rank wall of wind. In addition, a creature that enters one of the bursts takes 6d6 slashing|options:area-damage damage (DC 40 Reflex save). The bursts can't overlap. After using this activity the kaminari can't use Hurricane Bag for 1d4 rounds.%rIf a kaminari creates a column of lighting using Thunder Drums that intersects one of the areas of the wind, the wind explodes in a peal…"}, {"name": "Tempest Tether", "type": "action", "traits": ["air", "electricity"], "cost": 2, "text": "Frequency once per day%rEffect Electricity leaps between two kaminari. The kaminari establishes a connection with another kaminari within 150 feet, and lightning and thunder form a line between the centers of their spaces. For the next minute, a creature that begins its turn in the line or enters the line on its turn takes 4d12 electricity damage (DC 40 Reflex save). A creature can take this damage only once per round, even if it moves through several tempest tethers. If the distance between…"}, {"name": "Thunder Drums", "type": "action", "traits": ["electricity"], "cost": 2, "text": "The peal of a kaminari's drums bring thunder and lightning. The kaminari summons four 100-foot-tall columns of lightning to strike in 5-foots within 60 feet. These columns can't overlap. Creatures in the burst take 8d12 electricity|options:area-damage damage and must attempt a DC 40 Refl