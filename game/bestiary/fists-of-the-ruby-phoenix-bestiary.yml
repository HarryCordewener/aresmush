  actions: [{"name": "Familiar", "type": "passive", "traits": [], "text": "Tak-nwa's familiar is an elephant hawk moth named Yon-so. Yon-so has a fly Speed of 40 feet, darkvision, and scent as an imprecise sense to a range of 30 feet. Yon-so can speak Tien, and when Yon-so rolls a success on a Reflex or Fortitude save it takes no damage against the effect."}, {"name": "Ignores Difficult Terrain", "type": "passive", "traits": []}, {"name": "+3 status to all saves vs. conjuration", "type": "passive", "traits": []}, {"name": "Dragline Trip", "type": "reaction", "traits": [], "text": "Trigger A creature within 20 feet uses a move action or leaves a square during a move action it's using%rEffect Syu Tak-nwa surreptitiously sends a strand of hair through a portal to emerge near the creature's feet, wings, or other ambulatory limbs. She attempts to Trip the creature."}, {"name": "Empowered Hair", "type": "passive", "traits": [], "text": "Tak-nwa's mastery over her prehensile hair while in the Glass Lighthouse is so powerful that she can walk on thick strands like giant spider legs. This makes her immune to tripping, and she ignores the effects of difficult terrain (but not greater difficult terrain). She can use her living hair to perform precise tasks such as picking up objects and performing simple Interact actions. She can also deliver hexes through her hair. Whenever Tak-nwa successfully casts a hex focus spell that…"}, {"name": "Silkworm's Basket", "type": "action", "traits": ["certain-kill"], "cost": 3, "text": "Syu Tak-nwa tears thousands of minute portals into space, sending a single hair through each. The hairs emerge at a space within 30 feet, braiding and twining together to create a cube 20 feet to each side. This has the effects of a 10th-rank Lifewood Cage, except that Syu Tak-nwa does not need to sustain the basket; it has a duration of 1 minute. While the Silkworm's Basket persists, Syu Tak-nwa is Quickened and can use the extra action only to make a hair or braid Strike against any target…"}, {"name": "Spiraling Web", "type": "reaction", "traits": [], "text": "Trigger Syu Tak-nwa is the target of a ranged Strike or ranged spell attack roll%rRequirements Syu Tak-nwa is aware of the attack and not Off-Guard against it%rEffect Hairs erupt from portals around the missile and attempt to wrap around it. Syu Tak-nwa gains a +4 circumstance bonus to AC against the triggering attack. If this would cause the attack to miss, the missile remains tangled and suspended in midair."}]
