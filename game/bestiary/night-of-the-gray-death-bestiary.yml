cer can still attack with their spiked chain if they Grab one creature, but not when they Grab two."}, {"name": "Death Gasp", "type": "action", "traits": ["divine"], "cost": 1, "text": "The Gray Gardener enforcer draws in a deep breath and holds it, temporarily suspending their biological processes and becoming undead. The Gray Gardener enforcer gains the undead trait and becomes immune to bleed, death effects, disease, Paralyzed, poison, and sleep. Any such effects the Gray Gardener is currently suffering from are suspended but take effect again once they take a breath. Death Gasp lasts as long as the Gray Gardener enforcer holds their breath.%rEffect: Death Gasp"}, {"name": "Greater Constrict", "type": "action", "traits": [], "cost": 1, "text": "(3d8+7) slashing, DC 38 Fortitude"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
