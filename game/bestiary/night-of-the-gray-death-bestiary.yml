  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Lifesense 1,000 feet", "type": "passive", "traits": []}, {"name": "Soul Bleed", "type": "passive", "traits": ["aura", "occult"], "text": "1000 feet. Creatures that begin their turn in the area take 5d6 void|options:area-damage damage and must succeed at a DC 42 Fortitude save or become Doomed 1. If the creature is 13th level or lower, this doomed condition from soul bleed is cumulative, increasing by 1 with each failed save until the creature dies (typically at doomed 4)."}, {"name": "Flailing Touch", "type": "action", "traits": [], "cost": 2, "text": "The gray death makes up to four hand Strikes, each against a different target it can reach. It increases its reach to 100 feet with these Strikes. These Strikes count as one attack for the gray death's multiple attack penalty, and the penalty doesn't increase until after the attacks."}, {"name": "Life Sap", "type": "passive", "traits": [], "text": "A creature damaged by the gray death's hand Strike must succeed at a DC 42 Fortitude save or become Drained 1, and Paralyzed for 1 round on a critical failure."}, {"name": "Resentful Possession", "type": "action", "traits": ["curse", "mental", "occult", "possession"], "cost": 1, "text": "Frequency once per round%rEffect The gray death chooses a living creature within 30 feet. The target must succeed at a DC 42 Will save or a fragment of embittered soul-stuff lodges within the target's spirit and turns it against its allies. While the target has this fragment, it doesn't count as anyone's ally for the purposes of providing flanking, and a would-be ally casting a spell that normally works only on an ally on the creature must succeed at a DC 42 counteract check (level 20) or the…"}, {"name": "Spectral Lurker", "type": "passive", "traits": [], "text": "The gray death isn't Slowed 1 when it starts its turn inside an object."}]
