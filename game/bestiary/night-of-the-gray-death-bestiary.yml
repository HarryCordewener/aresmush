  actions: [{"name": "Anonymity", "type": "passive", "traits": [], "text": "The Gray Gardener assassin has a +2 circumstance bonus to Deception checks and saving throws to conceal their identity and a +2 circumstance bonus to their Deception DC against effects that ferret out information about the Gray Gardener's identity."}, {"name": "Gardener's Resolve", "type": "reaction", "traits": [], "text": "Trigger The Gray Gardener assassin rolls a failure (but not a critical failure) on a Will save against an effect with the mental or fear trait%rRequirements The Gray Gardener assassin's features are obscured by a mask or hood%rEffect The Gray Gardener assassin takes 3d8 mental damage, and the saving throw is a success."}, {"name": "Instant Opening", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "The Gray Gardener assassin distracts a creature within 30 feet, using a few choice words or gestures. The creature is Off-Guard against the assassin's attacks until the end of the assassin's next turn. Depending on the distraction, this action gains either the auditory or the visual trait."}, {"name": "Mark for Death", "type": "action", "traits": [], "cost": 3, "text": "The Gray Gardener assassin designates a single creature they can see and hear as their mark. This effect lasts until the mark dies or the assassin uses Mark for Death again. The assassin gains a +2 circumstance bonus to Perception checks to Seek the mark and on Deception checks to Feint against the mark. The assassin's melee and ranged Strikes gain the deadly d8 weapon traits when attacking the mark."}, {"name": "Poison Weapon", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The Gray Gardener assassin is wielding a piercing or slashing weapon and has a free hand%rEffect The assassin applies a poison to the weapon."}, {"name": "Quick Draw", "type": "action", "traits": [], "cost": 1, "text": "The Gray Gardener assassin Interacts to draw a weapon and then Strikes with that weapon."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The Gray Gardener assassin deals an additional 6d6 precision damage precision damage to Off-Guard creatures."}, {"name": "Surprise Attack", "type": "passive", "traits": [], "text": "On the first round of combat, creatures that haven't acted yet are Off-Guard to the Gray Gardener assassin."}]
