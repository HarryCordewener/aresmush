circumstance bonus to AC until the start of the chakanaj's next turn.%rEffect: Interpose"}, {"name": "Peel Away", "type": "action", "traits": ["concentrate", "move"], "cost": 1, "text": "Requirements The chakanaj is Bonded with a Host%rEffect the chakanaj removes itself from its host, peeling off the host's body and enters an adjacent space."}, {"name": "Skip Between", "type": "action", "traits": ["divine", "teleportation"], "cost": 1, "text": "The chakanaj sahkil moves from the Material Plane to the Ethereal Plane or vice versa, with the effects of Ethereal Jaunt except the effect has an unlimited duration and can be Dismissed. A summoned sahkil can't use Skip Between."}]
