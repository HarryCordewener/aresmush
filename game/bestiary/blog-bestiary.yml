  actions: [{"name": "Battle Cry", "type": "free", "traits": [], "text": "Trigger The Brass Dragon rolls initiative.%rEffect The Brass Dragon roars out a mighty challenge and attempts to demoralize a creature it can see."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Bravo's Determination", "type": "reaction", "traits": [], "text": "Trigger A foe's Strike reduces you to 0 Hit Points; you were not at 1 Hit Point and you would not be killed.%rYour confidence borders on self-delusion, but it keeps you going against overwhelming odds. Attempt a Deception check against the attack DC of the triggering Strike. You take a penalty to this check equal to twice your wounded value, if any. If the triggering attack was a critical hit, use the result one degree of success worse than what you rolled.%rCritical Success You avoid being…"}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 37 Will"}, {"name": "Wing Deflection", "type": "reaction", "traits": [], "text": "Trigger The dragon is targeted with an attack.%rEffect The dragon raises its wing, gaining a +2 circumstance bonus to AC against the triggering attack. If the dragon is flying, it descends 10 feet after the attack is complete."}, {"name": "Breath Weapon", "type": "action", "traits": ["arcane", "fire", "incapacitation", "sleep"], "cost": 2, "text": "The brass dragon breathes in one of two ways.%rThe dragon can't use Breath Weapon again for 1d4 rounds.%rFlame The dragon breathes fire in a 100-foot that deals 16d6 fire|options:area-damage damage (DC 41 Reflex save). Sleep Gas The dragon breathes an 80-foot of sleep gas. Each creature within the cone must succeed at a DC 41 Fortitude save or fall Unconscious for 1d6 rounds, or 1 minute on a critical failure."}, {"name": "Desert Wind", "type": "action", "traits": ["air", "arcane", "concentrate"], "cost": 2, "text": "Frequency three times per day.%rEffect The dragon calls upon the desert wind. This has the same effect as Gust of Wind (DC 39 Fortitude) but in a 60-foot. A creature that fails its save is also Blinded until the end of its next turn (or for 1 minute on a critical failure)."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "The dragon makes two claw Strikes and one jaws Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "When the dragon scores a critical hit with a strike, it recharges Breath Weapon."}]
