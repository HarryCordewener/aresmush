  actions: [{"name": "Grit Teeth", "type": "reaction", "traits": ["emotion", "mental"], "text": "Zhang Yong fails or critically fails a saving throw against an enchantment or fear effect Effect Zhang Yong succeeds on the saving throw instead and takes 2d6 mental damage. If he critically failed on the triggering saving throw, he also takes 2d6 persistent mental and cannot use this ability again while taking persistent mental damage."}, {"name": "Disrupting Strikes", "type": "action", "traits": [], "cost": 1, "text": "Zhang Yong calls forth vitality energy from within to help him destroy undead. His weapons and unarmed Strikes gain the effects of a greater disrupting property rune until the start of his next turn.%rA Greater Disrupting weapon pulses with vitality energy, dealing an extra 2d6 vitality damage to undead On a critical hit, instead of being enfeebled 1, the undead creature must attempt a Fortitude save with the following effects. This is an incapacitation effect.%rCritical Success It's Enfeebled…"}, {"name": "Reach Beyond", "type": "passive", "traits": [], "text": "Zhang Yong has learned to move his spiritual energy past himself to attack spirits where others can't. He can make melee Strikes against incorporeal creatures that are inside solid objects as long as the object is within his reach. An incorporeal creature inside of a solid object is hidden, requiring him to succeed at a DC 11 Flat check when he targets it. He can spend an action, which has the concentrate trait, to focus on a creature inside of a solid object. If he does, the next melee Strike…"}, {"name": "Soul Dance Stance", "type": "action", "traits": [], "cost": 1, "text": "Zhang Yong begins a stance that aligns him with the River of Souls and he can make soul strike attacks that seem almost incorporeal. These deal 1d8 bludgeoning damage; are in the brawling group; and have the agile, finesse, nonlethal, and unarmed traits. Soul Strikes treat cover against living and incorporeal undead targets as degree less severe (greater cover becomes standard cover, standard cover becomes lesser cover, and lesser cover is ignored)."}]
