  actions: [{"name": "Draconic Exemplar (Green Dragon)", "type": "passive", "traits": [], "text": "Urok draws minor powers from his green draconic exemplar. This determines his scale color and appearance, and dragons sometimes look more favorably upon those kobolds who resemble them, at the GM's discretion. His exemplar also determines details of other abilities:%rBreath weapon cone Damage type poison Saving throw Fortitude"}, {"name": "Crystalline Dust", "type": "action", "traits": [], "cost": 2, "text": "Frequency once per day%rEffect Urok disperses the crystalline motes coating his body as a haze. He becomes Concealed, though he can't use this concealment to Hide or Sneak. The motes stay within an inch of his skin, move with you, and last for 4 rounds."}, {"name": "Preemptive Reconfiguration", "type": "reaction", "traits": [], "text": "Frequency once per day%rTrigger Urok would take bludgeoning piercing, or slashing damage%rEffect Urok's body anticipates the blow and the impact area briefly reorganizes into a strengthened tissue lattice that blunts the attack. He gains resistance 9 against the triggering damage type, which applies against the triggering damage Urok can expend his daily use of Crystalline Dust when using this reaction. If he does, his daily use of isn't expended and he can use it a second time."}, {"name": "Kobold Breath", "type": "action", "traits": ["arcane", "poison"], "cost": 2, "text": "Urok breathes a poisonous mist that deals 5d4 poison|options:area-damage damage in a 15-foot (DC 25 Fortitude save).%rHe can't use Kobold Breath again for 1d4 rounds."}, {"name": "Mastermind", "type": "passive", "traits": [], "text": "If Urok successfully identifies a creature using Recall Knowledge, that creature is off-guard against his attacks until the start of his next turn; if he critically succeeds, it's off-guard against his attacks for 1 minute."}, {"name": "Skirmish Strike", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round