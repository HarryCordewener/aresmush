  actions: [{"name": "Wind-Up", "type": "passive", "traits": [], "text": "24 hours, disable-device dc=27, standby%rFor a clockwork to act, it must be wound with a unique key by another creature. This takes 1 minute. Once wound, it remains operational for the listed amount of time, usually 24 hours, after which time it becomes unaware of its surroundings and can't act until it's wound again. Some clockworks' abilities require them to spend some of their remaining operational time. They can't spend more than they have and shut down immediately once they have 0 time…"}, {"name": "Clockwork Wand", "type": "passive", "traits": [], "text": "The divine warden uses a mechanical wand as a focus to channel magical energy. This wand is built into the divine warden's chest, with only the crystal at the end exposed. The warden can Interact to remove the wand, or someone else can remove it with a Thievery check to disable-device skill=thievery dc=32. The divine warden becomes unable to cast any spells except cantrips while the wand is removed.%rWhen removed, the clockwork wand is a magic wand containing the last 2nd-rank innate spell the…"}, {"name": "Divine Destruction", "type": "passive", "traits": ["divine"], "text": "When the divine warden is reduced to 0 HP, it erupts with divine energy in a 30-foot, dealing 10d6 vitality|options:area-damage damage. Each creature in the area must attempt a DC 29 Will save with the following outcomes.%rCritical Success The creature takes half damage.%rSuccess The creature takes full damage.%rFailure The creature takes full damage and becomes temporarily cursed by Brigh. The creature becomes Enfeebled 1 and Stupefied 1 for 1 day; this is a curse effect with a counteract DC…"}, {"name": "Faith Bound", "type": "passive", "traits": ["divine"], "text": "The divine warden can't attack a creature that openly wears or displays Brigh's religious symbol unless that creature uses a hostile action against the divine warden first."}, {"name": "Energize Clockwork Wand", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Frequency once per 10 minutes%rEffect The divine warden regains a spell it has already cast that day. It must spend 1 hour of its operational time, or 2 hours if the spell is 3rd level or higher."}, {"name": "Faithful Weapon", "type": "passive", "traits": [], "text": "light hammer, striking rune%rA divine warden always wields its patron deity's favored weapon. If the weapon is a ranged weapon, the divine warden automatically generates new ammunition with each attack. For a divine warden of 4th level or higher, the deity's favored weapon gains the effects of a Striking rune while the divine warden wields it; at 12th level, these effects are of a Greater Striking rune, and at 19th level, they're instead of a Major Striking rune."}, {"name": "Instrument of Faith", "type": "passive", "traits": [], "text": "The divine warden is a beacon for Brigh's faith. A cleric of Brigh can channel a Heal spell through a divine warden of Brigh they can see within 60 feet. The cleric determines any targets or area for the spell as if they were standing in the divine warden's space."}]
