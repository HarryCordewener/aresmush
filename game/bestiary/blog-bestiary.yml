  actions: [{"name": "Cringe", "type": "reaction", "traits": ["emotion", "kobold", "mental", "visual"], "text": "Trigger A creature Duhgik is aware of critically succeeds on a Strike against her and would deal damage to her%rEffect With pitiful posturing, she causes her foe to pull back a deadly attack. The attacking creature takes a -8 circumstance penalty to the damage of the triggering Strike. This penalty applies after doubling the damage for a critical hit. The attacker is then immune to Duhgik's for 24 hours."}, {"name": "Remote Trigger", "type": "passive", "traits": [], "text": "Duhgik has learned how to trigger snares from afar, creating ranged hazards to assail her opponents and allowing her to disarm enemies' snares harmlessly. She can Strike a snare to trigger it prematurely. If she crafted the snare, she automatically hits. If someone else crafted it, she must attempt a ranged Strike against the Crafting DC, triggering the snare only if she hits."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Duhgik deals an extra 1d6 precision damage to Off-Guard creatures."}, {"name": "Surprise Snare", "type": "action", "traits": ["manipulate"], "cost": 2, "text": "Duhgik installs one of her snares prepared for quick deployment in a space that's occupied by an opponent. It must be a snare that normally takes 1 minute or less to Craft. The snare automatically triggers, but it takes a -2 circumstance penalty to any applicable save DC, as well as any attack rolls or other checks the snare attempts."}]
