  actions: [{"name": "Trinket Bound", "type": "passive", "traits": [], "text": "Jervis Stoot can normally stray only a short distance from the underground chambers atop Chopper's Isle just north of Sandpoint, but when the head of the clockwork songbird is brought out of that area, Stoot can follow. As long as a creature he possesses carries the head, he can travel as he wishes, but no further than 5 miles from the town of Sandpoint."}, {"name": "Avian Vulnerability", "type": "passive", "traits": [], "text": "Jervis' resistance to all damage is additionally bypassed by Strikes from birds or avian creatures (including creatures who fly with wings, but not creatures who fly through magic alone)"}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "If Jervis is destroyed, he rejuvenates back in the underground chambers below Chopper's Isle and seeks out the carrier of the Clockwork Songbird's head as long as they remain within 5 miles of Sandpoint. If the architect of his whole doom, the Red Bishop, is slain, Stoot can move on to the afterlife.%rWhen a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Ghostly Murder", "type": "action", "traits": ["divine"], "cost": 2, "text": "Jervis Stoot raises a hand high, and a murder of ghostly crows manifests in a vortex above his hand. He then lowers his hand to point in a direction, and the murder of ghostly crows swarms out in a 20-foot. All creatures caught in the area must attempt a DC 30 Reflex save. Jervis can't use Ghostly Murder again for 1d4 rounds.%rCritical Success The creature is unaffected.%rSuccess The creature takes 6d6 slashing|options:area-damage damage.%rFailure The creature takes 10d6 slashing damage and 2d6…"}, {"name": "Malevolent Possession", "type": "action", "traits": ["incapacitation", "mental", "possession"], "cost": 2, "text": "The ghost attempts to possess an adjacent corporeal creature that carries the head of the Clockwork Songbird somewhere on their person. This has the same effect as the Possession spell, except since the ghost doesn't have a physical body, it is unaffected by that restriction of the spell."}, {"name": "Tears of Blood", "type": "action", "traits": ["divine"], "cost": 2, "text": "Frequency once per day%rEffect Jervis Stoot makes a plucking motion with his fingers. One creature he can sense within 30 feet experiences the agony of their eyes being plucked out and takes 12d6 mental damage from the pain (DC 30 Fortitude save, plus Blinded for 1 minute on a critical failure)."}]
