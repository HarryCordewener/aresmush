  strikes: [{"name": "Claw", "bonus": 26, "damage": [["3d8+11", "slashing", null]], "traits": ["agile", "finesse", "unarmed"]}, {"name": "Longsword", "bonus": 27, "damage": [["3d8+11", "slashing", null]], "traits": ["versatile-p"]}]
  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Portentous Gaze", "type": "passive", "traits": ["aura", "emotion", "fear", "mental", "occult", "visual"], "text": "30 feet. When a creature ends its turn in the aura, it must attempt a DC 31 Will save. A creature that fails is Frightened 1 (or Frightened 2 on a critical failure)%rThe mothman can deactivate or activate this aura with a single action, which has the concentrate trait."}, {"name": "True Temptation", "type": "reaction", "traits": ["divine", "mental"], "text": "Frequency three times a day%rTrigger A creature within 30 feet of the Red Bishop speaks Pazuzu's name aloud three times with a single breath%rEffect The Red Bishop casts Charm on the creature. A creature with a fly speed takes a –4 circumstance penalty to the saving throw against this charm ."}, {"name": "Agent of Fate", "type": "action", "traits": ["primal"], "cost": 3, "text": "Frequency once per day%rEffect The mothman casts any spell of 5th level or lower that normally takes 2 or fewer actions to cast, whether they have those spells in their innate spells or not.%rThey can use this ability only if doing so steers the flow of fate in its proper course toward a disaster or otherwise significantly memorable event.%rWhat the proper flow of fate entails is determined by the GM, but some examples include casting Illusory Scene to coax someone to a portentous location,…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The Red Bishop takes on the appearance of a Tiny red sea gull or red hawk. This doesn't change his speed, but he can't make Strikes in this form."}, {"name": "Command the Hateful Skies", "type": "passive", "traits": [], "text": "The Red Bishop's telepathic words carry an unsettling weight and promise of punishment when spoken to any evil creature capable of flight. Against such creatures, the Red Bishop gains a +3 circumstance bonus to attempts to Make an Impression, Request, Coerce, and Demoralize, and he increases the DC of any mental effect he uses against such creatures by 3 as well. Even without these bonuses, evil flying creatures tend to treat the Red Bishop with a mix of respect, if not outright fear."}, {"name": "Extract Fear", "type": "action", "traits": ["divine", "mental"], "cost": 2, "text": "The Red Bishop reaches out with one hand toward a Frightened 1 creature he can see that's within 30 feet and makes a clutching motion to pull out the creature's fear and feed upon it. The Red Bishop restores (7d8+8) healing Hit Points to himself, and the target creature loses the frightened condition but must also attempt a DC 34 Will save as other emotions are drawn out of their mind as well to fade uselessly away, resulting in mental trauma and a strange numbness in the mind itself.%rCritical…"}, {"name": "Focus Gaze", "type": "action", "traits": ["concentrate", "emotion", "fear", "mental", "occult", "visual"], "cost": 1, "text": "The mothman fixes their glare at a creature they can see within 30 feet. The target must immediately attempt a Will save against the mothman's portentous gaze.%rIf the creature is already Frightened when it attempts this save, on a failure it becomes Stupefied 1 for 24 hours in addition to the frightened effect.%rAfter attempting its save, the creature is then temporarily immune for 1 minute."}]
