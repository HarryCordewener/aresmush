  actions: [{"name": "Wind-Up", "type": "passive", "traits": [], "text": "24 hours, DC 26 Thievery, standby%rFor a clockwork to act, it must be wound with a unique key by another creature. This takes 1 minute. Once wound, it remains operational for the listed amount of time, usually 24 hours, after which time it becomes unaware of its surroundings and can't act until it's wound again. Some clockworks' abilities require them to spend some of their remaining operational time. They can't spend more than they have and shut down immediately once they have 0 time…"}, {"name": "Activate Serpent Mode", "type": "reaction", "traits": [], "text": "Trigger The clockwork serpent begins its turn%rEffect The clockwork serpent transforms into a different mode. Roll 1d3 and consult the options below. If it rolls a mode it can't currently activate, the clockwork serpent becomes Clumsy 1 until the start of its next turn. At the end of its turn, it automatically deactivates its serpent mode.%r1 Cobra Mode The clockwork serpent can use Intimidating Hood.%r2 Constrictor Mode The clockwork serpent can use its coils Strike and can Constrict.%r3…"}, {"name": "Critical Deactivation", "type": "passive", "traits": [], "text": "If a clockwork serpent takes any precision damage or takes a critical hit and it has a serpent mode active, it must attempt a DC 16 Flat. On a failure, it takes the damage from the critical hit as normal, is Stunned 1, and its serpent mode deactivates."}, {"name": "Clockwork Serpent Venom", "type": "passive", "traits": ["arcane", "magical", "poison"], "text": "Saving Throw DC 26 Fortitude%rMaximum Duration 6 rounds%rStage 1 2d6 poison damage and Off-Guard (1 round)%rStage 2 2d6 poison damage, Enfeebled 1, and off-guard (1 round)"}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(2d10+6) bludgeoning, DC 26 Fortitude%rRequirements The clockwork serpent is in constrictor mode"}, {"name": "Intimidating Hood", "type": "action", "traits": ["arcane", 