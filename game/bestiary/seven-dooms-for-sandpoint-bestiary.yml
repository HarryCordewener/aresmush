  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Lifesense 60 feet", "type": "passive", "traits": []}, {"name": "Body Thief", "type": "action", "traits": ["manipulate", "occult", "possession"], "cost": 3, "text": "The intellect devourer reduces in size and burrows into the brain of a creature dead for no longer than 1 day. At the start of the intellect devourer's next turn, the body revives at its maximum Hit Points, controlled by the devourer. The intellect devourer is conscious and can sense everything the possessed body could.%rAny effect that ends the possession kills the host body with the same effects as Exit Body. The intellect devourer can't use any of the host creature's spells with Body Thief…"}, {"name": "Exit Body", "type": "action", "traits": ["move"], "cost": 1, "text": "Requirements The intellect devourer is controlling a body with Body Thief%rEffect The intellect devourer leaves its host body, which dies instantly and is no longer a suitable host for any Body Thief ability. The intellect devourer appears at full size in an adjacent space."}, {"name": "Nightmare Curse", "type": "action", "traits": ["curse", "illusion", "incapacitation", "mental", "occult"], "cost": 2, "text": "Frequency once per day%rEffect Tiluatchek reaches out with his mind to infect the dreams of a single creature within 60 feet that he can see. The target suddenly experiences a brief but overwhelming memory of a harrowing nightmare it had at some point in the past and must attempt a DC 32 Will save. The effects of this curse are permanent until the target is cured (although any frightened condition values imparted by the curse pass and end normally).%rCritical Success The target is unaffected,…"}, {"name": "Ravage", "type": "action", "traits": ["death"], "cost": 3, "text": "The intellect devourer makes two talon Strikes against a Paralyzed, Restrained, or Unconscious creature, using the same attack modifier as its highest attack modifier.%rThese Strikes gain the death trait. If Ravage kills the target, the intellect devourer may use Body Thief against it as a free action."}, {"name": "Stolen Identity", "type": "passive", "traits": [], "text": "While an intellect devourer uses Body Thief, it gains the ability to understand and speak all languages known by the host, as well as knowledge of the host body's abilities, identity, role in society, and personality. However, it does not gain the specific memories or knowledge of the host body."}]
