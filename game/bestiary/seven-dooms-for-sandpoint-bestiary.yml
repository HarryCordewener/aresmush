  actions: [{"name": "Trackless", "type": "passive", "traits": [], "text": "A hodag sweeps the ground behind it with its tail as it moves, obscuring its tracks. The DCs of checks to Track a hodag are increased by 10."}, {"name": "Ferocity", "type": "reaction", "traits": []}, {"name": "Rip and Tear", "type": "action", "traits": [], "cost": 2, "text": "The hodag makes two claw Strikes and one jaws Strike in any order."}, {"name": "Sickly", "type": "passive", "traits": [], "text": "Cruncher is Enfeebled 1 due to his mistreatment from the goblins. In addition, his eyes are rheumy and caked with gunk, resulting in a –4 circumstance penalty to sight-based Perception checks and causing him to be Blinded beyond a range of 5 feet. If he escapes into the wild, he heals back up after a few nights' rest and a big meal. Alternatively, a PC can speed his recovery with a DC 20 Medicine check, with the results detailed below; this takes 10 minutes to perform, and as such Cruncher…"}, {"name": "Toss", "type": "action", "traits": [], "cost": 2, "text": "The hodag Strides, then makes a Strike against a target in reach. If it moves at least 20 feet and succeeds at its Strike, the hodag deals damage normally and then attempts an Athletics check against the creature's Fortitude DC to toss the enemy into the air.%rOn a success, the tossed creature is thrown 10 feet in a straight line in the direction of the hodag's choice and then lands Prone. If the creature is knocked into a solid object, it takes 1d6 bludgeoning damage as well before landing…"}, {"name": "Knockdown", "type": "action", "traits": [], "cost": 1}]
