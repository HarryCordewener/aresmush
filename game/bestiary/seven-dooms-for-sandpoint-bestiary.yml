  actions: [{"name": "Site Bound", "type": "passive", "traits": [], "text": "A typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "Completing the ghost mage's project allows it to move on to the afterlife.%rWhen a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence and sets right whatever prevents the spirit from resting."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Frightful Moan", "type": "action", "traits": ["auditory", "divine", "emotion", "fear", "mental"], "cost": 2, "text": "The ghost laments its fate, forcing each living creature within 30 feet to attempt a DC 29 Will save. On a failure, a creature becomes Frightened 2 (or Frightened 3 on a critical failure). On a success, a creature is temporarily immune to this ghost's frightful moan for 1 minute."}, {"name": "Telekinetic Assault", "type": "action", "traits": ["divine"], "cost": 2, "text": "The ghost cries out in pain and anguish as small objects and debris fly about in a 30-foot. Creatures in this area take 6d6 bludgeoning|options:area-damage damage, subject to a DC 29 Reflex save."}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 29, "attack": 23, "spells": {"0": ["Daze", "Stabilize"], "1": ["Bless", "Enfeeble"], "2": ["Clear Mind", "Share Life"], "3": ["Heal", "Heroism"], "4": ["Dispel Magic", "Spiritual Weapon"], "5": ["Heal"]}}]
