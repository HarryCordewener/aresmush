  actions: [{"name": "Rat Empathy", "type": "passive", "traits": ["primal"], "text": "The wererat can communicate with rodents."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "Human with fist +18 for 1d4+5 bludgeoning, or Small rat with Speed 30 feet, climb Speed 10 feet%rThe werecreature changes into its humanoid, hybrid, or animal shape. Each shape has a specific, persistent appearance. A true werecreature's natural form is its hybrid shape.%rIn humanoid shape, the werecreature uses its original humanoid size, loses its jaws and claws Strikes, and gains a melee fist Strike that deals bludgeoning damage equal to the slashing damage dealt by its claw.%rIn animal…"}, {"name": "Curse of the Wererat", "type": "passive", "traits": ["curse", "primal"], "text": "This curse affects only humanoids.%rSaving Throw DC 26 Fortitude%rOn each full moon, the cursed creature must succeed at another Fortitude save or turn into a wererat until dawn.%rThe creature is under the GM's control and goes on a rampage for half the night before falling unconscious until dawn."}, {"name": "Moon Frenzy", "type": "passive", "traits": ["polymorph", "primal"], "text": "When a full moon appears in the night sky, the werecreature must enter hybrid form, can't Change Shape thereafter, becomes one size larger, increases its reach by 5 feet, and increases the damage of its jaws Strike by 2.%rWhen the moon sets or the sun rises, the werecreature returns to humanoid form and is Fatigued for 2d4 hours.%rEffect: Moon Frenzy"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Adimar's Strikes deal an additional 2d6 precision damage to Off-Guard creatures."}, {"name": "Unexpected Transformation", "type": "action", "traits": [], "cost": 1, "text": "Requirements Adimar is in human or rat form%rEffect Adimar uses Change Shape to transform into his hybrid form and attempts to Demoralize one target within 30 feet, gaining a +2 circumstance bonus to his Intimidation check to do so. All creatures who witness Adimar use Unexpected Transformation can't be Demoralized by future Unexpected Transformations for 24 hours."}]
