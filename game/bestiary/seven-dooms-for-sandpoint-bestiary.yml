  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Fungaltongue", "type": "passive", "traits": [], "text": "A fungus tyrant can speak with all forms of fungus, be they fungal creatures or otherwise. Most normal fungi don't recognize details about creatures or know anything about the world beyond their immediate vicinity. A fungus tyrant gains a +3 circumstance bonus on all Deception, Diplomacy, or Intimidation checks made against fungus creatures."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Create Spawn", "type": "passive", "traits": ["divine"], "text": "If a creature dies after being reduced to 0 HP by a fungus tyrant's Mind-Draining Kiss, the fungus tyrant can turn this victim into a spore thrall by donating some of their own fungal matter to the victim and leaving them to \"ripen\" within a patch of fungus for 24 hours. After this time, the creature is restored to life but gains the fungus trait and becomes a spore thrall. This prevents the creature's soul from continuing on to the afterlife in a similar manner to how undead are taken out of…"}, {"name": "Grow Sporepod", "type": "action", "traits": ["divine"], "cost": 2, "text": "The fungus tyrant causes a human-sized pod of fungal material to burst out of the ground at any point they can see within 60 feet. Once created, a sporepod lasts for 1 minute, until the fungus tyrant moves more than 120 feet away from it, or until it's destroyed (AC 28, Hardness 10, 20 HP). The fungus tyrant cannot Grow a Sporepod again for 1d4 rounds, but apart from this and a sporepod's 1 minute life, there is no hard limit to the number of sporepods a single fungus tyrant can have active at…"}, {"name": "Mind-Draining Kiss", "type": "action", "traits": ["divine", "emotion", "mental"], "cost": 1, "text": "Frequency once per round%rEffect The fungus tyrant engages a creature they have Grabbed in an act of passion in an attempt to drain its will and personality. The kiss makes the creature Stupefied 1 or increases its stupefied condition by 1, to a maximum of 4. The creature takes 4d6 poison damage and must then succeed at a DC 28 Will save or be affected by a Suggestion to remain immobile rather than trying to Escape."}, {"name": "Sporestride", "type": "action", "traits": ["move", "teleportation"], "cost": 1, "text": "The fungus tyrant Steps into an adjacent sporepod and instantly teleports to any other active sporepod they've created, bursting out of the target sporepod and destroying it in the process."}, {"name": "Sporewarp", "type": "action", "traits": ["attack"], "cost": 1, "text": "The fungus tyrant attempts a tentacle Strike but treats a sporepod of their choice within 120 feet that they can see as the point of origin of that tentacle Strike."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
