  strikes: [{"name": "Jaws", "bonus": 21, "damage": [["2d10+7", "piercing", null], ["1d10", "mental", null]], "traits": ["finesse", "unarmed"]}, {"name": "Claw", "bonus": 21, "damage": [["2d8+7", "slashing", null]], "traits": ["agile", "finesse", "unarmed"]}]
  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Thoughtsense 60 feet", "type": "passive", "traits": ["mental", "occult"], "text": "The gosreg senses a creature's mental essence as a precise sense with the listed range; it cannot sense mindless creatures with thoughtsense."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Unsettled Aura", "type": "passive", "traits": ["aura", "mental", "occult"], "text": "30 feet. Gosregs project a field of discordant energy that unsettles the minds of thinking creatures. Any non-mindless creature within 30 feet of a gosreg takes a -1 status penalty to Will saves.%rEffect: Unsettled Aura"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The gosreg takes on the appearance of any Small or Medium humanoid. This doesn't change its Speed or its attack and damage modifiers with its Strikes, but it might change the damage type its Strikes deal (typically to bludgeoning)."}, {"name": "Mind Bolt", "type": "action", "traits": ["illusion", "mental", "occult"], "cost": 2, "text": "A gosreg concentrates its field of discordant mental energy and projects it into the mind of an enemy within 60 feet. The target takes 6d6 mental damage (DC 30 Will save). On a critical failure, the creature is also Confused for 1d4 rounds."}]
