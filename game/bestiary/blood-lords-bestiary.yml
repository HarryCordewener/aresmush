arily immune to Soul Lock.%rSuccess Matron Uldrula's staff tugs at the creature's soul but doesn't trap it. If the creature is living, it…"}, {"name": "Spirit Touch", "type": "passive", "traits": [], "text": "Matron Uldrula's Strikes affect incorporeal creatures with the effects of a Ghost Touch property rune and deal 4d6 void damage to living creatures and 4d6 vitality damage to undead."}]
