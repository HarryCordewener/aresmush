  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Bardic Lore", "type": "passive", "traits": [], "text": "Intellect assemblages are created from the thoughts and memories of hundreds of individuals, providing them a near limitless collection of data to pull from. Intellect assemblages have access to Bardic Lore, a special Lore skill allowing them to Recall Knowledge on any topic."}, {"name": "Thoughtsense 100 feet", "type": "passive", "traits": ["mental", "occult"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Fascinating Facets", "type": "passive", "traits": ["aura", "illusion", "mental", "visual"], "text": "20 feet. The thought shards composing the intellect assemblage's body reflect countless memories, thoughts, and dreams. A creature that starts its turn in the aura must succeed at a DC 38 Will save or become Fascinated with the intellect assemblage for 1 round. An intellect assemblage can suppress or activate this aura as a single action with the concentrate trait."}, {"name": "Meticulous", "type": "passive", "traits": [], "text": "An intellect assemblage is analytical. Whenever they fail a saving throw against a mental spell or effect, the intellect assemblage is Slowed 1 for 1d4 rounds as they sift through the new information."}, {"name": "Invasive Thoughts", "type": "passive", "traits": ["mental", "occult"], "text": "When the intellect assemblage gets a critical hit with a fist or memory shard Strike, the target is also Confused for 1d4 rounds, as the memories stored in the assemblage's thought shards overwhelm the target's psyche."}]
