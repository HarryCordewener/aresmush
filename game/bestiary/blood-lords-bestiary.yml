d 1 and cannot remove the armor (1 day)%rStage 2 Doomed 2, the creature's Speed is reduced by 10, and cannot remove the armor (1 day)%rStage 3 dies and transforms into the armor's graveknight.%rEffect: Graveknight's Curse"}, {"name": "Phantom Steed", "type": "action", "traits": ["arcane"], "cost": 3, "text": "HP 130; AC 39, Fort +28, Ref +25, Will +22%rSeldeg summons a supernatural mount as per Marvelous Mount (8th level). Unlike phantom steed, the steed's AC and saving throw bonuses are all 4 levels lower than Seldeg's, and the steed has one-third of Seldeg's Hit Points (rounded down). If the steed is destroyed, Seldeg must wait 1 hour before using this ability again."}, {"name": "Ruinous Weapons", "type": "passive", "traits": [], "text": "Any weapon or unarmed attack Seldeg uses gains the effects of the +1 greater striking and greater flaming runes."}, {"name": "Unyielding Block", "type": "passive", "traits": [], "text": "At the start of each of Seldeg's turns, he gains two additional reactions he can use only to perform a Shield Block."}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "The graveknight has access to the critical specialization effects of any weapons it wields."}]
