  actions: [{"name": "Coven", "type": "passive", "traits": [], "text": "Iron Taviah adds Earthbind, Magic Passage, and Spellwrack to her coven's spells."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Magaambya Scar", "type": "passive", "traits": [], "text": "Taviah has an old injury that sometimes causes her pain. A physical attack on Taviah that scores a critical hit exacerbates the injury in her wounded leg; in addition to the other effects of the critical hit, Taviah is Stunned 1."}, {"name": "Bonds of Iron", "type": "action", "traits": ["attack", "occult"], "cost": 2, "text": "Frequency once per day%rEffect Iron Taviah can cause a cage built of cold iron fingernails to spring from nothingness around a target at a range of up to 30 feet, attempting an Athletics check to grapple against the target's Fortitude DC; if the target has a weakness to cold iron, Taviah gains a +2 circumstance bonus to this check. Unlike a normal Grapple, Taviah doesn't need to be within reach and can move as she pleases, and a successful attempt lasts until the creature Escapes, causing the…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "Iron Taviah can take on the appearance of any Medium female humanoid. This doesn't change her Speed, or her attack and damage bonuses with her Strikes, but might change the damage type her Strikes deal (typically to bludgeoning)."}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}, {"name": "Ritual Specialist", "type": "passive", "traits": [], "text": "Iron Taviah has a +2 circumstance bonus to the primary checks to perform a ritual. In addition, she can reduce the number of secondary casters for a ritual by 1. When she does, she must fulfill any requirements for the secondary caster, and she attempts the secondary check normally performed by that secondary caster. She can't replace a secondary caster who is the target of the spell (as in the Atone ritual)."}, {"name": "Scattered Coven", "type": "passive", "traits": [], "text": "When the characters meet Iron Taviah, the Graveclaw is at the height of its power. As a scattered coven, the Graveclaw grants Taviah the ability to cast the following spells as 3rd-rank occult spells, once per day each, without requiring help from her fellow coven members: Acid Arrow, Curse of Lost Time, Earthbind, Harm, Mimic Undead, Summon Construct, and Water Walk."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
