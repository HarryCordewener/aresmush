  actions: [{"name": "Thoughtsense 100 feet", "type": "passive", "traits": ["mental", "occult"], "text": "Taviah senses non-mindless creatures within 100 feet as a precise sense."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Magaambya Scar", "type": "passive", "traits": [], "text": "A physical attack on Taviah that scores a critical hit exacerbates the injury in her wounded leg; in addition to the other effects of the critical hit, Taviah is Stunned 1."}, {"name": "Mental Rebirth", "type": "passive", "traits": ["curse", "incapacitation", "mental", "occult"], "text": "Unlike most other undead, a vetalarana isn't destroyed when they reach 0 HP. Instead, their body is destroyed, crumbling to ash, and their mind is immediately transferred into a creature they rendered comatose through Drain Thoughts. This creature must be within 1 mile; if no such creature is in range, the vetalarana is destroyed. The creature becomes controlled by the vetalarana and loses the stupefied and Unconscious conditions. If the creature controlled by a vetalarana in this way is…"}, {"name": "Vetalarana Vulnerabilities", "type": "passive", "traits": [], "text": "All vetalaranas possess the following weaknesses.%rBarred Senses A vetalarana can't see or sense through force effects or cold iron, and their mind can't penetrate force effects or cold iron. Such barriers can prevent the transference of a vetalarana's mind through Mental Rebirth. Revulsion A vetalarana delights in consuming memories and secrets, and is disgusted by those who share such sensitive tidbits openly. A vetalarana can't voluntarily come within 10 feet of a creature loudly voicing…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Bonds of Iron", "type": "action", "traits": ["attack", "occult"], "cost": 2, "text": "Frequency once per day%rEffect Taviah can cause a cage built of cold-iron fingernails to spring from nothingness around a target at a range of up to 30 feet, attempting an Athletics check to grapple against the target's Fortitude DC. If the target has a weakness to cold iron, Taviah gains a +2 circumstance bonus to this check. Unlike a normal Grapple, Taviah doesn't need to be within reach and can move as she pleases, and a successful attempt lasts until the creature Escapes, causing the cage…"}, {"name": "Drain Thoughts", "type": "action", "traits": ["mental", "occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within Taviah's reach%rEffect Taviah seizes a creature and consumes its memories. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Stupefied 1 (Stupefied 2 if Taviah's Athletics check is a critical success), and Taviah regains 18 healing Hit Points, gaining any excess as temporary Hit Points. Draining…"}, {"name": "Paralyzing Claws", "type": "passive", "traits": ["incapacitation", "occult"], "text": "Any living creature hit by Taviah's claw Strike must succeed at a DC 29 Fortitude save or become Paralyzed. The target can attempt a new save at the end of each of its turns to end the effect, and the DC cumulatively decreases by 1 on each such save."}, {"name": "Rend (Claw)", "type": "action", "traits": [], "cost": 1}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
