  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Soulsense 60 feet", "type": "passive", "traits": [], "text": "A ravener senses the spiritual essence of living and undead creatures within the listed range. Creatures whose material bodies are one unit with their souls, like celestials and fiends, appear brighter to this sense."}, {"name": "Attack of Opportunity (Jaws Only)", "type": "reaction", "traits": [], "text": "Jaws only."}, {"name": "Cowering Fear", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 37 Will%rA ravener's frightful presence causes creatures to cower in fear as well. As long as a creature is at least Frightened 2 or more as a result of the ravener's frightful presence, it is also Immobilized from the fear."}, {"name": "Discorporate", "type": "free", "traits": ["divine"], "text": "Trigger The ravener takes excess damage to their soul ward but still has at least 51 Hit Points in their soul ward%rEffect The ravener draws deeply into their soul ward, discorporating their body into soul energy in order to escape. They take 50 damage to their soul ward and their physical body vanishes, reappearing 1d4 hours later in a random location within 1 mile from the location where they used Discorporate."}, {"name": "Soul Ward", "type": "passive", "traits": [], "text": "An intangible field of necromantic energy protects a ravener from total destruction. A soul ward has 150 maximum Hit Points.%rWhenever a ravener would be reduced below 1 Hit Point, all damage in excess of what would reduce them to 1 Hit Point is instead dealt to their soul ward. If this damage reduces the soul ward to fewer than 0 Hit Points, the ravener is destroyed.%rA soul ward's Hit Points can be restored only via specific ravener abilities such as Consume Soul, ravenous breath, or vicious…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consume Soul", "type": "free", "traits": ["death", "divine"], "text": "Trigger A living creature within 30 feet of the ravener dies%rEffect The ravener tears the creature's soul from its body with their maw and gulps it down. The dying creature must attempt a DC 44 Fortitude save with the same DC as the ravener's Breath Weapon.%rCritical Success The creature is unaffected.%rSuccess The ravener tears off a small chunk of the creature's soul. If the victim is restored to life, they are Drained 1 in addition to any other side effects of returning to life. The ravener…"}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "The ravener makes two claw Strikes and one wing Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "The ravener recharges their Breath Weapon whenever they score a critical hit with a Strike."}, {"name": "Ghost Bane", "type": "passive", "traits": [], "text": "The ravener's Strikes affect incorporeal creatures with the effects of a Ghost Touch property rune, and the ravener's jaws deal an additional 6d6 force damage to undead."}, {"name": "Ravenous Breath Weapon", "type": "action", "traits": [], "cost": 2, "text": "The ravener breathes in one of two ways. With either option, a creature that fails its save is also Drained 1 (or Drained 2 on a critical failure). If at least one creature is drained by the ravener's Ravenous Breath Weapon, the ravener's soul ward gains 5 healing HP. The ravener can't use Breath Weapon again for 1d4 rounds.%rVoid (necromancy, primal, void) The ravener breathes a blast of darkness in a 40-foot that deals 17d6 void damage plus 4d6 persistent void damage (DC 39 Reflex save).…"}, {"name": "Vicious Criticals", "type": "passive", "traits": [], "text": "The ravener treats an attack roll as a critical hit on a roll of 19 or 20, as long as the attack roll was a success. Additionally, whenever the ravener makes a critical hit with one of their Strikes, the target must succeed at a DC 37 Fortitude save or gain the Drained 1 condition. If the target already has a drained value of greater than 0, their drained value instead increases by 1, to a maximum of Drained 4. Whenever the ravener applies drain to a creature in this way, their soul ward gains…"}]
