  actions: [{"name": "Anchored Soul", "type": "passive", "traits": [], "text": "A granite vulture is mystically bonded to a vulture-shaped stone vessel. It must remain within 60 feet of it."}, {"name": "+1 Status to All Saves vs. Good", "type": "passive", "traits": []}, {"name": "Bonded Vessel", "type": "passive", "traits": [], "text": "The condition of a granite vulture's primary vessel dictates the vulture's maximum Hit Point value. Undamaged, the vulture-shaped vessel is an object with 28 Hit Points (BT 14). While the vulture is in spirit form, damaging them doesn't hurt the vessel, but damaging the vessel deals an equal amount of damage to the vulture. While the vulture Inhabits their vessel, they're a single target, and damage reduces the Hit Points of both the vulture and the vessel. If the vessel is broken, the vulture…"}, {"name": "Reconstitution", "type": "passive", "traits": ["divine"], "text": "When the vulture reaches 0 Hit Points, their spirit dissipates. If their vessel remains intact, the vulture re-forms within it after 2d4 days, fully healed. If the vessel is broken, their receptacle reconstitutes the vessel in 2d4 days, and the vulture re-forms within it in another 2d4 days. In the meantime, the vulture's consciousness inhabits their spirit receptacle. If both their vessel and receptacle are destroyed, the vulture is instantly slain and can't reconstitute."}, {"name": "Spirit Receptacle", "type": "passive", "traits": [], "text": "If the granite vulture's bonded vessel is destroyed, their spirit inhabits an inanimate skull-shaped receptacle. In this state, they're petrified and can take no actions other than to speak telepathically until they are Reconstituted. The spirit receptacle has 56 Hit Points (BT 14, Hardness 7)."}, {"name": "Inhabit Vessel", "type": "action", "traits": ["manipulate"], "cost": 2, "text": "The vulture touches and melds with their bonded vessel, bringing the statue to life. They can cease Inhabiting their Vessel by spending a single action, which has the concentrate trait. While Inhabiting the Vessel, they gain Immunities healing, nonlethal; Resistances physical 3 (except bludgeoning); and the following Strike."}, {"name": "Spirit Body", "type": "passive", "traits": [], "text": "When not Inhabiting their vessel or receptacle, the vulture is incorporeal, is Slowed 1, and gains resistance 3 to all damage (except force damage and damage from Strikes with the Ghost Touch property rune; double resistance against non-magical)."}]
