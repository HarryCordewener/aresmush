  actions: [{"name": "Lifesense 60 feet", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "20 feet. DC 34 Will"}, {"name": "Infuse Weapon", "type": "passive", "traits": ["divine"], "text": "A vanth's scythe is their symbol of office and gains a measure of their personal power. This scythe becomes a +2 striking scythe and is treated as if it were adamantine while the vanth wields it. A vanth whose scythe is taken or destroyed can infuse a new one with an hour of work."}, {"name": "Reaping Scythe", "type": "action", "traits": [], "cost": 2, "text": "The vanth throws their scythe, which flies in a 60-foot, dealing 6d8 slashing|options:area-damage damage to all creatures in the area (DC 34 Reflex) and returns to the vanth's hand."}, {"name": "Spirit Touch", "type": "passive", "traits": ["incorporeal"], "text": "A vanth's Strikes affect incorporeal creatures with the effects of a Ghost Touch property rune and deal 3d6 void damage to living creatures and 3d6 vitality damage to undead."}, {"name": "Vanth's Curse", "type": "action", "traits": ["curse", "divine", "misfortune"], "cost": 2, "text": "Frequency three times per day%rEffect The vanth bestows a curse on a creature by touching it with their scythe. The creature must attempt a DC 34 Will save.%rCritical Success The target is unaffected and is temporarily immune to Vanth's Curse for 24 hours.%rSuccess The target feels a momentary shudder of doom and is Stupefied 2 for 1 minute by the distracting sensation.%rFailure The target becomes morose and glum as it accepts its own inevitable fate. For 1 hour, the target is Stupefied 3. Each…"}]
