  actions: [{"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When Vikroti is destroyed, her soul immediately transfers to her Soul Cage. She can be permanently destroyed only if her soul cage is found and destroyed."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Cold Beyond Cold", "type": "passive", "traits": [], "text": "Vikroti's hand Strike deals cold damage, and the target is Slowed 2. A successful DC 44 Fortitude save reduces this to Slowed 1 (or negates on a critical success)."}, {"name": "Counterspell", "type": "reaction", "traits": [], "text": "Trigger A creature casts a spell Vikroti has prepared%rEffect Vikroti expends a prepared spell to counter the triggering creature's casting of that same spell. She loses her spell slot as if she'd cast the triggering spell. Vikroti then attempts to counteract the triggering spell."}, {"name": "Death's Chill", "type": "passive", "traits": ["aura", "cold"], "text": "15 feet. Vikroti is surrounded by an unnatural chill. Creatures that enter or begin their turn within the aura take 5d10 cold|options:area-damage damage and are Clumsy 2 (DC 37 Fortitude)."}, {"name": "Drain Soul Cage", "type": "free", "traits": [], "text": "Frequency once per day%rEffect Vikroti taps into her Soul Cage's power to cast any arcane spell up to the highest level she can cast, even if the spell being cast isn't one of her prepared spells. Her soul cage doesn't need to be present for her to use this ability."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Vikroti's spellcasting action, Vikroti attempts a DC 15 Flat. On a success, the action isn't disrupted."}]
