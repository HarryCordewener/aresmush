  actions: [{"name": "Lifesense (Imprecise) 60 feet", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Catch Rock", "type": "reaction", "traits": []}, {"name": "Counterspell", "type": "reaction", "traits": [], "text": "Trigger A creature casts a spell Kelganth has prepared%rEffect Kelganth expends a prepared spell to counter the triggering creature's casting of that same spell. Kelganth loses his spell slot as if he had cast the triggering spell."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "60 feet. DC 43 Will"}, {"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When a lich is destroyed, its soul immediately transfers to its Soul Cage . A lich can be permanently destroyed only if its soul cage is found and destroyed."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Soul Cage", "type": "free", "traits": [], "text": "Frequency once per day%rEffect Kelganth taps into his Soul Cage's power to cast any arcane spell up to 9th rank, even if the spell being cast is not one of his prepared spells. Kelganth's soul cage doesn't need to be present for him to use this ability."}, {"name": "Font of Death", "type": "action", "traits": ["divine", "void"], "cost": 3, "text": "The tomb giant turns the spiritual tide on a creature that has just died, temporarily transforming it into a volatile vessel of void energy. The tomb giant touches a creature that died in the past 24 hours, infusing its flesh and bone with void energy. Once during the next hour, the tomb giant can spend a single action (from any distance) to release this void energy from the corpse in an explosion that deals 11d12 void|options:area-damage damage in a 15-foot (DC 41 Fortitude); if not released…"}, {"name": "Paralyzing Doom", "type": "passive", "traits": ["arcane", "curse", "incapacitation"], "text": "A creature damaged by Kelganth's hand Strike is Doomed 1 and must succeed at a DC 41 Fortitude save. The creature becomes Paralyzed for 1 round on a failure. On a critical failure, the creature is paralyzed permanently, falls Prone, and seems dead. A DC 25 Medicine check reveals that the victim is alive."}, {"name": "Quickened Casting", "type": "free", "traits": [], "text": "Frequency once per day%rEffect If Kelganth's next action is to cast an cantrip or spell that is 8th level or less, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Kelganth's spellcasting action, he attempts a DC 15 Flat. On a success, the action isn't disrupted."}, {"name": "Throw Rock", "type": "action", "traits": [], "cost": 1}]
