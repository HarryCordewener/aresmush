  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Bolster Dead", "type": "free", "traits": [], "text": "Frequency once per turn%rRequirements Your most recent action was to cast a non-cantrip necromancy spell%rEffect You harness the residual energy from the spell you last cast into the body of an undead creature within 30 feet. That creature's resistances increase by an amount equal to the rank of the spell cast until the beginning of the next turn."}, {"name": "Drain Bonded Item", "type": "free", "traits": ["arcane"], "text": "Frequency once per day%rRequirements The necromancer hasn't acted yet on this turn%rEffect The necromancer expends the power stored in their dagger. This gives them the ability to cast one prepared spell they prepared today and already cast, without spending a spell slot."}, {"name": "Feed", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements The vampiric creature's most recent action was a successful jaws Strike that dealt damage%rEffect The vampiric creature drains blood from its victim, dealing minimum jaws damage and regaining 10 healing Hit Points."}, {"name": "Flamboyant Reposition", "type": "action", "traits": ["visual"], "cost": 1, "text": "With a flourish, a celebrant shrouds themself in a puff of smoke, glitter, or colorful ribbons. If the celebrant is adjacent to an enemy, they attempt to Feint that adjacent enemy. The celebrant Steps or Strides; they're Concealed during this movement."}]
