  actions: [{"name": "Children of the Deep", "type": "passive", "traits": ["divine", "mental"], "text": "Hyrune's presence brings forth creatures of the deep to do his bidding. These typically include bat swarms, giant spiders, and giant centipedes, but can include other Darklands creatures. Hyrune can give telepathic orders to these creatures as long as they are within 100 feet, but they can't communicate back."}, {"name": "Fast Healing 15", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Divided Faith", "type": "passive", "traits": [], "text": "Hyrune's devotion to Urgathoa has become undermined by his obsession with Orgesh. Urgathoa's religious symbol can be brandished at Hyrune to trigger his revulsion, provided the person attempting to do so accuses Hyrune of being a heretic or of betraying his faith. Hyrune takes a -2 circumstance penalty to Will saves to overcome this revulsion."}, {"name": "Mist Escape", "type": "free", "traits": [], "text": "Trigger The vampire is reduced to 0 HP.%rEffect The vampire uses Turn to Mist. It can take move actions to move toward its coffin even though it's at 0 HP. While at 0 HP in this form, the vampire is unaffected by further damage.%rIt automatically returns to its corporeal form, unconscious, if it reaches its coffin or after 2 hours, whichever comes first."}, {"name": "Vampire Weaknesses", "type": "passive", "traits": [], "text": "All vampires possess the following weaknesses.%rCompulsions Vampires are creatures of strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless it is transported while it hides within its coffin, nor can it enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions-a pirate vampire might not be able to set foot on solid ground without being invited, for example. The…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The vampire transforms into one of its animal forms or back into its normal form. Most vampires can turn into a bat, but some can turn into a different creature, such as a rat or a wolf.%rUse the options in the Aerial Form and Animal Form spells as guidelines.%rBat The vampire changes into a Bat Swarm or Giant Bat. It gains echolocation 40 feet, a land Speed of 20 feet and a fly Speed of 30 feet, and a fangs Strike with a +28 attack modifier. These fangs deal 3d12+16 piercing damage."}, {"name": "Create Spawn", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Blood, the vampire can turn this victim into a vampire by donating some of its own blood to the victim and burying the victim in earth for 3 nights.%rIf the new vampire is lower level than its creator, it is under the creator's control. If a vampire controls too many spawn at once (as determined by the GM), strong-willed spawn can free themselves by succeeding at a Will saving throw against the vampire's Will DC."}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "The vampire can cast Dominate at will as a divine innate spell. Casting it requires staring into the target's eyes, giving the spell the visual trait. The save DC uses the DC of the vampire's level, and a creature that succeeds is temporarily immune to that vampire's Dominate for 24 hours.%rFully destroying the vampire ends the domination, but merely reducing the vampire to 0 HP is insufficient to break the spell."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirement A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the vampire's reach.%rEffect The vampire sinks its fangs into that creature to drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions.%rThe victim is Drained 2 and the vampire regains 22 healing Hit Points, gaining any excess HP as temporary Hit Points. Drinking Blood from a creature that's already drained…"}, {"name": "Familiar", "type": "passive", "traits": [], "text": "Hyrune's familiar is Taulzhalotel, a one-eyed, long-tailed hairless bat with a fly speed of 25 feet, darkvision, manual dexterity (with its tail), speech, and spell delivery."}, {"name": "Gluttonous Gulp", "type": "action", "traits": ["divine"], "cost": 2, "text": "Hyrune dislocates his jaw to open his mouth far wider than it should, growing a thicket of additional fangs as he does. He attempts a fangs Strike and deals an additional 3d6 piercing damage on a successful hit and can attempt to Drink Blood if he as an action remaining, gaining a +2 circumstance bonus on his Athletics check to do so."}, {"name": "Turn to Mist", "type": "action", "traits": ["concentrate", "divine"], "cost": 1, "text": "The vampire turns into a cloud of vapor, as the Vapor Form spell, or back to its normal form. The vampire loses fast healing while in gaseous form.%rThe vampire can remain in this form indefinitely."}, {"name": "Witch Patron", "type": "passive", "traits": [], "text": "night (Orgesh)"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Occult Prepared Spells", "tradition": "occult", "type": "prepared", "dc": 36, "attack": 28, "spells": {"0": ["Daze", "Mage Hand", "Message", "Shield", "Telekinetic Projectile"], "1": ["Command", "Fear", "Sleep"], "2": ["Dispel Magic", "Mirror Image", "See Invisibility", "Status"], "3": ["Blindness", "Dream Message", "Slow"], "4": ["Confusion", "Dimension Door", "Fly", "Nightmare", "Suggestion"], "5": ["Black Tentacles", "Sending"], "6": ["Feeblemind", "Repulsion"], "7": ["Project Image", "Reverse Gravity", "Warp Mind"], "8": ["Maze"]}}, {"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 36, "attack": 28, "spells": {"6": ["Dominate (At Will)"]}}, {"name": "Occult Focus Spells", "tradition": "occult", "type": "focus", "dc": 36, "attack": 28, "spells": {"0": ["Shroud of Night"], "1": ["Blood Ward", "Phase Familiar"], "3": ["Malicious Shadow"]}}]
