  actions: [{"name": "Thoughtsense (Precise) 100 feet", "type": "passive", "traits": ["mental", "occult"], "text": "Kemnebi senses all non-mindless creatures within 100 feet as a precise sense."}, {"name": "Fast Healing 20", "type": "passive", "traits": []}, {"name": "Enlightened Mind", "type": "passive", "traits": [], "text": "Whenever Kemnebi is targeted by a mental effect, that effect's source or caster must succeed at a DC 5 Flat. If this check fails, the mental effect doesn't affect Kemnebi."}, {"name": "Mental Rebirth", "type": "passive", "traits": ["curse", "incapacitation", "mental", "occult"], "text": "Unlike most other undead, a vetalarana isn't destroyed when they reach 0 HP. Instead, their body is destroyed, crumbling to ash, and their mind is immediately transferred into a creature they rendered comatose through Drain Thoughts. This creature must be within 1 mile; if no such creature is in range, the vetalarana is destroyed. The creature becomes controlled by the vetalarana and loses the stupefied and Unconscious conditions. If the creature controlled by a vetalarana in this way is…"}, {"name": "Vetalarana Vulnerabilities", "type": "passive", "traits": [], "text": "All vetalaranas possess the following weaknesses.%rBarred Senses A vetalarana can't see or sense through force effects or cold iron, and their mind can't penetrate force effects or cold iron. Such barriers can prevent the transference of a vetalarana's mind through Mental Rebirth. Revulsion A vetalarana delights in consuming memories and secrets, and is disgusted by those who share such sensitive tidbits openly. A vetalarana can't voluntarily come within 10 feet of a creature loudly voicing…"}, {"name": "Center Self", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Kemnebi regains 1 Focus Point. If he's stupefied, he reduces the value of his stupefied condition by one. If Kemnebi is affected by a mental effect or spell, Kemnebi attempts to counteract that effect or spell with a +33 counteract modifier."}, {"name": "Control Comatose", "type": "passive", "traits": [], "text": "Frequency once per day%rEffect The vetalarana manipulator spends 10 minutes to take psychic control of the creatures they've rendered comatose with Drain Thoughts. This has the effects of the Possession spell, but lasts for up to 6 hours, has a range of 1 mile, and the vetalarana can control a number of comatose victims at a time equal to half the vetalarana's level. A comatose victim can't resist this possession and automatically gets a critical failure on its saving throw against Control…"}, {"name": "Deflect Attack", "type": "reaction", "traits": [], "text": "Requirements Kemnebi is aware of the attack, isn't Off-Guard, and has a hand free%rTrigger Kemnebi is the target of a physical ranged attack or ranged spell attack%rEffect Kemnebi gains a +4 circumstance bonus to AC against the triggering attack. If the attack misses, Kemnebi has deflected it. He can't use this reaction to deflect unusually massive ranged projectiles (such as boulders or ballista bolts)."}, {"name": "Drain Thoughts", "type": "action", "traits": ["occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within Kemnebi's reach%rEffect Kemnebi seizes a creature and consumes its memories. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Stupefied 2 and Kemnebi regains 35 healing HP, gaining any excess HP as temporary Hit Points. Draining Thoughts from a creature that's already stupefied doesn't restore any HP…"}, {"name": "Flurry of Blows", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Kemnebi makes two claw Strikes. If both hit the same creature, combine their damage for the purposes of resistances and weaknesses. Kemnebi applies his multiple attack penalty to the Strikes normally."}, {"name": "Paralyzing Claws", "type": "passive", "traits": ["incapacitation", "magical", "occult"], "text": "Any living, non-mindless creature hit by Kemnebi's claw Strike must succeed at a DC 36 Fortitude save or become Paralyzed. It can attempt a new save at the end of each of its turns, and the DC cumulatively decreases by 1 on each such save."}, {"name": "Improved Grab", "type": "free", "traits": []}]
