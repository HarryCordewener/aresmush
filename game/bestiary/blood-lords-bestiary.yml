  actions: [{"name": "Divine Destruction", "type": "passive", "traits": ["divine", "void"], "text": "When the divine warden is reduced to 0 HP, it erupts with divine energy in a 30-foot, dealing 5d6 void|options:area-damage damage. Each creature in the area must attempt a DC 20 Will save with the following outcomes.%rCritical Success The creature takes half damage.%rSuccess The creature takes full damage.%rFailure The creature takes full damage and becomes temporarily cursed by the patron deity. The creature becomes Enfeebled 1 and Stupefied 1 for 1 day; this is a curse effect that uses the…"}, {"name": "Faith Bound", "type": "passive", "traits": ["divine"], "text": "A divine warden can't attack a creature that openly wears or displays the religious symbol of the divine warden's patron deity unless that creature uses a hostile action against the divine warden first. If the divine warden is intelligent, it can also attack a creature it believes isn't faithful to its deity or who wears the religious symbol as a ruse (typically after succeeding at a Perception check to sense-motive)."}, {"name": "Golem Antimagic", "type": "passive", "traits": [], "text": "Harmed by fire (4d6 untyped, 1d8 untyped from areas or persistent damage); healed by electricity (area 1d6 healing HP); slowed by cold"}, {"name": "Stench", "type": "passive", "traits": ["aura", "disease", "olfactory"], "text": "40 feet. A creature entering the aura or starting its turn in the aura must succeed at a DC 19 Fortitude save or become Sickened 1 (plus Slowed 1 for as long as it's sickened on a critical failure). While within the aura, affected creatures take a -2 circumstance penalty to saves against disease and to recover from the sickened condition. A creature that succeeds at its save is temporarily immune for 1 minute."}, {"name": "Vulnerable to Gentle Repose", "type": "passive", "traits": [], "text": "Casting a Peaceful Rest spell on a meat guardian causes it to grow stiff. The golem attempts a DC 20 