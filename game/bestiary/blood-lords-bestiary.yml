  actions: [{"name": "Children of the Night", "type": "passive", "traits": ["divine", "mental"], "text": "The vampire's presence brings forth creatures of the night to do the master's bidding. These typically include Rat Swarms, Bat Swarms, and Wolves, but can include other creatures.%rThe vampire can give telepathic orders to these creatures as long as they are within 100 feet, but they can't communicate back."}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Vampire Weaknesses", "type": "passive", "traits": [], "text": "All vampires possess the following weaknesses.%rCompulsions Vampires are creatures of strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless it is transported while it hides within its coffin, nor can it enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions-a pirate vampire might not be able to set foot on solid ground without being invited, for example. The…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "Bat Jack changes into a Giant Bat. He gains echolocation 40 feet, a land Speed of 20 feet and a fly Speed of 30 feet, and a fangs Strike +25 for 2d8+13 piercing"}, {"name": "Create Spawn", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Blood, the vampire can turn this victim into a vampire by donating some of its own blood to the victim and burying the victim in earth for 3 nights.%rIf the new vampire is lower level than its creator, it is under the creator's control. If a vampire controls too many spawn at once (as determined by the GM), strong-willed spawn can free themselves by succeeding at a Will saving throw against the vampire's Will DC."}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "The vampire can cast Dominate at will as a divine innate spell. Casting it requires staring into the target's eyes, giving the spell the visual trait.%rFully destroying the vampire ends the domination, but merely reducing the vampire to 0 HP is insufficient to break the spell."}, {"name": "Dread Striker", "type": "passive", "traits": [], "text": "Any creature that has the Frightened condition is also Off-Guard to Weeping Jack's attacks."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirement A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the vampire's reach.%rEffect The vampire sinks its fangs into that creature to drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions.%rThe victim is Drained 2 and the vampire regains 16 healing HP, gaining any excess HP as temporary Hit Points. Drinking Blood from a creature that's already drained doesn't…"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Weeping Jack deals 3d6 extra precision damage to Off-Guard creatures."}, {"name": "Turn to Mist", "type": "action", "traits": ["concentrate", "divine"], "cost": 1, "text": "The vampire turns into a cloud of vapor, as the Vapor Form spell, or back to its normal form. The vampire loses fast healing while in gaseous form.%rThe vampire can remain in this form indefinitely."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
