  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Interposition", "type": "reaction", "traits": [], "text": "Trigger A ward within the guloval's reach would take damage from a Strike, and the guloval is within the attacker's reach%rEffect The guloval blocks the attack with their own body, taking the triggering attack's damage. The ward takes no damage."}, {"name": "Righteous Wound", "type": "passive", "traits": [], "text": "When a guloval critically hits an evil creature with any melee Strike, the evil creature becomes Frightened 1. If that evil creature has damaged one of the guloval's wards within the last round, it's instead Frightened 2."}, {"name": "Shield Ward", "type": "action", "traits": [], "cost": 1, "text": "The guloval enhances the magical link with their ward, granting that creature a +1 status bonus to its Armor Class and saving throws until the start of the guloval's next turn."}, {"name": "Wolverine's Protection", "type": "action", "traits": [], "cost": 2, "text": "The guloval selects a single willing ally within 30 feet as their ward; that ally can't already be the ward of another guloval. Once an ally becomes a ward, a magical link forms between the guloval and the ward, and as long as they are on the same plane and both are alive, the guloval knows the ward's direction from them, distance from them, and any conditions affecting them. A guloval can maintain this link with up to 4 wards-if they select a fifth, one of the previous wards (chosen by the…"}]
