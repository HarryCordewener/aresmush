he jorogumo's web attack is Immobilized and stuck to the nearest surface, preventing the creature from moving.%rThe DC to escape dc=34 or force-open dc=34 the web trap is 34."}, {"name": "Whispered Revelation", "type": "action", "traits": ["incapacitation", "mental", "occult"], "cost": 2, "text": "Simandu whispers an overwhelming secret to an adjacent creature—the nature of the secret is so staggering that the creature's mind immediately recoils from the truth and forgets it; the creature must then attempt a DC 41 Will save.%rCritical Success The creature is Off-Guard until the end of Simandu's turn.%rSuccess The creature is Slowed 1 for 1 round.%rFailure The creature is Stunned 3.%rCritical Failure The creature becomes Paralyzed for 1 minute. At the end of each of its turns, it can…"}]
