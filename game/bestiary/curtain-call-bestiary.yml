  actions: [{"name": "Infernal Insight", "type": "action", "traits": ["auditory", "emotion", "linguistic", "mental", "occult"], "cost": 1, "text": "Augusta Wormwood draws upon her knowledge of how secrets kept can weigh upon the mind along with her supernatural heritage from being the granddaughter of a gylou devil to unnerve a creature she can see within 30 feet. She speaks aloud an uncanny insight about the target's fears, doubts, and shames; the target must then attempt a DC 34 Will save, after which they're temporarily immune to Infernal Insight for 24 hours.%rCritical Success The target is unaffected, and Augusta suddenly doubts her…"}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "Frequency once per day%rEffect If Augusta's next action is to cast a 5th-rank or lower occult spell or cantrip, reduce the number of actions to cast it by 1 (minimum 1 action)."}]
