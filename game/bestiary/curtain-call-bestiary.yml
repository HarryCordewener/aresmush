  actions: [{"name": "Compulsive Counting", "type": "passive", "traits": [], "text": "When numerous small items are scattered before the kuchisake-onna, they compulsively begins to count them. The kuchisake-onna becomes Off-Guard to all creatures for 1d4 rounds."}, {"name": "Am I Pretty?", "type": "action", "traits": [], "cost": 1, "text": "The kuchisake-onna asks a single adjacent target, \"Am I pretty?\" The target must attempt a DC 35 Will save. If it fails, it is Immobilized for 1 round, and if it critically fails, it is Paralyzed for 1 round, though still able to respond to the question; this is a mental effect.%rIf the target responds \"No\", the kuchisake-onna makes two silver scissors Strikes against the target. If the target responds \"Yes\", the kuchisake-onna makes no Strikes this turn and must use Even Now? as their next…"}, {"name": "Compulsive Wound Admiration", "type": "passive", "traits": [], "text": "A Skinsaw Trophy is compelled to admire grisly wounds inflicted in battle. When any creature in a fight they're in suffers a critical hit, a Skinsaw Trophy becomes Off-Guard to all creatures until the start of their next turn."}, {"name": "Even Now?", "type": "action", "traits": [], "cost": 1, "text": "Requirements An adjacent creature previously targeted by Am I Pretty? answered \"Yes\"%rEffect The kuchisake-onna takes off their mask, revealing their slit face and asking, \"Even now?\" The target must attempt a DC 35 Will save.%rIf it fails, it is Immobilized for 1 round, and if it critically fails, it is Paralyzed for 1 round, though still able to respond to the question; this is a mental effect.%rWhether the target responds \"Yes\" or \"No\", the kuchisake-onna makes two silver scissors Strikes…"}, {"name": "Lingering Enmity", "type": "passive", "traits": [], "text": "The kuchisake-onna's silver scissors Strikes are manifestations of the toxic malice that created them and vanish when the kuchisake-onna is destroyed.%rWhen the kuchisake-onna has less 