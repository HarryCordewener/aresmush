  actions: [{"name": "Telepathy 300 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Temporal Sense", "type": "passive", "traits": [], "text": "A siktempora can always roll Dimension of Time Lore for initiative. When it does, it gains a +2 circumstance bonus to the roll."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Regeneration 40 (Deactivated by Mental, Orichalcum, or Spirit)", "type": "passive", "traits": []}, {"name": "Foster Fear", "type": "passive", "traits": [], "text": "Creatures with the Frightened condition are always Off-Guard to the anguish siktempora."}, {"name": "Uncanny Pounce", "type": "free", "traits": [], "text": "Trigger The anguish siktempora rolls Dimension of Time Lore for initiative%rEffect The siktempora Strides once and makes a jaws Strike, in either order."}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}, {"name": "Scream of Despair", "type": "action", "traits": ["emotion", "mental", "occult", "sonic"], "cost": 2, "text": "The anguish siktempora emits a terrible scream in a 30-foot. Creatures in the area must attempt a DC 33 Will save. The anguish siktempora can't use Scream of Despair for 1d4 rounds.%rCritical Success The creature is unaffected.%rSuccess The creature takes 2d6 mental damage, 2d6 sonic damage, and is Frightened 1.%rFailure The creature takes 6d6 mental damage, 6d6 sonic damage, and is Frightened 2.%rCritical Failure As failure, but Frightened 3 and the creature gains weakness to mental 15 (this…"}, {"name": "Wracking Despair", "type": "action", "traits": ["emotion", "mental", "occult"], "cost": 1, "text": "Frequency once per round%rEffect The anguish siktempora projects their crippling despair into the mind of a Frightened creature they can see within range of their telepathy. The frightened creature takes 6d6 mental damage (DC 30 Will save)."}]
