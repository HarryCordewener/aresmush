  actions: [{"name": "Backward Speakers", "type": "passive", "traits": [], "text": "When a palinthanos vocalizes, the sounds it creates are reversed. For the egarhowl, this only results in unnerving backwards sounds of angry roars and bestial noises, but for those who can speak, it makes understanding them difficult. A palinthanos has no difficulty understanding any language it can speak, but when it speaks, listeners must succeed at a DC 30 Perception check made as a free action with the concentrate trait each round to quickly decipher the reversed conversation. This prevents…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Distort Perception", "type": "action", "traits": ["incapacitation", "mental", "occult"], "cost": 1, "text": "Frequency once per round%rEffect The echopsyvne targets a creature it can see within 30 feet and alters its perception of time. The target must attempt a DC 40 Will save. Regardless of success or failure, the creature then becomes temporarily immune to this ability for 24 hours.%rCritical Success The creature is unaffected.%rSuccess The creature perceives time to flow backward briefly and becomes Slowed 1 for 1 round.%rFailure Time flows backward for the creature, leaving them unable to…"}, {"name": "Predestined Defeat", "type": "reaction", "traits": ["occult"], "text": "Trigger The echopsyvne rolls initiative%rFrequency once per day%rEffect At the start of combat, an inverted, reversed explosion of spiritual and void energy implodes in a 30-foot emanation centered on the echopsyvne—a reversal of the creature's spiritually explosive death. All creatures in the area take 15d8 spirit|options:area-damage damage (DC 37 Fortitude save); creatures that fail this save are also Slowed 1 for 1 round as time seems to distort around them."}, {"name": "Reaction Reversal", "type": "passive", "traits": [], "text": "Since an echopsyvne appears to move backwards in time and the results of its actions manifest slightly out of sync, its manipulate or move actions and Strikes don't trigger reactions normally. Whenever a reaction would be triggered by an echopsyvne in this way, the reacting creature must attempt a DC 11 Flat. On a failure, their reaction does not trigger."}, {"name": "Temporal Possession", "type": "passive", "traits": [], "text": "When the echopsyvne casts possession on a creature, that creature experiences time backward. When the echopsyvne controls the target, they function normally, but when the target takes their own actions while the echopsyvne is in partial control or riding along in their body, they become Clumsy 3 and take a –10-foot status penalty to all of their Speeds. When the echopsyvne stops possessing the target, willingly or otherwise, the target must succeed at a DC 37 Will save or be Stunned 1 as they…"}]
