  actions: [{"name": "Azarpal Poison", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 28 Fortitude%rOnset 1 minute%rMaximum Duration 6 minutes%rStage 1 Sickened 1 (1 minute)%rStage 2 Fatigued and Sickened 2 (1 minute)%rStage 3 2d12 poison damage plus fatigued and Sickened 3 (1 minute); the sickened condition value caused by azarpal poison cannot be reduced below 1 as long as the poison's duration remains active."}, {"name": "Culinary Alchemy", "type": "passive", "traits": [], "text": "The azarpal knows the formulas for all common and uncommon alchemical foods of its level or lower found on pages 46–51 of Treasure Vault without needing a formula book. A typical azarpal carries about 700 gp of alchemical food."}, {"name": "Gulp or Grab", "type": "action", "traits": ["manipulate"], "cost": 3, "text": "The Azarpal swallows a single meal or alchemical food and stores it in one of six stomachs. Therein, the food doesn't spoil (drinks must be swallowed in closed containers, or they spill and affect the azarpal normally). The azarpal can use this activity to reach into its mouth and retrieve a stored item as well. Any item that remains stored in an azarpal's stomach for at least 24 hours becomes laced with azarpal poison."}, {"name": "Lasting Illusion", "type": "passive", "traits": [], "text": "When an azarpal casts illusory disguise and only targets themselves, the duration increases to 24 hours."}, {"name": "Twirl Tail", "type": "action", "traits": [], "cost": 1, "text": "The azarpal lashes and twirls their confounding tail, snapping and lashing it in all adjacent squares. Until the start of the azarpal's next turn, all non-azarpals treat the squares adjacent to the azarpal as difficult terrain."}]
