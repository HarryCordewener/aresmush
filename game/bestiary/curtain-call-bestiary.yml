  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Aura of Disquietude", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "30 feet. DC 41 Will%rAs Frightful Presence, plus a creature frightened by the aura becomes suspicious; it doesn't count any other creature as its ally and can't Aid or flank. On a critical failure, the creature also can't be a willing target for harmless or helpful magic.%rEffect: Aura of Disquietude"}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Inscribe Propaganda", "type": "action", "traits": ["curse", "divine", "incapacitation", "mental"], "cost": 1, "text": "Frequency once per turn%rEffect The Prince lifts the writer's quill he carries, points its nib at a target he can see that's within 120 feet, and then writes Invisible text in the air. The target hears the sound of the quill nib scratching words into parchment and must attempt a DC 44 Will save. The target then becomes temporarily immune to Inscribe Propaganda for 24 hours.%rCritical Success The target is unaffected.%rSuccess The target's worldview shifts, causing it to momentarily lose track…"}, {"name": "Prince's Curse", "type": "passive", "traits": ["curse", "occult"], "text": "A creature hit by the Prince's melee attack becomes cursed. It becomes Off-Guard and takes 2d6 persistent bleed damage that's difficult to stanch. The DC to stop the bleeding using Administer First Aid is 40, and healing the creature to full HP doesn't automatically end the bleeding. Removing the curse ends the bleeding and off-guard condition."}, {"name": "Shed Manacle", "type": "reaction", "traits": [], "text": "Trigger The Prince has grabbed a creature with his manacle%rEffect The manacle clasps drop away from the chain the Prince holds. The creature remains grabbed until they escape dc=44, at which point its manacles vanish. The Prince can't make manacle Strikes again until his next turn when his chain creates a new set of manacles at its end."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The Prince deals an additional 3d6 precision damage to Off-Guard creatures."}, {"name": "Improved Grab", "type": "free", "traits": []}]
