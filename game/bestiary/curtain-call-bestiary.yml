  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Universal Language", "type": "passive", "traits": [], "text": "Anything spoken by the brainchild is perceived by the listener in its native language."}, {"name": "Urban Legend", "type": "passive", "traits": [], "text": "As brainchild except Father Skinsaw's abilities are determined by the collective memories of his worshippers and Norgorber himself. Instead of using Seek or Sense Motive to disbelieve any of his abilities, a character who's discovered some of Norgorber's secrets can confront Father Skinsaw with these truths by using Demoralize (DC 41), or they can taunt him with these secrets by Creating a Diversion (DC 43). On a success, in addition to the normal effects, that person can disbelieve one of…"}, {"name": "Persistence of Memory", "type": "passive", "traits": ["illusion", "mental", "occult"], "text": "As brainchild, except the time is chosen by Norgorber.%rWhen a brainchild is destroyed, it returns if anyone still fully believes it exists, re-forming within 100 feet of any believer after 2d4 days."}, {"name": "Bloodletting", "type": "free", "traits": [], "text": "Trigger Father Skinsaw is adjacent to a creature that takes persistent bleed damage%rFrequency once per round%rEffect Blood writhes from the bleeding creature to splash onto Father Skinsaw, granting him 40 temporary Hit Points for 1 minute.%rEffect: Bloodletting"}, {"name": "Cut Across Space", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Father Skinsaw makes a war razor Strike against a target within 120 feet."}, {"name": "Grievous Cut", "type": "action", "traits": [], "cost": 2, "text": "Father Skinsaw attempts a war razor Strike against an adjacent target. If he hits, the blade cuts deep and creates a grievous wound. In addition to the normal damage caused by the attack, the creature struck takes 4d6 bleed damage and becomes Wounded 1 (or increases the value of an existing wounded condition by 1, to a maximum of Wounded 4)."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Father Skinsaw deals 3d6 extra precision damage to creatures who are Off-Guard."}]
