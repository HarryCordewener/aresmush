  strikes: [{"name": "Jaws", "bonus": 34, "damage": [["4d10+16", "piercing", null]], "traits": ["unarmed"], "effects": ["Blackfingers Venom"]}, {"name": "Dagger", "bonus": 38, "damage": [["3d4+16", "piercing", null], ["1d6", "acid", null]], "traits": ["agile", "finesse", "magical", "versatile-s"], "effects": ["Blackfingers Venom"]}, {"name": "Dagger", "bonus": 38, "damage": [["4d8+15", "piercing", null]], "traits": ["agile", "finesse", "magical", "thrown-10", "versatile-s"], "effects": ["Blackfingers Venom"]}]
  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Consumed by Bloodlust", "type": "reaction", "traits": ["emotion", "mental"], "text": "Frequency once per day%rDuration 1 minute%rTrigger Blackfingers damages a creature%rEffect Murderous instinct consumes Blackfingers' mind. He gains a +2 status bonus to attacks and damage with his dagger, but is Stupefied 2 and cannot use concentrate abilities. If he brings a creature to 0 Hit Points while consumed by bloodlust, he gains 20 temporary Hit Points, and this effect ends."}, {"name": "Poison Sense (Precise) 60 feet", "type": "passive", "traits": [], "text": "Blackfingers senses any poisoned creature. He can spend an action with the concentrate trait to determine the poison's type and current stage."}, {"name": "Venomous Aura", "type": "passive", "traits": ["aura", "occult", "poison"], "text": "60 feet. Each creature that enters or starts its turn within the area must succeed at a DC 39 Fortitude saving throw or gain weakness 10 to poison (weakness 15 on a critical failure). Worshippers of Norgorber are immune, as are those who drank any poison in area C3 .%rEffect: Venomous Aura"}, {"name": "Blackfingers' Venom", "type": "passive", "traits": ["divine", "incapacitation", "poison"], "text": "Blackfingers' dagger is constantly coated with the same insidious toxin that drips from his fangs, and recoats his dagger instantly each time after he Strikes%rSaving Throw DC 42 Fortitude%rMaximum Duration 4 hours%rStage 1 3d6 poison damage%rStage 2 3d6 poison damage and Slowed 1 (1 round),%rStage 3 4d6 poison and Slowed 2 (1 round)%rStage 4 Paralyzed for 1d4 hours."}, {"name": "Change Shape", "type": "action", "traits": ["arcane", "concentrate", "polymorph"], "cost": 1, "text": "Blackfingers can take the shape of a Tiny spider. This doesn't change his Speed or jaws Strike, but prevents him from making dagger Strikes."}, {"name": "Enhance Poison", "type": "free", "traits": ["divine"], "text": "Frequency once per round%rEffect Blackfingers causes the save DC of a dose of poison he holds in a hand (or that coats a weapon he holds) to increase to DC 42 until the start of his next turn."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Blackfingers deals 3d6 extra precision damage to creatures who are Off-Guard."}, {"name": "Stab! Stab! Stab! Stab!", "type": "action", "traits": [], "cost": 3, "text": "Requirements Blackfingers is Consumed by Bloodlust%rEffect Blackfingers lashes out and makes four dagger Strikes against adjacent targets at his current attack modifier but with a –2 penalty. Each attack counts toward his multiple attack penalty but the penalties don't apply until the end of this activity. On each successful hit he restores 15 healing Hit Points. Consumed by Bloodlust's effects then end."}]
