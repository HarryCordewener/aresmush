  actions: [{"name": "Risk Aura", "type": "passive", "traits": ["aura", "divine", "mental", "misfortune"], "text": "30 feet. A feeling of recklessness surrounds a gambling devil. When a non-fiend creature enters the aura or begins its turn in the aura, it must attempt a DC 21 Will save.%rCritical Success The creature is unaffected and is temporarily immune to Risk Aura for 24 hours.%rSuccess The creature is unaffected.%rFailure The next time the creature rolls a d20, it must roll twice. If either roll is a natural 20, the creature uses that result; otherwise, it must take the lower of the two…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The agadaz adopts the appearance of any Small or Medium humanoid. This doesn't change their Speed or their attack and damage bonuses with their Strikes, but it might change the type of damage their Strikes deal."}, {"name": "Double Down", "type": "reaction", "traits": ["divine", "fortune"], "text": "Trigger The agadaz attempts a Strike, saving throw, or skill check%rEffect The agadaz takes a –2 status penalty to the roll, then gains a +2 status bonus to the next Strike, saving throw, or skill check they attempt before the end of their turn, or before the end of their next turn if they used Double Down during another creature's turn."}, {"name": "Produce Gold Coins", "type": "free", "traits": [], "text": "Frequency once per round%rRequirements The agadaz has a free hand%rEffect The agadaz creates up to 5 gp in their hand. At any one time, an agadaz can possess no more than 20 gp created in this way; coins created in excess of this value vanish. A coin created in this way vanishes automatically 1 hour after leaving the devil's possession."}]
