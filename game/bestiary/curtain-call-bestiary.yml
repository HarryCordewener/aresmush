  actions: [{"name": "Skinsaw Eye", "type": "passive", "traits": [], "text": "Norgorber granted Delaraius an eye to aid him in his quest for vengeance, but this eye also significantly enhances the priest. It grants him darkvision and Truesight as a constant innate spell, and also increases all of his attribute modifiers by 4. He is immune to bleed damage, magical detection and mental communication (unless he chooses otherwise), and magical alteration of his memories unless he chooses to be affected or the effect comes from a deity or artifact. The Skinsaw Eye serves as a…"}, {"name": "Vulnerable to Sunlight", "type": "passive", "traits": [], "text": "Delaraius takes 50 untyped damage for every hour he's exposed to sunlight."}, {"name": "King of Keys", "type": "passive", "traits": [], "text": "Delaraius's magic is more powerful when he's located in Vyre or Duskfathom. The counteract DC for all of his spells increases by 2 as long as the spell effect is located in either of these locations, and Delaraius gains a +2 status bonus on counteract checks while in either location."}, {"name": "Skinsaw Strike", "type": "action", "traits": ["divine"], "cost": 1, "text": "Delaraius focuses his attention on a target he can see, causing his Skinsaw Eye to glow red for a moment as he seeks out the most painful place to attack that target. He then attempts a Medicine check against the target's Fortitude DC; on a success, that target is Off-Guard to Delaraius until the end of his turn. On a critical success, that target is off-guard to Delaraius until the end of his next turn."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Delaraius deals 3d6 extra precision damage to creatures who are Off-Guard."}]
