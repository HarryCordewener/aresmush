  actions: [{"name": "Death Grip", "type": "passive", "traits": [], "text": "Exthenios clutches Aerekostes with a literal death grip. Attempts to Disarm him of the weapon are treated as one degree of success lower."}, {"name": "My Fight!", "type": "reaction", "traits": [], "text": "Trigger A creature other than the target of Engaging Duel takes a hostile action against Exthenios or uses a spell or ability that affects the target of Engaging Duel%rRequirements Exthenios has a creature under the effects of Engaging Duel%rEffect Exthenios makes a melee Strike against the triggering creature, or a void bolt Strike if the creature isn't within his reach. If the Strike is a success, the creature must attempt a DC 7 Flat (or a DC 12 Flat if Exthenios's Strike was a critical…"}, {"name": "Mythic Resilience (Reflex and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Shield Block", "type": "reaction", "traits": []}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Engaging Duel", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Exthenios singles out a creature he can see, calling them to face him directly. Exthenios gains a +1 circumstance bonus to Strikes and DCs against the targeted creature. If the creature takes an action that affects anyone other than themselves or Exthenios, this bonus increases to +2 until the end of Exthenios's next turn. Exthenios takes a –1 circumstance penalty to all checks and DCs against any creature other than the target of the Engaging Duel. These effects last until Exthenios uses…"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill (Acrobatics)", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The creature attempts its next skill check with a +4 bonus and is considered to have mythic proficiency for that check. This applies to one skill when this ability is gained and a second skill if the creature is 12th level or higher."}, {"name": "Precise Duelist", "type": "passive", "traits": [], "text": "Exthenios deals an extra 1d6 precision damage to the target of his Engaging Duel."}, {"name": "Unimpeded", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Exthenios automatically ends one effect that would give him a circumstance penalty to Speed. When he attempts to Escape an effect that has him Immobilized, Grabbed, or Restrained, he automatically succeeds."}]
