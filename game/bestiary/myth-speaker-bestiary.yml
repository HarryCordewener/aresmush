  actions: [{"name": "Unerring Tracker", "type": "passive", "traits": [], "text": "A eumenid can Track at its full speed and treats all results of Survival checks to Track as one degree of success better."}, {"name": "Trip Quarry", "type": "reaction", "traits": [], "text": "Trigger The eumenid's quarry uses a move action within reach of the eumenid's spiked chain%rEffect The eumenid Trips the creature."}, {"name": "Designate Quarry", "type": "action", "traits": ["concentrate", "mental"], "cost": 1, "text": "The eumenid designates a single creature as their quarry and focuses their attention on that creature. The eumenid must be able to see or hear the creature, or they must be tracking it. As long as the eumenid has the creature as their quarry, the eumenid gains telepathy with that creature with unlimited range, even between planes. Each day, the quarry can attempt a DC 24 Will save; a success breaks the connection and makes the creature immune to that eumenid's Designate Quarry for 24 hours. The…"}, {"name": "Stretching Chain", "type": "passive", "traits": [], "text": "In the hands of a eumenid, any spiked chain has a reach of 15 feet."}, {"name": "Taunt Quarry", "type": "action", "traits": ["detection", "divine", "emotion", "fear", "mental"], "cost": 1, "text": "Frequency once per day%rRequirements The eumenid has Designated a Quarry%rEffect Using their telepathy, the eumenid mentally harangues and threatens their quarry, who must attempt a DC 24 Will save.%rCritical Success The quarry is unaffected.%rSuccess The quarry is Frightened 1. The eumenid learns on what plane the quarry is on.%rFailure The quarry is Frightened 2. The eumenid learns the quarry's rough location, accurate to within 10 miles.%rCritical Failure The quarry is Frightened 3 and…"}]
