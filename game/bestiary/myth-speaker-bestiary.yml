  actions: [{"name": "Coral Camouflage", "type": "passive", "traits": [], "text": "In reefs and rocky marine environments, a coralclaw can Hide and Sneak without cover or being Concealed."}, {"name": "Shuffler", "type": "passive", "traits": [], "text": "A coralclaw struggles to pivot quickly, leaving its hind limbs and tail vulnerable. When the coralclaw is Off-Guard, it gains weakness 2 to physical damage except against effects for which the coralclaw has standard cover or greater cover."}, {"name": "Ambushing Snap", "type": "action", "traits": [], "cost": 1, "text": "Requirements The coralclaw is hiding in corals and a creature that hasn't detected it is within 25 feet%rEffect The coralclaw moves up to its swim Speed + 10 feet toward the triggering creature. When the creature is within reach, the coralclaw makes a melee Strike against it. The creature is Off-Guard to this Strike."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "1d10 bludgeoning, DC 18 Fortitude"}, {"name": "Crushing Drag", "type": "action", "traits": ["attack", "move"], "cost": 2, "text": "Requirements The coralclaw is grabbing or restraining a creature%rEffect The coralclaw Constricts the creature, extends the Grabbed or Restrained condition until the end of the coralclaw's next turn, and attempts an Athletics check to Reposition the creature."}, {"name": "Dislodged Armor", "type": "passive", "traits": [], "text": "Once the coralclaw is reduced to half its Hit Points, its AC decreases by 2, it gains a +5 circumstance bonus to its Speeds, and it loses coral camouflage. A coralclaw can repair its coral armor with 4 hours of work."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
