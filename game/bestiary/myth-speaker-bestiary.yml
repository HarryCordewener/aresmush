  actions: [{"name": "Quick Rage", "type": "free", "traits": [], "text": "When Akki rolls for initiative, provided she can perceive at least one foe, she can Rage as a free action."}, {"name": "Mythic Resilience (Fortitude)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill (Athletics)", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The creature attempts its next skill check with a +4 bonus and is considered to have mythic proficiency for that check."}, {"name": "Rage", "type": "action", "traits": ["concentrate", "emotion", "mental"], "cost": 1, "text": "Requirements Akki isn't Fatigued or raging%rEffect Akki taps into her inner fury and begins raging. She gains 12 temporary Hit Points. The rage lasts for 1 minute or until Akki falls Unconscious, whichever comes first. While raging, her melee Strikes deal an additional 6 electricity damage, and she can't use actions that have the concentrate trait, except for Seek. When Akki stops raging, she loses any remaining temporary Hit Points from Rage, and she can't gain temporary Hit Points from using…"}, {"name": "Shock and Awe", "type": "passive", "traits": [], "text": "A creature critically hit by Akki's lightning cry Strike is Clumsy 1 and Stupefied 1 for 1 round."}]
