nts, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill (Acrobatics)", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The creature attempts its next skill check with a +4 bonus and is considered to have mythic proficiency for that check."}, {"name": "Serpent Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 25 Fortitude%rMaximum Duration 6 rounds%rStage 1 1d6 poison damage and Enfeebled 1 (1 round)%rStage 2 2d6 poison damage and Enfeebled 2 (1 round)"}, {"name": "Unimpeded", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Eylthia automatically ends one effect that would give her a circumstance penalty to Speed. When she attempts to Escape an effect that has her Immobilized, Grabbed, or Restrained, she automatically succeeds."}, {"name": "Vulnerability", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Eylthia renews the vulnerability to her gaze on one target within 30 feet that is temporarily immune to Focus Gaze. The creature loses that temporary immunity."}]
