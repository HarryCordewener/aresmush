  strikes: [{"name": "Falchion", "bonus": 10, "damage": [["1d10+4", "slashing", null]], "traits": ["forceful", "sweep"], "effects": ["Tempest Rage"]}, {"name": "Javelin", "bonus": 10, "damage": [["1d6+4", "piercing", null]], "traits": ["thrown-30"], "effects": ["Tempest Rage"]}, {"name": "Tournament Greatclub", "bonus": 10, "damage": [["1d10+4", "bludgeoning", null]], "traits": ["backswing", "nonlethal"], "effects": ["Tempest Rage"]}]
  actions: [{"name": "Blood Storm", "type": "reaction", "traits": ["electricity"], "text": "Frequency once per day%rTrigger Akki takes piercing or slashing damage%rEffect Akki's blood sprays from the wound, forming a crimson cloud laced with tiny lightning bolts. Adjacent creatures take 1 electricity splash damage, and Akki is Concealed until the end of her next turn."}, {"name": "Tempest Rage", "type": "action", "traits": ["concentrate", "electricity", "emotion", "mental"], "cost": 1, "text": "Akki channels the ferocity of a raging storm, causing her feathers and weapons to crackle with electricity. She gains 5 temporary Hit Points, deals an additional 1d4 electricity damage with her weapon Strikes, and cannot use actions (except Seek) with the concentrate trait unless they also have the rage trait. These effects last for 1 minute, until she falls Unconscious, or until the encounter ends, whichever comes first. After Akki uses this ability, she cannot do so again for 1d10 #Recharge…"}, {"name": "Thunderous Echo", "type": "reaction", "traits": ["sonic"], "text": "Trigger Akki fails but does not critically fail a Strike against a target within 15 feet%rRequirements Akki is affected by Tempest Rage%rEffect Even though her attack missed, a thunderclap follows an instant later in the weapon's wake. The Strike's target takes 1d4 sonic damage (DC 16 Fortitude save). The target is Deafened for 1d4 rounds if they critically fail the saving throw."}]
