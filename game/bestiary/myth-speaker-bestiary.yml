  immunities: ["death-effects", "disease", "mental", "poison"]
  resistances: {"mythic": 11}
  strikes: [{"name": "Trident", "bonus": 42, "damage": [["4d8+24", "piercing", null]], "traits": ["magical", "reach-20"]}, {"name": "Trident", "bonus": 42, "damage": [["4d8+24", "piercing", null]], "traits": ["magical", "thrown-20"]}, {"name": "Fist", "bonus": 39, "damage": [["4d10+24", "bludgeoning", null]], "traits": ["agile", "reach-15", "unarmed"]}, {"name": "Living Architecture", "bonus": 39, "damage": [["4d8+22", "bludgeoning", null]], "traits": ["agile"]}]
  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The creature ends one condition affecting it."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Imprisoned Immortality", "type": "passive", "traits": [], "text": "If killed or otherwise permanently incapacitated (such as petrified), Amnerion returns to life and appears on their throne, fully healed with all conditions removed and with full uses of their spells and abilities 24 hours later. Only if all the shades in Amneros are gone can Amnerion be permanently killed."}, {"name": "Master of Amneros", "type": "passive", "traits": [], "text": "While in Amneros, Amnerion can command the realm's very environment and architecture to animate, twist, and defend them. This allows them to make living architecture Strikes. In addition, Amnerion can Take Cover as a free action once per round, willing nearby obstacles to stretch and shield them from harm."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Undying Myth", "type": "free", "traits": [], "text": "Cost all the creature's Mythic Points%rTrigger The creature would die and has at least 1 Mythic Point%rEffect The creature remains standing and conscious, and recovers 50% of its maximum Hit Points."}, {"name": "Call Upon the Dead", "type": "action", "traits": [], "cost": 3, "text": "Amnerion calls out for aid from their subjects, whose spirits appear and strike all enemies within a 60-foot burst. Each creature in the area must attempt a DC 47 Fortitude save.%rCritical Success The creature takes 4d8 spirit|options:area-damage damage.%rSuccess As critical success and the creature is Drained 1.%rFailure The creature takes 8d8 spirit|options:area-damage damage and is Drained 2.%rCritical Failure The creature takes 12d8 spirit|options:area-damage damage, is drained 2, and is…"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill (Crafting or Occultism)", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The creature attempts its next skill check with a +4 bonus and is considered to have mythic proficiency for that check."}, {"name": "Punish Soul", "type": "action", "traits": ["teleportation"], "cost": 2, "text": "Amnerion moves up to twice their speed and makes a melee Strike against a target within reach. If the attack hits, it does no damage and the creature must attempt a DC 48 Will save.%rCritical Success The target is Stunned 2.%rSuccess The target is Stunned 4.%rFailure The target is immediately teleported to a prison cell in Bothros, the place of punishment in Amneros.%rCritical Failure As failure and the creature is stunned 2 for 1 hour."}, {"name": "Realm Step", "type": "action", "traits": ["teleportation"], "cost": 3, "text": "Amnerion disappears and reappears instantaneously at any location within Amneros. They can then immediately Seek, Step, Stride, or Recall Knowledge, typically in response to whatever awaits them at their destination."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The creature gains one additional use of a spell or ability that is normally only available a limited number of times. For example, a spellcaster can regain an expended slot or use an ability with a frequency of once per day again."}, {"name": "Self-Imprisoned", "type": "passive", "traits": [], "text": "Amnerion cannot leave Amneros, nor can they be forced or compelled to depart by any means until either they receive Pharasma's permission or there are no more shades in Amneros."}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 47, "attack": 37, "spells": {"5": ["Truespeech (Constant)"], "8": ["Canticle of Everlasting Grief", "Disappearance (At Will, Self Only)", "Spirit Song", "Unrelenting Observation (At will, Within Amneros Only)"], "9": ["Manifestation", "Overwhelming Presence (At Will)", "Unfathomable Song"], "10": ["Freeze Time"]}}]
