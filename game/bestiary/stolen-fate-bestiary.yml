ng suffers. Whenever the demonic rabble fails a saving throw against an affect that would normally Fascinate, Fatigue, Paralyze, Restrain, or Slow at least four creatures, the troop takes 3d6 mental damage."}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever the rabble Strides, they first Form Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then moves up to their Speed."}]
