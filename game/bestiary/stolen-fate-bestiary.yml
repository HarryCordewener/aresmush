  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Lifesense 120 feet", "type": "passive", "traits": []}, {"name": "Sense Fate", "type": "passive", "traits": ["fortune"], "text": "A norn automatically rolls a 20 when she rolls initiative."}, {"name": "Triumvirate", "type": "passive", "traits": [], "text": "This functions as the Coven ability, except only norns can join a triumvirate, and it functions only as long as exactly three norns are part of the triumvirate. A triumvirate grants the following spells: Alter Reality (once per day), Cataclysm, Pinpoint, Foresight, and Revival."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 20 (Deactivated by Cold Iron)", "type": "passive", "traits": []}, {"name": "Declare Fate", "type": "action", "traits": ["misfortune", "occult", "prediction"], "cost": 1, "text": "Fabrina quickly consults her thread about a creature within 60 feet. Roll a d20 and note the result. Until the start of her next turn, whenever the target is about to attempt a check (but before the roll is made), Fabrina can use a reaction to force the creature to use the noted result instead. If she doesn't or is unable to force the creature to use the result by the start of her next turn, the noted result is lost and Fabrina takes 6d6 mental damage from the strain that the unfulfilled fate…"}, {"name": "Fated", "type": "passive", "traits": ["fortune", "misfortune"], "text": "When a creature is subject to a fortune effect from a norn and a misfortune effect from any source other than a norn (or vice versa), the norn's effect automatically counteracts the other effect and then takes place normally, rather than the two effects canceling each other out. If both the fortune and misfortune effect are from a norn, then the two cancel each other out as normal. At the GM's discretion, powerful entities related to fate or luck, like Desna, Magdh, or Pharasma, count as a norn…"}, {"name": "Sever Fate", "type": "passive", "traits": ["occult"], "text": "When a norn deals void damage with a Strike, she regains 10 healing Hit Points. The target must succeed at a DC 39 Fortitude save or become Drained 1 (Drained 2 on a critical failure).%rFurther void damage dealt by the norn increases the drained condition value by 1 on a failed save (or by 2 on a critical failure), to a maximum of drained 4."}, {"name": "Shift Fate", "type": "reaction", "traits": ["fortune", "misfortune", "occult"], "text": "Trigger A creature within 120 feet attempts a saving throw%rEffect The creature rolls the saving throw twice, and then the norn decides which result applies. If the norn chooses the lower roll, this is a misfortune effect; if she chooses the higher roll, it's a fortune effect; if they're the same, she decides which trait to apply."}, {"name": "Snip Thread", "type": "action", "traits": ["death", "manipulate", "occult"], "cost": 2, "text": "Frequency three times per day%rEffect The norn produces a golden thread linked to the fate of a creature within 100 feet of her, then snips it short with her shears. The target takes 100 void damage (DC 42 Fortitude save). If the target is reduced to 0 Hit Points from this damage, the thread is completely severed and the creature dies immediately. A creature slain by Snip Thread can't be restored to life except by Miracle, Wish, or similarly powerful magic; or by divine intervention. Regardless…"}, {"name": "Undo Fate", "type": "reaction", "traits": ["occult"], "text": "Frequency once per minute%rTrigger The norn critically fails a check or a creature critically hits the norn%rEffect The norn lightly frays the golden thread of fate she holds, tampering with the fate at hand. If the triggering check was the norn's critical failure, she gets a failure instead. If the triggering check was a critical hit on the norn, it becomes a hit."}]
