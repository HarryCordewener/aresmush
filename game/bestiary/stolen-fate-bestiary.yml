  strikes: [{"name": "Greatsword", "bonus": 40, "damage": [["4d12+16", "slashing", null]], "traits": ["magical", "versatile-p"], "effects": ["Bloodbird"]}, {"name": "Jaws", "bonus": 37, "damage": [["4d6+16", "piercing", null]], "traits": ["magical", "unarmed"], "effects": ["Bloodbird"]}, {"name": "Talon", "bonus": 37, "damage": [["4d6+16", "slashing", null]], "traits": ["agile", "magical", "unarmed"], "effects": ["Bloodbird"]}]
  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Aura of Disquietude", "type": "passive", "traits": ["emotion", "fear", "mental"], "text": "30 feet. DC 41 Will%rAs Frightful Presence, plus a creature frightened by the aura becomes suspicious: it doesn't count any other creature as its ally and can't Aid or flank. On a critical failure, the creature also can't be a willing target for harmless or helpful magic.%rEffect: Aura of Disquietude"}, {"name": "Maintain Fate", "type": "reaction", "traits": ["occult"], "text": "Trigger The Keeper would be subjected to a misfortune effect, become Slowed, or become Stunned.%rEffect The Keeper manipulates reality to maintain control of her own destiny and twists the fate of those that dared tamper with her own. The Keeper disrupts the triggering effect and becomes Quickened until the end of her next turn. She can use the extra action to Fly, Step, Stride, or Strike. If the effect originated from a creature, such as an enemy casting slow on the Keeper, that creature is…"}, {"name": "Bloodbird", "type": "passive", "traits": ["curse", "occult"], "text": "A creature hit by a vilderavn's melee attack becomes cursed. It takes 2d6 bleed that's difficult to stanch. The DC to stop the bleeding using Administer First Aid is 41, and healing the creature to full HP doesn't automatically end the bleeding. Removing the curse ends the bleeding."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The vilderavn takes on the appearance of a Small or Medium humanoid, wolf, dire wolf, or hybrid with both raven and wolf parts. The vilderavn can only use their jaws attack when in a form with a wolf's head, and their talon attack in a form with raven qualities. They can instead assume their raven knight form: a Medium humanoid in black full plate carrying a greatsword. They can use their jaws or talon Strikes only in a form that has that body part, and their greatsword only in knight form."}, {"name": "Souleater", "type": "passive", "traits": ["occult"], "text": "If the vilderavn kills a humanoid target with a critical hit using their Jaws Strike, they rip out and devour the target's heart and soul as part of the attack. While the target is dead, the vilderavn can Change Shape into the target's form, gaining a +4 status bonus to Deception checks to impersonate the target. If magic would resurrect the creature, the caster must succeed at a DC 44 counteract check to extract the target's soul from the vilderavn; otherwise, the spell fails."}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 41, "attack": 0, "spells": {"7": ["Outcast's Curse (At Will)", "Suggestion (At Will)"], "8": ["Crushing Despair (At Will)", "Modify Memory"], "9": ["Ethereal Jaunt", "Suggestion", "Tongues (Constant)", "True Seeing (Constant)"]}}]
