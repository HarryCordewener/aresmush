  actions: [{"name": "Breathsense (Precise) 60 feet", "type": "passive", "traits": [], "text": "A jiang-shi can't perceive living creatures beyond 5 feet except with their breathsense. A living creature within the listed range who holds its breath is Invisible to the jiang-shi for as long as it holds its breath. To hold its breath in this way, a creature must have one hand free to fully plug its nose or cover its mouth."}, {"name": "Coven", "type": "passive", "traits": ["mental", "occult"], "text": "A spirit naga adds Hallucination, Mind Probe, and Suggestion to their coven's spells."}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Harrowed Fulu", "type": "passive", "traits": [], "text": "Unlike the typical jiang-shi, Kannijo's Warped Fulu has been replaced by a card from the Deck of Destiny—a replacement that has largely gone unnoticed by the vampire. Kannijo is immune to spells cast from a magic item without expending a spell slot, such as from a scroll or wand, and also gains the passive abilities granted from The Snakebite (but not its activation ability). A creature can Steal The Snakebite to remove it (DC 33). This immediately ends Kannijo's immunity to these effects,…"}, {"name": "Jiang-Shi Vulnerabilities", "type": "passive", "traits": [], "text": "All jiang-shi possess the following vulnerabilities.%rRevulsion A jiang-shi can't voluntarily come within 10 feet of a brandished mirror or the sound of ringing handbells. A creature can Interact with a mirror or handbell to brandish or ring the item for 1 round (similar to Raising a Shield). If the jiang-shi involuntarily comes within 10 feet of an object of their revulsion, they gain the Fleeing condition, running from the object of their revulsion until they are 10 feet or farther from the…"}, {"name": "One More Breath", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a jiang-shi isn't destroyed at 0 HP. Instead, they fall Unconscious and awaken in 1 minute with 1 Hit Point. Scattering at least 1 Bulk of glutinous rice or hen eggs on an unconscious jiang-shi destroys them permanently. If the jiang-shi was reduced to 0 HP by an attack from a weapon made of duskwood, they're destroyed immediately."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Qi", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the jiang-shi's reach%rEffect The jiang-shi drains the victim's life energy, or qi, through their breath. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Drained 1 and the jiang-shi regains 18 healing HP, gaining any excess as temporary Hit Points. Draining qi from a creature that's already drained…"}, {"name": "Manipulate the Green", "type": "passive", "traits": [], "text": "Kannijo can use Inveigle against plant creatures normally immune to mental effects, and can communicate with inveigled plant creatures as if under the effects of Speak with Plants."}, {"name": "Rigor Mortis", "type": "passive", "traits": [], "text": "The jiang-shi ignores difficult terrain and effects that would render them Prone. A jiang-shi can't take the Drop Prone action. When they Leap they don't trigger reactions that are normally triggered by move actions, such as Attacks of Opportunity."}, {"name": "Spirit Naga Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 33 Fortitude (DC 34 Fortitude against Off-Guard targets)%rMaximum Duration 6 rounds%rStage 1 2d6 poison damage and Stupefied 1 (1 round)%rStage 2 3d6 poison damage and Stupefied 2 (1 round)"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
