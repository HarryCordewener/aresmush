  actions: [{"name": "Abyssal Link", "type": "passive", "traits": [], "text": "The Demongate Colossus is built around a seething, churning mass of Abyssal energy that looks like a sphere of electrified red mist encompassing a single floating harrow card at its center—The Survivor. The Abyssal link is obscured until the Demongate Colossus is reduced to fewer than 120 Hit Points, at which point glimpses of it become visible through tears and holes in its leathery \"flesh.\" The potent magic drawn from this card, combined with the radiant warden's gatewarper aura, is what…"}, {"name": "Gatewarper Aura", "type": "passive", "traits": ["aura", "occult"], "text": "60 feet. A creature that uses a teleportation ability within the aura's emanation or enters the emanation via a teleportation ability must succeed at a DC 31 Fortitude save or become Drained 1 (Drained 2 on a critical failure) as its body warps and distorts painfully, and have its destination changed to a point of the radiant warden's choosing within the emanation."}, {"name": "Link Collapse", "type": "passive", "traits": [], "text": "If the Demongate Colossus is destroyed or its belly portal is deactivated, demons that used the colossus's portal within a 40-foot take 7d10 spirit|options:area-damage damage (DC 30 Fortitude save). A creature that takes full or double damage is Enfeebled 2 for 1 minute. If the Demongate Colossus is still active when it suffers a link collapse, it becomes Stunned 3 and loses its gatewarper aura."}, {"name": "Corrupted Radiant Blast", "type": "action", "traits": ["evil", "force", "occult"], "cost": 2, "text": "The Demongate Colossus releases a 50-foot of crimson energy that deals 4d12 force damage and 4d12 spirit damage (DC 34 Reflex save). The Demongate Colossus can't use Corrupted Radiant Blast again for 1d4 rounds."}, {"name": "Corrupted Radiant Blow", "type": "passive", "traits": ["evil"], "text": "When a non-evil creature is hit by the Demongate Colossus's hammer Strike, a red flash of Abyssal energy attempts to infuse the target with evil. The creature must attempt a DC 34 Will save; on a failure, the creature can't use any teleportation effects for 1 minute. On a critical failure, the creature is also Enfeebled 2."}]
