  actions: [{"name": "Tremorsense (Imprecise) 60 feet", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Extra Reaction", "type": "passive", "traits": [], "text": "The dragon gains 2 reactions at the start of each of their turns."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 37 Will"}, {"name": "Reflect Spell", "type": "reaction", "traits": [], "text": "Trigger Vehanezhad is targeted by a ranged spell attack roll%rEffect Vehanezhad adjusts a wing and gains a +4 circumstance bonus to AC against the triggering attack. If the attack misses, the spell reflects at the caster, who must roll a second ranged spell attack roll against their own AC to determine if the spell hits them instead."}, {"name": "Scintillating Aura", "type": "passive", "traits": ["aura", "concentrate", "incapacitation", "primal", "visual"], "text": "30 feet. A swirling vortex of reflected color and light shimmers around the crystal dragon. Creatures in this aura's emanation are Dazzled. Each creature that ends its turn in the emanation must succeed at a DC 37 Will saving throw or be Stunned 1 (or Stunned 3 on a critical failure). Once a creature succeeds at this save, it is temporarily immune to the stunning effect for 1 minute. The crystal dragon can turn this aura on or off using a single action, which has the concentrate trait, and it…"}, {"name": "Twisting Tail", "type": "reaction", "traits": ["move"], "text": "Trigger A creature within reach of the dragon's tail uses a move action or leaves a square during a move action it's using%rEffect The dragon makes a tail Strike at the creature with a -2 penalty. If it hits, the dragon disrupts the creature's action."}, {"name": "Breath Weapon", "type": "action", "traits": ["primal"], "cost": 2, "text": "Vehanezhad breathes a flurry of piercing crystals that deals 19d6 piercing|options:area-damage damage in a 60-foot (DC 40 Reflex save). A creature who takes damage from this breath weapon is exposed to crystal corruption. Vehanezhad can't use Breath Weapon again for 1d4 rounds."}, {"name": "Crystal Corruption", "type": "passive", "traits": ["arcane", "curse", "incapacitation"], "text": "Creatures afflicted by this curse slowly turn to solid crystal. This affliction's sickened, slowed, and paralyzed conditions can't be removed until the affliction itself is removed. Creatures with both the earth and elemental traits instead become carriers and suffer no ill effects aside from gaining the weakness to sonic.%rSaving Throw DC 40 Fortitude%rStage 1 sickened 1 (1 hour)%rStage 2 weakness 5 to sonic and Sickened 1 (1 day)%rStage 3 weakness 5 to sonic and Slowed 1 (1 day)%rStage 4…"}, {"name": "Crystallize Flesh", "type": "free", "traits": ["incapacitation", "primal"], "text": "Trigger The crystal dragon damages a creature made of flesh with a jaws Strike%rFrequency three times per day%rEffect The dragon embeds transformative crystals in the creature's flesh. The creature must attempt a DC 40 Fortitude save.%rCritical Success The target is unaffected.%rSuccess The target is Slowed 1 for 1 round as portions of its flesh turn crystalline.%rFailure The target is Slowed 1 and must attempt a Fortitude save at the end of each of its turns; this ongoing save has the…"}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "Vehanezhad makes two claw Strikes and one tail Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "The dragon recharges their Breath Weapon whenever they critically hit with a Strike."}]
