, to a maximum of drained 4.%rEffect: Drain Life"}, {"name": "Grant Wish", "type": "action", "traits": ["arcane"], "cost": 3, "text": "Frequency 3 times per year%rEffect Markish casts Wish as an arcane spell to grant a wish to a mortal or undead creature (excluding himself), but he does his best to warp the effects of the wish to cause suffering or interprets the wish's wording in a way to torment the one who asks for it."}, {"name": "Rush of Shadows", "type": "action", "traits": ["arcane", "water"], "cost": 2, "text": "Markish releases a jet of shadowy water in a 60-foot, dealing 9d6 bludgeoning damage and 6d6 void damage (DC 36 Reflex save). A creature who critically fails its save is also pushed 10 feet (20 feet on a critical failure) and is Enfeebled 1 (Enfeebled 2 on a critical failure). Markish can't use Rush of Shadows for 1d4 rounds."}, {"name": "Soul Spells", "type": "passive", "traits": [], "text": "To cast occult innate spells, Markish must expend a number of soul charges equal to the spell's rank. He can heighten any occult spell to a maximum of 8th level by expending more charges as he Casts the Spell. Markish starts this combat with a trapped soul that has 16 soul charges."}]
