  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Harrowbound", "type": "passive", "traits": [], "text": "Hajeck can only exist in the Harrow Court. If she leaves the plane, either willingly or by succumbing to an effect that forces her into a different plane, she instead immediately reappears somewhere in Harrowheart and becomes Drained 2."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "All-Seeing Hajeck can take on the appearance of a Varisian woman—her appearance from her previous life. This doesn't change her Speed or her attack and damage modifiers, but does prevent her from using Hajeck's Caress."}, {"name": "Hajeck's Caress", "type": "action", "traits": ["curse", "mental", "occult"], "cost": 2, "text": "Hajeck touches a creature, who must succeed at a DC 32 Will save or become Stupefied 1 (Stupefied 2 on a critical failure). If the target fails additional saves against this ability, the condition value increases by 2 (to a maximum of Stupefied 4). This condition value decreases by 1 every 24 hours."}, {"name": "Harrowing Vision", "type": "passive", "traits": ["concentrate", "fortune", "occult"], "text": "Hajeck can use any harrow deck to perform a potent divination that taps into the surrounding magic provided by the Deck of Destiny's otherworldly creation. A Harrowing Vision takes an hour to perform, but most of that time consists of Hajeck and her chosen subject meditating and clearing their minds in a secluded area, culminating in an intense harrow reading that itself takes only a few minutes to complete. The target of a Harrowing Vision must remain adjacent to Hajeck for the entire hour,…"}]
