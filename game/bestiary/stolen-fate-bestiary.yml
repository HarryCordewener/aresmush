  actions: [{"name": "Echolocation", "type": "passive", "traits": [], "text": "Ticktock can use his hearing as a precise sense at the listed range."}, {"name": "Painsense", "type": "passive", "traits": ["divine"], "text": "Ticktock automatically knows whether a creature he hears has any of the Doomed, Dying, or Wounded conditions, as well as the value of those conditions."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 15 (Deactivated by Holy or Silver)", "type": "passive", "traits": []}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Tick Tock Tick Tock", "type": "passive", "traits": ["auditory", "aura", "divine", "mental", "sonic"], "text": "30 feet. When a creature ends its turn in the aura, the constant clicking and ticking sounds coming from Ticktock worm into its thoughts and fill the listener with the sense that time is speeding up for everyone but itself. The creature must succeed at a DC 34 Will save or become Slowed 1 (or Slowed 2 on a critical failure) until the end of its next turn."}, {"name": "Shadow Scream", "type": "action", "traits": ["aura", "concentrate", "darkness", "divine", "mental", "sonic"], "cost": 3, "text": "Frequency once per hour%rEffect The sacristan opens their mouth to unloose a series of thunderous clicking sounds and mind-twisting darkness of the Shadow Plane. This creates a 30-foot of darkness and sounds around the sacristan. Creatures with Darkvision can't see through this darkness. The sacristan can Sustain Shadow Scream for up to 1 minute. Non-velstrac creatures in the area when the ability is used, as well as those who enter or start their turn in the area, must attempt a DC 37 Will…"}]
