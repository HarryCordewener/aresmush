  actions: [{"name": "Boundless Spirit", "type": "passive", "traits": [], "text": "Unlike other ghosts, Zellara is not bound to a specific site or object. She can freely manifest wherever she likes."}, {"name": "Harrow Sense", "type": "passive", "traits": [], "text": "Zellara can detect the presence of harrow cards as an imprecise sense out to 1 mile. She can detect harrow cards as a precise sense out to 120 feet."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When Zellara is destroyed, she re-forms after 2d4 days at the site of her destruction, fully healed. If she is bound to a harrow deck or harrow card, Zellara can manifest near the bound item instead. Once her ex-student Raven has been defeated, Zellara will return to the Boneyard to face her final judgment."}, {"name": "Unbound Fate", "type": "passive", "traits": [], "text": "Zellara's connection to the harrow and fortune-telling in life have given her full control of her fate in the afterlife. She can ignore any fortune or misfortune effects that affect her. If she is forced to roll twice as part of a fortune and misfortune effect, she can take whichever die result she prefers, even if the effect would normally force her to choose one of the results."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Flurry of Cards", "type": "action", "traits": [], "cost": 2, "text": "Zellara unleashes a barrage of harrow cards that deals 7d6 void|options:area-damage damage in a 30-foot (DC 34 Reflex save)."}, {"name": "Harrow Binding", "type": "action", "traits": ["occult"], "cost": 3, "text": "Requirements Zellara is within 120 feet of a harrow card or harrow deck%rEffect Zellara intentionally binds herself to a harrow card or deck she can sense. While bound in this way, she grants her Stack the Deck ability to anyone carrying the bound card or deck. The trigger and effect for Stack the Deck changes to affect the creature carrying the bound item. She can still Stack the Deck for herself while bound. Zellara can unbind herself from the item as an action, which has the concentrate…"}, {"name": "Stack the Deck", "type": "reaction", "traits": ["divine", "fortune", "occult"], "text": "Trigger Zellara is about to attempt a saving throw%rEffect Zellara looks to her immediate future and determines the most favorable outcome for her. She gains a +4 circumstance bonus to the triggering saving throw. If she rolls a critical failure on her saving throw, she can reroll the check, but does so without the bonus."}]
