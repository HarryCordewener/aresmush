  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Rejection Vulnerability", "type": "passive", "traits": [], "text": "As succubi are beings of pure lust, creatures that reject their lust can metaphysically harm them. When a succubus fails a Diplomacy check to Embrace or Request, or when a creature succeeds at its save against a succubus's mental spell or ability, the succubus takes 4d6 mental damage. For one hour after causing mental damage to a succubus in this way, a creature can deal 4d6 mental damage to the succubus with a successful Demoralize incorporating its rejection."}, {"name": "Seductive Presence", "type": "passive", "traits": ["aura", "emotion", "mental"], "text": "10 feet. Any creature in the aura that could be sexually attracted to a succubus takes a -2 circumstance penalty to checks and DCs to oppose the succubus's mental spells, Deception, and Diplomacy."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The succubus can take on the appearance of any Small or Medium humanoid. This doesn't change their Speed or their attack and damage modifiers with their Strikes, but it might change the damage type their Strikes deal (typically to bludgeoning)."}, {"name": "Passionate Kiss", "type": "action", "traits": ["divine", "emotion", "mental"], "cost": 1, "text": "Frequency Once per round.%rEffect Fate's Prophet engages a creature they have Grabbed in an embrace or other act of passion to drain its vital essence. The kiss makes the creature Drained 1 or increases its drained condition by 1, to a maximum of 4. The creature takes 5d6 void damage and the succubus regains Hit Points equal to the damage dealt. The target must succeed at a DC 34 Will save or be affected by a Suggestion to submit to more actions of passion rather than trying to Escape."}, {"name": "Grab Attention", "type": "action", "traits": ["attack"], "cost": 1, "text": "Fate's Prophet attempts to grapple skill=deception a creature using Deception instead of Athletics. If the creature is willing, she grapples it automatically."}]
