  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Form Up", "type": "action", "traits": [], "cost": 1}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "30 feet. DC 34 Will"}, {"name": "Serenity Vulnerability", "type": "passive", "traits": [], "text": "A wrath riot thrives on mayhem, and when members of the throng find themselves facing moments of calm, however brief or temporary, the throng suffers. Whenever the wrath riot fails a saving throw against an affect that would normally Fascinate, Fatigue, Paralyze, Restrain, or Slow at least four creatures, the troop takes (3d6+10) mental damage."}, {"name": "Spores of Wrath", "type": "passive", "traits": ["aura", "disease", "poison"], "text": "5 feet. Non-demons that start their turn in the aura take 4d8 poison damage. Each creature damaged this way must succeed at a DC 34 Fortitude save or take 2d8 persistent piercing damage as the spores penetrate its skin and grow into thick, green vines. The vines cease growing after 10 rounds, and they wither away in 1d4 days if not shaved off before then. The vines can be destroyed if the creature is affected by a good spell or if holy water is applied to the vines (with an Interact action)."}, {"name": "Troop Defenses", "type": "passive", "traits": []}, {"name": "Beaks, Claws, and Talons", "type": "action", "traits": ["unholy"], "cost": 1, "text": "Frequency once per round%rEffect The throng furiously tears at each enemy within its squares and within 5 feet (DC 37 Reflex save). Damage depends on the number of actions.%r1 Damage 1d12+14 slashing plus 1d6 spirit%r2 Damage 2d12+14 slashing plus 1d6 spirit%r3 Damage 3d12+14 slashing plus 1d6 spirit"}, {"name": "Demonic Tide", "type": "passive", "traits": [], "text": "A wrath riot is less organized and more vicious than most troops. They can move into other creatures' spaces, and other creatures can move into their spaces. Their spaces are difficult terrain to non-demon creatures. The first time during a turn that a creature hostile to the throng willingly moves into their space, that creature is subjected to the one-action version of Beaks, Claws, and Talons."}, {"name": "Festival of Ruin", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Each non-demon creature in the throng or within a 20-foot from it takes damage based on the number of actions used (DC 37 Reflex save). Damage depends on the number of actions.%r1 Damage 4d6 electricity|options:area-damage%r2 Damage 8d6 electricity|options:area-damage%r3 Damage 12d6 electricity|options:area-damage"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever the riot Strides, they first Form Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then moves up to their Speed."}]
