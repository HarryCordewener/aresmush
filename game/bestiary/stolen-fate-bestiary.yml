  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "+2 Item to Saves Vs. Fear and Effects That Render him Clumsy, Doomed, Drained, Enfeebled, or Fatigued", "type": "passive", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When the Prince of Wolves dies, his soul immediately travels to the crystalline shadow stele in his Den. His body rejuvenates over 24 hours, emerging fully formed from the shadow stele. He can be permanently slain only if the shadow stele is destroyed."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph"], "cost": 1, "text": "The Prince changes into his humanoid shape, hybrid shape, or wolf shape. While in hybrid shape, he gains a jaws Strike. While in animal shape, he gains the effects of a 5th-rank casting of Animal Form to become a canine. He prefers fighting in hybrid shape."}, {"name": "Hunt Prey", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "The Prince designates one or two targets he can see or hear as his prey. He gains a +2 circumstance bonus to Perception checks to Seek and Track his prey. If he uses Hunt Prey against a third creature when he already has two designated, a prior creature of his choice loses the designation. His designation lasts until his next daily preparations."}, {"name": "Pack Tactics", "type": "passive", "traits": [], "text": "If an enemy is within reach of the Prince and at least two of his allies, that enemy is Off-Guard against him."}, {"name": "Skirmish Strike", "type": "action", "traits": [], "cost": 1, "text": "The Prince either Steps and then Strikes, or Strikes and then Steps."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The Prince deals an extra 4d6 precision damage to Off-Guard creatures."}, {"name": "Tear Fate", "type": "action", "traits": ["curse", "mental", "misfortune", "occult"], "cost": 2, "text": "Requirements The Prince of Wolves' previous action was a successful melee Strike%rEffect The Prince of Wolves twists his weapon in the wounds inflicted on the creature he just struck, then rips the weapon free. As he does so, he tears free fragments of that creature's fate, leaving them with ill fortune. The creature takes 12d6 mental damage (DC 38 Will save); on a failure, the creature also becomes Doomed 1 (Doomed 2 on a critical failure). The creature is thereafter immune to Tear Fate."}, {"name": "Twin Parry", "type": "action", "traits": [], "cost": 1, "text": "Requirements The Prince is wielding two melee weapons, each in a different hand%rEffect The Prince gains a +1 circumstance bonus to AC until the start of his next turn, as long as he continues to meet this ability's requirement.%rEffect: Twin Parry"}, {"name": "Twin Takedown", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rRequirements The Prince is wielding two melee weapons, each in a different hand%rEffect The Prince makes two Strikes against his hunted prey, one with each of the required weapons. If both hit the same hunted prey, combine their damage for the purpose of its resistances and weaknesses. Apply his multiple attack penalty to each Strike normally."}]
