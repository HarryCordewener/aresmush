  actions: [{"name": "Slow Metabolism", "type": "passive", "traits": [], "text": "Hooktongue can go for 10 years without feeding. After this, its hunger makes it Slowed 1 but doesn't otherwise impact its lifespan. If Hooktongue is slowed as a result of starvation, it can remove this condition by using Swallow Whole to gulp down a meal."}, {"name": "Undetectable", "type": "passive", "traits": ["detection", "primal", "revelation", "scrying"], "text": "Hooktongue automatically tries to counteract any detection, revelation, or scrying divination attempted against it, using its Stealth modifier for the counteract check."}, {"name": "Capsize", "type": "action", "traits": ["attack"], "cost": 1, "text": "Hooktongue attempts to capsize an aquatic vessel of its size or smaller that it's adjacent to. It must succeed at an Athletics check with a DC of 35 or the pilot's Sailing Lore DC, whichever is higher."}, {"name": "Hooktongue Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 34 Fortitude%rMaximum Duration 6 rounds%rStage 1 2d6 poison damage and Clumsy 1 (1 round)%rStage 2 3d6 poison damage, clumsy 1, and Confused (1 round)%rStage 3 4d6 poison damage, Clumsy 2, and confused (1 round)"}, {"name": "Poison Spray", "type": "action", "traits": ["poison", "primal"], "cost": 2, "text": "Hooktongue sprays poison from its throat in an 80-foot that deals 15d6 poison|options:area-damage damage (DC 34 Reflex). A creature that fails or critically fails this save is exposed to Hooktongue Venom as well. Hooktongue can't use Poison Spray again for 1d4 rounds."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Large, (2d10+10) bludgeoning damage, Rupture 28"}, {"name": "Water Travel", "type": "action", "traits": ["primal", "water"], "cost": 3, "text": "Hooktongue dissolves into water, appearing only as a long, serpentine silhouette on the waves. While in this form, Hooktongue's swim Speed increases to 600 feet, it automatically succeeds at Athletics checks to Swim, and it gains a +4 circumstance bonus to Stealth checks in water. Hooktongue can remain in this form for 8 hours but can't enter salt water when using this ability. Hooktongue can return to its normal form using a single action, which has the concentrate trait."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
