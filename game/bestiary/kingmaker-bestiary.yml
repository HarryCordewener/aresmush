 is Frightened 2%rCritical Failure The creature is Frightened 3"}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "claw"}, {"name": "Unstoppable Charge", "type": "action", "traits": [], "cost": 3, "text": "The troll king Strides twice in a straight line. It can make up to two claw Strikes during this movement and one jaws Strike at the end of its movement. It can't Strike the same creature more than once."}, {"name": "Vicious Ranseur", "type": "passive", "traits": [], "text": "When the Misbegotten Troll attacks with his glaive, it manifests dozens of hooks and spikes along its length and blade. He deals an additional 3d8 piercing damage to any creature he strikes but inflicts 1d8 piercing damage to himself with each glaive Strike."}]
