  actions: [{"name": "Site Bound", "type": "passive", "traits": [], "text": "A typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "Releasing the nereid and allowing her to leave this place (or, alternatively, killing her) allows the Gardener to move on to the afterlife.%rWhen a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence and sets right whatever prevents the spirit from resting."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Corrupting Gaze", "type": "action", "traits": [], "cost": 2, "text": "The ghost stares at a creature it can see within 30 feet. The target takes 9d6 void damage with a DC 37 Will save.%rA creature that fails its save is also Stupefied 1 for 1 minute."}, {"name": "Draining Touch", "type": "action", "traits": [], "cost": 2, "text": "With a touch, the ghost attempts to drain a living creature's life force. It makes a ghostly hand Strike but deals no damage on a hit.%rInstead, the target becomes Drained 1 for 1 day, and the ghost regains HP equal to half its own level."}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "Frequency once per day.%rIf the Gardener's next action is to cast a 6th- or lower level spell, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Telekinetic Assault", "type": "action", "traits": ["divine"], "cost": 2, "text": "The ghost cries out in pain and anguish as small objects and debris fly about in a 30-foot. Creatures in this area take 9d6 bludgeoning|options:area-damage damage, subject to a DC 37 Reflex save."}]
