  actions: [{"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "No Time To Die", "type": "passive", "traits": [], "text": "As long as Armag wields Ovinrbaane and is raging, the combination of the sword's magic and Armag's furious conviction that he is the true Armag protects him from death. His eyes and the sword's blade weep with blood and glow with red light at this time. As long as these conditions persist, he never increases beyond Dying 3 and is not rendered Unconscious. Instead, Armag becomes Confused and continues to fight. If Ovinrbaane is taken from him (such as via a successful Disarm), or if his rage…"}, {"name": "Second Wind", "type": "reaction", "traits": [], "text": "Trigger Armag is Fatigued and scores a critical hit with a melee strike or reduces a creature to 0 Hit Points with a melee Strike%rEffect Armag draws upon inner reserves of furious energy. He is no longer fatigued."}, {"name": "Armag's Rage", "type": "free", "traits": [], "text": "Requirements Armag is not Fatigued or raging.%rEffect Armag flies into a rage that lasts 1 minute. While raging, he gains a +6 status bonus to damage rolls and suffers a -1 status penalty to AC. During his rage, Armag gains an additional reaction at the start of his turn, but he can only use this additional reaction for Attacks of Opportunity. After the rage ends, Armag is fatigued."}, {"name": "Awesome Blow", "type": "action", "traits": [], "cost": 1, "text": "Requirements Armag's last action was a successful Strike.%rEffect The weight of Armag's previous swing drives his foe back. He attempts an Athletics check against the target's Fortitude DC.%rCritical Success Armag gains the critical success effects of a Shove, then the critical success effect of a Trip against the target.%rSuccess Armag gains the success effect of a Shove, then the success effect of a Trip against the target.%rFailure Armag pushes the foe back 5 feet."}, {"name": "Greatsword Critical Specialization", "type": "passive", "traits": [], "text": "On a critical hit from a greatsword Strike, the target is made off-balance and becomes Off-Guard until the start of Armag's next turn."}, {"name": "Shoulder Slam", "type": "action", "traits": [], "cost": 1, "text": "Armag Strides forward and hunkers down to attempt a shoulder spike Strike against a target at the end of that movement. If he critically hits a creature with this Strike, that creature is knocked Prone."}]
