  actions: [{"name": "Enraged Growth", "type": "reaction", "traits": ["polymorph", "primal"], "text": "Trigger The spriggan warlord takes damage%rEffect The spriggan warlord grows to size Large, along with their equipment (which returns to natural size if removed). The spriggan warlord's reach increases by 5 feet. They regain 15 healing Hit Points and gain a +2 status bonus to melee attack and damage rolls.%rThis effect continues until the end of the spriggan warlord's next turn, but on any turn in which the spriggan warlord deals damage to another creature and is not Fatigued, the effect…"}, {"name": "Bully's Bludgeon", "type": "action", "traits": ["nonlethal"], "cost": 1, "text": "The spriggan warlord makes a morningstar Strike with a +2 circumstance bonus to its attack roll. This attack is nonlethal."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Agai's Strikes deal an additional 2d6 precision damage to Off-Guard creatures."}, {"name": "Warlord's Training", "type": "passive", "traits": [], "text": "A spriggan warlord has access to the critical specialization effects for crossbows and morningstars, and the reload of any crossbow they wield is reduced by 1 (to a minimum of 0)."}]
