  actions: [{"name": "Unseen Sight", "type": "passive", "traits": [], "text": "The ritual Foras led his cultists on allowed them to turn aside time and halt aging, but it required more than the sacrifice of an individual's given name-it required the sacrifice of sight itself. The removal of the eyes symbolized a Thresholder's abandonment of all they had seen before, and with the ritual's completion they gain something greater than mere vision: they gain the Unseen Sight. This is a precise sense that mimics Darkvision yet functions even if the eye sockets themselves are…"}, {"name": "Outside of Time", "type": "passive", "traits": [], "text": "Foras exists outside of time; he doesn't age, doesn't need food or drink to survive, and can't be Quickened or Slowed unless he chooses to be."}, {"name": "Resolve", "type": "passive", "traits": [], "text": "When Foras rolls a success on a Will save, he gets a critical success instead."}, {"name": "Time Siphon", "type": "passive", "traits": ["aura", "occult"], "text": "60 feet. A living creature that enters the aura or ends its turn within it has some of its temporal essence drained away to Yog-Sothoth. It must succeed at a DC 38 Will save or become Slowed 1 for 1 round (Slowed 2 on a critical failure). Worshipers of Yog-Sothoth are immune to Time Siphon."}, {"name": "Accelerated Existence", "type": "passive", "traits": [], "text": "Foras is Quickened, and he can use this additional action to Step, Stride, or Sustain a Spell."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Foras's spellcasting action, he attempts a DC 15 Flat.; on a success, the action isn't disrupted."}]
