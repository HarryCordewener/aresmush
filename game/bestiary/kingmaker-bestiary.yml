  actions: [{"name": "Gatekeeper Aura", "type": "passive", "traits": ["aura", "occult", "teleportation"], "text": "60 feet. A creature that uses a teleportation ability within the aura's emanation or enters it via a teleportation ability must succeed a DC 38 Will save or become Sickened 1 and have its destination changed to a point of the radiant warden's choosing within the emanation. On a successful save, the creature arrives as intended but is still sickened 1."}, {"name": "Numerian Construct", "type": "passive", "traits": [], "text": "Any encounters with adamantine golems, guthallaths, or radiant wardens in Numeria are with ancient robotic versions of these creatures. In encounters with them, describe them as having more technological aspects. The guthallath's erosion aura could be caused by clouds of deconstructor nanites and its annihilation beams manifest as plasma blasts. The adamantine golem might have tank treads instead of legs and its vent ability might manifest as a spray of dozens of laser beams in a cone. And the…"}, {"name": "Orrery", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Until it acts, the radiant warden appears to be an orrery (or similar large mechanical contraption, such as a telescope). It has an automatic result of 53 on Deception checks and DCs to convincingly pass as such a machine."}, {"name": "Radiant Blast", "type": "action", "traits": ["force", "occult"], "cost": 2, "text": "The radiant warden releases a 50-foot of bright energy that deals 10d12 force|options:area-damage damage (DC 38 Reflex save). The radiant warden can't use Radiant Blast for 1d4 rounds."}, {"name": "Radiant Blow", "type": "passive", "traits": ["teleportation"], "text": "When a creature is hit by the radiant warden's hammer Strike, a flash of radiant energy attempts to anchor the creature in place. The creature must attempt a DC 38 Will save; on a failure, the creature can't use any teleportation effects for 1 minute. On a critical failure, the creature is also permanently Blinded."}]
