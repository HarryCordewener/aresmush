 The creature being landed on can attempt a DC 41 Reflex save."}, {"name": "Powerful Blows", "type": "passive", "traits": [], "text": "If a guthallath hits with an attack and rolls a natural 19 on the d20 roll, the attack is a critical hit. This has no effect if the 19 would be a failure."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Huge or smaller, foot, DC 45 Reflex"}, {"name": "Improved Grab", "type": "free", "traits": []}, {"name": "Improved Knockdown", "type": "free", "traits": []}, {"name": "Improved Push 20 feet", "type": "free", "traits": []}]
