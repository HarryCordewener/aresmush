  actions: [{"name": "Greensight", "type": "passive", "traits": [], "text": "The wild hunt scout ignores the Concealed condition from leaves and other foliage."}, {"name": "Planar Acclimation", "type": "passive", "traits": [], "text": "The wild hunt scout treats the plane it is located on as its home plane."}, {"name": "Wild Hunt Link", "type": "passive", "traits": ["aura", "magical"], "text": "500 feet. A wild hunt scout grants other wild hunt creatures the scout's Deny Advantage."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Instinctive Cooperation", "type": "passive", "traits": [], "text": "The wild hunt scout automatically achieves a critical success on saving throws against effects created by other allied wild hunt creatures."}, {"name": "Wild Gaze", "type": "passive", "traits": ["aura", "fear", "incapacitation", "mental", "primal", "visual"], "text": "30 feet. Those who meet the gaze of a wild hunt scout come face-to-face with the hunt's fearful power and find it difficult to act in the face of such a legendary legacy. When a creature ends its turn in the aura, it must succeed at a DC 37 Will save to resist becoming Slowed 1 (Slowed 2 on a critical failure). The wild hunt scout can deactivate or activate this aura by using a single action, which has the concentrate trait."}, {"name": "Befuddle", "type": "passive", "traits": ["mental", "primal"], "text": "A wild hunt scout can emit a beam of emerald light from their crystal shard to attempt an emerald beam ranged Strike. If the beam hits, it inflicts no damage (nor does it inflict precision damage from a sneak attack), but it overstimulates the target's mind, causing them to become Dazzled and Off-Guard for 1 round. On a critical hit, the target is also Blinded for 1 round."}, {"name": "Deny Advantage", "type": "passive", "traits": [], "text": "A wild hunt scout isn't Off-Guard to Hidden, Undetected, or flanking creatures of your level or lower, or creatures of their level or lower using Surprise Attack. However, they can still help their allies flank."}, {"name": "Focus Gaze", "type": "action", "traits": ["concentrate", "fear", "incapacitation", "mental", "primal", "visual"], "cost": 1, "text": "The wild hunt scout fixes its glare at a creature it can see within 30 feet. The target must immediately attempt a Will save against the wild hunt hound's wild gaze. If the creature was already slowed by the wild gaze before attempting its save, a failed save causes it to be Paralyzed for 1 round. After attempting its save, the creature is temporarily immune to Focus Gaze from any wild hunt until the start of the wild hunt scout's next turn."}, {"name": "Forceful Focus", "type": "action", "traits": ["concentrate"], "cost": 3, "text": "Requirement The wild hunt scout cast magic missile the previous round.%rEffect The wild hunt scout focuses on their mastery of force, standing still as they become swathed in pulsing emerald light. Any magic missile innate spells they have cast that day are restored, allowing them to be cast again. Until the end of their next turn, any creature that takes force damage from the wild hunt scout must succeed at a DC 40 Fortitude save or be Stunned 1 (Stunned 3 on a critical failure). The wild hunt…"}, {"name": "Manifest Crystals", "type": "free", "traits": [], "text": "A wild hunt scout can manifest a +2 greater striking scimitar made of crystalized force or a fist-sized shard of the same in her hands. These objects vanish upon the wild hunt scout's death, or as soon as they no longer possess the items."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "A wild hunt scout's Strikes deal 3d6 extra precision damage to Off-Guard creatures."}]
