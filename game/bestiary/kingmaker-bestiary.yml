  actions: [{"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a graveknight is destroyed, its armor rebuilds its body over the course of 1d10 days-or more quickly if the armor is worn by a living host. If the body is destroyed before then, the process restarts.%rA graveknight can only be permanently destroyed by obliterating its armor (such as with Disintegrate), transporting it to the Forge of Creation, or throwing it into the heart of a volcano."}, {"name": "Sacrilegious Aura", "type": "passive", "traits": ["aura", "divine", "evil"], "text": "30 feet. When a creature in the aura uses a vitality spell or ability, the graveknight automatically attempts to counteract it, with a counteract modifier of +26."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Designate Blood Foe", "type": "action", "traits": [], "cost": 1, "text": "Korog declares one creature he can see within 30 feet to be his blood-foe whom he swears to defeat. He can have up to three blood-foes designated at a time; any additional blood-foe removes another blood-foe of Korog's choice. Korog treats the results of Perception checks made against blood-foes as improved by one degree, and he has a +2 circumstance bonus to AC against his blood-foes' attacks."}, {"name": "Devastating Blast", "type": "action", "traits": ["arcane", "electricity"], "cost": 2, "text": "The graveknight unleashes a 30-foot of energy. Creatures in the area take 9d12 electricity|options:area-damage damage (DC 37 Reflex save). The graveknight can use this ability once every 1d4 rounds."}, {"name": "Graveknight's Curse", "type": "passive", "traits": ["arcane", "curse"], "text": "This curse affects anyone who wears a graveknight's armor for at least 1 hour.%rSaving Throw DC 37 Will save%rOnset 1 hour%rStage 1 Doomed 1 and cannot remove the armor (1 day)%rStage 2 Doomed 2, the creature's Speed is reduced by 10, and cannot remove the armor (1 day)%rStage 3 dies and transforms into the armor's graveknight.%rEffect: Graveknight's Curse"}, {"name": "Korog's Command", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Korog commands his allies to take an action. All allies who hear or see him are Quickened for 1 round and can use this extra action to Step, Stride, or make a Strike against one of Korog's blood-foes."}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "The graveknight has access to the critical specialization effects of any weapons it wields."}]
