  actions: [{"name": "Shame", "type": "passive", "traits": [], "text": "A ghostly guard suffers from shame when it attacks a target that appears to be an elf or a worshipper of Calistria. Forgive Foe can be attempted against a ghostly guard with a DC 39 Diplomacy check or DC 39 Society check. If a ghostly guard is affected by a critical success from Forgive Foe, it sighs in relief as it fades away, its soul released into the afterlife."}, {"name": "Site Bound", "type": "passive", "traits": [], "text": "A typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "Slaying or forgiving Nyrissa allows the ghostly guards to move on to their long-delayed afterlives, as does achieving a critical success with Forgive Foe.%rWhen a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence and sets right whatever prevents the spirit from resting."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Ectoplasmic Maneuver", "type": "action", "traits": ["attack"], "cost": 1, "text": "The ghostly guard lashes out with a whipping strand of solid ectoplasm against a target within 15 feet, in an attempt to Disarm, Shove, or Trip the foe. It uses its ghostly rapier Strike rather than an Athletics check to determine the results of this attempt."}, {"name": "Frightful Moan", "type": "action", "traits": ["auditory", "divine", "emotion", "fear", "mental"], "cost": 2, "text": "The ghost laments its fate, forcing each living creature within 30 feet to attempt a DC 36 Will save. On a failure, a creature becomes Frightened 2 (or Frightened 3 on a critical failure). On a success, a creature is