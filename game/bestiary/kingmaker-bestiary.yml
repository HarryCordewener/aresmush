al hit, the save's result is worsened one degree.%rCritical Success The creature is unaffected by blindness.%rSuccess The creature is Dazzled for 1 round.%rFailure The creature is Blinded for 1 minute. At the end of each of its turns, the creature can attempt a DC 48 Fortitude save to end this blindness early.%rCritical Failure The creature is blinded permanently."}, {"name": "Change Shape", "type": "free", "traits": ["concentrate", "polymorph", "primal"], "text": "The Lantern King can take on the appearance of any fey or humanoid, but he typically does so only to trick and confuse creatures. He loses his searing rune and blinding beam Strikes, but he gains a melee fist Strike that inflicts (4d8 + 19) bludgeoning damage."}, {"name": "Drain Luck", "type": "passive", "traits": ["curse", "mental", "misfortune", "primal"], "text": "When the Lantern King damages a creature with his searing rune Strike, he drains the creature's luck. The creature must succeed at a DC 48 Will save or gain a -1 status penalty to all checks; it is then temporarily immune to Drain Luck for 1 round. Further damage dealt by the Lantern King's searing rune Strikes increases the status penalty by 1 on a failed save to a maximum status penalty of -4. This status penalty is reduced by one every time the affected creature achieves a critical success…"}, {"name": "Playful Switch", "type": "action", "traits": ["primal", "teleportation"], "cost": 1, "text": "The Lantern King targets two creatures within 60 feet, causing each to become surrounded by glowing runes. The Lantern King attempts a single Thievery check against each target's Reflex DC. The Lantern King can't use Playful Switch again for 1 round.%rCritical Success If the Thievery check achieves a critical success against both targets, they swap places and are both Stunned 1. Each creature must be able to fit into their new spaces or the effect fails.%rSuccess If the Thievery check achieves…"}, {"name": "Prismatic Burst", "type": "reaction", "traits": [], "text": "Trigger A creature achieves a critical hit against the Lantern King or damages it with a cold iron weapon.%rEffect The Lantern King casts Prismatic Spray."}]
