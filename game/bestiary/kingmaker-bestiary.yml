  actions: [{"name": "Fey Conduit", "type": "passive", "traits": [], "text": "Before she sent him into the Material Plane, Nyrissa used the power of her home within the Fable (see area M7c ) to forge a link with the Horned Hunter. During his time on the Material Plane, she can observe the world as if seeing through his eyes and listening through his ears. She cannot bolster the Horned Hunter via this link, and uses it primarily to spy on the PCs and observe their tactics in preparation for what she hopes never occurs-their invasion of Thousandbreaths. If the Horned…"}, {"name": "Sylvan Wine", "type": "passive", "traits": ["mental", "primal"], "text": "A satyr's wineskin magically enchants any alcohol inside. With an Interact action, a living creature can imbibe the alcohol and gain a +3 item bonus to Will saves for the following hour. When the wineskin is removed from a satyr's person, the magic remains only until the wine spoils. The wineskin holds up to eight drafts of wine.%rEffect: Sylvan Wine (Horned Hunter)"}, {"name": "Juggernaut", "type": "passive", "traits": [], "text": "When the Horned Hunter rolls a success on a Fortitude save, he gets a critical success instead."}, {"name": "Bloom Step", "type": "passive", "traits": [], "text": "The Horned Hunter ignores the effects of non-magical difficult terrain and that caused by a bloom."}, {"name": "Bow Specialist", "type": "passive", "traits": [], "text": "The Horned Hunter gains the critical specialization effect for any bow he wields."}, {"name": "Fleet Performer", "type": "reaction", "traits": [], "text": "Trigger The Horned Hunter Plays the Pipes%rEffect The Horned Hunter Steps or Strides."}, {"name": "Hunt Prey", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "The Horned Hunter designates a single creature he can see or hear as his prey. He gains a +2 circumstance bonus to Perception checks when he Seeks his prey and a +2 circumstance bonus to Survival when he Tracks his prey, and he ignores the penalty for making ranged attacks within his second range increment against his prey. He can have only one creature designated as prey at a time. If he uses Hunt Prey against a creature when he already has a creature designated, the prior creature loses the…"}, {"name": "Masterful Hunter", "type": "passive", "traits": [], "text": "The Horned Hunter's multiple attack penalty for attacks against his hunted prey is -3 (-2 with an agile weapon) on his second attack in a turn, and -6 (-4 with an agile weapon) on his third or subsequent attacks. The first time he hits his hunted prey in a round, he deals 2d8 additional precision damage."}, {"name": "Play the Pipes", "type": "action", "traits": ["auditory", "primal"], "cost": 3, "text": "Requirements The satyr is holding a musical instrument.%rEffect The satyr plays a melody on his instrument to cast Charm, Fear, Sleep, or Suggestion without expending the spell slot and using his music in place of providing the spell's component actions. The spell gains the auditory trait and targets all creatures in a 60-foot instead of its usual targets. A creature that succeeds at its Will save against any spell is then temporarily immune from spells played from that satyr's pipes for 1…"}, {"name": "Improved Knockdown", "type": "free", "traits": []}]
