  actions: [{"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Atrophied Lich", "type": "passive", "traits": [], "text": "Sometimes, a lich that remains immobile and insensible for extended periods of time-as Vordakai did after he was imprisoned in his tomb just prior to Earthfall 10,000 years ago-can become atrophied. The exact effects of atrophy vary from lich to lich but always result in a reduction of spellcasting power and damage to their soul cage link.%rIn Vordakai's case, he has forgotten much arcane lore and lost a significant amount of his spellcasting ability. At the height of his power, he was a…"}, {"name": "Counterspell", "type": "reaction", "traits": [], "text": "Trigger A creature casts a spell Vordakai has prepared.%rEffect Vordakai expends a prepared spell to counter the triggering creature's casting of that same spell. He loses its spell slot as if he had cast the triggering spell. He then attempts to counteract the triggering spell."}, {"name": "Flash of Insight", "type": "free", "traits": ["fortune", "occult"], "text": "Frequency once per day.%rTrigger Vordakai is about to roll a d20.%rEffect Vordakai peers into an occluded spectrum of possible futures. He gets a success (but not a critical success) without rolling."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "60 feet. DC 29 Will"}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Vordakai's spellcasting action, the lich attempts a DC 15 Flat. On a success, the action isn't disrupted."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consume Memories", "type": "action", "traits": ["arcane", "attack", "mental"], "cost": 2, "text": "Vordakai draws out a creature's memories and consumes them, learning bits and pieces of the world through the victim's thoughts. The lich makes a hand Strike against the target; if he hits,