  actions: [{"name": "Tremorsense 30 feet", "type": "passive", "traits": []}, {"name": "All-Around Vision", "type": "passive", "traits": []}, {"name": "+4 Status to All Saves vs. Mental", "type": "passive", "traits": []}, {"name": "Fast Healing 20", "type": "passive", "traits": []}, {"name": "Swarm Mind", "type": "passive", "traits": []}, {"name": "Discorporate", "type": "passive", "traits": ["splash"], "text": "When the worm that walks is reduced to 0 HP, it discorporates and the component worms that make up its body disperse in every direction. If even a single worm escapes, the worm that walks will eventually re-form using a process that typically takes 1d10 days.%rWhile the exact circumstances and surroundings determine how long the worm that walks's foes have to dispatch the fleeing worms before they escape, usually its foes have only a single round. Typically, this requires the application of an…"}, {"name": "Contingency", "type": "reaction", "traits": [], "text": "Trigger The Wriggling Man is reduced to 50 or fewer HP%rEffect Translocate, heightened to 5th level, teleports the Wriggling Man to area M6 ."}, {"name": "Effortless Concentration", "type": "free", "traits": [], "text": "Trigger The wriggling man's turn begins.%rEffect The Wriggling Man immediately gains the effects of the Sustain a Spell action, allowing him to extend the duration of an active spell."}, {"name": "Quickened Casting", "type": "free", "traits": [], "text": "Frequency once per day%rEffect When the Wriggling Man casts a spell of 8th level or lower, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Squirming Embrace", "type": "action", "traits": [], "cost": 1, "text": "The worm that walks Strides, ending its movement sharing a space with a creature, and deals 8d8 piercing damage to the creature. The creature can attempt a DC 44 Reflex save."}, {"name": "Swarm Shape", "type": "action", "traits": ["attack", "concentrate"], "cost": 1, "text": "The worm that walks