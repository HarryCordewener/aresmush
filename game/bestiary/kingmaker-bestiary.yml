  actions: [{"name": "Perpetual Hangover", "type": "passive", "traits": [], "text": "The Stag Lord is in a constant cycling state of being drunk or hungover. As a result, he is constantly Sickened 1, and cannot reduce his sickened state to lower than 1 (although if effects increase his sickened value, he can reduce them back toward 1 as normal). The Stag Lord can willingly ingest food and drink (including potions and elixirs) while sickened. The values in this stat block have been adjusted to account for his sickened state."}, {"name": "Dread Striker", "type": "passive", "traits": [], "text": "The Stag Lord capitalizes on his enemies' fear; any creature that has the Frightened condition is also Off-Guard against his attacks."}, {"name": "Hunt Prey", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "You designate a single creature as your prey and focus your attacks against that creature. You must be able to see or hear the prey, or you must be tracking the prey during exploration.%rYou gain a +2 circumstance bonus to Perception checks when you Seek your prey and a +2 circumstance bonus to Survival checks when you Track your prey. You also ignore the penalty for making ranged attacks within your second range increment against the prey you're hunting.%rYou can have only one creature…"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The Stag Lord deals 2d6 extra precision damage to Off-Guard creatures."}, {"name": "Unfair Aim", "type": "action", "traits": ["concentrate"], "cost": 2, "text": "The Stag Lord lines up a shot and then attempts a ranged Strike against a hunted prey. On this strike, he treats the target as if they were Off-Guard."}]
