  strikes: [{"name": "Longsword", "bonus": 12, "damage": [["1d8+6", "slashing", null]], "traits": ["versatile-p"]}, {"name": "Composite Longbow", "bonus": 8, "damage": [["1d8+2", "piercing", null]], "traits": ["deadly-d10", "propulsive", "reload-0", "volley-30"], "range": 100}]
  actions: [{"name": "Shameful Memories", "type": "passive", "traits": ["emotion", "mental", "visual"], "text": "If Akiros sees another creature openly wearing Erastil's holy symbol, he must attempt a DC 15 Will save. Unless he critically fails his saving throw, he is temporarily immune to Shameful Memories for 24 hours.%rCritical Success Akiros is unaffected.%rSuccess Akiros is distracted by shame and becomes Sickened 1 for 1 round.%rFailure Akiros becomes Sickened 2 with his shame.%rCritical Failure As failure, but Akiros is Stunned 1 as well. He does not become temporarily immune to Shameful Memories,…"}, {"name": "No Escape", "type": "reaction", "traits": [], "text": "Trigger An adjacent foe moves away.%rEffect Akiros can Stride up to his speed, following the triggering creature and keeping it in reach throughout its movement until it stops moving or Akiros has moved his full Speed."}, {"name": "Rage", "type": "action", "traits": ["concentrate", "emotion", "mental"], "cost": 1, "text": "Akiros flies into a rage. He gains 6 temporary Hit Points, deals 2 additional Damage with melee Strikes, takes a -1 penalty to AC, and can't use other actions with the concentrate trait. This effect lasts for 1 minute, until he falls Unconscious, or until there are no enemies he can perceive, whichever comes first, at which point he loses any remaining temporary Hit Points from Rage and can't Rage again for 1 minute."}]
