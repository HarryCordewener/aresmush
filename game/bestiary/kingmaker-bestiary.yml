  actions: [{"name": "Tiger Empathy", "type": "passive", "traits": ["primal"], "text": "Alasen can communicate with felines."}, {"name": "Defensive Roll", "type": "free", "traits": [], "text": "Frequency once per 10 minutes%rTrigger A physical attack would reduce Alasen to 0 Hit Points.%rEffect Alasen drops into a roll to disperse the force of the blow and takes half damage from the attack."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "Medium human with fist +26 for 2d6+16 bludgeoning, or tiger with Speed 30 feet and Wrestle.%rWrestle 1 The tiger makes a claw Strike against a creature it is grabbing. If the attack hits, that creature is knocked Prone.%rThe werecreature changes into its humanoid, hybrid, or animal shape. Each shape has a specific, persistent appearance. A true werecreature's natural form is its hybrid shape.%rIn humanoid shape, the werecreature uses its original humanoid size, loses its jaws and claws Strikes,…"}, {"name": "Critical Debilitating Strike", "type": "free", "traits": [], "text": "Trigger Alasen's Strike hits an Off-Guard creature and deals damage.%rEffect The target becomes Enfeebled 1 or takes a –10-foot status penalty to its Speeds, as chosen by Alasen. On a critical hit, the target must also attempt a DC 34 Fortitude save.%rCritical Success The target is unaffected.%rSuccess The target is Slowed 1 until the end of Alasen's next turn.%rFailure The target is Slowed 2 until the end of Alasen's next turn.%rCritical Failure The target is Paralyzed until the end of…"}, {"name": "Curse of the Weretiger", "type": "passive", "traits": ["curse", "primal"], "text": "This curse affects only humanoids.%rSaving Throw DC 34 Fortitude%rOn each full moon, the cursed creature must succeed at another Fortitude save or turn into the same kind of werecreature until dawn.%rThe creature is under the GM's control and goes on a rampage for half the night before falling unconscious until dawn."}, {"name": "Mobility", "type": "passive", "traits": [], "text": "When Alasen takes a Stride action to move half her Speed or less, that movement does not trigger reactions."}, {"name": "Moon Frenzy", "type": "passive", "traits": ["polymorph", "primal"], "text": "When a full moon appears in the night sky, the werecreature must enter hybrid form, can't Change Shape thereafter, becomes one size larger, increases its reach by 5 feet, and increases the damage of its jaws Strike (or a similar Strike) by 2.%rWhen the moon sets or the sun rises, the werecreature returns to humanoid form and is Fatigued for 2d4 hours.%rEffect: Moon Frenzy"}, {"name": "Pounce", "type": "action", "traits": [], "cost": 1, "text": "The weretiger Strides and makes a Strike at the end of that movement. If the weretiger began this action Hidden, they remain hidden until after this ability's Strike."}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Alasen deals 2d6 extra precision damage to Off-Guard creatures."}]
