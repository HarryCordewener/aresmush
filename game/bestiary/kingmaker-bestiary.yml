  actions: [{"name": "Glow", "type": "passive", "traits": ["aura", "light"], "text": "20 feet. A will-o'-wisp is itself naturally invisible, but glows with a colored light, casting bright light in the aura and making it visible. An Ancient Wisp can appear as a tiny pinpoint of light."}, {"name": "Magic Immunity", "type": "passive", "traits": [], "text": "A will-o'-wisp is immune to all spells except Faerie Fire, Revealing Light, Force Barrage, and Quandary."}, {"name": "Feed on Fear", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Requirement An enemy is under a fear effect or Dying within 15 feet of the will-o'-wisp.%rEffect The will-o'wisp feeds on the creature's terror. It regains 2d8 healing Hit Points, and if it has Gone Dark, its glow reignites.%rA will-o'-wisp can take this action only once per round."}, {"name": "Go Dark", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "The will-o'-wisp extinguishes its glow, becoming Invisible. It can end this effect with another use of this action. If it uses its shock attack while invisible, the arc of electricity lets any observer determine its location, making the will-o'-wisp only Hidden to all observers until it moves."}]
