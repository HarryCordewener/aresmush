  actions: [{"name": "Bound to the Mortal Night", "type": "passive", "traits": [], "text": "Unlike most ghosts, Fionn isn't bound to a specific site. Instead, his exile to the Material Plane has bound him to the night itself. He can travel anywhere he wishes, so long as it is night. During the day, he cannot travel further than thirty feet from the location he occupies as the sun rises. He cannot leave the Material Plane at all, and if he suffers an effect that would normally transport him to another plane, he remains on the Material Plane and instead is Stunned 3."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "In order to put Fionn permanently to rest, the PCs must release his brother Kean from Amiri's blade-doing so renders Fionn's plan to use Kean's soul to return to the First World impossible and causes the frustrated ghost to accept his fate and resign himself as well to the afterlife. Until this occurs, Fionn seeks out the blade each time he rejuvenates; now that he's seen the blade in person, he's capable of sensing its location at all times.%rWhen a ghost is destroyed, it re-forms after 2d4…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Command the Undead", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Fionn's orders are difficult for undead to ignore. When Fionn Commands the Undead, two undead allies who are lower level than him and are within 30 feet of him may Stride or Strike."}, {"name": "Exile's Curse", "type": "action", "traits": ["attack", "curse", "mental", "misfortune", "primal"], "cost": 2, "text": "Fionn casts Outcast's Curse, extending the spell's range to 30 feet. A creature that fails its save against the spell is also Stupefied 1 (Stupefied 2 on a critical failure) by the overwhelming sensation and belief that they have been exiled from all they hold dear. This stupefaction value cannot be reduced below 1 as long as the creature continues to be affected by outcast's curse ."}, {"name": "Fearsome Blizzard", "type": "action", "traits": ["aura", "cold", "emotion", "primal"], "cost": 2, "text": "Fionn exhales a swirling blizzard of snow and ice that chills the soul as surely as it freezes flesh. All living creatures within 60 feet of Fionn must attempt a DC 33 Fortitude save. Fionn can't use Fearsome Blizzard for 1d4 rounds.%rCritical Success The creature is unaffected.%rSuccess The creature takes 5d8 cold|options:area-damage damage.%rFailure The creature takes 10d8 cold|options:area-damage damage and is Frightened 1; the frightened effect has the emotion, fear, and mental…"}]
