  actions: [{"name": "Shame", "type": "passive", "traits": [], "text": "A defaced naiad queen suffers from shame when it attacks any target that can cast primal spells, any fey creature, or any creature that can cast divine spells and worships a deity or faith associated with nature or the First World (such as Gozreh, one of the Eldest, or the Green Faith). Forgive Foe can be attempted against a defaced naiad queen with a DC 36 Diplomacy check or Nature check. If a defaced naiad queen is affected by a critical success from Forgive Foe, its eyes are restored and it…"}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Nymph's Tragedy", "type": "passive", "traits": ["aura", "emotion", "mental", "primal", "visual"], "text": "30 feet. Creatures that start their turn in this aura must succeed at a DC 33 Will save or become Dazzled as their eyes cloud with blood, darkening their vision. This effect persists as long as the creature continues to begin its turn within the aura, even if it can't see the defaced naiad on subsequent turns."}, {"name": "Agonized Wail", "type": "action", "traits": ["auditory", "emotion", "fear", "mental", "primal"], "cost": 1, "text": "The defaced naiad queen unleashes an agonized wail. Each creature within 60 feet must succeed at a DC 33 Will save or become Frightened 1 (or, on a critical failure, Frightened 2 and Fleeing until the end of its next turn). The creature is then temporarily immune to Agonized Wail for 1 hour."}, {"name": "Baleful Gaze", "type": "action", "traits": ["emotion", "incapacitation", "mental", "primal", "visual"], "cost": 1, "text": "When a defaced naiad queen fixes her gaze upon a foe within range of her nymph's tragedy aura, the creature must attempt a Will save. On a failure, it is affected as if by nymph's tragedy; if it was already affected by that aura, it also takes 8d6 mental damage (16d6 on a critical failure). A defaced naiad queen can use Baleful Gaze on a given creature only once per turn.