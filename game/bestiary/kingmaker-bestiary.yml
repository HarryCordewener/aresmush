  actions: [{"name": "Shame", "type": "passive", "traits": [], "text": "Nyrissa is focused on her goal to conquer the final kingdom she promised the Lantern King, but she still suffers from shame when she attacks anyone who wields Briar or any character who rules a kingdom (particularly, any PC who serves as Ruler). Forgive Foe can be attempted against Nyrissa with a DC 51 Diplomacy check or DC 51 Performance check. If Nyrissa is affected by a critical success from Forgive Foe, she calls for a truce to speak to the PCs."}, {"name": "Wild Empathy", "type": "passive", "traits": [], "text": "Nyrissa can use Diplomacy to make-an-impression on and make very simple Requests of animals and plant creatures."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Blinding Beauty", "type": "passive", "traits": ["aura", "emotion", "mental", "primal", "visual"], "text": "30 feet. Creatures that start their turn in the aura must succeed at a DC 43 Will save or be permanently Blinded (plus Stunned 3 on a critical failure)."}, {"name": "Evasion", "type": "passive", "traits": [], "text": "When Nyrissa rolls a success on a Reflex save, she gets a critical success instead."}, {"name": "Protection from Decapitation", "type": "passive", "traits": [], "text": "The first time Nyrissa is decapitated by any effect (including a vorpal weapon like Briar ), the effect is negated. She takes no damage from the attack and is not decapitated, but she then loses her protection from decapitation for 24 hours."}, {"name": "Change Shape", "type": "action", "traits": ["polymorph", "primal"], "cost": 1, "text": "Nymph queens can transform between their original form, which looks much like a typical nymph of their kind, and any Small or Medium humanoid form, typically choosing a more humanoid-looking version of their natural form."}, {"name": "Contingency", "type": "reaction", "traits": [], "text": "Trigger Nyrissa is damaged by a melee strike%rEffect Mislead activates on Nyrissa."}, {"name": "Focus Beauty", "type": "action", "traits": ["emotion", "mental", "primal", "visual"], "cost": 1, "text": "Nyrissa focuses her beauty upon a target within her blinding beauty aura. The creature takes 6d12 mental damage (DC 46 Will) and is Blinded until the end of their next turn (12d12 mental damage and permanent blindness on a critical failure). Nyrissa can Focus Beauty on a given creature only once per turn."}, {"name": "Inspiration", "type": "action", "traits": ["emotion", "mental", "primal"], "cost": 3, "text": "Nyrissa can inspire an intelligent, willing creature by scratching that creature with a thorn from her body. This reduces that creature's Hit Points by 1 permanently, but grants the creature several abilities: Darkvision, the ability to see Invisible creatures, and an ability boost to an ability of Nyrissa's choice. A bard granted this inspiration gains a +2 status bonus to Performance when determining the effect of compositions. Only one creature at a time can benefit from this inspiration.…"}, {"name": "Quickened Casting", "type": "free", "traits": [], "text": "Frequency three times per day;%rRequirement Nyrissa hasn't used Quickened Casting since the start of her previous turn%rEffect If Nyrissa's next action is to cast an arcane spontaneous spell that is 8th level or lower, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Switch Fables", "type": "action", "traits": ["move", "primal", "teleportation"], "cost": 1, "text": "Requirement Nyrissa is located in the twenty-foot diameter central area of one of the four Fables (areas M7a- M7d of the House at the Edge of Time)%rFrequency once per minute%rEffect Nyrissa Strides a minimum distance of ten feet, after which the reality of the demiplane folds around her in a tangle of vines and flowers. She then teleports from her current Fable to one of the other three of her choice, appearing in a square of her choosing within the central twenty feet of the chosen Fable."}]
