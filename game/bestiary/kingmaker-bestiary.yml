  actions: [{"name": "Site Bound", "type": "passive", "traits": [], "text": "A typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence and sets right whatever prevents the spirit from resting."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Shyka's Judgement", "type": "action", "traits": ["mental", "primal"], "cost": 2, "text": "Xae clasps her hands together and cries out in Sylvan for Shyka to judge those who dare intrude upon the shrine-\"Aid me, Shyka, so that your shrine will remain undefiled!\" The seven statues around the perimeter of the room suddenly animate and hurl spectral versions of their hourglass-headed maces into the room, filling area A3 with a whirling vortex of pale blue-and-white energy. All living creatures in area A3 must attempt a DC 30 Will save. Xae cannot call upon Shyka's Judgment for 1d4…"}, {"name": "Twist Time", "type": "action", "traits": ["primal"], "cost": 2, "text": "Xae attempts a ghostly hand strike. If she hits, she inflicts damage as normal, but the target struck must also attempt a DC 30 Fortitude save (the target takes a -2 penalty to this saving throw if the strike was a critical hit).%rCritical Success The creature is unaffected.%rSuccess The creature is Slowed 1 for 1 round as the rest of reality seems to speed up.%rFailure The creature becomes decrepit from unnatural aging. It is Slowed 2, and as long as it has the slowed condition, it is…"}]
