  actions: [{"name": "Greensight", "type": "passive", "traits": [], "text": "The wild hunt archer ignores the Concealed condition from leaves and other foliage."}, {"name": "Planar Acclimation", "type": "passive", "traits": [], "text": "The wild hunt archer treats the plane it is located on as its home plane."}, {"name": "Wild Hunt Link", "type": "passive", "traits": ["aura", "magical"], "text": "500 feet. A wild hunt archer grants wild hunt other than archers the ability to target Concealed creatures with ranged Strikes without having to succeed at a DC 5 flat check."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Instinctive Cooperation", "type": "passive", "traits": [], "text": "The wild hunt archer automatically achieves a critical success on saving throws against effects created by other allied wild hunt creatures."}, {"name": "Wild Gaze", "type": "passive", "traits": ["aura", "fear", "incapacitation", "mental", "primal", "visual"], "text": "30 feet. Those who meet the gaze of a wild hunt archer come face-to-face with the hunt's fearful power and find it difficult to act in the face of such a legendary legacy. When a creature ends its turn in the aura, it must succeed at a DC 34 Will save to resist becoming Slowed 1 (Slowed 2 on a critical failure). The wild hunt archer can deactivate or activate this aura by using a single action, which has the concentrate trait."}, {"name": "Focus Gaze", "type": "action", "traits": ["concentrate", "fear", "incapacitation", "mental", "primal", "visual"], "cost": 1, "text": "The wild hunt archer fixes its glare at a creature it can see within 30 feet. The target must immediately attempt a Will save against the wild hunt hound's wild gaze. If the creature was already slowed by the wild gaze before attempting its save, a failed save causes it to be Paralyzed for 1 round. After attempting its save, the creature is temporarily immune to Focus Gaze from any wild hunt until the start of the wild hunt archer's next turn."}, {"name": "Infuse Arrow", "type": "action", "traits": ["magical"], "cost": 3, "text": "The wild hunt archer Casts a Spell with a range of touch and then makes a ranged Strike with their living bow. If they hit a creature with that Strike, that creature is also targeted by the spell's effects. If the Strike misses, the spell is wasted.%rAlternatively, the wild hunt archer can Cast a Spell that affects an area and then make a ranged Strike with their living bow. If they hit a creature with that Strike, the spell takes effect centered on that creature, and the creature struck takes…"}, {"name": "Living Bow", "type": "passive", "traits": ["primal"], "text": "The wild hunt archer carries a manifestation of their archery in the form of a living bow. This weapon functions as a +2 greater striking frost composite longbow as long as it is wielded by the wild hunt archer, but in any other creature's hands the living bow functions as a normal, nonmagic composite longbow. A wild hunt archer can manifest a replacement living bow if its previous one is lost or destroyed by performing a one-minute activity that has the concentrate trait. A living bow appears…"}, {"name": "Seeking Shots", "type": "passive", "traits": [], "text": "The wild hunt archer's ranged Strikes and spells with ranged attack rolls ignore their target's Concealed condition."}]
