  resistances: {"acid": 10, "poison": 10}
  strikes: [{"name": "Vulture Beak", "bonus": 23, "damage": [["2d8+11", "slashing", null], ["1d8", "bleed", null]], "traits": []}, {"name": "Snake Fangs", "bonus": 23, "damage": [["2d12+11", "piercing", null]], "traits": [], "effects": ["Bloom Venom"]}, {"name": "Centipede Mandibles", "bonus": 23, "damage": [["2d6", "acid", null], ["2d6+11", "piercing", null]], "traits": []}, {"name": "Claw", "bonus": 23, "damage": [["2d8+11", "slashing", null]], "traits": ["agile", "unarmed"]}]
  actions: [{"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Life Bloom", "type": "passive", "traits": ["death", "primal"], "text": "When Akuzhail dies, its body explodes in a riot of seething vegetation and raw life. All living creatures within a 60-foot radius are restored 12d6 healing Hit Points from this energy. A fully grown bloom of Lamashtu emerges from the carcass, but it can take no actions on this round. Next round, this bloom of Lamashtu enters combat at the same point in the turn during which Akuzhail perished on the previous round, but the bloom is Slowed 1. At the end of the bloom's turn, it attempts a DC 11…"}, {"name": "Of Three Minds", "type": "reaction", "traits": [], "text": "Trigger Akuzhail fails or critically fails a Will save%rEffect Akuzhail rerolls the Will save with a -4 penalty. If it fails this second save, it may make a third attempt but with a -8 penalty. It cannot make a third attempt if its second attempt was a critical failure."}, {"name": "Three Headed", "type": "passive", "traits": [], "text": "Any ability that would sever a chimera's head (such as a critical hit with a Vorpal Weapon ) severs one head at random. Losing a head doesn't kill a chimera (as long as it has one head left), but it does prevent it from making Strikes with the lost head or using the head's Breath Weapon."}, {"name": "Triple Opportunity", "type": "passive", "traits": [], "text": "A chimera gains 2 extra reactions each round that it can use only to make Attacks of Opportunity. It must use a different head for each reaction, and it can't use more than one on the same triggering action. If it loses one of its heads, it also loses one of these extra reactions."}, {"name": "Bloom Venom", "type": "passive", "traits": ["poison", "primal"], "text": "Saving Throw DC 29 Fortitude%rMaximum Duration 6 rounds%rStage 1 2d6 poison and Enfeebled 1%rStage 2 2d6 poison and Enfeebled 2%rStage 3 2d10 poison, enfeebled 2, and exposure to Lamashtu's bloom."}, {"name": "Breath Weapon", "type": "action", "traits": ["primal"], "cost": 2, "text": "Akuzhail breathes a 60-foot of venom from its snake mouth that deals 11d6 poison|options:area-damage damage (DC 29 Fortitude). Akuzhail can't use Breath Weapon for 1d4 rounds."}, {"name": "Frightening Rattle", "type": "action", "traits": ["emotion", "fear", "mental", "primal", "sonic"], "cost": 1, "text": "Akuzhail shakes the rattle at the end of its tail to distract and frighten its enemies. Any creature within 30 feet must succeed at a DC 29 Will save or become Frightened 1 (Frightened 2 on a critical failure). On a critical success, a creature is temporarily immune to Akuzhail's Frightening Rattle for 24 hours."}, {"name": "Lamashtu's Bloom", "type": "passive", "traits": ["curse", "disease", "magical"], "text": "While some NPCs become afflicted by Lamashtu's bloom curse during Parts 1 and 2 of this chapter, during Part 3 the PCs may be exposed to it as well. While the bloom is itself a curse, it functions mechanically more like a disease, and as such features both of these affliction traits. As long as the curse persists, a creature cannot recover from the disease, and removing the curse does not automatically remove the disease element of the affliction. Both elements must be dealt with individually…"}, {"name": "Three-Headed Strike", "type": "action", "traits": [], "cost": 2, "text": "Akuzhail makes a Strike with its vulture beak, snake fangs, and centipede mandibles, each at a -2 penalty and targeting a different creature. These Strikes count as only one attack for its multiple attack penalty, and the penalty doesn't increase until it has made all three attacks."}]
