ic weapon known as a monarch's glaive. This weapon functions as a +3 major striking greater thundering wounding glaive in the monarch's hands only. The monarch can call their glaive to their hands using this action, transporting it across any distance. If their glaive is destroyed, the monarch can create a new one by using Call Glaive as a three-action activity that gains the manipulate trait."}, {"name": "Call to the Hunt", "type": "action", "traits": ["manipulate", "primal", "teleportation"], "cost": 3, "text": "Frequency once per day%rEffect The wild hunt monarch blows their monarch's horn, causing two wild hunt scouts or four wild hunt archers part of the monarch's wild hunt link and no more than 1 mile from the monarch's location to appear as the monarch chooses at any point within 30 feet. They act immediately before the wild hunt monarch in initiative starting on the next round."}, {"name": "Focus Gaze", "type": "action", "traits": ["concentrate", "fear", "incapacitation", "mental", "primal", "visual"], "cost": 1, "text": "The wild hunt monarch fixes its glare at a creature it can see within 30 feet. The target must immediately attempt a Will save against the wild hunt hound's wild gaze. If the creature was already slowed by the wild gaze before attempting its save, a failed save causes it to be Paralyzed for 1 round. After attempting its save, the creature is temporarily immune to Focus Gaze from any wild hunt until the start of the wild hunt monarch's next turn."}, {"name": "Wild Reincarnation", "type": "reaction", "traits": ["primal"], "text": "Trigger The wild hunt monarch kills an adjacent non-fey creature.%rEffect The wild hunt monarch attempts to reincarnate the creature as a fey. The slain creature must attempt a DC 42 Fortitude save, and it takes a -2 status penalty to this save if it was under any enchantment effect placed by the monarch when it died.%rCritical Success The creature is instead restored to life as if via Raise Dead (heightened to 10th level), and it is permanently immune to Wild Reincarnation from that wild hunt…"}]
