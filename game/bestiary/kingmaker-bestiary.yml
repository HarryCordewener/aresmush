  actions: [{"name": "Unseen Sight", "type": "passive", "traits": [], "text": "The removal of the eyes symbolized a Thresholder's abandonment of all they had seen before, and with the ritual's completion they gain something greater than mere vision: they gain the Unseen Sight. This is a precise sense that mimics darkvision yet functions even if the eye sockets themselves are covered. More importantly, the unseen sight allows a Thresholder to see the truth of the world, granting them the ability to see things as they actually are as if they were under the effects of…"}, {"name": "Evasion", "type": "passive", "traits": [], "text": "When the disciple rolls a success on a Reflex save, they get a critical success instead."}, {"name": "Guarded Movement", "type": "passive", "traits": [], "text": "The disciple gains a +4 circumstance bonus to AC against reactions triggered by their movement."}, {"name": "Outside of Time", "type": "passive", "traits": [], "text": "The Thresholder Disciple exists outside of time; they don't age, don't need food or drink to survive, and can't be Quickened or Slowed unless they choose to be."}, {"name": "Flurry of Blows", "type": "action", "traits": ["flourish"], "cost": 1, "text": "Frequency Once per turn%rEffect The disciple makes two unarmed Strikes. If both hit the same creature, combine their damages for the purposes of resistances and weaknesses. The disciple's multiple attack penalty applies normally to these Strikes."}, {"name": "Lurker Stance", "type": "action", "traits": ["stance"], "cost": 1, "text": "The disciple takes the stance of the Lurker at the Threshold, full of menace and danger. The disciple can make lurker claw unarmed attacks. These deal 1d12 slashing damage; are in the brawling group; and have the parry, forceful, and unarmed traits. While in this stance, if the disciple succeeds or critically succeeds at a check to Demoralize a target, the target must succeed at a DC 34 Will saving throw or be Stupefied 1 (Stupefied 3 on a critical failure) for 1 minute."}, {"name": "Ominous Mien", "type": "action", "traits": [], "cost": 1, "text": "Requirements The disciple is in Lurker Stance%rEffect The disciple gains a +2 circumstance bonus to Intimidation checks and their Demoralize attempts don't take a penalty for not speaking the target's language and don't cause the target to become temporarily immune. These effects last until the end of the disciple's next turn."}, {"name": "Temporal Strikes", "type": "passive", "traits": [], "text": "The disciple's Strikes force the creature hit to endure a deluge of unfamiliar memories from a combination of past lives and parallel existences, causing an additional 3d6 mental damage with a successful hit."}]
