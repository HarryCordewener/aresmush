  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Fearsome Gaze", "type": "passive", "traits": ["concentrate", "divine", "emotion", "fear", "mental", "visual"], "text": "30 feet. When a creature ends its turn in the aura, it must attempt a DC 18 Will save.%rCritical Success The creature is unaffected and is temporarily immune for 24 hours.%rSuccess The creature is unaffected.%rFailure The creature becomes Frightened 1.%rCritical Failure The creature becomes Frightened 2."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "If Davik is reduced to 0 Hit Points, his bones and gear melt into water that runs back into the river or seeps into the ground, leaving nothing behind. The next night, he rises again from his original location in the rubble located downstream from the ruined ferry crossing. When he does, he is completely healed of all damage, but now his unholy anger is directed at those who previously destroyed him as well as at the Stag Lord. He can use Nightmare to threaten the one who destroyed him,…"}, {"name": "Rotting Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "10 feet. A creature entering the aura or starting their turn in the aura must succeed at a DC 18 Fortitude save or become Sickened 1 (plus Slowed 1 on a critical failure for as long as it's sickened). While within the aura, creatures also take a -2 circumstance penalty to saves against fear and to recover from the sickened condition. A creature that succeeds at its save is temporarily immune for 1 minute and does not take the penalty to saves against fear effects.%rEffect: Rotting Stench"}, {"name": "Focus Gaze", "type": "action", "traits": ["concentrate", "divine", "emotion", "fear", "mental", "visual"], "cost": 1, "text": "Davik fixes his glare at a creature he can see within 30 feet. The target must immediately attempt a Will save against Davik's Fearsome Gaze. On a failed save, if the target is already Frightened, the value of its frightened condition is increased by 1 (or by 2 on a critical failure). After attempting its save, the creature is then temporarily immune until the start of Davik's next turn"}, {"name": "Sure Possession", "type": "passive", "traits": [], "text": "As long as Davik Nettles continues to exist, his +1 ranseur cannot be taken from him. If disarmed of the +1 ranseur, if he drops it, or if it's destroyed, the ranseur melts into water; he can retrieve his +1 ranseur by pulling it out of any body of water as an Interact action. If Davik is put to rest permanently by fulfilling his quest, his +1 ranseur loses this ability and can be claimed by someone else."}]
