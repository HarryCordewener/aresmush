e the end of the brewer's next turn. The target is then immune to Pre-Programmed Greeting for 1 day."}, {"name": "Smokeside Sour", "type": "passive", "traits": ["ingested", "poison"], "text": "Saving Throw DC 12 Fortitude%rMaximum Duration 1 hour%rStage 1 Clumsy 1 (10 minutes)%rStage 2 clumsy 1 and Stupefied 1 (10 minutes)%rStage 3 Clumsy 2, Stupefied 2, and sickened (40 minutes)"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
