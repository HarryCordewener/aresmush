  actions: [{"name": "Wind-Up", "type": "passive", "traits": [], "text": "24 hours, DC 22 Thievery, standby%rFor a clockwork to act, it must be wound with a unique key by another creature. This takes 1 minute. Once wound, it remains operational for the listed amount of time, usually 24 hours, after which time it becomes unaware of its surroundings and can't act until it's wound again. Some clockworks' abilities require them to spend some of their remaining operational time. They can't spend more than they have and shut down immediately once they have 0 time…"}, {"name": "Clockwork Swarm", "type": "passive", "traits": ["aura"], "text": "30 feet. A cloud of flying, spiderlike clockworks surrounds the clockwork puppeteer. A creature that ends its turn in the cloud takes 4d8 piercing damage (DC 29 Reflex)."}, {"name": "Clockwork String", "type": "passive", "traits": [], "text": "Any creature hit by the puppeteer's string is Grabbed. The puppeteer can move while it has a creature grabbed with its string, but it automatically releases the creature if the puppeteer moves beyond the string's 60-foot length. The puppeteer can use up to six strings at a time. It can release any creature grabbed by a string as a free action. Each string has AC 30, and its Escape DC is 32. A string can be severed by a Strike that deals at least 20 slashing damage to it. This doesn't deal any…"}, {"name": "Create Puppet", "type": "reaction", "traits": ["arcane"], "text": "Trigger A creature Grabbed by the puppeteer's clockwork string dies%rEffect The triggering creature's body becomes infested with tiny clockworks. This puppet is fully under the clockwork puppeteer's control and has statistics identical to a zombie of its size with the following exceptions: It loses the undead trait, loses void healing, loses its weakness to vitality damage, and gains the construct trait."}, {"name": "Pull String", "type": "action", "traits": [], "cost": 1, "text": "The puppeteer reins in a creature Grabbed by its string. The puppeteer attempts an Athletics check against the creature's Fortitude DC. On a success, the puppeteer pulls the creature 15 feet closer to it (30 feet closer on a critical success)."}]
