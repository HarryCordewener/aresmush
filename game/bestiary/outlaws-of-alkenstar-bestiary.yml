  actions: [{"name": "Wind-Up", "type": "passive", "traits": [], "text": "24 hours, DC 26 Thievery, standby%rFor a clockwork to act, it must be wound with a unique key by another creature. This takes 1 minute. Once wound, it remains operational for the listed amount of time, usually 24 hours, after which time it becomes unaware of its surroundings and can't act until it's wound again. Some clockworks' abilities require them to spend some of their remaining operational time. They can't spend more than they have and shut down immediately once they have 0 time…"}, {"name": "Spell Reflection", "type": "reaction", "traits": ["arcane"], "text": "Trigger The glass buccaneer is targeted by a spell%rEffect The buccaneer positions its reflective magical surfaces to turn the spell back on the caster. It tries to counteract the spell, making an Athletics check for its counteract check. If it successfully counteracts the spell, the effect is turned back on the caster."}, {"name": "Vulnerable to Shatter", "type": "passive", "traits": [], "text": "The glass buccaneer is affected by the Shatter spell as though it were an unattended object."}, {"name": "Firearms Critical Specialization", "type": "passive", "traits": [], "text": "When the buccaneer makes a critical hit with a firearm, the target must succeed at a DC 28 Fortitude save or be Stunned 1."}, {"name": "Pirate's Feint", "type": "action", "traits": ["mental"], "cost": 1, "text": "The clockwork buccaneer Feints. If the target becomes Off-Guard to the buccaneer's melee attacks, it becomes off-guard to the buccaneer's ranged attacks as well."}, {"name": "Refill Tank", "type": "action", "traits": [], "cost": 1, "text": "Requirements The clockwork buccaneer is within 15 feet of a water source containing at least 100 gallons of water%rEffect The clockwork buccaneer extends a clockwork tube and sucks up water to refill its water tank."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The clockwork buccaneer deals an extra 2d6 precision damage to Off-Guard creatures."}, {"name": "Water Jet", "type": "action", "traits": [], "cost": 1, "text": "Requirements The clockwork buccaneer has a full water tank%rEffect The clockwork buccaneer fires a narrow but highly pressurized blast of water in a 60-foot, dealing 10d6 bludgeoning|options:area-damage damage to creatures and unattended objects in the area (DC 28 Fortitude; unattended objects automatically fail). Creatures and objects that fail the save are also knocked back 5 feet (10 feet on a critical failure). This empties the buccaneer's water tank."}, {"name": "Water Jump", "type": "action", "traits": [], "cost": 1, "text": "Requirements The clockwork buccaneer has a full water tank%rEffect The clockwork buccaneer jumps 60 feet, propelling itself through the air with a jet of water. This empties the buccaneer's water tank."}]
