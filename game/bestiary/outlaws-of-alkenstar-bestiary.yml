  actions: [{"name": "Misaligned Gears", "type": "passive", "traits": [], "text": "The spiral centurion loses access to its Rev Up ability, and if it Strides more than once per round, it takes 1d10 untyped damage per Stride after the first."}, {"name": "Top-Heavy", "type": "passive", "traits": [], "text": "A spiral centurion's top-like design makes it susceptible to effects that would cause it to fall prone. The DC of any attempt to knock the spiral centurion Prone is reduced by 5. If the spiral centurion attempts a check or saving throw to resist being knocked prone, it takes a -5 status penalty. A spiral centurion that has been knocked prone can't use any actions other than to attempt to Stand, but it must succeed at a DC 30 Acrobatics check to do so."}, {"name": "Hurl Blade", "type": "action", "traits": [], "cost": 2, "text": "The spiral centurion hurls one of its blades with an angled spin to ensure a swooping flight path. The blade deals 6d6 slashing|options:area-damage damage to each creature in a 40-foot (DC 30 Reflex save).%rAt the start of the spiral centurion's next turn, the blade swoops around and returns along the same flight path, again dealing 6d6 slashing damage (DC 30 basic Reflex save) to each creature along the same line."}, {"name": "Reload Guns", "type": "action", "traits": [], "cost": 1, "text": "The spiral centurion loads ammo into its many guns."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Medium or smaller, blade, DC 30 Reflex"}, {"name": "Whirling Death", "type": "action", "traits": [], "cost": 3, "text": "The spiral centurion spins furiously in place, its blades extended to slice through nearby creatures. It makes up to five melee blade Strikes. No single creature can be targeted by more than one blade Strike during one use of this ability. These attacks count toward the spiral centurion's multiple attack penalty, but the multiple attack penalty doesn't increase until after all the attacks are made."}, {"name"