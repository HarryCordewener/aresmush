  actions: [{"name": "Breathsense (Precise) 60 feet", "type": "passive", "traits": [], "text": "Hong Meigui can't perceive living creatures beyond 5 feet except with breathsense; a living creature that holds its breath is Invisible to her as long as it holds its breath."}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Jiang-Shi Vulnerabilities", "type": "passive", "traits": [], "text": "All jiang-shi possess the following vulnerabilities.%rRevulsion A jiang-shi can't voluntarily come within 10 feet of a brandished mirror or the sound of ringing handbells. A creature can Interact with a mirror or handbell to brandish or ring the item for 1 round (similar to Raising a Shield). If the jiang-shi involuntarily comes within 10 feet of an object of their revulsion, they gain the Fleeing condition, running from the object of their revulsion until they are 10 feet or farther from the…"}, {"name": "One More Breath", "type": "passive", "traits": ["divine", "void"], "text": "Hong Meigui isn't destroyed at 0 HP; instead, she falls Unconscious and awakens in 1 minute with 1 Hit Point. Scattering at least 1 Bulk of glutinous rice or hen eggs on her while she's unconscious in this way destroys her permanently, as will any attack from a weapon made of duskwood or peachwood."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Warped Fulu", "type": "passive", "traits": [], "text": "The corrupted fulu attached to Hong Meigui's brow makes her immune to spells cast from a magic item without expending a spell slot, such as from a scroll or wand. A creature can Steal the warped fulu, rolling against her Perception DC of 30. This ends her immunity to these effects. If a creature then destroys the warped fulu with an Interact action, Hong Meigui also loses her fast healing. She can create a replacement warped fulu by spending 1 uninterrupted hour inscribing a strip of paper with…"}, {"name": "Drain Qi", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within Hong Meigui's reach%rEffect Hong Meigui drains the victim's life energy through their breath. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions. The victim is Drained 1 and Hong Meigui regains 12 HP, gaining any excess as temporary HP. Draining qi from a creature that's already drained doesn't restore any HP but…"}, {"name": "Rigor Mortis", "type": "passive", "traits": [], "text": "Hong Meigui's hopping movement lets her ignore difficult terrain and effects that would render her Prone. She can't take the Drop Prone action, and when she Leaps, she doesn't trigger reactions normally triggered by movement."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
