  actions: [{"name": "Telepathy 30 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "No Face", "type": "passive", "traits": [], "text": "Noppera-bos have no sense of vision, but their sense of hearing is precise. They don't breathe and are immune to effects that require breathing. They gain sustenance by absorbing fluids through their skin—traditionally by immersing their hands or faceless head into the fluid to \"drink\" through osmosis; they can also benefit from consumables, such as potions or elixirs, in this way."}, {"name": "Identity Crisis", "type": "reaction", "traits": ["emotion", "mental", "occult", "visual"], "text": "Frequency once per day%rTrigger Zoudou successfully Steals the Face of an adjacent creature%rEffect As Zoudou Steals the creature's Face, she telepathically draws at the creature's sense of identity and self. The creature must attempt a DC 20 Will save. On a failure, the creature questions their own identity and becomes Slowed 1 for 1 round. On a critical failure, they're slowed 1 for 1 minute."}, {"name": "Oath of Anonymity", "type": "passive", "traits": [], "text": "When Zoudou has a face, she can't cast divine prepared spells."}, {"name": "Sensitive Hearing", "type": "passive", "traits": [], "text": "As long as a noppera-bo is Deafened, they are Slowed 1."}, {"name": "Impersonate Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 2, "text": "The noppera-bo changes into a version of a Small or Medium humanoid they've touched during the last 24 hours, and gains the target creature's face and voice. While transformed, the noppera-bo gains a +2 circumstance bonus to impersonate that creature and loses its no face ability and listed immunities. The noppera-bo can change back by using this ability again."}, {"name": "Regain Anonymity", "type": "action", "traits": ["occult", "polymorph"], "cost": 1, "text": "Requirements Zoudou has a face%rEffect Zoudou causes the face she's wearing to melt away like running wax and gains 3d6 temporary Hit Points. She can't Regain Anonymity again for 1d4 rounds."}, {"name": "Silent Casting", "type": "passive", "traits": [], "text": "When Zoudou is faceless, she can substitute an additional manipulate component for a concentrate component."}, {"name": "Steal Face", "type": "action", "traits": ["concentrate", "curse", "incapacitation", "occult", "polymorph"], "cost": 2, "text": "Frequency once per day%rRequirements Zoudou is faceless%rEffect Zoudou targets one creature within 30 feet. The creature must attempt a DC 20 Fortitude save.%rCritical Success The target is unaffected.%rSuccess The target is Dazzled until the start of its next turn.%rFailure The noppera-bo gains the target's face. The target's face vanishes until the end of its next turn. Until then, it is Blinded, can't speak or ingest, and can't smell. The target must also hold its breath or begin to…"}]
