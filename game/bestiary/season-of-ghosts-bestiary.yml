  actions: [{"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Brawling Critical", "type": "passive", "traits": [], "text": "When a monk of Kugaptee scores a critical hit with a fist Strike or a weapon with the monk trait, the target must succeed at a DC 24 Fortitude save or be Slowed 1 until the end of the monk's next turn."}, {"name": "Sagebane", "type": "passive", "traits": ["occult"], "text": "When the monk of Kugaptee damages a living creature with a fist Strike or a weapon with the monk trait, the target must succeed at a DC 24 Fortitude save or become Stupefied 1 for 1 minute.%rFurther damage dealt by the monk of Kugaptee resets the duration to 1 minute and increases the stupefied value by 1 on a failed save, to a maximum of stupefied 4."}, {"name": "Scarlet Apoxia", "type": "passive", "traits": ["disease", "occult"], "text": "The target can't recover from the Fatigued condition caused by scarlet apoxia until the disease is cured%rSaving Throw DC 24 Fortitude%rStage 1 carrier with no ill effect (1 day)%rStage 2 Drained 1 and fatigued (1 day)%rStage 3 Drained 2 and fatigued (1 day)%rStage 4 dead (a creature that dies of scarlet apoxia reincarnates as a nindoru of equal or lower level 24 hours after death unless the body is given a proper funeral; once reincarnation occurs, the dead creature can't be restored to its…"}, {"name": "Steal Breath", "type": "action", "traits": ["incapacitation", "occult"], "cost": 2, "text": "Requirements The monk of Kugaptee is adjacent to a living creature that's Paralyzed, Slowed, Stunned, or Unconscious%rEffect The monk of Kugaptee leans over and sucks the breath from the target, who must attempt a DC 22 Fortitude save. Regardless of the result, the creature is exposed to scarlet apoxia and its breath reeks of rotting wildflowers for 1 minute.%rCritical Success The creature is unaffected.%rSuccess The creature can't speak for 1 minute.%rFailure The creature becomes Sickened 2…"}, {"name": "Stunning Flurry", "ty