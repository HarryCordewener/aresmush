  actions: [{"name": "Soul Shred", "type": "passive", "traits": [], "text": "Creatures killed by a guhdggi are difficult to bring back to life or animate as undead. The guhdggi automatically attempts to counteract any attempt to resurrect or animate any creature that they've killed (counteract modifier +13, counteract rank 3). If the guhdggi who slew the creature is slain, the creature can be brought back from death or become undead normally."}, {"name": "Belch Butterflies", "type": "action", "traits": ["occult"], "cost": 2, "text": "The guhdggi opens both of their mouths and, from their innermost humanoid mouth, belches forth a blast of red butterflies in a 15-foot. All creatures in the area must attempt a DC 22 Reflex save as the hideous insects' razor sharp wings and tiny claws slash and cut away at exposed flesh.%rThe guhdggi can't Belch Butterflies again for 1d4 rounds.%rCritical Success The creature takes no damage from the butterflies.%rSuccess The creature takes 2d6 slashing|options:area-damage damage from the…"}, {"name": "Cage Prey", "type": "action", "traits": ["attack"], "cost": 1, "text": "Requirements The guhdggi has grappled a Medium or smaller creature with their hair lash and doesn't have a creature caged%rEffect The guhdggi attempts an Athletics check against the Grabbed creature's Reflex DC. If they succeed, they place the creature into the cage they carry on their back. The guhdggi's hair lash no longer grapples the creature, and they can't attack a creature in their cage.%rThe caged creature is grabbed. It takes (2d4+6) mental damage when first caged and at the end of…"}, {"name": "Lurching Skewer", "type": "action", "traits": [], "cost": 2, "text": "The guhdggi Strides, then makes two spear Strikes, one with each of the two spears they wield. Both Strikes must have the same target. Apply the guhdggi's multiple attack penalty to each Strike normally."}, {"name": "Manifest Tool", "type": "action", "traits": ["concentrate", "occult"], "cost": 2, "text": "Frequency once per hour%rEffect The guhdggi manifests a tool from their thoughts. If their next action is to attempt a skill check that could be affected by the tool they chose, they gain a +2 item bonus to the skill check. The tool is then destroyed."}, {"name": "Ruin Wielder", "type": "passive", "traits": [], "text": "When a guhdggi wields a broken non-magical weapon (typically two spears), they don't take any of the disadvantages of the weapon being broken. While the guhdggi wields it, the weapon becomes a +1 striking weapon that deals an additional 1d6 mental damage on a successful hit."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
