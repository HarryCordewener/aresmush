  actions: [{"name": "Soul Shred", "type": "passive", "traits": [], "text": "Creatures killed by a sojiruh are difficult to bring back to life or animate as undead. The sojiruh automatically attempts to counteract any attempt to resurrect or animate any creature that they've killed (counteract modifier +11, counteract rank 2). If the sojiruh who slew the creature is slain, the creature can be brought back from death or become undead normally."}, {"name": "Manifest Armor", "type": "action", "traits": ["concentrate", "occult"], "cost": 2, "text": "The sojiruh manifests a layer of armor on their body that appears to be made of interlocking bones, clinging red butterflies, and wicker weaves, increasing their AC to 21. The armor is permanent but collapses and vanishes if the sojiruh takes a critical hit from a Strike that inflicts bludgeoning, force, or slashing damage, reducing their AC back to 17."}, {"name": "Ruin Wielder", "type": "passive", "traits": [], "text": "When a sojiruh wields a broken non-magical weapon, they don't take any of the disadvantages of the weapon being broken. While the sojiruh wields it, the weapon becomes a +1 weapon that deals an additional 1d6 mental damage on a successful hit."}, {"name": "Stolen Scream", "type": "action", "traits": ["auditory", "emotion", "fear", "mental", "occult"], "cost": 2, "text": "The sojiruh targets a creature within 30 feet that they can see and then inhales, creating a sound identical to that of the target's scream. The targeted creature must attempt a DC 21 Fortitude save, after which it's temporarily immune to that sojiruh's Stolen Scream for 24 hours. If the creature becomes frightened as a result of Stolen Scream and has had a past life, the sojiruh regains (2d8+8) healing Hit Points.%rCritical Success The creature is unaffected.%rSuccess The creature takes 2d6…"}]
