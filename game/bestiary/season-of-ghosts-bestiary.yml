  actions: [{"name": "Distracting Giggle", "type": "passive", "traits": ["auditory", "aura", "emotion", "mental", "occult"], "text": "15 feet. The thatchling's giggle echoes in the back of the mind. Creatures within the aura take a –1 status penalty to Will saves."}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a thatchling is destroyed by damage other than fire, it attempts a DC 11 Flat. On a success, it reforms after 2d4 days within 120 feet of where it was destroyed, fully healed. A thatchling is always permanently destroyed if reduced to 0 Hit Points by fire damage or if the obstacle preventing the soul from reincarnating is removed."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Create Thatchling Spawn", "type": "passive", "traits": ["occult"], "text": "A living humanoid who's slain by a red-hooded thatchling while under the effects of Thatchling's Curse rises as a thatchling after 1d4 rounds. This spawn is under the command of the red-hooded thatchling that killed it. If a red-hooded thatchling controls too many at once (as determined by the GM), some thatchlings can free themselves with a DC 18 Will saving throw at the start of their turn. If the red-hooded thatchling who created the spawn is destroyed, the spawn becomes an autonomous…"}, {"name": "Howl of Vengeful Fury", "type": "action", "traits": ["occult", "sonic"], "cost": 2, "text": "Frequency once per hour%rEffect The red-hooded thatchling sobs pitifully before unleashing a terrifying scream. All non-thatchling creatures within a 30-foot emanation take 2d10 sonic|options:area-damage damage (DC 18 Fortitude save) and become immune to all thatchlings' distracting giggle for 1 minute. Thatchlings in the area gain 5 temporary Hit Points and a +1 status bonus to their Strikes and saving throws for 1 minute.%rEffect: Howl of Vengeful Fury"}, {"name": "Thatchling's Curse", "type": "action", "traits": ["curse", "mental", "occult"], "cost": 2, "text": "The thatchling focuses their attention on a single target within 30 feet that they can see, and then begins muttering and whispering nonsense. The target must attempt a DC 18 Will save.%rCritical Success The target is unaffected and is temporarily immune to Thatchling's Curse for 24 hours.%rSuccess The target is momentarily disoriented and has difficulty moving in the right direction. The target takes a –5-foot status penalty to its Speeds for 1 round.%rEffect: Thatchling's Curse…"}, {"name": "Thicket Walker", "type": "passive", "traits": [], "text": "Thatchlings ignore difficult terrain caused by brambles, fallen buildings, ruined structures, tangled grass, and undergrowth."}]
