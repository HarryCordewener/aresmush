  actions: [{"name": "Chastise Heretic", "type": "reaction", "traits": [], "text": "Trigger A creature within 60 feet that Xin Yue can see casts a divine spell%rEffect Xin Yue attempts to counteract the triggering spell using her spell attack modifier with a counteract rank of 4. If the spell is counteracted, the caster takes 1d10 persistent mental damage. If Xin Yue fails to counteract the spell, the caster is temporarily immune to further uses of this ability for 24 hours."}, {"name": "Field of Past Regrets", "type": "passive", "traits": ["aura", "divine"], "text": "40 feet. All creatures within the aura who have at least one past life (including all PCs in the Adventure Path) recall failures in their past lives and are bolstered against repeating them, gaining a +1 status bonus to saving throws against mental effects. Living, non-nindoru creatures within the aura also feel the pain of all their past lives, as well as their own current pain when they endure mental attacks, and gain weakness 3 to mental damage."}, {"name": "Profane Reincarnation", "type": "free", "traits": [], "text": "Frequency once every 1,000 days%rTrigger Xin Yue is reduced to 0 Hit Points%rEffect Xin Yue utters a shriek as her undead body splits open and her shortsword becomes broken. She's instantly reincarnated as a Sojiruh nindoru with the elite creature adjustment."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Near-Death Experience", "type": "reaction", "traits": ["divine", "emotion", "mental"], "text": "Trigger Xin Yue reduces a creature to 0 Hit Points and causes it to gain the dying condition%rEffect Time appears to slow down to the dying creature as the immense stress of its near-death experience pushes its brain into overdrive. The creature sees its life flash before its eyes, and the urge to resist death grows strong. The creature reduces the DC of its recovery checks by 2, but if it loses the dying condition, it must attempt a DC 25 Will save.%rEffect: Near-Death Experience%rCritical…"}]
