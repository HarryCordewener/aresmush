  actions: [{"name": "Defensive Training", "type": "passive", "traits": [], "text": "The mercenary enforcer gains an additional reaction at the start of their turn but can only use this reaction to Shield Block."}, {"name": "Fearful of Ghosts", "type": "passive", "traits": [], "text": "All this talk about haunted ruins has the mercenary enforcers at Karahai on edge. At the start of any combat against the PCs while Karahai's Terror Point threshold is at least 2, a mercenary enforcer must succeed at a DC 20 Will save or become Frightened 1 (or Frightened 2 on a critical failure). Once Karahai's Terror Point threshold is 7 or higher, a mercenary enforcer also becomes Fleeing whenever they become frightened."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Shield Block", "type": "reaction", "traits": []}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "A mercenary enforcer deals 1d6 extra precision damage to creatures who are Off-Guard."}]
