  actions: [{"name": "Drink Oil", "type": "reaction", "traits": [], "text": "Trigger Mo Douqiu is the target of an alchemical bomb Strike%rRequirements Mo Douqiu is aware of the attack and is not Off-Guard to it%rEffect Mo Douqiu attempts to catch the flung bomb in his mouth. He gains a +4 circumstance bonus to his AC against the triggering attack. If the attack misses, he catches the bomb in his mouth and harmlessly drinks down its contents down, regaining Hit Points equal to the bomb's item level."}, {"name": "Reactive Strike (Jaws Only)", "type": "reaction", "traits": []}, {"name": "Drop Corpse", "type": "action", "traits": [], "cost": 1, "text": "Requirements A hanging corpse is within reach of Mo Douqiu's jaws Strike%rEffect Mo Douqiu chomps onto a rope dangling a dead body and bites through it, causing the body to fall to the ground in the square directly below. A creature in that space takes (1d6+3) bludgeoning damage (DC 15 Reflex save), and is knocked Prone on a failure or critical failure."}, {"name": "Extend Neck", "type": "action", "traits": [], "cost": 1, "text": "The rokurokubi extends their neck, increasing the reach of their jaws Strike from 10 feet to 20 feet until the end of their next turn."}, {"name": "Threatening Lunge", "type": "action", "traits": [], "cost": 2, "text": "Requirements Mo Douqiu's neck is not currently extended%rEffect Mo Douqiu's head comes within an inch of his target's face before striking. He Extends his Neck, attempts to demoralize one opponent within 20 feet, and then makes a jaws Strike against that opponent. His Demoralize check is a visual rather than auditory effect, and he doesn't take a penalty if the target doesn't understand his language."}]
