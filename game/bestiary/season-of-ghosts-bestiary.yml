  actions: [{"name": "Soul Shred", "type": "passive", "traits": [], "text": "Creatures killed by a meokdan are difficult to bring back to life or animate as undead. The meokdan automatically attempts to counteract any attempt to resurrect or animate any creature that they've killed (counteract modifier +7, counteract rank 2). If the meokdan who slew the creature is slain, the creature can be brought back from death or become undead normally."}, {"name": "Manifest Bone Club", "type": "action", "traits": ["concentrate", "occult"], "cost": 1, "text": "Requirements The meokdan isn't carrying a bone club%rEffect The meokdan reaches down their throat into their stomach and pulls out a human femur that they can wield as a bone club. After the meokdan Strikes a creature, the bone club shatters, but its sharp fragments remain in roughly the same shape; Strikes with a shattered bone club inflict slashing and persistent bleed damage. After the meokdan Strikes with a shattered bone club, or if the meokdan drops the bone club, the club is destroyed,…"}, {"name": "Quick Snack", "type": "reaction", "traits": [], "text": "Trigger The meokdan critically hits a living creature with their bite%rEffect The meokdan Snacks on the creature."}, {"name": "Snack", "type": "action", "traits": ["attack"], "cost": 2, "text": "The meokdan attempts a bite Strike against an adjacent creature or chews on a handheld object the creature is carrying. If the creature is living or the object is food, the meokdan gurgles in delight and regains (1d8+8) healing Hit Points. If the creature is undead or a construct, or the object is inedible, the meokdan shrieks in frustration and gains a +1 status bonus to attack rolls and saving throws until the end of their next turn. The meokdan can't Snack again for 1 round.%rEffect: Snack"}]
