  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Universal Language", "type": "passive", "traits": [], "text": "Anything spoken by the brainchild is perceived by the listener in its native language."}, {"name": "Urban Legend", "type": "passive", "traits": [], "text": "A brainchild is sustained only by the reputation that precedes them. Mindless creatures are immune to a brainchild and can't perceive them.%rThe brainchild's size, features, and items, as well as the appearance of their attacks, match what the foes perceiving them expect. If foes expect to see different things, the brainchild chooses which to manifest. If any creature that can perceive the brainchild believes the brainchild has one of the abilities below, the brainchild has that ability.%rA…"}, {"name": "Fear of Flutes", "type": "passive", "traits": [], "text": "The first time in any round when someone plays a flute within 30 feet of Heh Shan-Bao, he must attempt a Will save against the flute player's Performance DC. This DC increases by 4 if the flute player is someone (at the GM's discretion) who's strongly religious.%rCritical Success Heh Shan-Bao is unaffected.%rSuccess Heh Shan-Bao becomes Frightened 1.%rFailure Heh Shan-Bao becomes Frightened 2.%rCritical Failure Heh Shan-Bao becomes Frightened 3 and is Fleeing until the end of his next turn."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "100 feet. DC 30 Will"}, {"name": "Persistence of Memory", "type": "passive", "traits": ["illusion", "mental", "occult"], "text": "When a brainchild is destroyed, it returns if anyone still fully believes it exists, re-forming within 100 feet of any believer after 2d4 days."}, {"name": "Steal Soul", "type": "reaction", "traits": ["death", "occult"], "text": "Trigger Heh Shan-Bao casts phantasmal calamity, spirit blast, or vision of death%rEffect If the triggering spell kills a 10th-leve