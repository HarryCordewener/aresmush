  actions: [{"name": "Acolyte's Defense", "type": "reaction", "traits": ["attack", "move"], "text": "Trigger A creature within sight of the algriever damages, desecrates, or defiles their bonded shrine%rRequirements The algriever is bonded with a shrine%rEffect The algriever Strides toward the creature; this movement doesn't trigger reactions. The algriever marks the creature as their enemy and gains a +2 status bonus to attack rolls against that enemy until they select a new enemy with Acolyte's Defense."}, {"name": "Shrine Bond", "type": "passive", "traits": [], "text": "The algriever bonds with a shrine after they spend 24 hours at the site. While bonded, the algriever gains a +2 circumstance bonus to Perception checks and skill checks."}, {"name": "Algriever Venom", "type": "passive", "traits": ["mental", "poison"], "text": "Saving Throw DC 28 Will%rMaximum Duration 6 rounds%rStage 1 2d6 mental damage%rStage 2 2d6 mental damage and Stupefied 1%rStage 3 2d6 mental damage and Stupefied 2"}, {"name": "Pilgrim's Ward", "type": "action", "traits": ["divine"], "cost": 2, "text": "Frequency once per month%rEffect The algriever touches a willing creature and fills it with reverence for their bonded shrine. As long as the target creature obeys the edicts and anathemas of the algriever's bonded shrine, or until that algriever grants Pilgrim's Ward to a different creature, that creature gains a +1 status bonus to all Religion checks and Will saves.%rEffect: Pilgrim's Ward"}, {"name": "Web Trap", "type": "passive", "traits": [], "text": "A creature hit by an algriever's web Strike is Immobilized and stuck to the nearest surface until it Escapes."}]
