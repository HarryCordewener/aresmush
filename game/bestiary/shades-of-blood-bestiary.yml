  strikes: [{"name": "Staff", "bonus": 9, "damage": [["1d4", "bludgeoning", null]], "traits": ["two-hand-d8"]}, {"name": "Claws", "bonus": 9, "damage": [["1d4+3", "slashing", null]], "traits": ["agile", "finesse"]}, {"name": "Sling", "bonus": 9, "damage": [["1d6", "bludgeoning", null]], "traits": [], "range": 50}]
  actions: [{"name": "Breath Control", "type": "passive", "traits": [], "text": "Inizkar can hold her breath for 25 times as long before suffocating. She gains a +1 circumstance bonus to saving throws against inhaled threats, such as inhaled poisons, and if she rolls a success on such a saving throw, she get a critical success instead."}, {"name": "Top Researcher", "type": "passive", "traits": [], "text": "Inizkar's academic skills allow her to discover information on almost any subject. Inizkar can spend 1 week of downtime to automatically succeed at a check to Recall Knowledge about a subject. If the subject is a creature, she learns the name, basic description, general behavior, and one specific ability of that creature. If the subject is a different topic, she learns general information that's always at least mildly informational and helpful.%rInizkar can use this ability to learn about any…"}, {"name": "+1 Circumstance to All Saves Vs. Inhaled Threats", "type": "passive", "traits": []}, {"name": "Move the Stars", "type": "reaction", "traits": ["occult"], "text": "Frequency once per day%rTrigger An attack or effect would reduce an ally within 30 feet to 0 Hit Points or cause the ally to gain the dying condition%rEffect Inizkar interprets the meaning of astrological omens in an instant, determining a new fate for the ally. The triggering ally remains at 1 Hit Point, doesn't increase their dying or wounded condition, and gains 10 temporary Hit Points for 1 round."}, {"name": "Align the Stars", "type": "action", "traits": ["occult"], "cost": 2, "text": "Inizkar looks to the stars and calls upon the power of the perfect alignment to protect her allies or threaten her foes. She chooses a creature within 30 feet and attempts an Astrology Lore check against the creature's Will DC. On a success, she finds the right alignment of stars for her goals. If the creature is an ally, that creature gains a +2 circumstance bonus to AC for 1 minute. If the creature is an enemy, other creatures gain a +4 circumstance bonus to damage rolls against that enemy…"}]
