ts jaws by 2.%rWhen the moon sets or the sun rises, the werecreature returns to humanoid form and is Fatigued for 2d4 hours.%rEffect: Moon Frenzy"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Romi deals 1d6 extra precision damage to Off-Guard creatures."}, {"name": "Tumble Behind", "type": "passive", "traits": [], "text": "When Romi successfully Tumbles Through a creature's space, the creature is Off-Guard against the next attack Romi makes against it before the end of his turn."}, {"name": "Unbalancing Blow", "type": "passive", "traits": [], "text": "When Romi critically hits and deals damage with a Strike, the target is Off-Guard against his attacks until the end of his next turn."}]
