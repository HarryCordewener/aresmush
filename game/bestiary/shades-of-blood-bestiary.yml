  actions: [{"name": "Bat Empathy", "type": "passive", "traits": ["primal"], "text": "A werebat can communicate with bats."}, {"name": "Echolocation", "type": "passive", "traits": [], "text": "A werebat can use their hearing as a precise sense at the listed range."}, {"name": "Wing Thrash", "type": "reaction", "traits": [], "text": "Trigger An adjacent enemy damages the werebat%rEffect The werebat makes one or two wing Strikes, each against a different adjacent creature."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph", "primal"], "cost": 1, "text": "Human%rMelee fist +11 Damage 1d4+2 Animal%rThe werecreature changes into its humanoid, hybrid, or animal shape. Each shape has a specific, persistent appearance. A true werecreature's natural form is its hybrid shape.%rIn humanoid shape, the werecreature uses its original humanoid size, loses its jaws and claws Strikes, and gains a melee fist Strike that deals bludgeoning damage equal to the slashing damage dealt by its claw.%rIn animal shape, its Speed and size change to that of the animal, it…"}, {"name": "Curse of the Werebat", "type": "passive", "traits": ["curse", "primal"], "text": "This curse affects only humanoids.%rSaving Throw DC 17 Fortitude%rOn each full moon, the cursed creature must succeed at another Fortitude save or turn into the same kind of werecreature until dawn.%rThe creature is under the GM's control and goes on a rampage for half the night before falling unconscious until dawn."}, {"name": "Moon Frenzy", "type": "passive", "traits": ["polymorph", "primal"], "text": "When a full moon appears in the night sky, the werecreature must enter hybrid form, can't Change Shape thereafter, becomes one size larger, increases its reach by 5 feet, and increases the damage of its jaws by 2.%rWhen the moon sets or the sun rises, the werecreature returns to humanoid form and is Fatigued for 2d4 hours.%rEffect: Moon Frenzy"}, {"name": "Vicious Swing", "type": "action", "traits": 