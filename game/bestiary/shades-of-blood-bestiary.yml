  actions: [{"name": "All-Around Vision", "type": "passive", "traits": []}, {"name": "Biting Snakes", "type": "reaction", "traits": [], "text": "Trigger A creature ends its turn adjacent to the medusa.%rEffect The medusa makes a snake fangs Strike against the creature."}, {"name": "Petrifying Gaze", "type": "passive", "traits": ["arcane", "aura", "visual"], "text": "30 feet.%rWhen a creature ends its turn in the aura, it must attempt a DC 25 Fortitude save. If the creature fails, it becomes Slowed 1 for 1 minute.%rThe medusa can deactivate or activate this aura by using a single action, which has the concentrate trait."}, {"name": "Focus Gaze", "type": "action", "traits": ["arcane", "concentrate", "incapacitation", "visual"], "cost": 1, "text": "The medusa fixes their glare at a creature they can see within 30 feet. The target must immediately attempt a DC 25 Fortitude save against the medusa's petrifying gaze.%rIf the creature was already Slowed by petrifying gaze before attempting its save, a failed save causes it to be Petrified permanently. After attempting its save, the creature is then temporarily immune until the start of the medusa's next turn."}, {"name": "Serpent Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 25 Fortitude%rMaximum Duration 6 rounds%rStage 1 1d6 poison damage and Enfeebled 1 (1 round)%rStage 2 2d6 poison damage and Enfeebled 2 (1 round)"}]
