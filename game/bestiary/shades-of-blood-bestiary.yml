  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Keeper's Ward", "type": "passive", "traits": ["aura", "primal"], "text": "30 feet. All allies within 30 feet of the Keeper gain a +1 status bonus to saves against magical effects. The bonus increases to +2 if the effect originated from an aquatic creature."}, {"name": "Bond with Mortal", "type": "passive", "traits": ["mental", "primal"], "text": "Frequency once per day%rEffect The Keeper forms a bond with a mortal creature. While the bond exists, the Keeper increases their current and maximum Hit Points by 20, gains a +2 status bonus to their attack and damage rolls, and can communicate telepathically with the bonded mortal as long as the two beings are on the same plane. The Keeper can only be bonded with one mortal at a time, and they can take this action again to end the bond or to form a new bond (which also ends the old bond). The…"}, {"name": "Bonded Strike", "type": "action", "traits": [], "cost": 2, "text": "Requirements The Keeper is currently Bonded with a Mortal%rEffect The Keeper makes a jaws Strike. If this attack hits, the bonded mortal can spend their reaction to Strike the same target."}, {"name": "Keeper's Touch", "type": "passive", "traits": ["primal"], "text": "The Keeper's touch instills their foes with the icy chill of the ocean depths, sapping away their life. A creature hit by the Keeper's tentacle must attempt a DC 26 Fortitude save.%rSuccess The creature is unaffected.%rFailure The creature becomes Drained 1. If the creature was already drained 1 by the Keeper's touch before attempting the save, a failed save increases the value of the drained condition by 1, to a maximum of Drained 4. The drained creature is temporarily immune until the start…"}]
