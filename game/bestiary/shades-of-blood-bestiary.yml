  actions: [{"name": "Red Cap", "type": "passive", "traits": ["primal"], "text": "A redcap's woolen hat is dyed with the blood of their victims. If the redcap loses their cap, they no longer benefit from fast healing and take a –4 status penalty to their damage rolls. They can create a new cap in 10 minutes, but that cap doesn't grant them powers until the redcap has turned it red with Blood Soak. A cap has no benefit for creatures other than the redcap who made it.%rEffect: Lost Red Cap"}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Divine Revulsion", "type": "passive", "traits": ["emotion", "fear", "mental"], "text": "If a redcap sees a creature brandish a religious symbol of a deity (which requires an Interact action by that creature) or cast a divine spell while wearing a religious symbol, the redcap must attempt a DC 19 Will save. They then become temporarily immune to all brandished religious symbols for 10 minutes.%rCritical Success The redcap is unaffected.%rSuccess The redcap is Frightened 2.%rFailure The redcap gains the Fleeing condition for 1 round and is Frightened 4."}, {"name": "Blood Soak", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The redcap dips their cap in the blood of a slain foe. The foe must have died in the last minute, and the redcap must have helped kill it. The redcap gains a +4 status bonus to damage rolls for 1 minute.%rEffect: Blood Soak"}, {"name": "Deadly Cleave", "type": "reaction", "traits": [], "text": "Trigger The redcap reduces a creature to 0 Hit Points with a halberd Strike%rEffect The redcap makes another halberd Strike against a different creature, using the same multiple attack penalty as the halberd Strike that triggered this reaction. This counts toward their multiple attack penalty as normal."}, {"name": "Stomp", "type": "action", "traits": [], "cost": 1, "text": "The redcap Strides up to half its Speed and makes a boot Strike at any point during that movement. If the boot