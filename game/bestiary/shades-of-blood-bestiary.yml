 smile, the velstrac conductor points their baton at a creature within 100 feet, compelling them to scream. The creature must attempt a DC 28 Will save. On a failure, they scream, taking 4d6 mental damage (8d6 mental on a critical failure) and dealing 2d6 sonic|options:area-damage damage to all creatures in a 20-foot emanation (DC 28 Fortitude save).%rInstead of targeting one creature, the conductor can choose to target all…"}, {"name": "Unholy Exaltation", "type": "action", "traits": ["divine", "sonic", "unholy"], "cost": 2, "text": "The conductor lets out a terrible scream of joy, dealing 10d6 sonic|options:area-damage damage to all creatures in either a 30-foot cone or a 90-foot line (DC 28 Will save). Holy creatures that fail this save are also Sickened 2. The conductor can't use Unholy Exaltation again for 1d4 rounds."}]
