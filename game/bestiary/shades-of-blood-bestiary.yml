e DC if the creature is grabbed and is automatic for any of the other conditions. The creature becomes Drained 1 and Stupefied 1, and Okoa regains 13 healing HP, gaining any excess HP as temporary Hit Points.…"}, {"name": "Strafing Strike", "type": "action", "traits": [], "cost": 2, "text": "Okoa becomes a semi-incorporeal shade, then Strides or Flies up to twice her Speed in a straight line, dealing 8d8 slashing|options:area-damage damage to all creatures in that line or adjacent to that line (DC 28 Reflex save). She can move through enemies and solid objects during this movement. At the end of this movement, she returns to her fully corporeal form. She can't use Strafing Strike again for 1d4 rounds."}, {"name": "Vicious Flurry", "type": "action", "traits": ["flourish"], "cost": 1, "text": "Okoa makes two claw Strikes at the same target, each using her current multiple attack penalty. If both attacks hit, the target is also dealt 1d8 persistent bleed damage."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
