  strikes: [{"name": "Fangs", "bonus": 17, "damage": [["2d10+7", "piercing", null]], "traits": ["unarmed"], "effects": ["Drink Blood"]}, {"name": "Claw", "bonus": 17, "damage": [["2d8+7", "slashing", null]], "traits": ["agile", "unarmed"]}]
  actions: [{"name": "Feral Corruption", "type": "free", "traits": ["curse", "divine", "incapacitation", "mental", "possession"], "text": "Trigger Idebilor is reduced to 0 Hit Points and an animal (such as a mold ticks in area N7 or any of the spider swarms in area N9 ) is within 100 feet%rEffect Idebilor casts his spirit into a nearby animal, which must attempt a DC 25 Will save. On a failure, the animal is possessed (as per the Possession spell) for 7 days. This possession can be counteracted only by effects that can counteract a curse. If, at any point, an animal critically succeeds at this save or no animal is within 100 feet,…"}, {"name": "Feral Possession", "type": "passive", "traits": ["curse", "divine", "incapacitation", "mental", "possession"], "text": "Trigger The vrykolakas is reduced to 0 Hit Points, and an animal is within 100 feet%rEffect Unlike most other undead, a vrykolakas isn't destroyed when it reaches 0 HP. Instead, it attempts to cast its spirit into an animal within 100 feet, which must attempt DC 24 Will save. On a failure, the animal is possessed. This has the effects of the Possession spell, but it lasts a number of days equal to the vrykolakas's level. This possession can't be counteracted with magic (though remove curse…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Vrykolakas Vulnerabilities", "type": "passive", "traits": [], "text": "Idebilor must return to his burial site (area N11 ) once per week and bury himself there for 24 hours, during which time he is Paralyzed and can be beheaded. If he's unable to return to this site, he's reduced to 0 Hit Points and attempts to use Feral Corruption. If the host animal can't reach the burial site before the possession effect ends, Idebilor is destroyed and the animal returns to normal.%rIf he is beheaded, Idebilor can't use Feral Corruption, and a beheaded corpse cannot rise as a…"}, {"name": "Bloody Obsession", "type": "action", "traits": ["concentrate", "curse", "divine", "emotion", "incapacitation", "mental", "visual"], "cost": 2, "text": "Idebilor curses a living creature with an overwhelming obsession with blood. He stares intently at a living creature within 30 feet, then licks his fangs violently enough to cause his tongue to bleed (this causes no damage to Idebilor). The target must attempt a DC 25 Will save.%rCritical Success The target is unaffected.%rSuccess The target feels uneasy. If the target can see a creature taking persistent bleed damage within 30 feet, the target becomes Slowed 1 for 1 round as they obsessively…"}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements The vrykolakas' last action was a successful fangs Strike%rEffect The vrykolakas sinks its fangs into that creature to drink its blood. This requires an Athletics check against the creature's Fortitude DC. On a success, the creature becomes Drained 1, and the vrykolakas regains 11 healing HP, gaining any excess HP as temporary Hit Points.%rDrinking Blood from a creature that's already drained doesn't restore any HP to the vampire, but it increases the creature's drained condition…"}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}, {"name": "Sap Life", "type": "passive", "traits": [], "text": "When Idebilor damages at least one living creature with a Harm spell, he regains HP equal to the harm spell's rank."}]
  spellcasting: [{"name": "Divine Prepared Spells", "tradition": "divine", "type": "prepared", "dc": 25, "attack": 17, "spells": {"0": ["Daze", "Divine Lance", "Message", "Shield", "Void Warp"], "1": ["Enfeeble", "Fear", "Grim Tendrils", "Harm", "Sanctuary"], "2": ["Dispel Magic", "Silence", "Spiritual Armament"], "3": ["Blindness", "Vampiric Feast"], "4": ["Fly"]}}, {"name": "Cleric Domain Spells", "tradition": "divine", "type": "focus", "dc": 25, "attack": 17, "spells": {"1": ["Overstuff", "Touch of Undeath"]}}]
"Ilnaphrae":
  pack: "shades-of-blood-bestiary"
  level: 6
  size: "medium"
  rarity: "uncommon"
  traits: ["undead", "unholy", "vampire"]
  ac: 24
  hp: 65
  perception: 17
  saves: {"fortitude": 11, "reflex": 14, "will": 17}
  abilities: {"cha": 4, "con": 2, "dex": 3, "int": 2, "str": 5, "wis": 4}
  speeds: {"land": 25, "climb": 25}
  hp_details: "coffin restoration, fast healing 7, void healing"
  senses: ["darkvision"]
  skills: {"Acrobatics": 13, "Athletics": 13, "Deception": 14, "Diplomacy": 14, "Intimidation": 16, "Society": 14, "Stealth": 13}
  immunities: ["death-effects", "disease", "paralyzed", "poison", "sleep"]
  strikes: [{"name": "Rapier", "bonus": 17, "damage": [["1d6+11", "piercing", null]], "traits": ["deadly-d8", "disarm"]}, {"name": "Claw", "bonus": 17, "damage": [["1d8+8", "slashing", null]], "traits": ["agile", "unarmed"], "effects": ["Grab"]}, {"name": "Repeating Crossbow", "bonus": 15, "damage": [["1d6+6", "piercing", null]], "traits": ["reload-0", "repeating"], "range": 120}]
  actions: [{"name": "Children of the Night", "type": "passive", "traits": ["divine", "mental"], "text": "The vampire's presence brings forth creatures of the night to do the master's bidding. These typically include Rat Swarms, Bat Swarms, and Wolves, but can include other creatures.%rThe vampire can give telepathic orders to these creatures as long as they are within 100 feet, but they can't communicate back."}, {"name": "Fast Healing 7", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Mist Escape", "type": "free", "traits": [], "text": "Trigger The vampire is reduced to 0 HP.%rEffect The vampire uses Turn to Mist. They can take move actions to move toward its coffin even though it's at 0 HP. While at 0 HP in this form, the vampire is unaffected by further damage.%rThey automatically returns to its corporeal form, unconscious, if they reaches their coffin or after 2 hours, whichever comes first."}, {"name": "Vampire Vulnerabilities", "type": "passive", "traits": [], "text": "All vampires possess the following vulnerabilities.%rCompulsions Vampires are creatures with strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless they're transported while they hide within their coffin, nor can they enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions—a pirate vampire might not be able to set foot on solid ground without being invited, for…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The vampire transforms into one of its animal forms or back into its normal form. Most vampires can turn into a bat, but some can turn into a different creature, such as a rat or a wolf.%rGiant Bat Senses echolocation 40 feet, Speed 20 feet, fly 30 feet, Melee fangs +15 Damage 1d8+9 piercing"}, {"name": "Create Servitor", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Blood, the vampire can turn this victim into a vampire servitor by donating some of their own blood to the victim and burying the victim in earth for 3 nights.%rA vampiric servitor is compelled to obey its creator, but if a vampire controls too many vampiric servitors at once (as determined by the GM), or if the servitor is a higher level than the vampire that created it, strongwilled servitors can free themselves by succeeding at a Will…"}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "The vampire can cast Dominate at will as a divine innate spell. Casting it requires staring into the target's eyes, giving the spell the visual trait (DC 22 Will). The save DC uses the high spell DC of the vampire's level, and a creature that succeeds is temporarily immune to that vampire's Dominate for 24 hours.%rFully destroying the vampire ends the domination, but merely reducing the vampire to 0 HP is insufficient to break the spell."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirement A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the vampire's reach.%rEffect The vampire sinks its fangs into that creature to drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions.%rThe victim is Drained 2 and the vampire regains 10 HP, gaining any excess HP as temporary Hit Points. Drinking Blood from a creature that's already drained doesn't restore…"}, {"name": "Turn to Mist", "type": "action", "traits": ["air", "concentrate", "divine", "polymorph"], "cost": 1, "text": "The vampire turns into a cloud of vapor, as the Vapor Form spell, or back to its normal form. The vampire loses fast healing while in gaseous form.%rThe vampire can remain in this form indefinitely."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 22, "attack": 14, "spells": {"6": ["Dominate (At Will) (See Dominate)"]}}]
