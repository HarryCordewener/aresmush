  actions: [{"name": "Battle-Grapple Innovation", "type": "passive", "traits": [], "text": "Zovi fights using a complex device she crafted from scavenged clockwork parts and ancient Azlanti magitech. Similar in appearance to a grappling hook attached to an auto-retracting cable, this device is called a battle-grapple innovation. It allows Zovi to use her Magitech Propulsion and Whirling Flurry abilities. Unlike other tethered weapons, each time Zovi uses her battle-grapple innovation, she automatically retrieves it as a free action, allowing her to make multiple attacks in a row. It…"}, {"name": "Dero Medicine", "type": "action", "traits": ["healing", "manipulate"], "cost": 1, "text": "Requirements The dero is wearing a cytillesh toolkit and has a hand free%rEffect The dero excises damaged flesh and crudely stitches wounds shut, healing themself or an ally in reach for (2d8+14) healing Hit Points. For 1 hour, the target has slashing weakness 2 and is immune to Dero Medicine.%rEffect: Dero Medicine"}, {"name": "Magitech Propulsion", "type": "action", "traits": [], "cost": 1, "text": "With a flourish, Zovi activates the ancient magitech kitbashed onto her battle-grapple innovation. For 1d4 rounds, Zovi deals an additional 2d6 fire damage with her battle-grapple innovation. At the end of this time, the magitech backfires in a burst of fire and smoke, dealing 2d6 fire damage to Zovi and making her Concealed and Dazzled for 1 round."}, {"name": "Shrieking Flurry", "type": "action", "traits": ["flourish"], "cost": 1, "text": "With a high-pitched cackle of glee, Zovi makes a battle-grapple Strike against up to three enemy creatures within 20 feet. Zovi attempts a check to Demoralize each target she hits with this Shrieking Flurry."}]
