  actions: [{"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Shadow Form", "type": "action", "traits": ["concentrate", "divine", "shadow"], "cost": 1, "text": "The strigoi reverts to pure shadow and absorbs its body and its gear into the darkness, or it shifts back to its physical form. In shadow form, the strigoi gains a climb Speed equal to its land Speed and can move through any gap that isn't airtight. However, it can only move along solid surfaces that aren't highly reflective, not liquid or mirrored surfaces. If the surface it's on is destroyed, the strigoi returns to physical form and is Stunned 1. The strigoi loses fast healing while in shadow…"}, {"name": "Strigoi Weaknesses", "type": "passive", "traits": [], "text": "All strigoi possess the following weaknesses:%rRevulsion Strigoi are uncomfortable near mirrors or sources of bright light. Only a strigoi's shadow reflects in a mirror, and this often compels them to cover or destroy mirrors in their presence rather than risk their true nature being displayed. A strigoi can't voluntarily come within 10 feet of a brandished mirror or source of bright light. To brandish a mirror or light source, a creature must Interact to do so for 1 round (similar to Raising a…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Calculated Escape", "type": "reaction", "traits": ["divine", "teleportation"], "text": "Trigger Nizca is the target of a Strike or would attempt a Reflex save against a harmful effect%rEffect In a flash of sudden insight, Nizca calculates the trajectory of the attack, slips into shadows, and reemerges just out of the way. Nizca gains a +2 circumstance bonus to AC against the triggering Strike or to Reflex saves against the triggering effect. After the attack or effect is resolved, Nizca teleports to an occupied space within 20 feet.%rSpecial If the triggering Strike was a hit or a…"}, {"name": "Channel Smite", "type": "action", "traits": ["divine"], "cost": 2, "text": "Nizca siphons death through a melee attack and into their foe. Nizca expends a Harm spell and makes a melee Strike. On a hit, they cast the 1-action version of the expended spell to damage the target, in addition to the normal damage from the Strike. The target automatically gets a failure on its save (or a critical failure if Nizca's Strike was a critical hit). The spell doesn't have the manipulate trait when cast this way."}, {"name": "Drink Essence", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the strigoi's reach%rEffect The strigoi sinks their fangs into the targeted creature to drink its blood and draw out its vital essence. This requires an Athletics check against the creature's Fortitude DC if the creature is grabbed and is automatic for any of the other conditions. The creature becomes Drained 1 and Stupefied 1, and the strigoi regains 15 healing HP, gaining any excess HP as temporary Hit…"}, {"name": "Reach Spell", "type": "action", "traits": ["concentrate", "spellshape"], "cost": 1, "text": "If the next action Nizca uses is to Cast a Spell that has a range, increase that spell's range by 30 feet."}, {"name": "Roiling Shades", "type": "passive", "traits": ["aura", "divine", "shadow"], "text": "20 feet. The shadows around Nizca constantly shift and roil, battering their foes. Enemies treat the area within the aura as difficult terrain."}, {"name": "Spiteful Escape", "type": "free", "traits": [], "text": "Trigger Nizca is reduced to 0 Hit Points%rEffect Nizca uses Shadow Form, then flies into the shadow beacon even though they're at 0 Hit Points