  actions: [{"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Nosferatu Vulnerabilities", "type": "passive", "traits": [], "text": "n addition to the typical vampire vulnerabilities, Vikandian is jealous he can't create spawn. A PC who pokes at this shame when they attempt to Demoralize Vikandian gains a +4 circumstance bonus on their Intimidation check. If they're successful, Vikandian becomes Slowed 1 for as long as he remains frightened as he sputters in rage.%rRevulsion A nosferatu can't voluntarily come within 10 feet of brandished garlic or a brandished religious symbol of a non-evil deity. To brandish garlic or a…"}, {"name": "Opportune Riposte", "type": "reaction", "traits": [], "text": "Trigger An enemy within Vikandian's reach critically fails on a Strike against him%rEffect Vikandian either makes a melee Strike against the triggering enemy or attempts to Disarm them of the weapon used for the Strike. If he succeeds, he gains panache."}, {"name": "Plagued Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "If he's reduced to 0 HP, Vikandian disperses into an immense number of individual rats that flee in every direction in an attempt to return to his coffin in area N6 . If even a single rat enters this coffin, he reforms in his body and is Unconscious. If his body rests in his coffin for 1 hour, Vikandian gains 1 HP, after which his fast healing begins to function normally. If his coffin doesn't contain plagued grave dirt, he instead needs to rest in his coffin for 1 day before he gains 1 HP and…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Bleeding Finisher", "type": "action", "traits": [], "cost": 1, "text": "Requirements Vikandian has panache%rEffect Vikandian attempts a sword cane Strike. If he hits, the target also takes 3d6 persistent bleed damage. He then loses his panache and can't use actions that have the attack trait for the rest of his turn."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "Vikandian transforms into a swarm of rats. He gains a land Speed of 30 feet and a climb Speed of 10 feet, and he becomes Large. Each enemy in his space takes 2d10 piercing damage (DC 26 Reflex save). A creature that fails the save is exposed to plague of ancients."}, {"name": "Command Thrall", "type": "free", "traits": ["auditory", "divine", "mental"], "text": "Requirements One of Vikandian's morlock thralls is present and can hear him%rEffect Vikandian gives a single command to one of his thralls, which the thrall follows to the best of their ability during their next turn."}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "The nosferatu can cast Dominate at will as a divine innate spell. Casting it requires staring into the target's eyes, giving the spell the visual trait (DC 26 Will). A creature that succeeds is temporarily immune to that nosferatu's Dominate for 24 hours. Fully destroying the nosferatu ends the domination, but merely reducing the nosferatu to 0 HP is insufficient to break the spell."}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements The nosferatu's last action was a successful fangs Strike%rEffect The nosferatu sinks their fangs into the targeted creature to drink its blood. This requires an Athletics check against the creature's Fortitude DC. On a success, the creature becomes Drained 1, and Vikandian regains 10 healing HP, gaining any excess HP as temporary Hit Points and gaining panache. Drinking Blood from a creature that's already drained doesn't restore any HP to the nosferatu, but increases the…"}, {"name": "Plague of Ancients", "type": "passive", "traits": ["disease", "virulent"], "text": "Saving Throw DC 26 Fortitude%rOnset 1 day%rStage 1 drained (1 day)%rStage 2 Drained 2 and Enfeebled 2 (1 day)%rStage 3 Doomed 1, Drained 3, and Enfeebled 3 (1 day)%rStage 4 Doomed 2, drained 3, and enfeebled 3 (1 day)%rStage 5 Unconscious (1 day)%rStage 6 death"}, {"name": "Precise Fencer", "type": "passive", "traits": [], "text": "Vikandian deals an additional 3 precision damage with his sword cane, fangs, or claw Strikes."}, {"name": "Vampiric Panache", "type": "passive", "traits": [], "text": "Vikandian gains panache when he successfully uses Opportune Riposte, when he successfully Demoralizes a creature, when he successfully Dominates a creature, and when he Drinks Blood."}]
