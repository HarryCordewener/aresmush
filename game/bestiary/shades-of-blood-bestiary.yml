  actions: [{"name": "Mist Vision", "type": "passive", "traits": [], "text": "The fogfisher ignores the Concealed condition from fog and mist."}, {"name": "Fog Rupture", "type": "passive", "traits": [], "text": "If a fogfisher takes damage from a critical hit, it must succeed at a DC 16 Flat or the sac that produces its fog aura ruptures. This causes its fog aura to dissipate at the start of the fogfisher's next turn. The fogfisher is then Slowed 1 for 24 hours, after which it recovers and produces its fog aura again."}, {"name": "Drifting Toxin", "type": "passive", "traits": ["poison", "primal"], "text": "Saving Throw DC 21 Fortitude%rMaximum Duration 10 minutes%rStage 1 the creature becomes buoyant in the air and is treated as a Tiny creature for the purposes of wind effects and being pulled by the fogfisher's harpoon; if the creature falls, it drifts gently to the ground (1 round)%rStage 2 as stage 1 plus Enfeebled 1 (1 minute)"}, {"name": "Fog Aura", "type": "passive", "traits": ["air", "aura", "primal"], "text": "15 feet. The fogfisher constantly exudes an aura of fog. All creatures within the aura become Concealed, and all creatures outside the fog become concealed to creatures within it."}, {"name": "Reel In", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The fogfisher has a Tiny creature Grabbed with its harpoon%rEffect The fogfisher retracts its harpoon, pulling the grabbed creature toward it. The grabbed creature must attempt a DC 21 Fortitude save.%rCritical Success The fogfisher fails to move the creature.%rSuccess The fogfisher pulls the creature 5 feet closer.%rFailure The fogfisher pulls the creature up to 30 feet closer.%rCritical Failure The fogfisher pulls the creature to an adjacent space."}, {"name": "Rip Out", "type": "action", "traits": [], "cost": 1, "text": "Requirements The fogfisher has a creature Grabbed with its harpoon%rEffect The fogfisher rips free its harpoon, retracting the spike and leaving a bloody hole behind. The grabbed creature is no longer grabbed and takes 3d6 persistent bleed damage (DC 21 Fortitude save)."}]
