  actions: [{"name": "Fear Scent", "type": "passive", "traits": [], "text": "A kalakaigh can sense creatures that are frightened or under a fear effect."}, {"name": "+1 to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Mercy Vulnerability", "type": "passive", "traits": [], "text": "Kalakaighs delight in the sight of fresh wounds, and when one is healed, they recoil in pain. When a creature heals from damage that the kalakaigh dealt on their last turn, the demon takes 4d6 mental damage. The kalakaigh can take this damage only once per round."}, {"name": "Bloody Attack", "type": "passive", "traits": [], "text": "A kalakaigh deals 1d6 extra precision damage and 1d6 extra persistent bleed damage to Off-Guard creatures."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The kalakaigh can take on the appearance of any Medium humanoid, but when they do so, they always appear to be wearing dark clothing, black gloves, and some sort of obscuring cover over their face or head. These \"clothes\" are in fact part of the demon's new body. Their new form doesn't change their Speed or their weapon attack and damage modifiers with their Strikes, but it does prevent them from making horn Strikes."}, {"name": "Shocking Reveal", "type": "reaction", "traits": ["emotion", "fear", "mental", "visual"], "text": "Trigger The kalakaigh damages a creature with a melee Strike while in its humanoid form%rEffect The kalakaigh reverts to its true form, and all creatures within 30 feet who witness the transformation must make a DC 21 Will save or become Frightened 1 (Frightened 2 on a critical failure)."}, {"name": "Signature Slaughter", "type": "action", "traits": [], "cost": 2, "text": "The kalakaigh attacks with a recognizable flourish or in a specific way that links all its murders together. The kalakaigh makes a melee Strike with its kukri. This counts as two attacks when calculating the demon's multiple attack penalty. If this strike hits, the kalakaigh deals an additional 2d6 persistent bleed damage, and the target is Frightened 2."}]
