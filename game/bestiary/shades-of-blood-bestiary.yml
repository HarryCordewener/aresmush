  actions: [{"name": "Oily Coils", "type": "passive", "traits": [], "text": "A viper bat gains a +4 circumstance bonus on Escape checks and to its Fortitude DC against attempts to Grapple them."}, {"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "30 feet. DC 16 Fortitude. Undead are immune to viper bat stench."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Digest Mind", "type": "passive", "traits": ["curse", "incapacitation", "mental", "occult"], "text": "Each time a swallowed creature begins their turn, they are affected by this horrific curse. If a creature escapes being swallowed whole before reaching stage 5, it recovers fully from this curse at the start of its next turn.%rSaving Throw DC 25 Will%rStage 1 Stupefied 1 (1 round)%rStage 2 Stupefied 2 and Slowed 1 (1 round)%rStage 3 Stupefied 3 and slowed 1 (1 round)%rStage 4 stupefied 3 and Slowed 2 (1 round)%rStage 5 the target's intellect is permanently reduced below that of an animal, and…"}, {"name": "Flick Oil", "type": "action", "traits": ["primal"], "cost": 2, "text": "The viper bat flicks its coils, spraying rancid black oil in a 30-foot cone. A creature in the area becomes Clumsy 1 and Sickened 1 for 1 minute if they fail a DC 25 Fortitude save (Clumsy 2 and Sickened 2 on a critical failure). The viper bat can't Flick Oil for 1d4 rounds."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Medium, digest mind, Rupture 20"}]
