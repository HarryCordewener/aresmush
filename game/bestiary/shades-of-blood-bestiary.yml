  actions: [{"name": "Expert Overdrive", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Frequency once per round%rEffect Yobnobby attempts a DC 18 Crafting check.%rCritical Success Yobnobby's Strikes deal an additional 5 damage for 1 minute. After this effect ends, Yobnobby can't use Expert Overdrive for 1 minute.%rSuccess As critical success, but only an additional 3 damage.%rFailure Nothing happens.%rCritical Failure Yobnobby's gizmos catch on fire! She takes 3 fire damage and can't use Expert Overdrive again for 1 minute.%rEffect: Yobnobby Overdrive"}, {"name": "Explode", "type": "action", "traits": ["fire", "manipulate", "unstable"], "cost": 2, "text": "Yobnobby causes her armor to belch fire in a 5-foot emanation. Creatures in this area (other than Yobnobby) take 3d6 fire|options:area-damage damage (DC 19 Reflex save), after which Yobnobby must attempt a DC 17 Flat.%rSuccess Yobnobby's armor is unharmed by the explosion.%rFailure Yobnobby's armor emits a loud grinding sound and belches plumes of rancid-smelling smoke. She can't use Explode again until she takes 10 minutes to repair her armor.%rCritical Failure As failure, but Yobnobby also…"}, {"name": "Extend Claws", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Yobnobby causes her tekko-kagis to extend on armatures from her hands, granting her reach 10 feet with the weapons until the end of her turn."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Yobnobby deals 1d6 extra precision damage to Off-Guard creatures."}, {"name": "Tinker", "type": "passive", "traits": ["curse", "primal"], "text": "A group of six jinkins can work together for an hour to imbue an item with a curse at a range of 60 feet. While this process is lengthy, it's also unobtrusive and can be performed while Hiding. Jinkins prefer to use this ability on magic items. The curse makes the item unreliable (DC 5 Flat check or waste any action to Interact with or Activate the item), adds a bizarre requirement to use the item, or imparts some other curse of a similar caliber."}, {"name": "Yobnobby's Armor", "type": "passive", "traits": [], "text": "Yobnobby's armor grants resistance 4 to acid and electricity damage. This resistance increases to 6 when she successfully activates Expert Overdrive."}]
