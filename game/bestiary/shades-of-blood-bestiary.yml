  actions: [{"name": "Light Blindness", "type": "passive", "traits": []}, {"name": "+2 Status to All Saves vs. Disease and Poison", "type": "passive", "traits": []}, {"name": "Fast Healing 5", "type": "passive", "traits": []}, {"name": "Mindbound", "type": "passive", "traits": [], "text": "If any creature other than Vikandian targets the morlock thrall with an effect that would give the morlock the Controlled condition, Vikandian rolls a counteract check against the effect, with a +16 counteract check modifier."}, {"name": "Mortal Shield", "type": "reaction", "traits": [], "text": "Trigger The morlock thrall will do anything to protect their master. If the morlock thrall is adjacent to Vikandian when Vikandian would take damage from a Strike or spell attack%rEffect The morlock throws himself in front of his master, taking half the damage of the attack (before applying any weaknesses or resistances). Vikandian takes the remaining damage, applying any weaknesses or resistances as normal."}, {"name": "Rally", "type": "reaction", "traits": [], "text": "Trigger The thrall ends their turn more than 30 feet away from Vikandian%rEffect The thrall Strides up to their Speed toward Vikandian."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Instinctual Tinker", "type": "action", "traits": [], "cost": 2, "text": "The morlock tinkers with an adjacent construct or mechanical hazard. They attempt a Crafting check against the construct's or hazard's Fortitude DC. The morlock can't succeed if the target's level is more than double the morlock's.%rCritical Success The target gains 4d6 healing Hit Points and a +1 circumstance bonus to attack rolls for 1 minute.%rSuccess The target gains 2d6 healing Hit Points.%rCritical Failure The morlock injures itself, taking 2d6 damage (typically bludgeoning, piercing, or…"}, {"name": "Revel in the Gore", "type": "action", "traits": ["manipulate", "mental", "visual"], "cost": 1, "text": "Requirements The morlock thrall's previous action was a critical hit with a melee Strike%rEffect The morlock shrieks in excitement and springs forward to slurp at the gore. Any creatures within 20 feet who can see the disgusting display must attempt a DC 21 Fortitude save or become Sickened 1 (or Sickened 2 on a critical failure). Vampires and other morlocks in the area are emboldened instead and gain a +1 circumstance bonus to Will saves until the end of their next turn."}, {"name": "Swarming Stance", "type": "passive", "traits": [], "text": "A morlock can share the same space as another morlock, but no more than two morlocks can occupy the same space. When morlocks share the same space, they gain a +1 circumstance bonus to attack rolls."}, {"name": "Swipe", "type": "action", "traits": [], "cost": 2, "text": "The morlock thrall makes a melee Strike and compares the attack roll result to the AC of up to two foes, each of whom must be within the morlock's melee reach and adjacent to each other. The sweep bonus of the morlock's falchion applies to these attacks. Roll damage once and apply it to each creature hit. A Swipe counts as two attacks toward the morlock's multiple attack penalty."}]
