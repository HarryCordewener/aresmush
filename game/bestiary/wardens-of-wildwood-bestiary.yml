  actions: [{"name": "Phytohydra Regeneration", "type": "passive", "traits": [], "text": "The phytohydra has regeneration equal to 5 × the number of heads it has. If a phytohydra's body is missing any heads and the remaining stumps haven't been cauterized, the phytohydra attempts a DC 35 Fortitude save after it regains Hit Points from regeneration. On a success, one unsealed stump regrows two heads; on a critical success, two unsealed stumps regrow into two heads each. The phytohydra can never grow more than double the number of heads it ordinarily has. The phytohydra's regeneration…"}, {"name": "Coppice Regrowth", "type": "passive", "traits": [], "text": "A phytohydra ordinarily has five heads. A creature can attempt to sever one of the heads by specifically targeting it and dealing damage equal to the head's Hit Points. A head that isn't completely severed returns to full Hit Points at the end of any creature's turn.%rA phytohydra can regrow a severed head using phytohydra regeneration. A creature can prevent this regrowth by dealing fire damage to the stump, sealing it. Single-target fire effects need to be targeted at a specific stump, but…"}, {"name": "Reactive Strike (See Reactive Heads)", "type": "reaction", "traits": []}, {"name": "Focused Assault", "type": "action", "traits": [], "cost": 2, "text": "The phytohydra attacks a single target with its many heads. The phytohydra Strikes with its branches or its fangs. On a successful attack, the phytohydra deals damage from its branches or fangs Strike to the target, plus an additional 2d6 damage for every head it has beyond the first. On a failure (but not a critical failure), the phytohydra deals the damage from one branch or fangs Strike to the target creature. This Strike counts as a number of attacks equal to the number of heads the…"}, {"name": "Reactive Heads", "type": "passive", "traits": [], "text": "A phytohydra gains an extra reaction per round for each of its heads beyond the first, which it can use only to make Reactive Strikes. It can't use more than 1 reaction on the same triggering action, even if a creature leaves several squares within its reach, and the phytohydra must use a different head for each Reactive Strike it makes. Whenever one of the phytohydra's heads is severed, the phytohydra loses one of its extra reactions per round."}, {"name": "Splinter Breath", "type": "action", "traits": [], "cost": 2, "text": "The phytohydra spews splinters in a 60-foot that deals 4d6 piercing|options:area-damage damage to all creatures in the area (DC 32 Reflex save). The damage increases by 2d6 for each head the phytohydra has.%rThe phytohydra can't use Splinter Breath again for 1d4 rounds."}, {"name": "Storm of Branches", "type": "action", "traits": [], "cost": 2, "text": "The phytohydra makes a number of Strikes up to its number of heads, each against a different target. These attacks count toward the phytohydra's multiple attack penalty, but the multiple attack penalty doesn't increase until after the phytohydra makes all its attacks."}, {"name": "Push 10 feet", "type": "action", "traits": [], "cost": 1}]
