  actions: [{"name": "Central Weapon", "type": "passive", "traits": [], "text": "A swordkeeper's torso houses a single weapon of a level no higher than the swordkeeper. While the swordkeeper is operational, the chamber requires four successful DC 32 Thievery checks to disable-device dc=32 to open; on a critical failure, the backlash deals 6d6 force damage (DC 30 Reflex save) to the creature attempting the check.%rIf the swordkeeper is Immobilized, Grabbed, Prone, or Stunned, both DCs are reduced by 2.%rIf the weapon is removed, the swordkeeper's echoblades vanish."}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Colossal Echo", "type": "action", "traits": ["force"], "cost": 2, "text": "Requirements The swordkeeper has a central weapon%rEffect The swordkeeper projects a massive echoblade held in all four hands, dealing 9d8 force|options:area-damage damage to all creatures in a 30-foot (DC 30 Reflex save).%rIt can't use Colossal Echo again for 1d4 rounds."}, {"name": "Echoblade Flurry", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect The swordkeeper makes two melee Echoblade Strikes. If both Strikes hit the same creature, combine their damage for the purpose of resistances and weakness. Apply the swordkeeper's multiple attack penalty normally."}, {"name": "Project Echoblade", "type": "free", "traits": [], "text": "Requirements The swordkeeper has a central weapon%rEffect The swordkeeper projects an echoblade-a force copy of its central weapon that deals 1d8 force damage and gains thrown 30 feet. Echoblades inherit the weapon damage dice, weapon traits, and runes of the central weapon, but no other abilities or activations. The swordkeeper gains access to their critical specialization effects. The swordkeeper can have up to four echoblades at once; unattended echoblades vanish at the end of the…"}, {"name": "Raise Guard", "type": "action", "traits": [], "cost": 1, "text": "Effect The swordkeeper raises an echoblade to protect itself, gaining a +2 circumstance bonus to AC until the start of its next turn.%rEffect: Raise Guard"}]
