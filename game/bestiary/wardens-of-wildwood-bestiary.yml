e", "traits": [], "text": "The sluagh reaper deals an additional 3d6 precision damage to Off-Guard creatures."}, {"name": "Steal Soul", "type": "action", "traits": ["occult"], "cost": 2, "text": "The sluagh reaper touches a dying creature or a creature that died within the past 1 hour. If the target is a dying creature, it must attempt a DC 28 Fortitude save-on a failure, its dying value increases by 1 (2 on a critical failure). If the target is dead, it receives no save and the sluagh imprisons its soul in a small, grimy sack that keeps stolen souls fresh.%rThe sack is magically locked. Any sluagh can open it without difficulty, but any others must Pick the Lock (DC 35 Thievery) or use…"}, {"name": "Tap Planar Gate", "type": "action", "traits": ["concentrate", "primal"], "cost": 1, "text": "The woodblessed empowers themself or their next attack.%rIf the woodblessed's next action is to Stride, is launched off the ground by a suddenly sprouting tree and propelled forward. During this Stride, they have a fly Speed equal to their Speed. If they don't end their movement on a solid surface that can support their weight, they fall.%rIf the woodblessed's next action is a Strike, the attack sprouts thorns that deal an additional 1d6 persistent bleed damage."}]
