  actions: [{"name": "Shadowsense", "type": "passive", "traits": [], "text": "The shadows of Gloaming Arbor are an extension of Avathrael, and they can sense creatures in areas of dim light or darkness."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Floral Defense", "type": "reaction", "traits": ["plant"], "text": "Trigger Avathrael is the target of a physical attack%rEffect Avathrael raises their plant-covered wings to block the incoming blow. They gain a +2 circumstance bonus to AC against the triggering attack. If the attack misses, it's deflected by Avathrael's wing, causing some of the dangerous plants growing on the wing to burst and release a cloud of toxic pollen. The triggering creature takes 2d10 poison damage (DC 29 Fortitude save). On a critical failure, the triggering creature is also…"}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 29 Will"}, {"name": "Light Blindness", "type": "passive", "traits": []}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "Avathrael recharges their Poison Breath whenever they score a critical hit with a Strike."}, {"name": "Poison Breath", "type": "action", "traits": ["poison", "primal"], "cost": 2, "text": "Avathrael exhales a cloud of sweet-smelling poisonous gas that deals 13d6 poison|options:area-damage damage in a 50-foot (DC 32 Fortitude save). A creature that critically fails is also Sickened 2. Avathrael can't use Poison Breath again for 1d4 rounds."}, {"name": "Shadow Step", "type": "action", "traits": ["arcane", "healing", "teleportation"], "cost": 1, "text": "Frequency twice per day%rEffect Avathrael teleports with the effects of a 4th-rank Translocate spell, but Avathrael must begin and end the teleportation effect in an area of dim light or darkness. If they use 2 actions to activate this ability, Avathrael also regains 8d10 healing Hit Points. Avathrael can't use Shadow Step again for 1d4 rounds."}, {"name": "Shape Shadow Realm", "type": "action", "traits": ["arcane", "concentrate", "shadow"], "cost": 2, "text": "Avathrael mentally reshapes their realm, reshaping terrain and creating obstacles to hinder their foes. All squares within a 50-foot become difficult terrain. Creatures in the area take 10d6 void|options:area-damage damage (DC 32 Reflex save) from the shadows. On a failure, that creature is additionally Grabbed by the malleable shadows (escape dc=32). At the beginning of Avathrael's turn, each creature that's grabbed takes 4d6 void damage. Avathrael can't use Shape Shadow Realm again for 1d4…"}, {"name": "Snuff Light", "type": "free", "traits": [], "text": "Frequency once per round%rEffect Avathrael exhales, automatically extinguishing all non-magical lights within 100 feet. Avathrael attempts to counteract each light source within 100 feet (+22 counteract)."}, {"name": "Woodland Stride", "type": "passive", "traits": [], "text": "Avathrael ignores difficult terrain and greater difficult terrain from non-magical foliage."}]
