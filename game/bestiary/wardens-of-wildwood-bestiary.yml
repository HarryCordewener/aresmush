  actions: [{"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Hunt Prey", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Alyce designates a single creature as her prey and focuses her attacks against that creature. She must be able to see, hear, or otherwise detect the prey, or she must be tracking the prey during exploration. She gains a +2 circumstance bonus to Perception checks when she Seeks her prey and a +2 circumstance bonus to Survival checks when she Tracks her prey. Alyce also ignores the penalty for making ranged attacks within her second range increment against the prey she's hunting. Alyce can only…"}, {"name": "Liberating Strike", "type": "reaction", "traits": [], "text": "Requirements Alyce is wielding a melee weapon%rTrigger A creature within Alyce's reach attempts to apply the Grabbed, Immobilized, or Restrained condition to an ally%rEffect Alyce makes a melee Strike against the triggering creature. If the attack is a hit, the triggering ally can immediately use a reaction to Escape. If the attack is a critical hit, any grabbed, immobilized, or restrained conditions imposed by the triggering action are negated."}]
