  actions: [{"name": "White Hairs", "type": "passive", "traits": [], "text": "An ohancanu has 2d4 #White Hairs white hairs that are connected to its essence. If a hair is plucked, the ohancanu gains the Drained 1 condition. This is cumulative with other drained conditions, and if plucking a hair would increase their drained value to 5 or more, the ohancanu falls Unconscious. A creature can Steal a white hair from an unaware ohancanu, though they always notice a successful theft. If an ohancanu is Grabbed, Restrained, or Stunned, a creature can attempt to pluck out a…"}, {"name": "Catch Rock", "type": "reaction", "traits": []}, {"name": "Covered In Bees!", "type": "passive", "traits": [], "text": "Dozens of bees sting the ohancanu, dealing 2d6 persistent piercing damage. The persistent damage ends automatically if the ohancanu takes 10 or more damage from an area effect."}, {"name": "Denuded Outrage", "type": "reaction", "traits": [], "text": "Trigger A creature plucks one of the ohancanu's white hairs%rEffect The ohancanu makes a fist Strike against the triggering creature. If the ohancanu is Grabbed or Restrained, they can instead attempt to Escape."}, {"name": "Sudden Charge", "type": "action", "traits": [], "cost": 2, "text": "The ohancanu strides twice. If they end their movement within melee reach of at least one enemy, they can make a melee Strike against that enemy."}, {"name": "Throw Rock", "type": "action", "traits": [], "cost": 1}]
