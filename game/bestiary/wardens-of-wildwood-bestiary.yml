  actions: [{"name": "Ghoran Memories", "type": "passive", "traits": [], "text": "Unaasi can Recall Knowledge on any subject with a +21 modifier."}, {"name": "Delicious", "type": "passive", "traits": [], "text": "Ghorans were originally created to be scrumptious food. A ghoran takes an additional 5 damage from jaws Strikes, fangs Strikes, or other similar Strikes with a creature's mouth. When a ghoran is Grabbed or Restrained by a creature's jaws, fangs, or mouth, the DC to Escape is increased by 2."}, {"name": "Explosive End", "type": "passive", "traits": ["primal", "wood"], "text": "When Unaasi dies, the planar portal inside them collapses, causing them to explode in a burst of scouring energy that deals 11d6 fire|options:area-damage damage to all creatures in their luminant aura (DC 32 Reflex save). Their body is completely consumed, leaving behind only their gear."}, {"name": "Luminant Aura", "type": "passive", "traits": ["aura", "light"], "text": "20 feet. The volatile planar energy coursing through a woodblessed's veins fills the area with dim light."}, {"name": "Reactive Flare", "type": "reaction", "traits": [], "text": "Trigger Unaasi is damaged by a creature within their reach%rEffect Unaasi temporarily loses control of the planar energy within them. Both they and the triggering creature take 6d6 fire damage (DC 30 Reflex save)."}, {"name": "Scouring Surge", "type": "action", "traits": ["fire", "primal"], "cost": 2, "text": "Unaasi unleashes the planar energy coursing through their body for a split-second, dealing 11d6 fire|options:area-damage damage (DC 30 Reflex save) to all creatures in their luminant aura. They can't use Scouring Surge again for 1d4 rounds."}, {"name": "Signature Spells", "type": "passive", "traits": [], "text": "Unaasi can heighten the following spells freely: Charm, Force Barrage, Resist Energy, Rip the Spirit, Soothe."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "Unaasi is a confident spellcaster and doesn't easily lose their focus. If a reaction would disrupt their spellcasting action, Unaasi attempts a DC 15 Flat. If they succeed, their action isn't disrupted."}, {"name": "Tap Planar Gate", "type": "action", "traits": ["concentrate", "primal"], "cost": 1, "text": "Unaasi taps into the planar energy surging through them, using this energy to empower themself or their next attack.%rIf their next action is to Stride, Unaasi is launched off the ground and propelled forward. During this Stride, they have a fly Speed equal to their Speed. If they don't end their movement on a solid surface that can support their weight, they fall. If their next action is to make a melee or ranged Strike, that Strike deals an additional 3d6 fire damage. If their next action is…"}]
