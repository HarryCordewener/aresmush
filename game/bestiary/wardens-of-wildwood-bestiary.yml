  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Axe Vulnerability", "type": "passive", "traits": [], "text": "An arboreal shepherd takes 5 additional damage from axes."}, {"name": "Defend the Friends", "type": "reaction", "traits": [], "text": "Trigger An animal within the arboreal shepherd's reach takes area damage or splash damage from an effect%rEffect The arboreal shepherd partly shields the creature. Reduce the damage dealt to the animal by an amount equal to 1d10 #Reduced Damage + the animal's weakness to the effect, if any. The arboreal shepherd takes an equal amount of damage."}, {"name": "Exalt the Little Ones", "type": "action", "traits": ["auditory", "linguistic", "primal"], "cost": 1, "text": "The arboreal shepherd encourages its friends to overcome titanic odds. For 1 round, allies with the animal trait in a 50-foot radius gain a +1 status bonus to attack rolls, damage rolls, and saving throws. If the animals have the swarm trait, the saving throw DCs to resist their damaging actions gain a +1 status bonus. This bonus increases to +2 for allies whose level is 2 or lower.%rEffect: Exalt the Little Ones"}, {"name": "Healing Haven", "type": "action", "traits": ["healing", "manipulate"], "cost": 1, "text": "Frequency Once per hour%rEffect The arboreal shepherd scoops up a willing Medium or smaller animal (or animal with the swarm trait) within its reach, sequestering the animal into a recess in the arboreal's trunk. While sequestered, the animal cannot act, gains greater cover, and gains fast healing 5. At the beginning of its turn after regaining Hit Points, the animal can choose to exit by reappearing in any space adjacent to the arboreal as a free action."}]
