  actions: [{"name": "Form Up", "type": "action", "traits": [], "cost": 1}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 40 (3 segments), 20 (2 segments)"}, {"name": "Hurl Axes", "type": "action", "traits": [], "cost": 2, "text": "The loggers draw their hatchets, then launch a ranged attack in the form of a volley. This volley is a 10-foot within 120 feet that deals 3d6 slashing|options:area-damage damage (DC 18 Reflex save). When the crew is reduced to 8 or fewer squares, this area decreases to a 5-foot."}, {"name": "Tandem Chop", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The loggers engage in a coordinated axe attack against each enemy within 10 feet, with a DC 19 Reflex save. The damage depends on the number of actions expended.%r1 1d10 slashing damage%r2 (3d6+7) slashing damage%r3 (3d6+10) slashing damage"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever the loggers Stride, they first Form Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then move up to their Speed. This works just like a Gargantuan creature moving; for instance, if any square of the logging crew enters difficult terrain, the extra movement cost applies to all the loggers."}]
