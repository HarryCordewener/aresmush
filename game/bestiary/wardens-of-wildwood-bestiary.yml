  actions: [{"name": "Shaped Tongue", "type": "passive", "traits": [], "text": "The speaker in spores can speak with all plants and the creature they resemble."}, {"name": "Spore Matrix", "type": "passive", "traits": ["aura", "mental", "primal"], "text": "60 feet.%rThe speaker in spores is surrounded by a strong concentration of spores. The speaker can communicate telepathically to any creatures in the aura who have breathed in their spores. This communication always uses the listener's native language and can't be used with a creature that doesn't breathe."}, {"name": "Sporesight (Imprecise) 120 feet", "type": "passive", "traits": [], "text": "The speaker in spores can see through spores drifting in the air, ignoring cover. This is an imprecise sense and functions only in areas without strong wind currents. Sporesight doesn't function underwater."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Blight Walker", "type": "passive", "traits": [], "text": "The speaker in spores recovers from the Paralyzed, Slowed, and Stunned conditions at the end of their turn. They're also immune to penalties to their Speeds and ignore cover, concealment, difficult terrain, and greater difficult terrain resulting from plants or fungi."}, {"name": "Toxic Spores", "type": "reaction", "traits": [], "text": "Trigger A creature critically hits the speaker or the speaker dies%rEffect The blighted speaker in spores releases a burst of toxic spores. Any creature within 10 feet of the speaker in spores takes 3d6 poison damage (DC 31 Fortitude save). Creatures that fail their saving throw are exposed to Ayrzul's Blight."}, {"name": "Accelerate Decay", "type": "action", "traits": ["primal", "void"], "cost": 2, "text": "The speaker in spores unleashes void energy that forces desiccation in a 30-foot. Each living creature in the area takes 14d6 void|options:area-damage damage (DC 33 Fortitude save). Creatures afflicted by a disease take a –2 circumstance penalty to this save.%rAll Small or smaller non-magical plant life (though not plant creatures) in the area wither and die, eliminating any cover or concealment and leaving difficult terrain in their wake.%rThe speaker in spores is immune to this effect and…"}, {"name": "Ayrzul's Blight", "type": "passive", "traits": ["disease", "earth", "primal"], "text": "Radioactive elemental energy courses through sap and blood, petrifies bark and bone, withers flesh, and mutates life. Creatures with the wood or plant trait treat critical successes against the disease as successes. The drained condition caused by Ayrzul's Blight can't be healed until the disease is removed. Ayrzul's Blight presents with obvious but varying symptoms, from coughing up black dust to suddenly becoming covered in itchy patches of flaky stone.%rSaving Throw DC 33 Fortitude%rOnset 1…"}]
