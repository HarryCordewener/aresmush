  actions: [{"name": "Green Tongue", "type": "passive", "traits": [], "text": "A green man can communicate with plants, with the effects of Speak with Plants, and can use Diplomacy to make-an-impression on plants and request things from plants."}, {"name": "Plantsense 60 feet", "type": "passive", "traits": [], "text": "A green man can sense life force via plants. This allows them to observe a living or undead creature's vital essence within 60 feet of the green man, but they can also use this precise sense to observe any living or undead creature within 60 feet of any plant matter within 120 feet of the green man. This allows the green man to see living things through solid plant matter, as well as seeing through other barriers if there are plants on the other side."}, {"name": "Axe Vulnerability", "type": "passive", "traits": [], "text": "A green man takes 20 additional damage from axes."}, {"name": "Green Caress", "type": "passive", "traits": ["aura", "incapacitation", "plant", "primal"], "text": "60 feet. Living creatures in the area other than plants slowly transform into non-creature plants. The green man can exclude creatures from this effect, but they must be aware of a creature's presence and location to do so. A non-plant creature in the area must attempt a DC 45 Fortitude save immediately before the start of its turn.%rCritical Success The creature is unaffected, or if it is slowed by green caress, it reduces its slowed value by 2.%rSuccess The creature is unaffected, or if it is…"}, {"name": "Root In Place", "type": "reaction", "traits": [], "text": "Trigger A creature within the green man's reach uses a move action or leaves a square during a move action it's using%rEffect The green man lashes out to hold the foe in place. The green man makes a vine Strike against the triggering creature. If the attack hits, the green man disrupts the action. If the creature was Flying when its action was disrupted, it falls."}, {"name": "Absorb Magic", "type": "action", "traits": [], "cost": 1, "text": "The green man's vines leach away magic and transform it into life essence for the green man. On a successful vine Strike, the green man attempts to counteract one spell active on the target (typically one vexing the green man, or determined randomly if they aren't aware of specific effects), with a counteract rank of 10 and a modifier of +38.%rIf the effect is counteracted, the green man gains 30 temporary Hit Points that last for 10 minutes."}, {"name": "Aura of Absorption", "type": "passive", "traits": ["aura", "fungus", "primal"], "text": "120 feet.%rZibik constantly absorbs toxins and pathogens from his surroundings. Zibik automatically absorbs afflictions from non-creature plants, increasing his drained value by 1 each round he absorbs any afflictions from such plants (with no maximum). Living creatures in the area can attempt a saving throw against any disease or poison afflicting them each round, increasing their degree of success for the save by one step. If a creature succeeds, Zibik automatically counteracts the affliction…"}, {"name": "Embed", "type": "passive", "traits": [], "text": "The green man's thorns embed themselves into any creature they damage, taking root into the ground. A target damaged by a thorn has its Speeds halved, and it can't Step, Fly, Air Walk, or otherwise leave the ground until the thorn is removed.%rRemoving a thorn requires 3 Interact actions, which don't have to be consecutive. If the creature performing the final action doesn't succeed at a DC 45 Medicine check as part of that action, the target takes 10d6 untyped damage upon the thorn's removal."}, {"name": "Focus Vines", "type": "action", "traits": [], "cost": 2, "text": "The green man focuses all their vines against a single vexing foe, making a single vine Strike.%rOn a success, the target takes 5d10 additional damage and is affected by Absorb Magic three times. Even on a failure, the target takes the normal effects of a hit with a vine Strike, but on a critical failure, the vines miss completely."}, {"name": "Fungal Rebirth", "type": "passive", "traits": ["fungus", "primal"], "text": "When Zibik dies as the result of a disease or his Aura of Absorption, fungus rebuilds his body over the course of 3d6 days. If his body is destroyed before then, the process restarts.%rWhen restored to life, he's bolstered by primal might; he gains a +3 circumstance bonus to saving throws against diseases for a number of weeks equal to the number of days it took his body to regrow, and he's unaffected by the drained condition for the same duration (though he can still gain the condition)."}, {"name": "Green Grab", "type": "passive", "traits": [], "text": "A green man can use their Improved Grab action against a creature of any size."}, {"name": "Green Rituals", "type": "passive", "traits": [], "text": "A green man can perform all their rituals without secondary casters, relying on their own primal ties to the vital essence in spirits of nature.%rA green man's Awaken Animal and Primal Call rituals work on plants instead of their usual range of choices.%rMost green men also know the ritual to create various types of leshys and possibly even magic allowing the creation of arboreals or more powerful plant creatures."}, {"name": "Purge Plaguebearers", "type": "action", "traits": ["fungus", "primal"], "cost": 2, "text": "Zibik exudes a cloud of spores in a 30-foot-radius emanation. They cling to all creatures currently afflicted with any disease in the area. Afflicted creatures take 25d6 void damage with a DC 48 Fortitude save.%rA creature that fails its save becomes Doomed 1 for 1 minute and Sickened 3. Zibik can choose to exclude any number of creatures in the area from this effect.%rZibik can't use Purge Plaguebearers again for 1d4 rounds."}, {"name": "Vine Forest", "type": "action", "traits": [], "cost": 2, "text": "The green man lashes out with all six vines to attack many opponents. They make up to six vine Strikes, each against a different target; this counts as one attack for their multiple attack penalty, increasing only after all the attacks are made."}, {"name": "Improved Grab", "type": "free", "traits": []}]
  spellcasting: [{"name": "Primal Innate Spells", "tradition": "primal", "type": "innate", "dc": 48, "attack": 40, "spells": {"0": ["Detect Magic", "Read Aura"], "8": ["Desiccate", "Life-Draining Roots", "Unfettered Movement"], "9": ["Energy Aegis", "Entwined Roots"], "10": ["Flourishing Flora", "Heal", "Nature's Pathway (At Will)", "Regenerate", "Truesight"]}}]
