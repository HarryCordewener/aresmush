  actions: [{"name": "Spore Telepathy", "type": "passive", "traits": ["aura", "mental"], "text": "60 feet. A crowded veil communicates telepathically via spores. It can communicate telepathically with any creatures who are within its aura."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "One Mind", "type": "passive", "traits": [], "text": "A crowded veil is an individual creature that shares one mind with all other crowded veils. What one crowded veil experiences, all experience. If a crowded veil gains any conditions, all other crowded veils know this; they also know the direction to every other crowded veil and the distances between them. A crowded veil can communicate instantly and telepathically with any other crowded veil on the same planet. To crowded veils located on other planets, messages can take up to an hour or more…"}, {"name": "Crowded Veil Spores", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 34%rMaximum Duration 6 rounds%rStage 1 Stupefied 1 (1 round)%rStage 2 4d8 poison damage and Stupefied 2 (1 round)%rStage 3 4d8 poison damage and Stupefied 3 (1 round)%rStage 4 4d8 poison damage and Unconscious (1 round)"}, {"name": "Spore Trail", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "A crowded veil shudders, releasing toxic spores. Until the end of their turn, when the clouded veil moves, all spaces they leave are filled with spores. These spore trails persist until the start of the clouded veil's next turn, and can be dispersed immediately by wind in the area. The first time in a round when a creature enters this spore trail, that creature is exposed to crowded veil spores."}]
