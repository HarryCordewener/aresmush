  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 30 (Deactivated by Acid, Cold, or Fire)", "type": "passive", "traits": []}, {"name": "Purity Vulnerability", "type": "passive", "traits": [], "text": "Vamollaroth revels in the foulness he exudes and becomes distraught when contaminations are purified. The first time in a round when a contamination is purified (such as via Cleanse Cuisine) or a toxin is counteracted (such as via Cleanse Affliction) with 30 feet of him, Vamollaroth takes 8d6 mental damage."}, {"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "60 feet. Vamollaroth exudes an almost physical reek. A creature entering the aura or starting its turn in the aura must succeed at a DC 41 Fortitude save or become Sickened 2 (plus Slowed 1 for as long as it's sickened on a critical failure). While within the aura, affected creatures take a –2 circumstance penalty to saves against poison and to recover from the sickened condition. A creature that succeeds at its save is temporarily immune for 1 minute.%rEffect: Vamollaroth Stench"}, {"name": "Song of the Swamp", "type": "action", "traits": ["auditory", "emotion", "mental", "primal"], "cost": 1, "text": "Frequency once per 10 minutes%rEffect The mobogo unleashes a booming croak. All boggards and mobogos within 50 feet gain a +2 status bonus to damage rolls and saves against fear for 1 round. Other creatures in the area of effect must attempt a DC 44 Will save.%rSuccess The creature is unaffected and is temporarily immune for 24 hours.%rFailure The creature is Slowed 1 for 1d4 rounds.%rCritical Failure The creature is Slowed 2 for 1d4 rounds.%rEffect: Song of the Swamp"}, {"name": "Spew Pollution", "type": "action", "traits": ["poison", "primal"], "cost": 2, "text": "Vamollaroth spews a foul slurry of pollution and toxic sludge in a 60-foot cone. Creatures in the