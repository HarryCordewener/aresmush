  actions: [{"name": "Dragon Bonded", "type": "passive", "traits": [], "text": "Captain Talymir is immune to Ulugurnix's frightful presence aura, Poison Breath, and stench aura. If Ulugurnix is destroyed, Captain Talymir becomes infuriated. He deals 2 additional damage on melee Strikes and becomes Quickened for 3 rounds; he can use the extra action to Stride or Strike."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Sacrilegious Aura", "type": "passive", "traits": ["aura", "divine", "void"], "text": "30 feet. When a creature in the aura uses a vitality spell or ability, the graveknight automatically attempts to counteract it, with a counteract modifier of +18."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Devastating Blast", "type": "action", "traits": ["arcane", "cold"], "cost": 2, "text": "The graveknight unleashes a 30-foot of energy. Creatures in the area take 12d6 cold|options:area-damage with a DC 30 Reflex. The graveknight can use this ability once every 1d4 #Recharge Devastating Blast rounds."}, {"name": "Graveknight's Curse", "type": "passive", "traits": ["arcane", "curse"], "text": "This curse affects anyone who wears a graveknight's armor for at least 1 hour%rSaving Throw DC 34 Will save%rOnset 1 hour%rStage 1 Doomed 1 and can't remove armor (1 day)%rStage 2 Doomed 2, –10-foot status penalty to Speeds, and can't remove armor (1 day)%rStage 3 dies and transforms into the armor's graveknight."}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "The graveknight has access to the critical specialization effects of any weapons it wields."}]
