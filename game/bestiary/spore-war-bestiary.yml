  actions: [{"name": "Mosquito Aura", "type": "passive", "traits": ["aura", "primal"], "text": "30 feet. Mosquitoes surround the blight. The mosquitoes ignore creatures the blight designates as allies as well as any who are at full HP. All other creatures who enter the aura or begin their turn within it take 2d6 persistent bleed damage with a DC 35 Fortitude save.%rCritical Success The creature takes no damage.%rSuccess The creature takes half damage.%rFailure The creature takes full damage and is Sickened 1.%rCritical Failure The creature takes double damage and is Sickened 2."}, {"name": "Fast Healing 30", "type": "passive", "traits": []}, {"name": "Putrefied Expulsion", "type": "reaction", "traits": [], "text": "Trigger A creature within 20 feet of the swamp blight deals damage to the blight%rEffect The swamp blight violently expels putrefied organic matter at their attacker, making a decaying flesh Strike against them."}, {"name": "Blight Domination", "type": "passive", "traits": [], "text": "All blights can cast Dominate as an innate primal spell but can target only animals, beasts, fungi, oozes, plants, or undead that are located inside their cursed domain. If a creature dominated by this spell leaves the cursed domain, the effects of dominate immediately end, but as long as the dominated creature remains in the cursed domain, the duration is unlimited. When a blight targets a mindless fungi, ooze, or plant, its dominate spell loses the mental trait."}, {"name": "Call of the Mire", "type": "action", "traits": ["incapacitation", "mental", "primal"], "cost": 1, "text": "Frequency once per round%rEffect An aura of glittering lights surrounds the swamp blight, compelling a target the swamp blight can see that's within 60 feet to move toward it. This is not forced movement and can compel creatures to move through dangerous terrain. The target must attempt a DC 38 Will save.%rCritical Success The creature is temporarily immune to Call of the Mire for 1 hour.%rSuccess The target immediately Strides or otherwise uses their fastest Speed to approach the swamp blight.…"}, {"name": "Cursed Domain", "type": "passive", "traits": ["curse", "primal", "void"], "text": "Humanoid creatures that die in a swamp blight's cursed domain are infused with void energy. After 24 hours, they rise as undead creatures of their level of lower. Creatures whose bodies were intact typically become zombies or mummies, while those whose bodies were severely damaged typically rise as shadows or bhutas. These undead are not automatically under the swamp blight's direct control, but they can potentially be dominated by the swamp blight.%rOnce per year, when in a terrain that is…"}, {"name": "Oversee Domain", "type": "action", "traits": ["concentrate", "primal"], "cost": 1, "text": "The blight projects its senses to any point in its cursed domain, gaining a precise sense of its surroundings with a 500-foot radius until the end of its next turn. A blight can cast Dominate through this sensory link. A blight can Sustain this ability, but cannot use it to extend its senses beyond the edges of its domain."}, {"name": "Rejuvenation", "type": "passive", "traits": ["primal"], "text": "If a blight is slain within its cursed domain, its body melts into the surrounding environment and a new blight of the same type spontaneously forms in 1d10 days at the cursed domain's epicenter unless the curse is removed before then. The new blight retains all the memories of the previous blight."}, {"name": "Splatter Viscera", "type": "passive", "traits": [], "text": "Targets hit by a decaying flesh Strike must succeed at a DC 40 Fortitude save or be Sickened 1 (Sickened 2 on a critical failure). This condition is cumulative with itself and with the sickened condition from the mosquito aura, up to a maximum value of Sickened 4. If the Strike critically hits, the target also takes 2d6 persistent acid damage."}]
