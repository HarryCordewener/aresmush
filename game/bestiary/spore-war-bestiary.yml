  actions: [{"name": "All-Around Vision", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Exposure Vulnerability", "type": "passive", "traits": [], "text": "The first time each round that a creature critically succeeds at a save against a degholau's Veil of Lies or that a creature confronts the fiend on a falsehood immediately after the demon fails to Lie, the degholau takes 3d6 mental damage and becomes Frightened 1."}, {"name": "Conspiratorial Thoughts", "type": "passive", "traits": ["divine", "mental", "poison"], "text": "Saving Throw DC 33 Will%rMaximum Duration 6 rounds%rStage 1 Slowed 1 (1 round)%rStage 2 Slowed 2 (1 round)%rStage 3 Controlled by the degholau (1 round)"}, {"name": "Twisted Loyalties", "type": "passive", "traits": ["curse"], "text": "Saving Throw DC 33 Will%rOnset 1 day%rStage 1 +1 status bonus to attack rolls and damage rolls, must succeed at a DC 10 Flat to use the Aid reaction (3 days)%rStage 2 as stage 1, and +1 status bonus to skill checks, plus must succeed at a DC 10 Flat to heal an ally (1 week)%rStage 3 as stage 2, plus lose sanctification traits (1 week)%rStage 4 anathemas are now edicts, and former edicts are now anathemas—acting upon these new edicts causes loss of abilities and sanctification granted by classes…"}, {"name": "Veil of Lies", "type": "passive", "traits": ["aura", "mental", "olfactory"], "text": "15 feet. A degholau exudes a faint scent of rotting wildflowers in its aura—an odor that dulls the mind. A creature that ends its turn in the aura must attempt a DC 30 Will save.%rCritical Success The creature is unaffected and is temporarily immune to Veil of Lies for 1 minute.%rSuccess The creature is unaffected.%rFailure The creature is Stupefied 1 while it remains in the aura and for 10 minutes after leaving the aura.%rCritical Failure As failure, except Stupefied 2."}]
