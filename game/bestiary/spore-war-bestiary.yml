  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Exorcism Vulnerability", "type": "passive", "traits": [], "text": "If an invidiak attempts to possess a creature and the creature rolls a critical success on its saving throw to resist Possession, or if an invidiak's possession of a creature is ended prematurely, such as via a successful Dispel Magic, the invidiak takes 9d6 mental damage and cannot use possession for 24 hours.%rSee Iravalinn's Fight for Control reaction."}, {"name": "Share Pain", "type": "reaction", "traits": ["illusion", "mental", "nonlethal"], "text": "Trigger A creature within 30 feet of the invidiak deals damage to the invidiak%rEffect An echo of the invidiak's pain lashes out at the triggering creature, dealing an amount of nonlethal mental damage equal to half the damage the invidiak took from the triggering attack (DC 33 Will save). On a critical failure, the target is Sickened 1."}, {"name": "Favored Host", "type": "passive", "traits": [], "text": "Vixivax's favored hosts are elves.%rEach invidiak has a type of creature they prefer possessing, chosen from aberration, animal, beast, or any humanoid (such as dwarf, elf, or human)—in most cases, the favored type of target is human. When an invidiak casts possession on a favored host, the duration of possession increases to unlimited, and the effect lasts until dispelled or until the invidiak dismisses it."}, {"name": "Shadow Blend", "type": "action", "traits": ["divine", "illusion"], "cost": 2, "text": "The invidiak Strides up to twice their speed. If the invidiak ends their movement in an area of dim light, they become hidden as long as they don't move and the lighting in the area they're in doesn't grow brighter than dim light."}, {"name": "Unbodied Possession", "type": "passive", "traits": [], "text": "Vixivax leaves no body behind when using Possession."}]
