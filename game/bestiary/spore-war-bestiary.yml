  actions: [{"name": "Bound", "type": "passive", "traits": [], "text": "Bound to the interior of Deathstalk Tower.%rBhutas are bound to a natural area or feature where they died and must remain within 120 feet of that anchor. A bhuta can only leave if invited to travel with living companions, an invitation bhutas often seek to obtain via trickery. While traveling, the bhuta must remain within 120 feet of at least one of the living creatures who invited them. If all members of the group die, the bhuta must return to their bound area by midnight the same day or be…"}, {"name": "Shadowless", "type": "passive", "traits": [], "text": "A bhuta casts no shadow."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The bhuta takes the form of a Large, Medium, or Small bat, insect, or arachnid.. This doesn't change the bhuta's Speed or attack and damage modifiers with their Strikes but might change the damage type their Strikes deal. No matter what form the bhuta takes, their feet remain backward and they cast no shadow. A bhuta in animal form is still incorporeal, though that isn't obvious just by looking at it."}, {"name": "Ectoplasmic Lash", "type": "action", "traits": ["divine"], "cost": 2, "text": "Frequency once per day%rEffect The bhuta lashes out with one of the strands of ectoplasm that keep it linked to Deathstalk Tower, inflicting 13d6 spirit damage to all living creatures of the bhuta's choice within 15 feet (DC 32 Will save)."}, {"name": "Primal Corruption", "type": "passive", "traits": [], "text": "A bhuta corrupts wildlife near their bound area, worming their way into animals' minds. Animals who live within the bound area take a -4 circumstance penalty to saves against the bhuta's Possess Animal ability, the bhuta's Charm innate spell, and the bhuta's Command innate spell."}]
