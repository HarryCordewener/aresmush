  actions: [{"name": "Fungalsense", "type": "passive", "traits": [], "text": "A spore tyrannosaur in contact with fungal corruption can sense the nearby motion of anything touching the same patch of fungal corruption."}, {"name": "Aura of Spores", "type": "passive", "traits": ["aura", "fungus", "primal"], "text": "30 feet. Creatures that start their turn in the spore tyrannosaurus's aura are in danger of inhaling the toxic spores that it constantly exudes. Creatures without the fungus or plant trait take 4d6 poison|options:area-damage damage (DC 30 Fortitude save) upon entering the aura or starting their turn in the aura. Those who fail are also Sickened 1 by the spores."}, {"name": "Fungal Empowerment", "type": "passive", "traits": [], "text": "While the spore tyrannosaurus is touching fungal corruption, it gains fast healing 10 and is Quickened; it can use the extra action to Stride or Strike."}, {"name": "Fling", "type": "action", "traits": [], "cost": 1, "text": "Requirements A creature is Grabbed in the tyrannosaurus's jaws%rEffect The tyrannosaurus flings the creature into the air up to 10 feet up from its mouth and 20 feet away. The creature falls 25 feet (assuming the tyrannosaurus flings it as high as it can) and takes falling damage accordingly. If the flung creature lands on another creature, the creature it lands on takes the same amount of bludgeoning damage. The creature being landed on can attempt a DC 33 Reflex save."}, {"name": "Pin Prey", "type": "reaction", "traits": [], "text": "Trigger The tyrannosaurus critically hits a Large or smaller foe with its foot%rEffect The creature struck by the foot is knocked Prone and held in place. As long as the tyrannosaurus doesn't move from its position, the pinned creature is Grabbed.%rA tyrannosaurus gains a +2 circumstance bonus to attack a creature it has pinned in this manner but can only Swallow Whole if that creature is grabbed with its jaws."}, {"name": "Spore Breath", "type": "action", "traits": ["fungus", "poison", "primal"], "cost": 2, "text": "The spore tyrannosaurus unleashes a 60-foot cone of highly toxic spores from its maw. Creatures in the area take 14d6 poison|options:area-damage damage (DC 33 Fortitude save). Those who fail are also Sickened 1 (or Sickened 2 on a critical failure). The fungal tyrannosaurus can't use the spore breath weapon again for 1d4 rounds."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Medium, (3d6) bludgeoning,3d6 poison damage, Rupture 32"}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Huge or smaller, foot, DC 30 Reflex"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
