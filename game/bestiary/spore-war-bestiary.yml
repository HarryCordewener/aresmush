  actions: [{"name": "Telepathy 100 Feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Death-Stealing Gaze", "type": "passive", "traits": ["aura", "divine", "visual"], "text": "30 feet. When a non-demon ends its turn in the aura, it must attempt a DC 38 Fortitude save. If it fails, it becomes Drained 1.%rA creature that dies while it has drain from a vrolikai's gaze rises as a ghoul the next midnight. The GM determines what kind of ghoul."}, {"name": "Black Spore Knives", "type": "action", "traits": ["divine", "unholy"], "cost": 1, "text": "Ziberae manifests a sickle-shaped blade of what looks like seething black fungus in four of her hands (or three of them if she's wielding his apotheosis knife in one hand). These weapons function as +2 greater striking daggers that deal an additional 2d6 poison damage. On a critical hit, the additional poison damage inflicted by a black spore knife is persistent poison damage. They fade away into nothingness 1 minute after Ziberae no longer carries them."}, {"name": "Consume Death", "type": "action", "traits": ["concentrate", "divine", "visual"], "cost": 1, "text": "The vrolikai focuses their deathstealing gaze upon a single target they can see within 30 feet. The target must immediately attempt a Fortitude save against death-stealing gaze.%rSuccess The creature is unaffected.%rFailure The creature is affected by death-stealing gaze and becomes Drained 1. If the creature was already drained 1 by the death-stealing gaze before attempting the save, a failed save increases the value of the drained condition by 1, to a maximum of Drained 4. The vrolikai gains…"}, {"name": "Focused Apotheosis", "type": "action", "traits": [], "cost": 2, "text": "Zibrerae attacks a single target with all of their black spore knives. The demon makes a black spore knife Strike with the following additional effects. This counts toward Zibrerae's multiple attack penalty as a number of attacks equal to the number of back spore knives Zibrerae used.%rZiberae can use her apotheosis knife in place of one of her black spore knives. When she does so, she attacks with her apotheosis knife Strike instead of a black spore knife Strike.%rCritical Success The target…"}, {"name": "Mindwarping", "type": "passive", "traits": ["emotion", "mental"], "text": "The sting of a vrolikai is mind-warping. A creature struck must attempt a DC 44 Will save.%rCritical Success The creature is unaffected.%rSuccess The creature becomes Stupefied 1 for 1 minute.%rFailure The creature becomes stupefied 1. If it's already stupefied, its stupefied value increases by 1 instead (to a maximum of Stupefied 4).%rCritical Failure As failure, plus the creature is Confused for 1 minute."}]
