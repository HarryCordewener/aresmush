  actions: [{"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 27 Will"}, {"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "10 feet. DC 27 Fortitude"}, {"name": "Twisting Tail", "type": "reaction", "traits": [], "text": "Trigger A creature within reach of the dragon's tail uses a move action or leaves a square during a move action it's using%rEffect The dragon makes a tail Strike at the creature with a –2 penalty. If the Strike hits, the dragon disrupts the creature's action."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consume Flesh", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The ghoul is adjacent to the corpse of a creature that died within the last hour.%rEffect The ghoul devours a chunk of the corpse and regains 6d6 healing Hit Points.%rIt can regain Hit Points from any given corpse only once."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "The dragon makes two claw Strikes and one horn Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "The dragon recharges their Poison Breath whenever they score a critical hit with a Strike."}, {"name": "Forest Passage", "type": "passive", "traits": [], "text": "The horned dragon ignores any difficult terrain caused by plants, such as bushes, vines, and undergrowth. Even plants manipulated by magic don't impede their progress."}, {"name": "Ghoul Whispers", "type": "action", "traits": ["auditory", "linguistic", "occult"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, or Unconscious creature is within the ghoul's reach%rEffect The ghoul whispers dark thoughts and vile cravings into the creature's ears. The creature must save against the forbidden cravings curse.%rForbidden Cravings (curse) A creature can still eat and drink while sickened by this curse%rSaving Throw DC 30 Will, using the high spell DC for the ghoul's level%rStage 1 carrier with no ill effects (1 day)%rStage 2 2d6 void damage and the target is…"}, {"name": "Grave Knowledge", "type": "passive", "traits": ["occult"], "text": "Frequency once per hour%rEffect The ghoul calls upon knowledge it retains from one creature it has consumed in the past 7 days. The ghoul attempts a skill check using a skill in which the consumed creature was trained (if it's unclear whether the creature was trained, the GM decides). The ghoul is treated as trained and uses a +23 modifier. This takes the same amount of actions or time as usual for the check.%rThe ghoul can instead automatically learn something specific known by a creature it…"}, {"name": "Impaling Charge", "type": "action", "traits": [], "cost": 2, "text": "Requirements The dragon doesn't have a creature impaled on their horn%rEffect The dragon attempts to gore a foe. They Stride, then attempt a horn Strike. On a hit, the target becomes impaled on the dragon's horn. The creature is Grabbed while on the horn (and can attempt to Escape as normal). The dragon doesn't need to use additional actions to keep the impaled creature grabbed. If the dragon moves, they bring the grabbed creature along with them."}, {"name": "Poison Breath", "type": "action", "traits": ["poison", "primal"], "cost": 2, "text": "Ulugurnix breathes a toxic cloud that deals 12d6 poison|options:area-damage damage in a 40-foot cone (DC 30 Fortitude save). He can't use Poison Breath again for 1d4 rounds."}]
