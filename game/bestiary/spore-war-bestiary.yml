  actions: [{"name": "Tremorsense (Imprecise) 60 feet", "type": "passive", "traits": []}, {"name": "Miasma", "type": "passive", "traits": ["aura", "disease", "primal"], "text": "20 foot. DC 37 Fortitude.%rA creature that enters the aura or begins its turn there becomes Sickened 2 on a failure (or Sickened 4 on a critical failure). An animal, fey, or plant that rolls a failure gets a critical failure instead. Regardless of the result of the saving throw, the creature is temporarily immune to the siabrae's miasma for 1 minute."}, {"name": "Rejuvenation", "type": "passive", "traits": ["primal"], "text": "When a siabrae is destroyed, they can attempt a DC 10 Flat (they automatically succeed if they're standing on blighted or diseased terrain, and automatically fail if they're standing on sacred ground). If the flat check succeeds, the siabrae's body crumbles to dust and absorbs into the earth. After 1d10 days, the siabrae's body reforms from a mass of unworked stone large enough to create a new body; this stone is in a random location within 1d10 miles of where the siabrae was destroyed. The…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Blight Mastery", "type": "passive", "traits": [], "text": "Any of the siabrae's spells or effects that would normally be restricted to affecting animals can also affect undead animals. Furthermore, any animals the siabrae takes the form of or summons appear to be diseased, malnourished, or even dead and rotting. (This doesn't affect their statistics.)"}, {"name": "Earth Glide", "type": "passive", "traits": [], "text": "The siabrae can Burrow through any earthen matter, including rock. When it does so, the siabrae moves at its full burrow Speed, leaving no tunnels or signs of its passing."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt the siabrae's spellcasting action, the siabrae attempts a DC 15 Flat. On a success, the action isn't disrupted."}, {"name": "Stony Shards", "type": "passive", "traits": ["curse", "earth", "incapacitation", "primal"], "text": "Tiny shards break off the siabrae's antlers when they attack, lodging in the target's wounds and inflicting a terrible curse. A creature damaged by a siabrae's stone antlers Strike must succeed at a DC 37 Fortitude save or become Clumsy 2 for 1d4 rounds on a failure. If the creature critically fails, or fails while already clumsy 2 or greater, the creature is petrified."}]
