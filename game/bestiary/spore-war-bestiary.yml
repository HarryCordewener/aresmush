  strikes: [{"name": "Jaws", "bonus": 34, "damage": [["2d6", "poison", null], ["3d10+17", "piercing", null]], "traits": ["deadly-d10", "magical", "unarmed"], "effects": ["Grab"]}]
  actions: [{"name": "Lifesense 30 feet", "type": "passive", "traits": []}, {"name": "Meant to Live", "type": "passive", "traits": ["occult"], "text": "Whenever an unrisen would take damage from vitality energy, it instead heals half that number of Hit Points."}, {"name": "Reactive Strike (Special)", "type": "reaction", "traits": [], "text": "The unrisen Slithermaw gains 12 extra reactions per round beyond its first, which it can only use to make Reactive Strikes. He can't use more than 1 reaction on the same triggering action, even if a creature leaves several squares on the same triggering action."}, {"name": "Resurrection Vulnerability", "type": "passive", "traits": [], "text": "A creature with a prepared or spontaneous spell that can restore the dead to life (such as Breath of Life or Raise Dead) can expend an appropriate spell slot as a 2-action activity to destroy an unrisen within 30 feet. The attempt fails if the unrisen succeeds at a Will save against the creature's spell DC."}, {"name": "Rise Again", "type": "passive", "traits": ["occult"], "text": "If the unrisen Slithermaw is reduced to 0 Hit Points by means other than fire damage, disintegration, damage caused by a character wearing Slithermaw's Bane, or his resurrection vulnerability, he returns to unlife at the start of his next turn. He has 150 Hit Points and is Prone in the space in which he was destroyed. He can't be returned to unlife by this ability again for 1 hour."}, {"name": "Slithermaw's Bane", "type": "passive", "traits": [], "text": "If a PC wears Slithermaw's Bane , the unrisen Slithermaw focuses his attacks on that PC. A PC who wears Slithermaw's Bane is immune to all poison damage caused by the unrisen Slithermaw. Whenever such a PC scores a critical hit on the unrisen Slithermaw, the undead hydra becomes Frightened 2. The unrisen Slithermaw is not immune to poison inflicted by Slithermaw's Bane when Calistria's Sting is activated and in fact has weakness 15 to this poison damage."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Awful Approach", "type": "action", "traits": [], "cost": 1, "text": "The unrisen reshapes its grotesque form to move swiftly. It Strides twice. Any living creature that can see the unrisen during this movement must succeed at a DC 37 Fortitude save or be Sickened 1 (Sickened 2 on a critical failure). This is a mental and visual effect. The unrisen can't use Awful Approach again for 1d4 rounds."}, {"name": "Death Grip", "type": "action", "traits": ["curse", "occult"], "cost": 1, "text": "Requirements The unrisen has a living creature Grabbed or Restrained%rEffect The unrisen attempts to destroy its victim's life force to share the unrisen's fate. The creature must succeed at a DC 40 Fortitude save or become Doomed 1. While the curse lasts, the creature regains only half as many HP from vitality healing effects; if it dies, any attempt to raise it from the dead causes it to return as an unrisen. The curse ends automatically if the creature's doomed value is reduced to 0."}, {"name": "Poisonous Breath", "type": "action", "traits": ["occult", "poison"], "cost": 2, "text": "The unrisen Slithermaw breathes out a toxic cloud of foul vapor from its heads in all directions at once. Creatures within a 30-foot emanation take 15d8 poison|options:area-damage damage (DC 40 Fortitude save). The unrisen Slithermaw can't use Poisonous Breath again for 1d4 rounds."}, {"name": "Storm of Jaws", "type": "action", "traits": [], "cost": 2, "text": "The unrisen Slithermaw makes up to 12 jaws Strikes, each against a different target. These attacks count toward his multiple attack penalty, but the multiple attack penalty doesn't increase until after he makes all of his attacks."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
