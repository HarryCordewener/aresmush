re Sickened 1. Creatures can't remove the sickened condition while…"}, {"name": "Wreck", "type": "action", "traits": [], "cost": 1, "text": "Lukarazyll makes two claw Strikes against an unattended object, wrenching and gouging it while infesting it with tendrils of fungus. If both Strikes hit, combine their damage for the purpose of overcoming its Hardness. These Strikes don't count toward Lukarazyll's multiple attack penalty, nor does that penalty apply to these strikes. If the object is destroyed, Lukarazyll can use it as hurled debris—the remnants automatically become fungus-infested as part of this act and can create a spore…"}]
