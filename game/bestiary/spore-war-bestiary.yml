  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Harmony Vulnerability", "type": "passive", "traits": [], "text": "An eshmok's wrathful infestations defines them, and forcing peace upon them wrenches at their soul. If they fail a save against calm or a similar effect forcing them to be peaceful, an eshmok takes 4d6 mental damage."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The eshmok turns into their fungus form or back into their normal humanoid wasp form. In fungus form, they lose their fly Speed and can't make stinger Strikes. In fungus form, they gain a tendril melee Strike (+21 for 2d8+9 slashing plus eshmok infection); the tendril strike has the agile, magical, reach 10 feet, and unholy traits."}, {"name": "Eshmok Infection", "type": "passive", "traits": ["mental", "poison"], "text": "A creature that's Quickened by eshmok infection can use the extra action each round for only Strike actions. A creature that's Confused by eshmok infection never considers an eshmok in fungal form as a target%rSaving Throw DC 28 Will%rMaximum Duration 6 rounds%rStage 1 confused (1 round)%rStage 2 confused and quickened (1 round)%rStage 3 confused, Off-Guard, and quickened (1 round)"}, {"name": "Infesting Exhalation", "type": "action", "traits": ["olfactory", "poison"], "cost": 1, "text": "The eshmok exhales a wave of stinging fiendish wasps out in a 30-foot cone, dealing 4d8 poison|options:area-damage damage to every creature within the cone (DC 28 Reflex save). The swarming fiend wasps linger in the area for 6 rounds or until the eshmok is able to use Infesting Exhalation again, whichever comes first. Each creature damaged by Infesting Exhalation or that enters the area must succeed at a DC 28 Fortitude save or take 2d8 persistent poison damage and become Clumsy 1 as the poison…"}]
