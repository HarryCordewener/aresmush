  actions: [{"name": "Otherworldly Will", "type": "passive", "traits": [], "text": "Vintalax is driven forward by a singular, otherworldly will, guiding their actions. Whenever Vintalax attempts a Will saving throw against a mental effect that would control or dictate their actions, Vintalax treats the result of the saving throw as one category better."}, {"name": "Spore Burst", "type": "reaction", "traits": [], "text": "Trigger Vintalax takes damage from a melee Strike made by an adjacent creature%rEffect Vintalax's corrupted body unleashes a cloud of spores that envelopes the attacker, quickly growing and dissolving their flesh. These spores deal 4d6 persistent poison damage (DC 34 Fortitude save)."}, {"name": "Throne Tethered", "type": "passive", "traits": [], "text": "Vintalax is attached to his throne by a twisted length of thorny fungal vines that limit his mobility to areas B9 and B10 . This tether can be destroyed ( AC 30, Hardness 12, HP 50 (BT 25), Immunities acid, bludgeoning; Resistances piercing 10), in which case Vintalax howls in pain as his body rapidly begins to decay. Each round that he remains severed from the throne he loses his fast healing and takes 4d6 spirit damage at the start of his turn, but his AC increases to 36 and his speed to 25…"}, {"name": "Rotting Gift", "type": "passive", "traits": ["curse", "disease", "mental"], "text": "Saving Throw DC 34 Fortitude%rStage 1 Stupefied 1 (1 day)%rStage 2 stupefied 1 and Drained 1 (1 day)%rStage 3 Stupefied 2 and Drained 2 (1 day)%rStage 4 drained 1 and controlled by the Rotting God (1 day)%rStage 5 controlled by the Rotting God (1 day)%rStage 6 the creature becomes permanently controlled by the Rotting God (and may gain unique fungus-themed abilities)—at this point the creature is no longer diseased, and the control can only be ended by the death of the Rotting God or by an…"}, {"name": "Spore Breath", "type": "action", "traits": ["primal"], "cost": 2, "text": "Vintalax unleashes a cloud of spores from his mouth in a 30-foot cone. Creatures in this area take 12d6 acid|options:area-damage damage (DC 34 Fortitude save). Those who fail this save are Sickened 1 (or Sickened 2 on a critical failure) as the spores enter their lungs and begin to grow. These creatures take 2d6 persistent bleed damage as long as they remain sickened. This bleed damage cannot be stopped as long as the sickened condition persists. Any creature that takes damage from spore breath…"}, {"name": "Tentacle Eruption", "type": "action", "traits": [], "cost": 2, "text": "Vintalax drives his tentacles into the ground, causing tendrils of fungus to erupt everywhere in area B9 . This deals 2d8 bludgeoning damage plus 3d6 acid damage to each creature in the area (DC 34 Reflex save). Creatures that fail their save against tentacle eruption are grasped by the tendrils, reducing their speed by 10 feet until the start of Vintalax's next turn (or are Immobilized on a critical failure)."}]
