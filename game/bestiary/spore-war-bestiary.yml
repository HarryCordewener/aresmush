  actions: [{"name": "Host Scent", "type": "passive", "traits": [], "text": "An isqulug can precisely sense any creature infected with isqulugia within 30 feet, and knows the current stage of the disease."}, {"name": "All-Around Vision", "type": "passive", "traits": []}, {"name": "Regeneration 10 (Deactivated by Cold)", "type": "passive", "traits": []}, {"name": "Swarm Mind", "type": "passive", "traits": []}, {"name": "Spore Cloud", "type": "reaction", "traits": ["primal"], "text": "Trigger The Tanglebriar isqulug is hit by a melee attack%rEffect The Tanglebriar isqulug unleashes a cloud of toxic spores that burrow into the skin of any living nonfungus creature that is adjacent to them. The spores deal 2d6 persistent poison damage, and as long as the damage persists, the creature is Clumsy 1 from the numbness caused by the spores."}, {"name": "Expel Infestation", "type": "action", "traits": [], "cost": 2, "text": "The isqulug expels larvae from the hivemind in its head in a 30-foot. Creatures in this area take 6d10 piercing|options:area-damage damage as the swarm feeds on their flesh (DC 32 Reflex save). Any creature that takes damage is exposed to isqulugia.%rThe isqulug becomes Stupefied 1 for 1d4 rounds, during which it can't Expel Infestation."}, {"name": "Isqulugia", "type": "passive", "traits": ["disease", "incapacitation", "primal", "virulent"], "text": "Isqulugia's Sickened, Slowed, and Paralyzed conditions can't be removed until this affliction is removed%rSaving Throw DC 32 Fortitude%rStage 1 Sickened 1 (1 hour)%rStage 2 Fatigued and Sickened 2 (1 day)%rStage 3 fatigued and Slowed 1 (1 day)%rStage 4 paralyzed (1 day)%rStage 5 the creature dies, and its body violently transforms into a new isqulug. Wish, similar magic, or a 9th-rank Resurrect ritual can return the victim to life. The new isqulug remains even if the victim is brought back to…"}, {"name": "Malleability", "type": "passive", "traits": [], "text": "The isqulug can Squeeze through tight spaces as