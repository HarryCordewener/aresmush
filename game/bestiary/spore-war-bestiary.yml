ngs via tremorsense and is Immobilized until the cyst is broken open. The cyst has AC 40, 50 HP, and shares the rift pulper's weaknesses. If the cyst is broken open by any means other than Burst Cyst, the rift pulper must succeed at a DC 40 Fortitude save or become Stunned 3. While inside its cyst, the rift…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
