  actions: [{"name": "Camouflage", "type": "passive", "traits": [], "text": "Zauglagaul can hide in exterior locations in Tanglebriar even if he doesn't have cover."}, {"name": "Mist Vision", "type": "passive", "traits": [], "text": "Mist and fog (such as the Haze) doesn't impair Zauglagaul's vision; he ignores the Concealed condition from mist and fog."}, {"name": "+1 Status to All Saves vs. Primal", "type": "passive", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "120 feet. DC 39 Will"}, {"name": "Miasma", "type": "passive", "traits": ["aura", "poison"], "text": "20 feet. After the dragon uses their Poison Breath, a cloud of poison gas continues to emanate from their body for 1 round. Any creature that ends its turn in the miasma takes 5d6 poison|options:area-damage damage (DC 39 Fortitude save).%rAny creature in the miasma is Concealed and treats other creatures as concealed. The dragon can see through this concealment.%rEffect: Miasma"}, {"name": "Old Wound", "type": "passive", "traits": [], "text": "After Zuldanavox nearly bit off Zauglagaul's right wing decades ago, it never quite healed right. A crescent-shaped patch of discolored scales at the base of his wing on his right side marks this wound. The PCs might already know about this wound (see Zauglagaul at a Disadvantage below); otherwise, a PC only learns about this weakness if they witness a critical hit against Zauglagaul that inflicts piercing damage. Once a PC knows about Zauglagaul's old wound, they can Seek during their turn to…"}, {"name": "Twisting Tail", "type": "reaction", "traits": [], "text": "Trigger A creature within reach of the dragon's tail uses a move action or leaves a square during a move action it's using%rEffect The dragon makes a tail Strike at the creature with a –2 penalty. If the Strike hits, the dragon disrupts the creature's action."}, {"name": "Forest Passage", "type": "passive", "traits": [], "text": "The horned dragon ignores any difficult terrain caused by plants, such as bushes, vines, and undergrowth. Even plants manipulated by magic don't impede their progress."}, {"name": "Impaling Charge", "type": "action", "traits": [], "cost": 2, "text": "Requirements The dragon doesn't have a creature impaled on their horn%rEffect The dragon attempts to gore a foe. They Stride, then attempt a horn Strike. On a hit, the target becomes impaled on the dragon's horn. The creature is Grabbed while on the horn (and can attempt to Escape as normal). The dragon doesn't need to use additional actions to keep the impaled creature grabbed. If the dragon moves, they bring the grabbed creature along with them."}, {"name": "Spore Breath", "type": "action", "traits": ["fungus", "poison", "primal"], "cost": 2, "text": "Zauglagaul breathes a toxic cloud of spores that deals 18d6 poison|options:area-damage damage in a 60-foot. Creatures in the area must attempt a DC 39 Fortitude save. Zauglagaul can't use Spore Breath again for 1d4 rounds.%rCritical Success The creature takes no damage.%rSuccess The creature takes half damage.%rFailure The creature takes full damage and is Stupefied 1 for an unlimited duration as the spores take root and cause the victim to suffer from distracting hallucinations.%rCritical…"}, {"name": "Trackless Journey", "type": "passive", "traits": [], "text": "The horned dragon always gains the benefits of Cover Tracks in natural surroundings, even while moving at full speed."}]
