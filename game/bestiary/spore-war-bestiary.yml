  actions: [{"name": "Desperation Vulnerability", "type": "passive", "traits": [], "text": "Sinmolds are aware that they're in a vulnerable state as formless \"newborn fiends\" and are desperate to become stronger before they become prey to more powerful demons. Whenever the sinmold is in a combat encounter and ends its turn without dealing damage to another creature, the sinmold takes 3d6 mental damage and becomes Frightened 1."}, {"name": "Digestion", "type": "passive", "traits": ["healing"], "text": "The first time in a round when the sinmold damages a creature with Engulf, the sinmold immediately restores Hit Points equal to the damage dealt, gaining Hit Points in excess of its maximum as temporary Hit Points that last for 1 hour. As long as the sinmold possesses these temporary Hit Points, its surface hardens, and its AC increases to 30."}, {"name": "Engulf", "type": "action", "traits": [], "cost": 2, "text": "DC 32 Reflex, 3d10 acid damage plus digestion, escape dc=32, Rupture 18"}, {"name": "Sinmold Infestation", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 32 Fortitude%rMaximum Duration 6 rounds%rStage 1 2d8 poison damage (1 round)%rStage 2 3d8 poison damage and can hear the thoughts of root rotters within 30 feet as an imprecise sense (1 round)%rStage 3 as stage 2, but 4d8 poison damage and Doomed 1 (1 round)%rStage 4 as stage 3, and arise as a root rotter upon death (1 round)"}, {"name": "Spore Purge", "type": "action", "traits": ["poison"], "cost": 1, "text": "Requirements The sinmold has temporary Hit Points from digestion%rEffect The sinmold loses all temporary Hit Points and releases any creatures it currently has engulfed, pushing them into the nearest unoccupied spaces. It releases a cloud of spores from its body, dealing 5d8 poison|options:area-damage damage (DC 29 Fortitude save) in a 20-foot emanation. Any creature that fails this save also must attempt a save against sinmold infestation."}]
