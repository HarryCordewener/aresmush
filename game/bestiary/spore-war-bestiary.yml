  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Aura of Disquietude", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "30 feet. DC 35 Will%rAs Frightful Presence, plus a creature frightened by the aura becomes suspicious; it doesn't count any other creature as its ally and can't Aid or flank. On a critical failure, the creature also can't be a willing target for harmless or helpful magic.%rEffect: Aura of Disquietude"}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Bloodbird", "type": "passive", "traits": ["curse", "occult"], "text": "A creature hit by a vilderavn's melee attack becomes cursed. It takes 2d6 persistent bleed damage that's difficult to stanch.%rThe DC to stop the bleeding using Administer First Aid is 35, and healing the creature to full HP doesn't automatically end the bleeding.%rRemoving the curse ends the bleeding."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The vilderavn takes on the appearance of a Small or Medium humanoid, wolf, dire wolf, or hybrid with both raven and wolf parts. The vilderavn can only use their jaws attack when in a form with a wolf's head, and their talon attack in a form with raven qualities. They can instead assume their raven knight form: a Medium humanoid in black full plate carrying a greatsword. They can use their jaws or talon Strikes only in a form that has that body part, and their greatsword only in knight form."}, {"name": "Feed the Forge", "type": "action", "traits": [], "cost": 2, "text": "Requirements The Forger's last action was a successful Strike with their trident against a Medium or smaller creature%rEffect The Forger attempts to Reposition the creature, which remains impaled on the trident. The creature takes (3d8+16) piercing damage (DC 37 Fortitude save) regardless of the result of the Reposition attempt. If the creature is Repositioned into a space occupied by a fungal forge, that fungal forge is triggered and uses its Defile and Pollute reaction."}, {"name": "Souleater", "type": "passive", "traits": ["occult"], "text": "If the vilderavn kills a humanoid with a critical hit using their jaws Strike, they rip out and devour the target's heart and soul as part of the attack.%rWhile the target is dead, the vilderavn can Change Shape into the target's form, gaining a +4 status bonus to Deception checks to impersonate the target.%rIf magic would resurrect the creature, the caster must succeed at a DC 34 counteract check to extract the target's soul from the vilderavn; otherwise, the spell fails."}]
