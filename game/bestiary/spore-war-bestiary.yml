  actions: [{"name": "Spore Telepathy", "type": "passive", "traits": [], "text": "A shroud moss can communicate via telepathy with any creature within its sporecloud aura, doing so in that creature's native language."}, {"name": "Filament Body", "type": "passive", "traits": [], "text": "A shroud moss's body is physical, but much lighter and flexible than normal. They can move through openings down to 1 inch in diameter with ease and are treated as Tiny creatures for all effects affected by a creature's size. A shroud moss adjusts its saving throws against wind-based effects down by one degree of success."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "Requirements Assume Shape is active.%r60 feet. DC 37 Will"}, {"name": "Sporecloud", "type": "passive", "traits": ["aura", "primal"], "text": "60 feet. The shroud moss constantly exudes a transparent cloud of spores; creatures in the aura can communicate with the shroud moss via telepathy. A creature that ends its turn in the aura is exposed to grayshroud. The sporecloud's range is reduced to 5 feet until the end of the shroud moss's next turn whenever the shroud moss is exposed to winds stronger than a gentle breeze."}, {"name": "Assume Shape", "type": "action", "traits": ["concentrate", "illusion", "primal"], "cost": 1, "text": "The shroud moss assumes the ghostly (and often unsettlingly distorted) shape of the creature from whose physical remains it grew from, or from a creature it damaged this round, for 1 minute. While in this form, the shroud moss's frightful presence aura is active, and its tendril attacks inflict an additional 3d6 mental damage as feelings of betrayal and imminent death wrack the target's mind. This increases to 5d6 mental damage if the shroud moss attacks the creature it stole this shape from."}, {"name": "Grayshroud", "type": "passive", "traits": ["disease"], "text": "Saving Throw DC 40 Fortitude%rStage 1 Fatigued (1 day)%rStage 2 Drained 1 and fatigued (1 day)%rStage 3 Drained 2 and fatigued (1 day)%rStage 4 Drained 3, fatigued, and can't speak (1 day)%rStage 5 death"}]
