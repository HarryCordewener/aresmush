  actions: [{"name": "Masked Lies", "type": "passive", "traits": [], "text": "As long as Alzarius wears his Razmir mask, it's very difficult to tell if he's lying. All Perception checks to see through his deceptions take a –4 circumstance penalty as a result."}, {"name": "Skilled Diplomat", "type": "passive", "traits": [], "text": "Whenever Alzarius attempts to Make an Impression using Diplomacy, he can attempt his check against the Will DC of up to 50 creatures at once. If he focuses on Making an Impression on just one target, he treats a success as a critical success. Finally, whenever he makes a Request, he can make requests as if the target's attitude toward him was one step better than it is, as long as they aren't hostile."}, {"name": "Frozen Bloodline", "type": "passive", "traits": [], "text": "Alzarius's sorcerous bloodline is tied to the element of water—particularly to its manifestation in the form of ice or snow. When he casts a spell that inflicts cold damage, the target takes an additional 1 cold damage per spell rank."}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "Frequency once per day%rEffect Alzarius can cast a spell more efficiently. If his next action is to cast a cantrip or a spell up to 4th-rank, he reduces the number of actions it takes to cast it by 1 (minimum 1 action)."}, {"name": "Signature Spells", "type": "passive", "traits": [], "text": "Alzarius can cast Aqueous Orb, Cleanse Affliction, Heal, Howling Blizzard, and Ice Storm at a higher rank by spending a spell slot of that rank."}, {"name": "Snowcaster's Legacy", "type": "passive", "traits": [], "text": "When Alzarius inflicts damage with a Strike, he deals an additional 2d6 cold damage as shards of ice and blasts of frozen wind slash and buffet the creature struck."}]
