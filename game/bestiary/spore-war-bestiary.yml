  actions: [{"name": "Eyes Behind the Mask", "type": "passive", "traits": ["scrying"], "text": "A creature wearing the mask and garb of a priest of Razmir that outranks the tithekeeper's mask and ribbon rank can spend an hour Interacting with the tithekeeper's mask to connect with it. The creature's mask becomes an invested item that allows them to see and hear as though peering through the tithekeeper's mask. The creature must use a 3-action activity envisioning the tithekeeper to activate the scrying effect, and the effect can be Dismissed. Multiple creatures can create connections to…"}, {"name": "Accept Tithe", "type": "free", "traits": [], "text": "Trigger A creature drops or offers at least 750 gp in valuables within 15 feet of the tithekeeper%rEffect The tithekeeper quickly uses its feet to scoop the valuables into its vault and is now indifferent toward the triggering creature unless that creature uses hostile actions against it or its allies."}, {"name": "Capacity for Punishment", "type": "passive", "traits": [], "text": "The tithekeeper can have up to six creatures impaled and Grabbed with its feet at once."}, {"name": "Impale", "type": "action", "traits": [], "cost": 1, "text": "Requirements The tithekeeper has Grabbed a creature%rEffect The tithekeeper stabs the target with a spike for (2d8+13) piercing damage (DC 29 Reflex save). It no longer has to spend an action to extend the duration for the target it has grabbed. The target moves with the tithekeeper and takes 1d8 persistent bleed damage until it Escapes."}, {"name": "Locked Vault", "type": "passive", "traits": [], "text": "The tithekeeper's body is a locked vault containing any tithes given to it. The vault's Pick Lock DC is 29 and Force Open DC is 33."}, {"name": "Rip Off", "type": "action", "traits": [], "cost": 2, "text": "Requirements The tithekeeper has Impaled a creature%rEffect The tithekeeper tears the creature loose from its spiky feet, releasing it. The creature takes 4d10 slashing damage (DC 29 Fortitude save) and is no longer Grabbed. On a failed save, the creature also takes 2d8 persistent bleed damage."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Medium or smaller, body, DC 29 Reflex"}, {"name": "Improved Grab", "type": "free", "traits": []}]
