  actions: [{"name": "Scent Purity", "type": "passive", "traits": [], "text": "A spawn of Jeharlu can detect holy creatures with scent as a precise sense to 120 feet."}, {"name": "All-Around Vision", "type": "passive", "traits": []}, {"name": "Grasping Strands", "type": "reaction", "traits": [], "text": "Trigger A creature within 60 feet of the spawn of Jeharlu uses a move action or leaves a square during a move action it's using%rEffect A flurry of tendrils whips out, allowing the spawn of Jeharlu to attempt an Athletics check to Grapple the triggering creature. The spawn can Pull the creature if it remains grabbed on its next turn."}, {"name": "Hallucinatory Spores", "type": "passive", "traits": ["aura", "divine", "emotion", "mental"], "text": "60 feet. The spawn is surrounded by spores that manipulate the thoughts of those exposed. When a creature ends its turn in the aura and isn't holding its breath, it must attempt a DC 42 Will save. If it fails, it becomes Confused until the end of its next turn (or for 1 minute on a critical failure)."}, {"name": "Drain Soul", "type": "action", "traits": ["death", "divine"], "cost": 1, "text": "The spawn extends feeding stalks to drain the spirit and life from an adjacent Restrained or helpless creature. The target takes 10d6 spirit damage and must attempt a DC 45 Will save. If the damage from Drain Soul reduces a creature to 0 Hit Points, that creature dies instantly.%rCritical Success The target takes no damage.%rSuccess The target takes half damage and becomes Drained 1.%rFailure The target takes full damage and is Drained 2. If it was already drained, its drained condition value…"}, {"name": "Pull", "type": "action", "traits": [], "cost": 1, "text": "30 feet."}, {"name": "Improved Grab", "type": "free", "traits": []}]
