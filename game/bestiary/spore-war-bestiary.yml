  actions: [{"name": "Fungaltongue", "type": "passive", "traits": [], "text": "The Spore Queen can speak with all forms of fungi. She gains a +3 circumstance bonus to all Deception, Diplomacy, or Intimidation checks made against fungal creatures."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Distracted by Failures", "type": "passive", "traits": [], "text": "Quilindra remembers her failures in her previous life vividly. A PC can taunt her as an action with the auditory, concentrate, linguistic, and mental traits by attempting a DC 40 Deception, DC 40 Diplomacy, DC 40 Intimidation, or DC 40 Performance check.%rCritical Success Quilindra is significantly distracted; she becomes Off-Guard for the remainder of the encounter, becomes Stupefied 1, and is Slowed 1 until the end of her next turn as she spends valuable moments sputtering and shrieking in…"}, {"name": "Create Spawn", "type": "passive", "traits": ["divine"], "text": "The Spore Queen can create spawn from foes, but she doesn't use this ability in combat, as she would rather see the PCs dead than given this fungal gift.%rIf a creature dies after being reduced to 0 HP by a fungus tyrant's Mind-Draining Kiss, the fungus tyrant can turn this victim into a spore thrall by donating some of their own fungal matter to the victim and leaving them to \"ripen\" within a patch of fungus for 24 hours. After this time, the creature is restored to life but gains the fungus…"}, {"name": "Grow Sporepod", "type": "action", "traits": ["divine"], "cost": 2, "text": "The Spore Queen causes a human-sized pod of fungal material to burst out of the ground at any point she can see within 60 feet. Once created, a sporepod lasts for 1 minute, until she moves more than 120 feet away from it, or until it's destroyed (AC 45, Hardness 20, 60 HP). She cannot Grow a Sporepod again for 1d4 rounds, but apart from this and a sporepod's 1 minute life, there is no hard limit to the number of sporepods she can have active at any one time."}, {"name": "Mind-Draining Kiss", "type": "action", "traits": ["divine", "emotion", "mental"], "cost": 1, "text": "Frequency once per round%rEffect The Spore Queen engages a creature she's Grabbed in an act of passion in an attempt to drain its will. The kiss makes the creature Stupefied 1 or increases its stupefied condition by 1, to a maximum of 4. The creature takes 4d6 poison damage and must then succeed at a DC 42 Will save or be affected by a suggestion to remain immobile rather than trying to Escape."}, {"name": "Sporestride", "type": "action", "traits": ["divine", "move", "teleportation"], "cost": 1, "text": "The Spore Queen Steps into an adjacent sporepod or non-destroyed soul pod (see area K ) and instantly teleports to any other active sporepod or soul pod in the area, bursting out of the target pod and destroying it in the process."}, {"name": "Sporewarp", "type": "action", "traits": ["attack"], "cost": 1, "text": "The Spore Queen attempts a tentacle Strike but treats a sporepod or soul pod of her choice within 120 feet that she can see as the point of origin of that tentacle Strike."}, {"name": "Vengeful Slice", "type": "passive", "traits": ["divine"], "text": "The Spore Queen inflicts an additional 2d6 spirit damage to elves she Strikes with her dagger. An elf reduced to 0 Hit Points by the Spore Queen's dagger Strike becomes Doomed 1 as Treerazer takes note of their soul."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Occult Spontaneous Spells", "tradition": "occult", "type": "spontaneous", "dc": 42, "attack": 34, "spells": {"0": ["Daze", "Read Aura", "Shield", "Telekinetic Hand", "Telekinetic Projectile"], "1": ["Command", "Enfeeble", "Sanctuary"], "2": ["Laughing Fit", "Paranoia", "Stupefy"], "3": ["Blindness", "Fear", "Slow"], "4": ["Confusion", "Fly", "Translocate"], "5": ["Command", "Sending", "Subconscious Suggestion"], "6": ["Blood Vendetta", "Teleport", "Wall of Force"], "7": ["Resist Energy", "Soothe", "Warp Mind"], "8": ["Disappearance", "Duplicate Foe", "Vampiric Exsanguination"], "9": ["Overwhelming Presence", "Seize Soul", "Spirit Blast"], "10": ["Freeze Time"]}}, {"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 42, "attack": 34, "spells": {"0": ["Daze", "Detect Magic"], "7": ["Mind Reading", "Slow"], "8": ["Charm", "Mirage", "Suggestion"], "9": ["Hallucination", "Illusory Disguise", "Mind Probe", "Truespeech (Constant)"]}}]
