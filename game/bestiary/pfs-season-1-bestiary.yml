  actions: [{"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "10 feet. A creature entering the aura or starting its turn in the aura must succeed at a DC 18 Fortitude save or become Sickened 1 (plus Slowed 1 as long as it's sickened on a critical failure).%rWhile within the aura, the creature takes a -2 circumstance penalty to saves against disease and to recover from the sickened condition. A creature that succeeds at its save is temporarily immune for 1 minute.%rEffect: Stench"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Consume Flesh", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Requirements The ghast is adjacent to the corpse of a creature that died within the last hour.%rEffect The ghast devours a chunk of the corpse and regains 3d6 healing Hit Points.%rIt can regain Hit Points from any given corpse only once."}, {"name": "Ghast Fever", "type": "passive", "traits": ["disease"], "text": "Saving Throw DC 18 Fortitude%rStage 1 carrier with no ill effect (1 day)%rStage 2 3d8 void damage and regains half as many Hit Points from all healing (1 day)%rStage 3 as stage 2 (1 day)%rStage 4 3d8 void damage and gains no benefit from healing (1 day)%rStage 5 as stage 4 (1 day)%rStage 6 dead, and rises as a Ghast the next midnight"}, {"name": "Paralysis", "type": "passive", "traits": ["incapacitation", "occult"], "text": "Any living creature hit by a ghast's attack must succeed at a DC 18 Fortitude save or become Paralyzed. It can attempt a new save at the end of each of its turns, and the DC cumulatively decreases by 1 on each such save."}, {"name": "Swift Leap", "type": "action", "traits": ["move"], "cost": 1, "text": "The ghast jumps up to half its Speed. This movement doesn't trigger reactions."}]
