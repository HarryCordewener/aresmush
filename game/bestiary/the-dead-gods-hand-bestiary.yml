  actions: [{"name": "Proof of Undeath", "type": "passive", "traits": [], "text": "A sanctum knight believes themself to be a living immortal, but if offered proof that they are in fact undead, they must succeed at a DC 20 Will save or become Frightened 1 (or Frightened 3 on a critical failure). On a critical success, they're temporarily immune to this fear for 24 hours. Once they recover from being frightened, their memories of the proof offered fade and they once again regard themselves as living immortals. Proof of undeath includes whenever they take vitality damage,…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Aeon Blast", "type": "action", "traits": [], "cost": 2, "text": "The sanctum knight chooses one of the aeon stars, then fires it from its orbit to detonate into a 20-foot-radius blast at any point within 120 feet, dealing 2d6 untyped damage to creatures in the area (basic DC 18 Reflex save). The damage type depends on the color of the aeon star.%rBlack Aeon Star void damage%rGold Aeon Star electricity damage%rGreen Aeon Star acid damage%rWhite Aeon Star spirit damage"}, {"name": "Aeon Stars", "type": "passive", "traits": [], "text": "A sanctum knight has four tiny motes of light that constantly orbit their head. These four aeon stars are black, gold, green, and white, and each provides illumination equivalent to that of a lit candle. A sanctum knight can expend an aeon star to make an Aeon Blast (see above), but once a sanctum knight has used all of their aeon stars, they become Slowed 1. An expended aeon star returns to its orbit around the sanctum knight's head automatically after 1 hour has passed."}, {"name": "Muddle Mind", "type": "passive", "traits": ["mental"], "text": "The first time each round a creature takes damage from a throneglass weapon wielded by a sanctum knight, it must attempt a DC 18 Will save to avoid becoming Stupefied 1 for 1 minute (or stupefied 1 for 24 hours on a critical failure). Regardless of the result of its save, the creature is temporarily immune to muddle mind for 1 round."}]
