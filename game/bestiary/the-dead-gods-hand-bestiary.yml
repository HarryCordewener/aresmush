action", "traits": ["fire", "manipulate"], "cost": 1, "text": "Frequency once per round%rEffect Shulgurk releases a lever on the infernal machine to send a dose of lesser alchemist's fire through a pliable metal hose, dealing 1d8 fire|options:area-damage damage in a 20-foot cone (DC 16 Reflex save). Each time Shulgurk uses this ability, reduce the total doses of lesser alchemist's fire available to the infernal machine by 1."}, {"name": "Spin Silk", "type": "passive", "traits": ["concentrate", "exploration", "manipulate"], "text": "By spending several minutes, Shulgurk can produce silk to craft items made of webbing or cloth. He can produce enough silk in a day to craft a single garment."}]
