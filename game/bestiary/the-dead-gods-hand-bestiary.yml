 "linguistic", "mental"], "cost": 1, "text": "Frequency once per round%rEffect Deravon's ghost can use the \"Bow Before Aroden\" activation of his helm at will as a single action once per round rather than once per day as a two-action activity, as long as the command he issues is to bow before him and not before Aroden."}, {"name": "Slice of Death", "type": "action", "traits": ["divine", "void"], "cost": 2, "text": "Deravon's ghost swings his ghostly longsword in an arc before him, unleashing a 30-foot cone of void energy. Creatures in the area take 8d6 void|options:area-damage damage and must make a DC 28 Fortitude save against the following additional effects. Deravon's ghost can't use Slice Of Death for 1d4 rounds.%rCritical Success The creature takes no damage and is unaffected.%rSuccess The creature takes half damage.%rFailure The creature takes full damage and an additional 2d6 persistent…"}]
