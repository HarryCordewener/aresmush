  actions: [{"name": "+1 to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Battle Reek", "type": "passive", "traits": ["aura", "olfactory"], "text": "30 feet. Bloody Hands exudes the carrion stink of a sprawling battlefield—a cloying mixture of death and mud. Any creature entering the aura or starting its turn in the aura must succeed at a DC 34 Fortitude save or become Sickened 1 (plus Slowed 1 for as long as it's sickened on a critical failure). While within the aura, affected creatures take a –2 circumstance penalty to saves against fear and to recover from the sickened condition. A creature that succeeds at its save is temporarily immune…"}, {"name": "Bloody Mess", "type": "action", "traits": ["divine"], "cost": 2, "text": "Frequency once per day%rEffect Bloody Hands slashes his claws out in all directions, causing blood from all living creatures within a 20-foot-radius to leap out and fill the air with a fine red mist. All creatures in the area must attempt a DC 37 Fortitude save—creatures that are already wounded take a –2 penalty to this saving throw. If more than 3 creatures fail this saving throw, the 20-foot-radius becomes so thick with bloody mist that all creatures in the area become Concealed until the…"}, {"name": "Leaping Slam", "type": "action", "traits": ["incapacitation"], "cost": 3, "text": "Bloody Hands Strides, then makes a High Jump or a Long Jump, and can land in a space occupied by creatures. All creatures in the 10-foot space he lands in must attempt a DC 37 Reflex save.%rCritical Success The creature dodges aside and takes no damage, and it can choose any square adjacent to Bloody Hands to immediately move into; this movement does not trigger reactions.%rSuccess The creature takes 4d6 bludgeoning damage and is pushed into an adjacent space of Bloody Hands' choice.%rFailure…"}]
