  actions: [{"name": "Polyglot", "type": "passive", "traits": [], "text": "A mezlan can speak and understand any language they hear spoken after listening to the language for 1 minute. These languages fade from their mind after 24 hours."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 15 (Deactivated by Acid)", "type": "passive", "traits": []}, {"name": "Absorb Spell", "type": "reaction", "traits": [], "text": "Trigger The mezlan succeeds at a saving throw against a single-target spell%rEffect The mezlan absorbs the spell, nullifying its effect and storing it for later. They can Cast the Spell using the original caster's spell attack modifier and DC. They can store only one spell at a time, but they can absorb a new spell to replace the spell they currently have stored.%rA willing caster can allow the mezlan to Absorb a Spell without requiring a save."}, {"name": "Discorporate", "type": "passive", "traits": [], "text": "When the mezlan is reduced to 0 Hit Points, their body dissolves into colorless slime and begins seeping into nearby cracks or porous surfaces.%rIf this material is not immediately contained or destroyed, the mezlan will eventually re-form, though they may lie dormant for years or even decades before doing so."}, {"name": "Access Pipe Ambush", "type": "reaction", "traits": [], "text": "Trigger Niesha emerges from one of the Sarzari access pipes%rEffect Niesha makes a melee Strike against an adjacent creature as she emerges."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph"], "cost": 1, "text": "The mezlan assumes the form of any Medium or Small creature, excluding those with the elemental, incorporeal, or swarm traits but including specific individuals whose appearance they've seen. This doesn't change the mezlan's Speed or their attack and damage bonus with their Strikes, but the damage type dealt by their Strikes might change based on their new form."}, {"name": "Extend Limb", "type": "action", "traits": [], "cost": 1, "text": "The mezlan extends one of their limbs, granting themself a reach of 20 feet with their polymorphic appendages until the end of their next turn."}, {"name": "Navigate Pipes", "type": "passive", "traits": [], "text": "Niesha can move though the Sarzari Access Pipes, even though they're only two feet wide; she treats these pipes as difficult terrain."}, {"name": "Up From Below", "type": "passive", "traits": [], "text": "Niesha can Shove or Trip a creature that's standing atop a Sarzari access pipe grate while she's directly beneath that creature."}, {"name": "Viscous Trap", "type": "passive", "traits": [], "text": "A creature hit by the mezlan's ooze globule takes a –15-foot circumstance penalty to all Speeds for 1 minute. On a critical hit, a target standing on a solid surface also becomes Immobilized, while a target Flying via wings falls to the ground and becomes unable to Fly.%rA target can end all effects by Escaping or spending a total of 3 Interact actions to free itself.%rEffect: Viscous Trap"}]
