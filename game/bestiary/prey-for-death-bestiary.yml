  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Pervert Miracle", "type": "reaction", "traits": ["curse", "divine"], "text": "Trigger A foe within 60 feet casts Bless or a beneficial spell that the nikaramsa could cast to remove an affliction or condition (such as Cleanse Affliction)%rEffect The nikaramsa attempts to counteract the enemy's spell (counteract modifier +24 and counteract rank 7). If the nikaramsa succeeds, the triggering creature is subjected to the effects of a Bane spell or the effect it was trying to remove."}, {"name": "Towering Stance", "type": "passive", "traits": ["divine", "illusion"], "text": "A nikaramsa is in fact a Medium creature, but appears as a Large creature due to the force of their personality. A creature interacting with the nikaramsa can attempt a DC 36 Will save to see the nikaramsa as they truly are. If the creature succeeds, the reach of nikaramsa's attacks against that foe decrease to 5 feet (10 feet for their tongue).%rIf all creatures in the nikaramsa's vicinity successfully disbelieve this illusion, the nikaramsa becomes Medium and Enfeebled 2 for as long as…"}, {"name": "Sap Mind", "type": "action", "traits": ["divine", "mental"], "cost": 1, "text": "The nikaramsa focuses their gaze on one creature within 60 feet. That target must attempt a DC 34 Will save. Regardless of the outcome of the saving throw, the target then becomes temporarily immune for 1 day.%rCritical Success The nikaramsa is caught off guard by the strength of the target's resistance and becomes Stupefied 2 until the end of their next turn.%rSuccess The target resists the nikaramsa's influence.%rFailure The target's focus and willpower drain away; it becomes Stupefied 2 for…"}, {"name": "Improved Knockdown", "type": "free", "traits": []}]
