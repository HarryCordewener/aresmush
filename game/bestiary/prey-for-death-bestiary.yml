  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "+2 Status to All Saves vs. Occult", "type": "passive", "traits": []}, {"name": "Retract Body", "type": "reaction", "traits": [], "text": "Trigger Vatumledor is hit or critically hit by an attack made by a creature the dragon can see%rEffect Vatumledor retracts the targeted body part or twists away to avoid the attack, gaining a +2 circumstance bonus to his Armor Class against the triggering attack."}, {"name": "Conjure Disguise", "type": "passive", "traits": ["manipulate", "occult", "polymorph"], "text": "Frequency once per day%rEffect Vatumledor conjures a flesh suit that's a replica of a humanoid he has seen and compresses himself into the suit, along with clothing appropriate for the humanoid. This process takes 1 minute, during which Vatumledor is Off-Guard. If he stops or is interrupted in this process, the suit is destroyed. Once the process is complete, he can remain in his disguise indefinitely.%rThe transformation has the effects of change shape, except that the disguise is not actively…"}, {"name": "Detonate Disguise", "type": "action", "traits": ["occult"], "cost": 2, "text": "Requirements Vatumledor is wearing his conjured disguise%rEffect Vatumledor erupts from the disguise, destroying it. The explosive revelation deals 18d6 bludgeoning|options:area-damage damage to creatures adjacent to the dragon (DC 39 Reflex save). Creatures that fail their save become Dazzled for 1 round as they become covered in scraps from the disguise. Any creatures sharing a space with Vatumledor after he erupts are pushed into the nearest empty space."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "Vatumledor makes two claw Strikes and one tail Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "When Vatumledor scores a critical hit with a Strike, he recharges Smoke Breath."}, {"name": "Rushed Transformation", "type": "action", "traits": ["concentrate", "manipulate", "occult", "polymorph"], "cost": 3, "text": "Frequency once per hour%rEffect Vatumledor quickly reshapes his body into the form of a generic humanoid figure. This has the effects of humanoid form except that it only lasts 1 minute, and he doesn't gain the +4 status bonus to Deception as the transformation makes use of his own scales and plating to crudely mimic a humanoid form. Vatumledor can Dismiss the effect. Whenever the effect ends, Vatumledor leaves behind scraps of magically conjured flesh, which could give away his presence."}, {"name": "Smoke Breath", "type": "action", "traits": ["occult", "poison"], "cost": 2, "text": "Vatumledor unleashes a 60-foot of smoke that deals 16d6 poison|options:area-damage damage (DC 39 Fortitude save). The smoke remains for 1 minute, obscuring sight with the effects of mist in the cone's area. He can't use Smoke Breath again for 1d4 rounds."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Vatumledor's Strikes deal an additional 3d6 precision damage to Off-Guard targets."}]
