  actions: [{"name": "Fiery Leap", "type": "action", "traits": ["fire"], "cost": 2, "text": "Frequency once per day%rEffect Zaiho Leaps. As he does so, he throws a handful of explosive devices into a square he was adjacent to just before he Leaped. A creature in this square takes 11d10 fire damage (DC 37 Reflex save); that creature and all creatures adjacent to the target square also take 11 fire splash damage."}, {"name": "Gadget Defense", "type": "reaction", "traits": [], "text": "Trigger Zaiho would roll a saving throw against an effect that would cause Hit Point damage%rEffect Zaiho quickly procures some outlandish gadget or device from his pouches to protect himself from the triggering effect. Rather than roll the normal saving throw against the effect, Zaiho instead attempts a Crafting check in place of that saving throw, treating the result of this check as the result of the saving throw instead. If this results in a critical failure, Zaiho's gadgets are damaged,…"}, {"name": "Twinned Combat", "type": "passive", "traits": [], "text": "Any enemy is Off-Guard against Zaiho's Strikes if that enemy is currently taking persistent damage from or is frightened by any of Shirota's bombs. Zaiho doesn't inflict splash damage to Shirota with Fiery Leap."}]
