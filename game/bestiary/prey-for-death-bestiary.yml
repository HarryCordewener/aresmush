  actions: [{"name": "Battle Arrogance", "type": "passive", "traits": [], "text": "Ordulf hasn't met a significant combat challenge in ages, and even when facing deadly foes like the PCs his arrogance can be used against him. If a PC successfully Disarms, Feints, Frightens, or Trips Ordulf, his arrogance gets the better of him and he grows sloppy in his tactics, reducing his AC to 34 until the start of his next turn. A PC can also attempt to issue a more debilitating insult to Ordulf.%rInsult Ordulf 2 The PC spends several seconds issuing insults and taunts to Ordulf, then…"}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Battle Cry", "type": "reaction", "traits": [], "text": "Frequency once per day%rTrigger Ordulf rolls initiative%rEffect Ordulf attempts to demoralize an observed foe."}, {"name": "Cleaving Blow", "type": "action", "traits": [], "cost": 2, "text": "Ordulf Strikes two adjacent creatures within his reach. Both attacks count against his multiple attack penalty, but do not increase his penalty until he has made both attacks."}, {"name": "Crushing Insult", "type": "action", "traits": ["auditory", "linguistic", "mental"], "cost": 1, "text": "Frequency once per round%rEffect Ordulf issues a devastating and humiliating insult to a creature within 30 feet that he can see. Ordulf attempts an Intimidation check against the target's Will DC. That character is then temporarily immune to Crushing Insult for 24 hours.%rCritical Success The insult is distracting and humiliating; the target is Stupefied 1 and Off-Guard for 1 minute.%rSuccess The insult is distracting, but its effects pass quickly; the target is stupefied 1 and off-guard until…"}, {"name": "Deadly Display", "type": "action", "traits": [], "cost": 2, "text": "Requirements Ordulf is wielding a melee weapon%rEffect Ordulf brandishes his weapon in a threatening display. He Demoralizes all enemies within 30 feet, rolling once and comparing the result to each target's Will DC."}, {"name": "Whirlwind Strike", "type": "action", "traits": [], "cost": 3, "text": "Ordulf Strikes each enemy within his reach. Each attack counts toward his multiple attack penalty, but do not increase his penalty until he has made all his attacks."}]
