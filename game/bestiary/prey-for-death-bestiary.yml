  actions: [{"name": "Misty Form", "type": "passive", "traits": [], "text": "A bloodfog's body is composed of a semisolid red fog similar in consistency to thick foam. This enables a bloodfog to move through spaces as narrow as 1 inch in diameter with no reduction to its Speed. However, a bloodfog can't wear or interact with objects. It also can't enter water or other fluids, and it's treated as Tiny for the purpose of how wind affects it."}, {"name": "Sense Blood", "type": "passive", "traits": [], "text": "A bloodfog can sense creatures that have blood within 120 feet. It can sense exposed blood within a mile."}, {"name": "Blood Siphon", "type": "passive", "traits": [], "text": "When a bloodfog damages a creature with a misty tendril Strike, the creature must attempt a DC 38 Fortitude save. If the Strike was a critical hit, the outcome of the creature's save is one degree worse than the result of the saving throw. Any temporary Hit Points the bloodfog gains from blood siphon fade after 1 hour.%rCritical Success The creature is unaffected.%rSuccess The creature is Sickened 1.%rFailure The creature is Drained 1, and the bloodfog gains 20 temporary Hit Points.%rCritical…"}, {"name": "Blood Vengeance", "type": "passive", "traits": [], "text": "A bloodfog can cast blood vendetta even though it can't actually bleed. In addition to the spell's normal trigger, a bloodfog can cast blood vendetta as a reaction even if the target's piercing, slashing, or persistent bleed damage didn't actually result in damage to the bloodfog itself (either as a result of its resistance blocking the damage or its immunity to bleed coming into effect)."}]
