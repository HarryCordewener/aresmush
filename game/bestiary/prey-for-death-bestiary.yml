  strikes: [{"name": "Jaws", "bonus": 37, "damage": [["4d12+18", "piercing", null]], "traits": ["magical", "reach-10", "unarmed"], "effects": ["Warpwave Strike"]}, {"name": "Claw", "bonus": 37, "damage": [["4d8+18", "slashing", null]], "traits": ["agile", "magical", "reach-10", "unarmed"], "effects": ["Warpwave Strike"]}, {"name": "Tail", "bonus": 37, "damage": [["4d8+18", "bludgeoning", null]], "traits": ["reach-15"], "effects": ["Grab"]}]
  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Burst of Creation", "type": "passive", "traits": ["healing", "vitality"], "text": "When Alktherisa and Omprisgor die, they explode in a 30-foot, washing all creatures in the area with protean energy. These creatures are healed 20d6 healing Hit Points and must succeed at a DC 38 Fortitude Save or be affected by a warpwave for 1 round."}, {"name": "Entropy Sense (Imprecise) 60 feet", "type": "passive", "traits": ["divine", "prediction"], "text": "A keketar can anticipate the most likely presence of a creature through a supernatural insight into chaotic probabilities and chance. This grants them the ability to sense creatures within the listed range. Veil of Privacy prevents a creature from being detected via entropy sense automatically (without a counteract check)."}, {"name": "Two As One", "type": "passive", "traits": [], "text": "Alktherisa and Omprisgor are a single creature, but each of their heads rolls its own initiative and has its own turn. At the start of a head's turn, it gets 2 actions and 1 reaction. Each head controls one set of arms, but both control the serpentine body. Any ability that would sever a head doesn't cause the conjoined protean to die if it still has its other head, but it does cause it to lose the turns, actions, and reactions of the severed head. Mental effects that target a single creature…"}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Fast Healing 15", "type": "passive", "traits": []}, {"name": "Eat Death", "type": "reaction", "traits": [], "text": "Trigger A creature within Omprisgor's reach is targeted by a spell that deals Hit Point damage%rEffect Omprisgor attempts to counteract the spell with a Religion check; if he succeeds, the spell is countered and Omprisgor becomes Quickened for 1 round; he may use the additional action to Stride or Strike."}, {"name": "Eat Life", "type": "reaction", "traits": [], "text": "Trigger A creature within Alktherisa's reach is targeted by a spell that heals Hit Points or grants temporary Hit Points%rEffect Alktherisa and Omprisgor become additional targets of that spell, even if that spell normally couldn't target an additional creature."}, {"name": "Protean Anatomy 25", "type": "passive", "traits": ["divine"], "text": "A keketar's vital organs shift and change shape and position constantly. Immediately after the keketar takes acid, electricity, or sonic damage, they gain the listed amount of resistance to that damage type. This lasts for 1 hour or until the next time the protean takes damage of one of the other types (in which case their resistance changes to match that type), whichever comes first.%rThe keketar is immune to polymorph effects unless they're a willing target. If Blinded or Deafened, the…"}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Spatial Riptide", "type": "passive", "traits": ["aura", "divine"], "text": "30 feet. A creature using a teleportation ability within the aura or arriving in it via teleportation must succeed at a DC 41 Fortitude save or wink out of existence for 1d4 #rounds rounds before completing the teleport. The creature can't act, sense anything, or be targeted. On a successful save, the creature completes the teleport normally but is Stunned 1. Keketars are immune to this effect."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The keketar can take the appearance of any Huge or smaller creature. This doesn't change their Speed or their attack and damage bonuses with their Strikes but might change the damage type their Strikes deal."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(1d10+15) bludgeoning, DC 41 Fortitude"}, {"name": "Reshape Reality", "type": "passive", "traits": [], "text": "When the keketar casts Mirage, it infuses the illusion with quasi-real substance. Creatures that do not disbelieve the illusion treat structures and terrain created through the spell as though they were real, ascending illusory stairs, becoming trapped by illusory quicksand, and so on."}, {"name": "Warpwave", "type": "passive", "traits": [], "text": "Many proteans can subject their foes to disorienting alterations perceived in time and space by creating ripples of unstable reality in the environment called warpwaves. When a creature fails its saving throw and is affected by a warpwave, roll 1d8 and consult the table below for the specific effect on that creature. Unless indicated otherwise, a warpwave effect lasts for 1d4 rounds, and a new warpwave effect negates any previous warpwave effect already affecting a creature.%r1d8 Warpwave…"}, {"name": "Warpwave Strike", "type": "passive", "traits": ["divine", "polymorph"], "text": "A creature struck by a keketar's jaws or claw Strike must succeed at a DC 38 Fortitude save or be subject to a Warpwave."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 44, "attack": 35, "spells": {"4": ["Confusion (At Will)", "Translocate (At Will)", "Unfettered Movement (Constant)"], "5": ["Creation (At Will)", "Mirage (See Reshape Reality)", "Translocate", "Truespeech (Constant)"], "6": ["Teleport (At Will, Self Only)"], "7": ["Disintegrate", "Dispel Magic (At Will)", "Shatter (At Will)", "Warp Mind"], "8": ["Confusion", "Cursed Metamorphosis"], "9": ["Divine Wrath", "Unfathomable Song"]}}]
