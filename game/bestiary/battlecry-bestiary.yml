ave the creature grabbed or restrained.%rEffect: Remaining Air"}, {"name": "Waves of Sludge", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The omoxes attack all enemies in a 5-foot emanation with slimy tendrils (DC 35 Reflex save). A creature that critically fails this saving throw is also Grabbed by the slime pool. The damage depends on the number of actions.%r1 1d6+3 bludgeoning damage plus 1d6 acid damage%r2 3d6+12 bludgeoning damage plus 2d6 acid damage%r3 4d6+14 bludgeoning damage plus 3d6 acid damage"}]
