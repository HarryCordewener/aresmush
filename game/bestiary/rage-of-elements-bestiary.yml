  weaknesses: {"area-damage": 10, "splash-damage": 10}
  actions: [{"name": "Tremorsense (Imprecise) 60 feet", "type": "passive", "traits": []}, {"name": "Earthbound", "type": "passive", "traits": [], "text": "When not touching solid ground, the avalanche legion is Slowed 1."}, {"name": "Troop Defenses", "type": "passive", "traits": []}, {"name": "Earth Glide", "type": "passive", "traits": [], "text": "The avalanche legion can Burrow through any earthen matter, including rock. When it does so, the legion moves at its full burrow Speed, leaving no tunnels or signs of its passing."}, {"name": "Pummeling Boulders", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The avalanche legion unleashes an onslaught of blows against each enemy in a 5-foot (DC 28 Reflex save). The damage depends on the number of actions.%r1 2d8 bludgeoning|options:area-damage damage%r2 (3d8+8) bludgeoning|options:area-damage damage%r3 (4d8+11) bludgeoning|options:area-damage damage"}, {"name": "Spinning Stones", "type": "action", "traits": [], "cost": 2, "text": "The avalanche legion spins in place, kicking up a barrage of stones. Each creature in a 10-foot within 30 feet of the troop takes (1d12+8) bludgeoning|options:area-damage damage (DC 28 Reflex save). When the troop is reduced to 2 or fewer segments, this area decreases to a 5-foot."}, {"name": "Trample into the Earth", "type": "action", "traits": [], "cost": 3, "text": "The avalanche legion speeds forward, running over creatures with their stone bodies and knocking them down. As Trample; Gargantuan or smaller, 2d8 bludgeoning damage, DC 28 Reflex. A creature that critically fails its save is knocked Prone."}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever the avalanche legion Strides or Burrows, it first Forms Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then moves up to its respective Speed. This works just like a Gargantuan creature moving; for instance, if any square of the legion enters difficult terrain, the extra movement cost applies to all the elementals."}]
