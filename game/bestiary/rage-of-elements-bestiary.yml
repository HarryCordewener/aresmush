  actions: [{"name": "Plant Empathy", "type": "passive", "traits": [], "text": "The ardande gardener can use Diplomacy to make-an-impression and make very simple Requests of plants."}, {"name": "Decompose", "type": "action", "traits": ["primal", "void"], "cost": 2, "text": "Frequency once per day%rEffect Void energy seeps out of the ardande gardener, decaying everything within a 5-foot and causing plants and foliage to age and decompose. Natural difficult terrain is destroyed, and creatures in the area with the plant or wood trait take 1d6 void|options:area-damage damage (DC 16 Fortitude)."}]
