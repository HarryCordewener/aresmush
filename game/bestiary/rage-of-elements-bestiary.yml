  actions: [{"name": "Tremorsense (Imprecise) 120 feet", "type": "passive", "traits": []}, {"name": "Telepathy 300 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "+2 Status to Recall Knowledge About Earth", "type": "passive", "traits": []}, {"name": "Craft Crystal Wand", "type": "passive", "traits": ["exploration"], "text": "Frequency twice per day%rEffect The vault keeper spends 10 minutes creating a magic wand out of radioactive green crystal, containing any 5th-rank or lower earth spell of their choice. The wand can be used by other creatures, but it crumbles to sand at the end of the day and has no monetary value."}, {"name": "Item Caster", "type": "passive", "traits": [], "text": "The vault keeper can Cast a Spell from any item (such as a staff or wand) as though it were on their spell list."}, {"name": "Attack of Opportunity", "type": "reaction", "traits": []}, {"name": "Constraining Crystal", "type": "passive", "traits": ["earth", "magical"], "text": "When the vault keeper deals damage with a claw Strike, glowing green crystals cluster at the site of the attack. The target must succeed at a DC 31 Fortitude save or become Clumsy 1 for 1 hour (or Clumsy 2 on a critical failure). If the creature is already clumsy due to constraining crystal, additional failures increase that clumsy value instead, to a maximum of clumsy 4."}, {"name": "Crystal Burst", "type": "action", "traits": ["arcane", "earth"], "cost": 2, "text": "An explosion of razor-sharp splinters deals 15d6 piercing|options:area-damage|traits:item:frequency:limited damage in a 30-foot within 120 feet, with a DC 35 Reflex save. The vault keeper can't use Crystal Burst again for 1d4 rounds."}, {"name": "Slashing Surge", "type": "action", "traits": [], "cost": 2, "text": "The vault keeper Strides or Climbs and makes two claw Strikes at any point during that movement. Each Strike must target a different creature. The multiple attack penalty doesn't increase until after both attacks."}]
