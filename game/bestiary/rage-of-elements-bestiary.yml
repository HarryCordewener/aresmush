  actions: [{"name": "Magnetic Vision", "type": "passive", "traits": [], "text": "An asp of grief can see magnetic fields, allowing it to detect large sources of magnetic metal (Bulk 1 or greater) as a precise sense."}, {"name": "+1 Status to All Saves vs. Emotion", "type": "passive", "traits": []}, {"name": "Curtain of Calm", "type": "passive", "traits": ["arcane", "aura", "emotion", "mental"], "text": "20 feet. The asp of grief consumes the emotions of the creatures around it. An enemy that begins its turn in the aura must attempt a DC 29 Will save. If it fails, the asp consumes its grief. The creature feels a lack of feelings and motivation, reducing its frightened value by 1 and becoming Stupefied 1 (or Stupefied 2 on a critical failure) for 1d4 rounds. Regardless of the result of the saving throw, the creature is temporarily immune to curtain of calm for 1 minute. The asp becomes charged…"}, {"name": "Iron Grief", "type": "passive", "traits": [], "text": "If the asp casts Magnetic Acceleration while charged with grief, it can either heighten the spell to 5th rank or target up to three creatures instead of one, rolling separately against each. After casting the spell, the asp is no longer charged with grief."}, {"name": "Magnetic Traveler", "type": "passive", "traits": [], "text": "An asp can ride magnetic fields to travel long distances. In a location with strong magnetic fields (including the Plane of Metal and Golarion), its travel Speed is doubled if it's flying."}]
  spellcasting: [{"name": "Arcane Innate Spells", "tradition": "arcane", "type": "innate", "dc": 29, "attack": 0, "spells": {"0": ["Detect Magic", "Read Aura"], "3": ["Magnetic Acceleration (At Will; See Iron Grief)"], "5": ["Magnetic Attraction", "Magnetic Repulsion"]}}]
