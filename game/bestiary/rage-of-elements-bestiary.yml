aits": ["electricity", "manipulate"], "text": "Requirements The anemos has a hand free%rEffect The anemos runs a hand through the winds that swirl around them, the sparks from their fingertips coalescing into a thunderbolt. The anemos creates a thunderbolt in their open hand. If the anemos spends an action to Collect Thunder, a bolt instead strikes their open hand, creating a booming peal that deafens all creatures within 20 feet for 1 round unless they succeed at a DC 40 Fortitude save; this adds the auditory trait to Collect Thunder. Any…"}, {"name": "Command the Breeze", "type": "passive", "traits": [], "text": "When an anemos casts a ritual, they perform all aspects of the ritual themself, commanding their winds to complete all the ritual's components. They must fulfill any requirements for the ritual's additional casters and must attempt the checks normally performed by additional casters. In addition, anemoi can cast rituals faster than usual. If a ritual has a casting time measured in days, they can cast it in an equal number of hours."}, {"name": "Storm Strikes Twice", "type": "action", "traits": ["air", "teleportation"], "cost": 2, "text": "The anemos throws a thunderbolt, then becomes a wind that carries them in an instant to the bolt's location to attack again. They make a ranged thunderbolt Strike against a creature within their first range increment, teleport to the creature's location as a gust of wind, then grasp the thrown thunderbolt and make a melee thunderbolt Strike against a creature within reach. Their multiple attack penalty doesn't increase until they've made both attacks."}, {"name": "Swiftness", "type": "passive", "traits": [], "text": "The anemos's movement doesn't trigger reactions."}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 40, "attack": 32, "spells": {"1": ["Air Bubble (At Will)"], "4": ["Airlift (At Will)", "Vapor Form (At Will)", "Voice on the Breeze (At Will)"], "5": ["Howling Blizzard"], "7": ["Humanoid Form (At Will)"], "8": ["Frigid Flurry"], "9": ["Cleanse Air"]}}]
