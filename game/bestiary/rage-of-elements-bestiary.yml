  strikes: [{"name": "Claw", "bonus": 23, "damage": [["2d4", "poison", null], ["2d8+10", "slashing", null]], "traits": ["reach-15", "unarmed"]}, {"name": "Radioactive Shrapnel", "bonus": 23, "damage": [["2d4", "poison", null], ["2d8+7", "piercing", null]], "traits": ["brutal", "propulsive"], "range": 60}]
  actions: [{"name": "Green Glow", "type": "passive", "traits": ["aura", "poison", "radiation"], "text": "20 feet.%rAn abysium horror constantly emanates a powerful energy toxic to life. This radiation sheds dim light in the area. Any creature beginning its turn in the aura must attempt a DC 27 Fortitude save, becoming Sickened 1 on a failure or Sickened 2 on a critical failure. Once out of the aura, an affected creature's sickened condition automatically decreases by 1 at the beginning of each of its turns."}, {"name": "Heavy", "type": "passive", "traits": [], "text": "As long as it is immobile, the elemental can't be forcibly moved or knocked Prone. If it takes a move action, it loses this immunity until the start of its next turn."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Large or smaller, claw, DC 27 Reflex"}]
"Anemos":
  pack: "rage-of-elements-bestiary"
  level: 18
  size: "medium"
  rarity: "rare"
  traits: ["air", "elemental"]
  ac: 43
  hp: 310
  perception: 33
  saves: {"fortitude": 29, "reflex": 33, "will": 30}
  abilities: {"cha": 9, "con": 7, "dex": 9, "int": 6, "str": 4, "wis": 6}
  speeds: {"land": 25, "fly": 200}
  hp_details: "regeneration 15 (deactivated by earthbane)"
  senses: ["darkvision"]
  skills: {"Acrobatics": 38, "Arcana": 31, "Nature": 33, "Occultism": 31, "Performance": 38, "Religion": 31, "Stealth": 36, "Survival": 33, "Planar Lore": 33}
  immunities: ["bleed", "electricity", "paralyzed", "poison", "sleep"]
  resistances: {"cold": 20}
  strikes: [{"name": "Thunderbolt", "bonus": 35, "damage": [["3d8+12", "electricity", null], ["3d6", "sonic", null]], "traits": ["electricity", "magical"]}, {"name": "Thunderbolt", "bonus": 35, "damage": [["3d8+10", "electricity", null], ["3d6", "sonic", null]], "traits": ["electricity", "magical", "thrown-30"]}, {"name": "Air Blast", "bonus": 35, "damage": [["3d10+12", "bludgeoning", null]], "traits": ["agile", "air", "magical"]}]
  actions: [{"name": "Truespeech", "type": "passive", "traits": [], "text": "An anemos can speak with and understand any creature that has a language."}, {"name": "Wind Orchestra", "type": "passive", "traits": ["air", "auditory"], "text": "An anemos does not require instruments to perform music, instead using their winds to create and carry the sounds of any instruments they wish to duplicate. They can mimic any number of instruments simultaneously, creating and directing their own personal orchestra."}, {"name": "Regeneration 15 (Deactivated by Earthbane)", "type": "passive", "traits": []}, {"name": "Blessed by the Winds", "type": "passive", "traits": ["air", "aura"], "text": "80 feet. The winds grow turbulent for those who would dare to fly in the same space as an anemos, but they take care to never harm or inconvenience their shepherd. Air within the emanation is difficult terrain for Flying creatures that do not have the air trait. While the aura is active, the anemos cannot be affected by environmental air or weather affects unless they choose to be."}, {"name": "Earthbane", "type": "passive", "traits": [], "text": "An anemos's regeneration is suppressed for 1 round if the anemos is affected by an earth effect, or for as long as they are in contact with the ground and 1 round thereafter. If an anemos is submerged in at least 1 inch of mud, dirt, or stone, the anemos's aura deactivates, and the anemos becomes Stunned 2 and Clumsy 2."}, {"name": "Redirect Weather", "type": "reaction", "traits": ["divine"], "text": "Requirements The anemos's aura is active%rTrigger A creature within the anemos's aura uses an air or electricity spell, or an air or electricity spell otherwise comes into effect within the anemos's aura%rEffect The winds and weather of the spell obey the anemos's call. The anemos makes all the choices to determine the targets, destination, or other effects of the spell, as though they were the caster."}, {"name": "Collect Thunder", "type": "free", "traits": ["electricity", "manipulate"], "text": "Requirements The anemos has a hand free%rEffect The anemos runs a hand through the winds that swirl around them, the sparks from their fingertips coalescing into a thunderbolt. The anemos creates a thunderbolt in their open hand. If the anemos spends an action to Collect Thunder, a bolt instead strikes their open hand, creating a booming peal that deafens all creatures within 20 feet for 1 round unless they succeed at a DC 40 Fortitude save; this adds the auditory trait to Collect Thunder. Any…"}, {"name": "Command the Breeze", "type": "passive", "traits": [], "text": "When an anemos casts a ritual, they perform all aspects of the ritual themself, commanding their winds to complete all the ritual's components. They must fulfill any requirements for the ritual's additional casters and must attempt the checks normally performed by additional casters. In addition, anemoi can cast rituals faster than usual. If a ritual has a casting time measured in days, they can cast it in an equal number of hours."}, {"name": "Storm Strikes Twice", "type": "action", "traits": ["air", "teleportation"], "cost": 2, "text": "The anemos throws a thunderbolt, then becomes a wind that carries them in an instant to the bolt's location to attack again. They make a ranged thunderbolt Strike against a creature within their first range increment, teleport to the creature's location as a gust of wind, then grasp the thrown thunderbolt and make a melee thunderbolt Strike against a creature within reach. Their multiple attack penalty doesn't increase until they've made both attacks."}, {"name": "Swiftness", "type": "passive", "traits": [], "text": "The anemos's movement doesn't trigger reactions."}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 40, "attack": 32, "spells": {"1": ["Air Bubble (At Will)"], "4": ["Airlift (At Will)", "Vapor Form (At Will)", "Voice on the Breeze (At Will)"], "7": ["Humanoid Form (At Will)"], "9": ["Cleanse Air"]}}]
