  actions: [{"name": "Steam Vision", "type": "passive", "traits": [], "text": "The boiling spring ignores the Concealed condition from mist and steam."}, {"name": "Evaporate", "type": "reaction", "traits": [], "text": "Trigger An effect would deal fire damage to the boiling spring, even if they would ignore the damage%rEffect The boiling spring evaporates into the air. Until the beginning of the boiling spring's next turn, they can't be attacked or targeted. They still occupy their space, and their auras still function as normal."}, {"name": "Sweltering Heat", "type": "passive", "traits": ["aura", "fire"], "text": "25 feet. The boiling spring radiates heat, raising the air temperature around them. A creature that starts its turn in the emanation must succeed at a DC 33 Fortitude save or become Fatigued while it remains in the area; creatures immune to environmental heat effects or with any fire resistance are immune."}, {"name": "Freeze and Shatter", "type": "passive", "traits": [], "text": "If the boiling spring is destroyed with cold damage, their body freezes over and explodes, sending out a wave of frigid air and ice shards that deal 4d6 piercing damage plus 4d6 cold damage to creatures in a 20-foot (DC 36 Reflex save)."}, {"name": "Scalding Breath", "type": "action", "traits": ["fire", "primal"], "cost": 2, "text": "The boiling spring breathes out a cloud of steam in a 30-foot that deals 14d6 fire|options:area-damage damage to each creature in the area (DC 33 Reflex save). The boiling spring can't use Scalding Breath again for 1d4 rounds."}]
