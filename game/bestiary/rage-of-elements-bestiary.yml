  weaknesses: {"area-damage": 10, "splash-damage": 10}
  actions: [{"name": "Bullying Bluster", "type": "passive", "traits": ["auditory", "aura", "emotion", "linguistic", "mental"], "text": "30 feet. The blustering gale constantly unleashes a tirade of insults and aggressive taunts. Each enemy who enters or starts their turn in the aura must succeed at a DC 30 Will save or become Stupefied 1 for as long as they remain within the aura (Stupefied 2 on a critical failure). The troop's members are collectively able to mimic a few curse words or insults in every language, allowing their Bullying Bluster to affect any creature who understands a language. A creature who succeeds at its…"}, {"name": "Troop Defenses", "type": "passive", "traits": []}, {"name": "Pummeling Winds", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The blustering gale bashes, batters, and pummels each adjacent enemy (DC 27 Reflex save). The damage depends on the number of actions.%r1 (1d8+2) bludgeoning damage%r2 (2d8+12) bludgeoning damage%r3 (3d8+15) bludgeoning damage"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever a troop Flies or Strides, it first Forms Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then moves up to its Speed. This works just like a Gargantuan creature moving; for instance, if any square of the troop enters difficult terrain, the extra movement cost applies to the whole troop."}, {"name": "Windstorm", "type": "action", "traits": ["air"], "cost": 2, "text": "The blustering gale exhales as a unit, creating a powerful windstorm. This windstorm is a 10-foot within 100 feet that deals (3d8+10) bludgeoning|options:area-damage damage (DC 30 Reflex save). Creatures that fail their saving throw are pushed 10 feet in any direction (plus knocked Prone on a critical failure). When the troop is reduced to 2 or fewer segments, this area decreases to a 5-foot and the distance pushed decreases to 5 feet."}]
