  actions: [{"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 160 (3 segments), 80 (2 segments)"}, {"name": "Lightlure", "type": "action", "traits": ["concentrate", "incapacitation", "mental", "primal", "visual"], "cost": 1, "text": "Effect The saltborn stalkers move their luminescent lures in an entrancing light show, drawing nearby creatures into their grasp. Each creature in a 100-foot must attempt a DC 33 Will save; regardless of the result of its save, the creature is then temporarily immune to Lightlure for 24 hours.%rSuccess The creature is unaffected.%rFailure The creature is Fascinated with the lures and must spend all its actions on its next turn to move closer to them as expediently as possible, avoiding obvious…"}, {"name": "Saline Crust", "type": "passive", "traits": ["aura", "water"], "text": "20 feet%rRequirements The saltborn stalkers are in a body of water%rEffect Layers of the saltborn's salty skin flake off to foul the water around them. A creature that ends its turn in the aura takes 2d6 acid damage with a DC 30 Reflex save; creatures with the amphibious or aquatic trait are immune."}, {"name": "Salty Clutch", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect The stalkers reach out to Grab their foes and drag them underwater. Each enemy in a 5-foot must succeed at a DC 33 Reflex save or be Grabbed by the stalkers (or Restrained on a critical success). For the rest of the current turn, the saltborn stalkers can move toward water or in water without ending the grab, carrying any grabbed or restrained creatures along with them."}, {"name": "Scour the Bones", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The saltborn stalkers use their teeth and claws to vivisect each enemy within 5 feet (DC 30 Reflex save). The damage depends on the number of actions.%r1 2d10 slashing damage%r2 (3d10+8) slashing damage%r3 (3d10+16) slashing damage"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever the saltborn stalkers Stride or Swim, they first Form Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then move. This works just like a Gargantuan creature moving; for instance, if any of the stalkers' squares enter difficult terrain, the extra movement cost applies to the whole troop."}]
