ed at a DC 5 Flat or a failure if not. The shuyookh interprets the wish to please the most people possible."}, {"name": "To the Hilt", "type": "action", "traits": [], "cost": 1, "text": "The faydhaan shuyookh makes a melee jambiya Strike and buries the blade deep, dealing an extra 3d6 persistent bleed damage on a hit (6d6 on a critical hit)."}]
