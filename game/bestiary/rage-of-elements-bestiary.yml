  actions: [{"name": "Accord Essence", "type": "reaction", "traits": ["plant"], "text": "Trigger An ally within 30 feet that benefited from the wisp's resonance in the last hour is targeted by an attack%rEffect The wisp detonates itself in a small elemental explosion of leaves and pollen. This gives temporary Hit Points equal to half the wisp's current HP to all allies within 30 feet that have benefited from the wisp's resonance aura in the past hour. These temporary Hit Points last 1 hour.%rA wisp that uses this reaction is permanently destroyed and can be restored only by a Wish…"}, {"name": "Resonance", "type": "passive", "traits": ["aura", "plant", "wood"], "text": "30 feet. All wisps vibrate at a frequency attuned to their element, resonating with and empowering all creatures and effects sharing that trait. A creature in the area gains a +1 status bonus to attack and damage rolls for effects with the plant or wood trait; a creature with the elemental trait and either plant trait or wood trait gains this bonus to all attack and damage rolls. For wood wisps, this bonus also applies to nonmagical wooden weapons, such as staves and clubs."}, {"name": "In Concert", "type": "passive", "traits": [], "text": "When a wood wisp rolls a critical failure on a check to Aid, they get a failure instead, and when they roll a success, they get a critical success instead."}]
