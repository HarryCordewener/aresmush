  actions: [{"name": "Molten Form", "type": "passive", "traits": ["fire"], "text": "Any creature that hits the living magma with an unarmed Strike or otherwise touches it takes 10 fire damage. If a gallon or more of water touches the living magma, or if it's affected by a water effect, its outer layer of lava hardens to a rocky shell, deactivating its molten form and imposing weakness 15 to bludgeoning damage. Molten form reactivates if the living magma swims in lava for 1 minute."}, {"name": "Trap Weapon", "type": "reaction", "traits": ["fire"], "text": "Frequency once per round%rTrigger A creature hits the living magma with a melee weapon%rEffect The living magma attempts an Athletics check against the triggering creature's Athletics DC. On a success, the living magma traps the weapon in its body and pulls it from the attacker's grasp. A creature can Interact to retrieve the weapon, but the attempt fails unless the creature succeeds at an Athletics check against the living magma's Fortitude DC (typically 36). If the living magma uses Engulf,…"}, {"name": "Engulf", "type": "action", "traits": [], "cost": 2, "text": "DC 33 Reflex, 2d10 bludgeoning,4d6 fire damage, escape dc=33, Rupture 25"}, {"name": "Launch Lava", "type": "action", "traits": ["fire"], "cost": 2, "text": "The living magma hurls an exploding glob of lava up to 120 feet. Each creature in a 10-foot takes 7d6 fire|options:area-damage damage (DC 33 Reflex save)."}, {"name": "Reignite", "type": "action", "traits": ["fire"], "cost": 2, "text": "Requirements The living magma is not in molten form%rEffect The living magma returns to molten form."}, {"name": "Volcanic Heat", "type": "passive", "traits": ["aura", "fire"], "text": "40 feet. Any creature that enters or starts its turn in the aura takes 15 fire damage (DC 33 Fortitude save). A creature that fails its save is also Enfeebled 1 until it's no longer in the aura."}]
