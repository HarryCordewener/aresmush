  actions: [{"name": "Tremorsense 120 feet", "type": "passive", "traits": []}, {"name": "Dust Eternal", "type": "passive", "traits": ["aura", "earth"], "text": "30 feet. Dust swirls about the outcrop, rendering everything within its aura (including the outcrop) Concealed. In addition, the dust at the outcrop's base creates difficult terrain on the ground within the aura. The outcrop can activate or deactivate this aura using a single action, which has the concentrate trait."}, {"name": "Unstoppable", "type": "passive", "traits": [], "text": "The elder outcrop's slowed condition can't exceed Slowed 1, and it ignores penalties to its Speeds and the Immobilized condition."}, {"name": "Call of Earth", "type": "passive", "traits": ["primal"], "text": "A flying creature hit by the elder outcrop's rock ranged strike is affected by a 7th-rank Earthbind spell (DC 33 Fortitude)."}, {"name": "Earth Glide", "type": "passive", "traits": [], "text": "The elder outcrop can Burrow through any earthen matter, including rock. When it does so, the elder outcrop moves at its full burrow Speed, leaving no tunnels or signs of its passing."}, {"name": "Natural Formation", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Until the next time it acts, the elder outcrop appears to be a natural terrain feature. It has an automatic result of 47 on Deception checks and DCs to pass as a natural outcropping of rock. The outcrop's dust eternal aura is deactivated while Natural Formation is being used."}, {"name": "Stone Grip", "type": "action", "traits": ["earth", "incapacitation", "primal"], "cost": 2, "text": "Great fingers of stone arise to grasp up to two Medium or smaller creatures on the ground in the outcrop's aura. Each target must succeed at a DC 33 Reflex save or be Grabbed by the stone hand (or Restrained on a critical failure; escape dc=33). A creature grabbed or restrained by a stone hand at the end of its turn becomes Slowed 1 or increases its existing slowed condition by 1. When a creature is unable to act due to the slowed condition from this effect, the creature is permanently…"}, {"name": "Throw Rock", "type": "action", "traits": [], "cost": 1}, {"name": "Knockdown", "type": "action", "traits": [], "cost": 1}]
