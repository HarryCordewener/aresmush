  actions: [{"name": "Bounding Leap", "type": "action", "traits": [], "cost": 2, "text": "Globblit Leaps twice; this movement doesn't provoke reactions. If he ends his movement within melee reach of at least one enemy, he can make a melee Strike against that enemy."}, {"name": "Commanding Croak", "type": "action", "traits": ["auditory"], "cost": 1, "text": "Globblit gives a loud, belching croak to compel his allies to action. Each boggard within 30 feet can use a reaction to Step, Stride, or Strike."}, {"name": "Smash and Slurp", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per turn%rEffect Globblit makes a greatclub Strike and a tongue Strike against the same target. If the greatclub Strike hits, the target is Off-Guard against his tongue Strike.%rThis counts as two attacks for Globblit's multiple attack penalty, but the penalty doesn't increase until after his Smash and Slurp."}, {"name": "Swamp Stride", "type": "passive", "traits": [], "text": "Globblit ignores difficult terrain caused by swamp terrain features."}, {"name": "Tongue Grab", "type": "passive", "traits": [], "text": "If Globblit hits a creature with his tongue, that creature becomes Grabbed by him. Unlike a normal grab, the creature isn't Immobilized, but it can't move beyond the reach of Globblit's tongue.%rA creature can sever the tongue by succeeding at an AC 18 Strike and dealing at least 6 slashing damage. Though this doesn't deal any damage to Globblit, it prevents him from using his tongue Strike until it regrows, which takes a week."}]
