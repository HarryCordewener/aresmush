g for an Attack of Opportunity), the bonus to AC decreases by 1 for each weapon used."}, {"name": "Focused Assault", "type": "action", "traits": [], "cost": 2, "text": "The marilith attacks a single target with all the weapons they wield in their arms, overwhelming the target with multiple attacks and leaving almost nowhere to dodge. The demon makes a longsword Strike. On a successful attack, the marilith deals longsword damage to the target, plus an additional 1d8 slashing damage for every longsword they wield beyond the first (typically 5d8 slashing damage). Even on a failed attack, the marilith deals the damage from one longsword to the target, though they…"}, {"name": "Greater Constrict", "type": "action", "traits": [], "cost": 1, "text": "(2d12+13) bludgeoning, DC 39 Fortitude"}, {"name": "Infuse Weapons", "type": "passive", "traits": ["divine"], "text": "Any weapon becomes a +2 Greater Striking weapon made of cold iron and silver while a marilith wields it."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
