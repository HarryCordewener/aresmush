  actions: [{"name": "Golem Antimagic", "type": "passive", "traits": [], "text": "Harmed by acid (9d10 untyped, 2d10 untyped from areas or persistent damage); healed by fire (area 2d10 healing HP); slowed by electricity"}, {"name": "Repair Mode", "type": "passive", "traits": [], "text": "When the adamantine golem is at 0 HP, it isn't destroyed. Instead, it enters repair mode, during which it is Slowed 1, can't take reactions, and can take only the Self-Repair action.%rOnce it has more than 30 HP, it can use any type of action and can use reactions, though it remains slowed 1 and can't take any reactions until the start of its next turn.%rIf a critical hit with an adamantine Vorpal weapon reduces the golem to 0 HP, or if such a weapon hits it while it's already at 0 HP, then the…"}, {"name": "Vulnerable to Dispelling", "type": "passive", "traits": [], "text": "The golem can be targeted by Disjunction and Dispel Magic.%rIf targeted by such a spell of 9th level or higher, the golem has its resistance to physical damage lowered to 15 and is Slowed 1 (or Slowed 2 if in repair mode) for 1d4 rounds. During this time, if the golem is reduced to 0 HP while already in repair mode, it is destroyed."}, {"name": "Destructive Strike", "type": "passive", "traits": [], "text": "On a critical hit, the adamantine golem's fist Strike breaks the target's armor, if any, in addition to dealing damage to the target. If the target has a shield raised, the golem breaks the shield instead."}, {"name": "Inexorable March", "type": "action", "traits": [], "cost": 1, "text": "DC 45 Fortitude%rCritical Success The creature takes no damage and its armor takes no damage.%rSuccess The golem halts its movement and cannot enter the creature's square.%rFailure The resisting creature is damaged and its armor takes damage as if hit by the adamantine golem's fist.%rThe golem Strides up to its Speed, pushing back each creature whose space it moves into and damaging them if they try to stop its movement. A creature can attempt to bar the way by succeeding at a Fortitude save."}, {"name": "Self-Repair", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The golem repairs itself, regaining 30 healing Hit Points."}, {"name": "Vent", "type": "action", "traits": ["fire"], "cost": 1, "text": "The golem vents a 30-foot of superheated steam from its internal forge. This deals 15d6 fire|options:area-damage damage to all creatures in the cone (DC 40 Reflex).%rThe golem can't use Vent again for 1d6 rounds."}]
