  actions: [{"name": "Snow Vision", "type": "passive", "traits": [], "text": "Snow doesn't impair a white dragon's vision; it ignores Concealment from snowfall."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Dragon Chill", "type": "passive", "traits": ["arcane", "aura", "cold"], "text": "5 feet. 2d6 cold|options:area-damage damage (DC 27 Reflex save)"}, {"name": "Freezing Blood", "type": "reaction", "traits": ["arcane", "cold"], "text": "Trigger An adjacent creature deals piercing or slashing damage to the dragon.%rEffect The dragon's blood sprays on the creature, dealing 2d6 cold damage. A creature that takes cold damage in this way is Slowed 1 for 1 round."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 27 Will"}, {"name": "Breath Weapon", "type": "action", "traits": ["arcane", "cold"], "cost": 2, "text": "The dragon breathes a cloud of frost that deals 11d6 cold|options:area-damage damage in a 40-foot (DC 29 Reflex save).%rIt can't use Breath Weapon again for 1d4 rounds."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "The dragon makes two claw Strikes and one tail Strike in any order"}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "When the dragon scores a critical hit with a Strike, it recharges its Breath Weapon."}, {"name": "Ground Slam", "type": "action", "traits": [], "cost": 1, "text": "The dragon slams into the ground. It can do this if it's on the ground or Flying within 10 feet of the ground. Each creature on the ground within 10 feet must succeed at a DC 29 Reflex save or fall Prone and take 3d6 bludgeoning|options:area-damage damage.%rThe dragon can then Step."}, {"name": "Ice Climb", "type": "passive", "traits": [], "text": "A white dragon can climb on ice as though it had the listed climb Speed. It ignores difficult terrain and greater difficult terrain from ice and snow and doesn't risk falling when crossing ice."}, {"name": "Shape Ice", "type": "action", "traits": ["arcane", "water"], "cost": 2, "text": "The dragon reshapes a cube of ice or snow it touches, up to 10 feet across. Any creature standing atop the ice must succeed at a DC 15 Reflex save or DC 15 Acrobatics check.%rOn a failure, the creature falls Prone atop the ice; on a critical failure, it falls off the ice entirely and is also prone."}]
