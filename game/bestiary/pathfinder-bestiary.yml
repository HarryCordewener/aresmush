  actions: [{"name": "Telepathy 1 mile", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Heatsight 60 feet", "type": "passive", "traits": ["primal"], "text": "Heatsight is a precise sense that sees heat signatures."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration 30 (Deactivated by Cold Iron)", "type": "passive", "traits": []}, {"name": "Dream Haunting", "type": "passive", "traits": [], "text": "A target that fails its save against the wendigo's Nightmare is exposed to wendigo torment."}, {"name": "Howl", "type": "action", "traits": ["auditory", "concentrate", "fear", "incapacitation", "mental", "primal"], "cost": 3, "text": "Frequency Three times per day%rEffect The wendigo unleashes a forlorn howl that can be heard up to 1 mile away. Any creature that hears the howl must succeed at a DC 38 Will save or be Frightened 1. Any creature that critically fails and is within 120 feet of the wendigo is instead Frightened 3, and is also Fleeing for 1d4 rounds (or until it's no longer frightened, whichever comes first).%rA creature frightened by a wendigo's howl still naturally recovers from its fright but can't reduce it…"}, {"name": "Ride the Wind", "type": "reaction", "traits": ["air", "concentrate", "primal"], "text": "Trigger The wendigo casts Migration while it has Grabbed a foe.%rEffect The wendigo attempts to turn the grabbed creature into wind and carry it along as part of the action. If the target succeeds at a DC 38 Will save, it prevents itself from being transformed; in this case, the wendigo still transforms, automatically releasing the victim.%rA creature forced to Ride the Wind along with the wendigo is exposed to wendigo torment. The target can attempt a new Will save each round to return to…"}, {"name": "Wendigo Torment", "type": "passive", "traits": ["curse", "mental", "primal"], "text": "A creature affected by wendigo torment can't recover beyond stage 1 until it has been restored to full HP.%rSaving Throw DC 38 Will%rStage 1 Stupefied 4 (1 day)%rStage 2 As stage 1 (1 day)%rStage 3 The creature searches for an individual of its own ancestry to kill and devour. It then becomes affected by Migration and sprints into the sky so fast that its feet burn away into jagged stumps. As the creature wind walks into the sky, it is replaced by a new wendigo over 2d6 minutes.%rWish, similar…"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Primal Innate Spells", "tradition": "primal", "type": "innate", "dc": 38, "attack": 30, "spells": {"4": ["Nightmare (see Dream Haunting)"], "8": ["Wind Walk (At Will)"]}}]
