  actions: [{"name": "Blood Scent", "type": "passive", "traits": [], "text": "The bunyip can smell blood in the water from up to 1 mile away."}, {"name": "Aquatic Opportunity (Special)", "type": "reaction", "traits": [], "text": "As Attack of Opportunity, but both the bunyip and the triggering creature must be in water."}, {"name": "Blood Frenzy", "type": "free", "traits": [], "text": "Requirements The bunyip is not Fatigued or already in a frenzy.%rTrigger The bunyip deals bleed damage to a living creature.%rEffect The bunyip flies into a frenzy that lasts 1 minute. While frenzied, the bunyip gains a +4 status bonus to damage rolls with its jaws, gains 8 temporary HP that go away at the end of the frenzy, and takes a -2 penalty to AC."}, {"name": "Roar", "type": "action", "traits": ["auditory", "concentrate", "emotion", "fear", "mental", "primal"], "cost": 1, "text": "The bunyip lets out a loud and horrifying roar. Other creatures within 100 feet must succeed at a DC 21 Will save or become Frightened 2 (Frightened 3 on a critical failure, Frightened 1 on a success, or unaffected on a critical success).%rNo matter the result, the creature is temporarily immune to the effect for 1 minute."}, {"name": "Shift Form", "type": "action", "traits": ["morph", "primal"], "cost": 1, "text": "A bunyip can alter its form slightly to gain an advantage and make it harder to recognize. When it does, its teeth shrink and its Jaws Strike doesn't deal the 1d6 persistent bleed damage. It can choose to gain either a long snake tail, granting its tail Strike reach 10 feet and Grab, or squat crocodile legs, increasing its land Speed to 20 feet. If it uses Shift Form again, the bunyip can return to normal or switch between a long tail or crocodile legs."}]
