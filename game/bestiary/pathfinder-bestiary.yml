"passive", "traits": ["divine"], "text": "Any weapon a balor wields becomes a +3 Major Striking Vorpal weapon made of cold iron and silver while the demon holds it. A weapon that isn't eligible for the vorpal rune doesn't gain its effects. The demon can conjure a whip made of flames with an Interact action. This whip gains the same benefits as other weapons the balor wields."}, {"name": "Lifedrinker", "type": "free", "traits": ["divine", "healing"], "text": "Trigger The balor kills a living creature that is at least 15th level.%rEffect The balor drinks the triggering creature's life force and regains (10d8+80) healing Hit Points."}, {"name": "Whip Reposition", "type": "passive", "traits": [], "text": "When a balor Grabs a creature with a whip Strike, they can move the creature to any space in the whip's reach. The balor can move without ending the grab as long as the creature remains within the whip's reach, and the balor can move the creature to any other space in the whip's reach with an Interact action."}, {"name": "Improved Grab", "type": "free", "traits": []}]
