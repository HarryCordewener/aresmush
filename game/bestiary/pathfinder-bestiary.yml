  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Free Blade", "type": "free", "traits": [], "text": "Trigger The ghaele ends its turn while unable to act or attempts a greatsword Strike that would take a circumstance or status penalty.%rEffect A ghaele's blade is implacable in the pursuit of freedom, and its energies can overpower any effect that would interfere with its swordplay. The ghaele attempts to counteract each effect that prevents it from making a greatsword Strike, gives it a penalty to its greatsword Strike, or prevents it from acting. The ghaele can use this ability even if it's…"}, {"name": "Light Form", "type": "passive", "traits": [], "text": "A ghaele's body is partially corporeal and partially composed of light, with a color corresponding to the elemental energy currently residing in its blade (see Choose Weakness). It can move through solid objects but can't end its action within a solid object."}, {"name": "Choose Weakness", "type": "action", "traits": ["concentrate", "divine", "manipulate"], "cost": 1, "text": "A ghaele attempts to Recall Knowledge about a foe it is facing. If successful, it can change the elemental damage dealt by its greatsword and light ray to acid, cold, electricity, fire, or sonic, usually to match the a foe's weakness. It can also change its energy resistance to any of these energy types (this can be a different type than for its attacks). The choices remain until it next uses Choose Weakness."}, {"name": "Ghaele's Gaze", "type": "action", "traits": ["divine", "visual"], "cost": 1, "text": "When a ghaele fixes its gaze upon a non-good creature, the creature suffers the effects of Divine Decree (DC 33 Will save). If it survives, the creature is temporarily immune to Ghaele's Gaze for 1 minute."}, {"name": "Holy Blade", "type": "passive", "traits": ["divine"], "text": "Any weapon becomes a +2 Holy Striking weapon while the ghaele wields it."}]
