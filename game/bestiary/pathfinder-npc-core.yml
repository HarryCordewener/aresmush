  actions: [{"name": "Explosive Demise", "type": "passive", "traits": ["fire"], "text": "When the demolitionist is reduced to 0 Hit Points while they have any explosives still in their bag, the remaining explosives detonate, unleashing an explosion of fire upon all creatures in a 30-foot emanation. Each creature in the area takes 3d6 fire|options:area-damage damage with a DC 19 Reflex save."}, {"name": "Replenish Explosives", "type": "passive", "traits": [], "text": "The demolitionist can replenish their stock of explosives with 4 hours of downtime."}, {"name": "Plant Mine", "type": "action", "traits": ["fire", "manipulate"], "cost": 1, "text": "1 to 2%rThe demolitionist plants a mine in an adjacent square. If a creature moves onto a space with a mine, the mine explodes. This deals 3d8 fire damage to the creature with a DC 21 Reflex save. The demolitionist can use 2 actions to Plant a Mine to hide the mine, granting it a Stealth DC of 21. Creatures that didn't see the mine as it was planted must actively search for it (using the Search activity while exploring or the Seek action in an encounter)."}, {"name": "Toss Dynamite", "type": "action", "traits": ["fire", "manipulate"], "cost": 2, "text": "The demolitionist quickly throws a stick of dynamite up to 20 feet away that explodes in 5-foot burst. Creatures within the burst take 4d4 fire|options:area-damage damage with a DC 21 Reflex save."}, {"name": "Wall Charge", "type": "action", "traits": ["fire", "manipulate"], "cost": 3, "text": "The demolitionist plants a powerful wall charge on a flat surface such as a door or wall. Once the charge is planted, it explodes after 1 minute, dealing 60 fire damage to the surface and ignoring up to 15 of the surface's Hardness. The explosive also deals 5d6 fire|options:area-damage damage to creatures within 30 feet of the explosive with a DC 25 Reflex save."}]
