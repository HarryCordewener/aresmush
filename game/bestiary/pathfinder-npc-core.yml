  actions: [{"name": "+2 to Reflex vs. Damaging Effects", "type": "passive", "traits": []}, {"name": "Kinetic Aura", "type": "passive", "traits": ["aura", "earth", "primal"], "text": "10 feet. Pieces of rock and earth float in the aura. The aura must be active for the guardian to use impulse actions, and deactivates if the guardian uses an overflow impulse, is knocked out, or Dismisses it. The guardian can Channel Elements to reactivate it."}, {"name": "Weight of Stone", "type": "action", "traits": ["concentrate", "earth", "impulse", "overflow", "primal"], "cost": 3, "text": "The mountain guardian calls down boulders in a cylinder 20 feet in diameter and 80 feet high within 120 feet. Each creature in the area takes 4d8 bludgeoning|options:area-damage damage with a DC 24 Reflex save. A creature that fails is also pushed downward 40 feet (80 feet on a critical failure) without taking falling damage and can't leave the ground for 1 round."}, {"name": "Base Kinesis", "type": "action", "traits": [], "cost": 2, "text": "The mountain guardian generates, moves, or suppresses up to 1 Bulk of naturally occurring earthen matter within 15 feet. Generating creates earthen matter, moving moves existing matter up to 20 feet into any direction, and suppressing destroys a piece of that element (which can't be a durable crafted good, only natural forms of the element)."}, {"name": "Channel Elements", "type": "action", "traits": ["primal"], "cost": 1, "text": "The mountain guardian reactivates their kinetic aura and can make an elemental blast Strike."}, {"name": "Empowered Blast", "type": "action", "traits": [], "cost": 2, "text": "The mountain guardian makes a melee or ranged elemental blast Strike with a +4 status bonus to damage."}, {"name": "Tremor", "type": "action", "traits": ["concentrate", "earth", "impulse", "overflow", "primal"], "cost": 2, "text": "The mountain guardian stomps on natural earth or stone, causing a localized tremor. All creatures in a 10-foot burst within 30 feet take 3d10 bludgeoning|options:area-damage damage with a DC 24 Fortitude save. A creature that critically fails is knocked Prone. Earth and stone in the area is difficult terrain until the start of the mountain guardian's next turn."}]
