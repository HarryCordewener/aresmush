  actions: [{"name": "Blessed Shield", "type": "passive", "traits": [], "text": "In the deific champion's hands, a shield gains the moderate reinforcing rune , giving it Hardness 8, 84 HP, and BT 42."}, {"name": "Deific Reactions", "type": "passive", "traits": [], "text": "At the start of each of their turns, the deific champion gains an additional reaction they can only use to make a Reactive Strike or to Shield Block."}, {"name": "Champion's Aura", "type": "passive", "traits": ["aura", "divine"], "text": "15 feet.%rAny follower of Iomedae in the aura knows the champion is a champion of Iomedae. At the end of the champion's turn, each ally in the aura reduces its Frightened value by 1. The aura can be suppressed or resumed with a single action, which has the concentrate trait, and ends if the champion falls Unconscious."}, {"name": "Champion's Courage", "type": "passive", "traits": [], "text": "When the champion becomes Frightened, they reduce the condition value by 1 (to a minimum of 0)."}, {"name": "Exalted Retributive Strike", "type": "reaction", "traits": ["divine"], "text": "Trigger An enemy damages the deific champion's ally, and both are in the deific champion's aura%rEffect The ally gains resistance 14 to all damage against the triggering damage. If the enemy is within reach, the deific champion makes a melee Strike against it. Each ally in the champion's aura can spend a reaction to Strike the target with a –5 penalty.%rEffect: Exalted Retributive Strike"}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Shield Block", "type": "reaction", "traits": []}, {"name": "Will Not Fall", "type": "free", "traits": [], "text": "Trigger The deific champion's Hit Points are reduced to 0 for the first time that day%rEffect The champion presses on, refusing to fail their god. They remain standing with 25 Hit Points."}, {"name": "Will Not Falter", "type": "action", "traits": [], "cost": 2, "text": "Effect The deific champion declares their devotion to their deity and their cause. They Stride, then make a melee Strike. If the Strike hits an enemy, all allies within their champion's aura gain a +2 status bonus to attack rolls and saving throws against fear until the start of the deific champion's next turn.%rEffect: Will Not Falter"}]
