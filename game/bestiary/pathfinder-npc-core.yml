  actions: [{"name": "Mark of Fate", "type": "passive", "traits": ["curse", "divine"], "text": "A creature that slays the deific vessel must succeed at a DC 35 Will save or be visibly marked as anathema to Urgathoa. It gains weakness 10 to unholy and takes a –2 circumstance penalty to Charisma-based skill checks against followers of Urgathoa. Creatures attempting to Gather Information about or Track the marked creature gain a +2 circumstance bonus to their checks.%rThe mark can't be hidden and can be removed only by participating in an atone ritual led by a worshipper of Urgathoa who is…"}, {"name": "Limited Lifespan", "type": "passive", "traits": ["divine"], "text": "The deific vessel takes 25 untyped damage at the end of its turn if it Cast a Spell, used Borrow Time, or made a Strike that turn. This damage ignores resistance."}, {"name": "Shattered Vessel", "type": "passive", "traits": ["divine", "unholy"], "text": "When the deific vessel dies, the divine power barely contained within their form explodes outward, dealing 6d8 spirit|options:area-damage damage to each creature in a 30-foot emanation with a DC 33 Reflex save."}, {"name": "Void Tendrils", "type": "passive", "traits": ["aura", "divine", "void"], "text": "30 feet.%rWhen a creature in the aura would be healed by a vitality effect, the healing is reduced by 15 and the deific vessel regains 15 healing Hit Points."}, {"name": "Borrow Time", "type": "action", "traits": ["divine", "void"], "cost": 1, "text": "The vessel chooses two different creatures in their void tendrils aura. Each one must be either undead or the vessel themself. One target loses 25 untyped HP and the other regains that many HP. If a target is unwilling, it can negate the transfer with a successful DC 39 Fortitude save."}, {"name": "Grave Chill", "type": "passive", "traits": ["divine"], "text": "The vessel's unarmed attacks and scythe gain the +2 Decaying Frost greater striking runes when used by the vessel, and their Strikes gain the death trait."}]
