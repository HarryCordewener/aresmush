  actions: [{"name": "Custom Gear", "type": "passive", "traits": [], "text": "The wealthy vigilante's support team has spent years tailoring and tuning the vigilante's equipment. Anyone but the vigilante attempting to use the items takes the same drawbacks they would if they were shoddy items. These peculiarities make the items have no value if sold."}, {"name": "Talisman Prepper", "type": "passive", "traits": [], "text": "The vigilante goes on patrol with six talismans of 6th level or lower. The typical set includes a Fear Gem and Emerald Grasshopper affixed, with a Dragon Turtle Scale, Effervescent Ampoule, Feather Step Stone, and Iron Cube in storage."}, {"name": "Quick Replace", "type": "reaction", "traits": ["manipulate"], "text": "Trigger The wealthy vigilante Activates one of their affixed talismans%rRequirements The wealthy vigilante has a hand free%rEffect As soon as one of their talismans burns out, the wealthy vigilante pulls another from their crimefighting pouches and deftly Affixes it to replace the used talisman."}, {"name": "Calculated Strike", "type": "action", "traits": [], "cost": 2, "text": "The wealthy vigilante makes a melee Strike. If the Strike hits, the vigilante can then shove the target. This Shove uses the same multiple attack penalty as the Strike and doesn't count toward the vigilante's multiple attack penalty, but the vigilante must Stride after the pushed creature. If the Strike misses, the vigilante can Step up to three times, each of which must take it further from the target. The vigilante can hide if, after the Steps, they have cover or concealment from the target."}]
