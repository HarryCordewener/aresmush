  actions: [{"name": "Invisibility Scan", "type": "passive", "traits": [], "text": "Invisibility can't make anything Undetected or Unnoticed to the watchmage squadron."}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 120 (3 segments), 60 (2 segments)"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever a troop moves, you move one of its segments and the other segments follow behind it. At the end of the movement, you can group the other segments adjacent to the one you moved as you see fit, provided none of them moves farther than the moving segment. If you choose not to move the troop any distance, you can instead reshape the position of all the segments as long as one stays in place."}, {"name": "Bash Heads", "type": "action", "traits": ["nonlethal"], "cost": 2, "text": "The watchmages lash out against all enemies in a 5-foot emanation with their fists, dealing (4d4+4) bludgeoning|options:area-damage damage with a DC 29 Reflex save."}, {"name": "Fire Shortbows!", "type": "action", "traits": ["arcane"], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The watchmages fire a volley against each enemy in a 10-foot burst within 150 feet, with a DC 26 Reflex save. The damage depends on the number of actions. When the squadron is reduced to 2 or fewer segments, this area decreases to a 5-foot burst.%r1 1d6+3 piercing plus 1d6 force damage%r2 3d6+6 piercing plus 1d6 force damage%r3 4d6+6 piercing plus 1d6 force damage"}, {"name": "Troop Spellcasting", "type": "passive", "traits": [], "text": "When the watchmage squadron Casts a Spell, the individual members combine their efforts into casting a more powerful version than any one member could achieve alone. When Casting a Spell that has an area of a burst, cone, or line and doesn't have a duration, increase the area of that spell. Add 5 feet to the radius of a burst that normally has a radius of at least 10 feet (a burst with a smaller radius is not affected). Add 5 feet to the length of a cone or line that is normally 15 feet long or…"}]
