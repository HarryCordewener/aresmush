  actions: [{"name": "Stench of Decay", "type": "passive", "traits": ["aura", "occult", "olfactory"], "text": "The necromancer emits a scent of putrid rot in a 5-foot emanation. A living creature that enters or begins its turn in the aura is Sickened 1."}, {"name": "Undead, Arise!", "type": "action", "traits": ["concentrate", "manipulate", "occult"], "cost": 1, "text": "The necromancer summons two Medium undead entities in different empty squares up to 30 feet away. These undead entities can take the form of zombies, skeletons, or ghosts, chosen by the necromancer. The entities block movement as though they were creatures and can be attacked. Each entity has 1 Hit Point and the same AC and saves as the necromancer. They can't take actions of their own and deteriorate if the necromancer is reduced to 0 Hit Points. The necromancer can have up to four undead…"}, {"name": "Undead, Attack!", "type": "action", "traits": ["concentrate", "occult"], "cost": 2, "text": "Requirements The necromancer has at least one undead entity active%rEffect The necromancer commands all their undead entities to attack. Each entity can Stride up to 20 feet into an empty square and make a Strike. The Strike has a +15 attack modifier and deals 2d12 bludgeoning|traits:magical damage (or spirit damage if the entity is a spirit). The Strike has the magical trait, and no multiple attack penalty applies to it."}, {"name": "Wave of Death", "type": "action", "traits": ["concentrate", "manipulate", "occult", "void"], "cost": 2, "text": "Requirements The necromancer isn't drained and has at least one undead entity active%rEffect The necromancer overloads their undead entities with void energy, causing all of them to explode. Each entity is destroyed, dealing 4d12 void|options:area-damage damage to each creature in a 10-foot emanation with a DC 23 Fortitude save. A creature in more than one explosion is damaged only once. The necromancer becomes Drained 1."}]
