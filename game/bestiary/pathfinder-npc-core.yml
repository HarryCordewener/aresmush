  spellcasting: [{"name": "Occult Spontaneous Spells", "tradition": "occult", "type": "spontaneous", "dc": 31, "attack": 23, "spells": {"0": ["Detect Magic", "Figment", "Telekinetic Hand", "Telekinetic Projectile", "Void Warp"], "1": ["Bane", "Command", "Fear"], "2": ["Darkness", "Ghostly Carrier", "Peaceful Rest"], "3": ["Clairaudience", "Ghostly Weapon", "Levitate"], "4": ["Clairvoyance", "Fly", "Talking Corpse"], "5": ["Invoke Spirits", "Spiritual Guardian", "Wave of Despair"], "6": ["Dominate", "Spirit Blast"], "7": ["Interplanar Teleport (to or from the Ethereal Plane only)"]}}]
