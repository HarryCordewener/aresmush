  actions: [{"name": "Goblins Chant and Goblins Sing!", "type": "passive", "traits": ["auditory", "aura"], "text": "30 feet. The goblin get gang's disharmonious chorus of disturbing lyrics makes it difficult to concentrate. Any creature performing a concentrate action in the area must succeed at a DC 19 Will save or the action is lost. On a critical success, the creature is temporarily immune for 1 minute."}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 60 (3 segments), 30 (2 segments)"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever a troop moves, you move one of its segments and the other segments follow behind it. At the end of the movement, you can group the other segments adjacent to the one you moved as you see fit, provided none of them moves farther than the moving segment. If you choose not to move the troop any distance, you can instead reshape the position of all the segments as long as one stays in place."}, {"name": "Goblins Bound and Goblins Swing!", "type": "passive", "traits": [], "text": "Goblins have difficulty staying in formation, especially during combat. The goblin get gang can take a move action only if it has used at least one action to Goblins Slash and Goblins Scar! this turn or if there are no conscious enemies adjacent to it."}, {"name": "Goblins Burn and Goblins Char!", "type": "action", "traits": [], "cost": 2, "text": "The troop's members throw a barrage of burning torches. Each creature in a 10-foot burst within 30 feet of the troop takes 2d8 fire|options:area-damage damage with a DC 20 Reflex save. When the troop is reduced to 2 or fewer segments, this area decreases to a 5-foot burst."}, {"name": "Goblins Slash and Goblins Scar!", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The goblin get gang uses dogslicers, horsechoppers, and burning torches to attack each enemy in a 5-foot emanation, with a DC 20 Reflex save. The damage depends on the number of actions.%r1 1d6 slashing,1d6 fire|options:area-damage damage%r2 (1d6+6) slashing,1d6 fire|options:area-damage damage%r3 (1d6+9) slashing,1d6 fire|options:area-damage damage"}]
