  actions: [{"name": "Flamboyant Performance", "type": "passive", "traits": [], "text": "A flamboyant thief's attempts to Steal don't automatically fail even if a creature is in combat or on guard. While being observed, the thief gains a +2 circumstance bonus to Deception checks to Create a Diversion or feint and to Thievery checks to palm-an-object or steal. However, they are compelled to leave a tangible sign of their presence, such as a calling card or symbol—often in place of a stolen item."}, {"name": "Vanishing Act", "type": "passive", "traits": [], "text": "The flamboyant thief can hide and sneak even without having cover or being Concealed."}, {"name": "Dramatic Entrance", "type": "free", "traits": ["emotion", "mental", "visual"], "text": "Trigger The flamboyant thief rolls initiative%rEffect The flamboyant thief draws all eyes to them. They attempt a Performance check, comparing the result against the Will DC of any number of creatures within 120 feet. Each creature the thief succeeds against is Fascinated with the thief until the end of the thief's next turn."}, {"name": "I Say When I'm Here", "type": "passive", "traits": [], "text": "When any detection, revelation, or scrying magic would reveal the flamboyant thief, the thief becomes aware of it and can attempt to counteract the magic with a counteract rank of 8th level and using their Stealth as their counteract modifier."}, {"name": "Nimble Dodge", "type": "reaction", "traits": [], "text": "Trigger The flamboyant thief is targeted with a melee or ranged attack by an attacker it can see.%rEffect The flamboyant thief gains a +2 circumstance bonus to AC against the triggering attack."}, {"name": "Dancing Dagger", "type": "action", "traits": [], "cost": 2, "text": "The flamboyant thief can Step, attempt a melee dagger Strike, and attempt a ranged dagger Strike, taking the actions in any order. Both Strikes count toward the thief's multiple attack penalty, but it doesn't increase until after both attacks."},