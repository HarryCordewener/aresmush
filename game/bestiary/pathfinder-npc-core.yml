 Electricity 60-foot line of electricity (DC 31 Reflex) Fire 30-foot cone of…"}, {"name": "Jump Jets", "type": "action", "traits": ["alchemical"], "cost": 1, "text": "The juggernaut gains a Fly speed of 15 feet until the end of their current turn. If the juggernaut isn't on solid ground when they lose their fly Speed, they fall. After the effect ends, the juggernaut can't use Jump Jets again for 1 round."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Medium or smaller, plated fist, DC 33 Reflex"}]
