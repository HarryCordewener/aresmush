  actions: [{"name": "Favored Game", "type": "passive", "traits": [], "text": "A monster hunter specializes in bringing down certain non-humanoid creatures. These favored game are typically animals and beasts, but an individual might hunt dragons, plants, or more specialized creatures like tigers or manticores."}, {"name": "Reactive Strike", "type": "reaction", "traits": [], "text": "Trigger A creature within your reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.%rYou lash out at a foe that leaves an opening. Make a melee Strike against the triggering creature. If your attack is a critical hit and the trigger was a manipulate action, you disrupt that action. This Strike doesn't count toward your multiple attack penalty, and your multiple attack penalty doesn't apply to this Strike."}, {"name": "Hunter's Onslaught", "type": "action", "traits": ["concentrate", "emotion", "mental"], "cost": 1, "text": "Frequency once per hour%rRequirements The monster hunter isn't Fatigued%rEffect The monster hunter leads an attack against their monstrous foe. The monster hunter chooses an enemy they can see that qualifies as their favored game. The monster hunter becomes Fascinated by that creature and gains 10 temporary Hit Points that last as long as the onslaught does. During the onslaught, the hunter gains a +8 status bonus to damage rolls against the designated enemy, and allies in a 30-foot aura around…"}, {"name": "Primal Fear", "type": "passive", "traits": ["emotion", "fear", "mental"], "text": "When the monster hunter hits a creature that qualifies as their favored game, that creature is Frightened 1 (or Frightened 2 on a critical hit)."}, {"name": "Sudden Charge", "type": "action", "traits": [], "cost": 2, "text": "The monster hunter Strides twice and makes a melee Strike."}]
