  actions: [{"name": "+14 to Sense Motive", "type": "passive", "traits": []}, {"name": "Contract Specialist", "type": "passive", "traits": [], "text": "For encounters involving matters of contracts and dealings with Hell, the infernal registrar is an 18th-level challenge."}, {"name": "Death is a Promotion", "type": "passive", "traits": [], "text": "The infernal registrar does not fear death, as they have a signed infernal contract for immediate promotion to a mid-ranked devil upon their soul's arrival in Hell. They're immune to all Intimidation checks to Coerce involving threats of death."}, {"name": "Friends in Low Places", "type": "passive", "traits": [], "text": "Though devils do not respect most mortals, they respect the office of infernal registrar. No creature with the devil trait of 18th level or lower will knowingly and willingly attack an infernal registrar."}, {"name": "Technically Correct", "type": "passive", "traits": [], "text": "The infernal registrar uses their Legal Lore modifier on all Deception checks to Lie."}, {"name": "+2 Circumstance to All Saves vs. Fear", "type": "passive", "traits": []}, {"name": "A Favor for a Favor", "type": "action", "traits": ["concentrate", "divine"], "cost": 3, "text": "The infernal registrar has the authority to make limited infernal contracts with other mortals. They summon a contract with the legal language they desire. Detecting Hidden clauses in the contract requires a successful DC 43 Society or a DC 38 Legal Lore check. Once signed, the contract vanishes into the infernal filing system in Hell. The infernal registrar cannot grant any boons beyond their own personal power (usually limited to information, advice, or access to elements of the infernal…"}, {"name": "Request Document", "type": "action", "traits": ["concentrate", "divine"], "cost": 3, "text": "The infernal registrar makes a request to summon a copy of any infernal contract a specific creature has signed. They must know enough information to specifically identify the individual who signed. The infernal registrar attempts a Legal Lore check with a DC equal to a hard DC of the level of the creature in question. The infernal registrar will never promise a successful use of this ability in the agreements they make. Each agreement is typically for one attempt. Any copy summoned is simply a…"}]
