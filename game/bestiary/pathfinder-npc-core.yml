  actions: [{"name": "Big Boom Gun", "type": "passive", "traits": [], "text": "The scavenger's gun is a comically oversized hand cannon that has the fatal d12 trait and a 20-foot range increment. If a Strike with it critically fails, the weapon misfires and explodes, dealing 1d12 fire damage to its wielder. It's a martial one-handed weapon with 2 Bulk and a Price of 10 gp. It has the uncommon, cobbled, and goblin traits. The cobbled trait means that on a failed attack roll with the gun, the user must succeed at a DC 5 Flat or the weapon misfires."}, {"name": "Finders Keepers", "type": "reaction", "traits": [], "text": "Trigger A creature within 15 feet drops an item%rRequirements The goblin scavenger has a hand free%rEffect The goblin scavenger Strides up to their speed to an adjacent square and Interacts to pick up the item. The movement triggers reactions as normal, but the Interact action to pick up the item does not."}, {"name": "Fireworks Barrage", "type": "action", "traits": ["manipulate"], "cost": 2, "text": "Requirements The goblin scavenger has a free hand%rEffect The goblin scavenger draws a bundle of fireworks and launches them toward a point within 60 feet, where they explode, dealing 1d10 fire,1d10 sonic|options:area-damage damage in a 10-foot burst. Every creature in the area must attempt a DC 21 Reflex save.%rCritical Success The creature is unaffected. The goblin scavenger realizes that's because a firework fell at their feet and takes 2 fire damage when it explodes in their face.%rSuccess…"}, {"name": "One Person's Junk", "type": "passive", "traits": [], "text": "The goblin scavenger intuitively knows how to make use of junk. When they use a weapon with the goblin trait or an improvised weapon, they do an additional die of damage (already included in the Strikes above)."}]
