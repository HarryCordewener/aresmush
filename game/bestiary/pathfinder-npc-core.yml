  actions: [{"name": "Monomania", "type": "passive", "traits": [], "text": "Each obsessive researcher is preoccupied with a hyper-specialized, niche body of knowledge (their Narrow Lore) in which they are the acknowledged world authority. The catch is that when such an expert goes wrong, they go badly wrong—if an obsessive researcher gets a success on a Narrow Lore roll, they get a critical success instead. But if they roll a failure, then they get a critical failure instead."}, {"name": "World-Class Authority", "type": "passive", "traits": [], "text": "In their narrow field of interest, the obsessive researcher is a 10th-level challenge."}, {"name": "Idée Fixe", "type": "passive", "traits": [], "text": "Nothing gets between the obsessive researcher and their subject. If the obsessive researcher is targeted by a spell or ability with a Will save that would prompt them to give up, ignore, or divert course from the subject of their Narrow Lore (for example, using a Suggestion to get a specialist in Jistkan artificing to give up a construct part), then the obsessive researcher can use their Narrow Lore skill in place of their Will save."}, {"name": "Furious Harangue", "type": "action", "traits": ["auditory", "emotion", "fear", "mental"], "cost": 2, "text": "The researcher starts hectoring an enemy within 30 feet, upbraiding them for daring to interrupt such valuable research. The target must attempt a DC 15 Will save. On a failure, they are Frightened 2 (Frightened 3 and Fleeing for 1 round on a critical failure). Regardless of the result of its save, the target is temporarily immune for 1 hour."}]
