  actions: [{"name": "Good Enough to Eat", "type": "passive", "traits": [], "text": "The goblin chef can turn otherwise inedible items into meals for others. They can provide food for any number of creatures without using the Subsist downtime activity as long as garbage is readily available. A non-goblin who eats the goblin chef's food must attempt a DC 14 Fortitude save. On a failure, they suffer an upset stomach for 1 day; if they attempt to willingly ingest anything else during that period, they must first succeed at a DC 4 Flat or the action is disrupted."}, {"name": "Kitchen Specialist", "type": "passive", "traits": [], "text": "For encounters involving cooking, a goblin chef is a 3rd-level challenge."}, {"name": "+2 circumstance bonus against ingested poisons", "type": "passive", "traits": []}, {"name": "Eat a Pickle", "type": "action", "traits": [], "cost": 2, "text": "Effect The goblin chef draws a pickle and eats it or feeds it to an adjacent ally. The chef or ally gains 4 temporary Hit Points and ignores any penalties from emotion effects or fatigue for 1 round.%rEffect: Eat a Pickle"}]
