  actions: [{"name": "Bonded Eidolon", "type": "passive", "traits": [], "text": "The god caller fights alongside a mystical ally called an eidolon, most likely the Beast Eidolon. The eidolon has the standard number of actions, uses its normal stat block, and counts toward the encounter's XP budget normally. The eidolon must remain within 100 feet of the god caller, or its physical form will dissolve. The god caller can make their eidolon take form or disappear with the Manifest Eidolon action."}, {"name": "Beseech the Spirits", "type": "action", "traits": ["concentrate", "primal"], "cost": 1, "text": "Frequency once per day%rEffect The god caller reaches out to local entities for enhanced perception and perspective. The god caller gains lifesense 60 feet and all-around vision for 10 minutes. The god caller can't use this ability again until after propitiating the spirits during their next daily preparation."}, {"name": "Manifest Eidolon", "type": "action", "traits": ["concentrate", "manipulate", "primal", "teleportation"], "cost": 3, "text": "The god caller causes their eidolon to manifest in a space adjacent to them if it's unmanifested, or to unmanifest and disappear from physical reality if it was already manifested."}, {"name": "Tandem Trick", "type": "passive", "traits": ["primal"], "text": "Frequency once per round%rEffect The god caller uses a team tactic with their eidolon, chosen from the following list, with the listed number of actions and traits.%rEnlarge 2 (concentrate, manipulate) The god caller casts Enlarge on their eidolon even if the eidolon is beyond range or line of effect. The god caller doesn't need to expend a spell slot, and can choose 2nd or 4th rank. Tandem Strike 2 The god caller makes a Strike and their eidolon can Strike as a reaction. Both attacks count…"}]
