  actions: [{"name": "Grease Some Palms", "type": "passive", "traits": [], "text": "A smuggler is adept at navigating official channels and makes network contacts in order to keep their goods moving. They gain a +2 circumstance bonus to Make an Impression and Request with members of the local bureaucracy."}, {"name": "Keen Eyes", "type": "passive", "traits": [], "text": "The halfling gains a +2 circumstance bonus when using the Seek action to find Hidden or Undetected creatures within 30 feet of them. Whenever the halfling targets a creature that is Concealed or hidden from them, reduce the DC of the flat check to DC 3 Flat for a concealed target or DC 9 Flat for a hidden one."}, {"name": "Distracting Escape", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rEffect Smugglers succeed by making a move only after they've diverted others' attention. The smuggler Creates a Diversion. If the smuggler became Hidden to at least one creature, the smuggler can then Sneak."}, {"name": "Hidden Pockets", "type": "free", "traits": [], "text": "Frequency once per round%rEffect The smuggler Interacts to draw an item of light Bulk concealed in one of their hidden pockets. The pockets can store up to four objects of light Bulk. For most smugglers, these items are Arsenic, an Elixir of Life (Lesser), a Smoke Ball (Lesser), and a Thieves' Toolkit. The smuggler can refill the pockets over the course of 1 minute."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The smuggler deals an extra 2d6 precision damage to Off-Guard creatures."}]
