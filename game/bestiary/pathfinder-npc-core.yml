  actions: [{"name": "Dwarven Doughtiness", "type": "passive", "traits": [], "text": "Dwarves are often calm and collected in the face of imminent danger. At the end of the battalion's turn, reduce its Frightened condition by 2 instead of 1."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Shield Block", "type": "reaction", "traits": []}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 70 (3 segments), 35 (2 segments)"}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever a troop moves, you move one of its segments and the other segments follow behind it. At the end of the movement, you can group the other segments adjacent to the one you moved as you see fit, provided none of them moves farther than the moving segment. If you choose not to move the troop any distance, you can instead reshape the position of all the segments as long as one stays in place."}, {"name": "Bombing Barrage", "type": "action", "traits": [], "cost": 2, "text": "The dwarf battalion draws alchemical bombs, then hurls them at distant foes. This volley is a 10-foot burst within 60 feet that deals 3d6[@item.flags.system.rulesSelections.bombingBarrage]|options:area-damage damage with a DC 21 Reflex save. The damage is either acid, fire, or electricity damage, depending on which type of bombs the battalion used. When the dwarf battalion is reduced to 2 or fewer segments, this area decreases to a 5-foot burst."}, {"name": "Coordinated Pummel", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The dwarf battalion unleashes a storm of warhammer blows against each enemy in a 5-foot emanation (DC 21 Reflex save). The damage depends on the number of actions.%r1 1d8 bludgeoning|options:area-damage damage%r2 (2d8+5) bludgeoning|options:area-damage damage%r3 (3d8+5) bludgeoning|options:area-damage damage"}, {"name": "Dwarven War Song", "type": "action", "traits": ["auditory", "concentrate", "emotion", "fear", "mental"], "cost": 1, "text": "The battalion joins together to sing a traditional song of battle. Each enemy in a 30-foot emanation must succeed at a DC 23 Will save or be Frightened 1 (or Frightened 2 on a critical failure). Each enemy is then temporarily immune for 10 minutes."}, {"name": "Shields Up!", "type": "action", "traits": [], "cost": 1, "text": "The battalion raises their steel shields. It gains a +2 circumstance bonus to AC and Reflex saves until the start of its next turn."}]
