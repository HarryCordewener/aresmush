st": 2, "text": "The deluded mob hurls detritus in a 10-foot burst within 30 feet that deals 2d8 bludgeoning|options:area-damage damage with a DC 18 Reflex save. When the mob is reduced to 2 or fewer segments, this area decreases to a 5-foot burst."}]
