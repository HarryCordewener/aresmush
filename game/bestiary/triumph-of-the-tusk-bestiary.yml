  actions: [{"name": "Walk the Ethereal Line", "type": "action", "traits": [], "cost": 2, "text": "The One Eye phantom walks the thin line between the Ethereal Plane and the Universe in order to exist on both planes simultaneously. They can shift back to solely on the Ethereal Plane by using this ability again."}, {"name": "Atonement for the Damned", "type": "passive", "traits": [], "text": "PCs might try to calm the phantoms instead of destroying them. At the GM's discretion, the PCs may attempt skill checks to talk down the spirits. On a success, the phantom's AC lowers by 2 as they become more willing to move on from their shame and dishonor, and they might even waver in attacking the PCs. Spells or rituals like Atone that require penitent creatures have no effect on these phantoms."}, {"name": "Ectoplasmic Bleed", "type": "passive", "traits": [], "text": "If a creature hits the phantom with a melee Strike, the creature is splashed with ectoplasm, taking (2d4+7) spirit damage (DC 21 Reflex save). On a failure, the creature is also Slowed 1."}, {"name": "Susceptible to Death", "type": "passive", "traits": [], "text": "Though phantoms aren't alive, neither are they undead, and they are uniquely vulnerable to the effects of death. A phantom whose Hit Points are reduced to 0 as a result of a death effect (such as from a spell like Execute) is immediately whisked away to the River of Souls, where their soul resumes the usual path to afterlife."}, {"name": "Phantom Touch", "type": "passive", "traits": ["spirit"], "text": "Each time they make a Strike, the One Eye phantom can choose to deal spirit damage instead of the normal physical damage type."}, {"name": "Skullcracker", "type": "action", "traits": ["concentrate", "illusion", "mental", "occult", "spirit"], "cost": 2, "text": "The One Eye phantom grabs the head of a creature as a jagged, spectral stone seeped with blood manifests before it. The One Eye phantom smashes the head of the creature against the stone with supernatural force, dealing (2d12+7) spirit damage with a DC 19 Will save.%rCritical Success The creature is unaffected.%rSuccess The creature takes half damage.%rFailure The creature hallucinates that their skull has been fractured. They take full damage and are Stupefied 2.%rCritical Failure As failure,…"}]
