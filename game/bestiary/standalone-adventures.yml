  actions: [{"name": "Focusing Drone", "type": "reaction", "traits": ["auditory", "mental"], "text": "Trigger Zungur attempts a Will saving throw%rEffect Zungur reflexively groans in a series of low, rhythmic croaking sounds to help her focus her mind on her faith in the frog goddess Gogunta. She rolls a Performance check. She can use the higher result between her Performance check and her Will saving throw to resolve the effects against the attack that triggered her Will saving throw."}, {"name": "Destructive Croak", "type": "action", "traits": ["sonic"], "cost": 2, "text": "Zungur utters a powerful croak that deals 4d6 sonic damage to any non-boggard within a 15-foot emanation. Any creature with the frightened condition takes additional sonic damage equal to twice the value of its frightened condition. Zungur can't use Destructive Croak again for 1d4 rounds."}, {"name": "Swamp Passage", "type": "passive", "traits": [], "text": "A boggard warrior ignores difficult terrain caused by swamp terrain features."}, {"name": "Terrifying Croak", "type": "action", "traits": ["auditory", "emotion", "fear", "mental"], "cost": 1, "text": "The boggard warrior unleashes a terrifying croak. Any non-boggard within 30 feet becomes Frightened 1 unless they succeed at a DC 19 Will save; those who critically succeed are temporarily immune for 1 minute."}, {"name": "Tongue Grab", "type": "passive", "traits": [], "text": "If the boggard warrior hits a creature with their tongue, that creature becomes Grabbed by the boggard. Unlike with a normal Grab, the creature isn't Immobilized, but it can't move beyond the reach of the boggard's tongue. A creature can sever the tongue by hitting AC 15 and dealing at least 3 slashing damage. Though this doesn't deal any damage to the boggard, it prevents them from using their tongue Strike until they regrow their tongue, which takes a week."}]
