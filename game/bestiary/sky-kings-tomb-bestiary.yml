  actions: [{"name": "Tremorsense (Imprecise) 100 Feet", "type": "passive", "traits": []}, {"name": "Relentless", "type": "passive", "traits": [], "text": "When a juvenile cave worm gains the Paralyzed, Slowed, or Stunned condition, reduce the duration by half, to a minimum of 1 round. It also recovers from penalties to its Speeds and the Immobilized condition at the end of its turn. Finally, it ignores non-magical difficult terrain and treats greater difficult terrain like difficult terrain."}, {"name": "Shake It Off", "type": "reaction", "traits": [], "text": "Frequency once per day%rTrigger The juvenile cave worm would be affected by a condition or adverse effect (such as Cursed Metamorphosis)%rEffect The juvenile cave worm negates the triggering condition or effect. Effects from artifacts, deities, or a similarly powerful source can't be avoided in this way."}, {"name": "Clumsy Leap", "type": "action", "traits": [], "cost": 2, "text": "The cave worm flings its body, Leaping 30 feet. If it lands next to a creature, it can Strike that creature with its jaws. If the jaws Strike fails, it can Strike with its body using the same multiple attack penalty as the failed jaws Strike, but it becomes Off-Guard until the start of its next turn."}, {"name": "Killing Shake", "type": "action", "traits": [], "cost": 2, "text": "Requirements The juvenile cave worm has a Medium or smaller creature Grabbed%rEffect The juvenile cave Juvenile Cave Worm worm shakes the creature back and forth quickly, tearing flesh with its multiple rows of teeth. The target takes (2d12+9) slashing damage and is knocked Prone. If the creature is adjacent to a solid surface, such as a stone wall, it takes an additional 2d6 bludgeoning damage. The creature attempts a DC 23 Reflex save against all damage; if the creature succeeds, it isn't…"}, {"name": "Rock Tunneler", "type": "passive", "traits": [], "text": "A juvenile cave worm can burrow through solid stone at a Speed of 10 feet. It can leave a tunnel if it desires, and it usually does."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Medium, (1d8+10) bludgeoning, Rupture 18"}, {"name": "Improved Grab", "type": "free", "traits": []}]
