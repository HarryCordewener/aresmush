  actions: [{"name": "Possessed", "type": "passive", "traits": [], "text": "A hostile spirit controls Krohan, which gives him the void healing ability and otherwise has the same effect as the Possession spell. Krohan attempts a DC 20 Flat at the end of his turn; this is reduced to DC 15 Flat if the corrupted blade spirit is destroyed. If he succeeds, the possession effect is suppressed and he is Slowed 1 until the end of his next turn, allowing him to act normally. If he critically succeeds, the possession effect ends."}, {"name": "Occult Catharsis", "type": "passive", "traits": ["emotion", "healing", "occult"], "text": "Krohan's magic converts his pain into spellpower. After he casts an innate occult spell, he attempts a DC 5 Flat, increasing the DC by twice the spell's rank if it was not a cantrip. On a success, Krohan's Spirits Drawn to Suffering effect ends; he can reduce the value of one condition affecting him by 1, and he regains 2d6 healing Hit Points."}, {"name": "Spirits Drawn to Suffering", "type": "free", "traits": ["occult"], "text": "Frequency once per 10 minutes%rTrigger Krohan critically fails a saving throw, takes mental damage, takes damage from a critical hit, or gains a harmful condition with a numerical value (such as frightened or sickened). This effect does not trigger due to self-harm or similarly engineered circumstances.%rEffect Krohan gains the ability to cast his innate occult spells for 1 minute."}, {"name": "Unwitting Rivethun", "type": "passive", "traits": [], "text": "Krohan has very limited access to Rivethun magic, able to cast spells only when experiencing pain or distress."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Righthand Man", "type": "passive", "traits": [], "text": "Krohan gains a +2 circumstance bonus to attack rolls and skill checks attempted to Aid others. He can attempt a Dwarf Lore check in place of any other attack roll or skill check to Aid a dwarf."}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 20, "attack": 12, "spells": {"0": ["Chill Touch", "Daze", "Forbidding Ward"], "1": ["Fear", "Magic Weapon", "Spirit Link"], "2": ["Soothe", "Sound Burst", "Telekinetic Maneuver"]}}]
