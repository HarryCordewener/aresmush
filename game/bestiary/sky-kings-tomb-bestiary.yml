  actions: [{"name": "Tremorsense (Imprecise) within their entire bound yard", "type": "passive", "traits": []}, {"name": "Master of the Yard", "type": "passive", "traits": [], "text": "The dvorovoi helps or causes trouble in the yard, milking or scaring cows, protecting or scattering tools, and so forth. By commanding their home to attack, the dvorovoi can Grapple, Shove, Trip, and Disarm with their enraged home Strike.%rThe dvorovoi uses their Household Lore instead of Athletics skill for these checks."}, {"name": "Shy", "type": "passive", "traits": [], "text": "A dvorovoi is naturally Invisible while within sight of their bound home. The dvorovoi can become visible, or even selectively visible-allowing some people to see them."}, {"name": "Rile Augdunars", "type": "action", "traits": ["auditory", "emotion", "fear"], "cost": 1, "text": "1 or 2%rFrequency once per round%rEffect Algerschmick goads the animals and incites their anger. She attempts a DC 11 Flat (DC 6 Flat if she used two actions). If she succeeds, she negates one successful check the PCs have made to disable the hazard. This action makes enough noise that attempts to Seek Algerschmick can detect her, even if she isn't in the area that a PC is searching."}]
