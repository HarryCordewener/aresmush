  strikes: [{"name": "Fist", "bonus": 10, "damage": [["1d6+4", "bludgeoning", null]], "traits": ["agile", "finesse", "unarmed"]}, {"name": "Spore Shephard's Staff", "bonus": 12, "damage": [["2d4+3", "bludgeoning", null]], "traits": ["two-hand-d8"]}, {"name": "Spore Pod", "bonus": 12, "damage": [["2d6+3", "bludgeoning", null]], "traits": [], "range": 30, "effects": ["Spores"]}]
  actions: [{"name": "Sporesense (Imprecise) 60 feet", "type": "passive", "traits": ["primal"], "text": "A hyphae tyrant intuitively senses and tracks all nearby fungi. The sense can distinguish between fungus creatures, features made of fungus, and creatures covered in spores."}, {"name": "Spore Burst", "type": "passive", "traits": ["healing", "void"], "text": "When a hyphae tyrant dies, a burst of primal energy explodes from its body in a 30-foot, restoring 3d8 healing to each fungus creature and dealing 3d8 void|options:area-damage damage (DC 20 Fortitude save) to each non-fungus creature in the area. This area is filled with fungus, becoming difficult terrain."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph"], "cost": 1, "text": "The hyphae tyrant transforms into a Small fungus. This ability otherwise uses the effects of One with Plants."}, {"name": "Spore Cloud", "type": "action", "traits": ["poison"], "cost": 1, "text": "A hyphae tyrant unleashes a cloud of spores in a 20-foot. Each non-fungi creature in this area must succeed at a DC 20 Fortitude save or take 2 persistent poison|options:area-damage damage. A creature has its vision reduced as long as the persistent damage continues and can see only within 20 feet (or 10 feet on a critical failure)."}, {"name": "Spores", "type": "passive", "traits": [], "text": "A creature that takes damage from a hyphae tyrant's spore pod Strike must attempt a saving throw with the same DC and effect as its Spore Cloud ability."}]
  spellcasting: [{"name": "Occult Prepared Spells", "tradition": "occult", "type": "prepared", "dc": 21, "attack": 13, "spells": {"0": ["Dancing Lights", "Detect Magic"], "1": ["Grim Tendrils", "Lose the Path", "Ray of Enfeeblement"]}}, {"name": "Primal Innate Spells", "tradition": "primal", "type": "innate", "dc": 20, "attack": 0, "spells": {"1": ["Protector Tree (Creates Fungus)"], "4": ["Speak with Plants"]}}]
