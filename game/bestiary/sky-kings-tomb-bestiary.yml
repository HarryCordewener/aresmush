  actions: [{"name": "Personality Cage", "type": "passive", "traits": [], "text": "A soulbound mauler encapsulates an entire soul within its soul focus gem, with that soul's personality and past shining through along with a confusing mix of fragmented memories and instincts. This causes a soulbound mauler to match the donor soul's alignment and gain the corresponding alignment traits. When the mauler doesn't have a soul bound, it's inanimate."}, {"name": "Eager Rend", "type": "action", "traits": [], "cost": 2, "text": "The soulbound mauler has a living creature Grabbed.%rEffect The soulbound mauler holds the creature it has grabbed and attempts to tear it in two. That creature takes 5d6 bludgeoning damage (DC 18 Fortitude). On a critical failure, the target also becomes Enfeebled 1."}, {"name": "Tethered Soul", "type": "passive", "traits": [], "text": "The soul focus gem that powers a soulbound mauler is tethered with eight ectoplasmic leashes inside an open cavity in the creature's chest. It can be targeted directly with a Disarm, Grapple, or Steal action. Rather than the normal result of these actions, the soulbound mauler takes 4d6 mental damage and is Stunned 1 on a success; on a critical success, it takes 8d6 mental damage and is Stunned 2."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
