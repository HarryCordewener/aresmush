  actions: [{"name": "Unkillable", "type": "passive", "traits": [], "text": "Mumkuh is nigh unkillable. She loses her weakness to slashing and gains resistance 3 against all damage, and she gains weakness 6 to critical hits."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Command Zombie", "type": "action", "traits": ["concentrate", "divine", "incapacitation"], "cost": 1, "text": "The zombie lord intones blasphemous words to gain control over a zombie they can see within 100 feet. A zombie that is mindless and not under someone else's control falls under their control automatically; otherwise, the zombie or its controller can attempt a DC 22 Will save to avoid it being controlled (whichever has the higher modifier). The target zombie is temporarily immune for 24 hours if successful. The attempt fails if the zombie is the same level as the zombie lord or higher%rThe…"}, {"name": "Create Zombies", "type": "passive", "traits": ["concentrate", "divine", "evil"], "text": "A zombie lord can create lesser zombies with a 1-hour ritual. During this time, the zombie lord chants and performs an unholy dance over the corpses they intend to animate. Unlike normal rituals, this doesn't require a skill check or cost. At the end of this hour, the zombie lord can create one 1st- or 2nd-level zombie, or two zombies of level 0 or lower. These are automatically under the zombie lord's control and count toward the limit of Command Zombie. Any zombies created by the zombie lord…"}, {"name": "Shamble Forth!", "type": "action", "traits": ["concentrate", "divine"], "cost": 1, "text": "Frequency once per round%rEffect Each zombie controlled by the zombie lord Strides 5 feet (or Burrows, Climbs, Flies, or Swims 5 feet if it has the corresponding movement type)."}, {"name": "Zombie Commander", "type": "passive", "traits": [], "text": "Mumkuh can use Command Zombie on up to 16 zombies at once, enough to control an entire shambler troop."}]
