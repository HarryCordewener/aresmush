  actions: [{"name": "Adhesive", "type": "passive", "traits": [], "text": "The mimic is coated in an adhesive slime. Any creature that hits the mimic, is hit by the mimic, or otherwise touches the mimic must succeed at a DC 23 Reflex save or become Grabbed (escape dc=23). A weapon that hits the mimic is stuck to the mimic and can be removed with a successful DC 23 Athletics check (made as a single action).%rA mimic can have any number of objects or creatures stuck to it at a time. The mimic can release a stuck creature or object by using a single action, and the…"}, {"name": "Object Lesson", "type": "reaction", "traits": [], "text": "Trigger A creature touches or physically interacts with the mimic while the mimic is transformed using Mimic Object.%rEffect The triggering creature is automatically stuck by the mimic's adhesive (it receives no save). The mimic then makes a pseudopod Strike against any creature adjacent to the mimic.%rObject Lesson can't be used again until the mimic escapes and takes on a new disguise."}, {"name": "Mimic Object", "type": "action", "traits": ["concentrate", "polymorph"], "cost": 1, "text": "The mimic assumes the shape of any Medium object. This doesn't change the mimic's texture or overall size but can alter its coloration and visual appearance. It has an automatic result of 28 on Deception checks and DCs to pass as the object that it's mimicking."}]
