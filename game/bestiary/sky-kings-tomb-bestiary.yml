  actions: [{"name": "Riled by Disrespect", "type": "passive", "traits": [], "text": "An ancestral echo gains a +1 status bonus to attack rolls and saving throw DCs against any creature that has not performed at least one task to beautify the site to which the echo is bound. This apples to any PC who didn't succeed at one or more skill checks to clean area D2 ."}, {"name": "Site Bound", "type": "passive", "traits": [], "text": "The ancestral echo can't leave the upper crypt.%rA typical ghost can stray only a short distance from where it was killed or the place it haunts. A typical limit is 120 feet. Some ghosts are instead bound to a room, building, item, or creature that was special to it rather than a location."}, {"name": "Rejuvenation", "type": "passive", "traits": ["occult"], "text": "Restoring the vandalized inscriptions and reciting their corrected stories ushers these spirits back to the afterlife.%rWhen a ghost is destroyed, it re-forms after 2d4 days within the location it's bound to, fully healed. A ghost can be permanently destroyed only if someone determines the reason for its existence and sets right whatever prevents the spirit from resting."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Ancient Anecdote", "type": "action", "traits": ["auditory", "linguistic", "mental", "occult"], "cost": 1, "text": "Frequency once per round%rEffect Alkepsur banters with a creature within 60 feet while referencing a forgotten anecdote. The creature must attempt either a DC 18 Will saving throw or DC 15 Dwarf Lore check.%rSuccess The target is unaffected.%rFailure The target is Stunned 1 as they try to decipher the reference.%rCritical Failure The anecdote makes the target Confused and Stupefied 2 for 1 round."}]
