  actions: [{"name": "Not My Cap!", "type": "reaction", "traits": ["auditory"], "text": "Trigger Their bloodseeker mount fails their blood-crazed flat check%rRequirements the redcap is mounted on a giant bloodseeker%rEffect The bloodseeker may reroll the flat check."}, {"name": "Red Cap", "type": "passive", "traits": ["primal"], "text": "A redcap's woolen hat is dyed with the blood of its victims. If the redcap loses its cap, it no longer benefits from fast healing and takes a –4 status penalty to its damage rolls. It can create a new cap in 10 minutes, but that cap doesn't grant its powers until the redcap has turned it red with Blood Soak. A cap has no benefit for creatures other than the redcap who made it.%rEffect: Lost Red Cap"}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Divine Revulsion", "type": "passive", "traits": ["emotion", "fear", "mental"], "text": "If a redcap sees a creature brandish a religious symbol of a good deity (which requires an interact action by that creature) or use one to cast a divine spell, the redcap must attempt a DC 21 Will save. It then becomes temporarily immune to all brandished religious symbols for 10 minutes.%rCritical Success The redcap is unaffected%rSuccess The redcap is Frightened 2%rFailure The redcap gains the Fleeing condition for 1 round and is Frightened 4"}, {"name": "Blood Soak", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The redcap dips its cap in the blood of a slain foe. The foe must have died in the last minute, and the redcap must have helped kill it. The redcap gains a +4 status bonus to damage rolls for 1 minute.%rEffect: Blood Soak"}, {"name": "Flyby Swing", "type": "reaction", "traits": [], "text": "Trigger The recap's bloodseeker mount moves away from a creature within the redcap's reach%rRequirements The redcap is mounted on a giant bloodseeker%rEffect The redcap Strikes the creature with their scythe."}]
