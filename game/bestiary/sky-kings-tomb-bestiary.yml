  actions: [{"name": "Parasitized", "type": "passive", "traits": [], "text": "Lady Shimmersnip has two giant leeches partly burrowed into her body, making her Enfeebled 1 and Clumsy 2. These conditions' modifiers can change and aren't reflected in her stat block."}, {"name": "Scuttle", "type": "reaction", "traits": [], "text": "Trigger A creature that the giant crab can see targets the crab with an attack%rEffect The giant crab scuttles to the side and gains a +2 circumstance bonus to AC against the triggering attack. After the attack resolves, the crab can Stride up to its speed in a straight line as part of the reaction."}, {"name": "Vulnerable to Prone", "type": "passive", "traits": [], "text": "If a creature critically succeeds on a check to Trip the giant crab, the crab is flipped over onto its back in addition to the usual effects. A giant crab that is flipped onto its back has a particularly hard time defending itself; instead of taking the normal -2 circumstance penalty to AC for being Off-Guard, it takes a -4 circumstance penalty to AC."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(1d6+4) bludgeoning damage, DC 18 Fortitude"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
