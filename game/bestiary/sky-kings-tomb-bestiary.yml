  actions: [{"name": "Form Up", "type": "action", "traits": [], "cost": 1}, {"name": "Stench", "type": "passive", "traits": ["aura", "olfactory"], "text": "30 feet. A creature that enters the area must attempt a DC 21 Fortitude save. On a failure, the creature is Sickened 1, and on a critical failure, the creature also takes a –5 status penalty to its Speeds for 1 round. While within the aura, the creature takes a –2 circumstance penalty to saves to recover from the sickened condition. A creature that succeeds at its save is temporarily immune to all xulgaths stenches for 1 minute.%rEffect: Xulgath Stench"}, {"name": "Troop Defenses", "type": "passive", "traits": [], "text": "Thresholds 48 (3 segments), 24 (2 segments)"}, {"name": "Fang and Claw", "type": "action", "traits": [], "cost": 1, "text": "1 to 3%rFrequency once per round%rEffect The xulgath ravening lashes out at enemies within 5 feet (DC 21 Reflex save). The damage depends on the number of actions.%r1 1d6 slashing|options:area-damage damage%r2 (1d6+5) slashing|options:area-damage damage%r3 (2d6+5) slashing|options:area-damage damage"}, {"name": "Infected Wounds", "type": "passive", "traits": ["poison"], "text": "The xulgaths' Fang and Claw deals an additional 1d6 poison damage to any creature sickened by a xulgath's stench."}, {"name": "Sharpened Advance", "type": "action", "traits": [], "cost": 2, "text": "The troop fires a ranged attack in the form of a 5-foot within 50 feet that deals 3d6 piercing|options:area-damage damage (DC 18 Reflex save), then the troop either Steps or Strides up to 15 feet toward the area they attacked."}, {"name": "Troop Movement", "type": "passive", "traits": [], "text": "Whenever a troop Strides, it first Forms Up as a free action to condense into a 20-foot-by-20-foot area (minus any missing squares), then moves up to its Speed. This works just like a Gargantuan creature moving; for instance, if any square of the troop enters difficult terrain, the extra movement cost applies to the whole troop."}]
