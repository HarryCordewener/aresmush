  actions: [{"name": "Tremorsense (Imprecise) 10 Feet", "type": "passive", "traits": []}, {"name": "+2 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Inexorable", "type": "passive", "traits": [], "text": "When Narseigus gains the Paralyzed, Slowed, or Stunned condition, roll a DC 15 Flat. On a success, he ignores the condition."}, {"name": "Light Blindness", "type": "passive", "traits": []}, {"name": "Shake It Off", "type": "action", "traits": ["fortune", "primal"], "cost": 1, "text": "Frequency once per day%rTrigger Narseigus fails or critically fails a saving throw against a condition or adverse effect (such as Cursed Metamorphosis)%rEffect Narseigus rerolls the triggering saving throw and uses the better result."}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "If Narseigus' next action is to cast an occult spontaneous cantrip or an occult spontaneous spell of 4th level or lower, he reduces the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Narseigus' spellcasting action, he attempts a DC 15 Flat. On a success, the action isn't disrupted."}, {"name": "Worm Form", "type": "action", "traits": ["morph", "occult"], "cost": 1, "text": "Narseigus partially transforms his lower body into that of a cave worm. He can use only his tail unarmed Strike and his burrow and climb Speeds while in this form. This transformation lasts for 1 minute."}, {"name": "Worm's Feast", "type": "action", "traits": ["primal"], "cost": 2, "text": "Frequency once per day%rEffect Narseigus calls forth a brood of infantile cave worms to feast on his enemy's flesh. One creature within 30 feet must attempt a DC 27 Fortitude save.%rCritical Success The worms writhe away harmlessly.%rSuccess The target takes 2d6 piercing damage and 4d6 persistent piercing damage.%rFailure The target takes 6d6 piercing damage and 4