  strikes: [{"name": "Tail", "bonus": 15, "damage": [["1d6+7", "piercing", null], ["2d6", "poison", null]], "traits": ["agile", "reach-10"]}, {"name": "Wing", "bonus": 15, "damage": [["1d4+7", "bludgeoning", null]], "traits": ["agile", "nonlethal"]}]
  actions: [{"name": "Telepathy 100 Feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Telepathic Bond", "type": "passive", "traits": [], "text": "A slime puppeteer maintains a strong telepathic bond with the alghollthu that created it. This bond has planetary reach, but the puppeteer is blind and deaf while accessing this bond."}, {"name": "Stinky Sweat", "type": "passive", "traits": ["aura", "olfactory"], "text": "10 feet. When a slime puppeteer takes fire damage, they form a layer of pungent slime on their skin that remains until washed away. While the layer is present, creatures adjacent to the slime puppeteer must attempt a DC 24 Fortitude save. On a failure, the creature is Sickened 1. A creature that succeeds at its save is immune to the puppeteer's sweat for 1 minute."}, {"name": "Envelop", "type": "action", "traits": ["attack", "incapacitation"], "cost": 1, "text": "The puppeteer wraps their body around an adjacent target (DC 24 Reflex negates). The target is Restrained and the puppeteer is Immobilized. The puppeteer can make only tail Strikes against the restrained creature and can only engulf a single Medium or Large creature. The puppeteer can end an Envelop as a free action."}, {"name": "Mimic Form", "type": "passive", "traits": [], "text": "The puppeteer can take on the form of a corpse they have enveloped. This takes one hour, during which time the puppeteer can't move or attack and has an AC of 16. Once the target's form has been taken, the puppeteer cannot use its Envelop, fly speed, and swim speed abilities until Mimic Form ends. The puppeteer only has access to their wing Strike while using Mimic Form. The puppeteer can end Mimic Form as a three-action manipulate activity."}]
