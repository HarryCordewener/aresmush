  actions: [{"name": "Empathic Sense (Precise) 60 feet", "type": "passive", "traits": ["occult"], "text": "The unfeeling empath perceives all creatures affected by an emotion effect at the listed range."}, {"name": "Emotional Extremes", "type": "passive", "traits": [], "text": "If a creature rolls a success at a check to affect an unfeeling empath with an emotion effect, the creature gets a critical success instead. If a creature rolls a failure to affect an unfeeling empath with an emotion effect, the creature gets a critical failure instead. Likewise, when an unfeeling empath rolls a success at a Will save against an emotion effect, it gets a critical success instead. When a unfeeling empath rolls a failure at a Will save against an emotion effect, it gets a…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Cathartic Howl", "type": "action", "traits": ["auditory", "emotion", "mental", "sonic"], "cost": 2, "text": "Requirements The unfeeling empath is under an emotion effect%rEffect The unfeeling empath attempts to counteract the emotion effect, with a counteract modifier of +11. It then howls, projecting those emotions in a 15-foot (or a 30-foot if the unfeeling empath successfully counteracted the emotion effect). Creatures in the area take 2d8 mental|options:area-damage damage (DC 18 Will save). A creature that critically fails this saving throw also takes 1d4 mental persistent damage."}, {"name": "Drink Emotions", "type": "action", "traits": ["emotion", "healing", "mental"], "cost": 1, "text": "Requirements An enemy is under an emotion effect within 20 feet of the unfeeling empath%rEffect The unfeeling empath regains 1d4 healing Hit Points and becomes emotionally excited for 3 rounds. While excited, the unfeeling empath takes a –1 penalty to AC, gains a +1 status bonus to attack rolls, and deals an additional 1d4 mental damage with its melee Strikes.%rEffect: Drink Emotions"}, {"name": "Goad", "type": "action", "traits": ["emotion", "mental", "occult"], "cost": 1, "text": "The unfeeling empath floods a creature within 30 feet with countless memories and sensations. The target must attempt a DC 18 Will save.%rSuccess The target is unaffected.%rFailure The target is Stupefied 1 until the end of the unfeeling empath's next turn.%rCritical Failure The target is Stupefied 2 for 1d4 rounds."}]
