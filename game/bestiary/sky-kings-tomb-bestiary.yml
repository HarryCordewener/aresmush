  actions: [{"name": "Deny Advantage", "type": "passive", "traits": [], "text": "The gang leader isn't Off-Guard to creatures of 7th level or lower that are Hidden, Undetected, flanking, or using surprise attack."}, {"name": "Evasion", "type": "passive", "traits": [], "text": "When the gang leader rolls a success on a Reflex save, they get a critical success instead."}, {"name": "Light Blindness", "type": "passive", "traits": []}, {"name": "Nimble Dodge", "type": "reaction", "traits": [], "text": "Trigger The gang leader is targeted with an attack by an attacker they can see%rEffect The gang leader gains a +2 circumstance bonus to AC against the triggering attack."}, {"name": "Surprise Attack", "type": "passive", "traits": [], "text": "On the first round of combat, if the gang leader rolls Deception or Stealth for initiative, creatures who haven't acted are Off-Guard to the gang leader."}, {"name": "Brutal Rally", "type": "reaction", "traits": ["auditory", "emotion", "linguistic", "mental"], "text": "Trigger The gang leader rolls a critical hit against a creature%rEffect All allies that can see the gang leader gain a +1 circumstance bonus to attack rolls until the start of the gang leader's next turn.%rEffect: Brutal Rally"}, {"name": "Gang Up", "type": "passive", "traits": [], "text": "Any enemy is Off-Guard against the gang leader's melee attacks due to flanking as long as the enemy is within melee reach of both the gang leader and one of the gang leader's allies."}, {"name": "Quick Draw", "type": "action", "traits": [], "cost": 1, "text": "The gang leader Interacts to draw a weapon, then Strikes with that weapon."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The gang leader deals an extra 2d6 precision damage to Off-Guard creatures."}]
