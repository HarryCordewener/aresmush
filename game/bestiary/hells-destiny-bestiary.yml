ated lance attack against each enemy in a 10-foot emanation with a DC 25 Reflex save. The damage depends on the number of actions.%r1 (1d6+7) piercing|options:area-damage damage%r2 (2d6+14) piercing|options:area-damage damage%r3 (3d6+18) piercing|options:area-damage damage"}]
