  actions: [{"name": "Fiendish Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"], "text": "This functions as telepathy, except that the greater hellcat can speak mentally to any creature, regardless of language. This doesn't grant the greater hellcat the ability to understand what the other creature is thinking, unless that creature also understands Diabolic."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Elusive Terror", "type": "passive", "traits": ["divine", "mental"], "text": "A greater hellcat can live within the fears of others and use their dread to hide from sight. The greater hellcat can hide in the presence of Frightened creatures. If successful, the greater hellcat becomes Hidden from frightened creatures as if it moved behind cover or into concealment, but must otherwise Hide normally from non-frightened creatures."}, {"name": "Vengeful Growl", "type": "reaction", "traits": [], "text": "Trigger The greater hellcat is critically hit by any Strike%rEffect The greater hellcat's Menacing Growl recharges. The creature that dealt the triggering Strike must succeed at a DC 37 Will save or become Frightened 2 (Frightened 4 on a critical failure)."}, {"name": "Fearful Attack", "type": "passive", "traits": [], "text": "The hellcat deals an additional 3d6 precision damage to Frightened creatures."}, {"name": "Hell Pack Mindlink", "type": "action", "traits": ["concentrate", "divine"], "cost": 1, "text": "The greater hellcat telepathically links its senses to all other hellcats within 100 feet for 10 minutes. It loses this contact with any hellcat that moves out of a 100-foot radius. While linked to at least one ally, the greater hellcat can't be flanked and gains a +2 status bonus to Will saving throws."}, {"name": "Menacing Growl", "type": "action", "traits": ["auditory", "emotion", "fear", "mental"], "cost": 2, "text": "The greater hellcat produces a low growl to disorient and frighten foes. The hellcat can cause this vocalization to originate from somewhere else within 30 feet. Non-fiends in a 15-foot burst must attempt a DC 37 Will save. The hellcat can't issue another Menacing Growl for 1d4 rounds.%rCritical Success The creature is unaffected and is temporarily immune for 24 hours.%rSuccess The creature is Frightened 1.%rFailure The creature is Frightened 2.%rCritical Failure The creature is Frightened 4."}, {"name": "Pounce", "type": "action", "traits": [], "cost": 1, "text": "The greater hellcat Strides and makes a Strike at the end of that movement. If the greater hellcat began this action Hidden, it remains hidden until after the ability's Strike."}]
