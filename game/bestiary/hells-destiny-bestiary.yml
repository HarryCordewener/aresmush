  actions: [{"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Aura of Righteousness", "type": "passive", "traits": ["aura", "divine"], "text": "20 feet. Allies in the angelic host's aura gain a +2 status bonus to AC and saving throws against unholy creatures."}, {"name": "Troop Defenses", "type": "passive", "traits": []}, {"name": "Troop Movement", "type": "passive", "traits": []}, {"name": "Blessed Armaments", "type": "action", "traits": ["holy", "magical"], "cost": 1, "text": "The angels make coordinated melee attacks with their greatswords. Each enemy within a 5-foot emanation must attempt a DC 39 Reflex save. The damage depends on the number of actions.%r1 2d8 slashing,(1d6) spirit|options:area-damage damage%r2 (4d8+8) slashing,(2d6) spirit|options:area-damage damage%r3 (6d8+10) slashing,(3d6) spirit|options:area-damage damage"}, {"name": "Divine Lance Fusillade", "type": "action", "traits": ["holy", "magical"], "cost": 1, "text": "The angels unleash beams of divine energy in a 10-foot burst within 60 feet that deals 10d6 spirit|options:area-damage damage with a DC 39 Reflex save. When the angelic host is reduced to 2 segments, this area decreases to a 5-foot burst."}, {"name": "Troop Spellcasting", "type": "passive", "traits": [], "text": "When the angelic host Casts a healing Spell, the constituent members combine their efforts into casting a more powerful version of the spell than any one member could achieve alone. The spell restores an additional 2 Hit Points per rank."}]
