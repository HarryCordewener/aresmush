  actions: [{"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Rejuvenation", "type": "passive", "traits": ["divine"], "text": "When a graveknight is destroyed, their armor rebuilds their body over the course of 1d10 days—or more quickly if the armor is worn by a living host. If the body is destroyed before then, the process restarts.%rA graveknight can only be permanently destroyed by obliterating their armor (such as with Disintegrate), transporting it to the Forge of Creation, or throwing it into the heart of a volcano."}, {"name": "Sacrilegious Aura", "type": "passive", "traits": ["aura", "divine", "void"], "text": "30 feet.%rWhen a creature in the aura uses a vitality spell or ability, the graveknight automatically attempts to counteract it, with a counteract modifier of +22."}, {"name": "Thorned Armor", "type": "reaction", "traits": [], "text": "Trigger A creature grapples the Foresworn or Strikes him with an unarmed or melee weapon without the reach trait%rEffect Barbs tangle the triggering creature's attacking limb, and it must attempt a DC 30 Reflex save. On a failure, it must attempt a DC 5 Flat to move away from the Foresworn. On a critical failure, this flat check increases to DC 10."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Devastating Blast", "type": "action", "traits": ["arcane", "electricity"], "cost": 2, "text": "The graveknight unleashes a 30-foot of energy. Creatures in the area take 20d4 electricity|options:area-damage for a creature of the graveknight's level with a DC 33 Reflex.%rThe graveknight can use this ability once every 1d4 #Recharge Devastating Blast rounds."}, {"name": "Graveknight's Curse", "type": "passive", "traits": ["arcane", "curse"], "text": "This curse affects anyone who wears a graveknight's armor for at least 1 hour%rSaving Throw DC 37 Will save%rOnset 1 hour%rStage 1 Doomed 1 and can't remove armor (1 day)%rStage 2 Doomed 2, –10-foot status penalty to Speeds, and can't remove armor (1 day)%rStage 3 dies and transforms into the armor's graveknight."}, {"name": "Phantom Mount", "type": "action", "traits": ["arcane", "summon"], "cost": 3, "text": "HP 78; AC 30, Fort +22, Ref +16, Will +19%rThe graveknight summons a supernatural mount, as Marvelous Mount heightened to a rank equal to half the graveknight's level. Unlike marvelous mount , the steed's AC and saving throw bonuses are all 4 lower than the graveknight's, and the steed has one-third the graveknight's Hit Points (rounded down).%rIf the steed is destroyed, the graveknight must wait 1 hour before using this ability again."}, {"name": "Weapon Master", "type": "passive", "traits": [], "text": "The graveknight has access to the critical specialization effects of any weapons it wields."}]
