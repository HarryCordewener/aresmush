ns."}, {"name": "First-class Charge", "type": "action", "traits": [], "cost": 2, "text": "The brimstone corps rushes forward with a hunger for battle. They Stride up to twice their Speed. At the end of their movement, each enemy within a 5-foot emanation takes (2d6+5) slashing|options:area-damage damage, with a DC 30 Reflex save."}]
