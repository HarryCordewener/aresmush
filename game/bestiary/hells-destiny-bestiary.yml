"traits": ["aura", "fire", "unholy"], "text": "10 feet, 9d6 fire damage, DC 38 Reflex save"}, {"name": "Conflagration of Jaws", "type": "action", "traits": ["attack", "fire"], "cost": 2, "text": "The hellfire hydra slams each of its heads into the ground, where they explode before quickly reforming. The hellfire hydra creates a number of 5-foot bursts within 10 feet equal to its current number of heads. These bursts can't overlap. Each creature in a burst takes 6d6 fire|options:area-damage damage (DC 40 Reflex save). This counts as a number of attacks equal to the number of heads the hellfire hydra has toward the hydra's multiple attack penalty."}]
