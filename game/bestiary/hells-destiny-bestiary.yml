  actions: [{"name": "Deep Cover Specialist", "type": "passive", "traits": [], "text": "For matters relating to spycraft and undercover operations, Urdun Gravelhands is a 14th-level challenge."}, {"name": "Favored City", "type": "passive", "traits": [], "text": "Urdun can establish a settlement of at least 5,000 people as his favored city by spending 1 week exploring and making contacts there. He can use his Favored City Lore skill to Recall Knowledge about the city; he gains a +4 circumstance bonus to his Deception and Stealth checks while in his favored city; and he applies abilities like city shepherd to his allies while in his favored city. Urdun can have only one favored city at a time (Corentyn, at the beginning of this adventure), replacing his…"}, {"name": "+2 Status to All Saves vs. Poison", "type": "passive", "traits": []}, {"name": "City Shepherd", "type": "passive", "traits": [], "text": "While in his favored city, all allies who can observe Urdun can add their level + 2 as their proficiency bonus when attempting Deception or Stealth checks, as if Following the Expert."}, {"name": "Fighting Drink", "type": "free", "traits": [], "text": "Trigger Urdun rolls Initiative%rEffect He consumes a dose of alcohol and begins his Soused Ruse as a free action. He rolls Deception for Initiative. Creatures that haven't acted yet are Off-Guard to him."}, {"name": "Soused Ruse", "type": "reaction", "traits": [], "text": "Trigger Urdun consumes a dose of alcohol%rEffect He appears to become drunk (the same as succumbing to stage 1 of alcohol's poison) without suffering from the condition, and he gains a +2 circumstance bonus to Deception checks to feint against creatures that assume he's intoxicated. A creature can identify his ruse either by Sensing Motive or by succeeding at a Medicine check against his Deception DC while observing him within 30 feet.%rEffect: Soused Ruse"}, {"name": "Break Bottle", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Frequency once per round%rEffect Urdun shatters a bottle and uses it to brawl. For the next 1 minute when he makes a fist Strike, he can choose for the Strike to lose the unarmed trait, gain the versatile P trait, and deal 1d6 persistent bleed damage on critical hits."}, {"name": "Ruse Drinker", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Urdun Draws and Activates a consumable item he can drink, such as a potion, elixir, or alcoholic drink."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Urdun's Strikes deal an additional 2d6 precision damage against Off-Guard creatures."}, {"name": "Sobering Stride", "type": "action", "traits": ["move"], "cost": 1, "text": "Requirements Urdun's Soused Ruse is active%rEffect Urdun pretends to sober up as he moves more quickly. He Strides twice and ends his Soused Ruse."}, {"name": "Soused Blow", "type": "action", "traits": ["flourish"], "cost": 1, "text": "Requirements Urdun's Soused Ruse is active%rEffect Urdun pretends to stumble while preparing a punch. He Feints then makes a melee Strike."}]
