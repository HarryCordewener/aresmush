  actions: [{"name": "Unyielding Purpose", "type": "reaction", "traits": [], "text": "Trigger Grachius would be reduced to 0 HP%rRequirements Grachius has a divine immolation spell remaining%rEffect Grachius refuses to disappoint Abrogail Thrune; he stabilizes at 1 HP just long enough to cast divine immolation, centered on himself. He dies, immolated in the hellish flames."}, {"name": "Monologue", "type": "free", "traits": ["auditory", "concentrate"], "text": "Frequency once per round%rEffect Grachius ceaselessly expounds upon the ongoing Hellish apocalypse and the futility of his enemies' efforts to stop it. He gains a +1 status bonus to Will saves and a +2 status bonus to damage rolls with his spells. Each time he takes this action again, the bonuses increase by 1 and 2, respectively. The monologue ends (and the bonuses are lost) if Grachius becomes unable to act or speak, or if he ends his turn without having taken this action."}, {"name": "Overwhelming Energy", "type": "action", "traits": ["spellshape"], "cost": 1, "text": "If the next action Grachius uses is to Cast a Spell, the spell ignores 20 resistance to energy damage. This applies to all damage the spell deals, including persistent damage and damage caused by an ongoing effect of the spell. A creature's immunities are unaffected."}]
