  actions: [{"name": "Champion's Aura", "type": "passive", "traits": ["aura", "divine"], "text": "You're surrounded by an aura in a 15-foot emanation. It has the aura and divine traits. Any follower of your deity within the aura immediately knows you're a champion of your deity. This aura is used as the range for your champion's reaction and for various other effects. You can suppress or resume the aura as a single action, which has the concentrate trait, and it ends if you fall Unconscious."}, {"name": "Exalted Iron Command", "type": "reaction", "traits": [], "text": "Trigger An enemy in your champion's aura damages you%rEffect You put an impertinent foe who dared harm you in their proper place. You command each enemy in your champion's aura to kneel before you in obedience. If they dare to refuse, they must pay the price in pain and anguish. The enemy must choose one of the following options.%rKneel The enemy drops Prone as a free action.%rRefuse You deal (5d6) mental,(5) persistent mental damage to the enemy.%rRegardless of which option the enemy chose,…"}, {"name": "Shield Block", "type": "reaction", "traits": []}, {"name": "Defensive Advance", "type": "action", "traits": ["flourish"], "cost": 2, "text": "With the protection of your shield, you dive into battle! You Raise your Shield and Stride. If you end your movement within melee reach of at least one enemy, you can make a melee Strike against that enemy.%rYou can use Defensive Advance while Burrowing, Climbing, Flying, or Swimming instead of Striding if you have the corresponding movement type."}, {"name": "Gruesome Strike", "type": "action", "traits": [], "cost": 1, "text": "Requirements Your Strikes currently deal extra damage from your champion's reaction.%rMake a Strike against the creature that triggered your champion's reaction. If you hit, double the extra damage the target takes from your reaction, and the target must succeed at a DC 40 Fortitude save or be Drained 1. Regardless of the result, the creature is temporarily immune to your Gruesome Strike for 24 hours."}]
