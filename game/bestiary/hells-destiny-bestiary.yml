  actions: [{"name": "Spiritsense", "type": "passive", "traits": ["detection", "occult"], "text": "The spirit binder can sense the spirits of creatures, including living creatures, most non-mindless undead, and haunts within the listed range. Since spiritsense detects spiritual essence, not physical bodies, it can detect spirits projected by spells (such as Project Image) or possessing otherwise soulless objects. It can't detect soulless bodies, constructs, or objects, and like most senses, it doesn't penetrate through solid objects."}, {"name": "Haunting Spirits", "type": "passive", "traits": ["aura", "occult", "spirit"], "text": "30 feet. The spirits bound by a spirit binder swirl around, lashing out at their foes. An enemy that enters or starts its turn in the aura must succeed at a DC 27 Will save or take 3d6 spirit|options:area-damage damage and be Frightened 1 (double damage and Frightened 2 on a critical failure)."}, {"name": "Spirit Scrying", "type": "passive", "traits": [], "text": "The spirit binder's scrying spells can target or detect spirits on other planes as though the spirits were in the Universe."}, {"name": "Succumb to the Void", "type": "action", "traits": ["concentrate", "occult", "void"], "cost": 1, "text": "The spirit binder taps into the more nefarious spirits of the Void, becoming something morbid and cruel. For 1d4 rounds, their resistance, aura of spirits, Strikes, and spirit spells change their damage type from spirit damage to void damage and replace their spirit trait with the void trait."}]
