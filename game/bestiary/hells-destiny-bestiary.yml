  actions: [{"name": "Regeneration 10 (Deactivated by Piercing)", "type": "passive", "traits": []}, {"name": "Destabilizing Field", "type": "passive", "traits": ["aura"], "text": "40 feet.%rA creature that begins its turn within the area feels its body begin to stretch and must succeed at a DC 33 Fortitude save or become destabilized. A destabilized creature emits a 10-foot destabilizing field aura and becomes Sickened 1. The destabilization ends when the creature is no longer sickened. A creature that succeeds at its saving throw against the aura is temporarily immune to all destabilizing fields for 1 minute."}, {"name": "Displace", "type": "reaction", "traits": [], "text": "Trigger The amalgamite is hit by a Strike%rEffect The amalgamite Repositions itself or Transposes itself with another creature. If the amalgamite successfully Transposes its location, it and any transposed creature take half damage from the triggering Strike."}, {"name": "Reposition", "type": "action", "traits": ["concentrate", "occult", "teleportation"], "cost": 2, "text": "The amalgamite teleports into an unoccupied space it can see within 50 feet."}, {"name": "Transpose", "type": "action", "traits": ["occult", "teleportation"], "cost": 2, "text": "The amalgamite chooses up to two destabilized creatures it can see within 50 feet and swaps their positions, or moves one such creature to an unoccupied space it can see within range. If the amalgamite chooses two creatures, it can choose itself as a target, but both targets must be the same size. An unwilling creature can attempt a DC 33 Will save. If either target succeeds at this saving throw, both are unaffected."}]
