  actions: [{"name": "Eternal Luminosity", "type": "passive", "traits": ["light"], "text": "An anguished hellfire naturally sheds brilliant light like a torch. When other creatures target the anguished hellfire, they ignore the Concealed condition from darkness, fog, mist, and smoke."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Solar Flare", "type": "passive", "traits": ["aura", "divine", "visual"], "text": "30 feet. When a creature ends its turn in the aura, it takes 4d6 fire damage (DC 38 Fortitude save). On a failed save, it also becomes Dazzled until the end of its next turn. The anguished hellfire can deactivate or activate this aura by using a single action that has the concentrate trait."}, {"name": "Vulnerable to Blasphemy", "type": "passive", "traits": [], "text": "If a creature the anguished flame can see and hear spends 1 action with the linguistic trait blaspheming Asmodeus, the anguished flame becomes Sickened 1 until they Collect a Prayer from that creature."}, {"name": "Collect Unholy Prayer", "type": "action", "traits": ["emotion", "mental"], "cost": 2, "text": "The anguished flame compels the prayers of a creature they can see within 60 feet, and that creature must attempt a DC 41 Will save. A creature with the holy trait gets a degree of success one better than their result.%rCritical Success The creature is unaffected.%rSuccess The creature uses its reaction to pray.%rFailure The creature prays. It is Slowed 1 and can't use reactions for 1 minute.%rCritical Failure As failure, but the creature is Slowed 2."}, {"name": "Focus Gaze", "type": "action", "traits": ["concentrate", "divine", "visual"], "cost": 1, "text": "Requirements The anguished hellfire's solar flare aura is active%rEffect The anguished hellfire fixes their fiery eyes on a creature they can see within 30 feet. The target must immediately attempt a Fortitude save against the anguished hellfire's solar flare. If the creature was already Dazzled by solar flare before attempting its save, a failed save causes it to become Blinded until the end of its next turn."}, {"name": "Scourging Flame", "type": "action", "traits": [], "cost": 2, "text": "The hellfire can burn away beneficial magic. It attempts a flaming wing Strike. On a success, the anguished hellfire attempts to counteract one spell effect of its choice active on the target. The counteract modifier is +36, and the counteract rank is 9th."}]
