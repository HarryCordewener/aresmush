  actions: [{"name": "Supple Wrist", "type": "passive", "traits": [], "text": "Vorrea Talminari gains an additional reaction each round that can only be used for A Foolish Move."}, {"name": "+1 Status to All Saves vs. Fear", "type": "passive", "traits": []}, {"name": "A Foolish Move", "type": "reaction", "traits": [], "text": "Frequency once per round%rTrigger A creature critically misses Vorrea Talminari with a melee Strike or melee spell attack%rEffect Vorrea makes an Arcane Strike against the triggering creature using Gouging Claw but becomes Slowed 1 for her next turn."}, {"name": "Focus from Fear", "type": "passive", "traits": [], "text": "Though fear weakens Vorrea's other abilities, it hones her offensive abilities. She applies only half her frightened condition value as a penalty to attack rolls (rounded down) and applies a status bonus to damage dealt by her Strikes equal to her frightened value."}, {"name": "Phoenix's Sacrifice", "type": "free", "traits": ["vitality"], "text": "Frequency once per day%rTrigger Your Dying condition increases%rEffect The phoenix bursts into flames. You lose the dying condition and regain 1 Hit Point. Your Wounded value does not increase. You can use this action while Unconscious."}, {"name": "Quick Spike", "type": "reaction", "traits": ["manipulate", "metal"], "text": "Frequency once per hour%rTrigger A creature within 15 feet uses a manipulate action%rEffect An iron spike launches from your armor at the target, dealing 7d8 piercing damage to the target (DC 36 Reflex save). If the target critically fails, the triggering action is disrupted."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Arcane Strike", "type": "action", "traits": [], "cost": 2, "text": "Vorrea Talminari Casts a Spell that deals damage. She then makes a melee Strike that counts as two attacks for the purposes of her multiple attack penalty but doesn't apply this penalty until after her Arcane Strike is concluded. If the spell requires an attack roll, use the Strike's results to determine the effects of both the Strike and the spell. If the spell requires a save, the target of the Strike rolls its saving throw normally, though if the Strike was a critical failure, the target is…"}, {"name": "Commanding Draw", "type": "action", "traits": ["fortune"], "cost": 1, "text": "Frequency once per hour%rRequirements You have a weapon sheathed in your Commandant's Scabbard%rEffect You Interact to draw your weapon from your scabbard and Strike with it. On that Strike, you can roll twice and take the better result.%rEffect: Commanding Draw"}, {"name": "Fancy Bladework", "type": "action", "traits": ["visual"], "cost": 1, "text": "Vorrea attempts an Intimidation check to demoralize each enemy within 30 feet, without suffering penalties for not sharing a language. Regardless of the result, each creature is temporarily immune to Fancy Bladework for 1 minute."}, {"name": "Paracountess's Parry", "type": "action", "traits": [], "cost": 1, "text": "Requirements Vorrea Talminari just used Arcane Strike%rEffect Vorrea raises the wide hilt of her cutlass in a defensive posture, surrounded by arcane energies to defend herself. She gains a +2 circumstance bonus to her AC and resistance 5 to physical damage (except silver) until the start of her next turn.%rEffect: Paracountess's Parry"}, {"name": "Release Heat", "type": "action", "traits": ["concentrate", "fire"], "cost": 1, "text": "Frequency once per day%rRequirements You have a free hand%rEffect You take the heat that's built up in your gloves and discharge it onto an enemy. You deal 10d8 fire damage to one creature within reach (DC 31 Reflex save)."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Vorrea's spellcasting action, she attempts a DC 15 Flat. On a success, her action isn't disrupted."}, {"name": "Wind and Waves", "type": "action", "traits": ["teleportation"], "cost": 1, "text": "Vorrea channels the elemental connection she has with the winds. She teleports to any square within 20 feet that's within reach of a creature, then makes a melee Strike. She can't use Wind and Waves again for 1d4 rounds."}]
