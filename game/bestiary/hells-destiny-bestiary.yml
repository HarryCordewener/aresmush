mstance bonus to Survival checks when you Track your prey. You also ignore the penalty for making ranged attacks within your second range increment against the prey you're hunting.%rYou can have only one creature…"}, {"name": "Ochiastis Venom", "type": "passive", "traits": ["poison", "virulent"], "text": "Saving Throw DC 36 Fortitude%rMaximum Duration 6 rounds%rStage 1 Enfeebled 1 and Off-Guard (1 round)%rStage 2 Enfeebled 2 and off-guard (1 round)%rStage 3 enfeebled 2, off-guard, and Slowed 1 (1 round)%rStage 4 Enfeebled 3 and Paralyzed (1 round)"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The creature's Strikes deal an additional 3d6 precision damage to Off-Guard creatures."}]
