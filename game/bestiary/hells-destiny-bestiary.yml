  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "At-Will Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Idol Armor", "type": "passive", "traits": [], "text": "The advodaza's defiled idols grant them resistance 15 to two damage types of their choice except fire, physical, poison, and spirit (typically mental and void). The advodaza can spend 10 minutes to change which damage types are resisted. Any holy effect that affects the fiend can also counteract their idol armor (DC 40), which the advodaza can reactivate with a Sustain action."}, {"name": "False Divinity", "type": "passive", "traits": [], "text": "The advodaza chooses two domains, typically chosen from the following list: ambition, darkness, fire, might, trickery, tyranny, wealth, or zeal. The advodaza gains both domains' initial domain spells as well as the advanced domain spell from one of the domains, all heightened to 9th rank.%rNote: For the purposes of Foundry Data Entry, fire and might were the domains chosen. Change the focus spells the Advodaza knows for the domains of your choice."}, {"name": "Infernal Mark", "type": "action", "traits": ["manipulate"], "cost": 3, "text": "The advodaza touches a willing creature and marks it with a glyph that functions as a 9th-rank Sigil, which the devil can make visible or invisible. The target gains 1 Focus Point if it didn't already have any, and the advodaza grants it one of their initial domain spells as a focus spell. The marked creature and the advodaza can communicate telepathically with each other while on the same plane. The advodaza can maintain up to 10 Infernal Marks at a time; if they create another after reaching…"}, {"name": "Punish Disciple", "type": "action", "traits": ["spirit"], "cost": 1, "text": "Frequency once per round%rEffect The advodaza chooses up to three creatures bearing their Infernal Mark that are on the same plane as the advodaza, dealing 8d6 spirit damage to each creature (DC 40 Fortitude save)."}]
