  actions: [{"name": "Camouflage", "type": "passive", "traits": [], "text": "Athervox can hide in natural environments even if she doesn't have cover."}, {"name": "+1 Status to All Saves vs. Primal", "type": "passive", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 39 Will"}, {"name": "Miasma", "type": "passive", "traits": ["aura", "poison"], "text": "20 feet. After Athervox uses her Poison Breath, a cloud of poison gas continues to emanate from her body for 1 round. Any creature that ends their turn in the miasma takes 4d6 poison|options:area-damage damage (DC 39 Fortitude save). Any creature in the miasma is Concealed and treats other creatures as concealed. Athervox can see through this concealment.%rEffect: Miasma"}, {"name": "Thrusting Tail", "type": "reaction", "traits": [], "text": "Trigger A creature within reach of Athervox's tail Casts a Spell%rEffect Athervox makes a tail Strike at the creature with a –2 penalty. If the Strike hits, Athervox disrupts the creature's action."}, {"name": "Warding Focus", "type": "passive", "traits": [], "text": "Spells that Athervox Casts that target herself have their durations doubled."}, {"name": "Forest Passage", "type": "passive", "traits": [], "text": "Athervox ignores all difficult terrain caused by plants, such as bushes, vines, and undergrowth. Even plants manipulated by magic doesn't impede her progress."}, {"name": "Impaling Charge", "type": "action", "traits": [], "cost": 2, "text": "Requirements Athervox doesn't have a creature impaled on her horn%rEffect Athervox attempts to gore a foe. She Strides, then attempts a horn Strike. On a hit, the target becomes impaled on Athervox's horn. The creature is Grabbed while on the horn (and can Escape as normal). Athervox doesn't need to use additional actions to keep the impaled creature grabbed. If Athervox moves, she brings the grabbed creature along with her."}, {"name": "Poison Br