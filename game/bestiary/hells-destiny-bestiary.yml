  actions: [{"name": "+1 Circumstance Bonus vs Emotion Effects", "type": "passive", "traits": []}, {"name": "Hunters of Monsters", "type": "passive", "traits": [], "text": "Hellknight hunters can use Monster Lore to Recall Knowledge about creatures of any type. Whenever one of the squad's damaging abilities would affect only a single creature that lacks the swarm or troop trait, they gain a +2 status bonus to that ability's Reflex save DC."}, {"name": "Pin It Down", "type": "reaction", "traits": [], "text": "Trigger An adjacent enemy uses a manipulate or move action, or leaves an adjacent space during a move action it's using%rEffect The hunters stab with their longspears. The triggering enemy takes (4d8+9) piercing damage (DC 33 Reflex save). If the enemy critically fails this saving throw, the triggering action is disrupted."}, {"name": "Troop Defenses", "type": "passive", "traits": []}, {"name": "Troop Movement", "type": "passive", "traits": []}, {"name": "Disciplined Barricade", "type": "action", "traits": [], "cost": 1, "text": "The Hellknights defensively lock their shields. Until the start of this troop's next turn, the troop and all allies within a 5-foot emanation gain a +1 circumstance bonus to their AC and Reflex saving throws."}, {"name": "Hurl Javelins", "type": "action", "traits": [], "cost": 2, "text": "The squad's members throw a volley of javelins. Each creature in a 10-foot burst within 30 feet of the troop takes (5d6+9) piercing|options:area-damage damage with a DC 33 Reflex save. When the Hellknight hunters are reduced to 2 segments, this area decreases to a 5-foot burst."}, {"name": "Medic!", "type": "action", "traits": ["healing"], "cost": 1, "text": "The hunters bandage an adjacent creature. The target regains (5d8+20) healing Hit Points, after which the target is immune to this ability for 1 day."}, {"name": "Phalanx Strike", "type": "action", "traits": ["magical"], "cost": 1, "text": "Frequency once per round%rEffect The Hellknight hunters strike outward with their longspears in a uniform melee attack against each enemy in a 10-foot emanation (DC 33 Reflex save). The damage depends on the number of actions.%r1 (1d8+5) piercing|options:area-damage damage%r2 (4d8+9) piercing|options:area-damage damage%r3 (5d8+13) piercing|options:area-damage damage"}]
