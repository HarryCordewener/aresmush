te"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Lythazossa can use Soul-Melting Breath again."}, {"name": "Reroll", "type": "free", "traits": ["fortune"], "text": "Cost 1 Mythic Point%rTrigger Lythazossa fails a check%rEffect Lythazossa rerolls the check."}, {"name": "Soul-Melting Breath", "type": "action", "traits": ["acid", "divine"], "cost": 2, "text": "Lythazossa expels a 60-foot cone of ghostly acid that melts a creature's very soul, dealing 20d6 spirit|options:area-damage damage to creatures in the area (DC 42 Will save). The ghostly acid also saps the life from affected creatures. At the beginning of Lythazossa's next turn, each creature that failed the Reflex save must succeed at a DC 42 Fortitude save or become Drained 1 (Drained 2 on a critical failure). Lythazossa can't use Soul-Melting Breath again for 1d4 rounds."}, {"name": "Telekinetic Assault", "type": "action", "traits": ["divine"], "cost": 2, "text": "Lythazossa cries out in pain and anguish, hurling small objects and debris is a 30-foot emanation. Creatures in the area take 10d6 bludgeoning|options:area-damage damage (DC 42 Reflex save)."}, {"name": "Vestige of an Ancient Curse", "type": "passive", "traits": ["curse", "primal"], "text": "When Lythazossa hits a creature with her jaws Strike, the target must succeed at a DC 42 Will save or become Enfeebled 2 until Lythazossa's spirit is put to rest. If the target critically fails this saving throw, Lythazossa regains 40 healing HP, and the target is instead Enfeebled 3."}]
