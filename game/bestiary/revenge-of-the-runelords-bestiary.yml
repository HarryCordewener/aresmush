  actions: [{"name": "Apocalyptic Knowledge", "type": "passive", "traits": [], "text": "A watcher can attempt a Jandelay Lore check to Recall Knowledge about any world that has been destroyed or is on the precipice of destruction."}, {"name": "Speechless", "type": "passive", "traits": [], "text": "A watcher can't speak aloud and must use writing, telepathy, or other methods to communicate."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "All-Around Vision", "type": "passive", "traits": []}, {"name": "Regeneration 20 (Deactivated by Void)", "type": "passive", "traits": []}, {"name": "Inconspicuous Mien", "type": "passive", "traits": ["mental"], "text": "Despite their size, a watcher's role as an uninvolved observer of the Great Beyond causes most creatures to overlook and ignore them. A watcher is always undetected, and a creature must deliberately Seek to perceive them unless it succeeds at a DC 45 Will saving throw to perceive the watcher (usually as a free action at the start of an encounter). The watcher is automatically perceived by a creature they interact with, such as by attacking the creature or targeting it with a spell or effect."}, {"name": "Stabilization Vulnerability", "type": "passive", "traits": [], "text": "Whenever a watcher's teleportation effect is counteracted as it's being activated, they become Stunned 1."}, {"name": "Beacon of Jandelay", "type": "passive", "traits": ["exploration", "occult"], "text": "The watcher spends 10 minutes erecting a glowing spire of pale yellow energy, marking an important site destined for an apocalypse for collection and preservation in the Apocalypse Archive. Whenever a watcher uses a teleportation effect to reach a Beacon of Jandelay, they don't need a locus and always arrive on target. A watcher can create a Beacon of Jandelay even while Out of Phase. If the watcher creates a new beacon, any previous Beacon of Jandelay they created vanishes."}, {"name": "Mythic Ritualist", "type": "passive", "traits": ["fortune"], "text": "Although a watcher isn't a mythic creature, when they cast Freedom or Imprisonment, they attempt Occultism checks at mythic proficiency, and roll those checks twice and take the better of the two results."}, {"name": "Out of Phase", "type": "action", "traits": ["occult", "teleportation"], "cost": 3, "text": "Frequency once per day%rEffect The watcher shifts themself out to desynchronize with reality, allowing them to observe a world without becoming caught in the world's events (including any apocalypses). While Out of Phase, the watcher is invulnerable to all damage and can't be targeted or affected by anything for 1 round, but they can't cast spells, activate items, or use actions that have the attack or manipulate trait. A watcher can Sustain this activity as long as they wish and automatically…"}, {"name": "Torn from Time", "type": "free", "traits": ["incapacitation", "occult"], "text": "Frequency once per round%rTrigger The watcher's last action was to damage a creature with their talon Strike%rEffect The creature's body grows numb, and it loses control of its muscles, entering a form of temporal hibernation. The creature must attempt a DC 45 Will save.%rCritical Success The creature is unaffected.%rSuccess The creature is Slowed 1 for 1 round.%rFailure The creature is slowed 1 with an unlimited duration and must attempt a DC 45 Will save at the end of each of its turns. On a…"}]
