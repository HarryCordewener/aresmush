  actions: [{"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The lamia matriarch can take on the appearance of a Medium humanoid. This doesn't change their Speed or their attack and damage modifiers with their Strikes, but it does prevent them from using their cursed touch. Each lamia matriarch has a fixed humanoid form that resembles their upper torso when in their true form. This is the only humanoid form they can adopt using this ability."}, {"name": "Falchion Swipe", "type": "action", "traits": [], "cost": 3, "text": "Vesinra makes a falchion attack against each enemy within reach. Each attack counts toward her multiple attack penalty, but the penalty does not increase until after all the attacks. The first enemy she damages is subject to Vesinra's Caress."}, {"name": "Vesinra's Caress", "type": "action", "traits": ["curse", "mental", "occult"], "cost": 2, "text": "Vesinra touches a creature, who must succeed at a DC 30 Will save or become Enfeebled 2. If the target fails additional saves against this ability, the condition value increases by 2 (to a maximum of enfeebled 4). This condition value decreases by 1 every 24 hours."}]
