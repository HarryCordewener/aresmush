  actions: [{"name": "Sin Scent", "type": "passive", "traits": [], "text": "A knight of malice can smell envious creatures as the scent ability, but as a precise sense. The GM determines which creatures are appropriately envious."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "+4 Status to All Saves vs. Mental", "type": "passive", "traits": []}, {"name": "Jealous Enmity", "type": "reaction", "traits": [], "text": "Trigger Another knight of malice successfully Strikes a creature within 15 feet%rRequirements The knight of malice Seethed during their last turn%rEffect The knight of malice Strides up to 15 feet and makes a melee Strike against the same creature. The knight of malice who rolled a higher result on their attack becomes Quickened for 1 round and can use the extra action only to Seethe or Stride."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Spiteful Eye", "type": "passive", "traits": ["aura", "emotion", "visual"], "text": "30 feet. Knights of malice hate to see others succeed and sabotage the efforts of other knights whenever they can. The knight of malice takes a –2 circumstance penalty to Reflex saving throws and their Strikes deal an extra 1d6 mental damage if there's at least one other knight of malice in the aura."}, {"name": "Seethe", "type": "action", "traits": ["emotion", "mental"], "cost": 1, "text": "Requirements Another knight of malice is within the area of the knight's spiteful eye aura%rEffect The knight of malice ruminates on their unjust treatment and plots a new method of overthrowing and outshining another knight. The knight of malice gains a second reaction until the start of their next turn, though they still can't use more than one reaction on the same triggering action."}, {"name": "Sinful Bite", "type": "passive", "traits": ["arcane", "emotion", "mental"], "text": "A creature hit by the jaws Strike of a knight of malice must attempt a DC 37 Will save as it's assaulted by envious thoughts.%rCritical Success The creature is unaffected.%rSuccess The creature is Stupefied 1 for 1 round.%rFailure The creature is Stupefied 2 and Confused for 1 minute. For as long as it remains stupefied, the flat check to end the confused condition when the creature is damaged is DC 14.%rCritical Failure As failure, but Stupefied 3."}]
