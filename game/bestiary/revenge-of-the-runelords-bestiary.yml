  strikes: [{"name": "Dagger", "bonus": 28, "damage": [["2d4+11", "piercing", null], ["1d6", "cold", null], ["1d6", "spirit", null]], "traits": ["agile", "finesse", "magical", "versatile-s"]}, {"name": "Dagger", "bonus": 28, "damage": [["2d4+11", "piercing", null], ["1d6", "cold", null], ["1d6", "spirit", null]], "traits": ["agile", "magical", "thrown-10", "versatile-s"]}]
  actions: [{"name": "Adaptive Rune Magic", "type": "free", "traits": ["arcane", "concentrate", "manipulate"], "text": "Frequency once per round%rTrigger Aethusa Casts a Spell of 6th rank or higher%rEffect Aethusa momentarily infuses her preferred form of sin magic (sloth) with the power of either gluttony or greed magic. The triggering spell slot is expended, but instead of the spell's normal effects, Aethusa casts either Cursed Metamorphosis or Vampiric Exsanguination at 6th rank."}, {"name": "Past Lives", "type": "action", "traits": ["concentrate", "fortune"], "cost": 1, "text": "Frequency once per day%rEffect Aethusa accesses what she believes to be the memories of two previous runelords. For the next 1 minute, whenever Aethusa makes a skill check to Recall Knowledge, she rolls three times and uses the highest result."}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "Frequency once per day%rEffect If Aethusa's next action is to cast a cantrip or a spell that is 6th rank or lower, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt Aethusa's spellcasting action, she attempts a DC 15 Flat. On a success, the action isn't disrupted."}]
  spellcasting: [{"name": "Arcane Prepared Spells", "tradition": "arcane", "type": "prepared", "dc": 36, "attack": 28, "spells": {"0": ["Caustic Blast", "Daze", "Light", "Message", "Prestidigitation"], "1": ["Create Water", "Gentle Landing", "Summon Animal", "Summon Construct"], "2": ["Create Food", "Marvelous Mount", "Mist", "Summon Elemental"], "3": ["Cozy Cabin", "Slow"], "4": ["Fly", "Translocate", "Vision of Death"], "5": ["Slither", "Summon Dragon", "Wave of Despair"], "6": ["Collective Transposition", "Teleport"], "7": ["Interplanar Teleport"]}}, {"name": "Adaptive Rune Magic", "tradition": "arcane", "type": "prepared", "dc": 36, "attack": 28, "spells": {"6": ["Cursed Metamorphosis", "Vampiric Exsanguination"]}}]
"Ancient One":
  pack: "revenge-of-the-runelords-bestiary"
  level: 20
  size: "large"
  rarity: "rare"
  traits: ["aberration", "mythic", "time"]
  ac: 45
  hp: 440
  perception: 36
  saves: {"fortitude": 34, "reflex": 33, "will": 35}
  abilities: {"cha": 8, "con": 6, "dex": 7, "int": 6, "str": 10, "wis": 7}
  speeds: {"land": 60, "fly": 60}
  hp_details: "void healing"
  skills: {"Acrobatics": 35, "Arcana": 34, "Athletics": 38, "Intimidation": 36, "Occultism": 38, "Stealth": 37, "Dimension of Time Lore": 38}
  immunities: ["auditory", "cold", "disease", "emotion", "inhaled", "paralyzed", "poison", "aging"]
  resistances: {"mythic": 20}
  strikes: [{"name": "Wretched Claw", "bonus": 38, "damage": [["4d8+16", "slashing", null], ["2d6", "void", null]], "traits": ["agile", "magical", "reach-10", "unarmed"]}, {"name": "Annihilation Ray", "bonus": 35, "damage": [["6d8", "void", "persistent"]], "traits": ["occult"], "range": 30}]
  actions: [{"name": "Entropy Sense", "type": "passive", "traits": ["occult", "prediction"], "text": "The ancient one can predict the presence of a creature through supernatural insight into chaotic probabilities and chance and builds a perception of reality from this information, allowing them to \"see\" as a precise sense in the listed range. Invisible creatures are visible to them, but veil of privacy prevents a creature from being detected via entropy sense automatically (without a counteract check)."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The ancient one ends one condition affecting them."}, {"name": "Mythic Resilience (Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "No Breath", "type": "passive", "traits": [], "text": "An ancient one doesn't breathe and is immune to effects that require breathing (such as inhaled poisons)."}, {"name": "Otherworldly Mind", "type": "passive", "traits": ["mental", "occult"], "text": "Whenever a creature targets the ancient one with a mental effect, that creature takes 6d8 mental damage (DC 39 Will save). On a critical failure, the creature also becomes Confused for 1d4 rounds."}, {"name": "The Connection Cuts Both Ways", "type": "passive", "traits": [], "text": "Creatures the ancient one affected with a mental effect or communicated with telepathically within the last round can hijack the ancient one's telepathic connection; they automatically ignore the ancient one's immunity to auditory, emotion, and visual effects until the end of their current turn. They can additionally spend 1 Mythic Point as a free action to reach through the connection to manipulate the ancient one's mind, ignoring the ancient one's mythic resilience on Will saving throws."}, {"name": "Undying Myth", "type": "free", "traits": [], "text": "Cost all of the Ancient One's Mythic Points%rTrigger The ancient one would die and has at least 1 Mythic Point%rEffect The ancient one remains conscious, and recovers 50% of their maximum Hit Points."}, {"name": "Unified Timeline", "type": "reaction", "traits": ["occult", "teleportation"], "text": "Trigger A creature ends its movement within 10 feet of the ancient one%rEffect Ancient ones exist spread out across infinite times and places simultaneously and can shift themselves through their catalog of potentialities. The ancient one teleports themself and the triggering creature into empty squares within 10 feet of their respective positions, though the triggering creature can't be moved into hazardous terrain or to a place it can't stand. An unwilling creature can resist the…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Dismantle All Life", "type": "passive", "traits": ["occult", "time", "vitality", "void"], "text": "Time and entropy end all things, even the undead. When the ancient one's Strikes hit a creature with void healing, they deal vitality damage instead of void damage. The ancient one can't use their Strikes to restore Hit Points to living or undead creatures."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The ancient one regains an expended spell."}, {"name": "Reroll", "type": "free", "traits": ["fortune"], "text": "Cost 1 Mythic Point%rTrigger The ancient one fails a check%rEffect The ancient one rerolls the check."}, {"name": "Slither Between Worlds", "type": "action", "traits": ["concentrate", "manipulate", "occult", "teleportation"], "cost": 1, "text": "The ancient one instantly transports themself and any items they're wearing and holding from their current space to an unoccupied space within 100 feet they can see. Once per turn, the ancient one can spend 1 Mythic Point to slither between worlds as a free action on their turn."}, {"name": "Vision of Lost Meaning", "type": "action", "traits": ["concentrate", "emotion", "mental", "occult"], "cost": 1, "text": "The ancient one speaks without sound, contacting a creature within 120 feet telepathically to send out waves of visions that fill its mind with fragmented thoughts, unrealized chaos, and futures where its choices are never consequential. The target attempts a DC 42 Will save.%rCritical Success The target is unaffected.%rSuccess The target is disoriented by the visions and is Dazzled for 1 round.%rFailure The target is overwhelmed by the visions and is Confused for 1 minute.%rCritical Failure As…"}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 42, "attack": 34, "spells": {"7": ["Interplanar Teleport (At Will, Self Only)"], "8": ["Confusion", "Harm"], "9": ["Detonate Magic", "Disintegrate"]}}]
