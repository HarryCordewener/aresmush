  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The natbakh ends one condition affecting them."}, {"name": "Mythic Resilience (Reflex)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Drain Dreams", "type": "action", "traits": ["mental", "occult"], "cost": 1, "text": "Frequency once per round%rRequirements The natbakh's previous action was a successful jaws Strike that damaged a creature%rEffect The natbakh's suckered tongue latches on. The creature must succeed at a DC 34 Will save or become Stupefied 1 (Stupefied 2 on a critical failure) for 1 week as their dreams are slurped away. If the creature becomes stupefied in this way, the natbakh regains 32 healing HP. Draining dreams from a creature that's already stupefied doesn't restore any HP, but increases…"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The natbakh attempts its next Athletics or Stealth skill check with a +4 bonus and is considered to have mythic proficiency for that check."}, {"name": "Nightmare Screech", "type": "action", "traits": ["emotion", "mental", "occult"], "cost": 2, "text": "The natbakh shrieks in a 50-foot cone that echoes more in the minds of those in the area than in the ears. Those in the area recall shrieks like this in forgotten nightmares, and the memories of wounds suffered in dream