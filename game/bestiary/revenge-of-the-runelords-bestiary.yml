  actions: [{"name": "Interdimensional Web Sense", "type": "passive", "traits": [], "text": "The maze-weaver senses when a creature touches its webs, even if it is on another plane of existence. While touching its webs, the maze-weaver has precise tremorsense to detect the vibrations of creatures touching its webs."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Create Web Weaponry", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "The Leng spider creates a weapon by applying a cord of webbing to heavy objects, such as rocks or chunks of metal, either attaching two heavy objects together to create a web bola or fastening one to its leg to create a web war flail."}, {"name": "Descend on a Web", "type": "action", "traits": ["move"], "cost": 1, "text": "The Leng spider moves straight down up to 120 feet, suspended by a web line. It can hang from the web or drop off. The distance it Descends on a Web doesn't count when calculating falling damage.%rThe web can be severed by a Strike that deals slashing damage (AC 30, Hardness 15, 25 HP), causing the Leng spider to fall."}, {"name": "Lay Web Trap", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Frequency three times per day%rEffect The Leng spider spins a web within 20 feet of itself to create a Grasping Snare, Stunning Snare, or Warning Snare. The Leng spider's web provides all the raw materials it needs. All save and Escape DCs associated with web traps use the Leng spider's Crafting DC for traps (DC 36). A web trap decays after 24 hours."}, {"name": "Leng Spider Venom", "type": "passive", "traits": ["emotion", "mental", "poison"], "text": "Saving Throw DC 33 Fortitude%rMaximum Duration 6 rounds%rStage 1 2d6 poison damage and Drained 1 (1 round)%rStage 2 2d6 poison damage, Confused, and Drained 2 (1 round); the confused eff