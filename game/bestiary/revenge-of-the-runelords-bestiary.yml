  actions: [{"name": "Smoke Vision", "type": "passive", "traits": [], "text": "Smoke doesn't impair a tolokand's vision; it ignores the Concealed condition from smoke."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+2 Status to All Saves vs. Primal Magic", "type": "passive", "traits": []}, {"name": "Heartless Furnace", "type": "passive", "traits": ["aura", "occult"], "text": "50 feet. 2d6 poison|options:area-damage damage (DC 37 Fortitude save).%rThe poisonous smoke that bellows from a tolokand makes all creatures inside it Concealed, and all creatures outside the smoke are concealed to creatures within it."}, {"name": "Inexorable", "type": "passive", "traits": [], "text": "The tolokand recovers from the Paralyzed, Slowed, and Stunned conditions at the end of its turn. It's also immune to penalties to its Speeds and ignores difficult terrain and greater difficult terrain."}, {"name": "Mythic Resilience (Fortitude)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Toxic Blood", "type": "passive", "traits": [], "text": "When a creature scores a critical hit against the tolokand with a piercing or slashing Strike, the tolokand's poisonous, oily blood sprays forth. Any creature within 5 feet of the tolokand takes 3d6 poison|options:area-damage damage (DC 38 Reflex save). Any non-creature plants the blood spills on die."}, {"name": "Blighted Footfalls", "type": "passive", "traits": [], "text": "Whenever the tolokand ends a move action during which it moved 30 feet or farther, it automatically casts one of its innate spells as a free action."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Jandelay tolokand regains an expended spell."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Jandelay tolokand ends one condition affecting themself."}, {"name": "Sudden Destruction", "type": "action", "traits": [], "cost": 1, "text": "Requirements The tolokand hasn't cast any of its spontaneous spells this turn%rEffect The tolokand casts one of its spontaneous spells, using up the spell slot normally. The tolokand can't cast any further spontaneous spells this turn and can't use this ability again for 1d4 rounds."}]
