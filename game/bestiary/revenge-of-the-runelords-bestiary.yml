ces a mythic creature to 0 HP, or the PCs take more than 24 hours to confront her after securing entrance to the Eye of Desire%rEffect The warshard Belimarius has fused with the Runewell of Lust flares with a sudden flash of blood-red light. Belimarius gains the mythic trait, 3 Mythic Points, and her Mythic Powers. In time, she might develop additional mythic powers, but only if she survives her encounter with the PCs."}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "Frequency once per day%rEffect If Runelord Belimarius's next action is to cast a cantrip or spell of 8th rank or lower, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Belimarius regains an expended spell."}, {"name": "Sacrifice Warshard", "type": "free", "traits": ["divine", "emotion", "incapacitation", "manipulate", "mental"], "text": "Trigger Belimarius begins her turn%rRequirements Belimarius has the warshard of Gorum held in a hand%rEffect While its mythic potential and divine power has largely been used to transform the Eye of Desire and the Runewell of Lust into the forms described in Chapter 1 to enable her imminent mythic ascension, enough power remains within to generate one final effect. With a quick motion, Belimarius crushes the mostly depleted warshard she holds in her hand, destroying it and causing red rain to…"}]
