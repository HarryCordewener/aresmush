  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The creature ends one condition affecting it."}, {"name": "Altered Weather", "type": "passive", "traits": ["aura", "primal"], "text": "A kraken reshapes the weather within 2 miles of it, with the effect of the Control Weather ritual centered on the kraken and based on its emotional state, at the GM's discretion. If the kraken dies, the weather returns to normal immediately.%rBaolen is currently content in his place as an object of worship, though, so the surrounding weather remains calm."}, {"name": "Mythic Resilience (Fortitude and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Susceptible to Confusion", "type": "passive", "traits": [], "text": "Baolen's mythic resilience doesn't apply to Will saving throws he makes against the Confused condition. If Baolen starts his turn confused, he takes 6d10 mental damage."}, {"name": "Undying Myth", "type": "free", "traits": [], "text": "Cost all of Baolen's Mythic Points%rTrigger Baolen would die and has at least 1 Mythic Point%rEffect Baolen remains standing and conscious, and recovers 50% of his maximum Hit Points."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(2d10+17) bludgeoning, DC 40 Fortitude. On a failed save, a creature that is holding its breath loses 1d4 rounds worth of air."}, {"name": "Curse of Flawed History", "type": "passive", "traits": ["curse", "primal"], "text": "Saving Throw DC 37 Will%rEffect The target struggles to differentiate between alternate histories and how the past truly occurred. The creature takes a –2 status penalty to checks made to Recall Knowledge (or a –4 penalty on a critical failure). This curse has an unlimited duration."}, {"name": "Double Attack", "type": "action", "traits": [], "cost": 1, "text": "The kraken makes two Strikes with two different arms or tentacles, each limb targeting a different creature. Double Attack counts as two attacks toward the kraken's multiple attack penalty, but the penalty doesn't increase until after both attacks are made.%rIf the kraken subsequently uses the Grab action, it Grabs any number of creatures it hit with Double Attack."}, {"name": "Ink Cloud", "type": "action", "traits": [], "cost": 1, "text": "The kraken releases a cloud of black, venomous ink in an 80-foot. This cloud has no effect outside water.%rCreatures inside the ink cloud are exposed to retrocognitive ink poison and are Undetected while inside the cloud.%rThe kraken can't use Ink Cloud again for 2d6 rounds, and the cloud dissipates after 1 minute."}, {"name": "Jet", "type": "action", "traits": ["move"], "cost": 1, "text": "The kraken moves through the water up to 280 feet in a straight line without triggering reactions."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Baolen regains an expended spell."}, {"name": "Retrocognitive Ink", "type": "passive", "traits": ["poison", "primal"], "text": "Baolen is immune to this poison%rSaving Throw DC 40 Will%rMaximum Duration 10 rounds%rStage 1 4d6 mental damage and Stupefied 1 (1 round)%rStage 2 5d6 mental damage, Stupefied 2, and the target is exposed to the curse of flawed history (1 round)"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
