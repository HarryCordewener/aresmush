  strikes: [{"name": "Wretched Claw", "bonus": 44, "damage": [["4d6+21", "slashing", null], ["2d6", "void", null]], "traits": ["agile", "magical", "reach-10", "unarmed"]}, {"name": "Doomsday Scepter", "bonus": 44, "damage": [["2d6", "void", null], ["4d10+21", "bludgeoning", null]], "traits": ["backswing", "magical", "reach-10", "shove"], "effects": ["Curse Of Destiny"]}, {"name": "Annihilation Ray", "bonus": 41, "damage": [["8d8", "void", "persistent"]], "traits": ["occult"], "range": 30}]
  actions: [{"name": "Doomsday Scepter", "type": "passive", "traits": [], "text": "When the Ashen Man turns his attention to a world, a projection of that planet manifests among the branches of the doomsday scepter he carries. He can wield this device in combat as a greatclub. If he releases his grip on the doomsday scepter or it's disarmed, it vanishes, after which the Ashen Man can cause it to appear in his hand again as a free action with the concentrate trait during his turn."}, {"name": "Entropy Sense", "type": "passive", "traits": ["occult", "prediction"], "text": "The ancient one can predict the presence of a creature through supernatural insight into chaotic probabilities and chance and builds a perception of reality from this information, allowing them to \"see\" as a precise sense in the listed range. Invisible creatures are visible to them, but veil of privacy prevents a creature from being detected via entropy sense automatically (without a counteract check)."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Ashen Man ends one condition affecting him."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Cohesion Vulnerability", "type": "passive", "traits": [], "text": "The Ashen Man is repulsed by an orderly reality. Whenever the Ashen Man sees a creature that was injured restored to its full Hit Points, he becomes obsessed with correcting the defiance of entropy. He takes 8d6 mental damage and can't use actions with the concentrate trait until he's dealt damage to that creature that reduces their Hit Point total from its maximum value."}, {"name": "Feast on Destruction", "type": "passive", "traits": ["aura", "death"], "text": "120 feet. Wait long enough and reality always proves that all things begin so they can end. The Ashen Man is empowered whenever this belief is vindicated. When a creature in the aura gains the Dying condition or increases its dying value, the Ashen Man becomes Quickened for 1 round. He can use the extra action only to Stride or Strike."}, {"name": "Multiple Reactions", "type": "passive", "traits": [], "text": "The Ashen Man's untethered relationship with time gives him an additional reaction each round, though he still can't use more than one reaction on the same triggering action."}, {"name": "Mutually Assured", "type": "reaction", "traits": [], "text": "Trigger A creature within 10 feet deals damage to the Ashen Man%rEffect Reality hurtles toward destruction. The Ashen Man makes a wretched claw Strike against the triggering creature."}, {"name": "Mythic Resilience (Fortitude and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "No Breath", "type": "passive", "traits": [], "text": "An ancient one doesn't breathe and is immune to effects that require breathing (such as inhaled poisons)."}, {"name": "Otherworldly Mind", "type": "passive", "traits": ["mental", "occult"], "text": "Whenever a creature targets the ancient one with a mental effect, that creature takes 8d8 mental damage (DC 43 Will save). On a critical failure, the creature also becomes Confused for 1d4 rounds."}, {"name": "The Connection Cuts Both Ways", "type": "passive", "traits": [], "text": "Creatures the ancient one affected with a mental effect or communicated with telepathically within the last round can hijack the ancient one's telepathic connection; they automatically ignore the ancient one's immunity to auditory, emotion, and visual effects until the end of their current turn. They can additionally spend 1 Mythic Point as a free action to reach through the connection to manipulate the ancient one's mind, ignoring the ancient one's mythic resilience on Will saving throws."}, {"name": "Undying Myth", "type": "free", "traits": [], "text": "Cost all of the Ancient One's Mythic Points%rTrigger The Ashen Man would die and has at least 1 Mythic Point%rEffect The Ashen Man remains standing and conscious, and recovers 50% of his maximum Hit Points."}, {"name": "Unified Timeline", "type": "reaction", "traits": ["occult", "teleportation"], "text": "Trigger A creature ends its movement within 10 feet of the ancient one%rEffect Ancient ones exist spread out across infinite times and places simultaneously and can shift themselves through their catalog of potentialities. The ancient one teleports themself and the triggering creature into empty squares within 10 feet of their respective positions, though the triggering creature can't be moved into hazardous terrain or to a place it can't stand. An unwilling creature can resist the…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Curse of Destiny", "type": "passive", "traits": ["curse", "death"], "text": "When the Ashen Man hits a creature with a doomsday scepter Strike, he inflicts the cursed destiny held in trust for all creatures who live: a promise of future death. The target must succeed at a DC 46 Fortitude save or become Drained 2. On a critical failure, the target additionally becomes Doomed 1 or increases its current doomed value by 1."}, {"name": "Dismantle All Life", "type": "passive", "traits": ["occult", "time", "vitality", "void"], "text": "Time and entropy end all things, even the undead. When the ancient one's Strikes hit a creature with void healing, they deal vitality damage instead of void damage. The ancient one can't use their Strikes to restore Hit Points to living or undead creatures."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Ashen Man regains an expended spell."}, {"name": "Reroll", "type": "free", "traits": ["fortune"], "text": "Cost 1 Mythic Point%rTrigger The Ashen Man fails a check%rEffect The Ashen Man rerolls the check."}, {"name": "Slither Between Realities", "type": "free", "traits": ["concentrate", "occult", "teleportation"], "text": "Frequency once per round%rTrigger The Ashen Man begins or ends his turn%rEffect The Great Beyond loses track of the Ashen Man, and he slips between reality's cracks, instantly transporting himself and any items he's wearing and holding from his current space to an unoccupied space within 100 feet that he can see."}, {"name": "Unravel Reality", "type": "action", "traits": ["concentrate", "occult"], "cost": 2, "text": "The Ashen Man holds aloft his doomsday scepter then swings it violently downward as he rips the quintessence of the planes apart in a 60-foot line, creating difficult terrain and dealing 24d6 spirit|options:area-damage damage to each creature in the area (DC 46 Fortitude save). The Ashen Man can't Unravel Reality again for 1d4 rounds."}, {"name": "Visions of the Forever", "type": "action", "traits": ["concentrate", "emotion", "fear", "mental", "occult"], "cost": 1, "text": "Cost 1 Mythic Point%rFrequency once per round%rEffect The Ashen Man shrinks the distance separating all creatures in a 120-foot emanation, brushing up against their minds and granting them vivid, waking dreams. All who share the hallucination experience entire millennia in an instant, rushed into a bleak future where they alone are stranded as the last living person in a destroyed world of ash and ruin. There, as the sole survivor of an empty reality where even the gods have fallen, they hear…"}]
