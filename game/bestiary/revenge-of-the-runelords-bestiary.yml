  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Xanderghul ends one condition affecting him."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Air of Delusion", "type": "passive", "traits": ["aura", "illusion", "mental"], "text": "15 feet. False visions and strange shadows dance through the area, obscuring the truth for only Xanderghul to know. A creature that first enters the area must attempt a DC 46 Will save. On a failure, it's Off-Guard to Xanderghul whenever it's in the area. On a critical success, the creature is temporarily immune to air of delusion for 1 minute."}, {"name": "Anything You Can Do", "type": "reaction", "traits": ["arcane", "illusion"], "text": "Trigger A creature Xanderghul is imitating with illusory disguise takes a single action of any type%rEffect If the triggering action is a move action, Xanderghul can use the same distance and method to move himself. If the triggering action is a Strike, Xanderghul can attempt a Strike against any foe in reach with his hammer. If the triggering action was any other type of action, Xanderghul mimics that action via a reflexive illusion that confuses onlookers; Anything You Can Do gains the mental…"}, {"name": "Mythic Resilience (Fortitude and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Sin Counterspell", "type": "reaction", "traits": ["arcane"], "text": "Trigger A creature within 30 feet casts a spell that creates or changes physical things%rEffect Xanderghul attempts to counteract the triggering spell with a +42 counteract modifier and a counteract rank of 10."}, {"name": "Undying Myth", "type": "free", "traits": [], "text": "Cost all Xanderghul's Mythic Points%rEffect When Xanderghul would die, as long as he has at least 1 Mythic Point, he immediately expends all remaining Mythic Points he has, remains standing and conscious, and recovers 50% of his maximum Hit Points."}, {"name": "Ego Boost", "type": "passive", "traits": [], "text": "When a creature fails to disbelieve one of Xanderghul's illusions, he becomes Quickened for 1 round and can use the extra action to Stride or Stride."}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "Frequency once per day%rEffect If Xanderghul's next action is to cast a cantrip or spell that is 8th rank or lower, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Xanderghul regains a previously cast spell."}, {"name": "Reroll", "type": "free", "traits": ["fortune"], "text": "Cost 1 Mythic Point%rTrigger Xanderghul fails a check%rEffect Xanderghul rerolls the check."}, {"name": "Shuffle the Deck", "type": "free", "traits": ["illusion", "mental", "visual"], "text": "Trigger Xanderghul casts illusory disguise to imitate the appearance of a creature he is adjacent to%rEffect Xanderghul and the creature appear to Step several times, exchanging spaces. The target creature must attempt a DC 49 Will save with the following results.%rCritical Success The targeted creature may choose which square they Step into, and no other creature is tricked.%rSuccess Xanderghul chooses which square the creature Steps into (which must be a legal space for the creature to…"}, {"name": "Sovereign of the False", "type": "free", "traits": ["concentrate"], "text": "Frequency once per round%rEffect Xanderghul Sustains one spell with the illusion trait."}, {"name": "Vision of Loss", "type": "passive", "traits": ["illusion", "mental"], "text": "The first time in a round that Xanderghul hits a creature with his waking dreams Strike, their mind is clouded by illusory hallucinations and waking dreams of all their triumphs not only being revealed to be failures in the end, but with the conviction that had Xanderghul attempted the same, it would've prevailed. The target must succeed at a DC 49 Will save or become Stupefied 2 for 1 round (or stupefied 2 with an unlimited duration on a critical failure)."}]
