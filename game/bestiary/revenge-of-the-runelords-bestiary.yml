  actions: [{"name": "+2 Status to All Saves vs. Occult", "type": "passive", "traits": []}, {"name": "Challenge Fate", "type": "reaction", "traits": ["misfortune", "occult"], "text": "Trigger The dragon is targeted by an attack;%rEffect This fate is not set in stone. The attacker rolls the triggering attack twice and uses the worse result."}, {"name": "Untethered to Fate", "type": "passive", "traits": [], "text": "The dragon can choose to negate any fortune or misfortune effects that would affect them; other creatures remain affected normally."}, {"name": "Destiny Breath", "type": "action", "traits": ["mental", "occult"], "cost": 2, "text": "The dragon breathes a translucent mist of potentialities that overwhelms creatures with visions of possible features, dealing 13d6 mental|options:area-damage damage in a 40-foot (DC 34 Will save). A creature that fails its save is Slowed 1 for 1 round (or Slowed 2 on a critical failure) as it struggles with the visions.%rThe dragon can't use Destiny Breath again for 1d4 rounds."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "The dragon makes two claw Strikes and one wing Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "The dragon recharges their Destiny Breath whenever they score a critical hit with a Strike."}, {"name": "Prophetic Wings", "type": "passive", "traits": [], "text": "The dragon or any ally can glimpse into the future through the dragon's wings in a process that requires 10 minutes of concentration. This casts a 6th-rank Augury spell, except that the wings can predict results up to 1 month into the future and the dragon always speaks a few cryptic words related to the result of the prediction.%rThe dragon can use their wings in this way only once per day, and a given creature can seek a future in the wings only once per week."}, {"name": "Walk the Timelines", "type": "action", "traits": ["occult"], "cost": 2, "text": "Frequency once per hour%rEffect The dragon splits themself into two versions with different fates. Each copy Strides or Flies from the dragon's current space, then takes a single action. If the actions are both attacks, they use the same multiple attack penalty and count as one attack toward the dragon's multiple attack penalty.%rAfter both actions, the dragon chooses one of the two locations as their actual destination and the other version of themself disappears."}]
