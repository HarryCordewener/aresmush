  actions: [{"name": "Construct Armor (Hardness 15)", "type": "passive", "traits": [], "text": "The ravenous crypt reduces any damage it takes by an amount equal to its Hardness. Once it's reduced to less than 100 Hit Points, or immediately upon being damaged by a critical hit, its construct armor breaks, removing its Hardness and reducing the crypt's Armor Class to 32."}, {"name": "Reduced to Rubble", "type": "passive", "traits": [], "text": "When the ravenous crypt is reduced to 0 Hit Points, its space becomes an area of difficult terrain, and any creatures swallowed by the crypt fall Prone in a space of their choice within the area."}, {"name": "Sap Strength", "type": "passive", "traits": [], "text": "A creature that takes void damage from the ravenous crypt's Swallow Whole ability must attempt a DC 34 Fortitude save.%rCritical Success The creature is unaffected.%rSuccess The creature is Enfeebled 1 for 1 round.%rFailure The creature is Enfeebled 2 for 1 minute.%rCritical Failure The creature is Enfeebled 3 for 1 minute."}, {"name": "Spacious Stomach", "type": "passive", "traits": [], "text": "A ravenous crypt has a 10-foot-space inside of it. A creature swallowed by the ravenous crypt isn't Grabbed or slowed, and the creature doesn't need to hold its breath. It can attack the ravenous crypt normally. Because it isn't grabbed, it can't Escape the crypt, but it can break free by dealing bludgeoning damage to the crypt equal to the crypt's Rupture value or by Forcing Open the crypt's doors with a successful DC 34 Athletics check."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Large, 5d8 void plus sap strength, Rupture 20"}, {"name": "Thrash", "type": "action", "traits": [], "cost": 2, "text": "Each adjacent creature and each creature swallowed by the ravenous crypt takes 5d10 bludgeoning damage (DC 34 Reflex save). Swallowed creatures take a –2 circumstance penalty to this save. On a critical failure, a creature is also knocked Prone."}, {"name": "Improved Grab", "type": "free", "traits": []}]
