  actions: [{"name": "Coven", "type": "passive", "traits": ["mental", "occult"], "text": "A Bittersweet Sister adds Interplanar Teleport, Scrying, and Spirit Blast to her coven's spells."}, {"name": "Ferocity", "type": "reaction", "traits": []}, {"name": "Moonlight's Kiss", "type": "passive", "traits": [], "text": "A moon hag in an area illuminated by moonlight gains a +2 status bonus to AC and initiative rolls. In the light of a full moon, they're Quickened, and can use the extra action only to Stride or Strike. If the moon hag has a fly Speed, they can use the extra action to Fly as well.%rAny time they're outside of the oubliette or in area C7 they are in moonlight."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "occult", "polymorph"], "cost": 1, "text": "The moon hag can take on the appearance of any Medium humanoid woman. This doesn't change their Speed or their attack and damage bonuses with their Strikes, but it might change the damage type their Strikes deal (typically to bludgeoning)."}, {"name": "Dreadful Prediction", "type": "action", "traits": ["curse", "mental", "occult"], "cost": 1, "text": "Frequency once per round%rEffect The moon hag howls a series of dreadful, apocalyptic predictions at a single creature within 30 feet, shattering its perceptions of reality. The target must attempt a DC 38 Will save and takes a –2 circumstance penalty to the save if it can see the moon. On a failure, the creature becomes Stupefied 2 (Stupefied 3 on a critical failure) until the curse is removed. Regardless of the outcome, the creature is then temporarily immune for 24 hours."}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Claw"}, {"name": "Ride the Moonbeams", "type": "action", "traits": ["concentrate", "manipulate", "occult", "teleportation"], "cost": 1, "text": "Frequency once per round%rEffect The moon hag teleports themself and any items they're wearing and holding to another space within 30 feet, or 60 feet if they're in moonlight. They then gain a 25-foot fly Speed until the end of their next turn. If the moon hag is in the air when the effect ends, they float to the ground, taking no falling damage.%rAny time they're outside of the oubliette or in area C7 they are in moonlight."}]
