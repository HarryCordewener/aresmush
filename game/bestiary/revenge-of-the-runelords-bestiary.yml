  actions: [{"name": "Green Glow", "type": "passive", "traits": ["arcane", "aura", "poison", "radiation"], "text": "15 feet. A creature beginning its turn in the aura must attempt a DC 37 Fortitude save to avoid becoming Sickened 1 (or Sickened 2 on a critical failure). A creature that's already sickened instead becomes Enfeebled 1 on a failure (or Enfeebled 2 on a critical failure) for 24 hours."}, {"name": "Security Alert", "type": "reaction", "traits": [], "text": "Trigger The abysium sentinel becomes aware of an unfamiliar creature%rEffect The abysium sentinel alerts its owner of an intruder, either with a mental or audible alarm, depending on established orders. The mental alarm has a range of 1 mile."}, {"name": "Statue's Head", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Until the next time it acts, the abysium sentinel appears to be the head of a statue it's perched atop. It has an automatic result of 58 on Deception checks and DCs to pass as nothing more than a statue's head."}]
