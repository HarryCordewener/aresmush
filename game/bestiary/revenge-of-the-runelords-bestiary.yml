  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The risen runelord ends one condition affecting them."}, {"name": "Beyond Life", "type": "passive", "traits": [], "text": "A risen runelord may drink or eat for pleasure or entertainment, but they need not do so for nourishment and never suffer the effects of thirst or starvation."}, {"name": "Mythic Resilience (Reflex and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Vanishing Death", "type": "passive", "traits": ["arcane", "mental"], "text": "When a risen runelord is slain, their body and (if manifested) polearm vanishes as the trapped legacy that was drawn upon to create them is set free, exploding outward in a riot of swirling color. This release of arcane energy hammers the minds of nearby creatures. All creatures adjacent to a risen runelord during their vanishing death must succeed at a DC 37 Will save or become Stupefied 1 for 24 hours (Stupefied 2 on a critical failure) as fragments of their own memories are temporarily…"}, {"name": "Chromatic Aegis", "type": "free", "traits": [], "text": "Cost all of Karzoug's Mythic Points%rRequirements Aethusa's Prison hazard hasn't been destroyed%rTrigger Karzoug would die and has at least 1 Mythic Point%rEffect Karzoug uses his dying breath to destroy Aethusa's prison and wrap himself in the remnants of its magical energy. Karzoug remains standing and conscious, and he recovers 166 healing Hit Points. He becomes immune to the type of elemental damage the prison was focused on when Karzoug used this ability. At the end of Risen Runelord…"}, {"name": "Manifest Runelord's Polearm", "type": "action", "traits": ["arcane"], "cost": 1, "text": "Requirements The risen runelord isn't holding a runelord's polearm%rEffect The risen runelord causes their runelord's polearm to appear in one of their hands. The exact appearance of the polearm depends on the type wielded by the runelord in life, but these weapons are purely spiritual constructs that inflict mental damage on a Strike and vanish as soon as the risen runelord releases the weapon or dies."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Quickened Casting", "type": "free", "traits": ["concentrate", "spellshape"], "text": "Frequency once per day%rEffect If the risen runelord's next action is to cast a cantrip or spell that's 4th-rank or lower, reduce the number of actions to cast it by 1 (minimum 1 action)."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The risen runelord regains an expended spell slot or can use Quickened Casting again."}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt the risen runelord's spellcasting action, the risen runelord attempts a DC 15 Flat. On a success, the action isn't disrupted."}]
