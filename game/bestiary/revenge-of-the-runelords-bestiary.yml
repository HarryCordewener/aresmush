  actions: [{"name": "Dreams of the Past", "type": "passive", "traits": ["curse", "incapacitation", "mental", "occult"], "text": "When a sleeping or Unconscious creature wakes up within 20 feet of a vogorond, its memories are overwritten by those of an inhabitant of the vogorond's home world. The target is affected by a 9th-rank Never Mind spell (DC 40 Will save)."}, {"name": "Ruinous Aura", "type": "passive", "traits": ["aura", "occult"], "text": "10 feet. The air surrounding the vogorond is filled with floating rubble and debris. This area is difficult terrain for creatures other than the vogorond. Each time the vogorond is subjected to a critical hit while their aura is active, the aura's radius increases by 10 feet. If the vogorond's ruinous aura would ever extend to more than 30 feet, the vogorond crumbles apart and is destroyed."}, {"name": "Activate Aura", "type": "action", "traits": ["occult"], "cost": 1, "text": "The vogorond's ruinous aura activates, extending to a range of 10 feet, and the vogorond can Fly once. The vogorond can Activate Aura as a free action when they roll initiative."}, {"name": "Debris Storm", "type": "action", "traits": [], "cost": 1, "text": "Each enemy in the vogorond's ruinous aura takes 8d6 bludgeoning|options:area-damage damage (DC 40 Reflex save)."}, {"name": "Launch Rubble", "type": "action", "traits": [], "cost": 2, "text": "Requirements The vogorond's ruinous aura is active%rEffect The vogorond launches a piece of rubble up to 100 feet. Upon impact, the rubble explodes in a 20-foot burst. Any creatures in the area take 15d8 bludgeoning|options:area-damage damage (DC 40 Reflex save). The radius of the vogorond's aura then decreases by 10 feet. The vogorond can't Launch Rubble again for 1d4 rounds."}, {"name": "Monument", "type": "action", "traits": ["concentrate"], "cost": 3, "text": "The vogorond deactivates their ruinous aura. Until the next time they act, the vogorond appears to be an inanimate statue, altar, or fragment of architecture. They have an automatic result of 45 on Deception checks and DCs to pass as such an object."}, {"name": "Vogorond Lore", "type": "passive", "traits": ["occult"], "text": "A vogorond serves as a repository of the memories of the inhabitants of their home world. This gives them the Vogorond Lore skill, which they use when casting Hypercognition and sifting through the combined memories of their countless shattered minds."}]
