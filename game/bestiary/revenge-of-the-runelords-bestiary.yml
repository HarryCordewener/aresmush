ricity dealing 16d6 electricity|options:area-damage damage. Smoke Maw (poison) 60-foot cone of toxic smoke dealing 16d6 poison|options:area-damage damage."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Pull Apart", "type": "action", "traits": [], "cost": 2, "text": "The mukradi makes two Strikes with different maws against the same target. If both hit, the target takes an extra (2d12+13) slashing damage, with a DC 36 Fortitude save. On a critical failure, the creature is torn to pieces and dies.%rThe mukradi's multiple attack penalty increases only after all the attacks are made."}, {"name": "Recharge", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The pyroclastic mukradi gains one additional use of Breathe Energy."}, {"name": "Thrash", "type": "action", "traits": [], "cost": 2, "text": "The mukradi Strikes once against each creature in its reach. It can make one of these Strikes with each of its maws, one with its tail lash, and the rest with its legs. Each attack takes a –2 circumstance penalty and counts toward the mukradi's multiple attack penalty, but the multiple attack penalty doesn't increase until after all the attacks are made."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Huge or smaller, leg, DC 36 Reflex"}, {"name": "Knockdown", "type": "action", "traits": [], "cost": 1}]
