  actions: [{"name": "Untouched by Time", "type": "passive", "traits": [], "text": "Though not undead, silent devotees don't age as most mortal creatures do. They don't eat, drink, sleep, or breathe."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+2 Status to All Saves Vs. Auditory", "type": "passive", "traits": []}, {"name": "Pall of Silence", "type": "passive", "traits": ["arcane", "aura", "illusion"], "text": "10 feet. The silent devotee is surrounded by an aura that suppresses sound, granting the silent devotee resistance to sonic energy and a bonus to all saves against auditory effects. Creatures within the aura can't use sonic attacks, use auditory actions, or Cast a Spell without the subtle trait."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Cruel Sneak Attack", "type": "passive", "traits": [], "text": "A silent devotee's Strikes deal and additional 2d6 precision damage to creatures that are Off-Guard or are taking persistent bleed damage."}, {"name": "Quieting Rune", "type": "action", "traits": ["arcane", "concentrate", "illusion", "manipulate"], "cost": 2, "text": "The silent devotee marks a creature within 60 feet they can see with a rune of magical silence. The creature must succeed at a DC 34 Will saving throw or be affected as if by a 7th-rank Silence spell. The rune lasts for 1 minute or until the devotee dies. A creature can be marked with only one Quieting Rune at a time. If the devotee uses this ability again, any previous Quieting Rune they've created ends."}, {"name": "Transdimensional Step", "type": "action", "traits": ["arcane", "teleportation"], "cost": 2, "text": "The silent devotee teleports to an unoccupied space within 30 feet."}]
