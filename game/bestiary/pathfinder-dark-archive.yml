  actions: [{"name": "Light Vulnerability", "type": "passive", "traits": [], "text": "An object shedding magical light (such as from the Light spell) is treated as magical when used to attack the shadow."}, {"name": "Crystal Siphon", "type": "action", "traits": ["death", "divine", "void"], "cost": 2, "text": "Requirements The shadow and the target are both within 40 feet of the crystal that spawned the shadow, and the crystal isn't covered or obstructed%rEffect Shadows in the shape of tendrils curl around the target, drawing out a portion of the target's vitality and siphoning it into the crystal. The target takes 4d6 void damage (DC 21 Fortitude). On a failure, they are also Enfeebled 1. This enfeebled condition is cumulative with other enfeebled conditions from quartz-spawned shadows, to a maximum…"}, {"name": "Slink in Shadows", "type": "passive", "traits": [], "text": "The shadow can Hide or end its Sneak in a creature's or object's shadow."}]
