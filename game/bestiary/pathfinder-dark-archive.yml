  actions: [{"name": "Fast Healing 10", "type": "passive", "traits": []}, {"name": "Pod Prison", "type": "free", "traits": [], "text": "Requirements A creature is swallowed by the moonflower%rEffect The moonflower wraps the swallowed creature in a cocoon and extrudes it into an adjacent square. The creature continues to be Swallowed Whole and takes half damage from any damage dealt to the cocoon. Once the cocoon is Ruptured, it deflates and decays."}, {"name": "Pod Spawn", "type": "passive", "traits": [], "text": "If a Small or larger creature dies within a pod prison, the pod transforms into an adult moonflower with full Hit Points after 1d4 hours of growth. The dead creature's equipment remains inside the new moonflower and can be retrieved if the moonflower is slain."}, {"name": "Spray Blossoms", "type": "action", "traits": ["mental", "plant", "poison"], "cost": 2, "text": "The moonflower expels mind-warping petals in a 30-foot cone. Creatures in the area take 4d6 mental,4d6 poison|options:area-damage damage (DC 26 Will save). A creature that fails is Stupefied 2 for 1 minute, and Confused for 1 round if it got a critical failure. The moonflower can't Spray Blossoms again for 1d4 rounds."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Large, (2d10+10) bludgeoning,2d6 acid, Rupture 21"}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
