  strikes: [{"name": "Dagger", "bonus": 18, "damage": [["2d4+7", "piercing", null], ["1d6", "mental", null], ["1d6", "bleed", null]], "traits": ["agile", "finesse", "magical", "versatile-s"]}, {"name": "Dagger", "bonus": 18, "damage": [["2d4+7", "piercing", null], ["1d6", "mental", null], ["1d6", "bleed", null]], "traits": ["agile", "magical", "thrown-10", "versatile-s"]}]
  actions: [{"name": "Crystal Vitality Link", "type": "passive", "traits": [], "text": "The power of the island links Mitera's vitality to her followers. As long as any of the three quartz formations are intact, whenever Mitera takes damage, any of her followers within 10 miles lose the same amount of HP."}, {"name": "Ascension is Near", "type": "action", "traits": ["auditory", "concentrate", "emotion", "incapacitation", "mental"], "cost": 1, "text": "Frequency once per ascension ritual%rEffect Mitera activates the moonflower link with her followers. Any followers within 30 feet who failed their saving throw against the moonflower tea become Sickened 1. Anyone who critically failed and did not receive an antidote explodes (this is about half of Mitera's congregation if the PCs didn't successfully administer the antidote). If anyone's body explodes, Mitera gains 30 temporary HP and is Quickened for 3 rounds; she can use this additional action…"}]
  spellcasting: [{"name": "Primal Prepared Spells", "tradition": "primal", "type": "prepared", "dc": 26, "attack": 18, "spells": {"0": ["Frostbite", "Guidance", "Light", "Message", "Tangle Vine"], "1": ["Heal"], "2": ["Entangling Flora", "One with Plants", "Revealing Light"], "3": ["Lightning Bolt", "Tempest Cloak"], "4": ["Grasping Earth", "Life-Draining Roots", "Unfettered Movement"]}}]
