  hp: 290
  perception: 26
  saves: {"fortitude": 26, "reflex": 20, "will": 29}
  abilities: {"cha": 8, "con": 5, "dex": 1, "int": 1, "str": 5, "wis": 1}
  speeds: {"land": 0}
  skills: {"Acrobatics": 30, "Athletics": 30}
  strikes: [{"name": "Psychic Scream", "bonus": 27, "damage": [["4d6", "sonic", null], ["4d6", "mental", null]], "traits": ["mental", "occult", "sonic"]}]
  actions: [{"name": "Anchored in Silk", "type": "passive", "traits": [], "text": "The cocoon is incapable of movement beyond slight wriggling in place. It has no Speed and can't move or be moved, even through means such as teleportation, as the Weaver's threads tether it in place physically and astrally. The cocoon casts any spells psychically, substituting verbal and somatic components for expressions of pure unbridled will and removing the manipulate trait from its Cast a Spell action."}, {"name": "Give of Oneself", "type": "free", "traits": [], "text": "Trigger The Weaver would be reduced to 0 Hit Points%rEffect The cocoon's vitality is linked to the Weaver's. It loses 30 untyped Hit Points, restoring 15 healing Hit Points to the Weaver. It can use this ability even if it would otherwise be unable to act."}, {"name": "In There Somewhere", "type": "passive", "traits": [], "text": "Killia's individuality still rests within the cocoon, yet trying to resist assimilation. If a PC succeeds at a DC 32 Diplomacy check on the cocoon, the cocoon takes 5d6 mental damage and is Stunned 1 as Killia's consciousness fights the Weaver. The cocoon can't be affected in this way more than once per turn."}, {"name": "Of Same Essence", "type": "passive", "traits": [], "text": "The cocoon and the Weaver share the same essence. Its spells never affect the Weaver if they would harm him, and the Weaver can ignore the any of the cocoon's active spell effects if he desires (such as Sea of Thought)."}]
  spellcasting: [{"name": "Occult Spontaneous Spells", "tradition": "occult", "type": "spontaneous", "dc": 33, "attack": 27, "spells": {"0": ["Daze", "Phase Bolt", "Shield", "Telekinetic Hand", "Telekinetic Projectile"], "5": ["Darkness", "Etheric Shards", "Sea of Thought", "Synaptic Pulse"], "6": ["Collective Transposition", "Dispel Magic", "Never Mind", "Soothe"], "7": ["Invisibility Curtain", "Spirit Blast", "Telekinetic Bombardment"]}}]
