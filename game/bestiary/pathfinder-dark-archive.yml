  actions: [{"name": "Fossilization", "type": "passive", "traits": ["arcane", "incapacitation"], "text": "The first time each round a creature takes damage from the paleohemoth's jaws, the target must attempt a DC 32 Fortitude save. If it fails and has not already been slowed by this ability, it becomes Slowed 1 for 1 minute.%rIf the creature was already slowed by this ability, a failed save causes it to be Petrified permanently."}, {"name": "Incomplete", "type": "passive", "traits": [], "text": "The spectral fang paleohemoth is missing part of its body, making it Large instead of Huge and reducing the reach of its jaws Strike to 10 feet."}, {"name": "Reassemble", "type": "action", "traits": [], "cost": 1, "text": "The paleohemoth reorganizes its bones, increasing its reach to 25 feet and reducing its Speed to 15 feet. It can revert to its original form by taking this action again."}]
