  strikes: [{"name": "Shadow Hand", "bonus": 15, "damage": [["2d6+3", "void", null]], "traits": ["finesse", "magical"]}]
  actions: [{"name": "Light Vulnerability", "type": "passive", "traits": [], "text": "An object shedding magical light (such as from the Light spell) is treated as magical when used to attack the shadow."}, {"name": "Crystal Siphon", "type": "action", "traits": ["death", "divine", "void"], "cost": 2, "text": "Requirements The shadow and the target are both within 40 feet of the crystal that spawned the shadow, and the crystal isn't covered or obstructed%rEffect Shadows in the shape of tendrils curl around the target, drawing out a portion of the target's vitality and siphoning it into the crystal. The target takes 4d6 void damage (DC 21 basic Fortitude). On a failure, they are also Enfeebled 1. This enfeebled condition is cumulative with other enfeebled conditions from quartz-spawned shadows, to a maximum of enfeebled 4. If Crystal Siphon increases the creature's enfeebled value to 3 or more, the target's shadow is pulled entirely into the shadow's crystal.%rWhile the target's shadow is trapped, they feel an Invisible tether linking them to the crystal, and they become Slowed 1 whenever they are more than 40 feet away from it. The enfeebled condition from Crystal Siphon can't be reduced until the crystal is broken; if the crystal is broken, the effect immediately ends."}, {"name": "Slink in Shadows", "type": "passive", "traits": [], "text": "The shadow can Hide or end its Sneak in a creature's or object's shadow."}]
