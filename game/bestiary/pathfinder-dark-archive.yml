  strikes: [{"name": "Limb", "bonus": 24, "damage": [["3d10+11", "bludgeoning", null]], "traits": []}, {"name": "Warping Ray", "bonus": 27, "damage": [["3d8+8", "force", null]], "traits": ["deadly-2d8", "magical"]}]
  actions: [{"name": "Regeneration 10 (Deactivated by Piercing)", "type": "passive", "traits": [], "text": "This monster regains the listed number of Hit Points each round at the beginning of its turn. Its Dying condition never increases beyond Dying 3 as long as its regeneration is active. However, if it takes damage of a type listed in the regeneration entry, its regeneration deactivates until the end of its next turn. Deactivate the regeneration before applying any damage of a listed type, since that damage might kill the monster by bringing it to Dying 4.", "rules": [{"key": "FastHealing", "type": "regeneration", "value": 10, "deactivatedBy": ["piercing"]}]}, {"name": "Destabilizing Field", "type": "passive", "traits": ["aura", "occult"], "text": "40 feet. A creature that begins its turn within the area feels its body begin to stretch and must succeed at a DC 33 Fortitude save or become destabilized. A destabilized creature emits a 10-foot destabilizing field aura and becomes Sickened 1. The destabilization ends when the creature is no longer sickened. A creature that succeeds at its saving throw against the aura is temporarily immune to all destabilizing fields for 1 minute.", "rules": [{"key": "Aura", "radius": 40, "traits": [], "slug": "destabilizing-field"}]}, {"name": "Displace", "type": "reaction", "traits": [], "text": "Trigger The amalgamite is hit by a Strike%rEffect The amalgamite Relocates or Transposes themself with another creature. If the amalgamite successfully changes location, they and any Transposed creature take half damage from the triggering Strike."}, {"name": "Relocate", "type": "action", "traits": ["concentrate", "occult", "teleportation"], "cost": 2, "text": "The amalgamite teleports into an unoccupied space they can see within 50 feet."}, {"name": "Transpose", "type": "action", "traits": ["concentrate", "occult", "teleportation"], "cost": 2, "text": "The amalgamite teleports up to two destabilized creatures within 50 feet that they can see. They can either move a single creature to an unoccupied space or swap the positions of two creatures of the same size. If the amalgamite swaps two creatures, they can choose their self as one target. An unwilling creature can attempt a DC 33 Will save. If either target succeeds at this saving throw, both are unaffected."}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 33, "attack": 25, "spells": {"4": ["Flicker"], "7": ["Warp Mind"]}}]
"Cocoon of Lucid Potential":
  pack: "pathfinder-dark-archive"
  source: "Pathfinder Adventures: Dark Archive Web Supplement: In Darkness (Remastered)"
  level: 13
