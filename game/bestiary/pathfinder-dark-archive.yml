  strikes: [{"name": "Claw", "bonus": 32, "damage": [["5d6+14", "slashing", null]], "traits": ["agile", "finesse", "magical", "unarmed", "versatile-p"]}, {"name": "Astral Silk", "bonus": 32, "damage": [["5d4+14", "slashing", null], ["3d6", "mental", null]], "traits": ["disarm", "finesse", "magical", "reach-20", "sweep"], "effects": ["Separate Astral Body"]}]
  actions: [{"name": "Dreams Unraveling", "type": "passive", "traits": ["aura", "emotion", "fear", "mental", "visual"], "text": "When the Weaver has fewer than 155 Hit Points, his form partially unravels, revealing patches of pure horror acute enough to leave physical wounds. This creates a 10-foot emanation that deals 3d6 mental damage and 3d6 slashing damage, with a DC 36 basic Will. A creature Averting its Gaze is immune to the aura.", "rules": [{"key": "Aura", "radius": 10, "traits": ["emotion", "fear", "mental", "visual"], "slug": "dreams-unraveling", "predicate": [{"lt": ["hp-remaining", 155]}]}]}, {"name": "Nameless Nightmare", "type": "passive", "traits": [], "text": "The Weaver has torn off his own name to become a being of fear. He is immune to linguistic effects and any effect that would impose the Frightened condition. Without a name, he is difficult for phenomena to affect; the Weaver recovers from the Paralyzed, Slowed, and Stunned conditions at the end of his turn, and his flat check to clear persistent damage is 5. If anyone utters, writes, or otherwise attempts to record his name, that creature automatically takes 10 mental damage and the attempt fails.", "rules": [{"key": "Immunity", "definition": ["nameless-nightmare"], "type": "custom", "label": "{item|name}"}]}, {"name": "Stitch Into the Web", "type": "reaction", "traits": [], "text": "Trigger The Weaver is moved against his will, or a creature attempts to leave a square within 20 feet of him by any means, including teleportation%rEffect The Weaver's silk stitches a body in place to prevent movement. The creature stops moving and the action is disrupted. The disruption doesn't affect astral bodies."}, {"name": "Separate Astral Body", "type": "action", "traits": [], "cost": 1, "text": "The Weaver buries a silk thread in the target's psyche and tugs, wrenching the target's astral form out of their body. Unless the target succeeds at a DC 36 Will save, their astral form is pulled out, causing a ghostly image of them to appear in an adjacent space of the Weaver's choosing. An astral body is immune to physical damage but affected normally by mental effects, force effects, and effects that directly target the spirit. The target remains connected to their physical body by a silver cord, which is always visible and possibly foils attempts to Hide. Separation from one's astral body takes a toll on the psyche, imposing a -1 status penalty to Will saves and dealing 1d6 persistent mental damage for as long as the body is separated; this increases to 3d6 if the target is ever more than 30 feet from its astral body. The target can use a single action, which has the concentrate trait, to move their astral body an amount equal to their Speed. When the target stops taking persistent mental damage from this ability, the astral body snaps back to the physical body, ending the effect. If a target is carrying silver, then the first time this ability is used on them, the ability fails and any silver they're carrying larger than a coin tarnishes-while this doesn't outright destroy items like weapons or thaumaturge implements, it does prevent them from protecting against this ability more than once."}, {"name": "Sever Astral Threads", "type": "action", "traits": [], "cost": 2, "text": "The Weaver uses a claw to cut the silver cord connecting a creature's astral and physical bodies. This deals 16d6 mental damage to any target affected by Separate Astral Body whose physical or astral body is within 10 feet of the Weaver (DC 37 basic Will). After being targeted by this ability, the astral body slams violently back into the target's physical body, causing the target's vision to swim and blinding them until the start of their next turn unless they critically succeeded at their saving throw."}, {"name": "Stalker in Dreams", "type": "free", "traits": ["teleportation"], "text": "Trigger The Weaver becomes Concealed to all creatures within 60 feet or is not observed by any creatures within 60 feet%rEffect The Weaver's presence in the Universe is connected to others' perception of him, and when that perception falters, he can skitter to a new location. The Weaver teleports to an unoccupied space within 60 feet not within line of sight of any creatures within 60 feet. If the Weaver became concealed or unobserved as part of a movement action he was taking, he can resume its movement after teleporting. A creature who Averts its Gaze from the Weaver is not observing him."}, {"name": "String Astral Body", "type": "action", "traits": [], "cost": 1, "text": "The Weaver attaches strings to a creature's astral body to move it. He forcefully moves an exposed astral body within reach of his astral silk Strike up to 20 feet, with no saving throw."}]
