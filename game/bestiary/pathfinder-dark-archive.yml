  strikes: [{"name": "Bite", "bonus": 20, "damage": [["2d10+10", "piercing", null]], "traits": ["reach-15"], "effects": ["Grab"]}, {"name": "Root", "bonus": 20, "damage": [["2d8+10", "bludgeoning", null]], "traits": ["agile", "reach-15"]}]
  actions: [{"name": "Fast Healing 10", "type": "passive", "traits": [], "text": "A monster with this ability regains the given number of Hit Points each round at the beginning of its turn.", "rules": [{"key": "FastHealing", "type": "fast-healing", "value": 10}]}, {"name": "Pod Prison", "type": "free", "traits": [], "text": "Requirements A creature is swallowed by the moonflower%rEffect The moonflower wraps the swallowed creature in a cocoon and extrudes it into an adjacent square. The creature continues to be Swallowed Whole and takes half damage from any damage dealt to the cocoon. Once the cocoon is Ruptured, it deflates and decays."}, {"name": "Pod Spawn", "type": "passive", "traits": [], "text": "If a Small or larger creature dies within a pod prison, the pod transforms into an adult moonflower with full Hit Points after 1d4 hours of growth. The dead creature's equipment remains inside the new moonflower and can be retrieved if the moonflower is slain."}, {"name": "Spray Blossoms", "type": "action", "traits": ["mental", "plant", "poison"], "cost": 2, "text": "The moonflower expels mind-warping petals in a 30-foot cone. Creatures in the area take 4d6 mental, 4d6 poison damage (DC 26 basic Will save). A creature that fails is Stupefied 2 for 1 minute, and Confused for 1 round if it got a critical failure. The moonflower can't Spray Blossoms again for 1d4 rounds."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Large, (2d10+10) bludgeoning, 2d6 acid, Rupture 21%rThe monster attempts to swallow a creature of the listed size or smaller that it has grabbed or restrained in its jaws or mouth. If a swallowed creature is of the maximum size listed, the monster can't use Swallow Whole again. If the creature is smaller than the maximum, the monster can usually swallow more creatures; the GM determines the maximum. The monster attempts an Athletics check opposed by the grabbed creature's Reflex DC. If it succeeds, it swallows the creature. The monster's mouth or jaws no longer grab a creature it has swallowed, so the monster is free to use them to Strike or Grab once again. The monster can't attack creatures it has swallowed.%rA swallowed creature is Grabbed, is Slowed 1, and has to hold its breath or start suffocating. The swallowed creature takes the listed amount of damage when first swallowed and at the end of each of its turns while it's swallowed. If the victim Escapes this ability's grabbed condition, it exits through the monster's mouth. This frees any other creature grabbed in the monster's mouth or jaws. A swallowed creature can attack the monster that has swallowed it, but only with unarmed attacks or with weapons of light Bulk or less. The swallowing creature is Off-Guard against the attack. If the monster takes piercing or slashing damage equaling or exceeding the listed Rupture value from a single attack or spell, the swallowed creature cuts itself free. A creature that gets free by either Escaping or cutting itself free can immediately breathe and exits the swallowing monster's space.%rEffect: Engulf and Swallow Whole%rIf the monster dies, a swallowed creature can be freed by creatures adjacent to the corpse if they spend a combined total of 3 actions cutting the monster open with a weapon or unarmed attack that deals piercing or slashing damage."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1, "text": "Requirements The monster's last action was a successful Strike that lists Grab in its damage entry, or the monster has a creature Grabbed or Restrained%rEffect If used after a Strike, the monster attempts to grapple the creature using the body part it attacked with. This attempt neither applies nor counts toward the creature's multiple attack penalty.%rThe monster can instead use Grab and choose one creature it's grabbing or restraining with an appendage that has Grab to automatically extend that condition to the end of the monster's next turn."}]
