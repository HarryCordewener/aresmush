  strikes: [{"name": "Silver Scissors", "bonus": 30, "damage": [["3d6+12", "slashing", null]], "traits": ["agile", "backstabber", "fatal-d12", "finesse"]}]
  actions: [{"name": "Compulsive Counting", "type": "passive", "traits": [], "text": "When numerous small items are scattered before the kuchisake-onna, they compulsively begins to count them. The kuchisake-onna becomes Off-Guard to all creatures for 1d4 rounds."}, {"name": "Am I Pretty?", "type": "action", "traits": [], "cost": 1, "text": "The kuchisake-onna asks a single adjacent target, \"Am I pretty?\" The target must attempt a DC 35 Will save. If it fails, it is Immobilized for 1 round, and if it critically fails, it is Paralyzed for 1 round, though still able to respond to the question; this is a mental effect.%rIf the target responds \"No\", the kuchisake-onna makes two silver scissors Strikes against the target. If the target responds \"Yes\", the kuchisake-onna makes no Strikes this turn and must use Even Now? as their next action (waiting until the first action of their next turn, if necessary). If the target otherwise responds in a confusing or noncommittal manner, the kuchisake-onna becomes Off-Guard to all creatures for 1 round but can otherwise act normally."}, {"name": "Even Now?", "type": "action", "traits": [], "cost": 1, "text": "Requirements An adjacent creature previously targeted by Am I Pretty? answered \"Yes\"%rEffect The kuchisake-onna takes off their mask, revealing their slit face and asking, \"Even now?\" The target must attempt a DC 35 Will save.%rIf it fails, it is Immobilized for 1 round, and if it critically fails, it is Paralyzed for 1 round, though still able to respond to the question; this is a mental effect.%rWhether the target responds \"Yes\" or \"No\", the kuchisake-onna makes two silver scissors Strikes against the target."}, {"name": "Lingering Enmity", "type": "passive", "traits": [], "text": "The kuchisake-onna's silver scissors Strikes are manifestations of the toxic malice that created them and vanish when the kuchisake-onna is destroyed.%rWhen the kuchisake-onna has less than half their maximum Hit Points remaining, this concentrated enmity begins to leak out and make their attacks more vicious. Their silver scissors Strikes deal 6d6 persistent bleed damage.%rNote: Due to a later published errata this persistent damage is doubled on a critical hit. Due to the high damage potential for this creature's level that interaction may not be intended.", "rules": [{"key": "DamageDice", "selector": "silver-scissors-damage", "diceNumber": 6, "dieSize": "d6", "damageType": "bleed", "predicate": [{"lt": ["hp-percent", 50]}]}]}, {"name": "Rend", "type": "action", "traits": [], "cost": 1, "text": "Silver Scissors%rA Rend entry lists a Strike the monster has.%rRequirements The monster hit the same enemy with two consecutive Strikes of the listed type in the same round.%rEffect The monster automatically deals that Strike's damage again to the enemy."}]
