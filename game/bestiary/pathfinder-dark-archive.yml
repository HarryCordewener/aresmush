  speeds: {"land": 25}
  hp_details: "destabilized form"
  skills: {"Acrobatics": 28, "Arcana": 25, "Athletics": 25, "Nature": 25, "Occultism": 25, "Religion": 25, "Esoteric Lore": 30}
  strikes: [{"name": "Rope Dart", "bonus": 29, "damage": [["4d4 + 13", "piercing", null], ["2d6", "mental", null]], "traits": ["disarm", "finesse", "magical", "sweep", "tethered", "trip"]}, {"name": "Rope Dart", "bonus": 29, "damage": [["4d4 + 13", "piercing", null], ["2d6", "mental", null]], "traits": ["disarm", "finesse", "magical", "sweep", "tethered", "thrown-80", "trip"]}]
  actions: [{"name": "Destabilized Form", "type": "passive", "traits": [], "text": "When the Echo has fewer than 140 Hit Points, his form destabilizes, large chunks disintegrating from his face, limbs, and torso. White moths constantly stream from the missing spaces, creating a 10-foot that deals 6d6 mental|options:area-damage damage with a DC 34 Will.%rAs long as the aura persists, he can dissolve into moths and re-form at another location within 15 feet as a free action at the beginning of each of his turns; this has the occult and teleportation traits."}, {"name": "Reactive Strike (Special)", "type": "reaction", "traits": [], "text": "The Echo has reach 15 for the purpose of determining when Reactive Strike triggers and when making Reactive Strikes."}, {"name": "Astral Spindel Implement", "type": "passive", "traits": [], "text": "The Echo carries a drop spindle that constantly spins red astral thread, which is both his thaumaturgic implement and weapon. If his rope dart is lost or broken, he can re-form it with an Interact action. If he critically succeeds at a rope dart Strike, overwhelming thoughts and figments flow down the thread into the target's mind. The target becomes Confused for 1 round."}, {"name": "Astral Thread Control", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rRequirements The Echo's previous action was a successful thrown rope dart Strike%rEffect The Echo flicks his wrist and makes a follow-up thrown rope dart Strike at a different target within 30 feet of the first target, using the same multiple attack penalty as his previous Strike. Regardless of whether his attack hits, he then retrieves the weapon."}, {"name": "Contingency Oathday-Nine-Rova", "type": "free", "traits": [], "text": "Frequency once per day%rTrigger The Echo's turn begins and he's stunned, slowed, Confused, Controlled, Immobilized, Grabbed, Paralyzed, Restrained, or otherwise can't act%rEffect The Echo has set up numerous contingencies in the event he's compromised. Talismans on his body shatter, counteracting the triggering effect. The Echo can use this free action even if he can't act."}, {"name": "Reconstitute from Thought", "type": "action", "traits": ["healing"], "cost": 1, "text": "Requirements The Echo is standing on one of the eight large islands of the map, and the island hasn't darkened%rEffect The Echo throws his rope dart into the island and uses it to absorb mental essence from the mindscape, repairing himself. He regains 45 healing Hit Points and the island turns a desaturated gray for 1 day, preventing future absorption and disabling the Call of the Void hazard on that island."}, {"name": "Spindle's Web", "type": "action", "traits": [], "cost": 2, "text": "The Echo's spindle revolves faster and faster until it's a blur, lashing red threads in every direction. The threads deal 7d6 slashing damage and 7d6 mental damage to all creatures in a 30-foot, with a DC 34 Reflex. If a creature fails its save, the threads awaken the mindscape anchor within it, affecting it differently based on which anchor that creature used to gain access to the center of the mindscape. (If there is a PC who didn't absorb a mindscape anchor, for instance because there are…"}]
