  ac: 36
  hp: 280
  perception: 30
  saves: {"fortitude": 23, "reflex": 24, "will": 28}
  abilities: {"cha": 8, "con": 4, "dex": 5, "int": 5, "str": 4, "wis": 5}
  speeds: {"land": 25}
  hp_details: "destabilized form"
  skills: {"Acrobatics": 28, "Arcana": 25, "Athletics": 25, "Nature": 25, "Occultism": 25, "Religion": 25, "Esoteric Lore": 30}
  strikes: [{"name": "Rope Dart", "bonus": 29, "damage": [["4d4 + 13", "piercing", null], ["2d6", "mental", null]], "traits": ["disarm", "finesse", "magical", "sweep", "tethered", "trip"]}, {"name": "Rope Dart", "bonus": 29, "damage": [["4d4 + 13", "piercing", null], ["2d6", "mental", null]], "traits": ["disarm", "finesse", "magical", "sweep", "tethered", "thrown-80", "trip"]}]
  actions: [{"name": "Destabilized Form", "type": "passive", "traits": [], "text": "When the Echo has fewer than 140 Hit Points, his form destabilizes, large chunks disintegrating from his face, limbs, and torso. White moths constantly stream from the missing spaces, creating a 10-foot emanation that deals 6d6 mental damage with a DC 34 basic Will.%rAs long as the aura persists, he can dissolve into moths and re-form at another location within 15 feet as a free action at the beginning of each of his turns; this has the occult and teleportation traits.", "rules": [{"key": "Aura", "radius": 15, "slug": "destabilized-form", "predicate": [{"lt": ["hp-remaining", 140]}]}]}, {"name": "Reactive Strike (Special)", "type": "reaction", "traits": [], "text": "The Echo has reach 15 for the purpose of determining when Reactive Strike triggers and when making Reactive Strikes.%rTrigger A creature within the monster's reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.%rEffect The monster attempts a melee Strike against the triggering creature. If the attack is a critical hit and the trigger was a manipulate action, the monster disrupts that action. This Strike doesn't count toward the monster's multiple attack penalty, and its multiple attack penalty doesn't apply to this Strike."}, {"name": "Astral Spindel Implement", "type": "passive", "traits": [], "text": "The Echo carries a drop spindle that constantly spins red astral thread, which is both his thaumaturgic implement and weapon. If his rope dart is lost or broken, he can re-form it with an Interact action. If he critically succeeds at a rope dart Strike, overwhelming thoughts and figments flow down the thread into the target's mind. The target becomes Confused for 1 round.", "rules": [{"key": "Note", "selector": "rope-dart-attack", "outcome": ["criticalSuccess"], "title": "{item|name}", "text": "If he critically succeeds at a rope dart Strike, overwhelming thoughts and figments flow down the thread into the target's mind. The target becomes Confused for 1 round."}]}, {"name": "Astral Thread Control", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per round%rRequirements The Echo's previous action was a successful thrown rope dart Strike%rEffect The Echo flicks his wrist and makes a follow-up thrown rope dart Strike at a different target within 30 feet of the first target, using the same multiple attack penalty as his previous Strike. Regardless of whether his attack hits, he then retrieves the weapon."}, {"name": "Contingency Oathday-Nine-Rova", "type": "free", "traits": [], "text": "Frequency once per day%rTrigger The Echo's turn begins and he's stunned, slowed, Confused, Controlled, Immobilized, Grabbed, Paralyzed, Restrained, or otherwise can't act%rEffect The Echo has set up numerous contingencies in the event he's compromised. Talismans on his body shatter, counteracting the triggering effect. The Echo can use this free action even if he can't act."}, {"name": "Reconstitute from Thought", "type": "action", "traits": ["healing"], "cost": 1, "text": "Requirements The Echo is standing on one of the eight large islands of the map, and the island hasn't darkened%rEffect The Echo throws his rope dart into the island and uses it to absorb mental essence from the mindscape, repairing himself. He regains 45 healing Hit Points and the island turns a desaturated gray for 1 day, preventing future absorption and disabling the Call of the Void hazard on that island."}, {"name": "Spindle's Web", "type": "action", "traits": [], "cost": 2, "text": "The Echo's spindle revolves faster and faster until it's a blur, lashing red threads in every direction. The threads deal 7d6 slashing damage and 7d6 mental damage to all creatures in a 30-foot emanation, with a DC 34 basic Reflex. If a creature fails its save, the threads awaken the mindscape anchor within it, affecting it differently based on which anchor that creature used to gain access to the center of the mindscape. (If there is a PC who didn't absorb a mindscape anchor, for instance because there are more than four PCs in the party, then use the anchor of the PC closest to them.)%rThe Echo then can't use Spindle's Web for 1d4 rounds.%rLantern The lantern outlines the creature with searing Revealing Light that deals 2d6 persistent fire damage. Mirror The mirror reflects the creature to another location, teleporting them to a clear space within 25 feet of their current location. Chalice The chalice drains life force, granting the Echo temporary HP equal to half the damage dealt. Tome The tome floods the creature's mind with information; the target is Slowed 1 for 1 round."}]
