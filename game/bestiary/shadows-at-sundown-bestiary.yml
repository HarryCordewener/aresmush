  actions: [{"name": "Thoughtsense (Imprecise) 60 feet", "type": "passive", "traits": []}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Reconstruct Spell", "type": "reaction", "traits": ["mental", "occult"], "text": "Trigger A creature within 30 feet attempts and fails to Cast a Spell while stupefied%rEffect The loreavor gains use of the failed spell as an occult innate spell. It can cast that spell once; if the spell is of a higher level than half the loreavor's level (5th level or higher for most loreavors), the loreavor must succeed at a flat check with a DC equal to 5 + the rank of the spell it is attempting to cast; on a failure, the spell fails, and the loreavor becomes Stupefied 1 for 1 minute. If…"}, {"name": "Redact", "type": "passive", "traits": ["occult"], "text": "By spending an hour in contact with a non-magical document or piece of artwork no larger than 1 Bulk, a loreavor can consume either a few words from the text or render the artistry of the work more mundane. Doing so heals the loreavor of 4d8 healing HP. Words fade from the text, leaving an obvious blank space behind, while artwork is reduced in worth by 10% of its original value. A loreavor can consume incidental text in this manner from a spellbook but cannot consume actual spells recorded in…"}, {"name": "Search Memory", "type": "passive", "traits": ["mental", "occult"], "text": "When the loreavor damages a creature with its touch Strike, the creature must succeed at a DC 28 Will save or become Stupefied 1, or Stupefied 2 on a critical failure."}]
