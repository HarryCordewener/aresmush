  actions: [{"name": "Fast Healing 15", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Domain of Dusk", "type": "action", "traits": ["divine", "shadow"], "cost": 2, "text": "With a wave of its hand, the strigoi calls fourth vile ruination from the surrounding shadows, causing coils of darkness and shadowy bats, rats, and wolves to lash out at living targets in a 30-foot. Living creatures in this area take 8d6 void|options:area-damage damage (DC 34 Fortitude save against the DC of the strigoi's level). A creature that fails this save is also Dazzled for 1 round (or Blinded for 1 round and then dazzled for 1 round)"}, {"name": "Shadow Escape", "type": "free", "traits": [], "text": "Trigger The strigoi is reduced to 0 HP%rEffect The strigoi uses Shadow Form. It can take move actions to move toward its coffin even though it's at 0 HP. While at 0 HP in this form, the strigoi is unaffected by further damage. Once the strigoi reaches its coffin, or if it hasn't done so within 2 hours, it automatically returns to its physical form, Unconscious."}, {"name": "Shadow Form", "type": "action", "traits": ["concentrate", "divine", "shadow"], "cost": 1, "text": "The strigoi reverts to pure shadow and absorbs its body and its gear into the darkness, or it shifts back to its physical form. In shadow form, the strigoi gains a climb Speed equal to its land Speed and can move through any gap that isn't airtight. However, it can only move along solid surfaces that aren't highly reflective, not liquid or mirrored surfaces. If the surface it's on is destroyed, the strigoi returns to physical form and is Stunned 1. The strigoi loses fast healing while in shadow…"}, {"name": "Slip Into Shadows", "type": "reaction", "traits": ["divine"], "text": "Trigger Aliriel succeeds at a save against an effect that is not a darkness or light effect%rEffect Aliriel disappears into shadows at the last moment, critically succeeding at the save instead."}, {"name": "Strigoi Weaknesses", "type": "passive", "traits": [], "text": "All strigoi possess the following weaknesses:%rRevulsion Strigoi are uncomfortable near mirrors or sources of bright light. Only a strigoi's shadow reflects in a mirror, and this often compels them to cover or destroy mirrors in their presence rather than risk their true nature being displayed. A strigoi can't voluntarily come within 10 feet of a brandished mirror or source of bright light. To brandish a mirror or light source, a creature must Interact to do so for 1 round (similar to Raising a…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Create Servitor", "type": "passive", "traits": ["divine", "downtime"], "text": "If a creature dies after being reduced to 0 HP by Drink Essence or Domain of Dusk, the vampire can turn this victim into a vampire by donating some of its own blood to the victim and burying the victim in earth for 3 nights.%rIf the new vampire is lower level than its creator, it is under the creator's control. If a vampire controls too many spawn at once (as determined by the GM), strong-willed spawn can free themselves by succeeding at a Will saving throw against the vampire's Will DC.%rA…"}, {"name": "Dominate", "type": "action", "traits": ["divine", "incapacitation", "mental", "visual"], "cost": 2, "text": "The vampire can cast Dominate at will as a divine innate spell. Casting it requires staring into the target's eyes, giving the spell the visual trait (DC 34 Will). A creature that succeeds is temporarily immune to that vampire's Dominate for 24 hours.%rFully destroying the vampire ends the domination, but merely reducing the vampire to 0 HP is insufficient to break the spell."}, {"name": "Drink Essence", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within Aliriel's reach%rEffect Aliriel sinks her fangs into the targeted creature to drink its blood and draw out its vital essence. This requires an Athletics check against the creature's Fortitude DC if the creature is grabbed and is automatic for any of the other conditions. The creature becomes Drained 2 and Stupefied 2, and Aliriel regains 21 healing HP, gaining any excess HP as temporary Hit Points.…"}, {"name": "Thassilonian Necromancer", "type": "passive", "traits": [], "text": "Aliriel cannot cast abjuration or enchantment spells."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
