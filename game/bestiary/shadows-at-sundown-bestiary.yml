  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Escape From Hell", "type": "passive", "traits": ["auditory", "divine", "emotion", "fear", "mental"], "text": "When Ileosa's shell is reduced to 0 HP, the hollow corpse immediately melts into a pool of blood, at the center of which lies her still-beating heart. A moment later, a crimson ghostly shape-Queen Ileosa's soul-rises from the heart. After the soul shrieks in relief at escaping from Hell, it rises through the ceiling and vanishes while the heart dies and rots. All creatures within 30 feet of the shell when this occurs must attempt a DC 30 Will save.%rCritical Success A living creature becomes…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Blood Feast", "type": "passive", "traits": [], "text": "When a creature takes damage from a fangs Strike, the creature must succeed at a DC 33 Fortitude save or become Enfeebled 1 (enfeebled 1 and Drained 1 on a critical failure). The shell becomes Quickened for 1 round, and can use the extra action only for fangs Strike actions against a creature that is taking persistent bleed damage. Further damage dealt by the shell increases the enfeebled condition by 1 on a failed save, to a maximum of enfeebled 4."}]
