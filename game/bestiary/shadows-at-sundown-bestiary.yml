  actions: [{"name": "False Faith", "type": "passive", "traits": [], "text": "Abridan is an ex-cleric. While he's lost the magical abilities that come from his connection to Pharasma, he can still use the major staff of healing or any of his scrolls by tricking the item. Since he can't cast spells, he can't recharge his staff, and uses its remaining charges only as a last resort."}, {"name": "Marked by Urgathoa", "type": "free", "traits": ["divine", "evil"], "text": "Trigger Abridan dies before he's had a chance to atone for his blasphemies or has become an actual cleric of Urgathoa%rEffect Urgathoa watched Abridan's fall from grace, and if he dies before he finishes his conversion, her disappointment causes his body to decay as if he had been dead for a week. This process also causes all living creatures within 30 feet to take 11d6 void|options:area-damage damage (DC 33 Fortitude). If steps are not thereafter taken to prevent his soul from returning (such…"}, {"name": "Trick Item", "type": "action", "traits": ["manipulate"], "cost": 1, "text": "Abridan attempts to trick his staff or a scroll by attempting a Religion check against the item's Trick DC.%rSuccess For the rest of his turn, Abridan can spend actions to activate the staff or scroll as if he could normally use it.%rFailure Abridan can't use the item or try to trick it again this turn, but can try again on subsequent turns.%rCritical Failure Abridan can't use the item, and can't try to trick it again until his next daily preparation at sunrise.%rThe trick DCs for Abridan's…"}]
