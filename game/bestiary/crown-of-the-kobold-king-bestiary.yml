  actions: [{"name": "Final Spite", "type": "reaction", "traits": [], "text": "Trigger The wight is reduced to 0 Hit Points.%rEffect The wight makes a Strike before being destroyed. It doesn't gain any temporary HP from drain life on this Strike."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Life", "type": "passive", "traits": ["divine"], "text": "When the wight damages a living creature with its claw Strike, the wight gains 3 temporary Hit Points and the creature must succeed at a DC 25 Fortitude save or become Drained 1. Further damage dealt by the wraith increases the amount of drain by 1 on a failed save to a maximum of drained 4.%rEffect: Drain Life"}, {"name": "Raise Bone Wall", "type": "action", "traits": ["divine"], "cost": 2, "text": "Frequency once per day%rRequirements Drazmorg is in the Lower Vault of Droskar's Crucible%rEffect Drazmorg draws upon the necromantic energy that infuses the area and causes a tangled wall of bones to rise from the ground. The wall is 5 feet thick, 10 feet wide, and 10 feet tall; once created, it's permanent until Drazmorg uses this ability again, whereupon a previously created bone wall (such as the one at area G2 ) crumbles. The bone wall has AC 10, Hardness 10, and 25 Hit Points. It's immune…"}, {"name": "Wight Spawn", "type": "passive", "traits": ["divine"], "text": "A living humanoid slain by a wight's claw Strike rises as a Wight Spawn after 1d4 rounds. This wight spawn is under the command of the wight that killed it. It doesn't have Drain Life or Wight Spawn and becomes Clumsy 2 for as long as it is a wight spawn. If the creator of the wight spawn dies, the wight spawn becomes a full-fledged, autonomous wight; it regains its free will, gains Drain Life and Wight Spawn, and is no longer clumsy."}]
