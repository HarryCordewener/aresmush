  actions: [{"name": "Fast Healing 5", "type": "passive", "traits": []}, {"name": "Coffin Restoration", "type": "passive", "traits": ["divine", "void"], "text": "Unlike other undead, a vampire isn't destroyed at 0 HP. Instead, it falls Unconscious. If its body rests in its coffin for 1 hour, the vampire gains 1 HP, after which its fast healing begins to function normally."}, {"name": "Vampire Weaknesses", "type": "passive", "traits": [], "text": "All vampires possess the following weaknesses.%rCompulsions Vampires are creatures of strange and unknowable compulsions. A typical vampire can't voluntarily cross running water unless it is transported while it hides within its coffin, nor can it enter a private dwelling unless invited in by someone with the authority to do so. At your discretion, vampires might have different compulsions-a pirate vampire might not be able to set foot on solid ground without being invited, for example. The…"}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drink Blood", "type": "action", "traits": ["divine"], "cost": 1, "text": "Requirements A Grabbed, Paralyzed, Restrained, Unconscious, or willing creature is within the vampire's reach.%rEffect The vampire sinks its fangs into that creature to drink its blood. This requires an Athletics check against the victim's Fortitude DC if the victim is grabbed and is automatic for any of the other conditions.%rThe victim is Drained 1 and the vampire regains 5 healing Hit Points, gaining any excess HP as temporary Hit Points. Drinking Blood from a creature that's already drained…"}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "The vampire spawn deals 1d6 extra precision damage to Off-Guard creatures."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
