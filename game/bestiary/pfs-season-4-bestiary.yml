  actions: [{"name": "Coven", "type": "passive", "traits": [], "text": "A grave hag adds Harm, Mimic Undead, and the Call Spirit ritual to her coven's spells."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Sacrifice Ally", "type": "reaction", "traits": [], "text": "Trigger The grave hag is adjacent to an ally when the hag is targeted by an attack or an effect that requires a Reflex saving throw%rEffect The triggering effect is redirected to target the ally."}, {"name": "Curse of the Grave", "type": "action", "traits": ["curse", "occult"], "cost": 3, "text": "The grave hag names a single creature within 30 feet; that creature must succeed at a DC 30 Will save or be afflicted with a grave curse equal to the hag's level. The curse lasts until the hag chooses to end it or is slain, rather than by returning items. Regardless of the save result, the target is then temporarily immune to the hag's grave curse for 24 hours.%rEffect You are hounded by undead creatures of the same level as the curse. Every night, you must attempt a DC 15 Flat check. On a…"}, {"name": "Grave Impressions", "type": "action", "traits": ["incapacitation", "occult"], "cost": 2, "text": "The hag targets a living creature within 30 feet and overwhelms it with feelings of entombment. The target attempts a DC 30 Fortitude save and is then temporarily immune to the hag's Grave Impressions for 24 hours.%rCritical Success The target is unaffected.%rSuccess The target is Paralyzed for 1 round.%rFailure The target is Unconscious.%rCritical Failure The target is unconscious and can't awaken for 1 hour."}, {"name": "Grave's Grip", "type": "passive", "traits": [], "text": "Creatures Grabbed or Restrained by the grave hag take a -1 circumstance penalty to saving throws against the grave hag's spells and abilities."}, {"name": "Undead Mien", "type": "passive", "traits": [], "text": "A grave hag appears as an undead creature to magical effects."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
