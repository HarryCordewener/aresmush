 fly speed of 60 feet. Aslynn can see through this eye and move it in any direction using a single action."}, {"name": "Nightmarish Wounds", "type": "passive", "traits": ["occult"], "text": "Wounds caused by Aslynn's claws cause creatures to dwell on their worst nightmares. A creature damaged by Aslynn's claw must succeed at a DC 25 Fortitude save or be Stupefied 1 for 1 day. On a critical failure, or if it gets hit again and fails its save a second time, it's Stupefied 2 for 1 day."}, {"name": "Spell Ambush", "type": "passive", "traits": [], "text": "A creature Off-Guard to the night hag takes a -2 circumstance penalty to checks and DCs to defend against her spells."}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 28, "attack": 20, "spells": {"0": ["Detect Magic (Constant 3rd)"], "1": ["Ray of Enfeeblement (At Will)", "Sleep (At Will)"], "2": ["Invisibility (At Will)"], "3": ["Dream Message (At Will)", "Magic Missile (At Will)", "Mind Reading (At Will) (Heartstone)"], "5": ["Nightmare"], "6": ["Phantasmal Calamity", "Scrying"], "8": ["Dream Council"], "9": ["Bind Soul (At Will) (Heartstone)", "Ethereal Jaunt (At Will) (Heartstone)"]}}]
