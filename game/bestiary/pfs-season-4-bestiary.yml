  actions: [{"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Rejection Vulnerability", "type": "passive", "traits": [], "text": "As succubi are beings of pure lust, creatures that reject their lust can metaphysically harm them. When a succubus fails a Diplomacy check to Embrace or Request, or when a creature succeeds at its save against a succubus's mental spell or ability, the succubus takes 2d6 mental damage. For one hour after causing mental damage to a succubus in this way, a creature can deal 2d6 mental damage to the succubus with a successful Demoralize incorporating its rejection."}, {"name": "Seductive Presence", "type": "passive", "traits": ["aura", "emotion", "mental"], "text": "10 feet. Any creature in the aura that could be sexually attracted to a succubus takes a -2 circumstance penalty to checks and DCs to oppose the succubus's mental spells, Deception, and Diplomacy."}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The succubus can take on the appearance of any Small or Medium humanoid. This doesn't change their Speed or their attack and damage modifiers with their Strikes, but it might change the damage type their Strikes deal (typically to bludgeoning)."}, {"name": "Embrace", "type": "action", "traits": ["attack"], "cost": 1, "text": "The succubus attempts to grapple skill=diplomacy a creature using their Diplomacy bonus instead of Athletics. If the creature is willing, the succubus grapples it automatically."}, {"name": "Passionate Kiss", "type": "action", "traits": ["divine", "emotion", "mental"], "cost": 1, "text": "Frequency Once per round.%rEffect The succubus engages a creature they have Grabbed in an embrace or other act of passion to drain its vital essence. The kiss makes the creature Drained 1 or increases its drained condition by 1, to a maximum of 4. The creature takes 2d6 void damage and the succubus regains Hit Points equal to the damage dealt. The target must succeed at a DC 22 Will save or be affected by a Suggestion to submit to more actions of passion rather than trying to Escape."}, {"name": "Profane Gift", "type": "action", "traits": ["divine", "mental"], "cost": 3, "text": "Frequency once per day.%rEffect The succubus on can give a willing humanoid a profane gift. That creature gains a +1 status bonus to attack rolls, skill checks, and saving throws. As long as the gift persists, the succubus can communicate telepathically with the target at any distance, see through the creature's senses, and target the creature with Suggestion through the telepathic link. In addition, the creature uses an outcome one degree of success worse than it rolls on saving throws against…"}]
