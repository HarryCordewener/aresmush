d bite is subjected to an effect of the etheroot's choice from the following (DC 25 Will save; duration 1 minute unless otherwise stated):%rDespair : Target must attempt a Will save as if subjected to the Wave of Despair spell. Fear : Target must…"}, {"name": "Tentacle Flurry", "type": "action", "traits": [], "cost": 1, "text": "The potted violet etheroot makes two Strikes with two different tentacles, each limb targeting a different creature. This counts as two attacks toward the etheroot's multiple attack penalty for further actions, but the penalty doesn't increase until after both attacks are made."}, {"name": "Knockdown", "type": "action", "traits": [], "cost": 1}]
