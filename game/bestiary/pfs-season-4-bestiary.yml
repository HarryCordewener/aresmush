  actions: [{"name": "Coven", "type": "passive", "traits": ["mental", "occult"], "text": "A winter hag adds Cone of Cold, Solid Fog, and Wall of Ice to her coven's spells."}, {"name": "Snow Vision", "type": "passive", "traits": [], "text": "Snow doesn't impair a winter hag's vision; she ignores Concealment from snowfall."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "Craft Ice Staff", "type": "passive", "traits": ["cold", "downtime", "occult"], "text": "A winter hag can spend 1 day performing a specific ritual to create a +1 Striking Staff of black ice. Once per day, she can use the staff to cast Cone of Cold. The staff's magic functions only in the hands of the hag who created it; for anyone else, it is a mundane staff. If the hag dies or if the staff remains in another creature's possession for 24 hours, the staff melts into a puddle of foul-smelling water."}, {"name": "Ice Climb", "type": "passive", "traits": [], "text": "A winter hag can Climb at the listed Speed, but only on ice. She ignores difficult terrain from ice and snow, and she doesn't risk falling when crossing ice."}]
