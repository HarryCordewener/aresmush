ge 5 as stage 4 (1 day)%rStage 6 dead, and rises as a Ghast the next midnight"}, {"name": "Paralysis", "type": "passive", "traits": ["incapacitation", "occult"], "text": "Any living creature hit by a ghast's attack must succeed at a DC 34 Fortitude save or become Paralyzed. It can attempt a new save at the end of each of its turns, and the DC cumulatively decreases by 1 on each such save."}, {"name": "Scoundrel", "type": "passive", "traits": [], "text": "When Falrok successfully Feints, the target is Off-Guard against melee attacks he attempts against it until the end of his next turn. On a critical success, the target is off-guard against all melee attacks until the end of their next turn, not just Falrok's."}, {"name": "Sneak Attack", "type": "passive", "traits": [], "text": "Falrok deal 4d6 extra precision damage to Off-Guard creatures."}, {"name": "Swift Leap", "type": "action", "traits": ["move"], "cost": 1, "text": "Falrok jumps up to half his Speed. This movement doesn't trigger reactions."}]
