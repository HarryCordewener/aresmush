  actions: [{"name": "Drain Bonded Item", "type": "free", "traits": [], "text": "Frequency once per day%rRequirements Barushak hasn't acted yet on this turn.%rEffect This turn, Barushak can cast one prepared spell he has already cast today without spending a spell slot. He must still Cast the Spell and meet the spell's other requirements."}, {"name": "Efficient Capture", "type": "action", "traits": ["attack", "manipulate"], "cost": 3, "text": "Requirements Barushak has manacles in hand and is adjacent to a creature.%rEffect Barushak attempts to bind the creature's wrists or ankles with the manacles. He must succeed at an attack roll with a +21 modifier against the target's AC."}, {"name": "Fiend Summoner", "type": "passive", "traits": [], "text": "Barushak can cast Summon Fiend spells as arcane spells. Each time he does so, sinister energies flow through his body, causing his eyes to glow red and making him Quickened for 3 rounds. He can use the extra action only to Sustain the Spell."}, {"name": "Superlative Summoner", "type": "passive", "traits": [], "text": "If another creature's reaction would disrupt Barushak's spellcasting action, Barushak attempts a DC 15 Flat check. If he succeeds, his action isn't disrupted."}]
