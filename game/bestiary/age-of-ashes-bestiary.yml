  actions: [{"name": "Torpor", "type": "passive", "traits": [], "text": "Typically, a demilich is inert when encountered and doesn't take actions until its Contingency reaction has been triggered."}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Contingency", "type": "reaction", "traits": [], "text": "Teyam has one permanent 8th-rank Contingency spell in effect with one of its arcane innate spells of 5th level or lower as the companion spell- typically Translocate.%rTrigger While Teyam is in torpor, a creature disturbs Teyam's remains, touches her treasure, or casts a spell that would affect Teyam.%rEffect Teyam ends torpor, rolls initiative, and gains the effect of her contingency's companion spell. The contingency resets after 24 hours."}, {"name": "Countermeasures", "type": "free", "traits": [], "text": "Trigger Teyam's turn begins.%rEffect Teyam casts Flicker, Fly, Spell Turning, or Truesight on itself. It usually chooses spell turning unless it already has that spell in effect."}, {"name": "Telekinetic Whirlwind", "type": "passive", "traits": ["arcane", "aura"], "text": "20 feet. Telekinetic whirlwind activates when Teyam ends torpor. Loose debris in the area whip up into a whirling storm. This obscures vision, making any creature in the area concealed, and causes creatures in its area (except Teyam) to treat all creatures as concealed. Any creature other than Teyam that enters or begins its turn in the aura takes 2d12 bludgeoning damage."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Demilich Eye Gems", "type": "passive", "traits": ["arcane"], "text": "A demilich has gemstone eyes that glow when the demilich is active. Each eye contains an 8th-rank spell that targets one creature (usually one eye has Quandary and the other Polar Ray). The demilich can Activate an eye. This uses the number of spellcasting actions the spell requires, and also requires command and envision components.%rWhen the demilich casts a spell from a gemstone eye, that eye stops glowing for 1d4 rounds, during which time that eye's spell can't be used. Occasionally, one or…"}, {"name": "Devour Soul", "type": "action", "traits": ["arcane", "void"], "cost": 1, "text": "Requirements A soul has been trapped in one of Teyam's blight quartz gems for 24 hours.%rEffect Teyam consumes the soul. The soul is utterly destroyed, and Teyam regains HP equal to double the creature's level."}, {"name": "Mental Magic", "type": "passive", "traits": [], "text": "Teyam can replace all material and somatic components for casting spells with verbal components, and can replace all Interact components for activating magic items with envision components."}, {"name": "Staff Gems", "type": "passive", "traits": [], "text": "Teyam long ago absorbed the spells from a staff into gemstone nodules embedded in her skull, with larger nodules representing higher-rank spells. She can cast any of the spells as though it were Activating the staff, and regains 1 charge per 4 hours spent in torpor, to a maximum of 10 charges. Teyam has the spells from a Staff of Power"}, {"name": "Trap Soul", "type": "action", "traits": [], "cost": 1, "text": "Frequency once per day per gem%rEffect Ten blight quartz gemstones on Teyam's skull can trap the souls of the living. The Activated gem casts Seize Soul. This bind soul can target and affect a dying creature instead of a corpse. The dying creature can attempt a DC 43 Fortitude save; if it succeeds, it doesn't die and its soul is not trapped but it's Drained 2 (or is unaffected entirely on a critical success). When the soul of a creature gets trapped, the creature's body swiftly turns to…"}]
