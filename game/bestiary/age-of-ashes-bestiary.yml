  actions: [{"name": "Enternal Damnation", "type": "passive", "traits": ["divine"], "text": "As long as its soul chain remains intact, a forge-spurned can't be truly destroyed. It rises again fully healed at the next sundown, even if its physical body was destroyed."}, {"name": "Searing Heat", "type": "passive", "traits": ["fire"], "text": "A creature that touches the forge-spurned (including Grappling it or hitting it with an unarmed attack) takes 2d6 fire damage (DC 21 Reflex save)."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Forge Breath", "type": "action", "traits": ["divine", "fire"], "cost": 2, "text": "The forge-spurned breathes a cloud of stinging soot, ash, and glowing embers. This can affect either a 30-foot or a 20-foot centered on the forge-spurned and persists for 1d4 rounds.%rEach creature that moves into or starts their turn in the area takes 6d6 fire|options:area-damage damage, with a DC 21 Reflex save. A creature that fails its save is also Blinded for 1 minute.%rCreatures within the cloud are Concealed, though not from the forge-spurned.%rThe forge-spurned can't use Forge Breath…"}, {"name": "Inflate Bellows", "type": "action", "traits": [], "cost": 2, "text": "Requirements The forge-spurned has used Forge Breath.%rEffect The forge-spurned re-inflates its flaccid lungs, enabling it to use Forge Breath again."}, {"name": "Soul Chain", "type": "passive", "traits": ["divine", "fire"], "text": "If a creature is slain by an attack from the soul chain and the forge-spurned is able to retain the creature's corpse, it can bind the creature's soul into the soul chain (as Seize Soul) with a day of work at a forge and a DC 20 Crafting check.%rAn individual whose soul is bound in this way can't be resurrected unless the soul chain is destroyed (Hardness 10, 40 HP, BT 20)."}]
