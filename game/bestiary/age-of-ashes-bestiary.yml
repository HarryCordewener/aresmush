  actions: [{"name": "Lifesense 60 feet", "type": "passive", "traits": []}, {"name": "Teleportation Attachment", "type": "reaction", "traits": ["teleportation"], "text": "Trigger A creature within 60 feet uses a teleportation effect%rEffect The aiudara wraith teleports with the creature, arriving in an empty space of its choice adjacent to the triggering creature's destination. If the triggering effect targets multiple creatures, the aiudara wraith chooses which creature it arrives beside."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Dimensional Shunt", "type": "passive", "traits": ["arcane", "teleportation"], "text": "The aiudara wraith's touch displaces creatures and flings them through space. The creature must attempt a DC 40 Fortitude save.%rCritical Success The creature is unaffected and becomes temporarily immune to dimensional shunt for 1 minute.%rSuccess The creature is pushed 5 feet in a random direction.%rFailure The creature is teleported 20 feet in a direction of the aiudara wraith's choice.%rCritical Failure As failure, but the creature is also Stunned 2."}, {"name": "Drain Life", "type": "passive", "traits": ["arcane"], "text": "When an aiudara wraith damages a living creature with its spectral hand Strike, the aiudara wraith gains 18 temporary Hit Points and the target must succeed at a DC 40 Fortitude save or become Drained 1 and Stupefied 1 as long as it is drained. Further damage dealt by the aiudara wraith's spectral hand Strikes increases the value of the drained and stupefied conditions by 1 each on a failed save, to a maximum of 10 for both.%rEffect: Drain Life"}, {"name": "Instantaneous Movement", "type": "passive", "traits": ["arcane", "teleportation"], "text": "An aiudara wraith moves by means of localized teleportation. An aiudara wraith's Stride does not have the move trait. When an aiudara wraith Strides, it reaches its destination within the range of its Speed immediately."}]
