  actions: [{"name": "Eternal Damnation", "type": "passive", "traits": ["divine"], "text": "As long as its soul chain remains intact, the accursed forge-spurned can't be truly destroyed and rises again fully healed at the next sundown, even if its physical body was destroyed."}, {"name": "Searing Heat", "type": "passive", "traits": ["fire"], "text": "A creature that touches the accursed forge-spurned (including Grappling it or hitting it with an unarmed attack) takes 4d6 fire damage (DC 33 Reflex save)."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Forge Breath", "type": "action", "traits": ["divine", "fire"], "cost": 2, "text": "The accursed forge-spurned breathes a cloud of stinging soot, ash, and glowing embers. This can affect either a 30-foot or a 20-foot centered on the accursed forge-spurned and persists for 1d4 rounds.%rCreatures that move into or start their turn in the area take 12d6 fire|options:area-damage damage (DC 36 Reflex save).%rA creature that fails its save is also Blinded for 1 minute. Creatures within the cloud are Concealed, though not from the accursed forge-spurned.%rThe accursed forge-spurned…"}, {"name": "Inflate Bellows", "type": "action", "traits": [], "cost": 2, "text": "Requirements The accursed forge-spurned has used Forge Breath.%rEffect The accursed forge-spurned re-inflates its flaccid lungs, enabling it to use Forge Breath again."}, {"name": "Soul Chain", "type": "passive", "traits": ["divine", "fire"], "text": "If a creature is slain by an attack from the soul chain and the accursed forge-spurned is able to retain the creature's corpse, it can bind the creature's soul into the soul chain (as Seize Soul) with a day of work at a forge and a DC 20 Crafting check.%rAn individual whose soul is bound in this way can't be resurrected unless the soul chain is destroyed (Hardness 10, 40 HP, BT 20)."}, {"name": "Soul Siphon", "type": "passive", "traits": ["divine"], "text": "When the accursed forge-spurned critically hits a target with its soul chain , the chain leeches away a portion of the target's soul. The target must attempt a DC 36 Fortitude save.%rCritical Success The target is unaffected.%rSuccess The target is Drained 1.%rFailure The target is Drained 2.%rCritical Failure The target is drained 2 and Stunned 2 from the pain."}]
