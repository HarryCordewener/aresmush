  actions: [{"name": "Breath Weapon", "type": "action", "traits": ["acid", "arcane"], "cost": 2, "text": "Belmazog spews a gout of acid that deals 10d6 acid|options:area-damage damage in a 30-foot (DC 28 Reflex save).%rBelmazog can't use Breath Weapon again for 1d4 rounds."}, {"name": "Drowning Drone", "type": "reaction", "traits": ["auditory", "mental", "sonic"], "text": "Trigger Belmazog or one of her allies within 60 feet attempts a saving throw against an auditory or sonic effect.%rEffect Belmazog releases a croak that drowns out other sound. She rolls a Performance check. She and boggard allies in the area can use the higher result of her Performance check or their saves to resolve the effects against the auditory or sonic effect."}, {"name": "Nul-Acrumi Vazghul Ritual", "type": "passive", "traits": [], "text": "This rare and highly specialized ritual, taught to Belmazog by the Scarlet Triad, allowed her to use the fossilized remains of Dahak to erect powerful defenses in the region in the form of dragon pillars, but the resources and time required to perform the ritual again are not available to Belmazog during the course of this adventure. As a result, and since there is no way for the PCs to learn or benefit from the ritual, further information beyond the repercussions detailed in the adventure…"}, {"name": "Swamp Stride", "type": "passive", "traits": [], "text": "Belmazog ignores difficult terrain caused by swamp terrain features."}, {"name": "Terrifying Croak", "type": "action", "traits": ["auditory", "emotion", "fear", "mental"], "cost": 1, "text": "Belmazog unleashes a terrifying croak. Any non-boggard within 30 feet becomes Frightened 1 unless they succeed at a DC 28 Will save; those who critically succeed are temporarily immune for 1 minute."}, {"name": "Tongue Grab", "type": "passive", "traits": [], "text": "If Belmazog hits a creature with her tongue, that creature becomes Grabbed by Belmazog. Unlike with a normal grab, the creature isn't Immobilized