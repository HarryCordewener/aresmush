  perception: 24
  saves: {"fortitude": 21, "reflex": 26, "will": 23}
  abilities: {"cha": 7, "con": 4, "dex": 7, "int": 3, "str": 4, "wis": 3}
  speeds: {"land": 30}
  skills: {"Deception": 26, "Diplomacy": 23, "Nature": 21, "Society": 21, "Stealth": 23, "Thievery": 26}
  immunities: ["disease", "paralyzed"]
  resistances: {"mythic": 11}
  actions: [{"name": "Recklessly Overconfident", "type": "passive", "traits": [], "text": "The Immortal Trickster knows he is immortal and takes risks that cause his failures to be particularly spectacular. Whenever the Immortal Trickster would fail at a Deception, Stealth, or Thievery check, he critically fails instead."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The creature ends one condition affecting it."}, {"name": "Trickster's Network", "type": "passive", "traits": [], "text": "The Immortal Trickster can extend his senses through any coyote, fox, or raven in the Universe, making it his sensory animal. He cannot maintain his attention through more than three sensory animals at one time. He can speak through his sensory animals, but only in a single short phrase per animal of no more than two words. He has little control over his sensory animals' actions, though they usually act in a way that is consistent with his desires unless they have a specific reason not to. When…"}, {"name": "Immortal Tricks", "type": "passive", "traits": [], "text": "When the Immortal Trickster is reduced to 0 Hit Points, he returns to life at full health and with all his powers and Mythic Points recharged after 24 hours. He usually, but not always, returns at the site of his death, though he can appear anywhere on the same world where there are coyotes, foxes, or ravens."}, {"name": "Mythic Resistance", "type": "passive", "traits": [], "text": "The Immortal Trickster has resistance 11 to all damage from attacks and spells from non-mythic creatures."}, {"name": "Bond with Mortals", "type": "action", "traits": ["mental", "primal"], "cost": 2, "text": "Frequency once per day%rEffect The Immortal Trickster forms a bond with a mortal creature. While the bond exists, the mortals bonded to the Immortal Trickster increase their current and maximum Hit Points by 10 and gain a +2 status bonus to their attack and damage rolls, as well as to skill checks they make using Deception, Stealth, or Thievery. The Immortal Trickster can communicate telepathically with any of his bonded mortals as long as both beings are on the same plane. Each week that they…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "polymorph"], "cost": 1, "text": "The Immortal Trickster takes on the appearance of a coyote, fox, or raven. In areas where another Tiny or Small animal is known for wiliness and trickery, the Immortal Trickster can assume that animal's shape instead. While transformed, the Immortal Trickster loses his innate spells, attacks, and special actions, but doesn't otherwise change his statistics and can still speak. In fox or coyote form, the Immortal Trickster's size changes to Tiny (for a fox) or Small (for a coyote), his Speed…"}, {"name": "Confounding Theft", "type": "action", "traits": ["manipulate"], "cost": 2, "text": "Cost 1 Mythic Point%rEffect The Immortal Trickster makes a Thievery check against the Perception DC of one creature he can see within 60 feet. On a success, the Trickster gains possession of any one item he chooses of up to 2 Bulk that the target is currently holding, wearing, wielding, or has stowed on their person. This must be a single item and does not include full sets of clothing like worn armor or garments."}, {"name": "Cunning Escape", "type": "action", "traits": ["concentrate", "teleportation"], "cost": 1, "text": "Frequency once per day%rEffect The Immortal Trickster trades places with one of his sensory animals (see trickster's network, above). The animal appears in the square the Trickster is currently occupying and the Trickster teleports to the animal's original location with all of his possessions. If a creature has witnessed the Trickster's Change Shape, they must succeed at a DC 38 Perception check to Sense Motive or be fooled into thinking that the Trickster has simply changed shape into an…"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The Immortal Trickster can spend a Mythic Point whenever he makes a check using Deception or Thievery to make the check at mythic proficiency."}, {"name": "Pull", "type": "action", "traits": [], "cost": 1}, {"name": "Recharge Spell", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Immortal Trickster gains an additional casting of any of his innate primal spells that he has already cast."}, {"name": "Push", "type": "action", "traits": [], "cost": 1}]
  spellcasting: [{"name": "Primal Innate Spells", "tradition": "primal", "type": "innate", "dc": 31, "attack": 0, "spells": {"0": ["Detect Magic", "Prestidigitation", "Tangle Vine"], "4": ["Creation"], "5": ["Magic Passage", "Truespeech (Constant)", "Wall of Stone"], "6": ["Cursed Metamorphosis"]}}]
