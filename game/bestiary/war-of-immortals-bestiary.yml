im receives magical healing that brings them to their Hit Point maximum."}, {"name": "Leap into the Fray", "type": "action", "traits": [], "cost": 3, "text": "Verex-That-Was Leaps up to 20 feet horizontally and up to 10 feet vertically and then makes one claw Strike, one jaws Strike, and one tail Strike in any order. If Verex-That-Was spends 1 Mythic Point as part of this action, he doubles the distances he can Leap and each creature he lands adjacent to is Off-Guard until the end of his turn."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Huge, (4d10+10) bludgeoning, Rupture 50"}, {"name": "Symphony of Pain", "type": "reaction", "traits": [], "text": "Trigger A creature within Verex-That-Was's frightful presence damages Verex-That-Was%rEffect Verex unleashes an echo of psychic pain throughout his vicinity, inflicting mental damage equal to half of the damage he sustained on all creatures, friend or foe, within 150 feet (DC 45 Fortitude save)."}]
