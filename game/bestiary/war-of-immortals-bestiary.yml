  actions: [{"name": "Artistic Specialist", "type": "passive", "traits": [], "text": "In a recital, competition, or other measure of artistic skill, a sublime breath is a 12th-level challenge."}, {"name": "Immaculate Instrument", "type": "passive", "traits": [], "text": "A sublime breath carries a single tool, prop, or instrument related to its chosen craft, such as a mask, sash, or paintbrush. As long as they possess their immaculate instrument, they treat any critical failures on Crafting or Performance checks as failures."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The sublime breath removes any one condition currently affecting them."}, {"name": "Thought Slips Away", "type": "passive", "traits": [], "text": "The sublime breath's ephemeral lightness makes them impossible to grasp. They use their Performance modifier to Escape, Tumble Through, High Jump, or Long Jump. When they Leap, High Jump, or Long Jump, the movement does not provoke reactions."}, {"name": "+2 Status to All Saves vs. Emotion", "type": "passive", "traits": []}, {"name": "Mythic Resilience", "type": "passive", "traits": [], "text": "The sublime breath treats their Will saving throws as one step better than it actually is (so a critical failure is a failure, a failure is a success, and a success is a critical success)."}, {"name": "Artistic Creation", "type": "action", "traits": ["illusion", "mental"], "cost": 1, "text": "Frequency once per round%rEffect The sublime breath's art is so real that it takes shape in the hearts of those who witness it. The sublime breath crafts, acts, recites a tale or song, or otherwise uses their art to create a work of art in a 10-foot burst within 60 feet. The creation is perceptible and tangible to creatures that don't disbelieve it and it affects them accordingly; for instance a ladder could be climbed, and a campfire would provide heat and even be able to cook food for an…"}, {"name": "Artistic Destruction", "type": "action", "traits": ["illusion", "mental"], "cost": 1, "text": "Requirements The sublime breath has either used Artistic Creation this turn or Sustained an Artistic Creation this turn%rEffect The sublime breath destroys their creations to make way for new growth. All of their currently sustained Artistic Creations detonate, dealing 8d6 untyped|options:area-damage damage to all enemy creatures either within a creation or within a 10-foot burst of it (DC 24 Will save). The damage type matches the creation. Creatures in multiple overlapping bursts take damage…"}, {"name": "Change Shape", "type": "action", "traits": ["concentrate", "divine", "polymorph"], "cost": 1, "text": "The sublime breath can take on the appearance of any Medium or Large humanoid creature. This doesn't change their Speed or their attack and damage bonuses with their Strikes, but might change the damage type their Strikes deal.%rThe sublime breath instinctively takes on the appearance an observer finds most inspiring. The first time they become observed, they use Change Shape as a free action, even if they were unaware they were being observed, they take on a specific appearance reflecting the…"}, {"name": "Hours Go By", "type": "action", "traits": ["emotion", "mental"], "cost": 1, "text": "A sublime breath's presence can allow artists and artisans to work almost effortlessly in a state of perfect flow. The sublime breath encourages a single creature within 60 feet, who becomes Quickened. They can spend the extra action only to Sustain a spell or other ability."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}]
