  actions: [{"name": "Countless Eyes", "type": "passive", "traits": ["scrying"], "text": "The Weaver of Webs can see through the eyes of any spider, living or dead, in one of her many lairs. When the Weaver casts her Scrying spell and targets a spider in her lair, the spell is not expended, and the spider automatically critically fails its saving throw."}, {"name": "Greater Web Sense", "type": "passive", "traits": [], "text": "The Weaver of Webs' tremorsense also extends to any of her webs, regardless of distance or area, and her tremorsense is a precise sense against any creature in contact with one of her webs."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Weaver removes any one condition currently affecting her."}, {"name": "Webbed Conveyance", "type": "passive", "traits": ["manipulate"], "text": "Requirements The Weaver is within 15 feet of a creature Paralyzed in her nightmare cocoon%rEffect The Weaver grabs the paralyzed target, webs them to her back or one of her legs, and then Strides. As long as the creature is Immobilized by the Weaver's nightmare cocoon, it shares the Weaver's space and moves with her. The DC to Escape the nightmare cocoon increases to 36."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Regeneration (Deactivated by Bright Light)", "type": "passive", "traits": []}, {"name": "Adopted Brood", "type": "reaction", "traits": [], "text": "Trigger A creature deals precision damage to the Weaver%rEffect A spray of smaller spiders pours out of the open wound. These spiders deal 3d6 piercing damage to a single creature within 15 feet of the Weaver and expose that creature to Weaver venom before skittering away."}, {"name": "Mythic Resistance", "type": "passive", "traits": [], "text": "The Weaver of Webs has resistance 15 to all attacks made with non-mythic weapons and unarmed attacks made by nonmythic creatures."}, {"name": "Spilled Secrets", "type": "passive", "traits": ["aura", "mental"], "text": "Any creature that speaks within this aura must succeed at a DC 34 Will save or divulge some kind of secret instead of whatever speech they intended. Linguistic spells and effects gain the concentrate trait if they didn't have it already and are wasted if the creature fails this save.%rOn a critical failure, the character betrays a secret they least want to reveal to the Weaver or those present."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Nightmare Cocoon", "type": "passive", "traits": ["incapacitation", "mental"], "text": "A creature struck by the Weaver's web Strike must succeed at a DC 34 Reflex save or become Immobilized (escape dc=34). If the Weaver spends 1 Mythic Point as a free action when a creature fails this save, the creature is also Paralyzed, experiencing terrible nightmares of their deepest-held anxieties. The Weaver can view these dreams using a Sustain action, which imparts a –2 circumstance penalty to any Will saves the target attempts against the Weaver's spells until the beginning of the…"}, {"name": "Weaver Venom", "type": "passive", "traits": ["poison"], "text": "Saving Throw DC 34%rMaximum Duration 6 rounds%rStage 1 2d10 poison (1 round)%rStage 2 2d10 poison and Slowed 1 (2 rounds)%rStage 3 3d10 poison and Slowed 2 (1 round)%rStage 4 4d10 poison (1 round) and the target permanently forgets the Weaver exists, including any previous mention of her."}]
  spellcasting: [{"name": "Occult Innate Spells", "tradition": "occult", "type": "innate", "dc": 36, "attack": 28, "spells": {"2": ["See the Unseen (At Will)"], "3": ["Dream Message", "Fear", "Mind Reading"], "4": ["Darkness (At Will)", "Invisibility", "Nightmare", "Read Omens", "Web (At Will)"], "5": ["Sending (At Will)"], "6": ["Phantasmal Calamity", "Repulsion", "Scrying", "Teleport"], "7": ["Retrocognition", "Truespeech (Constant)", "Warp Mind"], "8": ["Dream Council"]}}]
