  actions: [{"name": "Titanic Might", "type": "passive", "traits": [], "text": "A mythic brute ignores size limitations when performing actions like Grapple or Trip."}, {"name": "Mythic Ferocity", "type": "reaction", "traits": [], "text": "Cost 1 Mythic Point%rTrigger The monster is reduced to 0 HP%rEffect The monster avoids being knocked out and remains at half its maximum HP, but its wounded value increases by 1. When it is Wounded 3, it can no longer use this ability."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Bellowing Command", "type": "action", "traits": ["auditory", "emotion", "fear", "linguistic", "mental"], "cost": 1, "text": "The ogre boss issues a command to hasten their fellows. Each ogre ally who hears and understands this command becomes Quickened until the end of that ally's next turn but can use the extra action only to Step or Stride."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The Mythic Ogre Boss attempts its next Athletics skill check with a +4 bonus and is considered to have mythic proficiency for that check. This applies to one skill when this ability is gained and a second skill if the creature is 12th level or higher."}, {"name": "Sweeping Hook", "type": "reaction", "traits": [], "text": "Trigger The ogre boss successfully Trips a creature using an ogre hook%rEffect The ogre boss makes an ogre hook Strike against the creature they tripped."}]
