  actions: [{"name": "Recharge Spell", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rThe mythic lich regains one spell."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The mythic lich ends one condition affecting it."}, {"name": "+1 Status to All Saves vs. Vitality", "type": "passive", "traits": []}, {"name": "Counterspell", "type": "reaction", "traits": [], "text": "Trigger A creature casts a spell the lich has prepared.%rEffect The lich expends a prepared spell to counter the triggering creature's casting of that same spell. The lich loses its spell slot as if it had cast the triggering spell. The lich then attempts to counteract the triggering spell."}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "60 feet. DC 29 Will"}, {"name": "Mythic Resilience (Reflex and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Rejuvenation", "type": "passive", "traits": ["arcane"], "text": "When a lich is destroyed, its soul immediately transfers to their Lich Soul Cage . A lich can be permanently destroyed only if their soul cage is found and destroyed."}, {"name": "Void Healing", "type": "passive", "traits": []}, {"name": "Drain Soul Cage", "type": "free", "traits": [], "text": "6th rank%rFrequency once per day%rEffect The lich taps into their Soul Cage 's power to cast any arcane spell up to the highest rank the lich can cast, even if the spell being cast is not one of the lich's prepared spells. The lich's soul cage doesn't need to be present for the lich to use this ability."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Siphon Life", "type": "passive", "traits": [], "text": "A lich's form draws forth life from those who come into contact with it. When the lich damages a living creature with an unarmed attack, the lich gains 5 temporary Hit Points and the creature must succeed at a DC 34 Fortitude save or become Drained 1.%rIf the lich is Grabbed or Restrained at the start of its turn, each creature grabbing or restraining it must succeed at a Fortitude save or become drained 1. If the lich siphons a creature's life again, the drained value increase by 1, to a…"}, {"name": "Steady Spellcasting", "type": "passive", "traits": [], "text": "If a reaction would disrupt the lich's spellcasting action, the lich attempts a DC 15 Flat check. On a success, the action isn't disrupted."}]
