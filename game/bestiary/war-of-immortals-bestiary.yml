  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The creature ends one condition affecting it."}, {"name": "All-Around Vision", "type": "passive", "traits": []}, {"name": "Hazard Immunity", "type": "passive", "traits": [], "text": "A mythic ambusher never triggers the reactions of hazards in its own lair and is immune to the negative consequences of damaging area effects created by hazards in its lair."}, {"name": "Mythic Resilience (Reflex and Will)", "type": "passive", "traits": [], "text": "The creature treats its saving throws with the associated save as one degree of success better than it rolled. This is not cumulative with other effects that change their degree of success, like the incapacitation trait (except for rolling a natural 1 or 20). Each time the monster gains mythic resilience, choose one save. The ability should apply to the creature's highest saves first."}, {"name": "Skittering Reposition", "type": "reaction", "traits": ["move"], "text": "Trigger A creature that starts its move outside the gogiteth's reach moves into its reach.%rEffect The gogiteth moves 10 feet. This does not trigger reactions."}, {"name": "Carry Off Prey", "type": "passive", "traits": [], "text": "The gogiteth can move at its full Speed while it has a creature Grabbed in its jaws, bringing the grabbed creature along."}, {"name": "Constrict", "type": "action", "traits": [], "cost": 1, "text": "(3d6+12) bludgeoning, DC 32 Fortitude"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The Mythic Gogiteth attempts its next Athletics or Stealth skill check with a +4 bonus and is considered to have mythic proficiency for that check."}, {"name": "Skittering Assault", "type": "action", "traits": [], "cost": 2, "text": "The gogiteth Strides three times. Once per Stride, it can attempt a leg Strike against a creature in its reach at any point during the Stride; it must make each attack against a different creature, but it doesn't apply its multiple attack penalty until after making all its Strikes. If any of the Strikes result in a critical failure, Skittering Assault ends."}, {"name": "Improved Grab", "type": "free", "traits": []}]
