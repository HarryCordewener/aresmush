  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Oliphaunt of Jandelay removes any one condition currently affecting it."}, {"name": "Regeneration", "type": "passive", "traits": []}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "300 feet. DC 46 Will"}, {"name": "Legendary Vigor", "type": "passive", "traits": [], "text": "The Oliphaunt of Jandelay is immune to penalties to its Speeds, and it ignores difficult terrain and greater difficult terrain."}, {"name": "Mythic Immunity", "type": "passive", "traits": [], "text": "The Oliphaunt of Jandelay is immune to harmful spells cast by non-mythic creatures, Strikes made with non-mythic weapons, and unarmed Strikes from nonmythic characters."}, {"name": "Mythic Resilience", "type": "passive", "traits": [], "text": "The Oliphaunt treats its saving throws with the associated save as one step better than they actually are (so a critical failure is a failure, a failure is a success, and a success is a critical success). The first time each round that a character rolls a critical hit against the Oliphaunt, they must reroll the attack roll and take the new result."}, {"name": "Reactive", "type": "passive", "traits": [], "text": "The Oliphaunt of Jandelay gains 3 reactions each round. It can still use only one reaction per trigger."}, {"name": "Reactive Strike", "type": "reaction", "traits": []}, {"name": "Undying Myth", "type": "free", "traits": [], "text": "Cost all the creature's Mythic Points%rTrigger The creature would die and has at least 1 Mythic Point%rEffect When the Oliphaunt of Jandelay would die, as long as it has at least 1 Mythic Point, it immediately expends all remaining Mythic Points it has, remains standing and conscious, and recovers 50% of its maximum Hit Points."}, {"name": "Brutal Drag", "type": "passive", "traits": [], "text": "When the Oliphaunt takes a Stride action, any creature Grabbed by the Oliphaunt of Jandelay's tusk is moved along with it to a location within 20 feet of the Oliphaunt's ending location. They remain grabbed and the GM determines which square they end up in."}, {"name": "Destructive Frenzy", "type": "action", "traits": [], "cost": 3, "text": "The Oliphaunt of Jandelay makes two tusk Strikes, two foot Strikes, and one trunk Strike in any order."}, {"name": "Devastating Launch", "type": "action", "traits": [], "cost": 2, "text": "Cost 1 Mythic Point%rEffect The Oliphaunt of Jandelay buries its tusks into the ground in a 15-foot burst centered within 20 feet of it, collecting everything in that area, including any creature currently Grabbed by its tusk attack, and flinging it all up to 120 feet away. Everything lands in a 30-foot burst, dealing 12d6 bludgeoning|options:area-damage damage to each creature in the area (DC 51 Reflex save). This damage also applies to any creatures, vehicles, or objects the Oliphaunt flung…"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Trample", "type": "action", "traits": [], "cost": 3, "text": "Huge or smaller, foot, DC 46 Reflex%rWhen the Oliphaunt of Jandelay Tramples, it can Stride up to triple its Speed, and any creature that fails or critically fails the Reflex save is knocked Prone."}, {"name": "Trumpeting Blast", "type": "action", "traits": ["sonic"], "cost": 2, "text": "The Oliphaunt of Jandelay emits a cacophonous blast from its trunk in a 120-foot cone. Each creature in the area must attempt a DC 49 Fortitude save. If the Oliphaunt spends 1 Mythic Point as part of the activity, the DC becomes 51 and the damage dice are increased to d12s. The Oliphaunt of Jandelay can't use Trumpeting Blast again for 1d4 rounds.%rCritical Success The creature is unaffected.%rSuccess The creature takes 7d10 sonic|options:area-damage damage and is Deafened for 1 round.%rFailure…"}]
