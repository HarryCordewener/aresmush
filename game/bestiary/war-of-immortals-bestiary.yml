  strikes: [{"name": "Talon", "bonus": 40, "damage": [["4d10+14", "slashing", null], ["2d8", "electricity", null]], "traits": ["agile", "magical", "reach-15", "unarmed"]}, {"name": "Jaws", "bonus": 40, "damage": [["3d12+14", "piercing", null], ["2d8", "electricity", null]], "traits": ["magical", "reach-10", "unarmed"]}, {"name": "Tail", "bonus": 40, "damage": [["4d8+14", "bludgeoning", null], ["2d6", "bleed", "persistent"]], "traits": ["deadly-d10", "magical", "reach-20"]}, {"name": "Spike", "bonus": 42, "damage": [["7d6+10", "piercing", null]], "traits": ["magical"], "range": 60}]
  actions: [{"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Agyra removes any one condition currently affecting her."}, {"name": "Stormsight", "type": "passive", "traits": [], "text": "Wind, precipitation, and clouds don't impair Agyra's vision; she ignores the Concealed condition from storms, mist, precipitation, and the like."}, {"name": "Regeneration", "type": "passive", "traits": []}, {"name": "Electrified Rebirth", "type": "passive", "traits": ["electricity", "primal"], "text": "Frequency once per year%rEffect When Agyra dies, her corpse crackles and sparks with electrical energy. Any creature that touches Agyra's body within 1 hour of her death takes 11d6 electricity damage (DC 43 Reflex save). After being dead for 1 minute, Agyra is immediately resurrected in the same place, at full health, with all abilities fully restored. She normally takes advantage of this rebirth to flee to safety, using Thunderous Departure to retreat. If Agyra has already died and been reborn…"}, {"name": "Mythic Immunity", "type": "passive", "traits": [], "text": "Strikes%rThe creature is immune to either harmful spells cast by non-mythic creatures, or Strikes made with non-mythic weapons and unarmed Strikes from non-mythic characters. Only the most powerful creatures (typically level 25) should be immune to both."}, {"name": "Mythic Resilience", "type": "passive", "traits": [], "text": "Agyra treats her saving throws with Fortitude and Reflex saves as one step better than they actually are (so a critical failure is a failure, a failure is a success, and a success is a critical success). Whenever a character rolls a critical hit against Agyra, they must reroll the attack roll and take the new result."}, {"name": "Blinding Flash", "type": "action", "traits": ["light", "manipulate", "primal", "visual"], "cost": 3, "text": "Cost 1 Mythic Point%rEffect By spreading her wings while she stands upon the ground, Agyra can create a blinding flash of light that targets all creatures within 100 feet. Affected creatures must succeed at a DC 43 Fortitude check.%rCritical Success The target is unaffected.%rSuccess The target is Dazzled and Stupefied 1 for 1d4 rounds.%rFailure The target is Blinded and Stupefied 2 for 1 minute.%rCritical Failure The target is blinded and stupefied 2 for 10 minutes."}, {"name": "Conjure Hurricane", "type": "action", "traits": ["air", "manipulate", "primal"], "cost": 3, "text": "Frequency once per day%rCost 1 Mythic Point%rEffect Agyra generates a hurricane that spreads across a 4-mile radius and lasts 24 hours, with a 500-foot calm eye of the storm at its center. Agyra is at the center of this hurricane when it is formed, but it moves normally (according to surrounding weather conditions and the GM's discretion) afterward."}, {"name": "Lightning Breath", "type": "action", "traits": ["electricity", "primal"], "cost": 2, "text": "Agyra exhales a line of electricity from each of her two heads. Each line is 120 feet long and 10 feet wide, and the two lines may be pointed in different directions. A creature in a line takes 22d6 electricity|options:area-damage damage (DC 44 Reflex save). On a failed save, the target is also Slowed 1 for 1d4 rounds. A creature can be affected only once by a line, even if they are in an overlapping area. A character slain by Agyra's Lightning Breath remains electrified for 2d4 rounds after…"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Recharge Ability", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Agyra gains an additional use of lightning breath."}, {"name": "Stormflight", "type": "passive", "traits": [], "text": "Agyra can move in strong winds with ease. She doesn't treat wind as difficult terrain or need to Maneuver in Flight in high winds."}, {"name": "Thunderous Departure", "type": "passive", "traits": ["primal", "sonic"], "text": "Frequency once per day%rEffect Agyra Flies in a straight line at incredible speed, moving at least 120 feet but up to 1 mile. This movement doesn't provoke reactions. Her departure leaves behind a thunderous sonic boom, creating a 100-foot burst centered on her point of departure. All creatures in the area take 15d10 sonic|options:area-damage damage (DC 46 Fortitude save). A creature who fails is also knocked Prone, and a creature who critically fails is knocked prone and Deafened permanently."}]
"Immortal Trickster":
  pack: "war-of-immortals-bestiary"
  level: 11
  size: "medium"
  rarity: "unique"
  traits: ["beast", "humanoid", "mythic", "spirit"]
  ac: 31
