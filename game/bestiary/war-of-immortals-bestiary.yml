  actions: [{"name": "Absolute Surety", "type": "passive", "traits": [], "text": "Vulot is dependent on deception and charm to achieve their goals. If Vulot fails to deceive someone, for example failing the Deception check associated with a mislead spell to convince an observer that an action came from the duplicate, Vulot takes 4d6 mental damage. This damage ignores Vulot's usual immunity."}, {"name": "Many Eyes in Many Places", "type": "passive", "traits": [], "text": "Vulot can extend their senses through any cultist wearing one of their stolen identities as long as the cultist is in the Universe or the Outer Rifts. Vulot can't maintain their attention through more than three cultists at one time. Vulot can't speak through these cultists."}, {"name": "Recharge Spell", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rVulot gains an additional use of any of their innate spells."}, {"name": "Remove a Condition", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Cost 1 Mythic Point%rEffect Vulot removes any one condition currently affecting them."}, {"name": "Another Face", "type": "passive", "traits": [], "text": "When Vulot is reduced to 0 Hit Points, they regenerate themself from a stolen identity of their choice in 24 hours. If Vulot has no stolen identities remaining or is otherwise unable to reach them, they are killed permanently."}, {"name": "Mythic Immunity", "type": "passive", "traits": [], "text": "Vulot is immune to harmful spells cast by non-mythic creatures, Strikes made with non-mythic weapons, and unarmed Strikes from non-mythic characters."}, {"name": "Perfect Mimicry", "type": "reaction", "traits": ["magical", "visual"], "text": "Trigger A spell is cast within 60 feet of Vulot%rEffect Vulot copies the spell and may cast it once by spending a Mythic Point within the next 24 hours. Vulot can't hold more than two copied spells at one time."}, {"name": "Suffocated by a Thousand Breaths", "type": "passive", "traits": ["aura", "incapacitation"], "text": "30 feet. Vulot's breath-stealing influence radiates out from their body, causing victims to feel like they are being smothered. Any creature that starts its turn within the aura must attempt a DC 41 Fortitude save.%rCritical Success The creature is unaffected.%rSuccess The creature becomes short of breath and is Off-Guard until the beginning of its next turn.%rFailure The creature finds it very difficult to catch its breath. It can't speak or use auditory actions until the beginning of its next…"}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The creature has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Steal Face", "type": "action", "traits": [], "cost": 2, "text": "Cost 1 Mythic Point%rEffect Vulot makes a claw Strike. On a hit, Vulot attempts a Deception check against the target's Will DC to steal that creature's face; on a critical hit, Vulot treats the result of their Deception check as one degree of success higher. On a success, Vulot steals the target's face for 1d4 rounds (1 minute on a critical success); a creature whose face has been stolen isn't considered an ally by any creature."}, {"name": "Steal Thoughts", "type": "passive", "traits": ["emotion", "mental"], "text": "Vulot's mental attacks can confuse and disorient. A creature struck by Vulot's thought spike must attempt a DC 44 Will save. A creature stupefied by this effect is Off-Guard to Vulot's Steal Face ability.%rCritical Success The creature is unaffected.%rSuccess The creature becomes Stupefied 1 for 1 round.%rFailure The creature becomes stupefied 1 for 1 minute. If it's already stupefied, its stupefied value increases by 1 instead (to a maximum of stupefied 4).%rCritical Failure As failure, plus…"}]
