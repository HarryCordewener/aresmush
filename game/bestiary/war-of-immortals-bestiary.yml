  actions: [{"name": "Deadly Striker", "type": "passive", "traits": [], "text": "A mythic striker deals an additional 1d6 precision damage on its next Strike whenever it uses an action to Stride 10 or more feet (or to Burrow, Climb, or Fly 10 or more feet)."}, {"name": "Flying Strafe", "type": "action", "traits": [], "cost": 2, "text": "The griffon Flies up to its fly Speed and makes two talon Strikes at any point during that movement. Each Strike must target a different creature. The attacks take the normal multiple attack penalty."}, {"name": "Mythic Power", "type": "passive", "traits": [], "text": "The Mythic Griffon has a pool of 3 Mythic Points, and can spend those Mythic Points for any of the actions it has."}, {"name": "Mythic Skill", "type": "free", "traits": [], "text": "Cost 1 Mythic Point%rEffect The Mythic Griffon attempts its next Acrobatics skill check with a +4 bonus and is considered to have mythic proficiency for that check."}, {"name": "Pounce", "type": "action", "traits": [], "cost": 1, "text": "The griffon Strides and makes a talon Strike at the end of that movement. If the griffon began this action Hidden, it remains hidden until after the attack."}, {"name": "Regal Shriek", "type": "action", "traits": ["auditory", "emotion", "fear", "mental"], "cost": 1, "text": "The griffon unleashes a shriek that transitions into a terrifying roar. Each creature in a 60-foot must attempt a DC 20 Will save. Regardless of the result, creatures are temporarily immune to all griffons' Regal Shrieks for 10 minutes.%rCritical Success The creature is unaffected.%rSuccess The creature is Frightened 1.%rFailure The creature is Frightened 2. Animals are Slowed 1 for as long as they're frightened.%rCritical Failure The creature is Frightened 3. Animals are Paralyzed as long as…"}, {"name": "Unimpeded", "type": "action", "traits": [], "cost": 1, "text": "Cost 1 Mythic Point%rEffect The Mythic Griffon automatically ends one effect that would give it a circumstance penalty to Speed. When it attempts to Escape an effect that has it Immobilized, Grabbed, or Restrained, it automatically succeeds."}]
