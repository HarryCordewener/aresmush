  actions: [{"name": "Personality Fragments", "type": "passive", "traits": [], "text": "A soulbound guardian shares fragments of its donor soul's personality, though none of that creature's memories. This causes a soulbound guardian to match a strong personality trait of its donor soul. Because of its soul sliver, a soulbound guardian is not immune to spirit as most constructs are."}, {"name": "Mannequin", "type": "action", "traits": ["concentrate"], "cost": 1, "text": "Until the next time it acts, the soulbound guardian appears to be a harmless mannequin. It has an automatic result of 30 on Deception checks and DCs to pass as a mannequin."}, {"name": "Splitsoul", "type": "action", "traits": ["concentrate", "manipulate"], "cost": 3, "text": "Frequency once per day%rEffect The soulbound guardian lends some of the energy animating it to other inanimate objects in the area. Three Small items or pieces of furniture within 60 feet come to life for 1 minute. These objects have the minion trait, though all the objects can act when the soulbound guardian uses a single action to issue them commands. The soulbound guardian can also issue commands to each object as part of using this ability.%rEach object animated in this way has a Speed of…"}]
