  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": []}, {"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"]}, {"name": "Constant Spells", "type": "passive", "traits": []}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": []}, {"name": "Ward Contract", "type": "passive", "traits": [], "text": "A signed contract carried by a living contract devil (including draped over its horns) is immune to damage from all creatures other than that contract devil. A contract devil is immune to mental effects that would make it destroy, nullify, or alter a contract."}, {"name": "Draft Contract", "type": "action", "traits": ["divine", "manipulate"], "cost": 3, "text": "The contract devil produces an infernal contract for a single living mortal. This contract can grant a wide range of abilities and effects, akin to the power of a Wish ritual but fulfilled to the letter by the contract devil. To receive any of those benefits, the mortal must willingly sign its true name to the contract. At that point, the mortal's soul is bound to the contract devil and Hell.%rWhile the contract is in effect, the victim can't be restored to life except by wish or similar magic.…"}, {"name": "Infernal Investment", "type": "passive", "traits": [], "text": "A contract devil can cast a 10th-rank innate Scrying spell at will, but only to target a creature with which they have a contract.%rThe target automatically critically fails its save."}, {"name": "Infernal Wound", "type": "passive", "traits": ["divine"], "text": "The wounds from a contract devil's Strikes resist healing.%rA spellcaster or item attempting to use healing magic on a creature suffering first attempts to counteract infernal wound (DC 29). If it is not counteracted, the healing has no effect."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1}]
