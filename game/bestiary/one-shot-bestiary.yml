  actions: [{"name": "Tremorsense (Imprecise) 90 feet", "type": "passive", "traits": [], "text": "Tremorsense allows a monster to feel the vibrations through a solid surface caused by movement. It is an imprecise sense with a limited range (listed in the ability). Tremorsense functions only if the monster is on the same surface as the subject, and only if the subject is moving along (or burrowing through) the surface."}, {"name": "+2 Status to All Saves vs. Primal", "type": "passive", "traits": [], "rules": [{"key": "FlatModifier", "selector": "saving-throw", "type": "status", "value": 2, "predicate": ["item:trait:primal"]}]}, {"name": "Abandon Armor", "type": "passive", "traits": [], "text": "Once Zikritrax is reduced to fewer than half his Hit Points, his resistance is reduced by 10 and he gains a +10 circumstance bonus to his Speeds.", "rules": [{"key": "Resistance", "exceptions": ["adamantine"], "type": "physical", "value": 15, "predicate": [{"gte": ["hp-percent", 50]}]}, {"key": "Resistance", "exceptions": ["adamantine"], "type": "physical", "value": 5, "predicate": [{"lt": ["hp-percent", 50]}]}]}, {"name": "Frightful Presence", "type": "passive", "traits": ["aura", "emotion", "fear", "mental"], "text": "90 feet. DC 30 Will%rA creature that first enters the area must attempt a Will save.%rRegardless of the result of the saving throw, the creature is temporarily immune to this monster's Frightful Presence for 1 minute.%rCritical Success The creature is unaffected by the presence.%rSuccess The creature is Frightened 1.%rFailure The creature is Frightened 2.%rCritical Failure The creature is Frightened 4.", "rules": [{"key": "Aura", "radius": 90, "traits": ["emotion", "fear", "mental"], "slug": "frightful-presence"}]}, {"name": "Resilient Form", "type": "reaction", "traits": [], "text": "Trigger Zikritrax is critically hit with a weapon or unarmed attack%rEffect The dragon's tough scales ward off deadly attacks. The dragon attempts a DC 17 Flat. On a success, the triggering attack becomes a normal hit."}, {"name": "Adamantine Body", "type": "passive", "traits": [], "text": "The dragon's unarmed melee Strikes are adamantine."}, {"name": "Avalanche Breath", "type": "action", "traits": ["primal"], "cost": 2, "text": "Zikritrax belches a mass of boulders that deals 11d8 bludgeoning damage in a 40-foot cone (DC 33 basic Reflex save). He can't use Avalanche Breath again for 1d4 rounds."}, {"name": "Burrowing Pounce", "type": "action", "traits": [], "cost": 3, "text": "Requirements Zikritrax is burrowed%rEffect Zikritrax Burrows, then Leaps out of the ground, landing at a point within 25 feet. Zikritrax makes a melee Strike against a creature within reach when he lands. If the Strike is a critical hit, the target is knocked Prone."}, {"name": "Draconic Frenzy", "type": "action", "traits": [], "cost": 2, "text": "Zikritrax makes two claw Strikes and one tail Strike in any order."}, {"name": "Draconic Momentum", "type": "passive", "traits": [], "text": "Zikritrax recharges his Avalanche Breath whenever he scores a critical hit with a Strike.", "rules": [{"key": "Note", "selector": "strike-attack-roll", "outcome": ["criticalSuccess"], "title": "{item|name}", "text": "{item|description}"}]}, {"name": "Rock Tunneler", "type": "passive", "traits": [], "text": "Zikritrax can burrow through solid stone at a Speed of 20 feet. He can leave a tunnel if he desires, but he usually doesn't."}, {"name": "Swallow Whole", "type": "action", "traits": ["attack"], "cost": 1, "text": "Large, (3d12+7) bludgeoning, Rupture 29%rThe monster attempts to swallow a creature of the listed size or smaller that it has grabbed or restrained in its jaws or mouth. If a swallowed creature is of the maximum size listed, the monster can't use Swallow Whole again. If the creature is smaller than the maximum, the monster can usually swallow more creatures; the GM determines the maximum. The monster attempts an Athletics check opposed by the grabbed creature's Reflex DC. If it succeeds, it…"}, {"name": "Throw Rock", "type": "action", "traits": [], "cost": 1, "text": "The monster picks up a rock within reach or retrieves a stowed rock and throws it, making a ranged Strike."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1, "text": "Requirements The monster's last action was a successful Strike that lists Grab in its damage entry, or the monster has a creature Grabbed or Restrained%rEffect If used after a Strike, the monster attempts to grapple the creature using the body part it attacked with. This attempt neither applies nor counts toward the creature's multiple attack penalty.%rThe monster can instead use Grab and choose one creature it's grabbing or restraining with an appendage that has Grab to automatically extend…"}, {"name": "Knockdown", "type": "action", "traits": [], "cost": 1, "text": "Requirements The monster's last action was a successful Strike that lists Knockdown in its damage entry%rEffect The monster attempts to trip the creature. This attempt neither applies nor counts toward the monster's multiple attack penalty."}]
