  actions: [{"name": "Greater Darkvision", "type": "passive", "traits": [], "text": "A creature with greater darkvision can see perfectly well in areas of darkness and dim light, though such vision is in black and white only. A creature with greater darkvision can see through even forms of magical darkness."}, {"name": "Telepathy 100 feet", "type": "passive", "traits": ["aura", "magical", "mental"], "text": "A monster with telepathy can communicate mentally with any creatures within the listed radius, as long as they share a language. This doesn't give any special access to their thoughts, and communicates no more information than normal speech would."}, {"name": "Constant Spells", "type": "passive", "traits": [], "text": "A constant spell affects the monster without the monster needing to cast it, and its duration is unlimited. If a constant spell gets counteracted, the monster can reactivate it by spending the normal spellcasting actions the spell requires."}, {"name": "+1 Status to All Saves vs. Magic", "type": "passive", "traits": [], "rules": [{"key": "FlatModifier", "selector": "saving-throw", "type": "status", "value": 1, "predicate": ["item:magical"]}]}, {"name": "Ward Contract", "type": "passive", "traits": [], "text": "A signed contract carried by a living contract devil (including draped over its horns) is immune to damage from all creatures other than that contract devil. A contract devil is immune to mental effects that would make it destroy, nullify, or alter a contract.", "rules": [{"key": "Immunity", "definition": ["ward contract"], "type": "custom"}]}, {"name": "Draft Contract", "type": "action", "traits": ["divine", "manipulate"], "cost": 3, "text": "The contract devil produces an infernal contract for a single living mortal. This contract can grant a wide range of abilities and effects, akin to the power of a Wish ritual but fulfilled to the letter by the contract devil. To receive any of those benefits, the mortal must willingly sign its true name to the contract. At that point, the mortal's soul is bound to the contract devil and Hell.%rWhile the contract is in effect, the victim can't be restored to life except by wish or similar magic.…"}, {"name": "Infernal Investment", "type": "passive", "traits": [], "text": "A contract devil can cast a 10th-rank innate Scrying spell at will, but only to target a creature with which they have a contract.%rThe target automatically critically fails its save."}, {"name": "Infernal Wound", "type": "passive", "traits": ["divine"], "text": "The wounds from a contract devil's Strikes resist healing.%rA spellcaster or item attempting to use healing magic on a creature suffering first attempts to counteract infernal wound (DC 29). If it is not counteracted, the healing has no effect."}, {"name": "Grab", "type": "action", "traits": [], "cost": 1, "text": "Requirements The monster's last action was a successful Strike that lists Grab in its damage entry, or the monster has a creature Grabbed or Restrained%rEffect If used after a Strike, the monster attempts to grapple the creature using the body part it attacked with. This attempt neither applies nor counts toward the creature's multiple attack penalty.%rThe monster can instead use Grab and choose one creature it's grabbing or restraining with an appendage that has Grab to automatically extend…"}]
  spellcasting: [{"name": "Divine Innate Spells", "tradition": "divine", "type": "innate", "dc": 31, "attack": 23, "spells": {"0": ["Detect Magic"], "3": ["Mind Reading (At Will)"], "4": ["Peaceful Bubble", "Silence", "Translocate (At Will)"], "5": ["Fireball", "Illusory Scene", "Lightning Bolt", "Locate (At Will)", "Mind Probe", "Sending (At Will)", "Translocate", "Truespeech (Constant)"], "7": ["Interplanar Teleport"], "10": ["Scrying (At Will, See Infernal Investment)"]}}]
