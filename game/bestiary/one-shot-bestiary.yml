  actions: [{"name": "Broken Armor", "type": "passive", "traits": [], "text": "When an armored cave bear is reduced to half its Hit Points or less or it's hit with a critical hit from an adamantine weapon, it loses its physical resistance.", "rules": [{"key": "RollOption", "option": "broken-armor", "toggleable": true}, {"key": "Resistance", "exceptions": ["adamantine"], "type": "physical", "value": 6, "predicate": [{"not": "broken-armor"}]}]}, {"name": "Armored Charge", "type": "action", "traits": [], "cost": 3, "text": "The armored cave bear Strides up to its Speed in a straight line, slamming its armored skull into every creature whose space it moves into. Each creature in this line of movement must attempt a DC 26 Fortitude save. The armored cave bear can't use Armored Charge again for 1d4 rounds.%rCritical Success The creature takes no damage and stops the armored cave bear's movement.%rSuccess The creature takes no damage.%rFailure The creature takes 4d8 bludgeoning damage.%rCritical Failure The creature…"}, {"name": "Mauler", "type": "passive", "traits": [], "text": "The armored cave bear gains a +4 circumstance bonus to damage rolls against creatures it has Grabbed.", "rules": [{"key": "RollOption", "option": "mauler", "domain": "damage", "toggleable": true}, {"key": "FlatModifier", "selector": "strike-damage", "type": "circumstance", "value": 4, "predicate": ["mauler"]}]}, {"name": "Rush", "type": "action", "traits": [], "cost": 2, "text": "The armored cave bear Strides with a +10-foot circumstance bonus to its Speed and makes a Strike at the end of that movement.", "rules": [{"key": "RollOption", "option": "rush", "toggleable": true}, {"key": "FlatModifier", "selector": "land-speed", "type": "circumstance", "value": 10, "predicate": ["rush"]}]}]
